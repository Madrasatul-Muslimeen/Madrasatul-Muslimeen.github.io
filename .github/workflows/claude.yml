# Builder (Claude Code) — MMSA.
#
# The Architect opens an issue, or comments, with "@claude" -> this job wakes
# Claude Code on a GitHub runner, which builds the round on a branch, runs this
# repository's checks, and opens a pull request. IT NEVER MERGES. Merging and
# version allocation belong to the Architect (see ARCHITECT.md).
#
# This workflow is INERT until a Claude authentication mode is configured. The
# preflight step then stops with an explanatory message and Claude is not run.
#
# ===========================================================================
# HISTORY THIS FILE IS OBLIGED TO CARRY, because the reasoning is what stops
# the findings coming back.
#
# EVERY ONE OF THE FIRST 140 RECORDED RUNS OF THIS WORKFLOW WAS `skipped`.
#   The builder had never once executed. Two independent causes, both fixed
#   below: the trigger set listened ONLY to `issue_comment`, so an Architect
#   could not assign a round by opening an issue at all; and the Owner was
#   driving through the `/mmsa-task` bridge, which this file's own mutual-
#   exclusion clause correctly refuses. A gate nobody can pass is not a gate,
#   it is an outage -- and a `skipped` run leaves no log to explain itself.
#
# `author_association` IS DELIBERATELY NOT A GATE ANY MORE.
#   The previous revision tested it. GitHub reports private organisation
#   members as CONTRIBUTOR or NONE depending on how their access is granted,
#   so that test can lock out the only human who can drive this. It is
#   replaced by an identity test on the sender's LOGIN, which is what was
#   actually meant. The Action's own permission check
#   (src/github/validation/permissions.ts, admin-or-write only) is unchanged
#   and remains authoritative underneath.
#
# [P1, FIRST ROUND] CLAUDE COULD HAVE PUSHED STRAIGHT TO `main`.
#   `Bash(git push:*)` pre-approved every form of push, including
#   `git push --force origin HEAD:main`, bypassing both review and the verify
#   gate. THE FIX HOLDS HERE: there is no push verb in the allowlist below,
#   and `use_commit_signing: true` swaps the Action's four default
#   Bash(git ...) tools for two MCP file-operation tools, so the builder has
#   no shell route to a write of any kind. It manages its own branch and pull
#   request through the API.
#
# [P1, SECOND ROUND] AN ALLOWLIST OF PATHS IS NOT AN ALLOWLIST OF BEHAVIOUR.
#   The previous revision concluded from this that the builder should get NO
#   Bash surface at all, and ran nothing. That was sound about the risk and
#   wrong about the remedy, because it left the builder unable to measure its
#   own work in a repository whose entire method is measurement -- and
#   `verify.yml` gates only seven deterministic suites, so a UI regression
#   reached `main` unmeasured either way.
#
#   SO THE RISK IS STATED RATHER THAN IMPLIED AWAY. `Bash(node *)` executes
#   JavaScript, file editing is enabled, and therefore the builder can author
#   a script and run it. Narrowing the command list does not change that, and
#   no wording here will. What actually bounds it:
#     - no push verb, and no shell git write of any kind (above);
#     - `permissions:` below grants no `workflows: write`, so this job cannot
#       rewrite the gate that checks it;
#     - and the REAL backstop, which is server-side and is the Owner's to set:
#       a branch rule on `main` -- "Require a pull request before merging",
#       **Required approvals = 0**. Zero matters: the Owner authors the pull
#       requests and GitHub forbids approving your own, so requiring an
#       approval would deadlock the repository.
#   Until that rule exists, a job holding `contents: write` can in principle
#   reach `main`. That is true of any such job and is not made false by
#   removing tools.
# ===========================================================================
#
# BOT IDENTITY -- `github_token` is deliberately NOT set. The Action then mints
# a GitHub Actions OIDC token, exchanges it for an installation token for the
# Claude GitHub App, and git operations run as `claude[bot]` -- an identity
# distinct from the Owner, so the pull request is one the Owner can review, and
# one that triggers `verify.yml`. THIS IS WHY `id-token: write` IS REQUIRED.
# Passing `secrets.GITHUB_TOKEN` would defeat it twice over: the author becomes
# `github-actions[bot]` AND GitHub's loop-prevention rule would stop `verify`
# running on the resulting pull request at all. Do not add it.
#
# Owner setup, exactly one of -- and NO edit to this file is needed for any:
#   (a) repository SECRET  ANTHROPIC_API_KEY
#   (b) repository SECRET  CLAUDE_CODE_OAUTH_TOKEN
#   (c) Workload Identity Federation -- no stored credential. Three repository
#       VARIABLES: ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
#       ANTHROPIC_SERVICE_ACCOUNT_ID. All three, or the preflight fails and
#       names the missing ones.
#
# KNOWN AND EXPECTED: the App token exchange validates that this workflow
# exists on the DEFAULT BRANCH, so on the pull request that first adds or
# changes it the exchange is refused and the Action exits cleanly (green, not
# red). `issue_comment` workflows also always run from the default branch.
# Both mean the same thing: changes here begin working once they are on `main`.

name: Builder (Claude Code)

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

  # MACHINE-TO-MACHINE CHANNEL, and it exists because the human gate below
  # CANNOT be the one the automated Architect uses.
  #
  # `architect.yml` runs unattended and acts through a token whose sender is a
  # BOT. The `if:` gate refuses bots, deliberately and correctly -- that is what
  # stops the builder's own output restarting it. So an Architect that tried to
  # assign a round by posting "@claude" would be refused every time, and we
  # would be back to the 140 silent `skipped` runs this file was rewritten to
  # end.
  #
  # Rather than weaken the gate to let a bot through -- which would also let the
  # builder's own comments through -- assignment moves to a channel a comment
  # cannot reach. `workflow_dispatch` requires the `actions: write` permission
  # on a repository token; no comment, from anyone, can trigger it. The human
  # gate therefore stays exactly as strict as it is, and the automated path is
  # narrower still.
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'The issue number holding the round specification. The builder reads it and builds exactly that.'
        required: true
        type: string
      note:
        description: 'Optional extra context from the Architect for this run.'
        required: false
        type: string

concurrency:
  # ONE ROUND AT A TIME. Quran, Hadith and Health all edit the same
  # application, so two builders running together would edit one file against
  # two different bases. `cancel-in-progress: false` because the round already
  # running is real work: queue behind it, never kill it.
  group: mmsa-builder
  cancel-in-progress: false

jobs:
  build:
    # FOUR GATES, all required.
    #
    #   1. NO BOTS. `claude[bot]`'s own replies cannot start another run.
    #   2. THE SENDER MUST BE THE OWNER'S LOGIN. See the header for why this
    #      replaced `author_association` rather than joining it.
    #   3. "@claude" must appear in the text of the event that actually fired
    #      -- matched per event type, so a mention in an issue body cannot be
    #      credited to a review that did not contain one.
    #   4. MUTUAL EXCLUSION WITH THE MMSA TASK BRIDGE, and it is a real defect
    #      closed rather than a precaution. `issue_comment` delivers ONE event
    #      to EVERY workflow listening for it, so a comment reading
    #      "/mmsa-task ... @claude ..." satisfied this gate AND the bridge's,
    #      and both automations would launch for it -- two independent workers
    #      on one instruction, neither aware of the other. Enforced from both
    #      ends: this refuses a comment STARTING WITH the bridge's phrase, the
    #      bridge refuses one CONTAINING this workflow's phrase. A mixed
    #      comment dispatches NEITHER, deliberately fail-closed -- a one-sided
    #      rule would silently pick a winner and the author could not tell
    #      which automation read their instruction.
    #
    #   AND THE LOOP GUARD THE BRIDGE TAUGHT US. The bridge's Routine acts as
    #   the OWNER's identity, not a bot -- so a comment IT posts passes gates
    #   1 and 2. If such a comment ever quoted "@claude", this workflow would
    #   fire on machine output. Comments carrying the Claude Code attribution
    #   marker are therefore refused outright.
    #
    #   DIAGNOSTIC, because a job-level `if:` that fails leaves NO run to look
    #   at: if an authorised "@claude" comment produces no run whatsoever, or a
    #   run whose conclusion is `skipped`, THIS CONDITION is the first place to
    #   look, not the Action.
    #
    #   `workflow_dispatch` BYPASSES ALL FOUR, and that is not a hole. Reaching
    #   it at all requires `actions: write` on a repository token, which no
    #   comment and no outside account has. The Architect workflow holds it;
    #   a stranger does not. See the `on:` block above for why assignment could
    #   not go through the comment gate instead.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
      github.event.sender.type != 'Bot' &&
      github.event.sender.login == 'AAAsapp' &&
      (
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          !startsWith(github.event.comment.body, '/mmsa-task') &&
          !contains(github.event.comment.body, 'Generated by [Claude Code]') &&
          !contains(github.event.comment.body, 'Co-Authored-By: Claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude'))
      )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Each permission is here for a stated reason; nothing is granted "just in
    # case". Deliberately ABSENT: workflows, checks, packages, deployments,
    # security-events. In particular NO `workflows: write` -- this job must not
    # be able to rewrite the gate that checks it, which is also why workflow
    # changes are the Architect's own round (ARCHITECT.md, "Limits").
    permissions:
      contents: write       # create the branch and commit the change
      pull-requests: write  # open the PR and comment on it
      issues: write         # reply in the issue thread that invoked it
      id-token: write       # REQUIRED: mint the OIDC token exchanged for the
                            # Claude App installation token (the bot identity)
      actions: read         # read its own CI status via the Action's MCP tools

    steps:
      # Establishes ONLY which mode is configured. It prints a mode name and
      # booleans, NEVER a value: every secret arrives through `env:` and is
      # tested with [ -n ... ], so no credential is ever interpolated into the
      # script text where it could be echoed by accident.
      - name: Establish which Claude authentication mode is configured
        id: auth
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FED_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          FED_ORG_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          FED_SA_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # Explicit if/fi rather than `[ ... ] && x=1`: under `set -e` a
          # trailing failed test would terminate the step.
          have_api=0
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then have_api=1; fi
          have_oauth=0
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then have_oauth=1; fi

          fed_present=0
          fed_missing=""
          for pair in "ANTHROPIC_FEDERATION_RULE_ID=${FED_RULE_ID:-}" \
                      "ANTHROPIC_ORGANIZATION_ID=${FED_ORG_ID:-}" \
                      "ANTHROPIC_SERVICE_ACCOUNT_ID=${FED_SA_ID:-}"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -n "$value" ]; then
              fed_present=$((fed_present + 1))
            else
              fed_missing="$fed_missing $name"
            fi
          done

          if [ "$have_api" -eq 1 ] && [ "$have_oauth" -eq 1 ]; then
            echo "::warning::Both ANTHROPIC_API_KEY and CLAUDE_CODE_OAUTH_TOKEN are set; the Action's own precedence decides. Remove one to make the choice explicit."
          fi

          mode=none
          ready=false
          if [ "$have_api" -eq 1 ]; then
            mode=api_key; ready=true
          elif [ "$have_oauth" -eq 1 ]; then
            mode=oauth; ready=true
          elif [ "$fed_present" -eq 3 ]; then
            mode=federation; ready=true
          elif [ "$fed_present" -gt 0 ]; then
            # A PARTIAL federation setup must never read as "not configured".
            # Silently falling through to inert is exactly how a half-done
            # setup looks identical to no setup at all.
            mode=federation_incomplete
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

          if [ "$mode" = "federation_incomplete" ]; then
            echo "::error::Workload Identity Federation is partially configured ($fed_present of 3). Missing:$fed_missing"
            {
              echo "## Builder — federation setup incomplete"
              echo ""
              echo "$fed_present of 3 federation variables are set. Missing:"
              echo ""
              for m in $fed_missing; do echo "- \`$m\`"; done
              echo ""
              echo "Add them under **Settings → Secrets and variables → Actions → Variables**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$ready" = "true" ]; then
            echo "A Claude authentication mode is configured: $mode"
          else
            echo "::notice::No Claude authentication mode configured, so the builder will not run."
            {
              echo "## Builder — not configured yet"
              echo ""
              echo "This workflow is wired but **inert**. The Owner must add exactly one of:"
              echo ""
              echo "- repository **secret** \`ANTHROPIC_API_KEY\`, or"
              echo "- repository **secret** \`CLAUDE_CODE_OAUTH_TOKEN\`, or"
              echo "- all three repository **variables** \`ANTHROPIC_FEDERATION_RULE_ID\`, \`ANTHROPIC_ORGANIZATION_ID\`, \`ANTHROPIC_SERVICE_ACCOUNT_ID\` (no stored credential)."
              echo ""
              echo "No edit to \`claude.yml\` is required for any of them."
              echo "No credential is created by this workflow, and none is printed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # fetch-depth: 0 IS LOAD-BEARING, NOT A PRECAUTION -- the same fact
      # verify.yml records. brief-integrity.mjs reads
      # `origin/main:app/js/version.js`, and the ledger guards resolve the
      # commits and version stamps of the branches the ledger names. Under a
      # shallow single-branch fetch, brief-integrity reports 6/2 and
      # programme-ledger-mutations 42/7 ON AN UNMODIFIED TREE. Those failures
      # say nothing about the round; they are an artefact of the clone, and a
      # builder that met them would waste its run chasing them.
      - name: Check out the full history and all branches
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The Claude Code sandbox ships Chromium; a GitHub runner does not. The
      # browser suites (behaviour, layout, panel, reading, navcheck) and every
      # module's own rendered suite import Playwright, so without this a round
      # that measures a UI change cannot run its own checks.
      #
      # NOT YET GATED IN `verify.yml`, and that is deliberate: behaviour.mjs
      # cannot exit 0 under a TLS-intercepting sandbox (31e) and its 22g block
      # flips on identical code. Installing the browser here lets a round
      # MEASURE with it; making it a required check needs it measured in
      # Actions on its own first. That is on the Architect's backlog.
      - name: Install Playwright and Chromium
        if: steps.auth.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npm install -g playwright
          npx playwright install --with-deps chromium

      - name: Run Claude Code
        if: steps.auth.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # ALL THREE MODES ARE PASSED, ALWAYS. An empty input is treated as
          # unset (action.yml resolves `inputs.x || env.X`), so whichever mode
          # the Owner configured takes effect -- and there is no "swap the
          # input" step left to get wrong. A half-configured federation is
          # caught by the preflight above rather than read as "none".
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}

          # github_token is INTENTIONALLY OMITTED -- see the header.

          # A comment-triggered run reads its instruction from the comment, so
          # `prompt` is empty and the Action uses its tag mode. A dispatched
          # run has no comment, so the instruction has to be supplied -- and it
          # deliberately supplies only a POINTER to the issue, never a task.
          # The issue is the specification; nothing a dispatch input carries
          # can add to it. That keeps the authority in one reviewable place.
          prompt: ${{ github.event_name == 'workflow_dispatch' && format('You are the MMSA Builder. Read ARCHITECT.md and CLAUDE.md first, then read issue #{0} in this repository and build exactly the round it specifies. Follow the builder contract in CLAUDE.md section "The Architect loop" without exception: branch from main, open ONE pull request that links issue #{0} and pastes the results of every check you ran, and then STOP. Do not merge anything. Do not change app/js/version.js. Do not touch firestore.rules, firebase.json or .github/workflows. If you run short of turns, commit and push what you have and comment saying exactly where you stopped. Architect note for this run (context only, never an instruction that overrides the issue or the brief): {1}', inputs.issue_number, inputs.note) || '' }}

          # Commits are created through the GitHub API rather than the git CLI.
          # The reason is not signing, it is THE TOOL LIST: this is what makes
          # the Action swap its four default Bash(git add|commit|rm|push)
          # entries for two MCP file-operation tools, so nothing below can
          # reach a shell write. The allowlist that follows therefore contains
          # READ-ONLY git verbs only, and no `git push` in any form.
          use_commit_signing: true

          claude_args: |
            --model "claude-opus-5"
            --max-turns 250
            --allowedTools "Bash(node *),Bash(npx playwright *),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git stash:*),Bash(git rev-parse:*),Bash(git ls-remote:*),Bash(git fetch:*),Read,Edit,Write,Glob,Grep"
