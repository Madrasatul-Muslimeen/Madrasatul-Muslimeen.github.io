# Claude Code — MMSA governance-automation pilot, STEP 2 (the builder stage).
#
# REVIEWABLE CONFIGURATION. This workflow is INERT until the Owner configures a
# Claude authentication mode (see "Owner setup" below). Without one the job
# stops at the preflight step with an explanatory message and does NOT run
# Claude.
#
# ---------------------------------------------------------------------------
# HOW THE BOT IDENTITY WORKS — verified from the Action's own source, not
# assumed. Two separate credentials are in play and they are easy to conflate:
#
#   1. GITHUB identity. `github_token` is deliberately NOT set below. The
#      Action then mints a GitHub Actions OIDC token (audience
#      "claude-code-github-action"), POSTs it to Anthropic's
#      github-app-token-exchange endpoint, and receives a short-lived
#      INSTALLATION TOKEN for the Claude GitHub App already installed on this
#      repository. Git operations use bot id 41898282 / `claude[bot]`
#      (src/github/constants.ts). That identity is distinct from AAAsapp, so a
#      PR it opens is one AAAsapp is not the author of.
#      => THIS IS WHY `id-token: write` IS REQUIRED. Without it there is no
#         OIDC token, no App token, and no bot identity.
#      => Passing `github_token: ${{ secrets.GITHUB_TOKEN }}` would DEFEAT the
#         whole purpose twice over: the author becomes `github-actions[bot]`
#         AND, per GitHub's loop-prevention rule, the resulting PR would not
#         trigger the `verify` workflow at all. Do not add it.
#
#   2. CLAUDE API identity. Separate and NOT supplied by the App. It needs one
#      of the three modes below. This is the Owner's to add; nothing here
#      creates, stores or prints one.
# ---------------------------------------------------------------------------
#
# ===========================================================================
# TWO REVIEW FINDINGS WERE RAISED ON THE FIRST REVISION OF THIS FILE. BOTH
# WERE CORRECT AND BOTH ARE RESOLVED HERE. Recorded rather than silently
# patched, because the reasoning is what stops them coming back.
#
# [P2] THE PREFLIGHT ONLY MATCHED ONE OF THE THREE ADVERTISED AUTH MODES.
#   It tested `ANTHROPIC_API_KEY` alone while the setup notes offered three
#   modes and told the Owner to "swap the input". An Owner who chose OAuth or
#   Workload Identity Federation would have got `present=false` for ever: both
#   checkout and Claude skipped, the workflow permanently inert, and NOTHING
#   on screen saying why.
#   FIXED AT THE ROOT, not by widening one test: all three modes are passed to
#   the Action unconditionally (empty inputs are treated as unset, confirmed
#   from action.yml's own `inputs.x || env.X` fallbacks), so THERE IS NO INPUT
#   TO SWAP ANY MORE -- the instruction that caused the defect is gone. The
#   preflight now reports which mode is configured, and a HALF-configured
#   federation FAILS BY NAME rather than reading as "none".
#
# [P1] CLAUDE COULD HAVE PUSHED STRAIGHT TO `main`.
#   `Bash(git push:*)` pre-approved every form of push, including
#   `git push --force origin HEAD:main`. The job holds `contents: write` and a
#   real App token, and `verify.yml` only runs on `pull_request` -- so that
#   single pattern bypassed BOTH pull-request review and the seven-suite gate.
#   FIXED: every git WRITE verb is gone -- no push, no commit, no add, no
#   checkout. Nothing is lost by removing them: the Action's own documented
#   defaults already give Claude file operations, committing, and read-only
#   git, and it manages the branch and the pull request itself.
#
#   AND THE GLOB WENT TOO. `Bash(node tools/i18n-verify/*)` would have
#   re-opened the same hole by another door: Claude can write files, so it
#   could author a script INTO that directory and execute it.
#
# [P1, SECOND ROUND] EXACT SCRIPT PATHS WERE STILL NOT ENOUGH. THIS IS THE
# FINDING THIS REVISION EXISTS FOR.
#   Naming the seven suites as exact `node tools/i18n-verify/<suite>.mjs`
#   commands narrowed WHICH file runs but not WHAT IS IN IT. File editing is
#   deliberately still enabled, so Claude could edit an allowlisted `.mjs` and
#   the next exact `node` invocation would execute the edited JavaScript --
#   which can spawn any child process at all. AN ALLOWLIST OF PATHS IS NOT AN
#   ALLOWLIST OF BEHAVIOUR WHILE THOSE PATHS ARE MODEL-EDITABLE.
#   FIXED BY DELETING THE PERMISSION ENTIRELY: there is no `--allowedTools`
#   here any more, so Claude gets NO extra Bash surface of any kind. Nothing
#   is lost -- `verify.yml` already runs all seven suites against every pull
#   request, on a clean checkout Claude never touches. Verification belongs to
#   CI, not to the thing being verified.
#
# ---------------------------------------------------------------------------
# WHAT THE ACTION GRANTS BY DEFAULT -- audited from source, because removing
# our own allowlist only matters if the defaults are not worse.
#
#   src/modes/tag/index.ts builds its tool list as:
#     Glob, Grep, LS, Read,
#     mcp__github_comment__update_claude_comment,
#     mcp__github_ci__{get_ci_status,get_workflow_run_details,download_job_log}
#   None of those can execute a command. THERE IS NO GENERIC `Bash` TOOL AND
#   NO ARBITRARY-COMMAND ROUTE IN THE DEFAULTS.
#
#   It then branches. WITHOUT commit signing it appends four Bash entries:
#     Bash(git add:*), Bash(git commit:*), Bash(git rm:*),
#     Bash(${GITHUB_ACTION_PATH}/scripts/git-push.sh:*)
#   That push wrapper is genuinely defensive -- it refuses EVERY flag, so
#   `--force` and `--receive-pack` are impossible -- but it validates only
#   that the ref is well formed. IT DOES NOT BLOCK A BRANCH NAME, so a
#   default configuration can fast-forward `main`.
#
#   WITH commit signing it appends instead:
#     mcp__github_file_ops__commit_files, mcp__github_file_ops__delete_files
#   -- API calls, not shell. So `use_commit_signing: true` below leaves the
#   allowlist with ZERO Bash tools. That is why it is set.
#   It is also why `persist-credentials` on checkout is LEFT ALONE: with no
#   Bash tool there is nothing that could read the credential out of
#   .git/config, so changing it would add an untested variable and no
#   protection.
#
#   NOT TESTED, and it cannot be from here: nothing about Claude running can
#   execute until this is on the default branch AND a credential exists. It is
#   one line, and reverting it restores the documented default.
# ---------------------------------------------------------------------------
#
#   RESIDUAL RISK, STATED PLAINLY RATHER THAN IMPLIED AWAY: any job holding a
#   `contents: write` token can in principle reach `main`. Narrowing tools
#   makes that hard; only a SERVER-SIDE rule makes it impossible. The backstop
#   is a branch rule on `main` set to "Require a pull request before merging"
#   with **Required approvals = 0**. That blocks direct pushes outright WITHOUT
#   demanding an approval -- which matters here, because AAAsapp authors every
#   pull request today and GitHub forbids approving your own, so requiring an
#   approval would deadlock the repository. That setting is the Owner's to
#   make; this file cannot and does not change repository settings.
# ===========================================================================
#
# Owner setup, exactly one of -- and NO edit to this file is needed for any of
# them:
#   (a) Add repository SECRET  ANTHROPIC_API_KEY
#   (b) Add repository SECRET  CLAUDE_CODE_OAUTH_TOKEN
#   (c) Workload Identity Federation -- no stored credential at all. Add three
#       repository VARIABLES (Settings > Secrets and variables > Actions >
#       Variables), which are identifiers rather than secrets:
#         ANTHROPIC_FEDERATION_RULE_ID
#         ANTHROPIC_ORGANIZATION_ID
#         ANTHROPIC_SERVICE_ACCOUNT_ID
#       All three, or the preflight fails and names the missing ones.
#
# If (a) and (b) are both set the Action's own precedence applies; the
# preflight says so rather than choosing silently.
#
# KNOWN AND EXPECTED: the App token exchange validates that this workflow
# exists on the DEFAULT BRANCH. On the pull request that first adds this file
# the exchange is refused with `workflow_not_found_on_default_branch`; the
# Action logs a warning, sets the output
# `skipped_due_to_workflow_validation_mismatch`, and EXITS CLEANLY (green, not
# red). Separately, `issue_comment` workflows ALWAYS run from the default
# branch. Both mean the same thing: this begins working only once it is on
# `main`.

name: Claude Code

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    # TWO GATES, AND THE OUTER ONE IS NEW.
    #
    # This repository is PUBLIC, so anyone on GitHub can comment on an issue or
    # a pull request. The Action itself refuses an actor without write access
    # -- src/github/validation/permissions.ts calls
    # getCollaboratorPermissionLevel() and accepts only "admin" or "write", and
    # src/entrypoints/prepare.ts runs that check BEFORE the trigger check and
    # calls core.setFailed() otherwise. THAT CHECK IS REAL AND IS KEPT; nothing
    # here replaces or weakens it.
    #
    # But it runs INSIDE the Action, so a stranger's comment would still start
    # a runner and check out the repository before being refused -- billable
    # minutes available to anyone, on demand. The association test below moves
    # the refusal EARLIER, to before the job starts at all. Defence in depth:
    # the outer gate is cheap and coarse, the Action's is authoritative.
    #
    # OWNER / MEMBER / COLLABORATOR is deliberately all three. On an
    # organisation-owned repository an administrator may present as any of
    # them depending on how their access is granted, and AAAsapp is the sole
    # collaborator with role_name "admin". Listing one would risk locking out
    # the only human who can drive this.
    #
    # DIAGNOSTIC, because a job-level `if` that fails leaves NO run to look at:
    # if an authorised "@claude" comment produces no workflow run whatsoever,
    # this condition is the first place to look, not the Action.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Each permission is here for a stated reason; nothing is granted "just in
    # case". Deliberately ABSENT: actions, workflows, checks, packages,
    # deployments, security-events. In particular NO `workflows: write` — this
    # job must not be able to rewrite the gate that checks it.
    permissions:
      contents: write       # create the branch and commit the change
      pull-requests: write  # open the PR and comment on it
      issues: write         # reply in the issue thread that invoked it
      id-token: write       # REQUIRED: mint the OIDC token exchanged for the
                            # Claude App installation token (the bot identity)

    steps:
      # Establishes ONLY which mode is configured. It prints a mode name and
      # booleans, NEVER a value: every secret arrives through `env:` and is
      # tested with [ -n ... ], so no credential is ever interpolated into the
      # script text where it could be echoed by accident.
      - name: Establish which Claude authentication mode is configured
        id: auth
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FED_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          FED_ORG_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          FED_SA_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # Explicit if/fi rather than `[ ... ] && x=1`: under `set -e` a
          # trailing failed test would terminate the step.
          have_api=0
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then have_api=1; fi
          have_oauth=0
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then have_oauth=1; fi

          fed_present=0
          fed_missing=""
          for pair in "ANTHROPIC_FEDERATION_RULE_ID=${FED_RULE_ID:-}" \
                      "ANTHROPIC_ORGANIZATION_ID=${FED_ORG_ID:-}" \
                      "ANTHROPIC_SERVICE_ACCOUNT_ID=${FED_SA_ID:-}"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -n "$value" ]; then
              fed_present=$((fed_present + 1))
            else
              fed_missing="$fed_missing $name"
            fi
          done

          if [ "$have_api" -eq 1 ] && [ "$have_oauth" -eq 1 ]; then
            echo "::warning::Both ANTHROPIC_API_KEY and CLAUDE_CODE_OAUTH_TOKEN are set; the Action's own precedence decides. Remove one to make the choice explicit."
          fi

          mode=none
          ready=false
          if [ "$have_api" -eq 1 ]; then
            mode=api_key; ready=true
          elif [ "$have_oauth" -eq 1 ]; then
            mode=oauth; ready=true
          elif [ "$fed_present" -eq 3 ]; then
            mode=federation; ready=true
          elif [ "$fed_present" -gt 0 ]; then
            # A PARTIAL federation setup must never read as "not configured".
            # Silently falling through to inert is exactly how a half-done
            # setup looks identical to no setup at all.
            mode=federation_incomplete
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

          if [ "$mode" = "federation_incomplete" ]; then
            echo "::error::Workload Identity Federation is partially configured ($fed_present of 3). Missing:$fed_missing"
            {
              echo "## Claude Code — federation setup incomplete"
              echo ""
              echo "$fed_present of 3 federation variables are set. Missing:"
              echo ""
              for m in $fed_missing; do echo "- \`$m\`"; done
              echo ""
              echo "Add them under **Settings → Secrets and variables → Actions → Variables**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$ready" = "true" ]; then
            echo "A Claude authentication mode is configured: $mode"
          else
            echo "::notice::No Claude authentication mode configured, so Claude will not run."
            {
              echo "## Claude Code — not configured yet"
              echo ""
              echo "This workflow is wired but **inert**. The Owner must add exactly one of:"
              echo ""
              echo "- repository **secret** \`ANTHROPIC_API_KEY\`, or"
              echo "- repository **secret** \`CLAUDE_CODE_OAUTH_TOKEN\`, or"
              echo "- all three repository **variables** \`ANTHROPIC_FEDERATION_RULE_ID\`, \`ANTHROPIC_ORGANIZATION_ID\`, \`ANTHROPIC_SERVICE_ACCOUNT_ID\` (no stored credential)."
              echo ""
              echo "No edit to \`claude.yml\` is required for any of them."
              echo "No credential is created by this workflow, and none is printed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the repository
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.auth.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # ALL THREE MODES ARE PASSED, ALWAYS. An empty input is treated as
          # unset (action.yml resolves `inputs.x || env.X`), so whichever mode
          # the Owner configured is the one that takes effect -- and there is
          # no "swap the input" step left to get wrong.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}

          # github_token is INTENTIONALLY OMITTED. See the header: omitting it
          # is what selects the Claude App installation token, and with it the
          # `claude[bot]` identity that makes the PR reviewable by AAAsapp and
          # able to trigger the `verify` workflow.

          # Commits are created through the GitHub API rather than the git
          # CLI. The reason is not signing, it is THE TOOL LIST: this is what
          # makes the Action swap its four default Bash(git ...) entries for
          # two MCP file-operation tools, leaving no Bash tool at all. See the
          # audit in the header.
          use_commit_signing: true

          # THERE IS DELIBERATELY NO `--allowedTools` LINE.
          # Claude gets no extra Bash surface whatsoever. An allowlist of
          # script paths is not an allowlist of behaviour while those scripts
          # are editable, so the seven suites are NOT run here: `verify.yml`
          # already runs all seven against every pull request, on a clean
          # checkout Claude never touches.
          claude_args: |
            --model "claude-opus-5"
