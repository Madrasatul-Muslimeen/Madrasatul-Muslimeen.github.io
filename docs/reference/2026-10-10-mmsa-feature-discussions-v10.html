 (QuranRevival) · a feature discussion · opened 10 Oct 2026<\/p>\n<p class=\"lead\">Marks that say what a word or an āyah <em>needs<\/em> before it can be understood (the dictionary, the Hadith, the scholars across the eras, other āyāt, its passage, the reason it came down), how they show on the Status wheel, and how the related hadith and the scholars' texts by era can be fetched automatically.<\/p>\n<p class=\"meta\">Sources read: our 15 hadith books in the repository (82,360 texts); the Qur'an data (6,236 āyāt, 77,429 words, 4,832 root-words); the open tafsir set (123 editions); maani.tech's own page; al-Wāḥidī's Asbāb an-Nuzūl. Nothing here is built in the app.<\/p>"}, {"id": "asma", "title": "🌙 Asma Screensaver", "intro": "<p class=\"eyebrow\">MMSA · Asma ul Husna · a feature discussion · opened 10 Oct 2026<\/p>\n<p class=\"lead\">Your Asma ul Husna posters as a screensaver on every device: it starts by itself when the device is left alone, and you choose how long each poster shows, which posters and which Names, and more.<\/p>"}], "demos": {"keys-cards": "<title>Keys to Understanding<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Scheherazade+New:wght@400;700&display=swap\">\n<style>\n/* Layout: one column; the Word card, then the Āyah card, each with its \"Keys to understanding\" row; my list at the end. */\n:root {\n  --navy: #1F3A6E; --gold: #c9a24b; --gold-ink: #6b4e10;\n  --card: #fffdf6; --paper: #f4efe2; --line: #e3d7b8; --ink: #1b1b16; --muted: #55554c; --chip: #eef2fa;\n  --on: #1F3A6E; --on-ink: #ffffff; --sug-bg: #fff2d9; --sug-ink: #8a5300; --mine-bg: #fbe8e6; --mine-ink: #a3302a; --btn: #ffffff;\n  --font-ui: \"Noto Sans\", system-ui, sans-serif; --font-ar: \"Scheherazade New\", \"Amiri\", serif;\n}\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) {\n  --navy: #9db8ea; --gold: #d9b45f; --gold-ink: #e6c77a; --card: #1d2230; --paper: #141822; --line: #343b4d; --ink: #ecebe4; --muted: #aeb0b8; --chip: #26304a;\n  --on: #9db8ea; --on-ink: #141822; --sug-bg: #3a2c12; --sug-ink: #f0b860; --mine-bg: #3d1d1b; --mine-ink: #f08a82; --btn: #222838; color-scheme: dark } }\n:root[data-theme=\"dark\"] {\n  --navy: #9db8ea; --gold: #d9b45f; --gold-ink: #e6c77a; --card: #1d2230; --paper: #141822; --line: #343b4d; --ink: #ecebe4; --muted: #aeb0b8; --chip: #26304a;\n  --on: #9db8ea; --on-ink: #141822; --sug-bg: #3a2c12; --sug-ink: #f0b860; --mine-bg: #3d1d1b; --mine-ink: #f08a82; --btn: #222838; color-scheme: dark }\n* { box-sizing: border-box; }\n[hidden] { display: none !important; }\nbody { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; padding-inline: 16px; padding-block: 16px 40px; margin: 0; }\n.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }\nh1 { margin: 0; font-size: 1.45rem; color: var(--navy); text-wrap: balance; }\nh2 { margin: 0; font-size: 1.1rem; color: var(--navy); }\nh3 { margin: 0; font-size: 0.95rem; color: var(--gold-ink); letter-spacing: .02em; }\np { margin: 0; line-height: 1.55; }\n.lede { color: var(--muted); max-width: 65ch; }\n.tag { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold-ink); font-weight: 700; }\n.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }\n.ar { font-family: var(--font-ar); direction: rtl; line-height: 1.9; }\n.word-ar { font-size: 2.6rem; text-align: center; }\n.ayah-ar { font-size: 1.6rem; }\n.meta { color: var(--muted); font-size: 14px; }\n.keys { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }\n.chips { display: flex; flex-wrap: wrap; gap: 8px; }\n.key { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--navy); background: var(--btn); color: var(--navy); font: 600 14px var(--font-ui); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }\n.key[aria-pressed=\"true\"] { background: var(--on); color: var(--on-ink); }\n.key.sug:not([aria-pressed=\"true\"]) { border-style: dashed; background: var(--sug-bg); color: var(--sug-ink); border-color: var(--sug-ink); }\n.key.mine[aria-pressed=\"true\"] { background: var(--mine-ink); border-color: var(--mine-ink); color: var(--on-ink); }\n.key small { font-weight: 400; opacity: .85; }\nbutton:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }\n.why { font-size: 13.5px; color: var(--muted); }\n.next { display: grid; gap: 6px; }\n.next-item { border-left: 3px solid var(--gold); padding: 6px 10px; background: var(--chip); border-radius: 0 8px 8px 0; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }\n.next-item .go { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--navy); background: var(--btn); color: var(--navy); font: 600 13px var(--font-ui); cursor: pointer; }\n.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); }\n.legend span { display: inline-flex; align-items: center; gap: 6px; }\n.sw { width: 14px; height: 14px; border-radius: 7px; display: inline-block; border: 1px solid var(--navy); }\n.sw.sug { background: var(--sug-bg); border: 1px dashed var(--sug-ink); }\n.sw.on { background: var(--on); }\n.sw.mine { background: var(--mine-ink); border-color: var(--mine-ink); }\ntable { width: 100%; border-collapse: collapse; font-size: 14px; }\nth, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }\nth { color: var(--muted); font-weight: 600; }\n.tbl { overflow-x: auto; }\n.empty { color: var(--muted); font-style: italic; }\n.opinion ol, .opinion ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; line-height: 1.55; }\n.q { border-left: 4px solid var(--gold); }\n.term { font-family: var(--font-ar); font-size: 1.15em; }\n<\/style>\n\n<div class=\"wrap\">\n  <div class=\"tag\">Demo · nothing is saved · tap the chips<\/div>\n  <h1>Keys to understanding: Word card and Āyah card<\/h1>\n  <p class=\"lede\">A row of marks under each card that says what this word or āyah <b>needs<\/b> before it is truly understood. The marks do not change your progress. They say what to do next, and they give you a list of everything you marked. The example is Yaseen 8 from your writing sheet.<\/p>\n  <div class=\"legend\">\n    <span><i class=\"sw on\"><\/i>marked<\/span>\n    <span><i class=\"sw sug\"><\/i>suggested by the computer (to be checked)<\/span>\n    <span><i class=\"sw mine\"><\/i>\"Hard for me\": yours alone<\/span>\n  <\/div>\n\n  <section class=\"card\" id=\"wordCard\" aria-label=\"Word card\">\n    <div class=\"tag\">Word card · 36:8:10<\/div>\n    <div class=\"ar word-ar\">مُّقْمَحُونَ<\/div>\n    <p class=\"meta\">muqmaḥūn · \"(are with) heads raised up\" · root ق م ح · <b>once in the whole Qur'an<\/b><\/p>\n    <div class=\"keys\">\n      <h3>🔑 Keys to understanding this word<\/h3>\n      <div class=\"chips\" data-keys=\"word\"><\/div>\n      <div class=\"next\" data-next=\"word\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"card\" id=\"ayahCard\" aria-label=\"Āyah card\">\n    <div class=\"tag\">Āyah card · Yaseen 36:8<\/div>\n    <div class=\"ar ayah-ar\">إِنَّا جَعَلْنَا فِىٓ أَعْنَـٰقِهِمْ أَغْلَـٰلًۭا فَهِىَ إِلَى ٱلْأَذْقَانِ فَهُم مُّقْمَحُونَ<\/div>\n    <p class=\"meta\">\"Indeed, We have put shackles on their necks, and they are to their chins, so they are with heads kept aloft.\"<\/p>\n    <div class=\"keys\">\n      <h3>🔑 Keys to understanding this āyah<\/h3>\n      <div class=\"chips\" data-keys=\"ayah\"><\/div>\n      <div class=\"next\" data-next=\"ayah\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"card\" aria-label=\"My keys\">\n    <h2>📋 My list: everything marked<\/h2>\n    <p class=\"why\">One place that collects every mark, to plan study: \"my hard āyāt\", \"words to look up\", \"āyāt to read with Hadith\".<\/p>\n    <div class=\"tbl\"><table><thead><tr><th>Where<\/th><th>Marked<\/th><\/tr><\/thead><tbody id=\"list\"><\/tbody><\/table><\/div>\n  <\/section>\n\n  <section class=\"card opinion\" aria-label=\"My opinion\">\n    <h2>My opinion<\/h2>\n    <ol>\n      <li><b>Yes, it is worth building, and it is different from progress.<\/b> Progress (Learning, Practising, Achieved…) says <i>how far I have studied<\/i>. These marks say <i>what this text needs<\/i>. Kept apart, neither muddies the other.<\/li>\n      <li><b>Use the names our scholars already use<\/b>, with plain words beside them:\n        <ul>\n          <li>a word that needs the dictionary is <b>Gharīb<\/b> <span class=\"term\">(غريب)<\/span>, the science of <i>Gharīb al-Qur'ān<\/i>;<\/li>\n          <li>a word with several meanings in the Qur'an is <b>Wujūh<\/b> <span class=\"term\">(وجوه)<\/span>;<\/li>\n          <li>an āyah explained by other āyāt is <b>Tafsīr al-Qur'ān bil-Qur'ān<\/b>;<\/li>\n          <li>an āyah explained by Hadith is <b>bis-Sunnah<\/b>;<\/li>\n          <li>one where the scholars' views across the eras matter is <b>Aqwāl al-Mufassirīn<\/b>;<\/li>\n          <li>one that is not complete on its own but belongs to its passage is <b>Siyāq<\/b> <span class=\"term\">(سياق)<\/span>, \"context\";<\/li>\n          <li>one that needs the reason it was revealed is <b>Asbāb an-Nuzūl<\/b>.<\/li>\n        <\/ul>\n        Your wording becomes the plain line; the term is the short label. The umbrella name I suggest is <b>\"Keys to understanding\"<\/b> (Bangla \"বোঝার চাবি\").<\/li>\n      <li><b>Two kinds of mark, kept apart.<\/b>\n        <ul>\n          <li><b>\"Hard for me\"<\/b> is personal. Each reader marks their own, like progress.<\/li>\n          <li><b>The other keys are facts about the text.<\/b> Owner and Prime set them for the madrasah, like the Asma descriptions. Everyone sees them, and each reader can add their own on top.<\/li>\n        <\/ul><\/li>\n      <li><b>Let the computer suggest, never decide.<\/b> 1,995 of the Qur'an's 4,832 dictionary words occur only once (مُّقْمَحُونَ here is one), so <b>Gharīb<\/b> can be suggested automatically, dashed and marked \"to be checked\", just as the dua words are. The passage for <b>Siyāq<\/b> can be suggested from the Ruku' (here 36:1–12).<\/li>\n      <li><b>Every key should lead somewhere<\/b> (the \"what next\" lines in the demo):\n        <ul>\n          <li>Gharīb opens Lane / Hans Wehr, already on the Word card;<\/li>\n          <li>Hadith opens the Hadith tab searched for this āyah;<\/li>\n          <li>other āyāt opens the Āyah card's \"Connected āyāt\";<\/li>\n          <li>Siyāq opens the passage as a Range;<\/li>\n          <li>scholars and Hadith findings are written in a Note, which the Notes pane already holds.<\/li>\n        <\/ul><\/li>\n      <li><b>It fits the Ten Steps file:<\/b> these keys are the doorways to its later steps (Hadith, scholars, context). That file can later say which key belongs to which step.<\/li>\n    <\/ol>\n  <\/section>\n\n  <section class=\"card q\" aria-label=\"Questions\">\n    <h2>Questions for you (my recommendation in each)<\/h2>\n    <ol>\n      <li><b>The list of keys.<\/b> Words: Hard for me · Gharīb (needs the dictionary) · Wujūh (several meanings). Āyāt: Hard for me · needs Hadith · needs the scholars across the eras · explained by other āyāt · Siyāq (read with its passage) · Asbāb an-Nuzūl. Add, remove or rename freely.<\/li>\n      <li><b>Who sets them.<\/b> Recommended: \"Hard for me\" by each reader; the others by Owner/Prime for the madrasah, with readers able to add their own.<\/li>\n      <li><b>Where they are kept.<\/b> The madrasah's keys can go in the madrasah's own document (no Firebase step), as the dua checks do. <b>Each reader's own marks need a new place in Firebase: a Rules change you publish once.<\/b> Recommended: yes, the same kind of step as the pictures were.<\/li>\n      <li><b>Computer suggestions.<\/b> Recommended: yes for Gharīb (a word used only once in the Qur'an) and the passage (its Ruku'), always shown dashed as \"to be checked\".<\/li>\n    <\/ol>\n  <\/section>\n<\/div>\n\n<script>\nconst KEYS = {\n  word: [\n    { id: \"hard\", icon: \"😓\", label: \"Hard for me\", mine: true, why: \"Only you see this. It goes on your list of hard words.\" },\n    { id: \"gharib\", icon: \"📖\", label: \"Gharīb\", plain: \"needs the dictionary\", sug: true, sugWhy: \"Suggested: this word is used only once in the whole Qur'an.\", why: \"A rare word: its meaning comes from the dictionary and the early scholars of language.\", next: [[\"Lane's Lexicon / Hans Wehr at root ق م ح\", \"Open\"], [\"Write what you found in a Note\", \"📝 Note\"]] },\n    { id: \"wujuh\", icon: \"🧩\", label: \"Wujūh\", plain: \"several meanings\", why: \"The same word carries different meanings in different places.\", next: [[\"See every place it occurs (Word card ▸ places)\", \"Open\"]] },\n  ],\n  ayah: [\n    { id: \"hard\", icon: \"😓\", label: \"Hard for me\", mine: true, why: \"Only you see this. It goes on your list of hard āyāt.\" },\n    { id: \"hadith\", icon: \"📜\", label: \"Needs Hadith\", plain: \"bis-Sunnah\", why: \"The Prophet's explanation (ﷺ) or a related narration is needed.\", next: [[\"Search the Hadith tab for this āyah\", \"Open\"], [\"Keep what you found in a Note\", \"📝 Note\"]] },\n    { id: \"scholars\", icon: \"🎓\", label: \"Scholars across the eras\", plain: \"Aqwāl al-Mufassirīn\", why: \"The understanding comes from the mufassirūn, early and later; their views may differ.\", next: [[\"Add the views you read, era by era, in a Note\", \"📝 Note\"]] },\n    { id: \"quran\", icon: \"🔗\", label: \"Explained by other āyāt\", plain: \"al-Qur'ān bil-Qur'ān\", why: \"Other āyāt explain this one.\", next: [[\"Connect the āyāt (Āyah card ▸ Connected āyāt)\", \"Open\"]] },\n    { id: \"siyaq\", icon: \"🧱\", label: \"Read with its passage\", plain: \"Siyāq\", sug: true, sugWhy: \"Suggested: its Ruku' is 36:1–12.\", why: \"Not a complete meaning on its own: it belongs to the passage around it.\", next: [[\"Read 36:1–12 as one Range\", \"Open\"]] },\n    { id: \"asbab\", icon: \"⏳\", label: \"Asbāb an-Nuzūl\", plain: \"why it was revealed\", why: \"The event it was revealed about is needed to understand it.\", next: [[\"Keep the account in a Note\", \"📝 Note\"]] },\n  ],\n};\nconst state = { word: new Set(), ayah: new Set() };\nconst el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };\n\nfunction render(kind) {\n  const chips = document.querySelector(`[data-keys=\"${kind}\"]`), next = document.querySelector(`[data-next=\"${kind}\"]`);\n  chips.replaceChildren(); next.replaceChildren();\n  for (const k of KEYS[kind]) {\n    const b = el(\"button\", \"key\" + (k.sug ? \" sug\" : \"\") + (k.mine ? \" mine\" : \"\"));\n    b.type = \"button\";\n    b.dataset.key = k.id;\n    b.setAttribute(\"aria-pressed\", String(state[kind].has(k.id)));\n    b.append(`${k.icon} ${k.label}`);\n    if (k.plain) b.appendChild(el(\"small\", null, `· ${k.plain}`));\n    b.title = k.why;\n    b.addEventListener(\"click\", () => { state[kind].has(k.id) ? state[kind].delete(k.id) : state[kind].add(k.id); render(kind); renderList(); });\n    chips.appendChild(b);\n  }\n  const sugs = KEYS[kind].filter((k) => k.sug && !state[kind].has(k.id));\n  for (const k of sugs) next.appendChild(el(\"p\", \"why\", `💡 ${k.sugWhy} Tap the dashed key to accept it.`));\n  for (const k of KEYS[kind].filter((x) => state[kind].has(x.id))) {\n    next.appendChild(el(\"p\", \"why\", `${k.icon} ${k.why}`));\n    for (const [what, go] of k.next ?? []) {\n      const row = el(\"div\", \"next-item\");\n      row.appendChild(el(\"span\", null, what));\n      const g = el(\"button\", \"go\", go); g.type = \"button\"; g.addEventListener(\"click\", () => { g.textContent = \"(would open)\"; });\n      row.appendChild(g);\n      next.appendChild(row);\n    }\n  }\n}\nfunction renderList() {\n  const body = document.getElementById(\"list\");\n  body.replaceChildren();\n  const rows = [[\"Word مُّقْمَحُونَ (36:8:10)\", \"word\"], [\"Āyah 36:8\", \"ayah\"]];\n  let any = false;\n  for (const [where, kind] of rows) {\n    if (!state[kind].size) continue;\n    any = true;\n    const tr = el(\"tr\");\n    tr.appendChild(el(\"td\", null, where));\n    tr.appendChild(el(\"td\", null, KEYS[kind].filter((k) => state[kind].has(k.id)).map((k) => `${k.icon} ${k.label}`).join(\" · \")));\n    body.appendChild(tr);\n  }\n  if (!any) { const tr = el(\"tr\"); const td = el(\"td\", \"empty\", \"Nothing marked yet. Tap a key above.\"); td.colSpan = 2; tr.appendChild(td); body.appendChild(tr); }\n}\n// A realistic starting state: the computer's two suggestions shown, one personal mark made.\nstate.ayah.add(\"hard\");\nrender(\"word\"); render(\"ayah\"); renderList();\n<\/script>\n", "keys-wheel": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Keys Wheel Demo<\/title>\n<style>\n:root{--bg:#f7f4ec;--card:#fffdf8;--ink:#1d2a3a;--mut:#5b6675;--line:#ddd5c4;--navy:#1f3a5f;--gold:#b8892b;\n--hard:#d64545;--gharib:#7b4bc4;--wujuh:#c27c0e;--hadith:#2e8b57;--scholars:#2f6db5;--quran:#138a8a;--siyaq:#8a5a2b;--asbab:#c2185b;--none:#e7e1d4}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#141a22;--card:#1c2430;--ink:#e8edf3;--mut:#a3adbb;--line:#334050;--navy:#9cc0ea;--none:#2b3543}}\n:root[data-theme=\"dark\"]{--bg:#141a22;--card:#1c2430;--ink:#e8edf3;--mut:#a3adbb;--line:#334050;--navy:#9cc0ea;--none:#2b3543}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}\n[hidden]{display:none!important}\n.top{padding:14px 16px 6px;max-width:1200px;margin:0 auto}\nh1{font-size:1.25rem;margin:0 0 4px;color:var(--navy)}.sub{color:var(--mut);margin:0;font-size:.92rem}\n.bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;max-width:1200px;margin:0 auto}\n.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;min-height:40px;font:inherit;font-size:.92rem;cursor:pointer}\n.btn[aria-pressed=\"true\"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}\n.chip{display:inline-flex;align-items:center;gap:6px}.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}\n.lab{font-size:.8rem;color:var(--mut);align-self:center;margin-right:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}\n.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:14px;padding:6px 16px 24px;max-width:1200px;margin:0 auto}\n@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}\n.wheel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;min-width:0}\n.wheel svg{width:100%;height:auto;display:block;max-height:78vh}\n.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;max-height:none}\n.panel h2{font-size:1.05rem;margin:0 0 6px;color:var(--navy)}.panel h3{font-size:.95rem;margin:14px 0 6px;color:var(--navy)}\n.ar{font-family:\"Amiri\",\"Scheherazade New\",\"Traditional Arabic\",serif;font-size:1.45rem;line-height:2;direction:rtl;text-align:right}\n.arsm{font-family:\"Amiri\",\"Scheherazade New\",\"Traditional Arabic\",serif;font-size:1.05rem;line-height:1.9;direction:rtl;text-align:right}\n.key{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}.key:first-of-type{border-top:0}\n.tag{font-size:.72rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}\n.tag.auto{border-color:var(--hadith);color:var(--hadith)}.tag.you f all things, and to Him you will be returned.\",\"bn\":\"অতএব পবিত্র তিনি, যাঁর হাতে সবকিছুর রাজত্ব এবং তাঁরই দিকে তোমরা প্রত্যাবর্তিত হবে।\",\"w\":[[\"فَسُبْحَـٰنَ\",\"سُبْحَٰن\",41,1,\"So glory be\",\"অতএব মহান পবিত্র\",\"praise\",\"\"],[\"ٱلَّذِى\",\"ٱلَّذِى\",1464,0,\"(to) the One who\",\"(সেই সত্ত্বা) তিনিই\",\"who, that, which\",\"সে, তিনি, যিনি, কে, তাকে, কাকে, কোনো\"],[\"بِيَدِهِۦ\",\"يَد\",120,0,\"in Whose hand\",\"যার হাতে (আছে)\",\"an appendage of a body (as of an animal)\",\"\"],[\"مَلَكُوتُ\",\"مَلَكُوت\",4,1,\"is (the) dominion\",\"সার্বভৌম ক্ষমতা\",\"kingdom, dominion, reign\",\"কর্তৃত্ব, রাজত্ব, অধিকার, প্রভাব, ক্ষমতা, রাজ্য, উধ্বোলোক\"],[\"كُلِّ\",\"كُلّ\",359,0,\"(of) all\",\"সব\",\"each one, everyone\",\"মুলত একটি বিশেষ্য অর্থ: ‘প্রত্যেকে, সকলে, সবকিছুই, সার্বজনিন’\"],[\"شَىْءٍۢ\",\"شَىْء\",283,0,\"things\",\"জিনিসের\",\"thing\",\"যে কোনো বস্তু, দ্রব্য, জিনিস, ব্যাপার, বিষয়\"],[\"وَإِلَيْهِ\",\"إِلَىٰ\",742,0,\"and to Him\",\"এবং তাঁরই দিকে\",\"to, towards\",\"\"],[\"تُرْجَعُونَ\",\"رَجَعَ\",79,0,\"you will be returned\",\"তোমাদেরকে ফিরিয়ে নেয়া হবে\",\"to return, to come back\",\"ফিরে আসা, পুনরায় আসা, প্রত্যাবর্তন করা, আশ্রয় নেওয়া, ফিরে যাওয়া\"]]}],\"ruku\":[[1,12],[13,32],[33,50],[51,67],[68,83]],\"ysHadith\":{\"36:38\":[[\"Musnad Ahmad\",null,\"- حدثنا وكيع، حدثنا الأعمش، عن إبراهيم التيمي، عن أبيه، عن أبي ذر، قال: سألت النبي صلى الله عليه وسلم عن قوله تعالى: {والشمس تجري لمستقر لها} [يس: 38] قال: \\\"مستقرها تحت العرش \\\" (2)\"],[\"Musnad Ahmad\",null,\"- حدثنا ابن نمير، ومحمد بن عبيد، قالا: حدثنا الأعمش، عن إبراهيم التيمي، عن أبيه، قال: قال أبو ذر: بينما أنا مع رسول الله صلى الله عليه وسلم في المسجد حين وجبت الشمس قال: \\\"يا أبا ذر، أين تذهب الشمس؟ \\\" قلت: الله ورسوله أعلم. قال: \\\"فإنها تذهب حتى تسجد بين يدي ربها عز وجل ثم تستأذن فيؤذن لها وكأنها قد قيل لها: ارجعي من حيث جئت، فتطلع من مكانها، وذلك مستقر لها \\\". قال محمد: ثم قرأ: {والشمس تجري لمستقر لها} [يس: 38] (2)\"],[\"Musnad Ahmad\",null,\"- حدثنا وكيع، حدثنا الأعمش، عن إبراهيم التيمي، عن أبيه، عن أبي ذر، قال: سألت رسول الله صلى الله عليه وسلم عن قول الله عز وجل: {والشمس تجري لمستقر لها} [يس: 38] قال: \\\"مستقرها تحت العرش \\\" (2)\"],[\"Musnad Ahmad\",null,\"- حدثنا محمد بن عبيد، حدثنا الأعمش، عن إبراهيم التيمي، عن أبيه، عن أبي ذر، قال: كنت مع رسول الله صلى الله عليه وسلم في المسجد حين وجبت الشمس، فقال: \\\"يا أبا ذر، تدري أين تذهب الشمس؟ \\\" قلت: الله ورسوله أعلم. قال: \\\"فإنها تذهب حتى تسجد بين يدي ربها، فتستأذن في الرجوع، فيؤذن لها وكأنها قد قيل لها: ارجعي من حيث جئت، فترجع إلى مطلعها، فذلك مستقرها \\\" ثم قرأ: {والشمس تجري لمستقر لها} [يس: 38] (1)\"],[\"Muslim\",\"159\",\"(159) حدثنا أبو سعيد الأشج، وإسحاق بن إبراهيم، قال إسحاق: أخبرنا، وقال الأشج، حدثنا وكيع، حدثنا الأعمش، عن إبراهيم التيمي، عن أبيه، عن أبي ذر، قال: سألت رسول الله صلى الله عليه وسلم عن قول الله تعالى: {والشمس تجري لمستقر لها} [يس: 38]؟ قال: «مستقرها تحت العرش»\"],[\"Bukhari\",4802,\"حدثنا أبو نعيم حدثنا الأعمش عن إبراهيم التيمي عن أبيه عن أبي ذر رضي الله عنه قال * كنت مع النبي صلى الله عليه وسلم في المسجد عند غروب الشمس فقال يا أبا ذر أتدري أين تغرب الشمس قلت الله ورسوله أعلم قال فإنها تذهب حتى تسجد تحت العرش فذلك قوله تعالى والشمس تجري لمستقر لها ذلك تقدير العزيز العليم \\\\ 1 \\\\\"],[\"Bukhari\",3199,\"حدثنا محمد بن يوسف حدثنا سفيان عن الأعمش عن إبراهيم التيمي عن أبيه عن أبي ذر رضي الله عنه قال قال النبي صلى الله عليه وسلم لأبي ذر حين غربت الشمس * تدري أين تذهب قلت الله ورسوله أعلم قال فإنها تذهب حتى تسجد تحت العرش فتستأذن فيؤذن لها ويوشك أن تسجد فلا يقبل منها وتستأذن فلا يؤذن لها يقال لها ارجعي من حيث جئت فتطلع من مغربها فذلك قوله تعالى والشمس تجري لمستقر لها ذلك تقدير العزيز العليم \\\\ 1 \\\\\"]],\"36:12\":[[\"Tirmidhi\",3226,\"بسم الله الرحمن الرحيم حدثنا محمد بن وزير الواسطي حدثنا إسحاق بن يوسف الأزرق عن سفيان الثوري عن أبي نضرة عن أبي سعيد الخدري قال * كانت بنو سلمة في ناحية المدينة فأرادوا النقلة إلى قرب المسجد فنزلت هذه الآية إنا نحن نحيي الموتى ونكتب ما قدموا وآثارهم فقال رسول الله صلى الله عليه وسلم إن آثاركم تكتب فلم ينتقلوا قال هذا حديث حسن غريب من حديث الثوري وأبو سفيان هو طريف السعدي\"]],\"36:58\":[[\"Ibn Majah\",184,\"حدثنا محمد بن عبد الملك بن أبي الشوارب ثنا أبو عاصم العباداني ثنا الفضل الرقاشي عن محمد بن المنكدر عن جابر بن عبد الله قال قال رسول الله صلى الله عليه وسلم * بينا أهل الجنة في نعيمهم إذ سطع لهم نور فرفعوا رؤوسهم فإذا الرب قد أشرف عليهم من فوقهم فقال السلام عليكم يا أهل الجنة قال وذلك قول الله سلام قولا من رب رحيم قال فينظر إليهم وينظرون إليه فلا يلتفتون إلى شيء من النعيم ما داموا ينظرون إليه حتى يحتجب عنهم ويبقى نوره وبركته عليهم في ديارهم\"]]}}<\/script>\n<script type=\"application/json\" id=\"S\">{\"meta\":[[\"mawsoo-at-al-tafsir-al-ma-thoor\",\"Sahaba and Tabi'in (collected)\",\"Mawsū'at at-Tafsīr al-Ma'thūr (2017 collection)\",null,2017,\"narrations, each with its chain and grading\",\"sahaba\",\"28, 29\"],[\"ar-tafsir-al-tabari\",\"al-Ṭabarī\",\"Jāmi' al-Bayān\",310,923,\"his own madhab (Jarīrī)\",\"gen1\",\"29, 30\"],[\"tafsir-al-samarqandi\",\"Abū al-Layth al-Samarqandī\",\"Baḥr al-'Ulūm\",373,983,\"Hanafi\",\"gen1\",\"30, 34\"],[\"tafsir-al-mawardi\",\"al-Māwardī\",\"an-Nukat wal-'Uyūn\",450,1058,\"Shafi'i\",\"gen1\",\"30, 35\"],[\"ar-tafsir-al-baghawi\",\"al-Baghawī\",\"Ma'ālim at-Tanzīl\",516,1122,\"Shafi'i\",\"gen1\",\"30, 35\"],[\"al-kashshaf-al-zamakhshari\",\"al-Zamakhsharī\",\"al-Kashshāf\",538,1144,\"Hanafi in fiqh; Mu'tazili in creed\",\"gen1\",\"30, 36\"],[\"al-muharrar-al-wajiz-ibn-atiyyah\",\"Ibn 'Aṭiyyah\",\"al-Muḥarrar al-Wajīz\",541,1147,\"Maliki\",\"gen1\",\"30, 32\"],[\"tafsir-ibn-al-jawzi\",\"Ibn al-Jawzī\",\"Zād al-Masīr\",597,1201,\"Hanbali\",\"gen1\",\"30, 33\"],[\"tafsir-al-razi\",\"Fakhr al-Dīn al-Rāzī\",\"Mafātīḥ al-Ghayb\",606,1210,\"Shafi'i; Ash'ari\",\"gen1\",\"30, 35\"],[\"ar-tafseer-al-qurtubi\",\"al-Qurṭubī\",\"al-Jāmi' li-Aḥkām al-Qur'ān\",671,1273,\"Maliki\",\"gen2\",\"31, 32\"],[\"tafsir-al-baydawi\",\"al-Bayḍāwī\",\"Anwār at-Tanzīl\",685,1286,\"Shafi'i\",\"gen2\",\"31, 35\"],[\"tafsir-al-nasafi\",\"al-Nasafī\",\"Madārik at-Tanzīl\",710,1310,\"Hanafi\",\"gen2\",\"31, 34\"],[\"tafsir-ibn-juzay\",\"Ibn Juzayy\",\"at-Tashīl\",741,1340,\"Maliki\",\"gen2\",\"31, 32\"],[\"ar-tafsir-ibn-kathir\",\"Ibn Kathīr\",\"Tafsīr al-Qur'ān al-'Aẓīm\",774,1373,\"Shafi'i\",\"gen2\",\"31, 35\"],[\"ar-tafsir-al-jalalayn\",\"al-Maḥallī and al-Suyūṭī\",\"Tafsīr al-Jalālayn\",911,1505,\"Shafi'i\",\"gen2\",\"31, 35\"],[\"al-durr-al-manthur\",\"al-Suyūṭī\",\"ad-Durr al-Manthūr (narrations)\",911,1505,\"Shafi'i\",\"gen2\",\"28, 29, 31\"],[\"tafsir-abi-al-su-ood\",\"Abū al-Su'ūd\",\"Irshād al-'Aql as-Salīm\",982,1574,\"Hanafi\",\"gen2\",\"31, 34\"],[\"fath-al-qadir-al-shawkani\",\"al-Shawkānī\",\"Fatḥ al-Qadīr\",1250,1834,\"no single madhab\",\"gen3\",\"Gen3\"],[\"tafsir-al-alusi\",\"al-Ālūsī\",\"Rūḥ al-Ma'ānī\",1270,1854,\"Hanafi\",\"gen3\",\"Gen3, 34\"],[\"mahasin-al-ta-wil-al-qasimi\",\"al-Qāsimī\",\"Maḥāsin at-Ta'wīl\",1332,1914,\"Shafi'i background\",\"gen3\",\"Gen3\"],[\"ar-tafseer-al-saddi\",\"al-Sa'dī\",\"Taysīr al-Karīm ar-Raḥmān\",1376,1956,\"Hanbali\",\"gen5\",\"Gen5, 33\"],[\"ar-tafseer-tahrir-al-tanwir\",\"Ibn 'Āshūr\",\"at-Taḥrīr wat-Tanwīr\",1393,1973,\"Maliki\",\"gen5\",\"Gen5, 32\"],[\"adwa-al-bayan\",\"al-Shinqīṭī\",\"Aḍwā' al-Bayān (the Qur'an explained by the Qur'an)\",1393,1973,\"Maliki\",\"gen5\",\"Gen5, 32\"],[\"ar-tafsir-muyassar\",\"King Fahd Complex committee\",\"at-Tafsīr al-Muyassar\",1419,1998,\"a committee (published)\",\"gen5\",\"Gen5\"],[\"tafsir-ibn-uthaymeen\",\"Ibn 'Uthaymīn\",\"Tafsīr Ibn 'Uthaymīn\",1421,2001,\"Hanbali\",\"gen5\",\"Gen5, 33\"],[\"ar-tafsir-al-wasit\",\"Muḥammad Sayyid Ṭanṭāwī\",\"at-Tafsīr al-Wasīṭ\",1431,2010,\"Azhar (Shafi'i/Ash'ari)\",\"gen6\",\"Gen6\"],[\"abu-bakr-jabir-al-jazairi\",\"Abū Bakr al-Jazā'irī\",\"Aysar at-Tafāsīr\",1439,2018,\"—\",\"gen6\",\"Gen6\"],[\"bn-tafsir-ahsanul-bayaan\",\"Ṣalāḥuddīn Yūsuf (Bangla)\",\"Aḥsan al-Bayān\",1441,2020,\"Ahl al-Hadith\",\"gen6\",\"Gen6\"],[\"ar-tafsir-al-mukhtasar\",\"Tafsir Center for Quranic Studies\",\"al-Mukhtaṣar fit-Tafsīr\",null,2016,\"a committee (published)\",\"gen6\",\"Gen6\"],[\"bengali-mokhtasar\",\"Tafsir Center (Bangla)\",\"al-Mukhtaṣar, Bangla\",null,2016,\"a committee (published)\",\"gen6\",\"Gen6\"]],\"text\":{\"mawsoo-at-al-tafsir-al-ma-thoor|8\":\"﴿إِنَّا جَعَلۡنَا فِیۤ أَعۡنَـٰقِهِمۡ أَغۡلَـٰلࣰا فَهِیَ إِلَى ٱلۡأَذۡقَانِ فَهُم مُّقۡمَحُونَ ۝٨ وَجَعَلۡنَا مِنۢ بَیۡنِ أَیۡدِیهِمۡ سَدࣰّا وَمِنۡ خَلۡفِهِمۡ سَدࣰّا فَأَغۡشَیۡنَـٰهُمۡ فَهُمۡ لَا یُبۡصِرُونَ ۝٩﴾ - نزول الآيات، وتفسيرها\\n\\n٦٤٣٢٨- عن ابن عباس= (ز)\\n\\n٦٤٣٢٩- وعليّ= (ز)\\n\\n٦٤٣٣٠- وعائشة بنت أبي بكر= (ز)\\n\\n٦٤٣٣١- وعائشة بنت قدامة= (ز)\\n\\n٦٤٣٣٢- وسُراقة بن جُعْشُم، دخل حديثُ بعضِهم في بعض، قالوا: خرج رسولُ الله ﷺ والقومُ جلوسٌ على بابه، فأخذ حَفْنَةً مِن البطحاء، فجعل يَذُرُّها على رءوسهم، ويتلو: ﴿يس، والقرآن الحكيم﴾ الآيات. ومضى، فقال لهم قائلٌ: ما تَنتَظِرون؟ قالوا: محمدًا. قال: قد -واللهِ- مرَّ بكم. قالوا: واللهِ، ما أبصَرْناه. وقاموا يَنفُضون الترابَ عن رءوسهم، وخرج رسولُ الله ﷺ وأبو ب\",\"mawsoo-at-al-tafsir-al-ma-thoor|12\":\"﴿إِنَّا نَحۡنُ نُحۡیِ ٱلۡمَوۡتَىٰ وَنَكۡتُبُ مَا قَدَّمُوا۟ وَءَاثَـٰرَهُمۡۚ وَكُلَّ شَیۡءٍ أَحۡصَیۡنَـٰهُ فِیۤ إِمَامࣲ مُّبِینࣲ ۝١٢﴾ - نزول الآية\\n\\n٦٤٣٨٩- عن أبي سعيد الخدري -من طريق أبي نضرة- قال: كان بنو سَلِمة في ناحية من المدينة، فأرادوا أن ينتقلوا إلى قُرْب المسجد؛ فأنزل الله: ﴿إنّا نَحْنُ نُحْيِ المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهُمْ﴾، فدعاهم رسول الله ﷺ، فقال: «إنه يُكتب آثاركم». ثم قرأ عليهم الآية، فتركوا[[أخرجه الترمذي ٥/٤٣٨ (٣٥٠٦)، والحاكم ٢/٤٦٥ (٣٦٠٤)، وابن جرير ١٩/٤١٠، وابن أبي حاتم -كما في تفسير ابن كثير ٦/٥٦٦-.\\n\\nقال الترمذي: «هذا حديث حسن غريب مِن حديث الثوري». وقال الحاكم: «هذا حديث صحيح عجيب من حديث الثوري». وتعقَّبه الذهبيُّ في التلخيص بقوله: «تفرّد به إسحاقُ الأزرق عنه،\",\"mawsoo-at-al-tafsir-al-ma-thoor|38\":\"﴿وَٱلشَّمۡسُ تَجۡرِی لِمُسۡتَقَرࣲّ لَّهَاۚ ذَ ٰ⁠لِكَ تَقۡدِیرُ ٱلۡعَزِیزِ ٱلۡعَلِیمِ ۝٣٨﴾ - قراءات\\n\\n٦٤٦١٠- عن أبي ذرٍّ، قال: دخلتُ المسجدَ ورسولُ الله ﷺ جالس، فلما غربت الشمس قال: «يا أبا ذر، هل تدري أين تذهب هذه؟». قال: قلت: الله ورسوله أعلم. قال: «فإنها تذهب تستأذن في السجود، فيؤذن لها، وكأنها قد قيل لها: ارجعي من حيث جئت، فتطلع من مغربها». ثم قرأ: (وذَلِكَ مُسْتَقَرٌّ لَّها). في قراءة عبد الله [بن مسعود][[أخرجه البخاري ٩/١٢٥ (٧٤٢٤)، ومسلم ١/١٣٩ (١٥٩)، وابن جرير ١٩/٤٣٥.\\n\\nوهي قراءة شاذة.]]. (١٢/٣٤٧)\\n\\n٦٤٦١١- عن عبد الله بن مسعود، أنه كان يقرأ: (والشَّمْسُ تَجْرِي لا مُسْتَقَرَّ لَها)[[تفسير الثعلبي ٨/١٢٨، وأخرجه البغوي ٧/١٨.\\n\\nوهي قراءة شاذة، تروى أيضًا عن عكرمة. انظر: الجامع لأحكام القرآن ١٧\",\"ar-tafsir-al-tabari|8\":\"القول في تأويل قوله تعالى: ﴿إِنَّا جَعَلْنَا فِي أَعْنَاقِهِمْ أَغْلالا فَهِيَ إِلَى الأذْقَانِ فَهُمْ مُقْمَحُونَ (٨) وَجَعَلْنَا مِنْ بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَأَغْشَيْنَاهُمْ فَهُمْ لا يُبْصِرُونَ (٩) ﴾\\n\\nيقول تعالى ذكره: إنا جعلنا أيمان هؤلاء الكفار مغلولة إلى أعناقهم بالأغلال، فلا تُبسط بشيء من الخيرات. وهي في قراءة عبد الله فيما ذُكر ﴿إِنَّا جَعَلْنَا فِي أَيْمَانِهِمْ أَغْلالا فَهِيَ إِلَى الأذْقَانِ﴾ وقوله ﴿إِلَى الأذْقَانِ﴾ يعني: فأيمانهم مجموعة بالأغلال في أعناقهم، فكُني عن الأيمان، ولم يجر لها ذكر لمعرفة السامعين بمعنى الكلام، وأن الأغلال إذا كانت في الأعناق لم تكن إلا وأيدي المغلولين مجموعة بها إليها، فاستغنى بذكر كون الأغلال في الأعناق من ذكر الأيمان، ك\",\"ar-tafsir-al-tabari|12\":\"القول في تأويل قوله تعالى: ﴿إِنَّا نَحْنُ نُحْيِي الْمَوْتَى وَنَكْتُبُ مَا قَدَّمُوا وَآثَارَهُمْ وَكُلَّ شَيْءٍ أحْصَيْنَاهُ فِي إِمَامٍ مُبِينٍ (١٢) ﴾\\n\\nيقول تعالى ذكره ﴿إِنَّا نَحْنُ نُحْيِي الْمَوْتَى﴾ من خلقنا ﴿وَنَكْتُبُ مَا قَدَّمُوا﴾ في الدنيا من خير وشر، وصالح الأعمال وسيئها.\\n\\nوبنحو الذي قلنا في ذلك قال أهل التأويل.\\n\\nذكر من قال ذلك:\\n\\n⁕ حدثنا بشر، قال: ثنا يزيد، قال: ثنا سعيد، عن قتادة، قوله ﴿إِنَّا نَحْنُ نُحْيِي الْمَوْتَى وَنَكْتُبُ مَا قَدَّمُوا﴾ من عمل.\\n\\n⁕ حدثني يونس، قال: أخبرنا إبن وهب، قال: قال ابن زيد، في قوله ﴿وَنَكْتُبُ مَا قَدَّمُوا﴾ قال: ما عملوا.\\n\\n⁕ حدثني محمد بن عمرو، قال: ثنا أبو عاصم، قال: ثنا عيسى؛ وحدثني الحارث، قال: ثنا الحسن، قال: ثنا ورقاء، جميعا عن ابن أبي نجيح\",\"ar-tafsir-al-tabari|38\":\"القول في تأويل قوله تعالى: ﴿وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهَارَ فَإِذَا هُمْ مُظْلِمُونَ (٣٧) وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَهَا ذَلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ (٣٨) ﴾\\n\\nيقول تعالى ذكره: ودليل لهم أيضًا على قدرة الله على فعل كل ما شاء ﴿اللَّيْلُ نَسْلَخُ مِنْهُ النَّهَارَ﴾ يقول: ننزع عنه النهار. ومعنى \\\"منه\\\" في هذا الموضع: عنه، كأنه قيل: نسلخ عنه النهار، فنأتي بالظلمة ونذهب بالنهار. ومنه قوله ﴿وَاتْلُ عَلَيْهِمْ نَبَأَ الَّذِي آتَيْنَاهُ آيَاتِنَا فَانْسَلَخَ مِنْهَا﴾ أي: خرج منها وتركها، فكذلك انسلاخ الليل من النهار.\\n\\n* *\\n\\nوقوله ﴿فَإِذَا هُمْ مُظْلِمُونَ﴾\\n\\nيقول: فإذا هم قد صاروا في ظلمة بمجيء الليل.\\n\\nوقال قتادة في ذلك ماحدثنا بشر، قال: ثنا يزيد، قال: ثنا سعيد، عن ق\",\"tafsir-al-samarqandi|8\":\"ثم قوله تعالى: لِتُنْذِرَ يعني: لتخوف بالقرآن قَوْماً ما أُنْذِرَ آباؤُهُمْ يعني: كما أنذر آباؤهم الأولون فَهُمْ غافِلُونَ عن ذلك يعني: عما أنذر آباؤهم.\\n\\nثم قال عز وجل: لَقَدْ حَقَّ الْقَوْلُ أي: وجب القول بالعذاب عَلى أَكْثَرِهِمْ أي:\\n\\nعلى الكفار. ويقال: لَقَدْ حَقَّ الْقَوْلُ وهو قوله: لَأَمْلَأَنَّ جَهَنَّمَ [الأعراف: 18 وغيرها] ويقال:\\n\\nالْقَوْلُ كناية عن العذاب أي: وجب عليهم العذاب فَهُمْ لاَ يُؤْمِنُونَ يعني: لا يصدقون بالقرآن إِنَّا جَعَلْنا فِي أَعْناقِهِمْ أَغْلالًا قال مقاتل: نزلت في بني مخزوم، وذلك أن أبا جهل حلف لئن رأى النبيّ ﷺ ليدفعنه بحجر، فأتاه وهو يصلي، فرفع الحجر ليدمغه، فيبست يده إلى عنقه، والتزق الحجر بيده، ورجع إلى أصحابه، فخلصوا الحجر من يده. ورجل آخر من بني المغيرة، أتا\",\"tafsir-al-samarqandi|12\":\"ثم قال عز وجل: إِنَّما تُنْذِرُ مَنِ اتَّبَعَ الذِّكْرَ يعني تخوف بالقرآن من اتبع الذكر، يعني من قبل الموعظة وسمع القرآن وَخَشِيَ الرَّحْمنَ بِالْغَيْبِ يعني: أطاعه في الغيب فَبَشِّرْهُ بِمَغْفِرَةٍ في الدنيا وَأَجْرٍ كَرِيمٍ في الآخرة.\\n\\nثم قال عز وجل: إِنَّا نَحْنُ نُحْيِ الْمَوْتى يعني: نبعثهم في الآخرة وَنَكْتُبُ مَاَ قَدَّمُوا يعني: نحفظ ما أسلفوا، وما عملوا من أعمالهم. ويقال: وَنَكْتُبُ مَاَ قَدَّمُوا يعني:\\n\\nتكتب أعمالهم الكرام الكاتبون، وما عملوا من خير أو شر وَآثارَهُمْ يعني: ما استنوا من سنة خير أو شر عملوه، واقتدى بهم من بعدهم، فلهم مثل أجورهم، أو عليهم مثل أوزارهم من غير أن ينقص منه شيئاً، وهذا كقوله عز وجل: يُنَبَّؤُا الْإِنْسانُ يَوْمَئِذٍ بِما قَدَّمَ وَأَخَّرَ\\n\\n[القيامة: 14] وه\",\"tafsir-al-samarqandi|38\":\"ثم قال عز وجل: سُبْحانَ الَّذِي خَلَقَ الْأَزْواجَ كُلَّها يعني: تنزيهاً لله عز وجل الذي خلق الأصناف كلها مِمَّا تُنْبِتُ الْأَرْضُ يعني: ألواناً من النبات والثمار. ففي كل شيء خلق الله تعالى دليلاً على وحدانيته تعالى وربوبيته وَمِنْ أَنْفُسِهِمْ يعني: خلق من جنسهم أصناف الذكر والأنثى، وألواناً مختلفة وَمِمَّا لاَ يَعْلَمُونَ يعني: وخلق من الخلق ما لا يعلمون، وهذا كقوله: وَيَخْلُقُ مَا لاَ تَعْلَمُونَ [النحل: 8] .\\n\\nثم ذكر لهم دلالة أخرى ليعتبروا بها، فقال عز وجل: وَآيَةٌ لَهُمُ اللَّيْلُ يعني: علامة وحدانيته الليل نَسْلَخُ مِنْهُ النَّهارَ يعني: نخرج ونميز منه النهار فَإِذا هُمْ مُظْلِمُونَ يعني:\\n\\nداخلون في الظلمة. ويقال: يبقون في الظلمة. ويقال: إن الله خلق الدنيا مظلمة.\\n\\nثم قال: وَالشَّمْسُ \",\"tafsir-al-mawardi|8\":\"قَوْلُهُ عَزَّ وجَلَّ: ﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا﴾ فِيها ثَلاثَةُ أقاوِيلَ:\\n\\nأحَدُها: أنَّهُ مَثَلٌ ضَرَبَهُ اللَّهُ تَعالى لَهم في امْتِناعِهِمْ مِنَ الهُدى كامْتِناعِ المَغْلُولِ مِنَ التَّصَرُّفِ، قالَهُ يَحْيى بْنُ سَلّامٍ.\\n\\nالثّانِي: ما حَكاهُ السُّدِّيُّ أنَّ ناسًا مِن قُرَيْشٍ ائْتَمَرُوا بِالنَّبِيِّ ﷺ فَجاءُوا يُرِيدُونَ ذَلِكَ فَجُعِلَتْ أيْدِيهِمْ إلى أعْناقِهِمْ فَلَمْ يَسْتَطِيعُوا أنْ يَبْسُطُوا إلَيْهِ يَدًا.\\n\\nالثّالِثُ: أنَّ المُرادَ بِهِ جَعَلَ اللَّهُ سُبْحانَهُ لَهم في النّارِ مِنَ الأغْلالِ في أعْناقِهِمْ ويَكُونُ الجَعْلُ هاهُنا مَأْخُوذًا مِنَ الجُعالَةِ الَّتِي هي الأُجْرَةُ كَأنَّ جُعالَتَهم في النّارِ الأغْلالُ، حَكاهُ ابْنُ بَحْرٍ.\\n\\nوَفِي قَوْلِهِ: ﴿فِي أ\",\"tafsir-al-mawardi|12\":\"قَوْلُهُ عَزَّ وجَلَّ: ﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا﴾ فِيها ثَلاثَةُ أقاوِيلَ:\\n\\nأحَدُها: أنَّهُ مَثَلٌ ضَرَبَهُ اللَّهُ تَعالى لَهم في امْتِناعِهِمْ مِنَ الهُدى كامْتِناعِ المَغْلُولِ مِنَ التَّصَرُّفِ، قالَهُ يَحْيى بْنُ سَلّامٍ.\\n\\nالثّانِي: ما حَكاهُ السُّدِّيُّ أنَّ ناسًا مِن قُرَيْشٍ ائْتَمَرُوا بِالنَّبِيِّ ﷺ فَجاءُوا يُرِيدُونَ ذَلِكَ فَجُعِلَتْ أيْدِيهِمْ إلى أعْناقِهِمْ فَلَمْ يَسْتَطِيعُوا أنْ يَبْسُطُوا إلَيْهِ يَدًا.\\n\\nالثّالِثُ: أنَّ المُرادَ بِهِ جَعَلَ اللَّهُ سُبْحانَهُ لَهم في النّارِ مِنَ الأغْلالِ في أعْناقِهِمْ ويَكُونُ الجَعْلُ هاهُنا مَأْخُوذًا مِنَ الجُعالَةِ الَّتِي هي الأُجْرَةُ كَأنَّ جُعالَتَهم في النّارِ الأغْلالُ، حَكاهُ ابْنُ بَحْرٍ.\\n\\nوَفِي قَوْلِهِ: ﴿فِي أ\",\"tafsir-al-mawardi|38\":\"قَوْلُهُ عَزَّ وجَلَّ: ﴿وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنهُ النَّهارَ﴾ أيْ نْخُرِجُ مِنهُ النَّهارَ يَعْنِي ضَوْءَهُ، مَأْخُوذٌ مِن سَلْخِ الشّاةِ إذا خَرَجَتْ مِن جِلْدِها.\\n\\n﴿فَإذا هم مُظْلِمُونَ﴾ أيْ في ظُلْمَةٍ لِأنَّ ضَوْءَ النَّهارِ يَتَداخَلُ في الهَواءِ فَيُضِيءُ، فَإذا خَرَجَ مِنهُ أظْلَمَ.\\n\\n﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها﴾ فِيهِ ثَلاثَةُ أقاوِيلَ:\\n\\nأحَدُها: يَعْنِي لِانْتِهاءِ أمْرِها عِنْدَ انْقِضاءِ الدُّنْيا، حَكاهُ ابْنُ عِيسى.\\n\\nالثّانِي: لِوَقْتٍ واحِدٍ لا تَعْدُوهُ، قالَهُ قَتادَةُ.\\n\\nالثّالِثُ: أيْ: أبْعَدِ مَنازِلِها في الغُرُوبِ، ثُمَّ تَرْجِعُ إلى أدْنى مَنازِلَها، قالَهُ الكَلْبِيُّ.\\n\\nوَرَوى عِكْرِمَةُ عَنِ ابْنِ عَبّاسٍ أنَّهُ كانَ يَقْرَأُها: والشَّمْسُ تَجْرِ\",\"ar-tafsir-al-baghawi|8\":\"﴿تَنْزِيلَ الْعَزِيزِ الرَّحِيمِ﴾ ، قَرَأَ ابْنُ عَامِرٍ، وَحَمْزَةُ، وَالْكِسَائِيُّ، وَحَفْصٌ: \\\"تَنْزِيلَ\\\" بِنَصْبِ اللَّامِ كَأَنَّهُ قَالَ: نُزِّلَ تَنْزِيلًا وَقَرَأَ الْآخَرُونَ بِالرَّفْعِ، أَيْ: هُوَ تَنْزِيلُ الْعَزِيزِ الرَّحِيمِ.\\n\\n﴿لِتُنْذِرَ قَوْمًا مَا أُنْذِرَ آبَاؤُهُمْ﴾ ، قِيلَ: \\\"مَا\\\" لِلنَّفْيِ أَيْ: لَمْ يُنْذَرْ آبَاؤُهُمْ، لِأَنَّ قُرَيْشًا لَمْ يَأْتِهِمْ نَبِيٌّ قَبْلَ مُحَمَّدٍ ﷺ وَقِيلَ: \\\"مَا\\\" بِمَعْنَى الَّذِي، أَيْ: لِتُنْذِرَ قَوْمًا بِالَّذِي أُنْذِرَ آبَاؤُهُمْ، ﴿فَهُمْ غَافِلُونَ﴾ عَنِ الْإِيمَانِ وَالرُّشْدِ.\\n\\n﴿لَقَدْ حَقَّ الْقَوْلُ﴾ ، وَجَبَ الْعَذَابُ ﴿عَلَى أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ﴾ ، هَذَا كَقَوْلِهِ: \\\"وَلَكِنْ حَقَّتْ كَلِمَةُ الْعَذَابِ عَلَى \",\"ar-tafsir-al-baghawi|12\":\"﴿وَجَعَلْنَا مِنْ بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا﴾ ، قَرَأَ حَمْزَةُ وَالْكِسَائِيُّ وَحَفْصٌ: \\\"سَدًّا\\\" بِفَتْحِ السِّينِ، وَقَرَأَ الْآخَرُونَ بِضَمِّهَا، ﴿فَأَغْشَيْنَاهُمْ﴾ فَأَعْمَيْنَاهُمْ، مِنَ التَّغْشِيَةِ وَهِيَ التَّغْطِيَةُ، ﴿فَهُمْ لَا يُبْصِرُونَ﴾ سَبِيلَ الْهُدَى.\\n\\n﴿وَسَوَاءٌ عَلَيْهِمْ أَأَنْذَرْتَهُمْ أَمْ لَمْ تُنْذِرْهُمْ لَا يُؤْمِنُونَ﴾\\n\\n﴿إِنَّمَا تُنْذِرُ مَنِ اتَّبَعَ الذِّكْرَ﴾ ، يَعْنِي: إِنَّمَا يَنْفَعُ إِنْذَارُكُ مَنِ اتَّبَعَ الذِّكْرَ، يَعْنِي الْقُرْآنَ، فَعَمِلَ بِمَا فِيهِ، ﴿وَخَشِيَ الرَّحْمَنَ بِالْغَيْبِ فَبَشِّرْهُ بِمَغْفِرَةٍ وَأَجْرٍ كَرِيمٍ﴾ حَسَنٍ وَهُوَ الْجَنَّةُ.\\n\\n﴿إِنَّا نَحْنُ نُحْيِي الْمَوْتَى﴾ ، عِنْدَ الْبَعْثِ، ﴿وَنَكْتُب\",\"ar-tafsir-al-baghawi|38\":\"﴿وَجَعَلْنَا فِيهَا جَنَّاتٍ﴾ بَسَاتِينَ، ﴿مِنْ نَخِيلٍ وَأَعْنَابٍ وَفَجَّرْنَا فِيهَا﴾ فِي الْأَرْضِ، ﴿مِنَ الْعُيُونِ﴾ .\\n\\n﴿لِيَأْكُلُوا مِنْ ثَمَرِهِ﴾ أَيْ: مِنَ الثَّمَرِ الْحَاصِلِ بِالْمَاءِ ﴿وَمَا عَمِلَتْهُ﴾ قَرَأَ حَمْزَةُ وَالْكِسَائِيُّ وَأَبُو بَكْرٍ: \\\"عَمِلَتْ\\\" بِغَيْرِ هَاءٍ، وَقَرَأَ الْآخَرُونَ \\\"عَمِلَتْهُ\\\" بِالْهَاءِ أَيْ: يَأْكُلُونَ مِنَ الَّذِي عَمِلَتْهُ ﴿أَيْدِيهِمْ﴾ الزَّرْعَ وَالْغَرْسَ فَالْهَاءُ عَائِدَةٌ إِلَى \\\"مَا\\\" الَّتِي بِمَعْنَى الَّذِي. وَقِيلَ: \\\"مَا\\\" لِلنَّفْيِ فِي قَوْلِهِ \\\"مَا عَمِلَتْهُ\\\" أَيْ: وَجَدُوهَا مَعْمُولَةً وَلَمْ تَعْمَلْهَا أَيْدِيهِمْ وَلَا صُنْعَ لَهُمْ فِيهَا وَهَذَا مَعْنَى قَوْلِ الضَّحَّاكِ وَمُقَاتِلٍ.\\n\\nوَقِيلَ: أَرَادَ الْعُيُونَ وَالْأ\",\"al-kashshaf-al-zamakhshari|8\":\"ثم مثل تصميمهم على الكفر، وأنه لا سبيل إلى ارعوائهم بأن جعلهم كالمغلولين المقمخين:\\n\\nفي أنهم لا يلتفتون إلى الحق ولا يعطفون أعناقهم نحوه، ولا يطأطئون رءوسهم له، وكالحاصلين بين سدين لا يبصرون ما قدّامهم ولا ما خلفهم: في أن لا تأمل لهم ولا تبصر، وأنهم متعامون عن النظر في آيات الله. فإن قلت: ما معنى قوله فَهِيَ إِلَى الْأَذْقانِ؟ قلت: معناه: فالأغلال واصلة إلى الأذقان ملزوزة إليها، وذلك أن طوق الغل الذي في عنق المغلول، يكون ملتقى طرفيه تحت الذقن حلقة فيها رأس العمود، نادرا [[قوله «رأس العمود نادرا» أى شاذا، كما يفيده الصحاح. (ع)]] من الحلقة إلى الذقن، فلا تخليه يطأطئ رأسه ويوطئ قذاله [[قوله «ويوطئ قذاله» في الصحاح «القذال» : جماع مؤخر الرأس، فتدبر. (ع)]] ، فلا يزال مقمحا. والمقمح: الذي يرفع رأسه\",\"al-kashshaf-al-zamakhshari|12\":\"نُحْيِ الْمَوْتى نبعثهم بعد مماتهم. وعن الحسن: إحياؤهم: أن يخرجهم من الشرك إلى الإيمان وَنَكْتُبُ ما أسلفوا من الأعمال الصالحة وغيرها وما هلكوا عنه من أثر حسن، كعلم علموه، أو كتاب صنفوه، أو حبيس حبسوه، أو بناء بنوه: من مسجد أو رباط أو قنطرة أو نحو ذلك. أو سيئ، كوظيفة وظفها بعض الظلام على المسلمين، وسكة أحدث فيها تخسيرهم، وشيء أحدث فيه صدّ عن ذكر الله: من ألحان وملاه، وكذلك كل سنة حسنة أو سيئة يستن بها. ونحوه قوله تعالى يُنَبَّؤُا الْإِنْسانُ يَوْمَئِذٍ بِما قَدَّمَ وَأَخَّرَ\\n\\nأى: قدّم من أعماله، وأخر من آثاره. وقيل: هي آثار المشاءين إلى المساجد. وعن جابر: أردنا النقلة إلى المسجد والبقاع حوله [[أخرجه ابن حبان في الأول من الأول عن طريق أبى نضرة عنه. وأصله في مسلم.]] خالية، فبلغ ذلك رسول الله ﷺ\",\"al-kashshaf-al-zamakhshari|38\":\"وقرئ: تجرى إلى مستقر لها. وقرأ ابن مسعود: لا مستقرّ لها، أى: لا تزال تجرى لا تستقر. وقرئ: لا مستقر لها، على أنّ لا بمعنى ليس ذلِكَ الجري على ذلك التقدير والحساب الدقيق الذي تكل الفطن عن استخراجه وتتحير الأفهام في استنباطه. ما هو إلا تقدير الغالب بقدرته على كل مقدور، المحيط علما بكل معلوم. قرئ: والقمر رفعا على الابتداء، أو عطفا على الليل. يريد: من آياته القمر، ونصبا بفعل يفسره قدرناه، ولا بدّ في قَدَّرْناهُ مَنازِلَ من تقدير مضاف، لأنه لا معنى لتقدير نفس القمر منازل. والمعنى: قدرنا مسيره منازل وهي ثمانية وعشرون منزلا، ينزل القمر كل ليلة في واحد منها لا يتخطاه ولا يتقاصر عنه، على تقدير مستو لا يتفاوت، يسير فيها كل ليلة من المستهل إلى الثامنة والعشرين، ثم يستتر ليلتين أو ليلة إذا نقص الشهر، وهذ\",\"al-muharrar-al-wajiz-ibn-atiyyah|8\":\"(p-٢٣٥)قوله عزّ وجلّ:\\n\\n﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا فَهي إلى الأذْقانِ فَهم مُقْمَحُونَ﴾ ﴿وَجَعَلْنا مِن بَيْنِ أيْدِيهِمْ سَدًّا ومِن خَلْفِهِمْ سَدًّا فَأغْشَيْناهم فَهم لا يُبْصِرُونَ﴾\\n\\nقالَ مَكِّيٌّ: هي حَقِيقَةٌ في أحْوالِ الآخِرَةِ إذا دَخَلُوا النارَ، وقَوْلُهُ تَعالى: ﴿ \\\"فَأغْشَيْناهُمْ\\\"﴾ يُضْعِفُ هَذا القَوْلَ: لِأنَّ بَصَرَ الكافِرِ يَوْمَ القِيامَةِ إنَّما هو حَدِيدٌ، يَرى قُبْحَ حالِهِ. وقالَ الضِحاكُ: مَعْناهُ: مَنَعْناهم مِنَ النَفَقَةِ في سَبِيلِ اللهِ، كَما قالَ تَعالى: ﴿وَلا تَجْعَلْ يَدَكَ مَغْلُولَةً إلى عُنُقِكَ﴾ [الإسراء: ٢٩]. وقالَ ابْنُ عَبّاسٍ، وابْنُ إسْحَقَ: هي اسْتِعارَةٌ لِحالِ الكَفَرَةِ الَّذِينَ أرادُوا مُحَمَّدًا ﷺ بِسُوءٍ، فَجَعَلَ اللهُ تَعالى هَذا \",\"al-muharrar-al-wajiz-ibn-atiyyah|12\":\"قوله عزّ وجلّ:\\n\\n﴿وَسَواءٌ عَلَيْهِمْ أأنْذَرْتَهم أمْ لَمْ تُنْذِرْهم لا يُؤْمِنُونَ﴾ ﴿إنَّما تُنْذِرُ مَنِ اتَّبَعَ الذِكْرَ وخَشِيَ الرَحْمَنَ بِالغَيْبِ فَبَشِّرْهُ بِمَغْفِرَةٍ وأجْرٍ كَرِيمٍ﴾ ﴿إنّا نَحْنُ نُحْيِي المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهم وكُلَّ شَيْءٍ أحْصَيْناهُ في إمامٍ مُبِينٍ﴾\\n\\nهَذِهِ مُخاطَبَةٌ لِمُحَمَّدٍ عَلَيْهِ الصَلاةُ والسَلامُ، مُضَمِّنُها تَسْلِيَةٌ عنهُمْ، أيْ: أنَّهم قَدْ حُتِّمَ عَلَيْهِمْ بِالكُفْرِ، فَسَواءٌ إنْذارُكَ وتَرْكُهُ، والألِفُ في قَوْلِهِ تَعالى: ﴿ \\\"أأنْذَرْتَهُمْ\\\"﴾ ألِفُ التَسْوِيَةِ؛ لِأنَّها لَيْسَتْ بِاسْتِفْهامٍ، بَلِ المُتَفَهِّمُ والمُسْتَفْهَمُ مُسْتَوِيانِ في عِلْمِ ذَلِكَ.\\n\\nوقَرَأ الجُمْهُورُ: \\\"آنْذَرْتَهُمْ\\\" بِالمَدِّ، وقَرَأ ابْنُ\",\"al-muharrar-al-wajiz-ibn-atiyyah|38\":\"قوله عزّ وجلّ:\\n\\n﴿وَآيَةٌ لَهُمُ اللَيْلُ نَسْلَخُ مِنهُ النَهارَ فَإذا هم مُظْلِمُونَ﴾ ﴿والشَمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذَلِكَ تَقْدِيرُ العَزِيزِ العَلِيمِ﴾ ﴿والقَمَرَ قَدَّرْناهُ مَنازِلَ حَتّى عادَ كالعُرْجُونِ القَدِيمِ﴾ ﴿لا الشَمْسُ يَنْبَغِي لَها أنْ تُدْرِكَ القَمَرَ ولا اللَيْلُ سابِقُ النَهارِ وكُلٌّ في فَلَكٍ يَسْبَحُونَ﴾\\n\\nهَذِهِ الآياتُ جَعَلَها اللهُ تَعالى أدِلَّةً عَلى القُدْرَةِ ووُجُوبِ الأُلُوهِيَّةِ لَهُ، و\\\"نَسْلَخُ\\\" (p-٢٤٩)مَعْناهُ: نَكْشِطُ ونُقَشِّرُ، فَهي اسْتِعارَةٌ، و\\\"مُظْلِمُونَ\\\": داخِلُونَ في الظَلامِ، واسْتَدَلَّ قَوْمٌ مِن هَذِهِ الآيَةِ عَلى أنَّ اللَيْلَ أصْلٌ والنَهارَ فَرْعٌ طارِئٌ عَلَيْهِ، وفي ذَلِكَ نَظَرٌ.\\n\\nو\\\"مُسْتَقَرُّ الشَمْسِ\\\" - عَلى ما رُوِيَ في \",\"tafsir-ibn-al-jawzi|8\":\"﴿لَقَدْ حَقَّ القَوْلُ﴾ فِيهِ قَوْلانِ. أحَدُهُما: وجَبَ العَذابُ. والثّانِي: سَبَقَ القَوْلُ بِكُفْرِهِمْ.\\n\\n(p-٦)قَوْلُهُ تَعالى: ﴿عَلى أكْثَرِهِمْ﴾ يَعْنِي أهْلَ مَكَّةَ، وهَذِهِ إشارَةٌ إلى إرادَةِ اللَّهِ تَعالى السّابِقَةِ لِكُفْرِهِمْ ﴿فَهم لا يُؤْمِنُونَ﴾ لِما سَبَقَ مِنَ القَدَرِ بِذَلِكَ.\\n\\n﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا﴾ فِيهِ ثَلاثَةُ أقْوالٍ.\\n\\nأحَدُها: أنَّها مَثَلٌ، ولَيْسَ هُناكَ غِلٌّ حَقِيقَةً، قالَهُ أكْثَرُ المُحَقِّقِينَ، ثُمَّ لَهم فِيهِ ثَلاثَةُ أقْوالٍ. أحَدُها أنَّها مَثَلٌ لِمَنعِهِمْ عَنْ كُلِّ خَيْرٍ، قالَهُ قَتادَةُ. والثّانِي: لِحَبْسِهِمْ عَنِ الإنْفاقِ في سَبِيلِ اللَّهِ بِمَوانِعَ كالأغْلالِ، قالَهُ الفَرّاءُ، وابْنُ قُتَيْبَةَ. والثّالِثُ: لِمَنعِهِمْ مِ\",\"tafsir-ibn-al-jawzi|12\":\"﴿لَقَدْ حَقَّ القَوْلُ﴾ فِيهِ قَوْلانِ. أحَدُهُما: وجَبَ العَذابُ. والثّانِي: سَبَقَ القَوْلُ بِكُفْرِهِمْ.\\n\\n(p-٦)قَوْلُهُ تَعالى: ﴿عَلى أكْثَرِهِمْ﴾ يَعْنِي أهْلَ مَكَّةَ، وهَذِهِ إشارَةٌ إلى إرادَةِ اللَّهِ تَعالى السّابِقَةِ لِكُفْرِهِمْ ﴿فَهم لا يُؤْمِنُونَ﴾ لِما سَبَقَ مِنَ القَدَرِ بِذَلِكَ.\\n\\n﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا﴾ فِيهِ ثَلاثَةُ أقْوالٍ.\\n\\nأحَدُها: أنَّها مَثَلٌ، ولَيْسَ هُناكَ غِلٌّ حَقِيقَةً، قالَهُ أكْثَرُ المُحَقِّقِينَ، ثُمَّ لَهم فِيهِ ثَلاثَةُ أقْوالٍ. أحَدُها أنَّها مَثَلٌ لِمَنعِهِمْ عَنْ كُلِّ خَيْرٍ، قالَهُ قَتادَةُ. والثّانِي: لِحَبْسِهِمْ عَنِ الإنْفاقِ في سَبِيلِ اللَّهِ بِمَوانِعَ كالأغْلالِ، قالَهُ الفَرّاءُ، وابْنُ قُتَيْبَةَ. والثّالِثُ: لِمَنعِهِمْ مِ\",\"tafsir-ibn-al-jawzi|38\":\"قَوْلُهُ تَعالى: ﴿وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنهُ النَّهارَ﴾ أيْ: وعَلامَةٌ لَهم تَدُلُّ عَلى تَوْحِيدِنا وقُدْرَتِنا اللَّيْلُ نَسْلَخُ مِنهُ النَّهارَ؛ قالَ الفَرّاءُ: نَرْمِي بِالنَّهارِ عَنْهُ، و \\\"مِنهُ\\\" بِمَعْنى \\\"عَنْهُ\\\" . وقالَ أبُو عُبَيْدَةَ: نُخْرِجُ مِنهُ النَّهارَ ونُمَيِّزُهُ مِنهُ فَتَجِيءُ الظُّلْمَةُ، قالَ الماوَرْدِيُّ: وذَلِكَ أنَّ ضَوْءَ النَّهارِ يَتَداخَلُ في الهَواءِ فَيُضِيءُ، فَإذا خَرَجَ مِنهُ أظْلَمَ. وقَوْلُهُ: ﴿فَإذا هم مُظْلِمُونَ﴾ أيْ: داخِلُونَ في الظَّلامِ.\\n\\n﴿والشَّمْسُ﴾ أيْ: وآَيَةٌ لَهُمُ الشَّمْسُ ﴿تَجْرِي لِمُسْتَقَرٍّ لَها﴾ وفِيهِ أرْبَعَةُ أقَوْالٍ.\\n\\nأحَدُها: إلى مَوْضِعِ قَرارِها؛ رَوى أبُو ذَرٍّ قالَ: «سَألْتُ رَسُولَ اللَّهِ ﷺ عَنْ قَوْلِهِ: ﴿ل\",\"tafsir-al-razi|8\":\"ثُمَّ قالَ تَعالى: ﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالًا فَهي إلى الأذْقانِ فَهم مُقْمَحُونَ﴾ .\\n\\nلَمّا بَيَّنَ أنَّهم لا يُؤْمِنُونَ بَيَّنَ أنَّ ذَلِكَ مِنَ اللَّهِ فَقالَ: ﴿إنّا جَعَلْنا﴾ وفِيهِ وُجُوهٌ:\\n\\nأحَدُها: أنَّ المُرادَ إنّا جَعَلْناهم مُمْسِكِينَ لا يُنْفِقُونَ في سَبِيلِ اللَّهِ كَما قالَ تَعالى: ﴿ولا تَجْعَلْ يَدَكَ مَغْلُولَةً إلى عُنُقِكَ﴾ (الإسْراءِ: ٢٩) .\\n\\nوالثّانِي: أنَّ الآيَةَ نَزَلَتْ في أبِي جَهْلٍ وصاحِبَيْهِ المَخْزُومِيَّيْنِ حَيْثُ «حَلَفَ أبُو جَهْلٍ أنَّهُ يَرْضَخُ رَأْسَ مُحَمَّدٍ، فَرَآهُ ساجِدًا فَأخَذَ صَخْرَةً ورَفَعَها لِيُرْسِلَها عَلى رَأْسِهِ فالتَزَقَتْ بِيَدِهِ ويَدُهُ بِعُنُقِهِ» .\\n\\nوالثّالِثُ: وهو الأقْوى وأشَدُّ مُناسَبَةً لِما تَقَدَّمَ وهو أنَّ ذَ\",\"tafsir-al-razi|12\":\"ثُمَّ قالَ تَعالى: ﴿إنّا نَحْنُ نُحْيِي المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهم وكُلَّ شَيْءٍ أحْصَيْناهُ في إمامٍ مُبِينٍ﴾ .\\n\\nفِي التَّرْتِيبِ وُجُوهٌ:\\n\\nأحَدُها: إنَّ اللَّهَ تَعالى لَمّا بَيَّنَ الرِّسالَةَ، وهو أصْلٌ مِنَ الأُصُولِ الثَّلاثَةِ الَّتِي يَصِيرُ بِها المُكَلَّفُ مُؤْمِنًا مُسْلِمًا ذَكَرَ أصْلًا آخَرَ وهو الحَشْرُ.\\n\\nوثانِيها: وهو أنَّ اللَّهَ تَعالى لَمّا ذَكَرَ الإنْذارَ والبِشارَةَ بِقَوْلِهِ: ﴿فَبَشِّرْهُ بِمَغْفِرَةٍ﴾ ولَمْ يَظْهَرْ ذَلِكَ بِكَمالِهِ في الدُّنْيا، فَقالَ: إنْ لَمْ يُرَ في الدُّنْيا فاللَّهُ يُحْيِي المَوْتى ويَجْزِي المُنْذِرِينَ ويَجْزِي المُبَشِّرِينَ.\\n\\nوثالِثُها: أنَّهُ تَعالى لَمّا ذَكَرَ خَشْيَةَ الرَّحْمَنِ بِالغَيْبِ ذَكَرَ ما يُؤَكِّدُهُ، وهو إح\",\"tafsir-al-razi|38\":\"وقَوْلُهُ تَعالى: ﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذَلِكَ تَقْدِيرُ العَزِيزِ العَلِيمِ﴾\\n\\nيَحْتَمِلُ أنْ يَكُونَ الواوُ لِلْعَطْفِ عَلى اللَّيْلِ، تَقْدِيرُهُ: وآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ والشَّمْسُ تَجْرِي والقَمَرُ قَدَّرْناهُ، فَهي كُلُّها آيَةٌ، وقَوْلُهُ: ﴿والشَّمْسُ تَجْرِي﴾ إشارَةٌ إلى سَبَبِ سَلْخِ النَّهارِ، فَإنَّها تَجْرِي لِمُسْتَقَرٍّ لَها وهو وقْتُ الغُرُوبِ فَيَنْسَلِخُ النَّهارُ، وفائِدَةُ ذِكْرِ السَّبَبِ هو أنَّ اللَّهَ لَمّا قالَ: نَسْلَخُ مِنهُ النَّهارَ، وكانَ غَيْرُ بَعِيدٍ مِنَ الجُهّالِ أنْ يَقُولَ قائِلٌ مِنهم: سَلْخُ النَّهارِ لَيْسَ مِنَ اللَّهِ إنَّما يُسْلَخُ النَّهارُ بِغُرُوبِ الشَّمْسِ، فَقالَ تَعالى: ﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها﴾ إشارَةً \",\"ar-tafseer-al-qurtubi|8\":\"قَوْلُهُ تَعَالَى: ﴿لِتُنْذِرَ قَوْماً ما أُنْذِرَ آباؤُهُمْ﴾ \\\"قَوْماً\\\" لَا مَوْضِعَ لَهَا مِنَ الْإِعْرَابِ عِنْدَ أَكْثَرِ أَهْلِ التَّفْسِيرِ مِنْهُمْ قَتَادَةُ، لِأَنَّهَا نَفْيٌ وَالْمَعْنَى: لِتُنْذِرَ قَوْمًا مَا أَتَى آبَاءَهُمْ قَبْلَكَ نَذِيرٌ. وَقِيلَ: هِيَ بِمَعْنَى الَّذِي فَالْمَعْنَى: لِتُنْذِرَهُمْ مِثْلَ مَا أُنْذِرَ آبَاؤُهُمْ، قَالَهُ ابْنُ عَبَّاسٍ وَعِكْرِمَةُ وقتادة أيضا. وقيل: إن \\\"قَوْماً\\\" وَالْفِعْلَ مَصْدَرٌ، أَيْ لِتُنْذِرَ قَوْمًا إِنْذَارَ آبَائِهِمْ. ثُمَّ يَجُوزُ أَنْ تَكُونَ الْعَرَبُ قَدْ بَلَغَتْهُمْ بِالتَّوَاتُرِ أَخْبَارُ الْأَنْبِيَاءِ، فَالْمَعْنَى لَمْ يُنْذَرُوا بِرَسُولٍ مِنْ أَنْفُسِهِمْ. وَيَجُوزُ أَنْ يَكُونَ بَلَغَهُمُ الْخَبَرُ وَلَكِنْ غَفَلُوا \",\"ar-tafseer-al-qurtubi|12\":\"فِيهِ أَرْبَعُ مَسَائِلَ الْأُولَى- قَوْلُهُ تَعَالَى: ﴿إِنَّا نَحْنُ نُحْيِ الْمَوْتى ﴾ أَخْبَرَنَا تَعَالَى بِإِحْيَائِهِ الْمَوْتَى رَدًّا عَلَى الْكَفَرَةِ. وَقَالَ الضَّحَّاكُ وَالْحَسَنُ: أَيْ نُحْيِيهِمْ بِالْإِيمَانِ بَعْدَ الْجَهْلِ، وَالْأَوَّلُ أَظْهَرُ أَيْ نُحْيِيهِمْ بِالْبَعْثِ لِلْجَزَاءِ. ثُمَّ تَوَعَّدَهُمْ بِذِكْرِهِ كَتْبَ الْآثَارِ وَهِيَ الثانية- وإحصاء كل شي وَكُلِّ مَا يَصْنَعُهُ الْإِنْسَانُ. قَالَ قَتَادَةُ: مَعْنَاهُ مِنْ عَمَلٍ. وَقَالَهُ مُجَاهِدٌ وَابْنُ زَيْدٍ. وَنَظِيرُهُ قوله: \\\"عَلِمَتْ نَفْسٌ ما قَدَّمَتْ وَأَخَّرَتْ\\\": [الانفطار: ٥] وقوله: ﴿يُنَبَّأْ الْإِنْسانُ يَوْمَئِذٍ بِما قَدَّمَ وَأَخَّرَ﴾ [الْقِيَامَةِ: ١٣]، وَقَالَ: ﴿اتَّقُوا اللَّهَ وَلْتَنْظُرْ نَ\",\"ar-tafseer-al-qurtubi|38\":\"قَوْلُهُ تَعَالَى: ﴿وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهارَ﴾ أَيْ وَعَلَامَةٌ دَالَّةٌ على توحيد الله وقدرته ووجوب إلاهيته. وَالسَّلْخُ: الْكَشْطُ وَالنَّزْعُ، يُقَالُ: سَلَخَهُ اللَّهُ مِنْ دِينِهِ، ثُمَّ تُسْتَعْمَلُ بِمَعْنَى الْإِخْرَاجِ. وَقَدْ جَعَلَ ذَهَابَ الضَّوْءِ وَمَجِيءَ الظُّلْمَةِ كَالسَّلْخِ مِنَ الشَّيْءِ وَظُهُورِ الْمَسْلُوخِ فَهِيَ اسْتِعَارَةٌ. وَ (مُظْلِمُونَ) دَاخِلُونَ فِي الظَّلَامِ، يُقَالُ: أَظْلَمْنَا أَيْ دَخَلْنَا فِي ظَلَامِ اللَّيْلِ، وَأَظْهَرْنَا دَخَلْنَا فِي وَقْتِ الظُّهْرِ، وَكَذَلِكَ أَصْبَحْنَا وَأَضْحَيْنَا وَأَمْسَيْنَا. وَقِيلَ: \\\"مِنْهُ\\\" بِمَعْنَى عَنْهُ، وَالْمَعْنَى نَسْلَخُ عَنْهُ ضِيَاءَ النَّهَارِ. \\\"فَإِذا هُمْ مُظْلِمُونَ\\\" أَيْ فِي \",\"tafsir-al-baydawi|8\":\"﴿لَقَدْ حَقَّ القَوْلُ عَلى أكْثَرِهِمْ﴾ يَعْنِي قَوْلَهُ: ﴿لأمْلأنَّ جَهَنَّمَ مِنَ الجِنَّةِ والنّاسِ أجْمَعِينَ﴾ . ﴿فَهم لا يُؤْمِنُونَ﴾ لِأنَّهم مِمَّنْ عَلِمَ اللَّهُ أنَّهم لا يُؤْمِنُونَ.(p-264)\\n\\n﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا﴾ تَقْرِيرٌ لِتَصْمِيمِهِمْ عَلى الكُفْرِ والطَّبْعِ عَلى قُلُوبِهِمْ بِحَيْثُ لا تُغْنِي عَنْهُمُ الآياتُ والنُّذُرُ، بِتَمْثِيلِهِمْ بِالَّذِينَ غُلَّتْ أعْناقُهم. ﴿فَهِيَ إلى الأذْقانِ﴾ فالأغْلالُ واصِلَةٌ إلى أذْقانِهِمْ فَلا تُخَلِّيهِمْ يُطَأْطِئُونَ رُؤُوسَهم لَهُ. ﴿فَهم مُقْمَحُونَ﴾ رافِعُونَ رُؤُوسَهم غاضُّونَ أبْصارَهم في أنَّهم لا يَلْتَفِتُونَ لَفْتَ الحَقِّ ولا يَعْطِفُونَ أعْناقَهم نَحْوَهُ ولا يُطَأْطِئُونَ رُؤُوسَهم لَهُ.\\n\\n﴿وَجَعَلْنا مِن ب\",\"tafsir-al-baydawi|12\":\"﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾ الأمْواتَ بِالبَعْثِ أوِ الجُهّالَ بِالهِدايَةِ. ﴿وَنَكْتُبُ ما قَدَّمُوا﴾ ما أسْلَفُوا مِنَ الأعْمالِ الصّالِحَةِ والطّالِحَةِ. ﴿وَآثارَهُمْ﴾ الحَسَنَةَ كَعِلْمٍ عَلَّمُوهُ وحَبِيسٍ وقَفُوهُ، والسَّيِّئَةَ كَإشاعَةِ باطِلٍ وتَأْسِيسِ ظُلْمٍ.\\n\\n﴿وَكُلَّ شَيْءٍ أحْصَيْناهُ في إمامٍ مُبِينٍ﴾ يَعْنِي اللَّوْحَ المَحْفُوظَ.\",\"tafsir-al-baydawi|38\":\"﴿وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنهُ النَّهارَ﴾ نُزِيلُهُ ونَكْشِفُهُ عَنْ مَكانِهِ مُسْتَعارٌ مِن سَلْخِ الجِلْدِ والكَلامُ في إعْرابِهِ ما سَبَقَ. ﴿فَإذا هم مُظْلِمُونَ﴾ داخِلُونَ في الظَّلامِ.\\n\\n﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها﴾ لِحَدٍّ مُعَيَّنٍ يَنْتَهِي إلَيْهِ دَوْرُها، فَشُبِّهَ بِمُسْتَقَرِّ المُسافِرِ إذا قَطَعَ مَسِيرَهُ، أوْ لِكَبِدِ السَّماءِ فَإنَّ حَرَكَتَها فِيهِ يُوجَدُ فِيها بُطْءٌ بِحَيْثُ يُظَنُّ أنَّ لَها هُناكَ وقْفَةً قالَ:\\n\\nوالشَّمْسُ حَيْرى لَها بِالجَوِّ تَدْوِيمُ\\n\\nأوْ لِاسْتِقْرارٍ لَها عَلى نَهْجٍ مَخْصُوصٍ، أوْ لِمُنْتَهى مُقَدَّرٍ لِكُلِّ يَوْمٍ مِنَ المَشارِقِ والمَغارِبِ فَإنَّ لَها في دَوْرِها ثَلاثَمِائَةٍ وسِتِّينَ مَشْرِقًا ومَغْرِبًا، تَطْلُعُ كُ\",\"tafsir-al-nasafi|8\":\"﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا فَهي إلى الأذْقانِ﴾، مَعْناهُ: فالأغْلالُ واصِلَةٌ إلى الأذْقانِ، مَلْزُوزَةٌ إلَيْها،\\n\\n﴿فَهم مُقْمَحُونَ﴾، مَرْفُوعَةٌ رءوسهُمْ، يُقالُ: \\\"قَمَحَ (p-٩٧)البَعِيرُ، فَهو قامِحٌ\\\"، إذا رُوِيَ فَرَفَعَ رَأْسَهُ، وهَذا لِأنَّ طَوْقَ الغَلِّ الَّذِي في عُنُقِ المَغْلُولِ يَكُونُ في مُلْتَقى طَرَفَيْهِ تَحْتَ الذَقَنِ حَلْقَةٌ فِيها رَأْسُ العَمُودِ، خارِجًا مِنَ الحَلْقَةِ إلى الذَقَنِ، فَلا يُخَلِّيهِ يُطَأْطِئُ رَأْسَهُ، فَلا يَزالُ مُقْمَحًا.\",\"tafsir-al-nasafi|12\":\"﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾، لِبَعْثِهِمْ بَعْدَ مَماتِهِمْ، أوْ نُخْرِجُهم مِنَ الشِرْكِ إلى الإيمانِ،\\n\\n﴿وَنَكْتُبُ ما قَدَّمُوا﴾، ما أسْلَفُوا مِنَ الأعْمالِ الصالِحاتِ، وغَيْرِها، (p-٩٨)﴿وَآثارَهُمْ﴾، ما هَلَكُوا عَنْهُ مِن أثَرٍ حَسَنٍ، كَعِلْمٍ عَلَّمُوهُ، أوْ كِتابٍ صَنَّفُوهُ، أوْ حَبِيسٍ، أوْ رِباطٍ، أوْ مَسْجِدٍ صَنَعُوهُ، أوْ سَيِّئٍ، كَوَظِيفَةٍ وظَّفَها بَعْضُ الظَلَمَةِ، وكَذَلِكَ كُلُّ سُنَّةٍ حَسَنَةٍ، أوْ سَيِّئَةٍ يُسْتَنُّ بِها، ونَحْوُهُ قَوْلُهُ (تَعالى): ﴿يُنَبَّأُ الإنْسانُ يَوْمَئِذٍ بِما قَدَّمَ وأخَّرَ﴾ [القيامة: ١٣]، قَدَّمَ مِن أعْمالِهِ، وأخَّرَ مِن آثارِهِ، وقِيلَ: هي خُطاهم إلى الجُمُعَةِ، أوْ إلى الجَماعَةِ،\\n\\n﴿وَكُلَّ شَيْءٍ أحْصَيْناهُ﴾، عَدَدْناهُ، وبَيَّن\",\"tafsir-al-nasafi|38\":\"﴿والشَمْسُ تَجْرِي﴾، وآيَةٌ لَهُمُ الشَمْسُ تَجْرِي،\\n\\n﴿لِمُسْتَقَرٍّ لَها﴾، لِحَدٍّ لَها مُؤَقَّتٍ، مُقَدَّرٍ، تَنْتَهِي إلَيْهِ مِن فَلَكِها في آخِرِ السَنَةِ، شُبِّهَ بِمُسْتَقَرِّ المُسافِرِ، إذا قَطَعَ مَسِيرَهُ، أوْ: \\\"لِحَدٍّ لَها مِن مَسِيرِها كُلَّ يَوْمٍ، في مَرائِي عُيُونِنا\\\"، وهو المَغْرِبُ، أوْ لِانْتِهاءِ أمْرِها عِنْدَ انْقِضاءِ الدُنْيا،\\n\\n﴿ذَلِكَ﴾، اَلْجَرْيُ عَلى ذَلِكَ التَقْدِيرِ، والحِسابِ الدَقِيقِ،\\n\\n﴿تَقْدِيرُ العَزِيزِ﴾، اَلْغالِبِ بِقُدْرَتِهِ عَلى كُلِّ مَقْدُورٍ،\\n\\n﴿العَلِيمِ﴾، بِكُلِّ مَعْلُومٍ.\",\"tafsir-ibn-juzay|8\":\"﴿إِنَّا جَعَلْنَا فِيۤ أَعْناقِهِمْ أَغْلاَلاً﴾ الآية: فيها ثلاثة أقوال: الأول أنها عبارة عن تماديهم على الكفر، ومنع الله لهم من الإيمان، فشبههم بمن جعل في عنقه غل يمنعه من الالتفات، وغطى على بصره فصار لا يرى، والثاني أنها عبارة عن كفهم عن إذاية النبي ﷺ حين أراد أبو جهل أن يرميه بحجر، فرجع عنه فزعاً مرعوباً، والثالث: أن ذلك حقيقة في حالهم في جهنم، والأول أظهر وأرجح لقوله قبلها ﴿فَهُمْ لاَ يُؤمِنُونَ﴾ وقوله بعدها ﴿وَسَوَآءُ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لاَ يُؤمِنُونَ﴾ ﴿فَهِىَ إِلَى ٱلأَذْقَانِ﴾ الذقن هي طرف الوجه حيث تنبت اللحية، والضمير للأغلال، وذلك أن الغل حلقة في العنق، فإذا كان واسعاً عريضاً وصل إلى الدقن فكان أشدّ على المغلول، وقيل: الضمير للأيدي على أنها لم يتقدم له\",\"tafsir-ibn-juzay|12\":\"﴿إِنَّا جَعَلْنَا فِيۤ أَعْناقِهِمْ أَغْلاَلاً﴾ الآية: فيها ثلاثة أقوال: الأول أنها عبارة عن تماديهم على الكفر، ومنع الله لهم من الإيمان، فشبههم بمن جعل في عنقه غل يمنعه من الالتفات، وغطى على بصره فصار لا يرى، والثاني أنها عبارة عن كفهم عن إذاية النبي ﷺ حين أراد أبو جهل أن يرميه بحجر، فرجع عنه فزعاً مرعوباً، والثالث: أن ذلك حقيقة في حالهم في جهنم، والأول أظهر وأرجح لقوله قبلها ﴿فَهُمْ لاَ يُؤمِنُونَ﴾ وقوله بعدها ﴿وَسَوَآءُ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لاَ يُؤمِنُونَ﴾ ﴿فَهِىَ إِلَى ٱلأَذْقَانِ﴾ الذقن هي طرف الوجه حيث تنبت اللحية، والضمير للأغلال، وذلك أن الغل حلقة في العنق، فإذا كان واسعاً عريضاً وصل إلى الدقن فكان أشدّ على المغلول، وقيل: الضمير للأيدي على أنها لم يتقدم له\",\"tafsir-ibn-juzay|38\":\"﴿وَٱلشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَّهَـا﴾ أي لحد موقت تنتهي إليه من فلكها، وهي نهاية جريها إلى أن ترجع في المنقلبين الشتاء والصيف، وقيل: مستقرها: وقوفها كل وقت زوال، بدليل وقوف الظل حينئذ، وقيل: مستقرها يوم القيامة حين تكوّر، وفي الحديث: \\\"مستقرها تحت العرش تسجد فيه كل ليلة بعد غروبها\\\"، وهذا أصح الأقوال لوروده عن النبي ﷺ في الحديث المروي في البخاري عن أبي ذر، وقرئ ﴿لا مستقر لها﴾ أي لا تستقر عن جريها.\",\"ar-tafsir-ibn-kathir|8\":\"يَقُولُ تَعَالَى: إِنَّا جَعَلَنَا هَؤُلَاءِ الْمَحْتُومَ عَلَيْهِمْ بِالشَّقَاءِ نِسْبَتُهُمْ إِلَى الْوُصُولِ إِلَى الْهُدَى كَنِسْبَةِ مَنْ جُعل فِي عُنُقِهِ غِلٌّ، فجَمَع يَدَيْهِ مَعَ عُنُقِهِ تَحْتَ ذَقَنِهِ، فَارْتَفَعَ رأسُه، فَصَارَ مقمَحا؛ وَلِهَذَا قَالَ: ﴿فَهُمْ مُقْمَحُونَ﴾ وَالْمُقْمَحُ: هُوَ الرَّافِعُ رَأْسَهُ، كَمَا قَالَتْ أُمُّ زَرْع فِي كَلَامِهَا: \\\"وَأَشْرَبُ فأتقمَّح\\\" أي: أَشْرَبُ فَأُرْوَى، وَأَرْفَعُ رَأْسِي تَهْنِيئًا وتَرَوّيا. وَاكْتَفَى بِذِكْرِ الْغِلِّ فِي الْعُنُقِ عَنْ ذِكْرِ الْيَدَيْنِ، وَإِنْ كَانَتَا مُرَادَتَيْنِ، كَمَا قَالَ الشَّاعِرُ [[البيت في تفسير الطبري (٢٢/٩٨) .]] :\\n\\nفَمَا أدْري إذَا يَمَّمْتُ أرْضًا ... أُرِيدُ الخَيْرَ أَيُّهُمَا يَليني ...\\n\\nأال\",\"ar-tafsir-ibn-kathir|12\":\"يَقُولُ تَعَالَى: إِنَّا جَعَلَنَا هَؤُلَاءِ الْمَحْتُومَ عَلَيْهِمْ بِالشَّقَاءِ نِسْبَتُهُمْ إِلَى الْوُصُولِ إِلَى الْهُدَى كَنِسْبَةِ مَنْ جُعل فِي عُنُقِهِ غِلٌّ، فجَمَع يَدَيْهِ مَعَ عُنُقِهِ تَحْتَ ذَقَنِهِ، فَارْتَفَعَ رأسُه، فَصَارَ مقمَحا؛ وَلِهَذَا قَالَ: ﴿فَهُمْ مُقْمَحُونَ﴾ وَالْمُقْمَحُ: هُوَ الرَّافِعُ رَأْسَهُ، كَمَا قَالَتْ أُمُّ زَرْع فِي كَلَامِهَا: \\\"وَأَشْرَبُ فأتقمَّح\\\" أي: أَشْرَبُ فَأُرْوَى، وَأَرْفَعُ رَأْسِي تَهْنِيئًا وتَرَوّيا. وَاكْتَفَى بِذِكْرِ الْغِلِّ فِي الْعُنُقِ عَنْ ذِكْرِ الْيَدَيْنِ، وَإِنْ كَانَتَا مُرَادَتَيْنِ، كَمَا قَالَ الشَّاعِرُ [[البيت في تفسير الطبري (٢٢/٩٨) .]] :\\n\\nفَمَا أدْري إذَا يَمَّمْتُ أرْضًا ... أُرِيدُ الخَيْرَ أَيُّهُمَا يَليني ...\\n\\nأال\",\"ar-tafsir-ibn-kathir|38\":\"يَقُولُ تَعَالَى: وَمِنَ الدَّلَالَةِ لَهُمْ عَلَى قُدْرَتِهِ تَعَالَى الْعَظِيمَةِ خَلْقُ اللَّيْلِ وَالنَّهَارِ، هَذَا بِظَلَامِهِ وَهَذَا بِضِيَائِهِ، وَجَعَلُهُمَا يَتَعَاقَبَانِ، يَجِيءُ هَذَا فَيَذْهَبُ هَذَا، وَيَذْهَبُ هَذَا فَيَجِيءُ هَذَا، كَمَا قَالَ: ﴿يُغْشِي اللَّيْلَ النَّهَارَ يَطْلُبُهُ حَثِيثًا﴾ [الْأَعْرَافِ: ٥٤] ؛ وَلِهَذَا قَالَ عَزَّ وَجَلَّ هَاهُنَا: ﴿وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهَارَ﴾ أَيْ: نَصْرِمُهُ مِنْهُ فَيَذْهَبُ، فَيَقْبَلُ اللَّيْلُ؛ وَلِهَذَا قَالَ: ﴿فَإِذَا هُمْ مُظْلِمُونَ﴾ كَمَا جَاءَ فِي الْحَدِيثِ: \\\"إِذَا أَقْبَلَ اللَّيْلُ مِنْ هَاهُنَا، وَأَدْبَرَ النَّهَارُ مِنْ هَاهُنَا، وَغَرَبَتِ الشَّمْسُ، فَقَدْ أَفْطَرَ الصَّائِمُ\\\". [[رواه البخا\",\"ar-tafsir-al-jalalayn|8\":\"﴿إنّا جَعَلْنا فِي أعْناقهمْ أغْلالًا﴾ بِأَنْ تُضَمّ إلَيْها الأَيْدِي لِأَنَّ الغُلّ يَجْمَع اليَد إلى العُنُق ﴿فَهِيَ﴾ أيْ الأَيْدِي مَجْمُوعَة ﴿إلى الأَذْقان﴾ جَمْع ذَقَن وهِيَ مُجْتَمَع اللَّحْيَيْنِ ﴿فَهُمْ مُقْمَحُونَ﴾ رافِعُونَ رُءُوسهمْ لا يَسْتَطِيعُونَ خَفْضها وهَذا تَمْثِيل والمُراد أنَّهُمْ لا يُذْعِنُونَ لِلْإيمانِ ولا يُخْفِضُونَ رُءُوسهمْ لَهُ\",\"ar-tafsir-al-jalalayn|12\":\"﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾ لِلْبَعْثِ ﴿ونَكْتُب﴾ فِي اللَّوْح المَحْفُوظ ﴿ما قَدَّمُوا﴾ فِي حَياتهمْ مِن خَيْر وشَرّ لِيُجازُوا عَلَيْهِ ﴿وآثارهمْ﴾ ما اسْتَنَّ بِهِ بَعْدهمْ ﴿وكُلّ شَيْء﴾ نَصَبَهُ بِفِعْلٍ يُفَسِّرهُ ﴿أحْصَيْناهُ﴾ ضَبَطْناهُ ﴿فِي إمام مُبِين﴾ كِتاب بَيِّن هُوَ اللَّوْح المَحْفُوظ\",\"ar-tafsir-al-jalalayn|38\":\"﴿والشَّمْس تَجْرِي﴾ إلى آخِره مِن جُمْلَة الآيَة لَهُمْ: أوْ آيَة أُخْرى والقَمَر كَذَلِكَ ﴿لِمُسْتَقَرٍّ لَها﴾ أيْ إلَيْهِ لا تَتَجاوَزهُ ﴿ذَلِكَ﴾ أيْ جَرْيها ﴿تَقْدِير العَزِيز﴾ فِي مُلْكه ﴿العَلِيم﴾ بِخَلْقِهِ\",\"al-durr-al-manthur|8\":\"(p-٣١٠)سُورَةُ يس\\n\\nمَكِّيَّةٌ\\n\\nأخْرَجَ ابْنُ الضُّرَيْسِ والنَّحّاسُ، وابْنُ مَرْدُويَهْ والبَيْهَقِيُّ في ”الدَّلائِلِ“ عَنِ ابْنِ عَبّاسٍ قالَ: نَزَلَتْ سُورَةُ ”يس“ بِمَكَّةَ.\\n\\nوأخْرَجَ ابْنُ مَرْدُويَهْ عَنْ عائِشَةَ قالَتْ: نَزَلَتْ سُورَةُ ”يس“ بِمَكَّةَ.\\n\\nوأخْرَجَ الدّارِمِيُّ، والتِّرْمِذِيُّ ومُحَمَّدُ بْنُ نَصْرٍ والبَيْهَقِيُّ في ”شُعَبِ الإيمانِ“ عَنْ أنَسٍ قالَ: قالَ رَسُولُ اللَّهِ ﷺ: «إنَّ لِكُلِّ شَيْء ٍ قَلْبًا وقَلْبُ القُرْآنِ ”يس“، ومَن قَرَأ: ”يس“ كَتَبَ اللَّهُ لَهُ بِقِراءَتِها قِراءَةَ القُرْآنِ عَشْرَ مَرّاتٍ» .\\n\\nوأخْرَجَ البَزّارُ عَنْ أبِي هُرَيْرَةَ قالَ: قالَ رَسُولُ اللَّهِ ﷺ: «إنَّ لِكُلِّ شَيْءٍ قَلْبًا، وقَلْبُ القُرْآنِ يس» .\\n\\n(p-٣١١)وأخْرَجَ الدّارِمِيُّ وأ\",\"al-durr-al-manthur|12\":\"قَوْلُهُ تَعالى: ﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾ الآيَةَ.\\n\\nأخْرَجَ عَبْدُ الرَّزّاقِ، والتِّرْمِذِيُّ وحَسَّنَهُ والبَزّارُ، وابْنُ جَرِيرٍ، وابْنُ المُنْذِرِ، وابْنُ أبِي حاتِمٍ والحاكِمُ وصَحَّحَهُ، وابْنُ مَرْدُويَهْ، والبَيْهَقِيُّ في ”شُعَبِ الإيمانِ“ عَنْ أبِي سَعِيدٍ الخُدْرِيِّ قالَ: «كانَ بَنُو سَلِمَةَ في ناحِيَةٍ مِنَ المَدِينَةِ، فَأرادُوا أنْ يَنْتَقِلُوا إلى قُرْبِ المَسْجِدِ، فَأنْزَلَ اللَّهُ: ﴿إنّا نَحْنُ نُحْيِي المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهُمْ﴾ فَدَعاهم رَسُولُ اللَّهِ ﷺ فَقالَ: إنَّهُ يُكْتَبُ (p-٣٣٠)آثارُكم. ثُمَّ قَرَأ عَلَيْهِمُ الآيَةَ فَتَرَكُوا» .\\n\\nوأخْرَجَ عَبْدُ بْنُ حُمَيْدٍ عَنْ أبِي سَعِيدٍ الخُدْرِيِّ: ﴿إنّا نَحْنُ نُحْيِي المَوْتى ونَكْتُبُ ما قَدَّم\",\"al-durr-al-manthur|38\":\"قَوْلُهُ تَعالى: ﴿والشَّمْسُ تَجْرِي﴾ الآيَةَ.\\n\\nأخْرَجَ عَبْدُ بْنُ حُمَيْدٍ والبُخارِيُّ والتِّرْمِذِيُّ، وابْنُ أبِي حاتِمٍ، وأبُو الشَّيْخِ في ”العَظَمَةِ“، وابْنُ مَرْدُويَهْ والبَيْهَقِيُّ في ”الأسْماءِ والصِّفاتِ“ عَنْ أبِي ذَرٍّ قالَ: «كُنْتُ مَعَ النَّبِيِّ ﷺ في المَسْجِدِ عِنْدَ غُرُوبِ الشَّمْسِ فَقالَ: ”يا أبا ذَرٍّ“ أتَدْرِي أيْنَ تَغْرُبُ الشَّمْسُ؟ قُلْتُ: اللَّهُ ورَسُولُهُ أعْلَمُ. قالَ: فَإنَّها تَذْهَبُ حَتّى تَسْجُدَ تَحْتَ العَرْشِ فَذَلِكَ قَوْلُهُ: ﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها﴾ [يس»: ٣٨] .\\n\\nوأخْرَجَ سَعِيدُ بْنُ مَنصُورٍ، وأحْمَدُ والبُخارِيُّ ومُسْلِمٌ وأبُو داوُدَ والتِّرْمِذِيُّ والنَّسائِيُّ، وابْنُ أبِي حاتِمٍ وأبُو الشَّيْخِ، وابْنُ مَرْدُويَهْ، والبَيْه\",\"tafsir-abi-al-su-ood|8\":\"﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا﴾ تَقْرِيرٌ لِتَصْمِيمِهِمْ عَلى الكُفْرِ وعَدَمِ ارْعِوائِهِمْ عَنْهُ بِتَمْثِيلِ حالِهِمْ بِحالِ الَّذِينَ غُلَّتْ أعْناقُهم ﴿فَهِيَ إلى الأذْقانِ﴾ أيْ: فالأغْلالُ مُنْتَهِيَةٌ إلى أذْقانِهِمْ فَلا تَدَعُهم يَلْتَفِتُونَ إلى الحَقِّ، ولا يَعْطِفُونَ أعْناقَهم نَحْوَهُ، ولا يُطَئْطِئُونَ رُءُوسَهم لَهُ ﴿فَهم مُقْمَحُونَ﴾ رافِعُونَ رُءُوسَهُمْ، غاضُّونَ أبْصارَهُمْ، بِحَيْثُ لا يَكادُونَ يَرَوْنَ الحَقَّ، أوْ يَنْظُرُونَ إلى جِهَتِهِ.\",\"tafsir-abi-al-su-ood|12\":\"﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾ بَيانٌ لِشَأْنٍ عَظِيمٍ يَنْطَوِي عَلى الإنْذارِ والتَّبْشِيرِ انْطِواءً إجْمالِيًّا، أيْ: نَبْعَثُهم بَعْدَ مَماتِهِمْ، وعَنِ الحَسَنِ: إحْياؤُهم إخْراجُهم مِنَ الشِّرْكِ إلى الإيمانِ، فَهو حِينَئِذٍ عِدَةٌ كَرِيمَةٌ بِتَحْقِيقِ المُبَشَّرِ بِهِ ﴿وَنَكْتُبُ ما قَدَّمُوا﴾ أيْ: ما أسْلَفُوا مِنَ الأعْمالِ الصّالِحَةِ وغَيْرِها ﴿وَآثارَهُمْ﴾ الَّتِي أبْقَوْها مِنَ الحَسَناتِ كَعِلْمٍ عَلِمُوهُ، أوْ كِتابٍ ألَّفُوهُ أوْ حَبِيسٍ وقَفُوهُ، أوْ بِناءٍ بَنَوْهُ مِنَ المَساجِدِ والرِّباطاتِ والقَناطِرِ، وغَيْرِ ذَلِكَ مِن وُجُوهِ البِرِّ.\\n\\nوَمِنَ السَّيِّئاتِ كَتَأْسِيسِ قَوانِينِ الظُّلْمِ والعُدْوانِ، وتَرْتِيبِ مَبادِئِ الشَّرِّ والفَسادِ فِيما بَيْنَ العِبادِ، وغَي\",\"tafsir-abi-al-su-ood|38\":\"﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها﴾ لِحَدٍّ مُعَيَّنٍ يَنْتَهِي إلَيْهِ دَوْرُها، فَشُبِّهَ بِمُسْتَقَرِّ المُسافِرِ إذا قَطَعَ مَسِيرَهُ، أوْ لِكَبِدِ السَّماءِ فَإنَّ حَرَكَتَها فِيهِ تُوجَدُ أبْطَأ (p-168)بِحَيْثُ يُظَنُّ أنَّ لَها هُناكَ وقْفَةً، قالَ:\\n\\n؎ والشَّمْسُ حَيْرى لَها بِالجَوِّ تَدْوِيمُ\\n\\nأوْ لِاسْتِقْرارٍ لَها عَلى نَهْجٍ مَخْصُوصٍ، أوْ لِمُنْتَهًى مُقَدَّرٍ لِكُلِّ يَوْمٍ مِنَ المَشارِقِ والمَغارِبِ، فَإنَّ لَها في دَوْرِها ثَلاثَمِائَةٍ وسِتِّينَ مَشْرِقًا ومَغْرِبًا، تَطْلُعُ كُلَّ يَوْمٍ مِن مَطْلَعٍ وتَغْرُبُ مِن مَغْرِبٍ، ثُمَّ لا يَعُودُ إلَيْهِما إلى العامِ القابِلِ، أوِ لِمُنْقَطَعِ جَرْيِها عِنْدَ خَرابِ العالَمِ، وقُرِئَ: (إلى مُسْتَقَرٍّ لَها) وقُرِئَ: (لا مُسْ\",\"fath-al-qadir-al-shawkani|8\":\"تَفْسِيرُ سُورَةِ يس\\n\\nوهِيَ مَكِّيَّةٌ. قالَ القُرْطُبِيُّ: بِالإجْماعِ إلّا أنَّ فِرْقَةً قالَتْ ﴿ونَكْتُبُ ما قَدَّمُوا وآثارَهم﴾ [يس: ١٢] نَزَلَتْ في بَنِي سَلَمَةَ مِنَ الأنْصارِ حِينَ أرادُوا أنْ يَتْرُكُوا دِيارَهم ويَنْتَقِلُوا إلى جِوارِ مَسْجِدِ رَسُولِ اللَّهِ - صَلّى اللَّهُ عَلَيْهِ وآلِهِ وسَلَّمَ -، وسَيَأْتِي بَيانُ ذَلِكَ.\\n\\nوأخْرَجَ ابْنُ الضُّرَيْسِ، والنَّحّاسُ، وابْنُ مَرْدَوَيْهِ، والبَيْهَقِيُّ في الدَّلائِلِ عَنِ ابْنِ عَبّاسٍ قالَ: سُورَةُ يس نَزَلَتْ بِمَكَّةَ. وأخْرَجَ ابْنُ مَرْدَوَيْهِ عَنْ عائِشَةَ مِثْلَهُ.\\n\\nوأخْرَجَ الدّارِمِيُّ، والتِّرْمِذِيُّ، ومُحَمَّدُ بْنُ نَصْرٍ، والبَيْهَقِيُّ في الشُّعَبِ عَنْ أنَسٍ قالَ: قالَ رَسُولُ اللَّهِ - صَلّى اللَّهُ عَلَيْهِ وآ\",\"fath-al-qadir-al-shawkani|12\":\"تَفْسِيرُ سُورَةِ يس\\n\\nوهِيَ مَكِّيَّةٌ. قالَ القُرْطُبِيُّ: بِالإجْماعِ إلّا أنَّ فِرْقَةً قالَتْ ﴿ونَكْتُبُ ما قَدَّمُوا وآثارَهم﴾ [يس: ١٢] نَزَلَتْ في بَنِي سَلَمَةَ مِنَ الأنْصارِ حِينَ أرادُوا أنْ يَتْرُكُوا دِيارَهم ويَنْتَقِلُوا إلى جِوارِ مَسْجِدِ رَسُولِ اللَّهِ - صَلّى اللَّهُ عَلَيْهِ وآلِهِ وسَلَّمَ -، وسَيَأْتِي بَيانُ ذَلِكَ.\\n\\nوأخْرَجَ ابْنُ الضُّرَيْسِ، والنَّحّاسُ، وابْنُ مَرْدَوَيْهِ، والبَيْهَقِيُّ في الدَّلائِلِ عَنِ ابْنِ عَبّاسٍ قالَ: سُورَةُ يس نَزَلَتْ بِمَكَّةَ. وأخْرَجَ ابْنُ مَرْدَوَيْهِ عَنْ عائِشَةَ مِثْلَهُ.\\n\\nوأخْرَجَ الدّارِمِيُّ، والتِّرْمِذِيُّ، ومُحَمَّدُ بْنُ نَصْرٍ، والبَيْهَقِيُّ في الشُّعَبِ عَنْ أنَسٍ قالَ: قالَ رَسُولُ اللَّهِ - صَلّى اللَّهُ عَلَيْهِ وآ\",\"fath-al-qadir-al-shawkani|38\":\"لَمّا وقَعَ ما وقَعَ مِنهم مَعَ حَبِيبٍ النَّجّارِ غَضَبَ اللَّهُ لَهُ وعَجَّلَ لَهُمُ النِّقْمَةَ وأهْلَكَهم بِالصَّيْحَةِ، ومَعْنى ﴿وما أنْزَلْنا عَلى قَوْمِهِ مِن بَعْدِهِ﴾ أيْ: عَلى قَوْمِ حَبِيبٍ النَّجّارِ مِن بَعْدِ قَتْلِهِمْ لَهُ، أوْ مِن بَعْدِ رَفْعِ اللَّهِ لَهُ إلى السَّماواتِ عَلى الِاخْتِلافِ السّابِقِ مِن جُنْدٍ مِنَ السَّماءِ لِإهْلاكِهِمْ ولِلِانْتِقامِ مِنهم أيْ: لَمْ نَحْتَجْ إلى إرْسالِ جُنُودٍ مِنَ السَّماءِ لِإهْلاكِهِمْ كَما وقَعَ ذَلِكَ لِلنَّبِيِّ - صَلّى اللَّهُ عَلَيْهِ وآلِهِ وسَلَّمَ - يَوْمَ بَدْرٍ مِن إرْسالِ المَلائِكَةِ لِنُصْرَتِهِ وحَرْبِ أعْدائِهِ وما كُنّا مُنْزِلِينَ أيْ: وما صَحَّ في قَضائِنا وحِكْمَتِنا أنْ نُنْزِلَ لِإهْلاكِهِمْ جُنْدًا لَسَبْقِ قَضا\",\"tafsir-al-alusi|8\":\"﴿إنّا جَعَلْنا في أعْناقِهِمْ﴾ جَمْعُ عُنُقٍ بِالضَّمِّ وبِضَمَّتَيْنِ، وهو الجِيدُ، ويُقالُ عَنِيقٌ كَأمِيرٍ وعُنَقٌ كَصُرَدٍ.\\n\\n﴿أغْلالا﴾ جَمْعُ غُلٍّ بِالضَّمِّ وهو عَلى ما قِيلَ ما يُشَدُّ بِهِ اليَدُ إلى العُنُقِ لِلتَّعْذِيبِ والتَّشْدِيدِ، وفي البَحْرِ الغُلُّ ما أحاطَ بِالعُنُقِ عَلى مَعْنى التَّثْقِيفِ والتَّضْيِيقِ والتَّعْذِيبِ والأسْرِ ومَعَ العُنُقِ اليَدانِ أوِ اليَدُ الواحِدَةُ.\\n\\nوذَكَرَ الرّاغِبُ أنَّهُ ما يُقَيَّدُ بِهِ فَتُجْعَلُ الأعْضاءُ وسَطَهُ، وأصْلُهُ مِنَ الغَلَلِ تَدَرُّعُ الشَّيْءِ وتَوَسُّطُهُ، ومِنهُ الغَلَلُ لِلْماءِ الجارِي بَيْنَ الشَّجَرِ، وقَدْ يُقالُ لَهُ الغَيْلُ، وكَأنَّ في الكَلامِ عَلَيْهِ قَلْبًا أيْ جَعَلْنا أعْناقَهم في أغْلالٍ كَما تَقُولُ جَعَلْتُ ا\",\"tafsir-al-alusi|12\":\"وقَوْلُهُ سُبْحانَهُ: ﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾ إلخ تَذْيِيلٌ عامٌّ لِلْفَرِيقَيْنِ المُصَمِّمَيْنِ عَلى الكُفْرِ والمُشَفَّعَيْنِ بِالإنْذارِ تَرْهِيبًا وتَرْغِيبًا ووَعِيدًا ووَعْدًا، وتَكْرِيرُ الضَّمِيرِ لِإفادَةِ الحَصْرِ أوْ لِلتَّقْوِيَةِ، وما ألْطَفَ هَذا الضَّمِيرُ الَّذِي عَكْسُهُ كَطَرْدِهِ هاهُنا، وضَمِيرُ العَظَمَةِ لِلْإشارَةِ إلى جَلالَةِ الفِعْلِ، والتَّأْكِيدُ لِلِاعْتِناءِ بِأمْرِ الخَبَرِ أوْ لِرَدِّ الإنْكارِ فَإنَّ الكَفَرَةَ كانُوا يَقُولُونَ: ﴿إنْ هي إلا حَياتُنا الدُّنْيا نَمُوتُ ونَحْيا وما نَحْنُ بِمَبْعُوثِينَ﴾ [اَلْمُؤْمِنُونَ: 37] أيْ إنّا نَحْنُ نُحْيِي الأمْواتَ جَمِيعًا بِبَعْثِهِمْ يَوْمَ القِيامَةِ.\\n\\n﴿ونَكْتُبُ ما قَدَّمُوا﴾ ما أسْلَفُوهُ مِنَ الأعْمالِ\",\"tafsir-al-alusi|38\":\"﴿والشَّمْسُ﴾ عَطْفٌ عَلى (اللَّيْلُ) أيْ وآيَةٌ لَهُمُ الشَّمْسُ.\\n\\nوقَوْلُهُ - تَعالى -: ﴿تَجْرِي﴾ ... إلَخِ اسْتِئْنافٌ لِبَيانِ كَوْنِها آيَةً، وقِيلَ (الشَّمْسُ) مُبْتَدَأٌ وما بَعْدَهُ خَبَرٌ والجُمْلَةُ عَطْفٌ عَلى (اللَّيْلُ نَسْلَخُ) وقِيلَ غَيْرُ ذَلِكَ فَلا تَغْفُلْ، والجَرْيُ المَرُّ السَّرِيعُ، وأصْلُهُ لِمَرِّ الماءِ ولِما يَجْرِي بِجَرْيِهِ والمَعْنى تَسِيرُ سَرِيعًا ﴿لِمُسْتَقَرٍّ لَها﴾ لِحَدٍّ مُعَيَّنٍ تَنْتَهِي إلَيْهِ مِن فَلَكِها في آخِرِ السَّنَةِ شُبِّهَ بِمُسْتَقَرَّ المُسافِرِ إذا قَطَعَ مَسِيرَهُ مِن حَيْثُ إنَّ في كُلٍّ انْتِهاءً إلى مَحَلٍّ مُعَيَّنٍ وإنْ كانَ لِلْمُسافِرِ قَرارٌ دُونَها، ورُوِيُ هَذا عَنِ الكَلْبِيِّ واخْتارَهُ ابْنُ قُتَيْبَةَ، والمُسْتَقَرُّ عَلَ\",\"mahasin-al-ta-wil-al-qasimi|8\":\"القَوْلُ في تَأْوِيلِ قَوْلِهِ تَعالى:\\n\\n[ ٨ ] ﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا فَهي إلى الأذْقانِ فَهم مُقْمَحُونَ﴾ .\\n\\n﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا فَهي إلى الأذْقانِ﴾ أيِ: اَللِّحى؛ أيْ: واصِلَةٌ إلَيْها ومَلْزُوزَةٌ إلَيْها: ﴿فَهم مُقْمَحُونَ﴾ أيْ: ناصِبُو رُؤُوسِهِمْ، غاضُّو أبْصارِهِمْ. يُقالُ: أقْمَحَ اَلرَّجُلُ، رَفَعَ رَأْسَهُ وغَضَّ بَصَرَهُ. وأقْمَحَ اَلْغِلُّ اَلْأسِيرَ، إذا تَرَكَ رَأْسَهُ مَرْفُوعًا لِضِيقِهِ، فَهو مُقْمَحٌ، وذَلِكَ إذا لَمْ يَتْرُكْهُ عَمُودُ اَلْغِلِّ اَلَّذِي يَنْخُسُ ذَقَنَهُ، أنْ يُطَأْطِئَ رَأْسَهُ. قالَ اِبْنُ اَلْأثِيرِ: هي في قَوْلِهِ تَعالى: (p-٤٩٩٣)﴿فَهِيَ إلى الأذْقانِ﴾ كِنايَةً عَنِ اَلْأيْدِي لا عَنِ اَلْأعْناقِ؛ لِأنَّ اَلْغِلَّ يَجْع\",\"mahasin-al-ta-wil-al-qasimi|12\":\"(p-٤٩٩٥)القَوْلُ في تَأْوِيلِ قَوْلِهِ تَعالى:\\n\\n[ ١٢ ] ﴿إنّا نَحْنُ نُحْيِي المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهم وكُلَّ شَيْءٍ أحْصَيْناهُ في إمامٍ مُبِينٍ﴾ .\\n\\n﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾ أيْ: لِلْبَعْثِ: ﴿ونَكْتُبُ ما قَدَّمُوا﴾ أيْ: نَحْفَظُ عَلَيْهِمْ ما أسْلَفُوا مِنَ اَلْخَيْرِ والشَّرِّ: ﴿وآثارَهُمْ﴾ أيْ: ما تَرَكُوهُ مِن سُنَّةٍ صالِحَةٍ، فَعُمِلَ بِها بَعْدَ مَوْتِهِمْ، أوْ سَنَةٍ سَيِّئَةٍ فَعُمِلَ بِها بَعْدَهُمْ: ﴿وكُلَّ شَيْءٍ أحْصَيْناهُ في إمامٍ مُبِينٍ﴾ أيْ: في اَللَّوْحِ اَلْمَحْفُوظِ، أوِ اَلْعِلْمِ اَلْأزَلِيِّ.\",\"mahasin-al-ta-wil-al-qasimi|38\":\"القَوْلُ في تَأْوِيلِ قَوْلِهِ تَعالى:\\n\\n[ ٣٨ ] ﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذَلِكَ تَقْدِيرُ العَزِيزِ العَلِيمِ﴾ .\\n\\n﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها﴾ أيْ: لِحَدٍّ لَها مُؤَقَّتٍ مُقَدَّرٍ يَنْتَهِي إلَيْهِ دَوْرُها اَلْيَوْمِيُّ أوِ اَلسَّنَوِيُّ، شُبِّهَ بِمُسْتَقَرِّ اَلْمُسافِرِ إذا قَطَعَ مَسِيرَهُ. فالمُسْتَقَرُّ اِسْمُ مَكانٍ تَقْطَعُهُ في حَرَكَتِها اَلدّائِمَةِ ثُمَّ تَعُودُ. ووَجْهُ اَلشَّبَهِ اَلِانْتِهاءُ إلى مَحَلٍّ مُعَيَّنٍ، واللّامُ تَعْلِيلِيَّةٌ، أوْ بِمَعْنى (إلى). وقِيلَ مُسْتَقَرُّها: مُنْقَطَعُ جَرْيِها عِنْدَ خَرابِ اَلْعالَمِ. ومُسْتَقَرٌّ عَلَيْهِ اِسْمُ زَمانٍ: ﴿ذَلِكَ تَقْدِيرُ العَزِيزِ العَلِيمِ﴾ أيْ: ذَلِكَ اَلْجَرْيُ اَلْمُتَضَمِّنُ لِلْحِكَمِ، \",\"ar-tafseer-al-saddi|8\":\"وذكر الموانع من وصول الإيمان لقلوبهم، فقال: { إِنَّا جَعَلْنَا فِي أَعْنَاقِهِمْ أَغْلَالًا } وهي جمع \\\"غل\\\" و \\\"الغل\\\" ما يغل به العنق، فهو للعنق بمنزلة القيد للرجل، وهذه الأغلال التي في الأعناق عظيمة قد وصلت إلى أذقانهم ورفعت رءوسهم إلى فوق، { فَهُمْ مُقْمَحُونَ } أي: رافعو رءوسهم من شدة الغل الذي في أعناقهم، فلا يستطيعون أن يخفضوها.\",\"ar-tafseer-al-saddi|12\":\"{ إِنَّا نَحْنُ نُحْيِي الْمَوْتَى } أي: نبعثهم بعد موتهم لنجازيهم على الأعمال، { وَنَكْتُبُ مَا قَدَّمُوا } من الخير والشر، وهو أعمالهم التي عملوها وباشروها في حال حياتهم، { وَآثَارَهُمْ } وهي آثار الخير وآثار الشر، التي كانوا هم السبب في إيجادها في حال حياتهم وبعد وفاتهم، وتلك الأعمال التي نشأت من أقوالهم وأفعالهم وأحوالهم، فكل خير عمل به أحد من الناس، بسبب علم العبد وتعليمه ونصحه، أو أمره بالمعروف، أو نهيه عن المنكر، أو علم أودعه عند المتعلمين، أو في كتب ينتفع بها في حياته وبعد موته، أو عمل خيرا، من صلاة أو زكاة أو صدقة أو إحسان، فاقتدى به غيره، أو عمل مسجدا، أو محلا من المحال التي يرتفق بها الناس، وما أشبه ذلك، فإنها من آثاره التي تكتب له، وكذلك عمل الشر.ولهذا: { من سن سنة حسنة فله أجرها\",\"ar-tafseer-al-saddi|38\":\"{ وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَهَا } أي: دائما تجري لمستقر لها قدره اللّه لها، لا تتعداه، ولا تقصر عنه، وليس لها تصرف في نفسها، ولا استعصاء على قدرة اللّه تعالى. { ذَلِكَ تَقْدِيرُ الْعَزِيزِ } الذي بعزته دبر هذه المخلوقات العظيمة، بأكمل تدبير، وأحسن نظام. { الْعَلِيمُ } الذي بعلمه، جعلها مصالح لعباده، ومنافع في دينهم ودنياهم.\",\"ar-tafseer-tahrir-al-tanwir|8\":\"﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالًا فَهْيَ إلى الأذْقانِ فَهم مُقْمَحُونَ﴾ هَذِهِ الجُمْلَةُ بَدَلُ اشْتِمالٍ مِن جُمْلَةِ ﴿لَقَدْ حَقَّ القَوْلُ عَلى أكْثَرِهِمْ فَهم لا يُؤْمِنُونَ﴾ [يس: ٧] فَإنَّ انْتِفاءَ إيمانِهِمْ يَشْتَمِلُ عَلى ما تَضَمَّنَتْهُ هَذِهِ الآيَةُ مِن جَعْلِ أغْلالٍ في أعْناقِهِمْ حَقِيقَةً أوْ تَمْثِيلًا.\\n\\nوالجَعْلُ: تَكْوِينُ الشَّيْءِ، أيْ جَعَلْنا حالَهم كَحالِ مَن في أعْناقِهِمْ أغْلالٌ فَهي إلى الأذْقانِ فَهم مُقْمِحُونَ، فَيَجُوزُ أنْ يَكُونَ تَمْثِيلًا بِأنْ شُبِّهَتْ حالَةُ إعْراضِهِمْ عَنِ التَّدَبُّرِ في القُرْآنِ ودَعْوَةِ الإسْلامِ والتَّأمُّلِ في حُجَجِهِ الواضِحَةِ بِحالِ قَوْمٍ جُعِلَتْ في أعْناقِهِمْ أغْلالٌ غَلِيظَةٌ تَرْتَفِعُ إلى أذْقانِهِمْ فَيَكُو\",\"ar-tafseer-tahrir-al-tanwir|12\":\"﴿إنّا نَحْنُ نُحْيِ المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهم وكُلَّ شَيْءٍ أحْصَيْنَهُ في إمامٍ مُبِينٍ﴾ لَمّا اقْتَضى القَصْرُ في قَوْلِهِ ﴿إنَّما تُنْذِرُ مَنِ اتَّبَعَ الذِّكْرَ وخَشِيَ الرَّحْمَنَ بِالغَيْبِ﴾ [يس: ١١] نُفِيَ أنْ يَتَعَلَّقَ الإنْذارُ بِالَّذِينِ لَمْ يَتَّبِعُوا الذِّكْرَ ولَمْ يَخْشَوُا الرَّحْمَنَ، وكانَ في ذَلِكَ كِنايَةٌ تَعْرِيضِيَّةٌ بِأنَّ الَّذِينَ لَمْ يَنْتَفِعُوا بِالإنْذارِ بِمَنزِلَةِ الأمْواتِ لِعَدَمِ انْتِفاعِهِمْ بِما يَنْفَعُ كُلَّ عاقِلٍ، كَما قالَ تَعالى ﴿لِتُنْذَرَ مَن كانَ حَيًّا﴾ [يس: ٧٠] وكَما قالَ ﴿إنَّكَ لا تُسْمِعُ المَوْتى﴾ [النمل: ٨٠] اسْتُطْرِدَ عَقِبَ ذَلِكَ بِالتَّخَلُّصِ إلى إثْباتِ البَعْثِ فَإنَّ التَّوْفِيقَ الَّذِي حَفَّ بِمَنِ اتَّبَ\",\"ar-tafseer-tahrir-al-tanwir|38\":\"صفحة ١٩\\n﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذَلِكَ تَقْدِيرُ العَزِيزِ العَلِيمِ﴾ الشَّمْسُ يَجُوزُ أنْ يَكُونَ مَعْطُوفًا عَلى اللَّيْلِ مِن قَوْلِهِ ﴿وآيَةٌ لَهُمُ اللَّيْلُ﴾ [يس: ٣٧] عَطْفَ مُفْرَدٍ عَلى مُفْرِدٍ ويُقَدَّرُ لَهُ خَبَرٌ مُماثِلٌ لِخَبَرِ اللَّيْلِ، والتَّقْدِيرُ: والشَّمْسُ آيَةٌ لَهم، وتَكُونُ جُمْلَةُ تَجْرِي حالًا مِنَ الشَّمْسِ مِثْلُ جُمْلَةِ ﴿نَسْلَخُ مِنهُ النَّهارَ﴾ [يس: ٣٧] .\\nويَجُوزُ أنْ يَكُونَ عَطْفَ جُمْلَةٍ عَلى جُمْلَةٍ ويَكُونُ قَوْلُهُ تَجْرِي خَبَرًا عَنِ الشَّمْسِ، وأيًّا ما كانَ فَهو تَفْصِيلٌ لِإجْمالِ جُمْلَةِ ﴿وآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنهُ النَّهارَ﴾ [يس: ٣٧] إلْخَ كَما دَلَّ عَلَيْهِ قَوْلُهُ الآتِي ﴿ولا اللَّيْلُ سابِقُ النَّهارِ﴾ [يس: \",\"adwa-al-bayan|8\":\"قَوْلُهُ تَعالى: ﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالًا فَهي إلى الأذْقانِ فَهم مُقْمَحُونَ﴾ ﴿وَجَعَلْنا مِن بَيْنِ أيْدِيهِمْ سَدًّا ومِن خَلْفِهِمْ سَدًّا فَأغْشَيْناهم فَهم لا يُبْصِرُونَ﴾ . الأغْلالُ: جَمْعُ غُلٍّ وهو الَّذِي يَجْمَعُ الأيْدِي إلى الأعْناقِ. والأذْقانُ: جَمْعُ ذَقَنٍ وهو مُلْتَقى اللَّحْيَيْنِ. والمُقْمَحُ بِصِيغَةِ اسْمِ المَفْعُولِ، وهو الرّافِعُ رَأْسَهُ. والسَّدُّ بِالفَتْحِ والضَّمِّ: هو الحاجِزُ الَّذِي يَسُدُّ طَرِيقَ الوُصُولِ إلى ما وراءَهُ.\\n\\nوَقَوْلُهُ: فَأغْشَيْناهم، أيْ: جَعَلَنا عَلى أبْصارِهِمُ الغِشاوَةَ، وهي الغِطاءُ الَّذِي يَكُونُ عَلى العَيْنِ يَمْنَعُها مِنَ الإبْصارِ، ومِنهُ قَوْلُهُ تَعالى: ﴿وَعَلى أبْصارِهِمْ غِشاوَةٌ﴾ [البقرة: ٧]، وقَوْلُهُ تَعالى\",\"adwa-al-bayan|12\":\"قَوْلُهُ تَعالى: ﴿إنّا نَحْنُ نُحْيِي المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهم وكُلَّ شَيْءٍ أحْصَيْناهُ في إمامٍ مُبِينٍ﴾ . ذَكَرَ جَلَّ وعَلا في هَذِهِ الآيَةِ الكَرِيمَةِ أرْبَعَةَ أشْياءَ:\\n\\nالأوَّلَ: أنَّهُ يُحْيِي المَوْتى، مُؤَكِّدًا ذَلِكَ مُتَكَلِّمًا عَنْ نَفْسِهِ بِصِيغَةِ التَّعْظِيمِ.\\n\\nالثّانِيَ: أنَّهُ يَكْتُبُ ما قَدَّمُوا في دارِ الدُّنْيا.\\n\\nالثّالِثَ: أنَّهُ يَكْتُبُ آثارَهم.\\n\\nالرّابِعَ: أنَّهُ أحْصى كُلَّ شَيْءٍ ﴿فِي إمامٍ مُبِينٍ﴾، أيْ: في كِتابٍ بَيِّنٍ واضِحٍ، وهَذِهِ الأشْياءُ الأرْبَعَةُ جاءَتْ مُوَضَّحَةً في غَيْرِ هَذا المَوْضِعِ.\\n\\nأمّا الأوَّلُ مِنها وهو كَوْنُهُ يُحْيِي المَوْتى بِالبَعْثِ، فَقَدْ جاءَ في آياتٍ كَثِيرَةٍ مِن كِتابِ اللَّهِ تَعالى،\\n\\n• كَقَوْلِهِ تَعا\",\"adwa-al-bayan|38\":\"\",\"ar-tafsir-muyassar|8\":\"لقد وجب العذاب على أكثر هؤلاء الكافرين، بعد أن عُرِض عليهم الحق فرفضوه، فهم لا يصدقون بالله ولا برسوله، ولا يعملون بشرعه. إنا جعلنا هؤلاء الكفار الذين عُرض عليهم الحق فردُّوه، وأصرُّوا على الكفر وعدم الإيمان، كمن جُعِل في أعناقهم أغلال، فجمعت أيديهم مع أعناقهم تحت أذقانهم، فاضطروا إلى رفع رؤوسهم إلى السماء، فهم مغلولون عن كل خير، لا يبصرون الحق ولا يهتدون إليه.\",\"ar-tafsir-muyassar|12\":\"إنا نحن نحيي الأموات جميعًا ببعثهم يوم القيامة، ونكتب ما عملوا من الخير والشر، وآثارَهم التي كانوا سببًا فيها في حياتهم وبعد مماتهم من خير، كالولد الصالح، والعلم النافع، والصدقة الجارية، ومن شر، كالشرك والعصيان، وكلَّ شيء أحصيناه في كتاب واضح هو أمُّ الكتب، وإليه مرجعها، وهو اللوح المحفوظ. فعلى العاقل محاسبة نفسه؛ ليكون قدوة في الخير في حياته وبعد مماته.\",\"ar-tafsir-muyassar|38\":\"وآية لهم الشمس تجري لمستقر لها، قدَّره الله لها لا تتعداه ولا تقصر عنه، ذلك تقدير العزيز الذي لا يغالَب، العليم الذي لا يغيب عن علمه شيء.\",\"tafsir-ibn-uthaymeen|8\":\"ثم قال الله تعالى: ﴿لَقَدْ حَقَّ الْقَوْلُ عَلَى أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ﴾ [يس ٧]، اللام هذه مُوطِّئة للقسم؛ أي أنها تدل على أن هناك قسمًا تقديره: والله لقد حق، و(قد) للتحقيق، وعليه فالجملة مؤكدة بثلاثة مؤكدات: القسم المحذوف، واللام، وقد. وهذا التركيب يأتي في القرآن كثيرًا، وطريقه أو طريق إعرابه ما أشرنا إليه.\\n\\n﴿لَقَدْ حَقَّ الْقَوْلُ﴾ أي: وجب، حق هنا بمعنى وجب. و﴿الْقَوْلُ﴾ هو القول بالعذاب كقوله تعالى: ﴿كَذَلِكَ حَقَّتْ كَلِمَتُ رَبِّكَ عَلَى الَّذِينَ فَسَقُوا أَنَّهُمْ لَا يُؤْمِنُونَ﴾ [يونس ٣٣] في الآية الأخرى: ﴿أَنَّهُمْ أَصْحَابُ النَّارِ﴾ [غافر ٦].\\n\\nفمن حقت عليه كلمة العذاب فإنه لا يمكن أن يهتدي مهما أوتي من آية، ولكن لا تحق كلمة العذاب إلا على من استحقها حتى لا يقال: إن ا\",\"tafsir-ibn-uthaymeen|12\":\"ثم قال الله تعالى: ﴿لَقَدْ حَقَّ الْقَوْلُ عَلَى أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ﴾ [يس ٧]، اللام هذه مُوطِّئة للقسم؛ أي أنها تدل على أن هناك قسمًا تقديره: والله لقد حق، و(قد) للتحقيق، وعليه فالجملة مؤكدة بثلاثة مؤكدات: القسم المحذوف، واللام، وقد. وهذا التركيب يأتي في القرآن كثيرًا، وطريقه أو طريق إعرابه ما أشرنا إليه.\\n\\n﴿لَقَدْ حَقَّ الْقَوْلُ﴾ أي: وجب، حق هنا بمعنى وجب. و﴿الْقَوْلُ﴾ هو القول بالعذاب كقوله تعالى: ﴿كَذَلِكَ حَقَّتْ كَلِمَتُ رَبِّكَ عَلَى الَّذِينَ فَسَقُوا أَنَّهُمْ لَا يُؤْمِنُونَ﴾ [يونس ٣٣] في الآية الأخرى: ﴿أَنَّهُمْ أَصْحَابُ النَّارِ﴾ [غافر ٦].\\n\\nفمن حقت عليه كلمة العذاب فإنه لا يمكن أن يهتدي مهما أوتي من آية، ولكن لا تحق كلمة العذاب إلا على من استحقها حتى لا يقال: إن ا\",\"tafsir-ibn-uthaymeen|38\":\"ثم قال الله عز وجل: ﴿وَآيَةٌ لَهُمُ اللَّيْلُ﴾ [يس ٣٧] نقول في إعرابها ما قلنا في ﴿آيَةٌ لَهُمُ الْأَرْضُ﴾ فيكون ﴿اللَّيْلُ﴾ مبتدأ، و﴿آيَةٌ﴾ خبر مقدم، ونقول في نفس اللفظ كما قلنا في قوله: ﴿أَحْيَيْنَاهَا﴾ أي: أنه يجوز أن تكون صفة لـ(الليل) على حد قول الشاعر:\\n\\nوَلَقَدْ أَمُرُّ عَلَى اللَّئِيمِ يَسُبُّنِي ∗∗∗ ............................\\nويجوز أن تكون الجملة استئنافية؛ لبيان هذه الآية، كيف كان آية؟ كيف كان الليل آية؟ قال: ﴿نَسْلَخُ مِنْهُ النَّهَارَ فَإِذَا هُمْ مُظْلِمُونَ﴾ [يس ٣٧] نسلخ يقول المؤلف: (نفصل) وسمى الله.. سلخًا؛ لأنه يشبه سلخ الجلد من البهيمة ﴿نَسْلَخُ مِنْهُ النَّهَارَ فَإِذَا هُمْ مُظْلِمُونَ﴾؛ لأن النهار أمر وجودي يوجد بوجود الشمس، فهو وارد على الليل، فإذا غابت الشمس تبعها هذا\",\"ar-tafsir-al-wasit|8\":\"ثم صور - سبحانه - انكبابهم على الكفر ، وإصرارهم عليه ، تصويرا بليغا فقال : ( إِنَّا جَعَلْنَا في أَعْناقِهِمْ أَغْلاَلاً فَهِىَ إِلَى الأذقان فَهُم مُّقْمَحُونَ ) .والأغلال : جمع غل - بضم الغين ، وهو القيد الذى تشد به اليد إلى العنق بقصد التعذيب والأذقان : جمع ذقن - بفتح الذال - وهو أسفل الفم .ومقمحون : من الإِقماح ، وهو رفع الرأس مع غض البصر . يقال : قمح البعير قموحا إذا رفع رأسه عن الحوض ولم يشرب . والفاء فى قوله ( فهى ) وفى قوله ( فهم ) : للتقريع .أى : إنا جعلنا فى أعناق هؤلاء الجاحدين قيودا عظيمة ، فهى - أى هذه القيود - واصلة إلى أذقانهم ، فهم بسبب ذلك مرفوعة رءوسهم ، مع غض أبصارهم ، بحيث لا يستطيعون أن يخفضوها ، لان القيود التى وصلت إلى أذقانهم منعتهم من خفض رءوسهم .فقد شبه - سبحانه - ف\",\"ar-tafsir-al-wasit|12\":\"ثم أكد - سبحانه - أن البعث حق ، وأن الجزاء حق ، لكى لا يغفل عنهما الناس ، ولكى يستعدوا لهما بالإِيمان والعمل الصالح فقال : ( إِنَّا نَحْنُ نُحْيِي الموتى . . . ) .أى : إنا نحن بقدرتنا وحدها نحيى الموتى بعد موتهم ، ونعيدهم إلى الحياة مرة أخرى لكى نحاسبهم على أعمالهم .( وَنَكْتُبُ مَاَ قَدَّمُواْ وَآثَارَهُمْ ) أى : وإنا نحن الذين نسجل عليهم أعمالهم التى عملوها فى الدنيا سواء أكانت هذه الأعمال صاحلة أم غير صالحة .ونسجل لهم - أيضا - آثارهم التى تركوها بعد موتهم سواء أكانت صالحة كعلم نافع ، أو صدقة جارية .. . أم غير صالحة كدار للهو واللعب ، وكرأى من الآراء الباطلة التى اتبعها من جاء بعددهم ، وسنجازيهم على ذلك بما يستحقون من ثواب أو عقا
