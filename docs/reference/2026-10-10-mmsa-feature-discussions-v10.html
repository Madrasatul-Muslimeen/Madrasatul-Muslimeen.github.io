<script type="application/json" id="state">{"title": "Ten Steps and the QR Levels", "intro": "<p class=\"eyebrow\">MMSA · Quran (QuranRevival) · research for the Owner · revised 9 Oct 2026, with the Owner's views<\/p>\n\n<p class=\"lead\">How the ten steps of <a href=\"https://learndeenonthego.wordpress.com/2024/09/21/quran-for-critical-reasoning-the-process-of-contemplating-on-the-quran/\">“Quran for Critical Reasoning: the process of contemplating on the Quran”<\/a> line up with the Approaches, the QCR collections and the year levels in QR; where the intention belongs; and whether the ten steps are enough for an unbiased understanding of the Qur'an, Hadith and Deen.<\/p>\n<p class=\"meta\">Sources read: the article (full text); the 30 Approaches in the app's code, with your one-line glosses from the original app; QCR (18 collections, 379 āyāt, from your file <em>QCR — Qur'an (calls for) Critical Reasoning<\/em> v01.13); the Qur'an grammar data QR already carries. Your 40 Approaches: from your own list of 9 Oct, in the Approach Map below.<\/p>", "sections": [{"id": "issues-tensteps", "title": "📋 Issues: decided, pending, for later", "html": "<p>Every issue of this feature in one table: when it was raised, the decision taken and its date, and what is pending or kept for later. Press <strong>✓<\/strong> on a row, or <strong>✓ Served<\/strong> on any heading, when it has served its purpose; the <strong>Served<\/strong> switch at the top fades it, hides it, or shows everything. Press <strong>✎ Edit<\/strong> to change a cell, add a row, or change a status, then <strong>Save<\/strong>.<\/p>", "kind": "issues", "topic": "tensteps"}, {"id": "talk", "title": "★ Our conversation", "html": "<p>This is where we keep talking, so nothing gets lost. Press <strong>✎ Edit<\/strong>, then <strong>+ Add your note here<\/strong> under any section, and press <strong>Save<\/strong>. I read the saved version and answer here.<\/p>\n<div class=\"owner\">\n<p class=\"label\">You (9 Oct 2026)<\/p>\n<p>We will continue our conversation in this file, so that it won't get lost. Make the side pane expandable and resizable. Make the text readable. Make the headings noticeable. I made updates to a few sections. I will keep updating; you can comment on anything.<\/p>\n<\/div>\n<div class=\"answer\">\n<p><strong>Done (the Architect, 9 Oct):<\/strong><\/p>\n<p>• <strong>The contents pane:<\/strong> drag its edge to make it wider or narrower (double-click the edge to put it back). <strong>⟨ Hide<\/strong> hides it, and <strong>☰ Contents<\/strong> brings it back. The section you are reading is marked in gold. The page remembers your width.<\/p>\n<p>• <strong>The Approach Map is readable now:<\/strong> it uses the whole width of the screen, not the narrow text column. In <strong>Table<\/strong> view the number and name stay in place while you scroll sideways, and the column titles stay at the top. In <strong>Cards<\/strong> view each Approach is one card, grouped by section, with nothing cut off. The <strong>Find<\/strong> box shows only the rows with a word you type. The statuses are coloured.<\/p>\n<p>• <strong>The headings:<\/strong> every section starts on a coloured band with a gold edge, and the sub-headings are coloured and underlined. In the contents, the sections are bold and their sub-headings are set in under them.<\/p>\n<p>• <strong>Editing:<\/strong> a light background shows what you can change, without the dashed boxes. The box you are typing in is outlined.<\/p>\n<\/div>\n<div class=\"flag\"><strong>Your updates did not reach me.<\/strong> The saved version on claude.ai is still the one I published, so none of your section edits are in it. Edits stay in the browser you made them in until you press <strong>Save<\/strong>. Open this page in that same browser: your edits will be brought into this new version automatically (the line under the buttons will say so). Then press <strong>Save<\/strong>. If Save says it cannot save, press <strong>Export .html<\/strong> and send me the file.<\/div>\n<h3>My comments on the Approach Map<\/h3>\n<ol>\n<li><em>Answered 9 Oct: yes, reordered.<\/em> <strong>The order of the four Madhabs.<\/strong> Rows 32–35 run Maliki, Hanbali, Hanafi, Shafi'i. Your rule for this section is “by time and level”. By time, the order is Hanafi (Abu Hanifah, d. 150 AH), Maliki (Malik, d. 179), Shafi'i (al-Shafi'i, d. 204), Hanbali (Ahmad, d. 241). Shall I reorder them so?<\/li>\n<li><em>Answered 9 Oct: 1258, done.<\/em> <strong>Gen1 ends “until 1200, before the Mongol invasion”.<\/strong> The Mongols took Baghdad and ended the Abbasid Khilafah there in <strong>656 AH / 1258 CE<\/strong>. Is the line 1200, or 1258? With 1258, Gen1 and Gen2 meet at one clear event.<\/li>\n<li><em>Answered 9 Oct: yes, done.<\/em> <strong>Gen2 ends “about 300 years ago, when the Khilafah started fading”.<\/strong> That is around 1700: after the failed siege of Vienna (1683) and the Treaty of Karlowitz (1699), the first great loss of Uthmani land. A year in the title (for example “to 1700”) would make the line with Gen3 (to 1924) clear.<\/li>\n<li><em>Answered 9 Oct: no change; it stays after the scholars.<\/em> <strong>“MISC. Groups and Sects” (36)<\/strong> sits between the Madhabs and the later generations. Groups and sects arose in every era, from the Khawarij in the first century to modern movements. Should it stay one Approach here, or be read inside each era?<\/li>\n<li><em>Answered 9 Oct: nothing changes in the app yet; we finalise here first.<\/em> <strong>The numbers and the order.<\/strong> Your order puts 32–36 before 30 and 31. That is fine on paper. In the app, before anything is moved, I will check that what is already recorded stays with the right Approach and does not follow a number.<\/li>\n<\/ol>\n<div class=\"owner\">\n<p class=\"label\">You (9 Oct 2026, with your edited file)<\/p>\n<p>Name it with the date and version, as we do. Yes, add your information, comments and suggestions. On your comments and sends you the open plans. Add plans there whenever you like and press Save; the next reminder includes them.<\/p>\n<\/div>\n<div class=\"answer\">\n<p><strong>The Architect (10 Oct), version v07:<\/strong> on your word, this file is now the <strong>master for every feature discussion<\/strong>. The tabs at the top hold one feature each: this one (<em>Ten Steps &amp; QR Levels<\/em>, unchanged) and <em>🔑 Keys to Understanding<\/em>. The version continues in one line for the whole file.<\/p>\n<\/div>\n<div class=\"owner\">\n<p class=\"label\">You (10 Oct 2026)<\/p>\n<p>Modify every feature discussion's every issue with the date and the decision taken, in columns side by side, and the decision pending for later; and enable a heading of an issue to hide or fade when it has served its purpose (so it does not distract, and lets us focus on what is pending and what is to think about). Send me the html file with the modification.<\/p>\n<\/div>\n<div class=\"answer\">\n<p><strong>Done (the Architect, 10 Oct), version v10:<\/strong><\/p>\n<p>• <strong>📋 Issues<\/strong> is now the first section of every tab: <em>Issue · Raised · Decision taken · Decided on · Pending / for later · Status<\/em>, side by side. I filled it from everything we have said in each tab: 19 issues here, 11 in Keys, 9 in the Asma Screensaver. A count above each table shows how many are pending, and the <em>Show<\/em> buttons pick only pending, decided, done or later.<\/p>\n<p>• <strong>Served its purpose:<\/strong> a <strong>✓<\/strong> on every issue row and <strong>✓ Served<\/strong> on every heading and sub-heading. The <strong>Served<\/strong> switch in the top bar shows them <em>faded<\/em> (the default), <em>hidden<\/em>, or <em>in full<\/em>; the contents list follows. <strong>↺<\/strong> brings one back. I marked as served only the issues that are finished (for example the Madhab order, Gen1 and Gen2); every other mark is yours to make.<\/p>\n<p>• <strong>In Edit:<\/strong> every cell can be changed, a status is a choice (pending, decided, done, later), and <strong>+ Add an issue<\/strong> adds a row. Press <strong>Save<\/strong> and I read it.<\/p>\n<\/div>", "topic": "tensteps"}, {"id": "plans", "title": "📌 PLANS", "html": "<p>Future plans, written here so they stay in one place. <strong>Once a month<\/strong> you get a reminder that lists every plan here that is still open (set up 9 Oct 2026; it reads this section of the saved file). Press <strong>✎ Edit<\/strong> to add a plan, change one, or mark one done; then <strong>Save<\/strong>.<\/p>\n<ol class=\"q\" data-plans>\n<li><strong>Attach a live class to a user.<\/strong> Enable an option to attach a live class to a person (a student or a family member), so a live lesson is part of their study in the app. <span class=\"meta\">Added 9 Oct 2026. Status: open.<\/span><\/li>\n<\/ol>\n<div class=\"answer\">\n<p><strong>My notes on plan 1 (the Architect):<\/strong> the app already has <strong>Classes<\/strong> and <strong>Course offers<\/strong> (classes.html, course-offers.html), which enrol a person with a teacher. A <em>live<\/em> class would add a time and a meeting link (for example Zoom or Google Meet) to a class, show it to each enrolled person on their landing page (\"Live class at 7 pm\"), and could record attendance. Questions for when we take it up: which meeting service; one-to-one, family or group; repeating times or one-off; and whether attendance counts as study. Nothing is built until you say.<\/p>\n<\/div>", "topic": "tensteps"}, {"id": "owner", "title": "1. Your views (9 Oct 2026)", "html": "<p>In your words, lightly edited for English only. They now set the frame for the rest of this file.<\/p>\n<div class=\"owner\">\n<p class=\"label\">The intention is a mindset, not a level<\/p>\n<p>The intention is not a level. It is a mindset: the approach a person must bring to the Qur'an as a whole. It does not count for any single unit, so it is never recorded or claimed. But a person needs to be reminded of it often.<\/p>\n<\/div>\n<div class=\"owner\">\n<p class=\"label\">The basis: why the Qur'an calls for critical reasoning<\/p>\n<ol>\n<li>Allah commanded it.<\/li>\n<li>The hadith clearly commands us to seek guidance from the Qur'an in the fitnah of the end of times.<\/li>\n<li>And there is a warning about scholars, from right and left.<\/li>\n<\/ol>\n<p class=\"label\">So, when do the scholars come?<\/p>\n<p>The understanding of the scholars is deliberately not placed at the beginning, because it influences people. It is there only for <strong>reconciliation<\/strong>: to check whether the student's own understanding has a basis, that it is not wild, and that it is free of bias, prejudice and outside influence. That reconciliation is set out in more detail in the Approaches of the section “Understanding of the Scholars”, which order the scholars by their time, and by how they were influenced by the authority they lived under: the Muslims' (the Khilafah) and the kuffār's.<\/p>\n<p>The aim is that one day the student can stand on their own <strong>Fahm<\/strong> (understanding), and their own <strong>Fatwa<\/strong> (ruling), even when nobody else has reached it, because that is the prescription Rasulullah ﷺ gave for the end of time.<\/p>\n<\/div>\n<div class=\"answer\">\n<p><strong>My comment (the Architect, 9 Oct): give the basis its references.<\/strong> This file's own rule D says a hadith is checked for its grade before anything is built on it. The basis of the whole method deserves that most of all, so each of your three points should name its text. These are the ones I believe you mean; please confirm or replace them. Each needs checking before it is used anywhere.<\/p>\n<p><strong>1. Allah commanded it.<\/strong> 38:29 “a blessed Book … that they may ponder its āyāt, and that people of understanding may take heed”; 47:24 “do they not ponder the Qur'an, or are there locks upon their hearts?”; 4:82 and 23:68 ask the same.<\/p>\n<p><strong>2. Guidance from the Qur'an in the fitnah.<\/strong> The best-known wording is ʿAlī's hadith, “there will be fitnah … the way out of it is the Book of Allah” (al-Tirmidhī 2906). <strong>Its chain is weak<\/strong>: al-Tirmidhī himself said so, and one narrator, al-Ḥārith al-Aʿwar, is criticised. Its meaning is sound from a stronger text, the Farewell Sermon: “I have left among you that which, if you hold to it, you will never go astray: the Book of Allah” (Muslim 1218). I suggest Muslim 1218 carries point 2, with al-Tirmidhī 2906 named and marked weak.<\/p>\n<p><strong>3. The warning about scholars.<\/strong> Ḥudhayfah's hadith of the callers at the gates of Jahannam, “people of our own skin who speak our language” (al-Bukhārī 7084, Muslim 1847). “What I fear most for my Ummah is misguiding leaders” (Abū Dāwūd 4252, al-Tirmidhī 2229). And from the Qur'an: 9:31, “they took their rabbis and monks as lords besides Allah”, and 9:34.<\/p>\n<p>Ḥudhayfah's hadith also ends “keep away from all those sects”. That supports your Approach 36 (“Groups and Sects”) staying where it is: the student meets the sects last, already able to judge them.<\/p>\n<\/div>", "topic": "tensteps"}, {"id": "approach-map", "title": "★ The Approach Map: all 40 Approaches", "kind": "approaches", "html": "<div class=\"owner\">\n<p class=\"label\">Your view (9 Oct 2026, the QCR issue)<\/p>\n<p>What I am trying to get at is each Approach's <strong>validity<\/strong>, its <strong>worthiness<\/strong>, and <strong>how<\/strong>: which acts are the practical way to work through it. The ten steps are certainly practical, but there is more, and I want to make that connection. I don't know myself yet what we need to build out of this.<\/p>\n<\/div>\n<div class=\"answer\">\n<p><strong>How I read it (the Architect):<\/strong> every Approach should be able to answer three questions.<\/p>\n<p>• <strong>Is it valid?<\/strong> Where does the Qur'an itself call for it? This is what QCR already does for Critical Reasoning: its collections are the Qur'an's own calls to look, reason, reflect and ponder, named by Approach number. The same can be done for every Approach.<\/p>\n<p>• <strong>Is it worth it?<\/strong> What does it give the student that nothing else does?<\/p>\n<p>• <strong>How?<\/strong> Which practical acts work through it, and how does it connect to the ten steps? The ten steps are the practical method for the Critical Reasoning Approaches (15–27); the others need their own acts.<\/p>\n<p>Below is the table in <strong>your corrected order<\/strong> (28, 29, then 32–36, then 30, 31, and the planned eras after them). Your own numbers are kept, and the status is yours. The last four columns are <strong>my draft, for you to correct<\/strong>: āyāt to check, wording to change, rows to add. Press <strong>Edit<\/strong>, change any cell, then <strong>Save<\/strong>.<\/p>\n<p class=\"meta\">Section placement follows the counts your data holds (6, 7, 3, 4, 4, 3, 9 and 4 per section). Verse numbers are a draft: please check each one before it is used anywhere.<\/p>\n<\/div>", "topic": "tensteps"}, {"id": "intention", "title": "2. The intention: where it fits best", "html": "<p>Because the intention belongs to the Qur'an as a whole, its place is <strong>wherever study begins<\/strong>, not on any unit, wheel slice or record. Four places in the app meet a reader at that moment. My recommendation is the first two together.<\/p>\n<div class=\"gap\">\n<div class=\"n\">1<\/div><div><h3>When study opens, once a day <span class=\"tag\">recommended<\/span><\/h3>\n<p>The first time in a day a person opens the Qur'an to read or study, one line sits above the āyāt: one of the four intentions, in turn. For example: <em>“This Qur'an was revealed to me, for me. What is its instruction for me today?”<\/em> One tap on <strong>Bismillah<\/strong> closes it for the day. It is short enough to read every day without growing stale, because it rotates. It also applies to Hadith and Dua, since the article's third intention is “read an Āyah <em>or a Hadith<\/em>”, so it would be one reminder for the whole of MMSA rather than a Qur'an-only one. How often (every time, once a day, or off) can be a setting for each person.<\/p><\/div>\n<div class=\"n\">2<\/div><div><h3>In the Note, at the moment of contemplating <span class=\"tag\">recommended<\/span><\/h3>\n<p>When a Note is opened under a Critical Reasoning Approach (14–26), the empty Note shows a faint prompt before the first word is typed: <em>“It is for me. What is its instruction for me?”<\/em> This is where the article's third intention turns into work. It disappears as soon as the person writes.<\/p><\/div>\n<div class=\"n\">3<\/div><div><h3>The tagline strip <span class=\"tag\">nothing to build<\/span><\/h3>\n<p>The moving line under the app's name (today “Study ONE Hadith at Bed (before sleep)” and the others) is already yours to edit in the Taglines page. The four intentions can join it today, with no build at all.<\/p><\/div>\n<div class=\"n\">4<\/div><div><h3>As a dua before study<\/h3>\n<p>The fourth intention is itself a dua. It can sit at the top of the Dua tab as the dua to say before studying, and it belongs with Approach 16 (Deriving Dua).<\/p><\/div>\n<\/div>\n<p>What it should never be: a slice of the wheel, a “Not started / Achieved” status, or a count. A mindset that is scored becomes a box to tick.<\/p>", "topic": "tensteps"}, {"id": "cover", "title": "3. Do the ten steps cover everything?", "html": "<p><strong>For contemplating the meaning of an āyah by a common person, they cover the core very well.<\/strong> They move from what the text says, to what it asks of me, to its inner and rhetorical meaning, to patterns across the Qur'an, and only then to other people and the scholars. That order protects the reader's own reasoning, as you intend.<\/p>\n<p><strong>For an unbiased understanding of the Qur'an, Hadith and the Deen as a whole, and above all for a Fatwa, six things are missing or only implied.<\/strong> Each is a principle widely recognised in the study of the Qur'an and Hadith. Each also guards against bias rather than adding someone else's opinion.<\/p>\n\n<div class=\"gap\">\n<div class=\"n\">A<\/div><div><h3>Context: the passage around the āyah, and why it came down<\/h3>\n<p>An āyah read alone can be bent to almost any meaning. The steps never say “read the passage before and after it, and the whole Sūrah's theme”, nor “know the occasion of its revelation (asbāb al-nuzūl)”. Cherry-picking, taking one āyah out of its passage, is the most common way bias enters.<\/p>\n<p><em>Where it fits:<\/em> the Primary level, beside step 2 (subject). QR already shows the Rukūʿ and the Sūrah around every āyah.<\/p><\/div>\n\n<div class=\"n\">B<\/div><div><h3>The Qur'an explaining the Qur'an<\/h3>\n<p>Step 7 looks for patterns. It never says the plainer rule: before concluding, <strong>gather every āyah on the same subject<\/strong>, because one āyah often explains, limits or completes another. A conclusion drawn from one āyah when ten speak to the subject is a biased conclusion, even when every step was followed.<\/p>\n<p><em>Where it fits:<\/em> the Advanced level, as step 7's first task. QR's Related āyāt, QCR collections and word search are the tools.<\/p><\/div>\n\n<div class=\"n\">C<\/div><div><h3>The Sunnah: the explanation that came with the revelation<\/h3>\n<p>The article names Hadith in the intention (“read an Āyah or a Hadith”) but no step turns to it. Yet the Prophet ﷺ explained and lived the Qur'an: the Qur'an commands ṣalāh, and the Sunnah shows how. This is <strong>not the scholars' influence that your view guards against<\/strong>. It is revelation explaining revelation, and it comes from the same source as the āyah.<\/p>\n<p><strong>A correction I'd suggest to the order:<\/strong> keep the scholars' <em>opinions<\/em> last, as you say, but place the authentic Sunnah on the subject <em>before<\/em> them, at the Advanced level beside step 7.<\/p><\/div>\n\n<div class=\"n\">D<\/div><div><h3>For Hadith: is it authentic?<\/h3>\n<p>The steps assume a sound text, which the Qur'an always is. A hadith is not. Before contemplating a hadith, the first question is its grade (ṣaḥīḥ, ḥasan, ḍaʿīf…). Reasoning carefully over a weak or fabricated narration only gives a careful wrong answer.<\/p>\n<p><em>Where it fits:<\/em> a step 0 for Hadith. The HadeethEnc cards already show the grade.<\/p><\/div>\n\n<div class=\"n\">E<\/div><div><h3>A check on one's own bias<\/h3>\n<p>Your aim is understanding free of bias, prejudice and influence. Bias also comes from <em>inside<\/em>, from what a person wishes the āyah said. Step 9 (discussion without arrogance) touches this. One sharper question at the end of step 8 would make it a habit: <em>“What would show that my understanding is wrong? Am I reading what it says, or what I want it to say?”<\/em> Two more: separate what is <strong>certain<\/strong> from what is only <strong>probable<\/strong> (step 4 already speaks of certain knowledge), and end with “Allah knows best”.<\/p><\/div>\n\n<div class=\"n\">F<\/div><div><h3>Before a Fatwa: the tools of ruling<\/h3>\n<p>Your goal is that a student can one day stand on their own Fahm and Fatwa. The Qur'an itself values that (“so that they may gain understanding in the Deen”, 9:122, the pivot of your Approach 24). Here the two words need to be kept apart:<\/p>\n<p>• <strong>Fahm<\/strong>, understanding for one's own life, is open to every sincere reader who follows the steps.<\/p>\n<p>• <strong>Fatwa<\/strong>, a ruling that others act on, needs more than the ten steps. It needs knowing which āyāt or hadith abrogate or are abrogated, general against specific, absolute against restricted, consensus, and the objectives of the Sharīʿah. Without these, a sincere person can reach a ruling the texts themselves do not support.<\/p>\n<p>Your section 6 (24 Fiqh to ruling, 25 Fahm, 26 Ḥukm) is the place for these tools. Approach 24's own guide already says “under guidance”. The 9 Approaches of “Understanding of the Scholars”, ordered by time and level, are where they would be learned. I'd suggest naming them explicitly there, so that standing on one's own Fatwa is earned by these tools and does not stand against them.<\/p><\/div>\n<\/div>\n\n<div class=\"answer\">\n<p><strong>In short:<\/strong> the ten steps are a sound method of <em>contemplation<\/em>. For an unbiased <em>understanding<\/em> they need context (A), the Qur'an on the whole subject (B) and the Sunnah (C) before the scholars, a grade check for hadith (D), and a habit of questioning oneself (E). For a <em>Fatwa<\/em> they need the tools of ruling (F). None of these brings in the scholars early. A, B, C and D come from the texts themselves, and E from the reader.<\/p>\n<\/div>", "topic": "tensteps"}, {"id": "article", "title": "4. The article, step by step", "html": "<p>The author's point: contemplating the Qur'an is ordinary common sense that people “keep locked” for the Qur'an. They call it Critical Reasoning so a common person is not afraid of it. Tafsir comes last, “to reconcile your understanding”. The first eight steps are done on your own. The method is meant for the family, with children over 7: “print it and stick it on the wall of their study table”.<\/p>\n<div class=\"scroll\"><table>\n<thead><tr><th>Level<\/th><th>Step<\/th><th>The question the reader asks<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"lvl\">Intention<br><span class=\"meta\">a mindset, not a level<\/span><\/td><td>always<\/td><td>(1) Take it personally: the Qur'an was revealed to me, or for me (al-Ḥasan al-Baṣrī: “personal letters from their Rabb”). (2) Imagine being present in the time of the Messenger ﷺ, or that a messenger was sent for this time. (3) Find the instruction for me and implement it. (4) Ask Allah to guide me to what saves me from the grave, Qiyāmah and Jahannam, and makes my way to Jannah easy.<\/td><\/tr>\n<tr><td class=\"lvl\" rowspan=\"4\">Primary<\/td><td>1<\/td><td><strong>What type of āyah is it?<\/strong> A command, a prohibition, a warning, a recommended thing, a not-recommended thing, or a description? If it is a dua: a request, or praise and thanks?<\/td><\/tr>\n<tr><td>2<\/td><td><strong>What is the subject?<\/strong> Allah, the Messenger ﷺ, the Qur'an, the Prophets, the angels, Qiyāmah, Jannah, Jahannam, the human being, shaiṭān, creations (bees, ants), the kuffār, the believers… What is said about it, and to whom?<\/td><\/tr>\n<tr><td>3<\/td><td><strong>What is in it for me?<\/strong> Direct: what I must obey, must not do, a limit I keep within, a warning to be careful of, what I try my best to do or not to do. Indirect: the qualities of the people of Jannah I must achieve (mufliḥūn, mukhlaṣūn, ṣāliḥūn, ṣādiqūn, muḥsinūn), and of the people of Jahannam I must avoid (ẓālimūn, khāsirūn).<\/td><\/tr>\n<tr><td>4<\/td><td><strong>What is the certain knowledge here?<\/strong> If there is nothing to do, what certain knowledge does it give me: the Muslim's mindset and philosophy of life?<\/td><\/tr>\n<tr><td class=\"lvl\" rowspan=\"2\">Intermediate<\/td><td>5<\/td><td>Look for the <strong>inner meaning<\/strong>.<\/td><\/tr>\n<tr><td>6<\/td><td>Look for the <strong>rhetorical meaning<\/strong>, which comes from understanding the language.<\/td><\/tr>\n<tr><td class=\"lvl\" rowspan=\"2\">Advanced<\/td><td>7<\/td><td><strong>Extract an unknown pattern<\/strong> from observing a known pattern.<\/td><\/tr>\n<tr><td>8<\/td><td><strong>Extract symmetry or dis-symmetry<\/strong> (mathematical, analytical ability).<\/td><\/tr>\n<tr><td class=\"lvl\" rowspan=\"2\">Final (connecting)<\/td><td>9<\/td><td><strong>Discuss<\/strong>, accommodating others' opinions and beware of arrogance.<\/td><\/tr>\n<tr><td>10<\/td><td><strong>Reconcile<\/strong> your understanding with the classical and contemporary scholars, by reading tafsir.<\/td><\/tr>\n<\/tbody><\/table><\/div>", "topic": "tensteps"}, {"id": "approaches", "title": "5. The Approaches that are Critical Reasoning", "html": "<div class=\"flag\"><strong>Numbers in sections 4–9.<\/strong> These sections use the app's built-in numbering (30 Approaches). Your live numbering (the Approach Map above) differs: built-in 10 Journaling = your 14; 13 Story = 11; 14 Naẓar = 15; 15 ʿAql = 16; 16 Deriving Dua = 17; 17 Names = 18; 18 Prophets = 20; 19 Miracles = 19; 20 Tafakkur = 21; 21 Tadabbur = 22; 22 Tafaqquh = 23; 23 Tadhakkur = 24; 24 Fiqh to Ruling = 25; 25 Fahm = 26; 26 Ḥukm = 27; 27 Discussion = 37; 28 Living by it = 38; 29 Daʿwah = 39; 30 Teaching = 40. The QCR collection names (“14 · Naẓar” and so on) also carry the built-in numbers.<\/div>\n<p>Four of QR's sections carry “Critical Reasoning” in their name: <strong>sections 3 to 6, Approaches 14 to 26<\/strong>. The quoted line under each name is your own one-line gloss from the original app.<\/p>\n<div class=\"scroll\"><table>\n<thead><tr><th>Section<\/th><th>Approach<\/th><th>Your gloss<\/th><th>QCR collection (year band)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td rowspan=\"2\">3 · Naẓar / ʿAql<\/td><td>14 Beginner's Level: Observation (Naẓar)<\/td><td>“See it as it is”<\/td><td>14 · Naẓar <span class=\"pill y\">Y3<\/span><\/td><\/tr>\n<tr><td>15 Primary Level: Common Sense (ʿAql / Taʿaqqul)<\/td><td>“Make it make sense”<\/td><td>15 · Taʿaqqul <span class=\"pill y\">Y4<\/span><\/td><\/tr>\n<tr><td rowspan=\"4\">4 · Applied Threads<\/td><td>16 Deriving Dua<\/td><td>“Turn the ayah into a prayer”<\/td><td>none<\/td><\/tr>\n<tr><td>17 Deriving Names &amp; Attributes of Allah<\/td><td>“Know Him through His word”<\/td><td>none in QCR (Asma ul Husna does this)<\/td><\/tr>\n<tr><td>18 Deriving Understanding of the Prophets<\/td><td>“Learn the Sunnah before the Sunnah”<\/td><td>none<\/td><\/tr>\n<tr><td>19 Reflecting on the Miracles<\/td><td>“Marvel at what convinces”<\/td><td>none<\/td><\/tr>\n<tr><td rowspan=\"4\">5 · Tafakkur / Tadabbur<\/td><td>20 Intermediate Level: Tafakkur<\/td><td>“Turn it over”<\/td><td>20 · Tafakkur <span class=\"pill y\">Y6–12<\/span><\/td><\/tr>\n<tr><td>21 Advanced Level: Tadabbur<\/td><td>“Follow it to its depths”<\/td><td>21 · Tadabbur <span class=\"pill y\">Y5<\/span><\/td><\/tr>\n<tr><td>22 Higher Level: Tafaqquh<\/td><td>“Know it, and know its edges — deep, but for the common person; no classical Islamic training required”<\/td><td>22 · Tafaqquh <span class=\"pill y\">Y5<\/span><\/td><\/tr>\n<tr><td>23 Upper Higher Level: Dhikr / Tadhakkur<\/td><td>“Let it move you”<\/td><td>23 · Tadhakkur <span class=\"pill y\">Y6<\/span><\/td><\/tr>\n<tr><td rowspan=\"3\">6 · Judgement / Authority<\/td><td>24 Mastery Level: where Fiqh turns to Ruling (9:122)<\/td><td>“…the same word, fiqh, shifts from deep understanding to the ruling of Deen itself”<\/td><td>none (9:122 is in 22 · Tafaqquh)<\/td><\/tr>\n<tr><td>25 Judgment (Fahm)<\/td><td>“Make it precise, for here and now”<\/td><td>25 · Fahm <span class=\"pill y\">Y8–12<\/span><\/td><\/tr>\n<tr><td>26 Authority: Ḥukm / Taḥākum<\/td><td>“Let it govern you”<\/td><td>26 · Ḥukm <span class=\"pill y\">Y8–12<\/span><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Six more Approaches serve Critical Reasoning without carrying its name, and the article needs every one of them:<\/p>\n<ul>\n<li><strong>03 Reading with Meaning<\/strong>: a reader cannot do step 1 without knowing what the āyah says.<\/li>\n<li><strong>04 Word-by-Word<\/strong> and <strong>06 Basic Grammar<\/strong>: the foundation for step 6 (rhetoric “comes upon understanding the linguistic aspect”).<\/li>\n<li><strong>10 Journaling<\/strong>: where the answers to each step are written.<\/li>\n<li><strong>27 Group / Class Discussion<\/strong>: step 9 itself, and the family circle the article asks for.<\/li>\n<li><strong>28 Living by it<\/strong>: the third intention (“implement it”) and step 3's “what I must obey”.<\/li>\n<\/ul>\n<p>Your own data has more. It has <strong>8 sections and 40 Approaches<\/strong>: a third Approach in section 3, and a new section <strong>“Understanding of the Scholars”<\/strong> with 9 Approaches. From the app's test records (they copy your sections and counts, not the names), the counts per section are 6, 7, 3, 4, 4, 3, 9 and 4. That new section is the article's step 10.<\/p>\n\n<h3>The other QCR collections<\/h3>\n<p>Ten of the 18 collections are not named after an Approach. Each one matches a step of the article:<\/p>\n<div class=\"scroll\"><table>\n<thead><tr><th>QCR collection<\/th><th>Band<\/th><th>What it gathers<\/th><th>Article step<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>§5 · Preconditions<\/td><td><span class=\"pill y\">Y1–2<\/span><\/td><td>what blocks or opens understanding (e.g. 2:12, 6:109, 7:95)<\/td><td>The intention, and the “wrap of shaiṭān” the article opens with<\/td><\/tr>\n<tr><td>§4 · Raʾā family<\/td><td><span class=\"pill y\">Y3<\/span><\/td><td>“have you not seen…”: 44 āyāt<\/td><td>1–2 (observe: Naẓar)<\/td><\/tr>\n<tr><td>Āyah-Formula “Inna fī dhālika la-āyāt…”<\/td><td><span class=\"pill y\">Y3<\/span><\/td><td>“in that are signs for a people who…”: 62 āyāt<\/td><td>4 (certain knowledge) at Y3; 7 (a known pattern) later<\/td><\/tr>\n<tr><td>§4 · Sayr fil-Arḍ<\/td><td><span class=\"pill y\">Y4<\/span><\/td><td>“travel the land and see”: 14 āyāt<\/td><td>2–3 (subject, and what is in it for me)<\/td><\/tr>\n<tr><td>Hal min… (challenge for a rival)<\/td><td><span class=\"pill y\">Y4<\/span><\/td><td>“is there any of your partners who…”: 4 āyāt<\/td><td>4 (certain knowledge by elimination); 7 (a pattern of argument)<\/td><\/tr>\n<tr><td>§9 · Adjacent / Safeguards<\/td><td><span class=\"pill y\">Y6<\/span><\/td><td>āyāt that guard reasoning (verify news 49:6; ask the people of knowledge 16:43, 21:7)<\/td><td>9–10: the Qur'an's own instruction to check with scholars<\/td><\/tr>\n<tr><td>Afaman… (comparative inference)<\/td><td><span class=\"pill y\">Y7<\/span><\/td><td>“is one who… like one who…?”: 16 āyāt<\/td><td><strong>8 itself<\/strong>: two parties set side by side, alike or unlike<\/td><\/tr>\n<tr><td>§4 · Iʿtibār<\/td><td><span class=\"pill y\">Y7–12<\/span><\/td><td>“in that is a lesson for…”: 7 āyāt<\/td><td>7: from a known case to an unknown one<\/td><\/tr>\n<tr><td>§6 · Audience Epithets<\/td><td><span class=\"pill\">All years<\/span><\/td><td>the people the signs are for (ulu'l-albāb, people who reason, who reflect…): 22 āyāt<\/td><td>3 indirect: the qualities “I have to achieve”<\/td><\/tr>\n<tr><td>Proposed New Families<\/td><td><span class=\"pill\">pending split<\/span><\/td><td>89 āyāt waiting to be sorted<\/td><td>(not yet placed)<\/td><\/tr>\n<\/tbody><\/table><\/div>", "topic": "tensteps"}, {"id": "levels", "title": "6. Which article level fits which QR level", "html": "<p>“Level” means two things in QR, and the article meets both. Five of the Critical Reasoning Approaches carry a level in their name: Beginner's, Primary, Intermediate, Advanced and Higher. QCR collections also carry a <strong>year level<\/strong> (Yr 1 to Yr 12, and adult). Each card below gives both.<\/p>\n\n<div class=\"levels\">\n\n<section class=\"level\">\n<h3>Primary level: steps 1–4<\/h3>\n<ol class=\"steps\"><li>Type of āyah<\/li><li>Subject<\/li><li>What is in it for me<\/li><li>Certain knowledge<\/li><\/ol>\n<dl>\n<dt>QR Approaches<\/dt><dd><span class=\"pill ap\">14 Naẓar: Beginner's<\/span> for steps 1–2 (“see it as it is”: what kind of statement it is, about whom). <span class=\"pill ap\">15 ʿAql: Primary<\/span> for steps 3–4 (“make it make sense”: what it means for me, what it makes certain).<br>\nThe <strong>Applied Threads<\/strong> are step 2's subject list made into Approaches: <span class=\"pill ap\">17 Names of Allah<\/span> (subject: Allah), <span class=\"pill ap\">18 Prophets<\/span>, <span class=\"pill ap\">19 Miracles<\/span> (creations, signs). <span class=\"pill ap\">16 Deriving Dua<\/span> is step 1's “what type of dua is it: a request or praise?”<\/dd>\n<dt>QCR<\/dt><dd>14 Naẓar, Raʾā family, Āyah-Formula <span class=\"pill y\">Y3<\/span>; 15 Taʿaqqul, Sayr fil-Arḍ, Hal min… <span class=\"pill y\">Y4<\/span>; Audience Epithets <span class=\"pill\">All years<\/span> for step 3's “qualities of the people of Jannah”.<\/dd>\n<dt>Year level<\/dt><dd><strong>Yr 3–4<\/strong> as a level to master, started from <strong>Yr 2 (age 7)<\/strong>, which is the article's own “children over 7”. This agrees with QCR's own bands.<\/dd>\n<dt>Naming note<\/dt><dd>The article's single “Primary level” is QR's two lowest levels. QR's “Beginner's” (14) is steps 1–2 and QR's “Primary” (15) is steps 3–4. No renaming is needed; the article simply groups them.<\/dd>\n<\/dl>\n<\/section>\n\n<section class=\"level\">\n<h3>Intermediate level: steps 5–6<\/h3>\n<ol class=\"steps\" start=\"5\"><li>Inner meaning<\/li><li>Rhetorical meaning (through the language)<\/li><\/ol>\n<dl>\n<dt>QR Approaches<\/dt><dd><span class=\"pill ap\">20 Tafakkur: Intermediate Level<\/span>, the same word as the article. Step 6 rests on <span class=\"pill ap\">04 Word-by-Word<\/span> and <span class=\"pill ap\">06 Basic Grammar<\/span>: rhetoric needs the language first.<\/dd>\n<dt>QCR<\/dt><dd>20 Tafakkur <span class=\"pill y\">Y6–12<\/span>.<\/dd>\n<dt>Year level<\/dt><dd><strong>Yr 5–6 onward<\/strong>. Step 5 can start at Yr 5; step 6 waits until the reader has some grammar.<\/dd>\n<dt>Tools QR already has<\/dt><dd>The Word card (root, dictionary word, grammar, verb forms, related words), the Quranic Arabic Corpus grammar for every word, word-by-word meaning, and the differences between near-synonyms (Furūq). These are the tools for step 6.<\/dd>\n<\/dl>\n<\/section>\n\n<section class=\"level\">\n<h3>Advanced level: steps 7–8<\/h3>\n<ol class=\"steps\" start=\"7\"><li>Unknown pattern from a known pattern<\/li><li>Symmetry or dis-symmetry<\/li><\/ol>\n<dl>\n<dt>QR Approaches<\/dt><dd><span class=\"pill ap\">21 Tadabbur: Advanced Level<\/span>, again the same word. Its guide already says “consider how the āyah connects to other āyahs”, which is step 7.<\/dd>\n<dt>QCR<\/dt><dd>Āyah-Formula, Hal min… and Iʿtibār are <strong>known patterns<\/strong> for step 7. <strong>Afaman… <span class=\"pill y\">Y7<\/span> is step 8 itself<\/strong>: “is one who… like one who…?” sets two parties side by side to be judged alike or unlike. 21 Tadabbur <span class=\"pill y\">Y5<\/span> holds 4:82, “had it been from other than Allah they would have found much contradiction in it”, which is the Qur'an's own call to look for symmetry.<\/dd>\n<dt>Year level<\/dt><dd><strong>Yr 7 onward<\/strong> (Afaman Y7, Iʿtibār Y7–12).<\/dd>\n<dt>Tools QR already has<\/dt><dd>Related āyāt on the Āyah card (rarer shared words, same QCR collection, same Name of Allah); Explore's wheel, where a collection's āyāt are laid out together; Ruku', Juz and Page units.<\/dd>\n<\/dl>\n<\/section>\n\n<section class=\"level\">\n<h3>Final level: steps 9–10<\/h3>\n<ol class=\"steps\" start=\"9\"><li>Discuss, without arrogance<\/li><li>Reconcile with the scholars (tafsir)<\/li><\/ol>\n<dl>\n<dt>QR Approaches<\/dt><dd><span class=\"pill ap\">27 Group / Class Discussion<\/span> is step 9. Your section <span class=\"pill ap\">Understanding of the Scholars<\/span> (9 Approaches) is step 10.<\/dd>\n<dt>QCR<\/dt><dd>§9 Adjacent / Safeguards <span class=\"pill y\">Y6<\/span>: 16:43 and 21:7, “ask the people of knowledge if you do not know”, and 49:6, verify news.<\/dd>\n<dt>Year level<\/dt><dd>Step 9 at <strong>every year<\/strong>: the family circle includes the youngest. Step 10 as a level from <strong>Yr 8–12<\/strong>, with tafsir read <em>to<\/em> a younger child before that.<\/dd>\n<dt>Your reason<\/dt><dd>The scholars come last so that they do not shape the student's understanding; they are there to reconcile it (section 1). Your 9 Approaches order them by time and level.<\/dd>\n<dt>Gap<\/dt><dd><strong>QR has no tafsir in it today.<\/strong> The app holds the Arabic, two translations, word grammar and HadeethEnc's hadith explanations, but no tafsir text. Step 10 sends the reader outside the app.<\/dd>\n<\/dl>\n<\/section>\n\n<section class=\"level\">\n<h3>Beyond the article: QR's higher levels<\/h3>\n<dl>\n<dt>QR Approaches<\/dt><dd><span class=\"pill ap\">22 Tafaqquh: Higher<\/span>, <span class=\"pill ap\">23 Tadhakkur: Upper Higher<\/span>, and section 6: <span class=\"pill ap\">24 Fiqh to ruling<\/span>, <span class=\"pill ap\">25 Fahm<\/span>, <span class=\"pill ap\">26 Ḥukm<\/span>.<\/dd>\n<dt>How they relate<\/dt><dd>22 is structured understanding “for the common person”: the result of steps 1–8, held together. 23 Tadhakkur (“let it move you”) is what the intention aims at, so it is the fruit of every level rather than one more step. Section 6 is where understanding becomes a ruling. The article never goes there: it ends with reconciling one's understanding with the scholars. Approach 24's own guide already says “under guidance”.<\/dd>\n<dt>Year level<\/dt><dd>QCR: Tafaqquh <span class=\"pill y\">Y5<\/span>, Tadhakkur <span class=\"pill y\">Y6<\/span>, Fahm and Ḥukm <span class=\"pill y\">Y8–12<\/span>.<\/dd>\n<\/dl>\n<\/section>\n<\/div>", "topic": "tensteps"}, {"id": "disagree", "title": "7. Where they disagree", "html": "<div class=\"flag\"><strong>1. The order of the scholars and rulings: answered by your view, to confirm.<\/strong> QR puts <em>Judgement / Authority<\/em> (24–26) before Discussion (27), and in your data “Understanding of the Scholars” comes after Judgement / Authority. Your view says reconciling with the scholars comes before standing on one's own Fahm or Fatwa. So the order would become: own reasoning (14–23), then Discussion (27), then Understanding of the Scholars, then Judgement / Authority (24–26). This needs your yes (question 2): it moves sections, it adds nothing.<\/div>\n<div class=\"flag\"><strong>2. Year bands against the level names.<\/strong> In QCR, <em>21 Tadabbur, “Advanced”<\/em> is <strong>Y5<\/strong>, while <em>20 Tafakkur, “Intermediate”<\/em> is <strong>Y6–12<\/strong>. In the article, Intermediate comes before Advanced. Either Tadabbur's band is low because its four āyāt are short and clear (4:82, 23:68, 38:29, 47:24 all ask “do they not ponder?”), or one band is a slip (question 4).<\/div>\n<div class=\"flag\"><strong>3. The article's first step has no home in QR.<\/strong> “What type of āyah is it?” is the first question asked of every āyah, and there is nowhere to mark an āyah as a command, a prohibition, a warning or a description. Today a reader can only write the answer in a Note.<\/div>\n<h3>What the grammar data can already suggest for step 1<\/h3>\n<p>QR already carries the Quranic Arabic Corpus grammar for every word. Counted across all 6,236 āyāt:<\/p>\n<div class=\"nums\">\n<div class=\"num\"><b>1,309<\/b><span>āyāt with a command (imperative verb, or the lām of command)<\/span><\/div>\n<div class=\"num\"><b>289<\/b><span>with a prohibition (lā of forbidding)<\/span><\/div>\n<div class=\"num\"><b>830<\/b><span>with a question<\/span><\/div>\n<div class=\"num\"><b>866<\/b><span>with a condition (“if…”)<\/span><\/div>\n<div class=\"num\"><b>356<\/b><span>with a call (“O you who…”)<\/span><\/div>\n<div class=\"num\"><b>4,795<\/b><span>with neither command nor prohibition<\/span><\/div>\n<\/div>\n<p>These are <strong>suggestions, never answers<\/strong>. A command spoken by Firʿawn or by the disbelievers, quoted in an āyah, is not a command to the reader. Telling them apart is exactly the reasoning step 1 trains, so the computer can only point and a person decides. Warning, recommended and not-recommended have no grammar mark at all.<\/p>", "topic": "tensteps"}, {"id": "could", "title": "8. What QR could do with this", "html": "<p>None of these is built. Each new screen gets a demo first.<\/p>\n<ol>\n<li><strong>The intention reminder<\/strong> (section 2): the once-a-day line when study opens, and the Note's faint prompt. The tagline lines you can add yourself today.<\/li>\n<li><strong>Write the article's questions into the Approaches' guides.<\/strong> 14, 15, 20, 21 and 27 have “what / how / measure” guides that are general today. The article's questions are sharper, and so are the six additions A–E. This is text only: you can edit it in Catalogue, or I can draft it for you to correct.<\/li>\n<li><strong>A “Ten Steps” question card on the Note<\/strong>: under a Critical Reasoning Approach, that level's questions as headings to answer under. For example, for 14: “Type of āyah? · Subject? · To whom? · The passage around it?”<\/li>\n<li><strong>Step 1 marks<\/strong> from the grammar (command, prohibition, question, call, condition), shown as “the grammar suggests”, for a person to confirm.<\/li>\n<li><strong>Year levels on the Critical Reasoning Approaches themselves<\/strong>, from section 6, as the first piece of the Y1–Y12 system you asked for on 26 Aug.<\/li>\n<li><strong>A tafsir source for step 10<\/strong>, with rights checked the way the hadith sources were. Your “time and level” order of the scholars decides which tafsir comes first.<\/li>\n<\/ol>", "topic": "tensteps"}, {"id": "questions", "title": "9. Questions for you", "html": "<ol class=\"q\">\n<li><strong>The 10 Approaches you added.<\/strong> <em>Answered 9 Oct: all 40 are in the Approach Map.<\/em><\/li>\n<li><strong>The order.<\/strong> By your view, “Understanding of the Scholars” (and Discussion) come before Judgement / Authority. Shall I move them so? <em>Recommended: yes.<\/em><\/li>\n<li><strong>The Sunnah and the Companions.<\/strong> Should the authentic Sunnah on the subject come before the scholars, as revelation explaining revelation (gap C)? And where do the Companions' explanations sit: with the Sunnah (early) or with the scholars (last)? <em>Recommended: the Sunnah early; the Companions is your call.<\/em><\/li>\n<li><strong>Tadabbur's year band.<\/strong> Is Y5 right for 21 Tadabbur (Advanced) when 20 Tafakkur (Intermediate) is Y6–12?<\/li>\n<li><strong>The intention reminder.<\/strong> Once a day when study opens, plus the Note's prompt (section 2)? <em>Recommended: yes, with a setting for each person.<\/em><\/li>\n<li><strong>Which to build first?<\/strong> <em>Recommended:<\/em> the intention reminder and the guides' text (no new screen beyond a one-line card), then the question card, with a demo first.<\/li>\n<\/ol>\n<p class=\"src\">Prepared by the MMSA Architect; revised 9 Oct 2026 with the Owner's views. Counts: QCR from <code>app/js/qcr-data.js<\/code>; grammar from <code>tools/quran-data-pull/output/word-features<\/code> (Quranic Arabic Corpus), counted per āyah; section counts from the app's test records of your data.<\/p>", "topic": "tensteps"}, {"id": "issues-keys", "title": "📋 Issues: decided, pending, for later", "html": "<p>Every issue of this feature in one table: when it was raised, the decision taken and its date, and what is pending or kept for later. Press <strong>✓<\/strong> on a row, or <strong>✓ Served<\/strong> on any heading, when it has served its purpose; the <strong>Served<\/strong> switch at the top fades it, hides it, or shows everything. Press <strong>✎ Edit<\/strong> to change a cell, add a row, or change a status, then <strong>Save<\/strong>.<\/p>", "kind": "issues", "topic": "keys"}, {"id": "k-talk", "title": "★ Our conversation (Keys)", "html": "<p>This tab keeps our conversation about the keys. As in the Ten Steps tab: press <strong>✎ Edit<\/strong>, then <strong>+ Add your note here<\/strong>, then <strong>Save<\/strong>.<\/p>\n<div class=\"owner\">\n<p class=\"label\">You (10 Oct 2026)<\/p>\n<p>Both in the Word card and the Āyah card, how about a marking of difficulty, such as Hard, or Need to dig in the dictionary (for a word) to get the correct, comprehensive understanding (need a term)? For an āyah: need to see the relevant Hadith; scholars' opinions of different eras; its understanding depends on other relevant āyāt; its understanding depends on the whole range, group or block of āyāt and is not complete on its own. Don't build anything; give me your opinion and a demo.<\/p>\n<\/div>\n<div class=\"answer\">\n<p><strong>The Architect (10 Oct):<\/strong> a demo of the keys on the Word card and the Āyah card, with my opinion and four questions. It is in section 2 of this tab, unchanged.<\/p>\n<\/div>\n<div class=\"owner\">\n<p class=\"label\">You (10 Oct 2026)<\/p>\n<p>Like the TenSteps/QCR, place this discussion in the same file with a different tab (let's use this file as a master to preserve all feature-related discussions always). Deliver me in HTML; keep the date and version continuation. Include all your suggestions and the demo. Now:<\/p>\n<ol>\n<li>I want this to display in the STATUS wheel, as with All, but this time only by: Āyah in each Surah; Word that falls in one Āyah; Word that falls in each Āyah of each Surah.<\/li>\n<li>The related Hadith should automatically be fetched (possible?).<\/li>\n<li>When the Hadith approach is selected for an Āyah (not related to this build, but we can connect the Hadith approach with the Āyah here, can't we?), the same automatic related hadith should appear (possible?).<\/li>\n<li>Understanding of the Scholars by era could be fetched here, possible? The same can be connected to the Approaches about the Scholars. (Look at <a href=\"https://maani.tech/\">maani.tech<\/a>: how they bring the scholars' text. We want to place this and other scholars' source texts, by the era of the scholars, to fit our different Approaches about knowing the scholars' understanding.) Let me know what you think, and suggest again.<\/li>\n<\/ol>\n<p>* Yes, freeze Legacy v09.151.<\/p>\n<\/div>\n<div class=\"answer\">\n<p><strong>The Architect (10 Oct), version v07:<\/strong><\/p>\n<p>• <strong>This file is now the master.<\/strong> It has tabs at the top: <em>Ten Steps &amp; QR Levels<\/em> (everything as it was) and <em>🔑 Keys to Understanding<\/em> (this one). Each new feature discussion gets its own tab. The version continues (v07), and Export names the file with the date and version: <em>2026-10-10-mmsa-feature-discussions-v07.html<\/em>.<\/p>\n<p>• <strong>1, the wheel: yes.<\/strong> A working demo is in section 3, with the three views you asked for and a fourth for the whole Qur'an.<\/p>\n<p>• <strong>2, related Hadith fetched automatically: yes, partly, and I measured how much.<\/strong> Our own 15 hadith books quote <strong>1,107 of the 6,236 āyāt<\/strong> word for word, and the computer finds them with no internet. The rest come from the tafsirs that collect narrations. See section 4.<\/p>\n<p>• <strong>3, the Hadith approach: yes.<\/strong> It is the same lookup, keyed by the āyah, so any screen holding an āyah can show it. One question: the Approach Map has no Approach named \"Hadith\". Do you mean a new Approach, or the Hadith Study module? See question 5.<\/p>\n<p>• <strong>4, the scholars by era: yes, and better than maani.tech for your purpose.<\/strong> About 70 classical and modern tafsirs are openly available āyah by āyah. I placed 30 of them in your eras Gen1–Gen6 and the Madhab Approaches 32–36. maani.tech shows three or four books chosen by an AI with no era at all. See section 5.<\/p>\n<p>• <strong>Legacy v09.151:<\/strong> frozen as you said, in the app repository (Legacy App - v09), the same way as v08.<\/p>\n<p>• <strong>Nothing is built in the app.<\/strong> Section 6 is my suggested plan, and section 7 asks the questions only you can answer.<\/p>\n<\/div>", "topic": "keys"}, {"id": "k-idea", "title": "1. The keys, and my opinion", "html": "<p>The keys answer a question that progress does not: <em>what does this text need before I can understand it?<\/em> Progress (Learning, Practising, Achieved…) says how far I have studied. A key says what the text needs. Kept apart, neither muddies the other.<\/p>\n<h3>The keys, with the names our scholars already use<\/h3>\n<div class=\"scroll\"><table><thead><tr><th>Key<\/th><th>On<\/th><th>Plain words<\/th><th>Who sets it<\/th><th>Can the computer suggest it?<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Hard for me<\/strong><\/td><td>word, āyah<\/td><td>I find this hard<\/td><td>each reader, for themselves<\/td><td>No<\/td><\/tr>\n<tr><td><strong>Gharīb<\/strong> (غريب)<\/td><td>word<\/td><td>needs the dictionary<\/td><td>Owner/Prime; readers can add<\/td><td><strong>Yes:<\/strong> a root-word used once in the Qur'an. 1,995 of 4,832 are.<\/td><\/tr>\n<tr><td><strong>Wujūh<\/strong> (وجوه)<\/td><td>word<\/td><td>more than one meaning in the Qur'an<\/td><td>Owner/Prime<\/td><td>Suggest only: its root has more than one meaning group in our data<\/td><\/tr>\n<tr><td><strong>Needs Hadith<\/strong> (bis-Sunnah)<\/td><td>āyah<\/td><td>the Prophet's explanation ﷺ is needed<\/td><td>Owner/Prime<\/td><td><strong>Yes:<\/strong> a hadith quotes it (1,107 āyāt)<\/td><\/tr>\n<tr><td><strong>Scholars across the eras<\/strong> (Aqwāl al-Mufassirīn)<\/td><td>āyah<\/td><td>read the scholars, early and later<\/td><td>each reader, or Owner/Prime<\/td><td>No: every āyah has tafsir, so it is a choice<\/td><\/tr>\n<tr><td><strong>Explained by other āyāt<\/strong> (al-Qur'ān bil-Qur'ān)<\/td><td>āyah<\/td><td>another āyah explains it<\/td><td>Owner/Prime<\/td><td>Partly: al-Shinqīṭī's <em>Aḍwā' al-Bayān<\/em> is exactly this<\/td><\/tr>\n<tr><td><strong>Read with its passage<\/strong> (Siyāq)<\/td><td>āyah<\/td><td>not complete on its own<\/td><td>Owner/Prime<\/td><td>Suggest only: from its Ruku'<\/td><\/tr>\n<tr><td><strong>Asbāb an-Nuzūl<\/strong><\/td><td>āyah<\/td><td>the event it came down about<\/td><td>Owner/Prime<\/td><td><strong>Yes:<\/strong> from al-Wāḥidī's book, where it has an entry<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>My opinion (unchanged from the demo, shortened)<\/h3>\n<ol>\n<li><strong>Worth building, and separate from progress.<\/strong><\/li>\n<li><strong>Two kinds of mark:<\/strong> \"Hard for me\" is personal; the other keys are facts about the text, set for the madrasah, and each reader can add their own.<\/li>\n<li><strong>The computer suggests and never decides.<\/strong> A suggestion is drawn dashed and says \"to be checked\", like the dua words.<\/li>\n<li><strong>Every key leads somewhere:<\/strong> Gharīb to the dictionaries on the Word card; Hadith to the related hadith; other āyāt to Connected āyāt; Siyāq to the passage as a Range; scholars to the scholars by era. What the reader finds goes in a Note in the Notes pane.<\/li>\n<li><strong>The keys are the doorways to the Ten Steps' later steps<\/strong> (Hadith, scholars, context). The Ten Steps tab can say which key belongs to which step.<\/li>\n<\/ol>", "topic": "keys"}, {"id": "k-demo1", "title": "2. Demo: the keys on the Word card and the Āyah card", "html": "<p>The first demo (10 Oct): tick the keys on a word (مُّقْمَحُونَ, 36:8) and on its āyah, and see \"My list\". It works inside this page; it is also on <a href=\"https://claude.ai/artifact/XeV3WUjEEg4PbGJsafz9Pj\">its own page<\/a>.<\/p>", "kind": "demo", "demo": "keys-cards", "topic": "keys"}, {"id": "k-wheel", "title": "3. On the Status wheel (your point 1)", "html": "<p><strong>Your point 1.<\/strong> The Status wheel already has <em>All units<\/em> (six rings). The keys get their own wheel with the levels you named:<\/p>\n<ol>\n<li><strong>Āyāt of the Surah:<\/strong> one ring, a slice per āyah;<\/li>\n<li><strong>Words of one āyah:<\/strong> one ring, a slice per word, with the word written beside it;<\/li>\n<li><strong>Words in every āyah of the Surah:<\/strong> two rings, āyāt inside and their words outside, each word under its own āyah;<\/li>\n<li>and one more I suggest: <strong>the whole Qur'an<\/strong>, Surahs inside and all 6,236 āyāt outside, to see where the keys fall.<\/li>\n<\/ol>\n<p>A slice with several keys shows them as stripes, one colour each. <strong>Keys: All<\/strong> shows every key; choosing one key shows only it. Tap a slice to see its keys, its related hadith and its scholars.<\/p>\n<p class=\"meta\">What is real in the demo: Yā-Sīn's 83 āyāt and 725 words with their meanings; the Gharīb, Wujūh, Hadith and Asbāb keys, computed from our data and al-Wāḥidī; the whole-Qur'an counts. What is an example: the \"Hard for me\", \"Scholars\", \"other āyāt\" and \"passage\" marks. <strong>One finding:<\/strong> Wujūh, as our data can suggest it, touches 4,910 of the 6,236 āyāt, so it is left out of \"All\" on the whole-Qur'an view; at word level it is 118 of Yā-Sīn's 725 words, which is useful.<\/p>", "kind": "demo", "demo": "keys-wheel", "topic": "keys"}, {"id": "k-hadith", "title": "4. Related Hadith, found automatically (your points 2 and 3)", "html": "<h3>Your point 2: can the related hadith be found automatically?<\/h3>\n<p><strong>Yes, for about one āyah in six, with no internet and no outside service.<\/strong> I tested it today on our own 15 hadith books (82,360 hadith texts, already in the repository for Hadith Study and the Dua tab):<\/p>\n<ul>\n<li><strong>Test 1, the book's own label.<\/strong> The printed editions of Muslim, the Musnad, the Muwaṭṭa' and Riyāḍ aṣ-Ṣāliḥīn mark every Qur'an quotation, for example <span lang=\"ar\">{والشمس تجري لمستقر لها} [يس: 38]<\/span>. Reading those labels finds <strong>680 āyāt<\/strong>.<\/li>\n<li><strong>Test 2, the words themselves.<\/strong> Bukhārī, Tirmidhī and the others do not label. There the computer looks for a run of five words that occurs in that one āyah only, so common phrases such as \"Allah is over all things capable\" cannot give false matches. That finds <strong>936 āyāt<\/strong>.<\/li>\n<li><strong>Together: 1,107 of 6,236 āyāt (18%), in 105 of the 114 Surahs.<\/strong><\/li>\n<\/ul>\n<p><strong>Example, 36:38<\/strong> (\"and the sun runs to a resting place of its own\"): <strong>Bukhārī 4802 and 3199, Muslim 159<\/strong>, and four narrations in the Musnad, all Abū Dharr's hadith, \"its resting place is beneath the Throne\". <strong>36:12<\/strong> (\"We record what they sent ahead and their traces\"): <strong>Tirmidhī 3226<\/strong>, Banū Salimah wanting to move near the masjid. The numbers are the standard ones, read through the concordance we built for Hadith Study.<\/p>\n<p><strong>What it cannot find:<\/strong> a hadith that explains an āyah without quoting it. 36:8 has none quoting it, yet the narrations about it exist. Those come from the tafsirs that <em>collect<\/em> narrations under each āyah: Ibn Kathīr, al-Suyūṭī's <em>ad-Durr al-Manthūr<\/em>, and the modern <em>Mawsū'at at-Tafsīr al-Ma'thūr<\/em> (2017), which gathers the Prophet's ﷺ, the Sahaba's and the Tabi'in's words under every āyah, each with its chain and grading. So the panel would show two lists: <em>\"hadith that quote this āyah\"<\/em> (exact, from our books) and <em>\"narrations the scholars connect to it\"<\/em> (from those tafsirs).<\/p>\n<p class=\"meta\">A care point: a hadith found this way is shown with its book and number and its grading where we have one. Finding is not grading.<\/p>\n<h3>Your point 3: the Hadith approach and the āyah<\/h3>\n<p><strong>Yes.<\/strong> The lookup is keyed by the āyah (its permanent key, e.g. 36:38), so the same list can appear wherever an āyah is: the Āyah card, the Notes pane, an Approach card. And the link works both ways: from a hadith in Hadith Study, \"the āyāt this hadith quotes\". Every jump leaves a way back (the way-back law).<\/p>\n<p>One thing to settle: <strong>the Approach Map has no Approach named \"Hadith\".<\/strong> The nearest are 28–29 (the Sahaba, the Tabi'in). See question 5.<\/p>", "topic": "keys"}, {"id": "k-scholars", "title": "5. The scholars by era, and maani.tech (your point 4)", "html": "<h3>What maani.tech does<\/h3>\n<p>Maani calls itself \"an AI-powered companion\" for reflection (tadabbur). For each āyah it shows a few books through five \"lenses\" (Wording, Qur'anic Worlds, Worldly Mirror, Connections, Wisdom). The books it names are Ibn 'Āshūr, al-Jalālayn, al-Rāzī, al-Muyassar and Ibn Kathīr, and it says it is \"Powered by Quran.Foundation\" (the people behind quran.com). <strong>It does not arrange the scholars by era or by madhab, and its AI chooses the top three passages.<\/strong> It is a paid service (free tier, then $4.99 and $9.99 a month) and states no licence for the texts.<\/p>\n<h3>My view<\/h3>\n<ul>\n<li><strong>Take the idea, not the method.<\/strong> Showing the scholars' own words beside the āyah is right. Letting an AI pick or summarise them is not right for us: the Ten Steps put the reader's own reasoning first and the scholars at step 10, and a summary is someone else's reasoning in the scholars' name.<\/li>\n<li><strong>Our arrangement is better for your purpose:<\/strong> by era (your Gen1–Gen6) and by madhab, so each \"Understanding of …\" Approach gets exactly its own scholars.<\/li>\n<\/ul>\n<h3>What is openly available<\/h3>\n<p>The open tafsir set (spa5k/tafsir_api, drawn from quran.com and QUL, the Quranic Universal Library) holds <strong>123 editions<\/strong>, about 70 of them Arabic, āyah by āyah, plus Bangla (Aḥsan al-Bayān, Abū Bakr Zakariyyā, Ibn Kathīr in Bangla, the Mukhtaṣar) and English. I placed 30 of them:<\/p>\n<div class=\"scroll\"><table><thead><tr><th>Era (Approach)<\/th><th>Scholars, with death year<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Sahaba, Tabi'in<\/strong> (28, 29)<\/td><td>the <em>Mawsū'at at-Tafsīr al-Ma'thūr<\/em> (their narrations collected, with chains); al-Ṭabarī and al-Suyūṭī's <em>ad-Durr al-Manthūr<\/em> also quote them<\/td><\/tr>\n<tr><td><strong>Gen1, to 1258<\/strong> (30)<\/td><td>al-Ṭabarī 923 · al-Samarqandī 983 · al-Māwardī 1058 · al-Baghawī 1122 · al-Zamakhsharī 1144 · Ibn 'Aṭiyyah 1147 · Ibn al-Jawzī 1201 · al-Rāzī 1210<\/td><\/tr>\n<tr><td><strong>Gen2, 1258 to about 1700<\/strong> (31)<\/td><td>al-Qurṭubī 1273 · al-Bayḍāwī 1286 · al-Nasafī 1310 · Ibn Juzayy 1340 · Ibn Kathīr 1373 · al-Jalālayn 1459/1505 · al-Suyūṭī 1505 · Abū al-Su'ūd 1574<\/td><\/tr>\n<tr><td><strong>Gen3, about 1700 to 1924<\/strong><\/td><td>al-Shawkānī 1834 · al-Ālūsī 1854 · al-Qāsimī 1914<\/td><\/tr>\n<tr><td><strong>Gen4, 1924 to 1945<\/strong><\/td><td><strong>none in the open set.<\/strong> Rashīd Riḍā's <em>al-Manār<\/em> and al-Marāghī belong here: a gap to fill by hand<\/td><\/tr>\n<tr><td><strong>Gen5, 1945 to 2001<\/strong><\/td><td>al-Sa'dī 1956 · Ibn 'Āshūr 1973 · al-Shinqīṭī 1973 · <em>al-Muyassar<\/em> 1998 · Ibn 'Uthaymīn 2001<\/td><\/tr>\n<tr><td><strong>Gen6, 2001 onward<\/strong><\/td><td>Ṭanṭāwī 2010 · al-Jazā'irī 2018 · Ṣalāḥuddīn Yūsuf (Bangla <em>Aḥsan al-Bayān<\/em>) 2020 · <em>al-Mukhtaṣar<\/em> (Arabic and Bangla)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>By madhab<\/strong> (Approaches 32–35): Hanafi: al-Samarqandī, al-Nasafī, Abū al-Su'ūd, al-Ālūsī · Maliki: Ibn 'Aṭiyyah, al-Qurṭubī, Ibn Juzayy, Ibn 'Āshūr, al-Shinqīṭī · Shafi'i: al-Māwardī, al-Baghawī, al-Rāzī, al-Bayḍāwī, Ibn Kathīr, al-Jalālayn · Hanbali: Ibn al-Jawzī, al-Sa'dī, Ibn 'Uthaymīn. <strong>Groups<\/strong> (36): al-Zamakhsharī (Mu'tazili in creed), and the Sufi tafsirs (al-Tustarī, al-Qushayrī) in the set.<\/p>\n<h3>Cautions I found by looking, not guessing<\/h3>\n<ul>\n<li><strong>The open set has errors.<\/strong> Its \"Asbāb an-Nuzūl by al-Wāḥidī\" file for 2:1 actually holds al-Qushayrī's Sufi commentary, and its English text has damaged characters. Every source must be checked against the original before it goes in the app.<\/li>\n<li><strong>Some books explain two or three āyāt together,<\/strong> so the text stored under an āyah can begin with the one before it. Some explain chosen āyāt only (al-Shinqīṭī has nothing on 36:38). The panel must say so rather than show a blank.<\/li>\n<li><strong>\"Tafsīr Ibn 'Abbās\"<\/strong> (<em>Tanwīr al-Miqbās<\/em>) is in the set, but its chain to Ibn 'Abbās is weak; it should not count as the Sahaba's understanding.<\/li>\n<li><strong>Rights.<\/strong> A pre-modern book's words are free, but a digital edition, a translation or a modern author can carry rights. Same rule as Hadith Study: <strong>a source enters the app only after its rights are recorded.<\/strong><\/li>\n<li><strong>Era by death year<\/strong> is my default (it gives one clear answer per scholar). A scholar who wrote decades before dying would sit one era later. See question 3.<\/li>\n<\/ul>", "topic": "keys"}, {"id": "k-plan", "title": "6. My suggestion: how to build it", "html": "<p>In rounds, each one useful on its own. Nothing starts until you answer section 7.<\/p>\n<ol>\n<li><strong>Round 1, the āyah–hadith index (no Firebase step).<\/strong> The two tests above, run once over our 15 books and kept as a file in the repository, with standard numbers. The Āyah card and the Hadith module each get \"related hadith\", with a way back. Fetched when opened, never at startup.<\/li>\n<li><strong>Round 2, the scholars by era (no Firebase step).<\/strong> The sources you approve, checked against the originals, kept one file per Surah and loaded on first use. The Āyah card gets <em>Scholars across the eras<\/em>, and each \"Understanding of …\" Approach opens straight to its own era or madhab.<\/li>\n<li><strong>Round 3, the madrasah's keys (no Firebase step).<\/strong> Gharīb, Wujūh, Hadith, Siyāq and Asbāb, suggested by the computer (dashed) and confirmed by Owner/Prime, kept in the madrasah's own document like the dua checks.<\/li>\n<li><strong>Round 4, each reader's own keys (a Rules change you publish once).<\/strong> \"Hard for me\", and a reader's own extra keys, kept per person like progress. This is the one Firebase step, the same kind as the pictures.<\/li>\n<li><strong>Round 5, the Keys wheel.<\/strong> The four views in the demo, on the Status wheel's own screen, and \"My list\".<\/li>\n<\/ol>\n<p class=\"meta\">Rounds 1 and 2 are where the work is; rounds 3–5 are small once they exist.<\/p>", "topic": "keys"}, {"id": "k-questions", "title": "7. Questions for you", "html": "<p>My recommendation is first in each.<\/p>\n<ol>\n<li><strong>The list of keys<\/strong> in section 1: keep as it is? Add, remove or rename freely.<\/li>\n<li><strong>Who sets them:<\/strong> \"Hard for me\" by each reader; the others by Owner/Prime for the madrasah, and readers may add their own? (Recommended.)<\/li>\n<li><strong>Era by the scholar's death year<\/strong> (recommended), or by the year the book was written?<\/li>\n<li><strong>Which tafsirs first?<\/strong> Recommended to start with one per era and one per madhab: the Mawsū'ah (Sahaba, Tabi'in), al-Ṭabarī, Ibn Kathīr, al-Qurṭubī, al-Nasafī, Ibn al-Jawzī, al-Shawkānī, al-Sa'dī, Ibn 'Āshūr, al-Muyassar, and Aḥsan al-Bayān in Bangla.<\/li>\n<li><strong>\"The Hadith approach\":<\/strong> do you mean (a) a new Approach, e.g. \"Understanding through Hadith (bis-Sunnah)\", placed before 28 in the Understanding of the Scholars section (recommended), or (b) the Hadith Study module?<\/li>\n<li><strong>Each reader's own marks<\/strong> need one Firebase Rules step that you publish. Yes, when we reach Round 4? (Recommended.)<\/li>\n<\/ol>", "topic": "keys"}, {"id": "issues-asma", "title": "📋 Issues: decided, pending, for later", "html": "<p>Every issue of this feature in one table: when it was raised, the decision taken and its date, and what is pending or kept for later. Press <strong>✓<\/strong> on a row, or <strong>✓ Served<\/strong> on any heading, when it has served its purpose; the <strong>Served<\/strong> switch at the top fades it, hides it, or shows everything. Press <strong>✎ Edit<\/strong> to change a cell, add a row, or change a status, then <strong>Save<\/strong>.<\/p>", "kind": "issues", "topic": "asma"}, {"id": "a-talk", "title": "★ Our conversation (Asma screensaver)", "html": "<p>This tab keeps our conversation about the Asma ul Husna screensaver. Press <strong>✎ Edit<\/strong>, then <strong>+ Add your note here<\/strong>, then <strong>Save<\/strong>.<\/p>\n<div class=\"owner\">\n<p class=\"label\">You (10 Oct 2026)<\/p>\n<p>ASMA. Enable the Asma poster as a screensaver to appear, with options for timing (how long each will display), poster choices, etc., anything your suggestions as well, on all platforms, of course. Place it in the Master Feature Plan as well, third tab.<\/p>\n<\/div>\n<div class=\"answer\">\n<p><strong>The Architect (10 Oct), version v08:<\/strong><\/p>\n<p>• <strong>This tab<\/strong> is the third one, as you asked. It holds what exists today, my suggestions, a working demo with your real template posters, and four questions.<\/p>\n<p>• <strong>The demo<\/strong> (section 3) is the screensaver as I propose it: it starts by itself when the device is left alone, with every setting you asked for and the ones I suggest.<\/p>\n<p>• <strong>I am building it now with my recommended answers<\/strong> (decision 91: I don't wait unless something needs your choice). Each question in section 5 has a default you can change later in one line.<\/p>\n<\/div>\n<div class=\"answer\">\n<p><strong>The Architect (10 Oct), version v09: built, in the app as v10.08.<\/strong> Leave any MMSA page alone for 3 minutes and your posters appear. Tap the screen for the controls; ✕ takes you back where you were. Change everything in <strong>Home ▸ 🌙 Screensaver<\/strong>. One correction to my questions: you had already chosen <em>\"Both\"<\/em> for the Asma page's screensaver, so both kinds of poster take turns by default.<\/p>\n<\/div>", "topic": "asma"}, {"id": "a-today", "title": "1. What the app has today", "html": "<ul>\n<li>The Asma page has a <strong>Screensaver<\/strong> button. Nothing starts it by itself, and it exists on that page only.<\/li>\n<li>It shows the <strong>93 photo posters<\/strong> (archive.org, from Learn Deen On-the-Go's set) and then <strong>your template posters<\/strong> for every Name (the true copy, decision 85), <strong>6 seconds each<\/strong>, with no settings.<\/li>\n<li>It does not keep the screen awake, has no clock, and does not remember where it stopped.<\/li>\n<\/ul>", "topic": "asma"}, {"id": "a-suggest", "title": "2. What it will do: your asks and my suggestions", "html": "<h3>What you asked for<\/h3>\n<ol>\n<li><strong>It starts by itself<\/strong> when the device is left alone: <em>Start after<\/em> 1, 3, 5, 10 or 30 minutes, or off.<\/li>\n<li><strong>How long each poster shows:<\/strong> 5 s, 10 s, 15 s, 30 s, 1 min or 5 min.<\/li>\n<li><strong>Which posters:<\/strong> your template posters, the photo posters, or both, taking turns.<\/li>\n<li><strong>On every device:<\/strong> computer, tablet and phone, on every MMSA page.<\/li>\n<\/ol>\n<h3>My suggestions on top<\/h3>\n<ol>\n<li><strong>Which Names:<\/strong> all 99; the ones I am studying (from my progress); Names I choose (tick them); or one of your groups (By Act, By Essence, Dual Names, your own groups).<\/li>\n<li><strong>Order:<\/strong> 1 to 99, random, or <em>carry on<\/em> from the Name after the last one shown, so a family sees all 99 over the days, not Ar-Rahman every time.<\/li>\n<li><strong>Moving:<\/strong> a gentle fade, or a fade with a very slow zoom.<\/li>\n<li><strong>A clock in the corner<\/strong>, so a tablet on a shelf is useful as well as beautiful.<\/li>\n<li><strong>Dim at night<\/strong> (10 pm to 6 am).<\/li>\n<li><strong>Keep the screen on<\/strong> while it runs (the browser's \"wake lock\"; computers, Android, and iPhone/iPad from iOS 16.4). Full screen on computers and Android; on an iPhone the browser does not allow a page to go full screen, so it fills the page.<\/li>\n<li><strong>It never interrupts study:<\/strong> not while a recitation plays, while you write on the Writing sheet, while you type a Note, or on the sign-in pages.<\/li>\n<li><strong>Touch shows the controls<\/strong> (‹ ❚❚ › ✕) for a few seconds; any key also works (Esc closes, ← → move, space pauses). <strong>✕ Close returns you exactly where you were<\/strong> (the way-back law).<\/li>\n<li><strong>\"Open this Name\"<\/strong> takes you from the poster to that Name's card, with ← Back.<\/li>\n<li><strong>With no internet<\/strong> it shows your template posters only (they are inside the app); the photo posters need the internet.<\/li>\n<li><strong>Each device keeps its own settings<\/strong>, so the family tablet can run it every 3 minutes all day while your phone has it off.<\/li>\n<\/ol>\n<p class=\"meta\">Load speed: a few lines join every page to notice when the device is left alone; nothing is fetched until the screensaver actually starts (Architecture Part 8: \"Screensaver: on first use\"). This is the one thing I flag: it is code on every page's startup, but no network and no reading of data.<\/p>", "topic": "asma"}, {"id": "a-demo", "title": "3. Demo: the screensaver with its settings", "html": "<p>Change the settings, press <strong>▶ Preview now<\/strong>, or leave the demo alone for the time you set and it starts by itself. Tap the poster to see the controls. The posters are your real template posters for all 99 Names, made by the app's own poster code. \"Ones I'm studying\" and the groups use example lists here; in the app they come from your data.<\/p>", "kind": "demo", "demo": "asma-screensaver", "topic": "asma"}, {"id": "a-plan", "title": "4. The build", "html": "<ol>\n<li><strong>Round 1: built, v10.08 (10 Oct 2026).<\/strong> the screensaver module shared by every page; its settings in a <em>Screensaver<\/em> panel (in the Home menu ▸ Screensaver, and from the Asma page's button); starting by itself; your template posters and the photo posters; timing, order, clock, dimming, wake lock; never during recitation, writing or typing; ✕ back to where you were.<\/li>\n<li><strong>Round 2:<\/strong> \"Ones I'm studying\" and your groups (they read your progress and the madrasah's groups when the screensaver starts, never at startup); \"Open this Name\" with ← Back.<\/li>\n<\/ol>", "topic": "asma"}, {"id": "a-questions", "title": "5. Questions for you", "html": "<p>My recommendation is first in each, and it is what is built. Change any of them in one line.<\/p>\n<ol>\n<li><strong>Settings per device<\/strong> (recommended: a wall tablet and a phone want different things), or the same on every device you sign in on?<\/li>\n<li><strong>Where it may start:<\/strong> on any MMSA page (recommended), or only on the Home page?<\/li>\n<li><strong>Default posters: both kinds, taking turns.<\/strong> Corrected while building: you already answered <em>\"Both\"<\/em> for the Asma page's screensaver in an earlier round, so that answer stands and is the default. Without the internet, your template posters show alone.<\/li>\n<li><strong>Default timing:<\/strong> start after 3 minutes, 15 seconds per poster (recommended)?<\/li>\n<\/ol>", "topic": "asma"}], "approaches": [{"no": "1", "name": "Reading (with Tajweed)", "section": "Building Foundation / Learning Tools", "status": "Mastered", "validity": "73:4 “recite the Qur'an with measured recitation (tartīl)”; 25:32", "worth": "Recited as it was revealed; accurate sound protects the meaning.", "practice": "Read a set portion aloud daily with a reciter; take one tajweed rule at a time; ask someone to listen.", "steps": "Before the steps: the text must be read correctly.", "note": "We will add a few links where they can self-learn as well, while sitting directly with a teacher has no alternative. Listening to Abdullah Basfar (tartil recitation only which QR has, he has two) would help a self learner in continuous improvement."}, {"no": "2", "name": "Reading (with Meaning)", "section": "Building Foundation / Learning Tools", "status": "Practising", "validity": "38:29 “a blessed Book … that they may ponder its āyāt”", "worth": "Meaning is the door to every later step.", "practice": "Read a passage, then its meaning; retell it in your own words.", "steps": "Needed for steps 1–4.", "note": ""}, {"no": "3", "name": "Reading — Word-by-Word Meaning", "section": "Building Foundation / Learning Tools", "status": "Mastered", "validity": "12:2 “an Arabic Qur'an so that you may understand”; 54:17", "worth": "Understanding without a translator's choices: the first guard against another's bias.", "practice": "Learn each word of the āyah with the Word card; count the words you know.", "steps": "Foundation of step 6 (rhetoric).", "note": ""}, {"no": "4", "name": "Hifz / Memorising", "section": "Building Foundation / Learning Tools", "status": "Mastered", "validity": "29:49 “clear āyāt in the breasts of those given knowledge”; 54:17", "worth": "What is carried in the chest can be pondered anywhere, any time.", "practice": "A short portion on a loop; recite it in ṣalāh; revise weekly.", "steps": "Makes step 7 (patterns) possible from memory.", "note": ""}, {"no": "5", "name": "Language Learning - The Basic", "section": "Building Foundation / Learning Tools", "status": "Achieved", "validity": "43:3 “an Arabic Qur'an that you may understand”", "worth": "Grammar opens the rhetoric and the inner meaning.", "practice": "One grammar point at a time; find it in the āyāt being studied.", "steps": "Foundation of steps 5–6.", "note": ""}, {"no": "6", "name": "Arabic Writing", "section": "Building Foundation / Learning Tools", "status": "Practising", "validity": "96:4 “Who taught by the pen”; 68:1", "worth": "Writing fixes the words in memory and eye.", "practice": "Copy the āyah by hand, letter by letter; check it against the text.", "steps": "", "note": ""}, {"no": "7", "name": "Listening Attentively (Arabic only)", "section": "Engagement / Attachment", "status": "Not started", "validity": "7:204 “when the Qur'an is recited, listen to it and be silent”", "worth": "The Qur'an was first heard; attention trains the heart.", "practice": "Listen without reading; follow where you are; loop a short passage.", "steps": "", "note": ""}, {"no": "8", "name": "Listening Attentively (Arabic with meaning)", "section": "Engagement / Attachment", "status": "Mastered", "validity": "7:204; 5:83 “their eyes overflow with tears for what they recognised of the truth”", "worth": "Hearing with understanding moves the heart.", "practice": "Listen with the meaning open; note one line that moved you.", "steps": "", "note": ""}, {"no": "9", "name": "Ruqyah Listening", "section": "Engagement / Attachment", "status": "Not started", "validity": "17:82 “We send down of the Qur'an what is healing and mercy”; 10:57", "worth": "Healing and comfort through the Qur'an itself.", "practice": "Listen to the ruqyah āyāt in a calm place, with attention.", "steps": "", "note": ""}, {"no": "10", "name": "Dua Memorising", "section": "Engagement / Attachment", "status": "Not started", "validity": "40:60 “Call upon Me; I will respond”; 2:186", "worth": "A dua ready on the tongue for its moment.", "practice": "One dua at a time, with its meaning; say it at its time.", "steps": "", "note": ""}, {"no": "11", "name": "Story Learning", "section": "Engagement / Attachment", "status": "Achieved", "validity": "12:111 “in their stories is a lesson”; 7:176 “relate the stories that they may reflect”", "worth": "Lessons carried by people and events, easy to remember and teach.", "practice": "Read or hear the story; retell it in order; list its lessons.", "steps": "Step 3 (qualities of the people of Jannah / Jahannam).", "note": ""}, {"no": "12", "name": "Calligraphy", "section": "Engagement / Attachment", "status": "Not started", "validity": "68:1 “by the pen and what they write”; 96:4", "worth": "Love and beauty of the words.", "practice": "Copy a short phrase from a model; finish one piece.", "steps": "", "note": ""}, {"no": "13", "name": "Numbers in the Quran", "section": "Engagement / Attachment", "status": "Not started", "validity": "72:28 “He has counted all things in number”; 74:30–31 (nineteen, as a trial)", "worth": "Precision in Allah's word; a guard against careless claims.", "practice": "Count with the app's data and check before believing a claim; mark what is proven and what is coincidence.", "steps": "Step 8 (symmetry). Caution: number claims are often over-read.", "note": ""}, {"no": "14", "name": "Journaling / Noting", "section": "Critical Reasoning: Nazar / 'Aql", "status": "Not started", "validity": "68:1 “by the pen and what they write”; 2:282 (writing down)", "worth": "Answers written down become one's own understanding, and can be checked later.", "practice": "After each study, write the answers to the steps in a Note.", "steps": "Where the answers to all ten steps are written.", "note": "In your data this sits in section 3."}, {"no": "15", "name": "Beginner's Level — Observation (Nazar)", "section": "Critical Reasoning: Nazar / 'Aql", "status": "Mastered", "validity": "88:17–20 “do they not look at the camels…”; 50:6", "worth": "See the text as it is, before interpreting it.", "practice": "Steps 1–2: what type of āyah; about what (subject); to whom, about whom?", "steps": "Steps 1–2.", "note": "QCR 14 · Naẓar (Y3)."}, {"no": "16", "name": "Primary Level — Common Sense ('Aql / Ta'aqqul)", "section": "Critical Reasoning: Nazar / 'Aql", "status": "Not started", "validity": "2:164 “signs for a people who reason”; 2:44 “do you not reason?”", "worth": "Ordinary reasoning applied to what is observed.", "practice": "Steps 3–4: what is in it for me; what certain knowledge it gives.", "steps": "Steps 3–4.", "note": "QCR 15 · Ta'aqqul (Y4)."}, {"no": "17", "name": "Deriving Dua", "section": "Critical Reasoning: Applied Threads", "status": "Not started", "validity": "2:186; 40:60", "worth": "Turn the āyah into one's own prayer.", "practice": "Find the request or the praise in the āyah; say it as a dua.", "steps": "Step 1 (what type of dua).", "note": ""}, {"no": "18", "name": "Deriving Names & Attributes of Allah", "section": "Critical Reasoning: Applied Threads", "status": "Not started", "validity": "7:180 “to Allah belong the best names, so call on Him by them”", "worth": "Know Him through His word.", "practice": "Find the Name or Attribute; ask what it means here.", "steps": "Step 2 (subject: Allah).",
