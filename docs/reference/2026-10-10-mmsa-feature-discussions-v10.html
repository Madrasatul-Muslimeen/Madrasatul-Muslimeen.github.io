, {\"n\": 67, \"t\": \"Al-Ahad\", \"ar\": \"الْأَحَد\", \"m\": {\"en\": \"The One, The Indivisible\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"67\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Ahad<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Unique<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الأَحَدُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who is Unique in His Attributes. His Uniqueness is an attribute of which no other may have any share and the quality of His attributes is incomparable and unequaled. He is Unique in every single aspect while His creation may seem unique in one aspect and common in others. The Singular.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 68, \"t\": \"As-Samad\", \"ar\": \"الصَّمَد\", \"m\": {\"en\": \"The Eternal, The Self-Sufficient\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"68\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>As-Samad<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Eternal, The Self-Sufficient<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الصَّمَد<\\/span><\\/div>\\n    <div class=\\\"ahp-desc ahp-none\\\" data-poster-desc lang=\\\"en\\\">Description to come.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 69, \"t\": \"Al-Qadir\", \"ar\": \"الْقَادِر\", \"m\": {\"en\": \"The All-Powerful, The Able\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"69\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Qadir<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Fully Able One<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>القَادِرُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who is capable of doing anything He wills. The One Who possesses complete power and ability and perfectly does what He wills according to what His perfect wisdom requires. He is able to do all things and neither weakness, nor impotence or languor overtakes Him. The Able.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 70, \"t\": \"Al-Muqtadir\", \"ar\": \"الْمُقْتَدِر\", \"m\": {\"en\": \"The Powerful, The Dominant\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"70\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Muqtadir<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Omnipotent<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>المُقْتَدِرُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The Master Who is capable of anything He wishes, without weakness, without fatigue. He is All-Capable and All-Powerful. The One Who created everything, and controls the destinies of everyone. He can grant the supplications of His servants and nothing stands to oppose or resist Him. The Perfect in Ability. The One with perfect power from Whom nothing is withheld.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 71, \"t\": \"Al-Muqaddim\", \"ar\": \"الْمُقَدِّم\", \"m\": {\"en\": \"The Expediter\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"71\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Muqaddim<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The One Who Gives Precedence<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>المُقَدِّمُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who gives precedence, He brings forward and favors whomsoever He wills, giving some a higher status than others in accordance with His wisdom. The One Who hastens or speeds, sending down events and expediting them as He wills. The Expediter. The One Who Brings Forward.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 72, \"t\": \"Al-Mu'akhkhir\", \"ar\": \"الْمُؤَخِّر\", \"m\": {\"en\": \"The Delayer\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"72\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Mu'akhkhir<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The One Who Puts Back<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>المُؤَخِّرُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who defers and holds back whomsoever He wills, and there is wisdom and goodness in whatever He does, even though the purpose of that wisdom and goodness may be hidden from us. The One who delays or slows whatever He wills. He postpones things from their expected times because in His wisdom He knows the consequences of the delay. The Deferrer. The One Who Delays.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 73, \"t\": \"Al-Awwal\", \"ar\": \"الْأَوَّل\", \"m\": {\"en\": \"The First\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"73\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Awwal<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The First<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الأَوَّلُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Whose existence is without a beginning. The First, there is nothing that came before Him. He has always existed and nothing preceded Him in existence. Everything else has been created and gone from a state of non-existence to existence, except Allah.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 74, \"t\": \"Al-Akhir\", \"ar\": \"الْآخِر\", \"m\": {\"en\": \"The Last\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"74\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Akhir<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Last<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الآخِرُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Whose existence is without end. The Last, there is nothing that will come after Him or exist after Him, for He will exist always and for eternity, while everything else will eventually perish.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 75, \"t\": \"Az-Zahir\", \"ar\": \"الظَّاهِر\", \"m\": {\"en\": \"The Manifest, The Evident\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"75\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Az-Zahir<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Uppermost One<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الظَّاهِرُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who is above everything else, He is the Most High, above all things, and there is nothing higher than Him. The One Who is the Uppermost by virtue of His Wisdom, power of creation, actions and all the blessings which He bestows. His existence is obvious by proofs. The Manifest. The Outward. The Triumphant.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 76, \"t\": \"Al-Batin\", \"ar\": \"الْبَاطِن\", \"m\": {\"en\": \"The Hidden\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"76\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Batin<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Innermost One<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>البَاطِنُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who is nearer than anything in existence, nothing can be closer to anything than Him. He is near us through His knowledge, hearing, and sight and He is knowing of all things. The Inward, Who knows the innermost matters, all that is secret and hidden, down to the smallest matters. The One Who us keenly discerning.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 77, \"t\": \"Al-Wali\", \"ar\": \"الْوَالِي\", \"m\": {\"en\": \"The Governor, The Patron\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"77\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Wali<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Governor, The Patron<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْوَالِي<\\/span><\\/div>\\n    <div class=\\\"ahp-desc ahp-none\\\" data-poster-desc lang=\\\"en\\\">Description to come.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 78, \"t\": \"Al-Muta'ali\", \"ar\": \"الْمُتَعَالِي\", \"m\": {\"en\": \"The Most Exalted\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"78\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Muta'ali<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Supreme &amp; Exalted One<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>المُتَعَالِي<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who is above His creation in irresistible Power and Might. The One Who is Most High; an absolute Highness in every sense. He is free from all partners and defects in His sublimity, there is nothing similar unto Him, the attributes of creation cannot compare to Him, and He holds dominance and power over all. He is the One, the Irresistible, who compels all of the creation with His Might and Exaltedness. Whatever He wills will be and none can resist Him in that. The Most High, The Sublime.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 79, \"t\": \"Al-Barr\", \"ar\": \"الْبَرّ\", \"m\": {\"en\": \"The Source of Goodness\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"79\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Barr<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Generous &amp; Most Courteous<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْبَرُّ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who is Most Kind, Courteous &amp; Generous. Whose generosity is expansive. He is gentle with His servants and does not want hardship for them. He pardons our many sins &amp; wrongdoings and does not take us to account for all of our crimes. He rewards our good deeds with ten more like it, while He does not recompense a sin with more, and He does not hold our desire to sin against us.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 80, \"t\": \"At-Tawwab\", \"ar\": \"التَّوَّاب\", \"m\": {\"en\": \"The Ever-Relenting, Acceptor of Repentance\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"80\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>At-Tawwab<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Accepting of Repentance<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>التَّوَّابُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who is continuously turning [in forgiveness] to those who turn to Him [in repentance] and the One who forgives the sins of the penitent. The One who grants us the ability to repent, directs our hearts towards Him, then accepts our [sincere] repentance and forgives our errors. The     w.querySelectorAll("[data-serve-head]").forEach((b) => b.onclick = () => servedToggle(S.servedHeads, b.dataset.serveHead));
    w.querySelectorAll("[data-serve-row]").forEach((b) => b.onclick = () => { const t = b.closest("[data-topic]").dataset.topic; const r = S.issues[t][+b.dataset.serveRow]; if (r.served) r.served = ""; else r.served = todayISO(); keepDraft(); redrawKeep(); });
    w.querySelectorAll("[data-ifilter]").forEach((b) => b.onclick = () => { issFilter = b.dataset.ifilter; redrawKeep(); });
    w.querySelectorAll("[data-irow]").forEach((el) => el.oninput = () => { const t = el.closest("[data-topic]").dataset.topic; S.issues[t][+el.dataset.irow][el.dataset.icol] = el.innerText.trim(); keepDraft(); });
    w.querySelectorAll("[data-istatus]").forEach((el) => el.onchange = () => { const t = el.closest("[data-topic]").dataset.topic; S.issues[t][+el.dataset.istatus].status = el.value; keepDraft(); });
    w.querySelectorAll("[data-iadd]").forEach((b) => b.onclick = () => { const t = b.dataset.iadd, rows = (S.issues[t] ||= []); const pre = (rows[0]?.id || "X").replace(/\d+$/, ""); rows.push({ id: pre + (rows.length + 1), issue: "New issue", raised: todayISO(), decision: "", decidedOn: "", pending: "", status: "pending", served: "" }); keepDraft(); redrawKeep(); });
    w.querySelectorAll("[data-idel]").forEach((b) => b.onclick = () => { if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Sure?"; return; } const t = b.closest("[data-topic]").dataset.topic; S.issues[t].splice(+b.dataset.idel, 1); keepDraft(); redrawKeep(); });
    const f = $("#mapFilter"); if (f) f.oninput = () => { filter = f.value.trim().toLowerCase(); w.querySelectorAll("[data-ri]").forEach((el) => el.classList.toggle("hidden-row", !rowMatches(S.approaches[el.dataset.ri]))); };
    if (!editing) return;
    const tpE = topicNow(), firstE = tpE.id === S.topics[0].id;
    $("#docTitle").oninput = (e) => { if (firstE) S.title = e.target.textContent.trim(); else tpE.title = e.target.textContent.trim(); keepDraft(); };
    $("#docIntro").oninput = (e) => { if (firstE) S.intro = e.target.innerHTML; else tpE.intro = e.target.innerHTML; keepDraft(); };
    w.querySelectorAll("[data-title]").forEach((el) => el.oninput = () => { S.sections[el.dataset.title].title = el.textContent.trim(); keepDraft(); renderToc(); });
    w.querySelectorAll("[data-html]").forEach((el) => el.oninput = () => { S.sections[el.dataset.html].html = el.innerHTML; keepDraft(); });
    w.querySelectorAll("[data-col]").forEach((el) => el.oninput = () => { S.approaches[el.dataset.row][el.dataset.col] = el.innerText.trim(); keepDraft(); });
    const redraw = () => { keepDraft(); renderDoc(); wireDoc(); };
    w.querySelectorAll("[data-addnote]").forEach((b) => b.onclick = () => { const i = +b.dataset.addnote; S.sections[i].html += `\n<div class="owner"><p class="label">Your note (${today()})</p><p>Write here…</p></div>`; redraw(); renderToc(); const boxes = w.querySelectorAll(`[data-html="${i}"] .owner`); const last = boxes[boxes.length - 1]?.querySelector("p:last-child"); if (last) { last.scrollIntoView({ block: "center" }); last.focus?.(); const r = document.createRange(); r.selectNodeContents(last); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } });
    w.querySelectorAll("[data-up]").forEach((b) => b.onclick = () => { const i = +b.dataset.up; if (i > 0) { const a = S.approaches; [a[i - 1], a[i]] = [a[i], a[i - 1]]; redraw(); } });
    w.querySelectorAll("[data-down]").forEach((b) => b.onclick = () => { const i = +b.dataset.down, a = S.approaches; if (i < a.length - 1) { [a[i + 1], a[i]] = [a[i], a[i + 1]]; redraw(); } });
    w.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => { const i = +b.dataset.del; const r = S.approaches[i]; if (b.dataset.sure) { S.approaches.splice(i, 1); redraw(); say(`Row “${r.name}” removed. Not saved yet.`); } else { b.dataset.sure = "1"; b.textContent = "Sure?"; } });
    const add = $("#addRow"); if (add) add.onclick = () => { S.approaches.push({ no: "", name: "New Approach", section: "", status: "Not started", validity: "", worth: "", practice: "", steps: "", note: "" }); redraw(); };
  }
  function buildDoc() {
    const st = { ...S, version: nextVersion(), savedAt: new Date().toISOString() };
    const json = JSON.stringify(st).replace(/</g, "\\u003c");
    const head = document.head.innerHTML.match(/<style>[\s\S]*?<\/style>/)?.[0] ?? "<style></style>";
    const fonts = [...document.querySelectorAll("link[rel=preconnect],link[rel=stylesheet]")].map((l) => l.outerHTML).join("\n");
    return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">${head}</head><body><title>${esc(st.master || st.title)}</title>\n${fonts}\n<style id="pageStyle">${document.getElementById("pageStyle").textContent}</style>\n<div id="root"></div>\n<script type="application/json" id="state">${json}<\/script>\n<script id="app">${document.getElementById("app").textContent}<\/script></body></html>`;
  }
  async function save() {
    if (!artifactNs) { say("Saving here needs the claude.ai page. Use Export .html and send me the file.", true); return; }
    const b = $("#saveBtn"); b.disabled = true; b.textContent = "Saving…";
    try { const v = nextVersion(); await artifactNs.publish(buildDoc()); try { localStorage.removeItem(DRAFT_KEY); } catch {} BASE.version = v; dirty = false; say(`Saved as v${verText(v)}. Claude can read this version.`); render(); }
    catch (err) {
      const code = err?.code;
      if (code === "conflict") say("A newer version was saved elsewhere; the page is reloading to it. Your unsaved edits stay in this browser.", true);
      else if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared") { readOnly = true; say("This copy is read-only for you. Use Export .html to keep your edits.", true); }
      else if (code === "rate_limited") say("Saving too often. Wait a minute, then Save again.", true);
      else say("Not saved: " + (err?.message || code || "unknown error") + ". Your edits are still here.", true);
    }
    paintSave();
  }
  async function exportFile(filename, data) {
    if (downloadsNs) { try { await downloadsNs.save({ filename, data }); say("Exported " + filename + "."); } catch (err) { say("Export not finished: " + (err?.message || err?.code || "declined"), !!err && err.code !== "declined"); } return; }
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: filename.endsWith(".json") ? "application/json" : "text/html" })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); say("Exported " + filename + "."); }
    catch { say("This view cannot save files. Use Save instead.", true); }
  }
  let wasNarrow = narrow();
  window.addEventListener("resize", () => { barH(); if (narrow() !== wasNarrow) { wasNarrow = narrow(); render(); } });
  render();
  if (window.claude?.use) {
    window.claude.use("artifact").then((ns) => { artifactNs = ns; }).catch(() => {});
    window.claude.use("downloads").then((ns) => { downloadsNs = ns; }).catch(() => {});
  }
})();
</script>
