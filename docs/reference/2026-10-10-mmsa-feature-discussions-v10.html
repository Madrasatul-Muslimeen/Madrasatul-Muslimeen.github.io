t-size:3cqw;line-height:1.1;color:#1a1a1a}\n.ahp-ref>*{display:inline-block;transform-origin:center}\n.ahp-ref-q{left:11.2%;width:35.2%}\n.ahp-ref-h{left:53.5%;width:35.4%}\n.ahp-ref button,.ahp-ref a{font:inherit;color:inherit;background:none;border:0;padding:.3cqw .2cqw;margin:0;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(242,84,26,.55);text-underline-offset:.35cqw;white-space:nowrap}\n.ahp-ref button:focus-visible,.ahp-ref a:focus-visible{outline:2px solid #f4501a;outline-offset:1px;border-radius:3px}\n.ahp-ref .ahp-unlinked{white-space:nowrap}\n.ahp-ref .ahp-none{color:#8a8473;font-style:italic}\n.ahp-ar.ahp-ar-none{font-family:'Tinos','Times New Roman',serif;font-weight:400;font-size:3.4cqw;font-style:italic;color:#8a8473;-webkit-text-stroke:0;direction:ltr}\n\n<\/style><\/head><body>\n<div class=\"wrap\">\n  <h1>🌙 Asma ul Husna screensaver: demo<\/h1>\n  <p class=\"sub\">The posters are the real ones: your template (the true copy, Owner decision 85), all 99 Names, made by the app's own poster code. Change the settings, then press <b>▶ Preview now<\/b>, or leave this page alone for the time you set and it starts by itself. Tap or press any key to show the controls; <b>✕ Close<\/b> brings you back exactly where you were.<\/p>\n  <div class=\"grid\">\n    <div class=\"card\" id=\"settings\">\n      <h2>Settings (on this device)<\/h2>\n      <div class=\"row\"><label class=\"lab\">Turn on<\/label><label class=\"switch\"><input type=\"checkbox\" id=\"on\" checked> Start by itself when this device is left alone<\/label><\/div>\n      <div class=\"row\"><label class=\"lab\">Start after<\/label><div class=\"seg\" data-k=\"idle\"><\/div><div class=\"help\">How long nothing is touched before it starts. “10 s” is for trying it here.<\/div><\/div>\n      <div class=\"row\"><label class=\"lab\">Each poster shows for<\/label><div class=\"seg\" data-k=\"each\"><\/div><\/div>\n      <div class=\"row\"><label class=\"lab\">Which posters<\/label><div class=\"seg\" data-k=\"kind\"><\/div><div class=\"help\">The photo posters come from archive.org and need the internet; with no internet the screensaver shows your template posters only.<\/div><\/div>\n      <div class=\"row\"><label class=\"lab\">Which Names<\/label><div class=\"seg\" data-k=\"which\"><\/div><div class=\"help\">“Ones I'm studying” and the groups (By Act, By Essence, Dual Names, your own) come from the app; here they are examples.<\/div><\/div>\n      <div class=\"row\" id=\"pickRow\" hidden><label class=\"lab\">Choose Names<\/label><div><div class=\"seg\" style=\"margin-bottom:6px\"><button type=\"button\" id=\"pickAll\">All<\/button><button type=\"button\" id=\"pickNone\">None<\/button><\/div><div class=\"names\" id=\"names\"><\/div><\/div><\/div>\n      <div class=\"row\"><label class=\"lab\">Order<\/label><div class=\"seg\" data-k=\"order\"><\/div><div class=\"help\">“Carry on” starts from the Name after the last one shown.<\/div><\/div>\n      <div class=\"row\"><label class=\"lab\">Moving<\/label><div class=\"seg\" data-k=\"move\"><\/div><\/div>\n      <div class=\"row\"><label class=\"lab\">Show the time<\/label><label class=\"switch\"><input type=\"checkbox\" id=\"clock\" checked> A clock in the corner<\/label><\/div>\n      <div class=\"row\"><label class=\"lab\">At night<\/label><div class=\"seg\" data-k=\"night\"><\/div><div class=\"help\">Dims the screen after 10 pm until 6 am.<\/div><\/div>\n      <div class=\"row\"><label class=\"lab\">Keep the screen on<\/label><label class=\"switch\"><input type=\"checkbox\" id=\"wake\" checked> While it runs<\/label><div class=\"help\">Where the browser allows it (computers, Android, iPhone/iPad from iOS 16.4).<\/div><\/div>\n      <div class=\"row\"><label class=\"lab\">Where it may start<\/label><div class=\"seg\" data-k=\"where\"><\/div><div class=\"help\">Never while a recitation is playing, while you write on the Writing sheet, or while you type.<\/div><\/div>\n      <p><button class=\"btn primary\" id=\"go\">▶ Preview now<\/button> <span class=\"idle\" id=\"idleNote\"><\/span><\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2>What it will show<\/h2>\n      <div class=\"thumb\" id=\"thumb\"><\/div>\n      <p class=\"idle\" id=\"count\"><\/p>\n      <p class=\"note\">In the app this is in <b>Settings ▸ Screensaver<\/b> and on the Asma page's <b>Screensaver<\/b> button, on every page and every device. Each device keeps its own settings, so a wall tablet and a phone can differ.<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n<div id=\"ss\" hidden aria-label=\"Asma ul Husna screensaver\" role=\"dialog\">\n  <div id=\"ssBack\"><button type=\"button\" id=\"ssOpen\">Open this Name<\/button><\/div>\n  <div id=\"ssClock\"><\/div>\n  <div id=\"ssStage\"><\/div>\n  <div id=\"ssBar\"><\/div>\n  <div id=\"ssCtl\"><button type=\"button\" id=\"ssPrev\" aria-label=\"Previous\">‹<\/button><button type=\"button\" id=\"ssPause\" aria-label=\"Pause\">❚❚<\/button><button type=\"button\" id=\"ssNext\" aria-label=\"Next\">›<\/button><button type=\"button\" id=\"ssClose\">✕ Close<\/button><\/div>\n<\/div>\n<script type=\"application/json\" id=\"D\">{\"posters\": [{\"n\": 1, \"t\": \"Ar-Rahman\", \"ar\": \"الرَّحْمَٰن\", \"m\": {\"en\": \"The Most Merciful\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"1\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Ar-Rahman<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Entirely Merciful<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الرَّحْمٰنُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who has plenty of mercy for the believers and the disbelievers in this life. The All Compassionate, meaning His mercy and compassion, in this respect, applies to all of His creation.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 2, \"t\": \"Ar-Rahim\", \"ar\": \"الرَّحِيم\", \"m\": {\"en\": \"The Most Compassionate\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"2\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Ar-Rahim<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Especially Merciful<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الرَّحِيمُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who has plenty of mercy especially for the believers. The Most Compassionate, meaning His mercy and compassion, in this respect, applies specifically to the believers particularly in the next life. A mercy not afforded to the disbelievers.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 3, \"t\": \"Al-Malik\", \"ar\": \"الْمَلِك\", \"m\": {\"en\": \"The King, The Sovereign\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"3\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Malik<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The King &amp; Owner of Dominion<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْمَلِكُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The Owner, Who possesses, and the King, Who has complete authority and commands what He possesses. The One to Whom the commanding and forbidding belong. The King, The Sovereign RABB, The One with the Complete Dominion.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 4, \"t\": \"Al-Quddus\", \"ar\": \"الْقُدُّوس\", \"m\": {\"en\": \"The Holy, The Pure\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"4\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Quddus<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Absolutely Pure<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْقُدُّوسُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who is Very Pure, Absolutely Pure, He is far above anything that does not befit Him (i.e. imperfection, error, fault shortcoming and everything that is derogatory.) The Holy, the Most Sacred.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 5, \"t\": \"As-Salam\", \"ar\": \"السَّلَام\", \"m\": {\"en\": \"The Source of Peace\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"5\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>As-Salam<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Perfection &amp; Giver of Peace<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>السَّلَامُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who is Free from all imperfections and deficiencies. He keeps His creation free from injustice from Him. He provides safety, security, and a sense of peace and tranquility to those who purify themselves and submit.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 6, \"t\": \"Al-Mu'min\", \"ar\": \"الْمُؤْمِن\", \"m\": {\"en\": \"The Granter of Security\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"6\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Mu'min<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The One Who Gives Emaan &amp; Security<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْمُؤْمِنُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who has and gives Emaan (affirmation of faith) and the One who gives peace and security from fear. He provides serenity to the hearts of the Believers. He affirms the truthfulness of His Messengers &amp; Prophets and always fulfills His promises. The Guardian of Faith.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 7, \"t\": \"Al-Muhaymin\", \"ar\": \"الْمُهَيْمِن\", \"m\": {\"en\": \"The Controller, The Guardian\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"7\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Muhaymin<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Protector &amp; Overseer<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْمُهَيْمِنُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who is aware of everything that is hidden and concealed, and Whose knowledge encompasses all things. He witnesses the sayings and deeds of His creation, knows what is harmful and beneficial, and protects and watches over us.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 8, \"t\": \"Al-Aziz\", \"ar\": \"الْعَزِيز\", \"m\": {\"en\": \"The Almighty, The Exalted in Might\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"8\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Aziz<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Mighty<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْعَزِيزُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who is distinguished, respected, and there is none like Him. He is invincible, unbeatable and cannot be overwhelmed. He is Mighty and is severe in His vengeance upon those from whom He seeks revenge. None can prevent Him from fulfilling what He wills.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 9, \"t\": \"Al-Jabbar\", \"ar\": \"الْجَبَّار\", \"m\": {\"en\": \"The Compeller, The Omnipotent\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"9\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Jabbar<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Compellor &amp; Restorer<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْجَبَّارُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who implements His will; The One Who compels His creation (toward good). The Greatest One Who is Exalted, high above His creation. The One Who reforms and amends the affairs of His creation. Where there is a deficiency, He completes it. Where a heart is broken, He repairs it.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 10, \"t\": \"Al-Mutakabbir\", \"ar\": \"الْمُتَكَبِّر\", \"m\": {\"en\": \"The Supreme, The Majestic\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"10\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Mutakabbir<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Superior, The Majestic<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْمُتَكَبِّرُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who is supremely great. The One who is greater than all of creation and who manifests His greatness in all things and in all ways. The One who has rights, privileges and attributes which no other may possess. He is free from any evil, defect or deficiency. The One who is clear from the attributes of His creatures and from resembling them. The Supreme.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 11, \"t\": \"Al-Khaliq\", \"ar\": \"الْخَالِق\", \"m\": {\"en\": \"The Creator\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"11\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Khaliq<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Creator<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْخَالِقُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who creates something from nothing and determines and creates according to the proper measure and proportion of each thing. The One who plans and determines how, when and where to create. The One whose works are perfectly suited, appropriate, fitting and proper.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 12, \"t\": \"Al-Bari'\", \"ar\": \"الْبَارِئ\", \"m\": {\"en\": \"The Evolver, The Originator\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"12\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Bari'<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Originator, The Inventor<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْبَارِئُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who brings the creation out of non-existence into existence; Who creates something from nothing; Who invents and innovates with no prior model, and who gives His creation distinct characteristics which distinguishes them from one another. The Creator of the universe and all that it contains.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 13, \"t\": \"Al-Musawwir\", \"ar\": \"الْمُصَوِّر\", \"m\": {\"en\": \"The Fashioner, The Designer\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"13\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Musawwir<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Fashioner<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْمُصَوِّرُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who brings into existence anything that He wills in the shape and form He decides. He has given everything in creation its own distinct design in accordance to His wisdom and He is continuously doing so. He simply says, &quot;be&quot; and it is, in the manner and form that He desires. The Designer. The Giver of Forms.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 14, \"t\": \"Al-Ghaffar\", \"ar\": \"الْغَفَّار\", \"m\": {\"en\": \"The Repeatedly Forgiving\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"14\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Ghaffar<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Ever-Forgiving<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْغَفَّارُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One forgives those who turn in sincere repentance to Him. The One who continues to forgive and pardon us, again and again, regardless of how many times we sin. He never tires of forgiving us and the quantity of His forgiveness is perpetually abundant.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 15, \"t\": \"Al-Qahhar\", \"ar\": \"الْقَهَّار\", \"m\": {\"en\": \"The Subduer, The Dominant\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"15\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Qahhar<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The All-Prevailing, The Subduer<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْقَهَّارُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who dominates everything in His kingdom. The One before whom the whole of creation has humbled itself, and submitted, whether willingly or unwillingly, before His Grandeur, power and Perfect Strength. He has power and control over all things and nothing occurs except what He allows.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 16, \"t\": \"Al-Wahhab\", \"ar\": \"الْوَهَّاب\", \"m\": {\"en\": \"The Bestower\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"16\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Wahhab<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Giver of Gifts, The Bestower<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْوَهَّابُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who continually bestows gifts, favors, mercy and success upon all of creation. The One who gives freely and endlessly without expectation of any return. He gives without our earning it/working for it and His gifts are unmatchable. The Bestower who gives whatever He wills to whomsoever He wills.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 17, \"t\": \"Ar-Razzaq\", \"ar\": \"الرَّزَّاق\", \"m\": {\"en\": \"The Provider\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"17\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Ar-Razzaq<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Provider<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الرَّزَّاقُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who creates all means of nourishment and subsistence. He is the One who provides everything that is needed (rizq) for everyone, as a means of support and growth for the body, the mind, the heart, and the spiritual life. He gives to everyone, regardless of whether they worship Him, and He apportions these provisions in a manner that befits His wisdom and mercy. The Bestower of Sustenance.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 18, \"t\": \"Al-Fattah\", \"ar\": \"الْفَتَّاح\", \"m\": {\"en\": \"The Opener, The Judge\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"18\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Fattah<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Judge &amp; Opener (Who Distinguishes Truth from Falsehood)<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْفَتَّاحُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The Most trustworthy and wise Judge, who will judge between His servants on the Day of Resurrection with perfect justice. The One who opens all the doors of mercy, profit, and sustenance to His slaves, and provides them the means of attaining both the good in this life and the Hereafter. He opens the eyes and hearts (of those who are sincere and truthful) to the truth, removes their difficulties, gives victory, and opens the doors of knowledge and understanding so that we may know Him, love Him and repent to Him. The Opener and Giver of Knowledge and the ultimate Judge.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 19, \"t\": \"Al-Alim\", \"ar\": \"الْعَلِيم\", \"m\": {\"en\": \"The All-Knowing\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"19\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Alim<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The All-Knowing<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>العَلِيمُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One whose knowledge is neither acquired through learning, nor preceded by ignorance, nor followed by forgetfulness. He is aware of all things, past, present, and future. The One who has reached perfection in His Knowledge; Who Knows and has always Known. The One who is knowing of our deeds and nothing escapes him; His knowledge encompasses all of creation.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 20, \"t\": \"Al-Qabid\", \"ar\": \"الْقَابِض\", \"m\": {\"en\": \"The Restrainer, The Constrictor\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"20\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Qabid<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Withholder, The Restrictor<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْقَابِضُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who withholds the provisions, wealth, and sustenance, and seizes the souls of His creation (causing them to die), all in compliance with His wisdom and mercy. He decides when to withhold something or to make it scarce, either physically or spiritually. He withholds and restricts when it is good for us and none can withhold provisions except Him.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 21, \"t\": \"Al-Basit\", \"ar\": \"الْبَاسِط\", \"m\": {\"en\": \"The Extender, The Expander\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"21\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Basit<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Extender, The Munificent<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْبَاسِطُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who is bountiful and giving towards His creatures. He gives and extends provisions, sustenance and wealth freely and with great generosity. He provides for the needs of His creation, bestowing upon them bounties. The One who gives life to the hearts, whose glory and abundance expand the hearts of His creation. The One who releases the souls, allowing them to live. The Extremely Generous.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 22, \"t\": \"Al-Khafid\", \"ar\": \"الْخَافِض\", \"m\": {\"en\": \"The Abaser\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"22\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Khafid<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Abaser<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْخَافِض<\\/span><\\/div>\\n    <div class=\\\"ahp-desc ahp-none\\\" data-poster-desc lang=\\\"en\\\">Description to come.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 23, \"t\": \"Ar-Rafi'\", \"ar\": \"الرَّافِع\", \"m\": {\"en\": \"The Exalter\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"23\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Ar-Rafi'<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Exalter<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الرَّافِع<\\/span><\\/div>\\n    <div class=\\\"ahp-desc ahp-none\\\" data-poster-desc lang=\\\"en\\\">Description to come.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 24, \"t\": \"Al-Mu'izz\", \"ar\": \"الْمُعِزّ\", \"m\": {\"en\": \"The Giver of Honour\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"24\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Mu'izz<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Giver of Honour<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْمُعِزّ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc ahp-none\\\" data-poster-desc lang=\\\"en\\\">Description to come.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 25, \"t\": \"Al-Mudhill\", \"ar\": \"الْمُذِلّ\", \"m\": {\"en\": \"The Giver of Dishonour\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"25\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Mudhill<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Giver of Dishonour<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْمُذِلّ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc ahp-none\\\" data-poster-desc lang=\\\"en\\\">Description to come.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 26, \"t\": \"As-Sami'\", \"ar\": \"السَّمِيع\", \"m\": {\"en\": \"The All-Hearing\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"26\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>As-Sami'<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The All-Hearing, The Ever-Listening<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>السَّمِيعُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One whose hearing and attention comprehends everything. He hears every sound and voice in all their different languages and various needs. He listens to the speech of His creatures: their exchanges, secrets, whispers and conversations, and pays attention to every supplication and invocation. The One who, if the entire universe were to speak at once, He would distinguish each and everyone of their individual sounds.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 27, \"t\": \"Al-Basir\", \"ar\": \"الْبَصِير\", \"m\": {\"en\": \"The All-Seeing\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"27\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Basir<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The All-Seeing<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْبَصِيرُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who has insight into all things and who perceives every detail, every state of existence, and every circumstance. He is aware of everything that takes place in the universe, even down to the most minuscule, seemingly invisible action, and He recompenses His servants accordingly by His wisdom and ultimate justice. The All-Perceiving, The All-Comprehending.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 28, \"t\": \"Al-Hakam\", \"ar\": \"الْحَكَم\", \"m\": {\"en\": \"The Judge, The Arbitrator\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"28\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Hakam<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Judge<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْحَكَمُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The most just Judge. The One who judges between His servants in this life and the Hereafter with truth, wisdom, fairness, complete justice and immense mercy. He will not oppress anyone to the extent of an atoms weight, and none will be made to carry the encumbrance of another. No servant will be recompensed in a way that is greater that the magnitude of his or her sin, rather, each servant will be given only what he or she deserves. The Arbitrator, The Giver of Justice.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 29, \"t\": \"Al-Adl\", \"ar\": \"الْعَدْل\", \"m\": {\"en\": \"The Just\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"29\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Adl<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Just<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْعَدْل<\\/span><\\/div>\\n    <div class=\\\"ahp-desc ahp-none\\\" data-poster-desc lang=\\\"en\\\">Description to come.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 30, \"t\": \"Al-Latif\", \"ar\": \"اللَّطِيف\", \"m\": {\"en\": \"The Subtle, The Gentle\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"30\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Latif<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Most Subtle, The Kind<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>اللَّطِيفُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who is knowledgeable of the most subtle and minuscule matters that will lead to His slaves' well-being. He is Well-Aware of the situations of His servants, and nothing is hidden from Him of thoughts, hopes and secrets. He knows how to guide them to what will benefit them, and He does so with kindness, love and gentleness.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 31, \"t\": \"Al-Khabir\", \"ar\": \"الْخَبِير\", \"m\": {\"en\": \"The All-Aware\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"31\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Khabir<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Fully Aware<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الخَبِيرُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One whose knowledge encompasses all of the outward and hidden matters, the open and secret, all those things that must necessarily occur, are impossible to occur, and can possibly occur, of the past, present, and future affairs of the whole of creation. He knows the internal and external qualities of things and there is absolutely nothing that is hidden from Him.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 32, \"t\": \"Al-Halim\", \"ar\": \"الْحَلِيم\", \"m\": {\"en\": \"The Forbearing\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"32\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Halim<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Forbearing<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْحَلِيم<\\/span><\\/div>\\n    <div class=\\\"ahp-desc ahp-none\\\" data-poster-desc lang=\\\"en\\\">Description to come.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 33, \"t\": \"Al-Azim\", \"ar\": \"الْعَظِيم\", \"m\": {\"en\": \"The Magnificent, The Great\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"33\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Azim<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Tremendous One, The Magnificent<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>العَظِيمُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who is greater, more exalted and magnificent than anything. The Mighty One in His power, gravity and eminence. Everything is subject to His might and power, and nothing is higher, greater or superior to Him. He possesses all of the qualities of Magnification, and no creature can praise Him to the degree that He truly deserves, rather He is as He has praised Himself, and He is above the praise of His creatures.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 34, \"t\": \"Al-Ghafur\", \"ar\": \"الْغَفُور\", \"m\": {\"en\": \"The All-Forgiving\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"34\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Ghafur<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Great Forgiver<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْغَفُورُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who covers our sins, fully aware of what they are, and protects us from the consequences of them by granting His forgiveness. The One whose forgiveness encompasses every sin, no matter the enormity, when the sinner sincerely repents. The quality of His forgiveness is vast and all-encompassing.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 35, \"t\": \"Ash-Shakur\", \"ar\": \"الشَّكُور\", \"m\": {\"en\": \"The Grateful, The Appreciative\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"35\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Ash-Shakur<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Appreciative<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الشَّكُورُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who rewards the believing servants for their good deeds, giving them far more than they deserve. The One who recognizes and appreciates all good, no matter how minute or intangible, even the good thought that is never carried out, and even the good of the sinner and the disbeliever.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 36, \"t\": \"Al-Ali\", \"ar\": \"الْعَلِيّ\", \"m\": {\"en\": \"The Most High\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"36\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Ali<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Exalted<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>العَلِيُّ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who is high above His creation in His Power and Status. To Him belongs highness in all of its aspects: Highness of His Essence, Highness of His Attributes and Esteem, Highness of His Strength and Power. His attributes are high in degree, rank, and magnificence and are evident in their perfection. There is nothing like Him in all of His attributes. Everything is subservient to His will and authority. Nothing occurs or ceases to occur except by His leave. The High; The Sublime.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 37, \"t\": \"Al-Kabir\", \"ar\": \"الْكَبِير\", \"m\": {\"en\": \"The Greatest\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"37\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Kabir<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Greatest<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الكبير<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">He is the Magnificent, the Sublime and the Most Great in His Being, attributes and actions, and there is nothing greater than Him.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 38, \"t\": \"Al-Hafiz\", \"ar\": \"الْحَفِيظ\", \"m\": {\"en\": \"The Preserver, The Guardian\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"38\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Hafiz<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Guardian<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْحَفِيظُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who is ever-mindful and constantly on guard. He guards and preserves all of creation from perishing and His knowledge encompasses all that He has brought into existence. The One who accounts the actions of His servants and their rewards and protects His Awliyaa (close friends) from falling into sins and destructive matters. The Preserver.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 39, \"t\": \"Al-Muqit\", \"ar\": \"الْمُقِيت\", \"m\": {\"en\": \"The Sustainer, The Nourisher\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"39\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Muqit<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The All-Powerful Maintainer<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>المُقِيتُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who provides everything that is in existence with what would strengthen and sustain it; Who provides their nourishment, whether He brings it to them or leads them to it, and provides it in due proportion and time, in accordance to His Wisdom and Praise. The Sustainer and Supporter, the One Who protects and witnesses over His creation. The Master Who is capable of all things.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 40, \"t\": \"Al-Hasib\", \"ar\": \"الْحَسِيب\", \"m\": {\"en\": \"The Reckoner\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"40\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Hasib<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The All-Sufficient, The Reckoner<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْحَسِيبُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who is All-Knowing of His servants and sufficient for those who put their trust in Him. He takes care of His slaves in both worldly and spiritual matters and is the Creator of the means which produce sufficiency. The One who will take account of all people's deeds and who will reward or punish them in accordance to His Wisdom and His Knowledge of the smallest and greatest of their deeds. The swiftest in taking account.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 41, \"t\": \"Al-Jalil\", \"ar\": \"الْجَلِيل\", \"m\": {\"en\": \"The Majestic\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"41\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Jalil<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Majestic<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْجَلِيل<\\/span><\\/div>\\n    <div class=\\\"ahp-desc ahp-none\\\" data-poster-desc lang=\\\"en\\\">Description to come.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 42, \"t\": \"Al-Karim\", \"ar\": \"الْكَرِيم\", \"m\": {\"en\": \"The Generous, The Noble\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"42\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Karim<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Bountiful, The Generous<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْكَرِيمُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who is noble, generous and gracious to all that is in existence. The Most Generous who abundantly gives from His bounty which never ends. He gives blessings to His creation, even if they do not worship Him. His generosity, greatness and graciousness do not depend upon anyone and are limitless. The One who, when He gives, gives more than what was hoped for. The Abundant in Good.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 43, \"t\": \"Ar-Raqib\", \"ar\": \"الرَّقِيب\", \"m\": {\"en\": \"The Watchful\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"43\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Ar-Raqib<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The All-Watchful<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الرَّقِيبُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who closely watches over His creation. He hears, sees, and knows everything and nothing escapes Him. He sees what is hidden in the hearts and minds, what is done in secret and in the open. The One who charges every soul with what it has earned. The ever-vigilant witness. The Observer.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 44, \"t\": \"Al-Mujib\", \"ar\": \"الْمُجِيب\", \"m\": {\"en\": \"The Responsive\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"44\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Mujib<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Responsive<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْمُجِيبُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who responds to the prayers of His servants (when they are patient and do not give up hope.) He is the One who answers, in a general sense, those who supplicate to Him, whoever they may be, wherever they may be, and whatever condition they may be in. And answers, in a specific sense, those who love Him, and imitate and follow His Shari'ah. Also, the One who responds to the prayers of those in dire need, and the One who inspires us to ask. The Answerer.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 45, \"t\": \"Al-Wasi'\", \"ar\": \"الْوَاسِع\", \"m\": {\"en\": \"The All-Encompassing\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"45\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Wasi'<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The All-Encompassing<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الوَاسِعُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who encompasses all of His creation with satisfaction and generosity. His favor is immense and He grants mercy to all things. He accommodates the requests of His creation and does not burden them or hold them responsible for what is beyond their capabilities. His knowledge and mercy encompasses everything. The Vast.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 46, \"t\": \"Al-Hakim\", \"ar\": \"الْحَكِيم\", \"m\": {\"en\": \"The Wise\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"46\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Hakim<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The All-Wise<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْحَكِيمُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One whose Wisdom encompasses all things and who is Wise in His sayings and actions. He is wise in His creation and covenants and nothing is created without purpose and perfection. He places things into their proper places. And due to His wisdom, He is just and His commands, laws and judgments are just. The Most Judicious.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 47, \"t\": \"Al-Wadud\", \"ar\": \"الْوَدُود\", \"m\": {\"en\": \"The Loving\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"47\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Wadud<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Most Loving<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْوَدُودُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who loves whoever turns to Him in repentance from his or her sins. The One who loves His prophets and messengers, His allies and friends (awliyaa') and expresses it through His forgiveness. He is Full of Love towards the believers; He praises them and is Benevolent towards them. He gives them signs of His love for them and causes others to love them as well.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 48, \"t\": \"Al-Majeed\", \"ar\": \"الْمَجِيد\", \"m\": {\"en\": \"The All-Glorious\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"48\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Majeed<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The All-Glorious<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْمَجِيد<\\/span><\\/div>\\n    <div class=\\\"ahp-desc ahp-none\\\" data-poster-desc lang=\\\"en\\\">Description to come.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 49, \"t\": \"Al-Ba'ith\", \"ar\": \"الْبَاعِث\", \"m\": {\"en\": \"The Resurrector\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"49\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Ba'ith<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Resurrector<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْبَاعِث<\\/span><\\/div>\\n    <div class=\\\"ahp-desc ahp-none\\\" data-poster-desc lang=\\\"en\\\">Description to come.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 50, \"t\": \"Ash-Shahid\", \"ar\": \"الشَّهِيد\", \"m\": {\"en\": \"The Witness\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"50\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Ash-Shahid<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Witness<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الشَّهِيدُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who is Honest and Trustworthy in His testimony. He is Aware of everything. He hears every voice - the loud and the quiet; sees everything in existence - the significant and the insignificant. The One who will testify against His servants on the Day of Resurrection and will be the Witness for the oppressed who have no other witness or supporter, thus restoring their rights and avenging them.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 51, \"t\": \"Al-Haqq\", \"ar\": \"الْحَقّ\", \"m\": {\"en\": \"The Truth\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"51\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Haqq<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Ultimate Truth<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْحَقُّ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who is the only true deity (Ilaha). He truly exists and is truly divine, and all else besides Him is falsehood. He is the most truthful; His existence is true; His promise, action and speech are true; the meeting with Him is true; His Messengers are the truth; the afterlife is the truth; and the Day of Judgment is the truth. The One through whom all righteousness, justice, and truth are revealed.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 52, \"t\": \"Al-Wakil\", \"ar\": \"الْوَكِيل\", \"m\": {\"en\": \"The Trustee\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"52\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Wakil<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Disposer of Affairs<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>الْوَكِيلُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One who guides the believers, protects them from harm, and guards them. He is the trustee over His creatures and is the Disposer of affairs for everything in existence. The One who gives provision and protection and controls all that occurs. The Ultimate Trustee.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 53, \"t\": \"Al-Qawiyy\", \"ar\": \"الْقَوِيّ\", \"m\": {\"en\": \"The Strong\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"53\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Qawiyy<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Mighty, The Strong<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>القَوِيُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The Strong One Who is capable of doing what He wills. There is nothing capable of defeating Him or of thwarting His decree. The One to Whom belongs all Might; the might of power, dominance and superiority. All creatures are subdued by Him, yielding and submitting to His Greatness. None can overcome Him and stand against His Decree; it is carried out with perfection and full effect in accordance with His Knowledge and Wisdom.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 54, \"t\": \"Al-Matin\", \"ar\": \"الْمَتِين\", \"m\": {\"en\": \"The Firm, The Steadfast\", \"bn\": null}, \"html\": \"<div class=\\\"ahp ahp-screensaver\\\" data-asma-poster=\\\"54\\\" lang=\\\"en\\\">\\n    <div class=\\\"ahp-title\\\"><span data-poster-title>Al-Matin<\\/span><\\/div>\\n    <div class=\\\"ahp-mean\\\"><span data-poster-meaning>The Strong<\\/span><\\/div>\\n    <div class=\\\"ahp-ar\\\" lang=\\\"ar\\\"><span data-poster-arabic>المَتِينُ<\\/span><\\/div>\\n    <div class=\\\"ahp-desc\\\" data-poster-desc data-poster-desc-source=\\\"poster\\\" lang=\\\"en\\\">The One Who is firm and strong. He is not in need of anything; He is not in need of His creation. Rather, His creation is completely in need of Him. The One Who is most strong in His power and ability, neither weariness nor toil ever touches Him; His strength knows no bounds and He is able to do all things. The Most Strong.<\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-q\\\" data-poster-ref=\\\"quran\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n    <div class=\\\"ahp-ref ahp-ref-h\\\" data-poster-ref=\\\"hadith\\\"><span class=\\\"ahp-none\\\">None given<\\/span><\\/div>\\n  <\\/div>\"}, {\"n\": 55,
