ب ( وَكُلَّ شيْءٍ أَحْصَيْنَاهُ في إِمَامٍ مُّبِينٍ ) أى : وك\",\"ar-tafsir-al-wasit|38\":\"وقوله - تعالى - : ( والشمس تَجْرِي لِمُسْتَقَرٍّ لَّهَا ) بيان لدليل آخر على قدرته - تعالى - وهو معطوف على قوله - تعالى - قبل ذلك : ( وَآيَةٌ لَّهُمُ الليل . . . )قال الآلوسى ما ملخصه : وقوله ( لِمُسْتَقَرٍّ لَّهَا ) أى لحد معين تنتهى إليه . . شبه بمستقر المسافر إذا انتهى من سيره ، والمستقر عليه اسم مكان ، واللام بمعنى إلى . .ويصح أن يكون اسم زمان ، على أنها تجرى إلى وقت لها لا تتعداه ، وعلى هذا فمستقرها : انتهاء سيرها عند انقضاء الدنيا . .والمعنى : وآية أخرى لهم على قدرتنا ، وهى أن الشمس تجرى إلى مكان معين لا تتعداه وإلى زمن محدد لا تتجاوزه وهذا المكان وذلك الزمان ، كلاهما لا يعلمه إلا الله - تعالى - .قال بعض العلماء : قوله - تعالى - : ( والشمس تَجْرِي لِمُسْتَقَرٍّ لَّهَا ) أى : والشمس تدو\",\"abu-bakr-jabir-al-jazairi|8\":\"شرح الكلمات:\\n\\nيسۤ: هذا أحد الحروف المقطعة يكتب هكذا يسۤ، ويقرأ هكذا ياسِينْ والله أعلم بمراده به.\\n\\nوالقرآن الحكيم: أي ذي الحكمة إذ وضع القرآن كل شيء في موضعه فهو لذلك حكيم ومحكم أيضاً بعجيب النظم وبديع المعاني.\\n\\nإنك لمن المرسلين: أي يا محمد من جملة الرسل الذين أرسلناهم إلى أقوامهم.\\n\\nعلى صراط مستقيم: أي طريق مستقيم الذي هو الإسلام.\\n\\nتنزيل العزيز الرحيم: أي القرآن تنزيل العزيز في انتقامه ممن كفر به الرحيم بمن تاب إليه.\\n\\nما أنذر آباؤهم: أي لم ينذر آباؤهم إذ لم يأتهم رسول من فترة طويلة.\\n\\nفهم غافلون: أي لا يدرون عاقبة ما هم فيه من الكفر والضلال، ولا يعرفون ما ينجيهم من ذلك وهو الإيمان وصالح الأعمال.\\n\\nلقد حق القول على أكثرهم: أي وجب عليهم العذاب فلذا هم لا يؤمنون.\\n\\nإنا جعلنا في أعناقهم أغلالاً: أي\",\"abu-bakr-jabir-al-jazairi|12\":\"شرح الكلمات:\\n\\nيسۤ: هذا أحد الحروف المقطعة يكتب هكذا يسۤ، ويقرأ هكذا ياسِينْ والله أعلم بمراده به.\\n\\nوالقرآن الحكيم: أي ذي الحكمة إذ وضع القرآن كل شيء في موضعه فهو لذلك حكيم ومحكم أيضاً بعجيب النظم وبديع المعاني.\\n\\nإنك لمن المرسلين: أي يا محمد من جملة الرسل الذين أرسلناهم إلى أقوامهم.\\n\\nعلى صراط مستقيم: أي طريق مستقيم الذي هو الإسلام.\\n\\nتنزيل العزيز الرحيم: أي القرآن تنزيل العزيز في انتقامه ممن كفر به الرحيم بمن تاب إليه.\\n\\nما أنذر آباؤهم: أي لم ينذر آباؤهم إذ لم يأتهم رسول من فترة طويلة.\\n\\nفهم غافلون: أي لا يدرون عاقبة ما هم فيه من الكفر والضلال، ولا يعرفون ما ينجيهم من ذلك وهو الإيمان وصالح الأعمال.\\n\\nلقد حق القول على أكثرهم: أي وجب عليهم العذاب فلذا هم لا يؤمنون.\\n\\nإنا جعلنا في أعناقهم أغلالاً: أي\",\"abu-bakr-jabir-al-jazairi|38\":\"شرح الكلمات:\\n\\nوآية لهم الليل نسلخ منه النهار: وآية لهم على إمكان البعث الليل نسلخ منه النهار أي نزيل النهار عن الليل فإذا هم مظلمون بالليل.\\n\\nلمستقر لها: أي مكان لها لا تتجاوزه.\\n\\nذلك تقدير العزيز العليم: أي جريها في فلكها تقدير أي تقنين العزيز في ملكه العليم بكل خلقه.\\n\\nوالقمر قدرناه منازل: وآية أخرى هي تقدير منازل القمر التي هي ثمان وعشرون منزلة.\\n\\nحتى عاد كالعرجون القديم: أي حتى رجع كعود العذق الذي أصله في النخلة وآخره في الشماريخ وهو أصفر دقيق مقوس كالقمر لما يكون في آخر الشهر.\\n\\nلا الشمس ينبغي لها أن تدرك القمر: أي لا يصح للشمس ولا يسهل عليها أن تدرك القمر فيجتمعان في الليل.\\n\\nولا الليل سابق النهار: أي بأن يأتي قبل انقضائه.\\n\\nوكل في فلك يسبحون: أي كل من الشمس والقمر والنجوم السيارة في فلك يسبح\",\"bn-tafsir-ahsanul-bayaan|8\":\"আমি ওদের গলদেশে মোটা বেড়ি পরিয়েছি, তা ওদের চিবুক পর্যন্ত বর্তমান, ফলে ওরা ঊর্ধ্বমুখী হয়ে আছে। [১]\\n\\n[১] যার ফলে তারা না এদিক ওদিক দেখতে পারে, আর না মাথা ঝুঁকাতে পারে। বরং তারা মাথা উপর দিকে উঠিয়ে ও চোখ নিচের দিকে নামিয়ে থাকবে। এটা তাদের সত্য প্রত্যাখ্যান ও কার্পণ্য করার উদাহরণ। এও হতে পারে যে, এটা তাদের জাহান্নামের শাস্তি-পদ্ধতির বর্ণনা। (আইসারুত তাফাসীর)\",\"bn-tafsir-ahsanul-bayaan|12\":\"নিশ্চয় আমি মৃতকে জীবিত করি[১] এবং লিখে রাখি ওদের কৃতকর্ম ও যা ওরা পশ্চাতে রেখে যায়, [২] আমি প্রত্যেক জিনিস স্পষ্ট গ্রন্থে সংরক্ষিত রেখেছি। [৩]\\n\\n[১] অর্থাৎ, কিয়ামত দিবসে। এখানে মৃতকে জীবিত করার বর্ণনায় উদ্দেশ্য এই ইঙ্গিত করা যে, আল্লাহ তাআলা কাফেরদের মধ্য হতে যার অন্তরকে চান জীবিত করে দেন; যা কুফর ও ভ্রষ্টতার কারণে মৃত হয়ে গিয়েছিল। ফলে সে হিদায়াত ও ঈমান গ্রহণ করে নেয়।\\n\\n[২] مَا قَدَّمُوْا দ্বারা ঐ সকল আমল বা কৃতকর্মকে বুঝানো হয়েছে, যা মানুষ নিজের জীবনে করে থাকে। এবং 'آثَارَهُمْ দ্বারা ঐ সকল ভাল ও মন্দ আমলের নমুনাকে বুঝানো হয়েছে, যা সে পৃথিবীতে ছেড়ে যায় এবং তার মৃত্যুর পর তার অনুসরণে মানুষ সেই আমল করতে থাকে। যেমন হাদীসে আছে, \\\"যে ব্যক্তি ইসলামে কোন ভালো রীতি (বা কর্ম) প্রবর্তিত করে, তার জন্য রয়ে\",\"bn-tafsir-ahsanul-bayaan|38\":\"আর সূর্য তার নির্দিষ্ট গন্ডীর মধ্যে আবর্তন করে;[১] এ পরাক্রমশালী সর্বজ্ঞ (আল্লাহর) নিয়ন্ত্রণ।\\n\\n[১] অর্থাৎ, নিজের সেই কক্ষ পথে ঘোরে, যা আল্লাহ তাআলা তার জন্য নির্ধারিত করে রেখেছেন। নির্দিষ্ট সেই স্থান থেকে তারা পরিক্রমা আরম্ভ করে এবং সেই স্থানেই ভ্রমণ শেষ করে। তা থেকে সামান্য পরিমাণও এমন এদিক ওদিক হয় না যে, তার ফলে কোন অন্য চলমান গ্রহের সাথে ধাক্কা লেগে যাবে। দ্বিতীয় অর্থ হল, \\\"নিজ অবস্থান ক্ষেত্রের জন্য।\\\" আর তার ঐ ক্ষেত্র হল আরশে ইলাহীর নিম্নদেশ। যেমন হাদীসে বর্ণনা হয়েছে যে, \\\"সূর্য প্রত্যহ অস্তমিত হওয়ার পর আরশের নিচে গিয়ে সিজদা করে। অতঃপর সেখান থেকে পুনরায় উদিত হওয়ার অনুমতি চায়।\\\" (বুখারীঃ সূরা ইয়াসীনের তফসীর) দুই অর্থেই لِمُسْتَقَرٍّ শব্দটিতে লাম ইল্লাত (কারণ বর্ণনা) এর জন্য ব্যবহার হয়েছে। অর\",\"ar-tafsir-al-mukhtasar|8\":\"ومثلهم في ذلك مثل من جُعِلَت أصفاد في أعناقهم، وجُمِعَت أيديهم مع أعناقهم تحت مجامع لحاهم، فاضطروا إلى رفع رؤوسهم إلى السماء، فلا يستطيعون خفضها، فهؤلاء مَغْلُولون عن الإيمان بالله فلا يذعنون له، ولا يخفضون رؤوسهم من أجله.\",\"ar-tafsir-al-mukhtasar|12\":\"إنا نحن نحيي الموتى ببعثهم للحساب يوم القيامة، ونكتب ما قدموه في حياتهم الدنيا من الأعمال الصالحة والسيئة، ونكتب ما كان لهم من أثر باق بعد مماتهم صالحًا كان كالصدقة الجارية أو سيئًا كالكفر، وقد أحصينا كل شيء في كتاب واضح؛ وهو اللوح المحفوظ.\",\"ar-tafsir-al-mukhtasar|38\":\"وعلامة لهم على وحدانية الله هذه الشمس التي تجري لمستقر يعلم الله قَدْرَه لا تتجاوزه، ذلك التقدير تقدير العزيز الذي لا يغالبه أحد، العليم الذي لا يخفى عليه شيء من أمر مخلوقاته.\",\"bengali-mokhtasar|8\":\"৮. এতে তাদের উদাহরণ হচ্ছে ওই সব লোকজনের ন্যায় যাদের গর্দানে শিকল চাপিয়ে দেয়া হয়েছে। আর তাদের হাতকে গর্দানসহ দাড়ি সমষ্টির নিচে জড় করা হয়েছে। ফলে তারা আসমানের দিকে মাথা উঠাতে এমনভাবে বাধ্য হয়েছে যে, তা আর নিচের দিকে আনতে পারে না। ফলে এরা ঈমান আনয়নের পথে শিকলাবদ্ধ। তারা এটি মেনে নেয়ার জন্য সম্মত হবে না এবং এতদুদ্দেশ্যে তাদের মাথাও নত করবে না।\",\"bengali-mokhtasar|12\":\"১২. আমি অবশ্যই মৃতদেরকে হিসাব নেয়ার উদ্দেশ্যে কিয়ামত দিবসে জীবিত করবো। আর লিপিবদ্ধ করবো তারা দুরিয়ার জীবনে ভাল মন্দ যা করেছে। আমি আরো লিপিবদ্ধ করে রাখব যা তাদের মরণের পর অবশিষ্ট থাকবে। যেমন ভাল কাজের মধ্যে রয়েছে চলমান সাদকা কিংবা মন্দ যেমন কুফরি। বস্তুতঃ আমি সব কিছুই একটি সুস্পষ্ট কিতাবে রক্ষিত করে রেখেছি যার নাম লাওহে মাহফুজ।\",\"bengali-mokhtasar|38\":\"৩৮. আল্লাহর একত্ববাদের আরেকটি নিদর্শন হলো এই সূর্য যা তার লক্ষ্য পথে চলতে থাকে। যার পরিমাণ আল্লাহর জানা। সে তাকে অতিক্রম করে না। এই নির্ধারক মহা পরাক্রমশালী যাকে কেউ পরাস্ত করতে পারে না। তিনি সর্বজ্ঞাতা। যাঁর নিকট সৃষ্টিকুলের কোন কিছুই গোপন থাকে না।\"}}<\/script>\n<script>\n(function(){\nconst D=JSON.parse(document.getElementById(\"D\").textContent), SC=JSON.parse(document.getElementById(\"S\").textContent);\nconst $=(s)=>document.querySelector(s), esc=(s)=>String(s??\"\").replace(/&/g,\"&amp;\").replace(/<\/g,\"&lt;\").replace(/>/g,\"&gt;\");\nconst KEYS={\n hard:{n:\"Hard for me\",lvl:\"both\",src:\"you\",c:\"--hard\",g:\"Your own mark: this one is hard for you.\"},\n gharib:{n:\"Gharīb: needs the dictionary\",lvl:\"word\",src:\"auto\",c:\"--gharib\",g:\"Suggested automatically: its root-word (lemma) is used only once in the whole Qur'an.\"},\n wujuh:{n:\"Wujūh: more than one meaning\",lvl:\"word\",src:\"sug\",c:\"--wujuh\",g:\"Suggested: its root carries more than one meaning group in our dictionary data; check which meaning is meant here.\"},\n hadith:{n:\"Needs Hadith\",lvl:\"ayah\",src:\"auto\",c:\"--hadith\",g:\"Found automatically: a hadith in our 15 books quotes this āyah.\"},\n scholars:{n:\"Scholars across the eras\",lvl:\"ayah\",src:\"you\",c:\"--scholars\",g:\"Your mark: read the scholars on this one.\"},\n quran:{n:\"Explained by other āyāt\",lvl:\"ayah\",src:\"you\",c:\"--quran\",g:\"Your mark: another āyah explains it (al-Qur'ān bil-Qur'ān).\"},\n siyaq:{n:\"Read with its passage\",lvl:\"ayah\",src:\"sug\",c:\"--siyaq\",g:\"Suggested: its meaning runs on with the āyāt around it (siyāq).\"},\n asbab:{n:\"Asbāb an-Nuzūl\",lvl:\"ayah\",src:\"auto\",c:\"--asbab\",g:\"Found automatically: al-Wāḥidī's Asbāb an-Nuzūl reports why it came down.\"}\n};\nconst ORDER=Object.keys(KEYS);\nconst col=(k)=>getComputedStyle(document.documentElement).getPropertyValue(KEYS[k].c).trim();\nconst none=()=>getComputedStyle(document.documentElement).getPropertyValue(\"--none\").trim();\n// Example personal marks (demo only) and suggestions read from real sources.\nconst YS=D.ys, A=YS.length;\nconst ayKeys=YS.map(()=>new Set()), wdKeys=YS.map((a)=>a.w.map(()=>new Set()));\nYS.forEach((a,i)=>{ if(D.all[35][i][3]) ayKeys[i].add(\"hadith\"); a.w.forEach((w,j)=>{ if(w[2]===1) wdKeys[i][j].add(\"gharib\"); if(w[3]) wdKeys[i][j].add(\"wujuh\"); }); });\n[12,78].forEach((n)=>ayKeys[n-1].add(\"asbab\"));\n[8,12,38,40,69].forEach((n)=>ayKeys[n-1].add(\"hard\"));\n[8,12,38,69].forEach((n)=>ayKeys[n-1].add(\"scholars\"));\nconst QREF={12:\"17:13–14; 82:10–12 (the record of deeds)\",38:\"13:2; 31:29 (each runs to an appointed term)\",78:\"22:5; 75:3–4 (bringing the bones back)\",79:\"30:27 (repeating is easier for Him)\",82:\"2:117; 16:40 (“Be”, and it is)\"};\nObject.keys(QREF).forEach((n)=>ayKeys[n-1].add(\"quran\"));\nconst PASS=[[8,9,\"one picture across two āyāt: the shackles (8) and the barrier (9)\"],[13,32,\"one story: the people of the town and the man who came running\"],[77,83,\"one argument: the bone, the green tree, and “Be”\"]];\nPASS.forEach(([f,t])=>{for(let n=f;n<=t;n++) ayKeys[n-1].add(\"siyaq\");});\nwdKeys[7][9].add(\"hard\"); wdKeys[38][5].add(\"hard\");\nlet view=\"ayat\", only=\"all\", pick={t:\"ayah\",i:7}, ay=7;\nconst active=(k)=>only===\"all\"?(view===\"quran\"? (k!==\"wujuh\") : true):k===only;\n// ---------- drawing ----------\nconst C=300; const P=(r,a)=>[C+r*Math.sin(a),C-r*Math.cos(a)];\nfunction arc(r0,r1,a0,a1){ const big=(a1-a0)>Math.PI?1:0; const [x0,y0]=P(r1,a0),[x1,y1]=P(r1,a1),[x2,y2]=P(r0,a1),[x3,y3]=P(r0,a0);\n return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r1} ${r1} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}L${x2.toFixed(2)} ${y2.toFixed(2)}A${r0} ${r0} 0 ${big} 0 ${x3.toFixed(2)} ${y3.toFixed(2)}Z`; }\nfunction bands(r0,r1,a0,a1,keys,attrs,gap){ const ks=ORDER.filter((k)=>keys.has(k)&&active(k)); const g=gap??0.0;\n if(!ks.length) return `<path class=\"seg\" d=\"${arc(r0,r1,a0+g,a1-g)}\" fill=\"${none()}\" ${attrs}/>`;\n const h=(r1-r0)/ks.length; return ks.map((k,i)=>`<path class=\"seg\" d=\"${arc(r0+i*h,r0+(i+1)*h,a0+g,a1-g)}\" fill=\"${col(k)}\" ${attrs}/>`).join(\"\"); }\nconst TAU=Math.PI*2;\nfunction centre(t1,t2,t3){ return `<circle cx=\"${C}\" cy=\"${C}\" r=\"${R0-6}\" fill=\"var(--card)\" stroke=\"var(--line)\"/>\n <text x=\"${C}\" y=\"${C-14}\" text-anchor=\"middle\" style=\"font:700 30px Amiri,serif;fill:var(--navy)\">${esc(t1)}<\/text>\n <text x=\"${C}\" y=\"${C+16}\" text-anchor=\"middle\" style=\"font:600 15px system-ui;fill:var(--ink)\">${esc(t2)}<\/text>\n <text x=\"${C}\" y=\"${C+36}\" text-anchor=\"middle\" style=\"font:13px system-ui;fill:var(--mut)\">${esc(t3)}<\/text>`; }\nlet R0=95;\nfunction draw(){\n const s=[]; R0=95;\n if(view===\"quran\"){\n  const tot=D.all.reduce((n,s)=>n+s.length,0); let k=0;\n  D.all.forEach((sur,si)=>{ const a0=k/tot*TAU, a1=(k+sur.length)/tot*TAU;\n   const hit=sur.filter((r)=>(active(\"gharib\")&&r[1])||(active(\"hadith\")&&r[3])||(active(\"wujuh\")&&r[2])).length/sur.length;\n   s.push(`<path class=\"seg\" d=\"${arc(100,150,a0+0.002,a1-0.002)}\" fill=\"var(--navy)\" fill-opacity=\"${(0.12+0.85*hit).toFixed(2)}\" data-s=\"${si}\"><title>${esc(D.names[si][1])}: ${Math.round(hit*100)}% of its āyāt carry a shown key<\/title><\/path>`);\n   sur.forEach((r,ai)=>{ const b0=(k+ai)/tot*TAU,b1=(k+ai+1)/tot*TAU; const ks=new Set(); if(r[1]) ks.add(\"gharib\"); if(r[2]) ks.add(\"wujuh\"); if(r[3]) ks.add(\"hadith\");\n    s.push(bands(156,290,b0,b1,ks,`data-s=\"${si}\" data-a=\"${ai}\"`)); });\n   k+=sur.length; });\n  s.push(centre(\"القرآن\",\"The whole Qur'an\",\"114 Surahs · 6,236 āyāt\"));\n } else if(view===\"ayat\"){\n  YS.forEach((a,i)=>{ const a0=i/A*TAU,a1=(i+1)/A*TAU; s.push(bands(120,280,a0,a1,ayKeys[i],`data-a=\"${i}\"`,0.004));\n   const [x,y]=P(290,(a0+a1)/2); if(A<=120) s.push(`<text x=\"${x.toFixed(1)}\" y=\"${y.toFixed(1)}\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font:9px system-ui;fill:var(--mut)\">${i+1}<\/text>`); });\n  R0=120; s.push(centre(\"يس\",\"Yā-Sīn (36)\",\"83 āyāt\"));\n } else if(view===\"word1\"){\n  const ws=YS[ay].w, n=ws.length;\n  ws.forEach((w,j)=>{ const a0=j/n*TAU,a1=(j+1)/n*TAU; s.push(bands(150,250,a0,a1,wdKeys[ay][j],`data-a=\"${ay}\" data-w=\"${j}\"`,0.01));\n   const [x,y]=P(275,(a0+a1)/2); s.push(`<text x=\"${x.toFixed(1)}\" y=\"${y.toFixed(1)}\" text-anchor=\"middle\" dominant-baseline=\"middle\" style=\"font:${n>14?15:19}px Amiri,serif;fill:var(--ink)\">${esc(w[0])}<\/text>`); });\n  R0=150; s.push(centre(`٣٦ : ${String(ay+1).replace(/\\d/g,(d)=>\"٠١٢٣٤٥٦٧٨٩\"[d])}`,`Āyah 36:${ay+1}`,`${n} words`));\n } else {\n  const tot=YS.reduce((n,a)=>n+a.w.length,0); let k=0;\n  YS.forEach((a,i)=>{ const a0=k/tot*TAU,a1=(k+a.w.length)/tot*TAU; s.push(bands(105,165,a0,a1,ayKeys[i],`data-a=\"${i}\"`,0.003));\n   a.w.forEach((w,j)=>{ s.push(bands(171,290,(k+j)/tot*TAU,(k+j+1)/tot*TAU,wdKeys[i][j],`data-a=\"${i}\" data-w=\"${j}\"`)); }); k+=a.w.length; });\n  R0=105; s.push(centre(\"يس\",\"Inner: 83 āyāt\",\"Outer: 725 words\"));\n }\n $(\"#svg\").innerHTML=s.join(\"\");\n legend(); markSel();\n}\nfunction markSel(){ document.querySelectorAll(\"#svg .sel\").forEach((e)=>e.classList.remove(\"sel\"));\n const q=pick.t===\"word\"?`[data-a=\"${pick.i}\"][data-w=\"${pick.j}\"]`:pick.t===\"ayah\"?`[data-a=\"${pick.i}\"]:not([data-w]):not([data-s])`:`[data-s=\"${pick.i}\"]:not([data-a])`;\n document.querySelectorAll(\"#svg \"+q).forEach((e)=>e.classList.add(\"sel\")); }\nfunction legend(){ const lv=view===\"quran\"?[\"gharib\",\"hadith\",\"wujuh\"]:view===\"ayat\"?ORDER.filter((k)=>KEYS[k].lvl!==\"word\"):view===\"word1\"?ORDER.filter((k)=>KEYS[k].lvl!==\"ayah\"):ORDER;\n $(\"#legend\").innerHTML=lv.filter(active).map((k)=>`<span class=\"chip\"><span class=\"dot\" style=\"background:${col(k)}\"><\/span>${esc(KEYS[k].n)}<\/span>`).join(\"\")+`<span class=\"chip\"><span class=\"dot\" style=\"background:${none()}\"><\/span>No key<\/span>`+(view===\"quran\"&&only===\"all\"?`<span>· Wujūh is left out of “All” here: it touches 4,910 of 6,236 āyāt, so it would colour almost everything. Choose it on its own to see it.<\/span>`:\"\"); }\n// ---------- panel ----------\nconst LBL={sahaba:\"Sahaba and Tabi'in (Approaches 28, 29)\",gen1:\"Gen1: to 1258 (Approach 30)\",gen2:\"Gen2: 1258 to about 1700 (Approach 31)\",gen3:\"Gen3: about 1700 to 1924\",gen4:\"Gen4: 1924 to 1945\",gen5:\"Gen5: 1945 to 2001\",gen6:\"Gen6: 2001 onward\"};\nfunction scholars(n){\n if(![8,12,38].includes(n)) return `<p class=\"meta\">In this demo the scholars' texts are loaded for āyāt 8, 12 and 38 only. In the app they would load for any āyah when you open this part (never at startup).<\/p>`;\n let h=\"\";\n Object.keys(LBL).forEach((g)=>{ const rows=SC.meta.filter((m)=>m[6]===g);\n  if(!rows.length){ h+=`<details class=\"era\"><summary>${LBL[g]} · none in the open sources<\/summary><div class=\"src meta\">No tafsir from this era is in the open set we checked (Rashīd Riḍā's al-Manār and al-Marāghī belong here). A gap to fill by hand.<\/div><\/details>`; return; }\n  h+=`<details class=\"era\"${g===\"sahaba\"||g===\"gen1\"?\" open\":\"\"}><summary>${LBL[g]} · ${rows.length}<\/summary>`+rows.map((m)=>{ const t=SC.text[m[0]+\"|\"+n]||\"\"; const bn=/[ঀ-৿]/.test(t);\n   return `<div class=\"src\"><b>${esc(m[1])}<\/b> <span class=\"meta\">${m[3]?`d. ${m[3]} AH / ${m[4]} CE`:`published ${m[4]}`} · ${esc(m[5])} · Approach ${esc(m[7])}<\/span><div class=\"meta\"><i>${esc(m[2])}<\/i><\/div>`+\n    (t?`<div class=\"${bn?\"\":\"arsm\"}\" data-full=\"${esc(t)}\">${esc(t.slice(0,260))}${t.length>260?\"…\":\"\"}<\/div>${t.length>260?'<button class=\"more\">Show more<\/button>':\"\"}`:`<div class=\"meta\">No comment on this āyah in this book (it explains selected āyāt only).<\/div>`)+`<\/div>`; }).join(\"\")+`<\/details>`; });\n return h+`<p class=\"note\">Order: by the scholar's death year. Some books explain two or three āyāt together, so an excerpt can begin with the āyah before. Texts: the open tafsir set (spa5k/tafsir_api, from quran.com and QUL), not yet checked for rights.<\/p>`;\n}\nfunction hadithHtml(n){ const L=D.ysHadith[`36:${n}`];\n if(!L) return `<p class=\"meta\">None of our 15 books quotes this āyah word for word. That does not mean there is no related hadith: the tafsirs that collect narrations (Ibn Kathīr, al-Suyūṭī's ad-Durr al-Manthūr, the Mawsū'ah) list the hadith they connect to each āyah. See the scholars below.<\/p>`;\n return L.map(([b,std,t])=>`<div class=\"had\"><div><b>${esc(b)} ${std?esc(std):\"(passage)\"}<\/b><\/div><div class=\"arsm\">${esc(t.slice(0,330))}${t.length>330?\"…\":\"\"}<\/div><\/div>`).join(\"\")+`<p class=\"meta\">Found by two automatic tests: the book's own label on a quotation, such as [يس: 38], and a five-word run found in this āyah only. In the app each would open in the Hadith module with a way back here.<\/p>`; }\nfunction ayPanel(i){ const a=YS[i], n=i+1, ks=ORDER.filter((k)=>ayKeys[i].has(k));\n const ar=a.w.map((w)=>w[0]).join(\" \");\n let h=`<h2>Āyah 36:${n}<\/h2><div class=\"ar\">${esc(ar)}<\/div><p>${esc(a.en)}<\/p><p class=\"meta\">${esc(a.bn)}<\/p><h3>Keys on this āyah<\/h3>`;\n h+=ks.length?ks.map((k)=>{ let x=KEYS[k].g; if(k===\"quran\") x+=` See ${QREF[n]}.`; if(k===\"siyaq\"){ const p=PASS.find(([f,t])=>n>=f&&n<=t); x+=` Āyāt ${p[0]}–${p[1]}: ${p[2]}.`; }\n  return `<div class=\"key\"><span class=\"dot\" style=\"background:${col(k)};margin-top:6px\"><\/span><div><b>${esc(KEYS[k].n)}<\/b> <span class=\"tag ${KEYS[k].src}\">${KEYS[k].src===\"you\"?\"your mark (example)\":KEYS[k].src===\"auto\"?\"found automatically\":\"suggested\"}<\/span><div class=\"meta\">${esc(x)}<\/div><\/div><\/div>`; }).join(\"\"):`<p class=\"meta\">No key yet.<\/p>`;\n h+=`<p><button class=\"btn\" id=\"tglHard\">${ayKeys[i].has(\"hard\")?\"✓ Hard for me (tap to clear)\":\"Mark: Hard for me\"}<\/button> <button class=\"btn\" id=\"seeWords\">See its words<\/button><\/p>`;\n h+=`<h3>Related hadith<\/h3>`+hadithHtml(n)+`<h3>Scholars across the eras<\/h3>`+scholars(n);\n return h; }\nfunction wordPanel(i,j){ const w=YS[i].w[j], ks=ORDER.filter((k)=>wdKeys[i][j].has(k));\n let h=`<h2>Word ${j+1} of āyah 36:${i+1}<\/h2><div class=\"ar\">${esc(w[0])}<\/div><p><b>${esc(w[4])}<\/b> · <span>${esc(w[5])}<\/span><\/p>`;\n h+=`<p class=\"meta\">Root-word (lemma) <span class=\"arsm\" style=\"display:inline\">${esc(w[1]||\"—\")}<\/span>, used ${w[2]} time${w[2]===1?\"\":\"s\"} in the Qur'an.<\/p>`;\n if(w[6]||w[7]) h+=`<p class=\"meta\">Dictionary: ${esc(w[6])}${w[7]?` · ${esc(w[7])}`:\"\"}<\/p>`;\n h+=`<h3>Keys on this word<\/h3>`+(ks.length?ks.map((k)=>`<div class=\"key\"><span class=\"dot\" style=\"background:${col(k)};margin-top:6px\"><\/span><div><b>${esc(KEYS[k].n)}<\/b> <span class=\"tag ${KEYS[k].src}\">${KEYS[k].src===\"you\"?\"your mark (example)\":KEYS[k].src===\"auto\"?\"found automatically\":\"suggested\"}<\/span><div class=\"meta\">${esc(KEYS[k].g)}<\/div><\/div><\/div>`).join(\"\"):`<p class=\"meta\">No key yet.<\/p>`);\n h+=`<p><button class=\"btn\" id=\"tglHard\">${wdKeys[i][j].has(\"hard\")?\"✓ Hard for me (tap to clear)\":\"Mark: Hard for me\"}<\/button> <button class=\"btn\" id=\"seeAyah\">Its āyah<\/button><\/p>`;\n return h; }\nfunction surPanel(si){ const sur=D.all[si], nm=D.names[si];\n const c=(x)=>sur.filter((r)=>r[x]).length;\n return `<h2>${esc(nm[1])} (${si+1})<\/h2><div class=\"ar\">${esc(nm[0])}<\/div><p>${sur.length} āyāt · ${sur.reduce((n,r)=>n+r[0],0)} words<\/p>\n <div class=\"key\"><span class=\"dot\" style=\"background:${col(\"hadith\")};margin-top:6px\"><\/span><div><b>${c(3)}<\/b> āyāt quoted in a hadith<\/div><\/div>\n <div class=\"key\"><span class=\"dot\" style=\"background:${col(\"gharib\")};margin-top:6px\"><\/span><div><b>${sur.reduce((n,r)=>n+r[1],0)}<\/b> words used only once in the Qur'an, in ${c(1)} āyāt<\/div><\/div>\n <div class=\"key\"><span class=\"dot\" style=\"background:${col(\"wujuh\")};margin-top:6px\"><\/span><div><b>${sur.reduce((n,r)=>n+r[2],0)}<\/b> words whose root has more than one meaning<\/div><\/div>\n ${si===35?`<p><button class=\"btn\" id=\"openYs\">Open Yā-Sīn's āyāt<\/button><\/p>`:`<p class=\"meta\">In this demo only Yā-Sīn (36) opens further. In the app every Surah would.<\/p>`}`; }\nfunction panel(){ const p=$(\"#panel\");\n p.innerHTML=pick.t===\"word\"?wordPanel(pick.i,pick.j):pick.t===\"ayah\"?ayPanel(pick.i):pick.t===\"surah\"?surPanel(pick.i):\"\";\n p.querySelectorAll(\".more\").forEach((b)=>b.onclick=()=>{ const d=b.previousElementSibling; d.textContent=d.dataset.full; b.remove(); });\n const t=$(\"#tglHard\"); if(t) t.onclick=()=>{ const set=pick.t===\"word\"?wdKeys[pick.i][pick.j]:ayKeys[pick.i]; set.has(\"hard\")?set.delete(\"hard\"):set.add(\"hard\"); draw(); panel(); };\n const sw=$(\"#seeWords\"); if(sw) sw.onclick=()=>{ ay=pick.i; setView(\"word1\"); };\n const sa=$(\"#seeAyah\"); if(sa) sa.onclick=()=>{ pick={t:\"ayah\",i:pick.i}; setView(\"ayat\"); };\n const oy=$(\"#openYs\"); if(oy) oy.onclick=()=>{ pick={t:\"ayah\",i:0}; setView(\"ayat\"); };\n}\n$(\"#svg\").addEventListener(\"click\",(e)=>{ const g=e.target.closest(\".seg\"); if(!g) return; const d=g.dataset;\n if(d.w!=null) pick={t:\"word\",i:+d.a,j:+d.w}; else if(d.s!=null&&d.a!=null){ if(+d.s===35) pick={t:\"ayah\",i:+d.a}; else pick={t:\"surah\",i:+d.s}; } else if(d.s!=null) pick={t:\"surah\",i:+d.s}; else pick={t:\"ayah\",i:+d.a};\n if(pick.t===\"ayah\"||pick.t===\"word\") ay=pick.i, $(\"#aySel\").value=ay;\n markSel(); panel(); });\nfunction setView(v){ view=v; document.querySelectorAll(\"[data-view]\").forEach((b)=>b.setAttribute(\"aria-pressed\",String(b.dataset.view===v)));\n $(\"#ayPick\").hidden=v!==\"word1\"; if(v===\"word1\"&&pick.t!==\"word\") pick={t:\"ayah\",i:ay}; if(v===\"quran\"&&pick.t!==\"surah\") pick={t:\"surah\",i:35};\n if(v!==\"quran\"&&pick.t===\"surah\") pick={t:\"ayah\",i:ay};\n keyBar(); draw(); panel(); }\ndocument.querySelectorAll(\"[data-view]\").forEach((b)=>b.onclick=()=>setView(b.dataset.view));\n$(\"#aySel\").innerHTML=YS.map((a,i)=>`<option value=\"${i}\">36:${i+1}<\/option>`).join(\"\"); $(\"#aySel\").value=ay;\n$(\"#aySel\").onchange=()=>{ ay=+$(\"#aySel\").value; pick={t:\"ayah\",i:ay}; draw(); panel(); };\nfunction keyBar(){ const lv=view===\"quran\"?[\"gharib\",\"wujuh\",\"hadith\"]:view===\"ayat\"?ORDER.filter((k)=>KEYS[k].lvl!==\"word\"):view===\"word1\"?ORDER.filter((k)=>KEYS[k].lvl!==\"ayah\"):ORDER;\n if(only!==\"all\"&&!lv.includes(only)) only=\"all\";\n $(\"#keyBar\").innerHTML=`<span class=\"lab\">Keys<\/span><button class=\"btn\" data-k=\"all\" aria-pressed=\"${only===\"all\"}\">All<\/button>`+lv.map((k)=>`<button class=\"btn chip\" data-k=\"${k}\" aria-pressed=\"${only===k}\"><span class=\"dot\" style=\"background:${col(k)}\"><\/span>${esc(KEYS[k].n)}<\/button>`).join(\"\");\n document.querySelectorAll(\"[data-k]\").forEach((b)=>b.onclick=()=>{ only=b.dataset.k; keyBar(); draw(); }); }\nsetView(\"ayat\");\n})();\n<\/script>\n<\/body><\/html>\n", "asma-screensaver": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>Asma Screensaver Demo<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Tinos&family=Noto+Naskh+Arabic:wght@700&display=swap\">\n<style>\n:root{--bg:#f7f4ec;--card:#fffdf8;--ink:#1d2a3a;--mut:#5b6675;--line:#ddd5c4;--navy:#1f3a5f;--gold:#b8892b;--accent:#f4501a}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#141a22;--card:#1c2430;--ink:#e8edf3;--mut:#a3adbb;--line:#334050;--navy:#9cc0ea}}\n:root[data-theme=\"dark\"]{--bg:#141a22;--card:#1c2430;--ink:#e8edf3;--mut:#a3adbb;--line:#334050;--navy:#9cc0ea}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}\n[hidden]{display:none!important}\n.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 40px}\nh1{font-size:1.3rem;margin:0 0 4px;color:var(--navy)}.sub{color:var(--mut);margin:0 0 12px;font-size:.93rem}\n.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:16px}\n@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}\n.card h2{font-size:1.05rem;margin:0 0 10px;color:var(--navy)}\n.row{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr);gap:8px 12px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}\n.row:first-of-type{border-top:0}\n@media (max-width:480px){.row{grid-template-columns:minmax(0,1fr)}}\n.row label.lab{font-weight:600;font-size:.92rem}\n.row .help{grid-column:1/-1;font-size:.8rem;color:var(--mut);margin-top:-4px}\n.seg{display:flex;flex-wrap:wrap;gap:6px}\n.seg button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 11px;min-height:40px;font:inherit;font-size:.9rem;cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}\n.switch{display:inline-flex;align-items:center;gap:8px;min-height:40px;cursor:pointer}\n.switch input{width:22px;height:22px}\n.names{display:flex;flex-
