      const p = well(t("pieces")); const ps = el("div", "pieces"); for (const [ar, en, bn] of h.pieces) { const s = el("span", null, ar); s.appendChild(el("b", null, lang === "bn" ? bn : en)); ps.appendChild(s); } p.appendChild(ps); b.appendChild(p); sameLink(b); },
    (b) => { rp.root(b); sameLink(b); },
    (b) => { rp.fam(b); const w = well(t("inBooks")); w.appendChild(el("span", null, x.w.replace(/^[وف]/, "") + " · " + t("booksCount", { n: num(h.books[0]), b: num(h.books[1]) }))); b.appendChild(w); },
    (b) => { const w = well(t("formOf")); w.appendChild(el("div", null, t("formN", { n: num(h.form) }))); w.appendChild(el("span", null, h.tas[lang])); w.appendChild(el("span", "draft", t("draftTag"))); b.appendChild(w);
      if (h.quranSame) { const v = DATA.lemmas[h.quranSame[0]]?.v; const nums = tasNumbers(v); if (nums) { const w2 = well(t("tasPeople")); for (const [k, n] of nums) { const row = el("div", "row"); row.append(el("span", null, k), el("span", "mut", num(n) + "×")); w2.appendChild(row); } b.appendChild(w2); } } },
    (b) => { const w = well(t("hadithMeaning")); if (h.gloss) { w.appendChild(el("div", "harw", h.gloss)); w.appendChild(el("span", "mut", lang === "bn" ? h.glossBn : h.glossEn)); } else w.appendChild(el("span", "mut", t("dictNone"))); b.appendChild(w);
      for (const L of h.dictLemma) { const d = DATA.lemmas[L]; if (!d) continue; const w2 = well((lang === "bn" ? t("dictBn") : t("dictEn")) + " · " + L); w2.appendChild(el("span", null, lang === "bn" ? (d.bn || d.en) : (d.en || d.bn))); b.appendChild(w2); }
      const w3 = well(t("grammar")); w3.appendChild(el("span", null, lang === "bn" ? h.posBn : h.posEn)); b.appendChild(w3); b.appendChild(el("p", "note", t("hwcFind"))); },
  ]);
  sh.appendChild(marksRow("hw:" + x.idx, "word"));
  sh.appendChild(relatedBox([
    ["rQuran", (b) => { if (h.quranSame) { const [, ref, ar, en, bn] = h.quranSame; const it = el("div", "item"); it.appendChild(el("span", "ref", ref)); it.appendChild(el("div", "ar", ar)); it.appendChild(el("span", null, lang === "bn" ? bn : en)); b.appendChild(it); } b.appendChild(ayahItem({ ...DATA.ayahs[37], ref: "36:38", sname: "Yaseen" }, () => { closeSheet(); openAyah(38); })); }],
    ["rHadith", (b) => hadithList(b, 38)],
    ["rDict", (b) => { for (const [w, m] of HADITH.words_meanings) { const it = el("div", "item"); it.appendChild(el("div", "har", w + " : " + m)); b.appendChild(it); } }],
    ["rSch", (b) => scholarItems(b, HADITH_SCHOLARS, null)],
    ["rTaf", (b) => tafsirItems(b, t("tafHNote"))],
  ]));
}

// ---------- the teacher's view ----------
function renderTeacher(host) {
  host.appendChild(el("h2", null, t("teacherH"))); host.appendChild(el("p", "note", t("teacherLede")));
  const wrap = el("div", "tbl"); const tb = el("table"); const thead = el("thead"); const hr = el("tr");
  for (const k of ["thStudent", "thAyat", "thWords", "thHadith", "thShow"]) hr.appendChild(el("th", null, t(k)));
  thead.appendChild(hr); tb.appendChild(thead); const body = el("tbody");
  for (const id of Object.keys(people).filter((p) => p !== "you")) {
    const tr = el("tr"); tr.appendChild(el("td", null, people[id].name()));
    const cell = (pred) => { const td = el("td"); let d = 0, p = 0; for (const [k, v] of people[id].marks) if (pred(k)) { if (v.includes("d")) d++; if (v.includes("p")) p++; } td.append(Object.assign(el("span", "chipd", t("mDiff") + " " + num(d))), Object.assign(el("span", "chipp", t("mPrac") + " " + num(p)))); return td; };
    tr.append(cell((k) => k.startsWith("a:")), cell((k) => k.startsWith("w:") || k.startsWith("hw:")), cell((k) => k.startsWith("h:")));
    const td = el("td"); const b = btn("go", t("show"), () => { viewing = id; renderAll(); }); if (viewing === id) b.setAttribute("aria-pressed", "true"); td.appendChild(b); tr.appendChild(td); body.appendChild(tr);
  }
  tb.appendChild(body); wrap.appendChild(tb); host.appendChild(wrap);
  // what most students marked
  const count = new Map();
  for (const id of Object.keys(people).filter((p) => p !== "you")) for (const [k, v] of people[id].marks) if (v.includes("d")) count.set(k, (count.get(k) || 0) + 1);
  const top = [...count.entries()].filter(([, n]) => n > 1).sort((a, b) => b[1] - a[1]);
  host.appendChild(el("h3", null, t("mostMarked")));
  for (const [k, n] of top) {
    const it = el("div", "item"); let label = k, go = null;
    if (k.startsWith("a:")) { const an = +k.slice(2); label = "36:" + num(an); go = () => openAyah(an); }
    else if (k.startsWith("w:")) { const [, an, p] = k.split(":"); label = `36:${num(an)}:${num(p)} · ` + DATA.ayahs[an - 1].w[p - 1][0]; go = () => openQuranWord(+an, +p, "ayah"); }
    else if (k.startsWith("hw:")) { const x = HT_WORDS[+k.slice(3)]; label = (lang === "bn" ? "বুখারী ৩১৯৯ · " : "Bukhārī 3199 · ") + x.w; go = () => openHadithWord(x); }
    else if (k.startsWith("h:")) { label = lang === "bn" ? "বুখারী ৩১৯৯" : "Bukhārī 3199"; go = () => showCard("hadith"); }
    it.appendChild(el("span", "ref", label)); if (k.startsWith("a:")) it.appendChild(el("div", "ar", DATA.ayahs[+k.slice(2) - 1].w.slice(0, 4).map((w) => w[0]).join(" ") + " …")); it.appendChild(el("span", "chipd", t("mDiff") + " · " + num(n))); if (go) it.appendChild(btn("go", t("open"), go)); host.appendChild(it);
  }
  host.appendChild(el("p", "note", t("rulesNote")));
}
function renderQs(host) {
  host.appendChild(el("h2", null, t("qsH"))); host.appendChild(el("p", "note", t("qsLede")));
  const ol = el("ol"); const box = el("div", "qs"); box.appendChild(ol);
  for (const q of ["q1", "q2", "q3", "q4", "q5"]) {
    const li = el("li"); li.appendChild(el("b", null, t(q)));
    for (const o of ["a", "b"]) { const lab = el("label"); const cb = el("input"); cb.type = "checkbox"; cb.id = q + o; lab.append(cb, el("span", null, t(q + o))); li.appendChild(lab); }
    ol.appendChild(li);
  }
  host.appendChild(box);
}

// ---------- page ----------
function showCard(c) { card = c; closeSheet(); renderAll(); document.getElementById("cardHost").scrollIntoView({ block: "nearest", behavior: "smooth" }); }
function renderAll() {
  document.documentElement.lang = lang;
  for (const e of document.querySelectorAll("[data-t]")) e.textContent = t(e.dataset.t);
  document.getElementById("langEn").setAttribute("aria-pressed", String(lang === "en")); document.getElementById("langBn").setAttribute("aria-pressed", String(lang === "bn"));
  document.getElementById("roleStudent").setAttribute("aria-pressed", String(role === "student")); document.getElementById("roleTeacher").setAttribute("aria-pressed", String(role === "teacher"));
  const sel = document.getElementById("viewSel"); sel.replaceChildren(); for (const v of VIEWS) { const o = el("option", null, t(v)); o.value = v; if (v === view) o.selected = true; sel.appendChild(o); }
  for (const b of document.querySelectorAll("#cardTabs .pill")) { b.setAttribute("aria-pressed", String(b.dataset.card === card)); b.hidden = b.dataset.card === "teacher" && role !== "teacher"; }
  renderWheel();
  const host = document.getElementById("cardHost"); host.replaceChildren();
  if (card === "ayah") renderAyahCard(host); else if (card === "hadith") renderHadithCard(host); else if (card === "teacher") renderTeacher(host); else renderQs(host);
}
document.getElementById("langEn").addEventListener("click", () => { lang = "en"; renderAll(); });
document.getElementById("langBn").addEventListener("click", () => { lang = "bn"; renderAll(); });
document.getElementById("roleStudent").addEventListener("click", () => { role = "student"; viewing = "you"; if (card === "teacher") card = "ayah"; renderAll(); });
document.getElementById("roleTeacher").addEventListener("click", () => { role = "teacher"; viewing = "aminah"; card = "teacher"; renderAll(); });
document.getElementById("viewSel").addEventListener("change", (e) => { view = e.target.value; renderWheel(); });
for (const b of document.querySelectorAll("#cardTabs .pill")) b.addEventListener("click", () => showCard(b.dataset.card));
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", renderWheel);
renderAll();
</script>
