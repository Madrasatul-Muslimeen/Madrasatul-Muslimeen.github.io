<title>Dua Module Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;600&family=Source+Sans+3:wght@400;600;700&family=Tinos:wght@400;700&display=swap">
<style>
/* Layout: the app's Night page with a sticky menu bar of the seven Dua groups; a Dua opens as a full-screen
   Dua Card drawn like the Asma ul Husna poster (cream paper, green arch at the top, the template's own banner
   at the bottom). One deliberate look for the app (Night) and one for the card (the poster's paper). */
:root{
  --bg:#0d1830; --panel:#14223f; --panel2:#1a2b4f; --line:#2c3f66; --fg:#e8ecf5; --muted:#a9b4cc;
  --gold:#d9a94a; --gold-ink:#1a1405; --gold-soft:rgba(217,169,74,.14);
  --paper:#fbf6ea; --ink:#22201a; --ink-muted:#6b5f45; --green:#123f2c; --green2:#1d5a3f; --orange:#e2662b;
  --m-today:#2e9d5b; --m-next:#2f6fd0; --m-urgent:#d23b3b; --m-important:#c99212; --m-revise:#8a4fc7; --m-done:#1f8f8f;
  --ar:'Amiri Quran','Amiri','Traditional Arabic',serif; --ar2:'Amiri','Traditional Arabic',serif;
  --ui:'Source Sans 3','Segoe UI',system-ui,sans-serif; --bnf:'Hind Siliguri','Source Sans 3',sans-serif; --serif:'Tinos','Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden],.sheet[hidden],.saver[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.5}
body.bn{font-family:var(--bnf)}
.wrap>*,.sheet-in>*{min-width:0}
.wrap{max-width:960px;margin:0 auto;padding-block:14px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:1.4rem;margin:0;text-wrap:balance}
h2{font-size:1.12rem;margin:0;text-wrap:balance}
h3{font-size:1rem;margin:0}
p{margin:0}
.lead{color:var(--muted);max-width:70ch}
.ownwin{display:inline-flex;align-items:center;text-decoration:none;font-weight:700}
.ver{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums;vertical-align:middle}
.toprow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;color:var(--fg);border:0;padding:8px 14px;font:inherit;cursor:pointer;min-height:40px}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);font-weight:700}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* the menu bar */
.menubar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.menubar nav{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.pd{display:grid;text-align:start;min-height:48px;border:1px solid var(--gold)!important;background:var(--panel)!important;color:var(--fg);border-radius:12px;padding:4px 14px;cursor:pointer;max-width:100%}
.pd small{color:var(--muted);font-size:.74rem;font-weight:400}
.pd b{white-space:normal;line-height:1.25}
.pull{position:absolute;top:calc(100% + 6px);z-index:8;width:min(92vw,380px);max-height:70vh;overflow:auto;background:var(--panel2);border:1px solid var(--gold);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:grid;gap:2px}
.pitem{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:42px;width:100%;text-align:start;background:transparent;border:0;border-radius:8px;color:var(--fg);padding:6px 10px;cursor:pointer;font-weight:600}
.pitem:hover,.pitem:focus-visible{background:var(--panel)}
.pitem[aria-current=true]{background:var(--gold);color:var(--gold-ink)}
.pitem .c{color:inherit;opacity:.75;font-weight:400;font-variant-numeric:tabular-nums}
.pitem.small{font-weight:400;font-size:.92rem;min-height:38px}
.psub{display:grid;gap:2px;padding-inline-start:14px;border-inline-start:2px solid var(--line);margin:0 0 4px 10px}
.pop{position:fixed;inset:0;z-index:30;background:rgba(4,8,18,.6);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.popcard{width:min(100%,560px);max-height:86vh;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--green);box-shadow:inset 0 0 0 2px var(--orange);border-radius:14px;padding:12px 14px;display:grid;gap:10px;font-family:var(--serif)}
.pophead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pophead h3{color:var(--green);font-size:1.1rem}
.pophead .btn{color:var(--green);border-color:var(--green2);background:#fff;font-family:var(--ui)}
.cardmenu{background:#f2ead3;border:1.5px solid var(--green2);border-radius:12px;padding:8px}
.menubar .old{flex:0 0 auto;min-height:42px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-weight:600}
.menubar button[aria-current=true]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.menubar button .c{opacity:.75;font-weight:400;margin-inline-start:6px;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.crumb{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:10px;border:1px solid var(--gold);color:var(--gold);background:transparent;cursor:pointer;font-weight:600}
.where{color:var(--muted);font-size:.9rem}
.sec{display:grid;gap:10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head small{color:var(--muted)}
.btn{min-height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);padding:6px 14px;cursor:pointer}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.solid{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.btn[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.note{color:var(--muted);font-size:.9rem;border-inline-start:3px solid var(--gold);padding-inline-start:10px;max-width:74ch}
.gap{color:var(--muted);font-size:.88rem;font-style:italic}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px}
.tile{display:flex;gap:10px;align-items:center;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);cursor:pointer;min-height:56px}
.tile .ic{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);font-size:1.05rem}
.tile b{display:block;font-weight:600;line-height:1.25}
.tile span{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.tile .arb{font-family:var(--ar2);font-size:1rem;direction:rtl}
/* numbered rows */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 8px}
.row .no{min-width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.row .open{all:unset;cursor:pointer;display:grid;gap:2px;min-width:0}
.row .open:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.row .t{font-weight:600;line-height:1.3}
.row .a{font-family:var(--ar);font-size:1.22rem;direction:rtl;text-align:right;line-height:1.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.row .m{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.row .side{display:flex;gap:6px;align-items:center}
.mk{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:700;color:#fff;white-space:nowrap}
.icon{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font-size:1.05rem;display:grid;place-items:center}
.icon[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.manage{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0 0 46px}
.manage .btn{min-height:36px;padding:4px 10px;font-size:.86rem}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:16px;display:grid;gap:8px}
form.add{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
form.add label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
form.add input,form.add textarea,form.add select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
form.add textarea{font-family:var(--ar);font-size:1.2rem;direction:rtl;min-height:70px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;min-height:36px}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem;color:var(--muted)}
/* overlay sheets */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(4,8,18,.78);overflow:auto;padding-block:max(12px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:820px;margin:0 auto;display:grid;gap:10px}
.sheetbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:rgba(4,8,18,.92);padding:6px 0;border-radius:10px}
.sheetbar .sp{flex:1}
/* the Dua Card: the Asma ul Husna poster's paper */
.card{background:var(--paper);color:var(--ink);border-radius:14px;border:10px solid var(--green);box-shadow:inset 0 0 0 2px var(--orange);padding:0 0 10px;overflow:hidden;font-family:var(--serif)}
.arch{position:relative;margin:0 auto;width:min(92%,560px);background:var(--green);color:#f6e7b6;text-align:center;padding:12px 16px 14px;border-radius:0 0 50% 50% / 0 0 26px 26px;box-shadow:0 0 0 2px var(--gold) inset}
.arch::before{content:"";position:absolute;inset:-10px 18% auto;height:24px;background:var(--green);border-radius:50% 50% 0 0;box-shadow:0 -2px 0 2px var(--gold)}
.arch .ph{position:relative;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85;border:1px dashed rgba(246,231,182,.6);border-radius:8px;padding:6px 10px}
.arch .ph b{display:block;font-family:var(--ar2);font-size:1.3rem;letter-spacing:0;text-transform:none;opacity:1}
.cardin{padding:12px 16px;display:grid;gap:12px}
.ctitle{text-align:center;display:grid;gap:2px}
.ctitle h2{font-family:var(--serif);font-size:1.35rem;color:var(--green)}
body.bn .ctitle h2{font-family:var(--bnf)}
.ctitle span{color:var(--orange);font-size:.95rem}
.ctitle small{color:var(--ink-muted);font-family:var(--ui);font-variant-numeric:tabular-nums}
.duaar{border:2px solid var(--orange);border-radius:14px;padding:12px 14px;direction:rtl;text-align:center;font-family:var(--ar);font-size:1.75rem;line-height:2.25;color:#0f3a28;background:#fffdf6}
.w{cursor:pointer;border-radius:6px;padding:0 3px;border-bottom:2px dotted #c9a24d}
.w.d{border-bottom-color:#8aa39a}
.w.n{border-bottom:0;cursor:default}
.w.sel{background:rgba(226,102,43,.22)}
.w.now{background:rgba(46,157,91,.32)}
.w:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wlegend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-family:var(--ui);font-size:.8rem;color:var(--ink-muted)}
.wlegend i{display:inline-block;width:22px;border-bottom:2px dotted #c9a24d;margin-inline-end:6px;vertical-align:middle}
.wlegend i.d{border-color:#8aa39a}
.mean{font-size:1.05rem;line-height:1.55;max-width:70ch;margin:0 auto}
body.bn .mean{font-family:var(--bnf)}
.mean small{display:block;color:var(--ink-muted);font-family:var(--ui);font-size:.82rem;margin-top:4px}
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;font-family:var(--ui)}
.refbox{border:1.5px solid var(--orange);border-radius:12px;padding:6px 10px 8px;text-align:center}
.refbox b{display:inline-block;background:var(--green);color:#fff;border-radius:999px;padding:1px 10px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.refbox div{color:var(--ink)}
.cbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-family:var(--ui)}
.cbtn{min-height:40px;border-radius:10px;border:1.5px solid var(--green2);background:#fff;color:var(--green);padding:6px 12px;cursor:pointer;font-weight:600}
.cbtn[aria-pressed=true]{background:var(--green);color:#fff}
.plan{display:grid;gap:6px;font-family:var(--ui)}
.plan h3{color:var(--green);text-align:center}
.planrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pbtn{min-height:38px;border-radius:999px;border:2px solid var(--c);background:#fff;color:var(--c);padding:4px 12px;cursor:pointer;font-weight:700;font-size:.88rem}
.pbtn[aria-pressed=true]{background:var(--c);color:#fff}
.stages{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-family:var(--ui)}
.stages button{min-height:38px;border:1.5px solid var(--green2);border-radius:10px;background:#fff;color:var(--green);cursor:pointer;padding:4px 10px;font-size:.88rem}
.stages button[aria-pressed=true]{background:var(--green);color:#fff;font-weight:700}
.bottombanner{display:block;width:calc(100% - 24px);margin:2px auto 0;border-radius:8px}
/* audio */
.audio{font-family:var(--ui);background:#f2ead3;border:1.5px solid var(--green2);border-radius:12px;padding:10px;display:grid;gap:8px}
.arow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.abtn{min-width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--green2);background:#fff;color:var(--green);cursor:pointer;font-size:1.05rem;font-weight:700;padding:0 10px}
.abtn[aria-pressed=true]{background:var(--green);color:#fff}
.abtn.play{min-width:64px;background:var(--green);color:#fff;font-size:1.3rem}
.track{flex:1 1 180px;height:8px;border-radius:999px;background:#d8cfb4;overflow:hidden;min-width:120px}
.track i{display:block;height:100%;width:0;background:var(--orange)}
.alabel{font-size:.82rem;color:var(--ink-muted);text-align:center}
/* panels inside sheets */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.wc-from{display:flex;align-items:center;gap:10px;background:var(--gold);color:var(--gold-ink);padding:8px 12px;border-radius:10px;font-weight:700}
.wc-from span{flex:1;min-width:0}
.wc-from button{background:var(--gold-ink);color:var(--gold);border:0;border-radius:8px;min-height:36px;padding:4px 12px;cursor:pointer}
.wc-ar{font-family:var(--ar);font-size:2.3rem;color:#f0c97a;text-align:center;line-height:1.6}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cell{background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 10px}
.cell small{display:block;color:var(--ink-muted);font-size:.76rem}
.cell .v{font-weight:600}
.cell .v.ar{font-family:var(--ar);font-size:1.45rem;direction:rtl}
/* poster */
.posterwrap{display:grid;gap:10px;justify-items:center}
.a4{width:min(100%,560px);aspect-ratio:210/297;background:var(--paper);color:var(--ink);border:12px solid var(--green);box-shadow:inset 0 0 0 2px var(--orange);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;font-family:var(--serif);container-type:inline-size}
.a4 .arch{width:80%;padding:2.2cqw 3cqw}
.a4 .arch .ph{font-size:2.2cqw}
.a4 .arch .ph b{font-size:3.6cqw}
.a4 .pt{text-align:center;margin-top:3cqw}
.a4 .pt h2{font-size:4.6cqw;color:var(--green)}
.a4 .pt span{font-size:3cqw;color:var(--orange)}
.a4 .par{margin:2.4cqw 5cqw 0;border:.4cqw solid var(--orange);border-radius:3cqw;padding:2cqw 3cqw;font-family:var(--ar);direction:rtl;text-align:center;font-size:var(--arfs,4.6cqw);line-height:1.95;color:#0f3a28;background:#fffdf6}
.a4 .ptx{margin:2cqw 6cqw 0;font-size:var(--txfs,2.9cqw);line-height:1.4;text-align:justify}
.a4 .ptx.bn{font-family:var(--bnf)}
.a4 .pwbw{font-size:1.7cqw;margin:2cqw 5cqw 0;display:flex;flex-wrap:wrap;gap:1cqw;direction:rtl;justify-content:center}
.a4 .pwbw span{display:grid;text-align:center;border:.25cqw solid #e0c9a5;border-radius:1.4cqw;padding:.6cqw 1cqw;min-width:9cqw}
.a4 .pwbw b{font-family:var(--ar);font-size:1.9em;font-weight:400;color:#0f3a28}
.a4 .pwbw small{font-size:1em;direction:ltr;color:var(--ink-muted)}
.a4 .pref{margin:auto 6cqw 0;flex:0 0 auto;text-align:center;font-size:2.2cqw;color:var(--ink-muted);font-family:var(--ui)}
.a4 img{flex:0 0 auto;width:94%;margin:1.5cqw auto 1.5cqw;display:block}
/* share */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;min-height:38px;background:var(--panel2)}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;max-height:220px;overflow:auto;font-size:.92rem}
.logtbl{width:100%;border-collapse:collapse;font-size:.88rem}
.logtbl th,.logtbl td{border-bottom:1px solid var(--line);padding:6px;text-align:start;vertical-align:top}
.tblwrap{overflow-x:auto}
/* screensaver */
.saver{position:fixed;inset:0;z-index:40;background:#050a14;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.saver .a4{width:min(92vw,62vh)}
.saver .close{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.ahph{display:grid;place-items:center;text-align:center;gap:2cqw;padding:6cqw;flex:1;font-size:3cqw;color:var(--green)}
.ahph b{font-family:var(--ar2);font-size:9cqw;color:var(--green)}
/* plan box */
.planbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.planbox ol{margin:0;padding-inline-start:0;list-style:none;display:grid;gap:6px}
.planbox li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--panel2);border-radius:10px;padding:8px 10px}
.planbox li b.id{color:var(--gold);font-variant-numeric:tabular-nums;min-width:40px}
.planbox li .wh{font-size:.8rem;color:var(--muted)}
.tag{font-size:.74rem;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.tag.demo{border-color:var(--ok,#5fbf8f);color:#7fd8a8}
.tag.gate{border-color:#e27b5b;color:#f0a58c}
.tag.tarch{border-color:#7aa2e8;color:#a9c3f2}
@media (max-width:520px){ .duaar{font-size:1.45rem} .row .a{font-size:1.1rem} .manage{padding-inline-start:0} }
@media (prefers-reduced-motion:reduce){ .track i{transition:none} }
</style>
<div class="wrap">
  <header class="sec">

যিনের আযান শুনে বলবে:\nأَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، رَضِيتُ بِاللهِ رَبًّا وَبِمُحَمَّدٍ رَسُولًا، وَبِالْإِسْلَامِ دِينًا\nঅর্থ: আমি সাক্ষ্য দিচ্ছি যে, আল্লাহ ছাড়া কোন মাবূদ নেই, তিনি একক, তাঁর কোন শরীক নেই এবং মুহাম্মাদ তাঁর বান্দা ও রাসুল। আমি সন্তুষ্ট আল্লাহকে রব হিসেবে পেয়ে এবং মুহাম্মাদ সাল্লাল্লাহু ‘আলাইহি ওয়াসাল্লামকে রাসূল হিসেবে পেয়ে এবং ইসলামকে দ্বীন হিসেবে পেয়ে।”\nতার গুনাহ মাফ করে দেয়া হয়।", "enAttr": "Narrated by Muslim", "bnAttr": "ইমাম মুসলিম এটি বর্ণনা করেছেন"}}, {"ar": "يُصَلِّي عَلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بَعْدَ فَرَاغِهِ مِنَ إِجَابَةِ المُؤَذِّنِ", "count": 1, "ref": "مسلم 1/ 288", "card": null, "mean": {"id": "10982", "en": "Abu Bakr entered upon the Messenger of Allah (may Allah’s peace and blessings be upon him) after his death. He put his mouth between his eyes, put his hands on his temples, and said: O my Prophet, O my ‎close friend, O my bosom friend", "bn": null, "enAttr": "Narrated by Ahmad", "bnAttr": null}}, {"ar": "اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ القَائِمَةِ، آتِ مُحَمَّدًا الوَسِيلَةَ وَالفَضِيلَةَ، وَأبْعَثْهُ مَقَامًا مَحْمُودًا الذِي وَعَدْتَهُ، [إِنَّكَ لَا تُخْلِفُ المِيعَادَ]", "count": 1, "ref": "البخاري 1/ 152 وما بين المعكوفين للبيهقي 1/ 410 وحسن إسناده العلامة عبد العزيز بن باز في تحفة الأخيار ص 38", "card": {"n": 105, "places": 4}, "mean": {"id": "10635", "en": "Whoever says upon hearing the call: O Allah, Lord of this perfect call and the prayer that is to be established, grant Muhammad Al-Wasīlah and Al-Fadīlah and resurrect him to the Praiseworthy Station that You have promised him, he will be granted my intercession on the Day of Judgment", "bn": "“যে ব্যক্তি আযান শুনে এই দু‘আ বলবে, اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلاَةِ القَائِمَةِ، آتِ مُحَمَّدًا الوَسِيلَةَ وَالفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ (হে আল্লাহ এই পূর্ণাঙ্গ আহবান ও প্রতিষ্ঠিত স ْضَ حَنِيفًا وَمَا أَنَا مِنَ المُشْرِكِينَ، إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ العَالَمِينْ، لَا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ المُسْلِمِينَ، اللَّهُمَّ أَنْتَ المَلِكُ لَا إِلَهَ إِلَّا أَنْتَ، أَنْتَ رَبِّي وَأَنَا عَبْدُكَ، ظَلَمْتُ نَفْسِي، وَاعْتَرَفْتُ بِذَنْبِي، فَاغْفِرْ لِي ذُنُوبِي جَمِيعًا، إِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، وَاهْدِنِي لِأَحْسَنِ الأَخْلَاقِ، لَا يَهْدِي لِأَحْسَنِهَا إِلَّا أَنْتَ، وَاصْرِفْ عَنِّي سَيِّئَهَا، لَا يَصْرِفُ عَنِّي سَيِّئَهَا إِلَّا أَنْتَ، لَبَّيْكَ وَسَعْدَيْكَ، وَالخَيْرُ كُلُّهُ بِيَدَيْكَ، وَالشَّرُّ لَيْسَ إِلَيْكَ، أَنَا بِكَ وَإِلَيْكَ، تَبَارَكْتَ وَتَعَالَيْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ", "count": 1, "ref": "رواه مسلم 1/ 534", "card": null, "mean": null}, {"ar": "اللَّهُمَّ رَبَّ جِبْرَائِيلَ وَمِيكَائِيلَ وَإِسْرَافِيلَ، فَاطِرَ السَّمَوَاتِ وَالأَرْضِ، عَالِمَ الغَيْبِ وَالشَّهَادَةِ، أَنْتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ. اهْدِنِي لِمَا اخْتُلِفَ فِيهِ مِنَ الحَّقِّ بِإِذْنِكَ إِنَّكَ تَهْدِي مَنْ تَشَاءُ إِلَى صِرَاطٍ مُسْتَقِيمٍ", "count": 1, "ref": "رواه مسلم 1/ 534", "card": {"n": 857, "places": 1}, "mean": {"id": "8311", "en": "O Allah, Lord of Jibrīl, Mikha'īl, and Israfil, Originator of the heavens and the earth, Knower of the unseen and the seen, You judge between Your slaves concerning that in which they used to differ. Guide me, by Your permission, to the truth about which people differ. Verily, You guide whom You will to the straight path", "bn": "হে আল্লাহ! জিবরীল, মীকাঈল ও ইসরাফীলের রব, আসমান ও যমীনের স্রষ্টা, গায়েব ও প্রকাশ্য সবকিছু জান্তা, আপনার বান্দাগণ যেসব বিষয়ে মতভেদে লিপ্ত আপনিই তার মীমাংসা করে দিবেন। যেসব বিষয়ে মতভেদ হয়েছে তন্মধ্যে আপনি আপনার অনুমতিক্রমে আমাকে যা সত্য সেদিকে পরিচালিত করুন। নিশ্চয় আপনি যাকে ইচ্ছা সরল পথ প্রদর্শন করেন।”", "enAttr": "Narrated by Muslim", "bnAttr": "এটি মুসলিম বর্ণনা করেছেন।"}}, {"ar": "اللَّهُ أَكْبَرُ كَبِيرًا، اللَّهُ أَكْبَرُ كَبِيرًا، اللَّهُ أَكْبَرُ كَبِيرًا، وَالحَمْدُ لِلَّهِ كَثِيرًا، وَالحَمْدُ لِلَّهِ كَثِيرًا، وَالحَمْدُ لِلَّهِ كَثِيرًا، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلًا (ثَلَاثًا). أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ: مِنْ نَفْخِهِ، وَنَفْثِهِ، وَ هَمْزِهِ", "count": 1, "ref": "أخرجه أبو داود 1/ 203 وابن ماجه 1/ 265 وأحمد 4/ 85 وأخرجه مسلم عن ابن عمر رضي الله عنهما بنحوه وفيه قصة 1/ 420", "card": null, "mean": null}, {"ar": "اللَّهُمَّ لَكَ الحَمْدُ أَنْتَ نُورُ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الحَمْدُ أَنْتَ قَيِّمُ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الحَمْدُ أَنْتَ رَبُّ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الحَمْدُ لَكَ مُلْكُ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الحَمْدُ أَنْتَ مَلِكُ السَّمَوَاتِ وَالأَرْضِ، وَلَكَ الحَمْدُ أَنْتَ الحَقُّ، وَوَعْدُكَ الحَقُّ، وَقَوْلُكَ الحَقُّ، وَلِقَاؤُكَ الحَقُّ، وَالجَنَّةُ حَقٌّ، وَالنَّارُ حَقٌّ، وَالنَّبِيُّونَ حَقٌّ، وَمُحَمَّدٌ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ حَقٌّ وَالسَّاعَةُ حَقٌّ اللَّهُمَّ لَكَ أَسْلَمْتُ، وَعَلَيْكَ تَوَكَّلْتُ، وَبِكَ آمَنْتُ، وَإِلَيْكَ أَنَبْتُ، وَبِكَ خَاصَمْتُ، وَإِلَيْكَ حَاكَمْتُ، فَاغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ، وَمَا أَعْلَنْتُ أَنْتَ المُقَدِّمُ، وَأَنْتَ المُؤَخِّرُ لَا إِلَهَ إِلَّا أَنْتَ، أَنْتَ إِلَهِي لَا إِلَهَ إِلَّا أَنْتَ", "count": 1, "ref": "البخاري مع الفتح 3/ 3 و 11/ 116 و 13/ 371، 423، 465 ومسلم مختصرًا بنحوه 1/ 532", "card": {"n": 22, "places": 7}, "mean": null}]}, {"i": 17, "title": "دُعَاءُ الرُّكُوعِ", "items": [{"ar": "سُبْحَانَ رَبِّيَ العَظِيمِ", "count": 3, "ref": "أخرجه أهل السنن وأحمد وانظر صحيح التّرمذي 1/ 83", "card": {"n": 1673, "places": 1}, "mean": null}, {"ar": "سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي", "count": 1, "ref": "البخاري 1/ 199 ومسلم 1/ 350", "card": {"n": 156, "places": 3}, "mean": {"id": "5212", "en": "The Prophet (may Allah's peace and blessings be upon him) did not offer a prayer after the revelation of {When there comes Allah’s help and the conquest} [Surat an-Na {"n": 545, "places": 2}, "mean": {"id": "8281", "en": "I stood in prayer one night with the Messenger of Allah (may Allah’s peace and blessings be upon him). He stood up and recited Sūrat al-Baqarah. Whenever he came across a verse mentioning mercy, he stopped and asked (Allah for mercy); and whenever he came across a verse mentioning punishment, he stopped and sought refuge (with Allah from it)", "bn": "এক রাতে আমি রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লামের সাথে সালাতে দাঁড়ালাম। তিনি দাঁড়িয়ে সূরা বাকারাহ তিলাওয়াত করলেন। যখনই কোনো রহমতের আয়াত অতিক্রম করতেন, তিনি থামতেন এবং রহমত কামনা করতেন। আর যখনই কোনো শাস্তির আয়াত অতিক্রম করতেন, তিনি থামতেন এবং আশ্রয় চাইতেন।", "enAttr": "An-Nasaa’i - Narrated by Abu Daoud - Narrated by Ahmad", "bnAttr": "এটি নাসাঈ বর্ণনা করেছেন। - এটি আবূ দাঊদ বর্ণনা করেছেন। - এটি আহমাদ বর্ণনা করেছেন।"}}]}, {"i": 18, "title": "دُعَاءُ الرَّفْعِ مِنَ الرُّكُوعِ", "items": [{"ar": "سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ", "count": 1, "ref": "البخاري مع الفتح 2/ 282", "card": {"n": 1060, "places": 1}, "mean": null}, {"ar": "رَبَّنَا وَلَكَ الحَمْدُ، حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ", "count": 1, "ref": "البخاري مع الفتح 2/ 284", "card": {"n": 68, "places": 5}, "mean": {"id": "4828", "en": "Whenever the Prophet (may Allah's peace and blessings be upon him) finished eating, he would say: Allah be praised with an abundant, sincere, and blessed praise. O our Lord, You are not in need of anyone, and we cannot do without Your favor nor dispense with it", "bn": "নবী সাল্লাল্লাহ আলাইহি ওয়াসাল্লাম যখন দস্তরখানা গুটাতেন, তখন এই দো‘আ পড়তেন: আল্লাহর জন্য অগণিত পবিত্র ও বরকতপূর্ণ প্রশংসা। এ প্রশংসাই যথেষ্ট নয় এবং এটাই শেষ নয়। হে আমাদের রব! তার থেকে আমরা অমুখাপেক্ষী নয়।", "enAttr": "Narrated by Bukhari", "bnAttr": "এটি বুখারী বর্ণনা করেছেন।"}}, {"ar": "مِلْءَ السَّمَوَاتِ وَمِلْءَ الأَرْضِ وَمَا بَيْنَهُمَا، وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ. أَهْلَ الثَّنَاءِ وَالمَجْدِ، أَحَقُّ مَا قَالَ العَبْدُ، وَكُلُّنَا لَكَ عَبْدٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَع  Most Glorious, the Most Holy, and the Lord of the angels and of the Spirit", "bn": "অতি পবিত্র, মহা পবিত্র ফেরেশতামন্ডলী ও জিবরীল -এর রব।", "enAttr": "Narrated by Muslim", "bnAttr": "এটি মুসলিম বর্ণনা করেছেন।"}}, {"ar": "اللَّهُمَّ لَكَ سَجَدْتُ وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، سَجَدَ وَجْهِيَ لِلَّذِي خَلَقَهُ، وَصَوَّرَهُ، وَشَقَّ سَمْعَهُ، وَبَصَرَهُ، تَبَارَكَ اللَّهُ أَحْسَنُ الخَالِقِينَ", "count": 1, "ref": "مسلم 1/ 534 وغيره", "card": null, "mean": {"id": "8280", "en": "O Allah, forgive my past and future sins, my hidden and apparent sins, my transgression, and the sins that You know of more than I do. You are the One who puts forward and the One who holds back. There is no god but You", "bn": "হে আল্লাহ! ক্ষমা করে দিন আমার গুনাহসমূহ- যা পূর্বে করেছি, যা পরে করেছি, যা আমি গোপনে করেছি, যা প্রকাশ্যে করেছি, যা সীমালঙ্ঘন করে করেছি, আর যা আপনি আমার চেয়ে বেশি জানেন। আপনিই অগ্রগামী করেন এবং আপনিই পিছিয়ে দেন, আপনি ব্যতীত কোনো সত্য ইলাহ নেই।", "enAttr": "Narrated by Muslim", "bnAttr": "এটি মুসলিম বর্ণনা করেছেন।"}}, {"ar": "سُبْحَانَ ذِي الجَبَرُوتِ وَالمَلَكُوتِ، وَالكِبْرِيَاءِ وَالعَظَمَةِ", "count": 1, "ref": "أبو داود 1/ 230 وأحمد، والنسائي، وإسناده حسن", "card": {"n": 545, "places": 2}, "mean": {"id": "8281", "en": "I stood in prayer one night with the Messenger of Allah (may Allah’s peace and blessings be upon him). He stood up and recited Sūrat al-Baqarah. Whenever he came across a verse mentioning mercy, he stopped and asked (Allah for mercy); and whenever he came across a verse mentioning punishment, he stopped and sought refuge (with Allah from it)", "bn": "এক রাতে আমি রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লামের সাথে সালাতে দাঁড়ালাম। তিনি দাঁড়িয়ে সূরা বাকারাহ তিলাওয়াত করলেন। যখনই কোনো রহমতের আয়াত অতিক্রম করতেন, তিনি থামতেন এবং রহমত কামনা করতেন। আর যখনই কোনো শাস্তির আয়াত অতিক্রম করতেন, তিনি থামতেন এবং আশ্রয় চাইতেন।", "enAttr": "An-Nasaa’i - Narrated by Abu Daoud - Narrated by Ahmad", "bnAttr": "এটি নাসাঈ বর্ণনা করেছেন। - এটি আবূ দাঊদ বর্ণনা করেছেন। - এটি : null}]}, {"i": 56, "title": "الدُّعَاءُ لِلْمَيِّتِ فِي الصَّلَاةِ عَلَيْهِ", "items": [{"ar": "اللَّهُمَّ اِغْفِرْ لَهُ وَاِرْحَمْهُ، وَعَافِهِ، وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالمَاءِ وَالثَّلْجِ وَالبَرَدِ، وَنَقِّهِ مِنْ الخَطَايَا كَمَا نَقَّيْتَ الثَّوْبُ الأَبْيَضُ مِنَ الدَّنَسِ، وَأَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ، وَأَهْلًا خَيْرًا مِنْ أَهْلِهِ، وَزَوْجًا خَيْرًا مِنْ زَوْجِهِ، وَأَدْخِلْهُ الجَنَّةَ، وَأَعِذْهُ مِنْ عَذَابِ القَبْرِ [وَعَذَابِ النَّارِ]", "count": 1, "ref": "مسلم 2/ 663", "card": {"n": 433, "places": 2}, "mean": null}, {"ar": "اللَّهُمَّ اِغْفِرْ لِحَيِّنَا، وَمَيِّتِنَا، وَشَاهِدِنَا، وَغَائِبِنَا، وَصَغِيرِنَا وَكَبِيرِنَا، وَذَكَرِنَا وَأُنْثَانَا. اللَّهُمَّ مَنْ أَحْيَيْتَهُ مِنَّا فَأَحْيِهِ عَلَى الإِسْلَامِ، وَمَنْ تَوَفَّيْتَهُ مِنَّا فَتَوَفَّهُ عَلَى الإِيمَانِ، اللَّهُمَّ لَا تَحْرِمْنَا أَجْرَهُ وَلَا تُضِلَّنَا بَعْدَهُ", "count": 1, "ref": "ابن ماجة 1/ 480 وأحمد 2/ 368 وانظر صحيح ابن ماجة 1/ 251", "card": {"n": 432, "places": 2}, "mean": {"id": "5021", "en": "O Allah, forgive those of us who are living and those of us who are dead, those of us who are young and those who are old, those of us who are males and those who are females, and those of us who are present and those who are absent. O Allah, whoever of us You give life, let him live upon Islam, and whoever of us You take in death, let him die in a state of faith. O Allah, deprive us not of his reward, and subject us not to temptation after his death", "bn": "হে আল্লাহ! আমাদের জীবিত-মৃত, ছোট-বড়, নারী-পুরুষ, উপস্থিত ও অনুপস্থিত নির্বিশেষে সকলকে ক্ষমা করুন। হে আল্লাহ! আপনি আমাদের মধ্যে যাকে জীবিত রাখবেন তাকে ইসলামের ওপর জীবিত রাখুন এবং আমাদের মধ্যে যাকে মৃত্যু দান করবেন তাকে ঈমানের সাথে মৃত্যু দান করুন। হে আল্লাহ! আপনি আমাদেরকে এর প্রতিদান থেকে বঞ্চিত করবেন না এবং এর পরে আমাদেরকে পথভ্রষ্ট করবেন না।", "enAttr": "Narrated by Ibn Majah - Narrated by Ahmad", "bnAttr": "এটি ইবন মাজাহ বর্ণনা করেছেন। - এটি আহমাদ বর্ণনা করেছেন।"}}, {"ar": "اللَّهُمَّ إِنَّ فُلَانَ بْنَ فُلَانٍ فِي ذِمَّتِكَ، وَحَبْلِ جِوَارِكَ، فَقِهِ مِنْ فِتْنَةِ القَبْرِ وَعَذَابِ النَّارِ، وَأَنْتَ أَهْلُ الوَفَاءِ وَالحَقِّ، فَاغْفِرْ لَهُ وَاِرْحَمْهُ إِنَّكَ أَنْتَ الغَفُورُ الرَّحِيمُ", "count": 1, "ref": "أخرجه ابن ماجة، انظر صحيح ابن ماجة 1/ 251 ورواه أبو داود 3/ 211", "card": null, "mean": {"id": "5022", "en": "O Allah, so-and-so the son of so-and-so is under Your protection and mercy. So, protect him from the trial of the grave and the torture of Hellfire. You are worthy of fulfilling promises and worthy of praise. O Allah, forgive him and have mercy upon him, as You are the Most Forgiving and the Most Merciful", "bn": "হে আল্লাহ! অমুকের পুত্র অমুক আপনার দায়িত্বে ও আপনার প্রতিবেশিত্বের নিরাপত্তায়। অতএব, তাকে আাপনি কবরের পরীক্ষা ও জাহান্নামের আযাব থেকে রক্ষা করুন। আপনি প্রতিশ্রুতি পালনকারী ও প্রশংসার পাত্র। হে আল্লাহ আপনি তাকে মাফ করুন ও তার প্রতি দয়া করুন। নিঃসন্দেহে আপনি মহাক্ষমাশীল অতি দয়াবান।", "enAttr": "Narrated by Ibn Majah - Narrated by Abu Daoud - Narrated by Ahmad", "bnAttr": "এটি ইবন মাজাহ বর্ণনা করেছেন। - এটি আবূ দাঊদ বর্ণনা করেছেন। - এটি আহমাদ বর্ণনা করেছেন।"}}, {"ar": "اللَّهُمَّ عَبْدُكَ وَاِبْنُ أَمَتِكَ اِحْتَاجَ إِلَى رَحْمَتِكَ، وَأَنْتَ غَنِيٌّ عَنْ عَذَابِهِ، إِنْ كَانَ مُحْسِنًا فَزِدْ فِي حَسَنَاتِهِ، وَإِنْ كَانَ مُسِيئًا فَتَجَاوَزْ عَنْهُ", "count": 1, "ref": "أخرجه الحاكم وصحّحه ووافقه الذّهبيّ 1/ 359 وانظر أحكام الجنائز للألبانيّ ص 125", "card": null, "mean": null}]}, {"i": 57, "title": "الدُّعَاءُ لِلْفَرَطِ فِي الصَّلَاةِ عَلَيْهِ", "items": [{"ar": "اللَّهُمَّ أَعِذْهُ مِنْ عَذَابِ القَبْرِ", "count": 1, "ref": "قال سعيد بن المسيّب صلّيت وراء أبي هريرة على صبيّ لم يعمل خطيئة قطّ فسمعته يقول: 'الحديث'. أخرجه مالك في الموطّأ 1/ 288 وابن أبي شيبة في المصنّف 3/ 217 والبيهقي 4/ 9، وصحّح إسناده شعيب الأرناؤوط في تحقيقه لشرح السّنّة للبغوي 5/ 357", "card": {"n": 6, "places": 14}, "mean": null}, {"ar": "وَإِنْ قَالَ: (اللَّهُمَّ اِجْعَلْهُ فَرَطًا وَذُخْرًا لِوَالِدَيْهِ، وَشَفِيعًا مُجَابًا rd": {"n": 2904, "places": 1}, "mean": null}]}, {"i": 123, "title": "دُعَاءُ التَّعَجُّبِ وَالأَمْرِ السَّارِ", "items": [{"ar": "سُبْحَانَ اللَّهِ", "count": 1, "ref": "البخاري مع الفتح 1/ 210 و 390 و 414 ومسلم 4/ 1857", "card": null, "mean": null}, {"ar": "اللَّهُ أَكْبَرُ", "count": 1, "ref": "البخاري مع الفتح 8/ 441 وانظر صحيح التّرمذي 2/ 103 و 2/ 235 ومسند أحمد 5/ 218", "card": null, "mean": null}]}, {"i": 124, "title": "مَا يَفْعَلُ مَنْ أَتَاهُ أَمْرٌ يَسُرُّهُ", "items": [{"ar": "كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا أَتَاهُ أَمْرٌ يَسُرُّهُ أَوْ يُسَرُّ بِهِ خَرَّ سَاجِدًا شُكْرًا لِلَّهِ تَبَارَكَ وَتَعَالَى", "count": 1, "ref": "رواه أهل السّنن إلّا النّسائي. انظر صحيح ابن ماجة 1/ 233 وإرواء الغليل 2/ 226", "card": null, "mean": null}]}, {"i": 125, "title": "مَا يَقُولُ مَنْ أَحَسَّ وَجَعًا فِي جَسَدِهِ", "items": [{"ar": "ضَعْ يَدَكَ عَلَى الذِي تَأَلَّمَ مِنْ جَسَدِكَ وَقُلْ: (بِسْمِ اللَّهِ) ثَلَاثًا. وَقُلْ سَبْعَ مَرَّاتٍ: (أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ)", "count": 1, "ref": "مسلم 4/ 1728", "card": {"n": 424, "places": 2}, "mean": {"id": "6018", "en": "Put your hand on the part of your body where you feel the pain and say: 'Bismillāh (In the name of Allah)' three times; then say seven times: 'A‘ūdhu billāhi wa qudratihi min sharri mā ajidu wa uhādhir (I seek refuge with Allah and His power from the evil that I find and fear).'", "bn": "“তোমার শরীরের যে অংশ ব্যথাযুক্ত হয়, তার উপরে তোমার হাত রেখে তিনবার ’বিসমিল্লা-হ’ বলবে এবং সাতবার বলবে-أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ \"আল্লাহ এবং তার ক্ষমতার আশ্রয় প্রার্থনা করছি- যা আমি অনুভব করি এবং যা থেকে ভয় করি তার অনিষ্ট হতে।", "enAttr": "Narrated by Muslim", "bnAttr": "ইমাম মুসলিম এটি বর্ণনা করেছেন"}}]}, {"i": 126, "title": "دُعَاءُ مَنْ خَشِيَ أَنْ يُصِيبَ شَيْئًا بِعَيْنِهِ", "items": [{"ar": "إِذَا رَأَى أَحَدُكُمْ مِنْ أَخِيهِ، أَوْ مِنْ نَفْسِهِ، أَوْ مِنْ مَالِهِ مَا يُعْجِبُهُ [فَلْيَدْعُ لَهُ بِالبَرَكَةِ] فَإِنَّ العَيْنَ حَقٌّ", "count": 1, "ref": "مسند أحمد 4/ 447 وابن ماجة، ومالك، وصحّحه الألباني في صحيح الجامع 1/ 212 وانظر تحقيق زاد المعاد للأرناؤوط 4/ 170", "card": null, "mean": null}]}, {"i": 127, "title": "مَا يُقَالُ عِنْدَ الفَزَعِ", "items": [{"ar": "لَا إِلَهَ إِلَّا اللَّهُ", "count": 1, "ref": "البخاري مع الفتح 6/ 181، ومسلم 4/ 2208", "card": null, "mean": {"id": "4955", "en": "During the battle of Tabūk, the people suffered famine, so they said: O Messenger of Allah, grant us permission to slaughter our camels to eat and use their fat. The Messenger said: You may do that", "bn": "তাবুকের যুদ্ধের সময়ে লোকেরা ক্ষুধায় আক্রান্ত হলো। তারা বলল, হে আল্লাহর রাসূল! যদি আপনি অনুমতি দেন, তাহলে আমরা আমাদের উটগুলো যবেহ করে তার গোশত খাই এবং আর চর্বি ব্যবহার করি। রাসূলুল্লাহ সাল্লাল্লাহু ‘আলাইহি ওয়াসাল্লাম বললেন, তোমরা তা করো।", "enAttr": "Narrated by Muslim", "bnAttr": "এটি মুসলিম বর্ণনা করেছেন।"}}]}, {"i": 128, "title": "مَا يَقُولُ عِنْدَ الذَّبْحِ أَوْ النَّحْرِ", "items": [{"ar": "بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ، [اللَّهُمَّ مِنْكَ وَلَكَ]، اللَّهُمَّ تَقَبَّلْ مِنِّي", "count": 1, "ref": "مسلم 3/ 1557، والبيهقي 9/ 287/ ومابين المعكوفين للبيهقي 9/ 287، وغيره والجملة الأخيرة سقتها بالمعنى من رواية مسلم", "card": null, "mean": null}]}, {"i": 129, "title": "مَا يَقُولُ لِرَدِّ كَيْدِ مَرَدَةِ الشَّيَاطِينِ", "items": [{"ar": "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ التِي لَا يُجَاوِزُهُنَّ بَرٌّ وَلَا فَاجِرٌ مِنْ شَرِّ مَا خَلَقَ، وَبَرَأَ وَذَرَأَ، وَمِنْ شَرِّ مَا يَنْزِلُ مِنَ السَّمَاءِ، وَمِنْ شَرِّ مَا يَعْرُجُ فِيهَا، وَمِنْ شَرِّ مَا ذَرَأَ فِي الأَرْضِ، وَمِنْ شَرِّ مَا يَخْرُجُ مِنْهَا، وَمِنْ شَرِّ فِتَنِ اللَّيْلِ وَالنَّهَارِ، وَمِنْ شَرِّ كُلِّ طَارِقٍ إِلَّا طَارِقًا يَطْرُقُ بِخَيْرً يَا رَحْمَانُ", "count": 1, "ref": "أحمد 3/ 419 بإسناد صحيح وابن السّني برقم 637 وصحّح إسناده الأرناؤوط في تخريجه للطّحاوية ص 133 وانظر مجمع الزوائد 10/ 127", "card": {"n": 2239, "places": 1}, "mean": null}]}, {"i": 133, "title": "مِنْ أَنْوَاعِ الخَيْرِ وَالآدَابِ الجَامِعَةِ", "items": [{"ar": "إِذَا كَانَ جُنْحُ اللَّيْلِ - أَوْ أَمْسَيْتُمْ - فَكُفُّوا صِبْيَانَكُمْ؛ فَإِنَّ الشَّيَاطِينَ تَنْتَشِرُ حِينَئِذٍ، فَإِذَا ذَهَبَ سَاعَةٌ مِنَ اللَّيْلِ فَخَلُّوهُمْ، وَأَغْلِقُوا الأَبْوَابَ وَاذْكُرُوا اِسْمَ اللَّهِ، فَإِنَّ الشَّيْطَانَ لَا يَفْتَحُ بَابًا مُغْلَقًا، وَأَوْكُوا قِرَبَكُمْ وَاذْكُرُوا اِسْمَ اللَّهِ، وَخَمِّرُوا آنِيَتَكُمْ وَاذْكُرُوا اِسْمَ اللَّهِ، وَلَوْ أَنْ تَعْرُضُوا عَلَيْهَا شَيْئًا، وَأَطْفِئُوا مَصَابِيحَكُمْ\r\nوَصَلَّى اللَّهُ وَسَلَّمَ وَبَارَكَ عَلَى نَبِيِّنَا مُحَمَّدٍ وَعَلَى آلِهِ وَأَصْحَابِهِ أَجْمَعِينَ", "count": 1, "ref": "البخاري مع الفتح 10/ 88 ومسلم 3/ 1595", "card": {"n": 1615, "places": 1}, "mean": null}]}], "n": 10}], "quran": [{"ref": "1:6", "sEn": "Al-Faatiha", "sAr": "سُورَةُ ٱلْفَاتِحَةِ", "ar": "ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ", "en": "Guide us to the straight path -", "bn": "আমাদেরকে সরল পথ দেখাও,"}, {"ref": "2:127", "sEn": "Al-Baqara", "sAr": "سُورَةُ البَقَرَةِ", "ar": "وَإِذْ يَرْفَعُ إِبْرَٰهِۦمُ ٱلْقَوَاعِدَ مِنَ ٱلْبَيْتِ وَإِسْمَٰعِيلُ رَبَّنَا تَقَبَّلْ مِنَّآ ۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ", "en": "And [mention] when Abraham was raising the foundations of the House and [with him] Ishmael, [saying], \"Our Lord, accept [this] from us. Indeed You are the Hearing, the Knowing.", "bn": "স্মরণ কর, যখন ইব্রাহীম ও ইসমাঈল কা’বাগৃহের ভিত্তি স্থাপন করছিল। তারা দোয়া করেছিলঃ পরওয়ারদেগার! আমাদের থেকে কবুল কর। নিশ্চয়ই তুমি শ্রবণকারী, সর্বজ্ঞ।"}, {"ref": "2:201", "sEn": "Al-Baqara", "sAr": "سُورَةُ البَقَرَةِ", "ar": "وَمِنْهُم مَّن يَقُولُ رَبَّنَآ ءَاتِنَا فِى ٱلدُّنْيَا حَسَنَةًۭ وَفِى ٱلْءَاخِرَةِ حَسَنَةًۭ وَقِنَا عَذَابَ ٱلنَّارِ", "en": "But among them is he who says, \"Our Lord, give us in this world [that which is] good and in the Hereafter [that which is] good and protect us from the punishment of the Fire.\"", "bn": "আর তাদের মধ্যে কেউ কেউ বলে-হে পরওয়ারদেগার! আমাদিগকে দুনয়াতেও কল্যাণ দান কর এবং আখেরাতেও কল্যাণ দান কর এবং আমাদিগকে দোযখের আযাব থেকে রক্ষা কর।"}, {"ref": "2:250", "sEn": "Al-Baqara", "sAr": "سُورَةُ البَقَرَةِ", "ar": "وَلَمَّا بَرَزُوا۟ لِجَالُوتَ وَجُنُودِهِۦ قَالُوا۟ رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْرًۭا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ", "en": "And when they went forth to [face] Goliath and his soldiers, they said, \"Our Lord, pour upon us patience and plant firmly our feet and give us victory over the disbelieving people.\"", "bn": "আর যখন তালূত ও তার সেনাবাহিনী শত্রুর সম্মুখীন হল, তখন বলল, হে আমাদের পালনকর্তা, আমাদের মনে ধৈর্য্য সৃষ্টি করে দাও এবং আমাদেরকে দৃঢ়পদ রাখ-আর আমাদের সাহায্য কর সে কাফের জাতির বিরুদ্ধে।"}, {"ref": "2:286", "sEn": "Al-Baqara", "sAr": "سُورَةُ البَقَرَةِ", "ar": "لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًۭا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ", "en": "Allah does not charge a soul except [with that within] its capacity. It will have [the consequence of] what [good] it has gained, and it will bear [the consequence of] what [evil] it has earned. \"Our Lord, do not impose blame upon us if we have forgotten or erred. Our Lord, and lay not upon us a burden like that which You laid upon those before us. Our Lord, and burden us not with that which we have no ability to bear. And pardon us; and forgive us; and have mercy upon us. You are our protector, so give us victory over the disbelieving people.\"", "bn": "আল্লাহ কাউকে তার সাধ্যাতীত কোন কাজের ভার দেন না, সে তাই পায় যা সে উপার্জন করে এবং তাই তার উপর বর্তায় যা সে করে। হে আমাদের পালনকর্তা, যদি আমরা ভুলে যাই কিংবা ভুল করি, তবে আমাদেরকে অপরাধী করো না। হে আমাদের পালনকর্তা! এবং আমাদের উপর এমন দায়িত্ব অর্পণ করো না, যেমন আমাদের পূর্ববর্তীদের উপর অর্পণ করেছ, হে আমাদের প্রভূ! এবং আমাদের দ্বারা ঐ বোঝা বহন করিও না, যা বহন করার শক্তি আমাদের নাই। আমাদের পাপ মোচন কর। আমাদেরকে ক্ষমা কর এবং আমাদের প্রতি দয়া কর। তুমিই আমাদের প্রভু। সুতরাং কাফের সম্প্রদায়ের বিরুদ্ধে আমাদের কে সাহায্যে কর।"}, {"ref": "3:8", "sEn": "Aal-i-Imraan", "sAr": "سُورَةُ آلِ عِمۡرَانَ", "ar": "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ ٱلْوَهَّابُ", "en": "[Who say], \"Our Lord, let not our hearts deviate after You have guided us and grant us from Yourself mercy. Indeed, You are the Bestower.", "bn": "হে আমাদের পালনকর্তা! সরল পথ প্রদর্শনের পর তুমি আমাদের অন্তরকে সত্যলংঘনে প্রবৃত্ত করোনা এবং তোমার নিকট থেকে আমাদিগকে অনুগ্রহ দান কর। তুমিই সব কিছুর দাতা।"}, {"ref": "3:16", "sEn": "Aal-i-Imraan", "sAr": "سُورَةُ آلِ عِمۡرَانَ", "ar": "ٱلَّذِينَ يَقُولُونَ رَبَّنَآ إِنَّنَآ ءَامَنَّا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ ٱلنَّارِ", "en": "Those who say, \"Our Lord, indeed we have believed, so forgive us our sins and protect us from the punishment of the Fire,\"", "bn": "যারা বলে, হে আমাদের পালনকর্তা, আমরা ঈমান এনেছি, কাজেই আমাদের গোনাহ ক্ষমা করে দাও আর আমাদেরকে দোযখের আযাব থেকে রক্ষা কর।"}, {"ref": "3:38", "sEn": "Aal-i-Imraan", "sAr": "سُورَةُ آلِ عِمۡرَانَ", "ar": "هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُۥ ۖ قَالَ رَبِّ هَبْ لِى مِن لَّدُنكَ ذُرِّيَّةًۭ طَيِّبَةً ۖ إِنَّكَ سَمِيعُ ٱلدُّعَآءِ", "en": "At that, Zechariah called upon his Lord, saying, \"My Lord, grant me from Yourself a good offspring. Indeed, You are the Hearer of supplication.\"", "bn": "সেখানেই যাকারিয়া তাঁর পালনকর্তার নিকট প্রার্থনা করলেন। বললেন, হে, আমার পালনকর্তা! তোমার নিকট থেকে আমাকে পুত-পবিত্র সন্তান দান কর-নিশ্চয়ই তুমি প্রার্থনা শ্রবণকারী।"}, {"ref": "3:53", "sEn": "Aal-i-Imraan", "sAr": "سُورَةُ آلِ عِمۡرَانَ", "ar": "رَبَّنَآ ءَامَنَّا بِمَآ أَنزَلْتَ وَٱتَّبَعْنَا ٱلرَّسُولَ فَٱكْتُبْنَا مَعَ ٱلشَّٰهِدِينَ", "en": "Our Lord, we have believed in what You revealed and have followed the messenger Jesus, so register us among the witnesses [to truth].\"", "bn": "হে আমাদের পালনকর্তা! আমরা সে বিষয়ের প্রতি বিশ্বাস স্থাপন করেছি যা তুমি নাযিল করেছ, আমরা রসূলের অনুগত হয়েছি। অতএব, আমাদিগকে মান্যকারীদের তালিকাভুক্ত করে নাও।"}, {"ref": "3:147", "sEn": "Aal-i-Imraan", "sAr": "سُورَةُ آلِ عِمۡرَانَ", "ar": "وَمَا كَانَ قَوْلَهُمْ إِلَّآ أَن قَالُوا۟ رَبَّنَا ٱغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِىٓ أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ", "en": "And their words were not but that they said, \"Our Lord, forgive us our sins and the excess [committed] in our affairs and plant firmly our feet and give us victory over the disbelieving people.\"", "bn": "তারা আর কিছুই বলেনি-শুধু বলেছে, হে আমাদের পালনকর্তা! মোচন করে দাও আমাদের পাপ এবং যা কিছু বাড়াবাড়ি হয়ে গেছে আমাদের কাজে। আর আমাদিগকে দৃঢ় রাখ এবং কাফেরদের উপর আমাদিগকে সাহায্য কর।"}, {"ref": "3:193", "sEn": "Aal-i-Imraan", "sAr": "سُورَةُ آلِ عِمۡرَانَ", "ar": "رَّبَّنَآ إِنَّنَا سَمِعْنَا مُنَادِيًۭا يُنَادِى لِلْإِيمَٰنِ أَنْ ءَامِنُوا۟ بِرَبِّكُمْ فَـَٔامَنَّا ۚ رَبَّنَا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّـَٔاتِنَا وَتَوَفَّنَا مَعَ ٱلْأَبْرَارِ", "en": "Our Lord, indeed we have heard a caller calling to faith, [saying], 'Believe in your Lord,' and we have believed. Our Lord, so forgive us our sins and remove from us our misdeeds and cause us to die with the righteous.", "bn": "হে আমাদের পালনকর্তা! আমরা নিশ্চিতরূপে শুনেছি একজন আহবানকারীকে ঈমানের প্রতি আহবান করতে যে, তোমাদের পালনকর্তার প্রতি ঈমান আন; তাই আমরা ঈমান এনেছি। হে আমাদের পালনকর্তা! অতঃপর আমাদের সকল গোনাহ মাফ কর এবং আমাদের সকল দোষত্রুটি দুর করে দাও, আর আমাদের মৃত্যু দাও নেক লোকদের সাথে।"}, {"ref": "7:23", "sEn": "Al-A'raaf", "sAr": "سُورَةُ الأَعۡرَافِ", "ar": "قَالَا رَبَّنَا ظَلَمْنَآ أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ ٱلْخَٰسِرِينَ", "en": "They said, \"Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.\"", "bn": "তারা উভয়ে বললঃ হে আমাদের পালনকর্তা আমরা নিজেদের প্রতি জুলম করেছি। যদি আপনি আমাদেরকে ক্ষমা না করেন এবং আমাদের প্রতি অনুগ্রহ না করেন, তবে আমরা অবশ্যই অবশ্যই ধ্বংস হয়ে যাব।"}, {"ref": "7:47", "sEn": "Al-A'raaf", "sAr": "سُورَةُ الأَعۡرَافِ", "ar": "۞ وَإِذَا صُرِفَتْ أَبْصَٰرُهُمْ تِلْقَآءَ أَصْحَٰبِ ٱلنَّارِ قَالُوا۟ رَبَّنَا لَا تَجْعَلْنَا مَعَ ٱلْقَوْمِ ٱلظَّٰلِمِينَ", "en": "And when their eyes are turned toward the companions of the Fire, they say, \"Our Lord, do not place us with the wrongdoing people.\"", "bn": "যখন তাদের দৃষ্টি দোযখীদের উপর পড়বে, তখন বলবেঃ হে আমাদের প্রতিপালক, আমাদেরকে এ জালেমদের সাথী করো না।"}, {"ref": "7:126", "sEn": "Al-A'raaf", "sAr": "سُورَةُ الأَعۡرَافِ", "ar": "وَمَا تَنقِمُ مِنَّآ إِلَّآ أَنْ ءَامَنَّا بِـَٔايَٰتِ رَبِّنَا لَمَّا جَآءَتْنَا ۚ رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْرًۭا وَتَوَفَّنَا مُسْلِمِينَ", "en": "And you do not resent us except because we believed in the signs of our Lord when they came to us. Our Lord, pour upon us patience and let us die as Muslims [in submission to You].\"", "bn": "বস্তুতঃ আমাদের সাথে তোমার শত্রুতা তো এ কারণেই যে, আমরা ঈমান এনেছি আমাদের পরওয়ারদেগারের নিদর্শনসমূহের প্রতি যখন তা আমাদের নিকট পৌঁছেছে। হে আমাদের পরওয়ারদেগার আমাদের জন্য ধৈর্য্যের দ্বার খুলে দাও এবং আমাদেরকে মুসলমান হিসাবে মৃত্যু দান কর।"}, {"ref": "10:85", "sEn": "Yunus", "sAr": "سُورَةُ يُونُسَ", "ar": "فَقَالُوا۟ عَلَى ٱللَّهِ تَوَكَّلْنَا رَبَّنَا لَا تَجْعَلْنَا فِتْنَةًۭ لِّلْقَوْمِ ٱلظَّٰلِمِينَ", "en": "So they said, \"Upon Allah do we rely. Our Lord, make us not [objects of] trial for the wrongdoing people", "bn": "তখন তারা বলল, আমরা আল্লাহর উপর ভরসা করেছি। হে আমাদের পালনকর্তা, আমাদের উপর এ জালেম কওমের শক্তি পরীক্ষা করিও না।"}, {"ref": "14:40", "sEn": "Ibrahim", "sAr": "سُورَةُ إِبۡرَاهِيمَ", "ar": "رَبِّ ٱجْعَلْنِى مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِى ۚ رَبَّنَا وَتَقَبَّلْ دُعَآءِ", "en": "My Lord, make me an establisher of prayer, and [many] from my descendants. Our Lord, and accept my supplication.", "bn": "হে আমার পালনকর্তা, আমাকে নামায কায়েমকারী করুন এবং আমার সন্তানদের মধ্যে থেকেও। হে আমাদের পালনকর্তা, এবং কবুল করুন আমাদের দোয়া।"}, {"ref": "14:41", "sEn": "Ibrahim", "sAr": "سُورَةُ إِبۡرَاهِيمَ", "ar": "رَبَّنَا ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ ٱلْحِسَابُ", "en": "Our Lord, forgive me and my parents and the believers the Day the account is established.\"", "bn": "হে আমাদের পালনকর্তা, আমাকে, আমার পিতা-মাতাকে এবং সব মুমিনকে ক্ষমা করুন, যেদিন হিসাব কায়েম হবে।"}, {"ref": "17:24", "sEn": "Al-Israa", "sAr": "سُورَةُ الإِسۡرَاءِ", "ar": "وَٱخْفِضْ لَهُمَا جَنَاحَ ٱلذُّلِّ مِنَ ٱلرَّحْمَةِ وَقُل رَّبِّ ٱرْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًۭا", "en": "And lower to them the wing of humility out of mercy and say, \"My Lord, have mercy upon them as they brought me up [when I was] small.\"", "bn": "তাদের সামনে ভালবাসার সাথে, নম্রভাবে মাথা নত করে দাও এবং বলঃ হে পালনকর্তা, তাদের উভয়ের প্রতি রহম কর, যেমন তারা আমাকে শৈশবকালে লালন-পালন করেছেন।"}, {"ref": "17:80", "sEn": "Al-Israa", "sAr": "سُورَةُ الإِسۡرَاءِ", "ar": "وَقُل رَّبِّ أَدْخِلْنِى مُدْخَلَ صِدْقٍۢ وَأَخْرِجْنِى مُخْرَجَ صِدْقٍۢ وَٱجْعَل لِّى مِن لَّدُنكَ سُلْطَٰنًۭا نَّصِيرًۭا", "en": "And say, \"My Lord, cause me to enter a sound entrance and to exit a sound exit and grant me from Yourself a supporting authority.\"", "bn": "বলুনঃ হে পালনকর্তা! আমাকে দাখিল করুন সত্যরূপে এবং আমাকে বের করুন সত্যরূপে এবং দান করুন আমাকে নিজের কাছ থেকে রাষ্ট্রীয় সাহায্য।"}, {"ref": "18:10", "sEn": "Al-Kahf", "sAr": "سُورَةُ الكَهۡفِ", "ar": "إِذْ أَوَى ٱلْفِتْيَةُ إِلَى ٱلْكَهْفِ فَقَالُوا۟ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحْمَةًۭ وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًۭا", "en": "[Mention] when the youths retreated to the cave and said, \"Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance.\"", "bn": "যখন যুবকরা পাহাড়ের গুহায় আশ্রয়গ্রহণ করে তখন দোআ করেঃ হে আমাদের পালনকর্তা, আমাদেরকে নিজের কাছ থেকে রহমত দান করুন এবং আমাদের জন্যে আমাদের কাজ সঠিকভাবে পূর্ণ করুন।"}, {"ref": "20:25", "sEn": "Taa-Haa", "sAr": "سُورَةُ طه", "ar": "قَالَ رَبِّ ٱشْرَحْ لِى صَدْرِى", "en": "[Moses] said, \"My Lord, expand for me my breast [with assurance]", "bn": "মূসা বললেনঃ হে আমার পালনকর্তা আমার বক্ষ প্রশস্ত করে দিন।"}, {"ref": "20:114", "sEn": "Taa-Haa", "sAr": "سُورَةُ طه", "ar": "فَتَعَٰلَى ٱللَّهُ ٱلْمَلِكُ ٱلْحَقُّ ۗ وَلَا تَعْجَلْ بِٱلْقُرْءَانِ مِن قَبْلِ أَن يُقْضَىٰٓ إِلَيْكَ وَحْيُهُۥ ۖ وَقُل رَّبِّ زِدْنِى عِلْمًۭا", "en": "So high [above all] is Allah, the Sovereign, the Truth. And, [O Muhammad], do not hasten with [recitation of] the Qur'an before its revelation is completed to you, and say, \"My Lord, increase me in knowledge.\"", "bn": "সত্যিকার অধীশ্বর আল্লাহ মহান। আপনার প্রতি আল্লাহর ওহী সম্পুর্ণ হওয়ার পূর্বে আপনি কোরআন গ্রহণের ব্যপারে তাড়াহুড়া করবেন না এবং বলুনঃ হে আমার পালনকর্তা, আমার জ্ঞান বৃদ্ধি করুন।"}, {"ref": "21:83", "sEn": "Al-Anbiyaa", "sAr": "سُورَةُ الأَنبِيَاءِ", "ar": "۞ وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُۥٓ أَنِّى مَسَّنِىَ ٱلضُّرُّ وَأَنتَ أَرْحَمُ ٱلرَّٰحِمِينَ", "en": "And [mention] Job, when he called to his Lord, \"Indeed, adversity has touched me, and you are the Most Merciful of the merciful.\"", "bn": "এবং স্মরণ করুন আইয়্যুবের কথা, যখন তিনি তাঁর পালনকর্তাকে আহবান করে বলেছিলেনঃ আমি দুঃখকষ্টে পতিত হয়েছি এবং আপনি দয়াবানদের চাইতেও সর্বশ্রেষ্ট দয়াবান।"}, {"ref": "21:87", "sEn": "Al-Anbiyaa", "sAr": "سُورَةُ الأَنبِيَاءِ", "ar": "وَذَا ٱلنُّونِ إِذ ذَّهَبَ مُغَٰضِبًۭا فَظَنَّ أَن لَّن نَّقْدِرَ عَلَيْهِ فَنَادَىٰ فِى ٱلظُّلُمَٰتِ أَن لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبْحَٰنَكَ إِنِّى كُنتُ مِنَ ٱلظَّٰلِمِينَ", "en": "And [mention] the man of the fish, when he went off in anger and thought that We would not decree [anything] upon him. And he called out within the darknesses, \"There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.\"", "bn": "এবং মাছওয়ালার কথা স্মরণ করুন তিনি ক্রুদ্ধ হয়ে চলে গিয়েছিলেন, অতঃপর মনে করেছিলেন যে, আমি তাঁকে ধৃত করতে পারব না। অতঃপর তিনি অন্ধকারের মধ্যে আহবান করলেনঃ তুমি ব্যতীত কোন উপাস্য নেই; তুমি নির্দোষ আমি গুনাহগার।"}, {"ref": "23:29", "sEn": "Al-Muminoon", "sAr": "سُورَةُ المُؤۡمِنُونَ", "ar": "وَقُل رَّبِّ أَنزِلْنِى مُنزَلًۭا مُّبَارَكًۭا وَأَنتَ خَيْرُ ٱلْمُنزِلِينَ", "en": "And say, 'My Lord, let me land at a blessed landing place, and You are the best to accommodate [us].' \"", "bn": "আরও বলঃ পালনকর্তা, আমাকে কল্যাণকর ভাবে নামিয়ে দাও, তুমি শ্রেষ্ঠ অবতারণকারী।"}, {"ref": "23:97", "sEn": "Al-Muminoon", "sAr": "سُورَةُ المُؤۡمِنُونَ", "ar": "وَقُل رَّبِّ أَعُوذُ بِكَ مِنْ هَمَزَٰتِ ٱلشَّيَٰطِينِ", "en": "And say, \"My Lord, I seek refuge in You from the incitements of the devils,", "bn": "বলুনঃ হে আমার পালনকর্তা! আমি শয়তানের প্ররোচনা থেকে আপনার আশ্রয় প্রার্থনা করি,"}, {"ref": "23:109", "sEn": "Al-Muminoon", "sAr": "سُورَةُ المُؤۡمِنُونَ", "ar": "إِنَّهُۥ كَانَ فَرِيقٌۭ مِّنْ عِبَادِى يَقُولُونَ رَبَّنَآ ءَامَنَّا فَٱغْفِرْ لَنَا وَٱرْحَمْنَا وَأَنتَ خَيْرُ ٱلرَّٰحِمِينَ", "en": "Indeed, there was a party of My servants who said, 'Our Lord, we have believed, so forgive us and have mercy upon us, and You are the best of the merciful.'", "bn": "আমার বান্দাদের একদলে বলতঃ হে আমাদের পালনকর্তা! আমরা বিশ্বাস স্থাপন করেছি। অতএব তুমি আমাদেরকে ক্ষমা কর ও আমাদের প্রতি রহম কর। তুমি তো দয়ালুদের মধ্যে শ্রেষ্ঠ দয়ালু।"}, {"ref": "23:118", "sEn": "Al-Muminoon", "sAr": "سُورَةُ المُؤۡمِنُونَ", "ar": "وَقُل رَّبِّ ٱغْفِرْ وَٱرْحَمْ وَأَنتَ خَيْرُ ٱلرَّٰحِمِينَ", "en": "And, [O Muhammad], say, \"My Lord, forgive and have mercy, and You are the best of the merciful.\"", "bn": "বলূনঃ হে আমার পালনকর্তা, ক্ষমা করুন ও রহম করুন। রহমকারীদের মধ্যে আপনি শ্রেষ্ট রহমকারী।"}, {"ref": "25:65", "sEn": "Al-Furqaan", "sAr": "سُورَةُ الفُرۡقَانِ", "ar": "وَٱلَّذِينَ يَقُولُونَ رَبَّنَا ٱصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ ۖ إِنَّ عَذَابَهَا كَانَ غَرَامًا", "en": "And those who say, \"Our Lord, avert from us the punishment of Hell. Indeed, its punishment is ever adhering;", "bn": "এবং যারা বলে, হে আমার পালনকর্তা, আমাদের কাছথেকে জাহান্নামের শাস্তি হটিয়ে দাও। নিশ্চয় এর শাস্তি নিশ্চিত বিনাশ;"}, {"ref": "25:74", "sEn": "Al-Furqaan", "sAr": "سُورَةُ الفُرۡقَانِ", "ar": "وَٱلَّذِينَ يَقُولُونَ رَبَّنَا هَبْ لَنَا مِنْ أَزْوَٰجِنَا وَذُرِّيَّٰتِنَا قُرَّةَ أَعْيُنٍۢ وَٱجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا", "en": "And those who say, \"Our Lord, grant us from among our wives and offspring comfort to our eyes and make us an example for the righteous.\"", "bn": "এবং যারা বলে, হে আমাদের পালনকর্তা, আমাদের স্ত্রীদের পক্ষ থেকে এবং আমাদের সন্তানের পক্ষ থেকে আমাদের জন্যে চোখের শীতলতা দান কর এবং আমাদেরকে মুত্তাকীদের জন্যে আদর্শস্বরূপ কর।"}, {"ref": "26:83", "sEn": "Ash-Shu'araa", "sAr": "سُورَةُ الشُّعَرَاءِ", "ar": "رَبِّ هَبْ لِى حُكْمًۭا وَأَلْحِقْنِى بِٱلصَّٰلِحِينَ", "en": "[And he said], \"My Lord, grant me authority and join me with the righteous.", "bn": "হে আমার পালনকর্তা, আমাকে প্রজ্ঞা দান কর এবং আমাকে সৎকর্মশীলদের অন্তর্ভুক্ত কর"}, {"ref": "27:19", "sEn": "An-Naml", "sAr": "سُورَةُ النَّمۡلِ", "ar": "فَتَبَسَّمَ ضَاحِكًۭا مِّن قَوْلِهَا وَقَالَ رَبِّ أَوْزِعْنِىٓ أَنْ أَشْكُرَ نِعْمَتَكَ ٱلَّتِىٓ أَنْعَمْتَ عَلَىَّ وَعَلَىٰ وَٰلِدَىَّ وَأَنْ أَعْمَلَ صَٰلِحًۭا تَرْضَىٰهُ وَأَدْخِلْنِى بِرَحْمَتِكَ فِى عِبَادِكَ ٱلصَّٰلِحِينَ", "en": "So [Solomon] smiled, amused at her speech, and said, \"My Lord, enable me to be grateful for Your favor which You have bestowed upon me and upon my parents and to do righteousness of which You approve. And admit me by Your mercy into [the ranks of] Your righteous servants.\"", "bn": "তার কথা শুনে সুলায়মান মুচকি হাসলেন এবং বললেন, হে আমার পালনকর্তা, তুমি আমাকে সামর্থ?2470;াও যাতে আমি তোমার সেই নিয়ামতের কৃতজ্ঞতা প্রকাশ করতে পারি, যা তুমি আমাকে ও আমার পিতা-মাতাকে দান করেছ এবং যাতে আমি তোমার পছন্দনীয় সৎকর্ম করতে পারি এবং আমাকে নিজ অনুগ্রহে তোমার সৎকর্মপরায়ন বান্দাদের অন্তর্ভুক্ত কর।"}, {"ref": "28:16", "sEn": "Al-Qasas", "sAr": "سُورَةُ القَصَصِ", "ar": "قَالَ رَبِّ إِنِّى ظَلَمْتُ نَفْسِى فَٱغْفِرْ لِى فَغَفَرَ لَهُۥٓ ۚ إِنَّهُۥ هُوَ ٱلْغَفُورُ ٱلرَّحِيمُ", "en": "He said, \"My Lord, indeed I have wronged myself, so forgive me,\" and He forgave him. Indeed, He is the Forgiving, the Merciful.", "bn": "তিনি বললেন, হে আমার পালনকর্তা, আমি তো নিজের উপর জুলুম করে ফেলেছি। অতএব, আমাকে ক্ষমা করুন। আল্লাহ তাকে ক্ষমা করলেন। নিশ্চয় তিনি ক্ষমাশীল, দয়ালু।"}, {"ref": "28:24", "sEn": "Al-Qasas", "sAr": "سُورَةُ القَصَصِ", "ar": "فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰٓ إِلَى ٱلظِّلِّ فَقَالَ رَبِّ إِنِّى لِمَآ أَنزَلْتَ إِلَىَّ مِنْ خَيْرٍۢ فَقِيرٌۭ", "en": "So he watered [their flocks] for them; then he went back to the shade and said, \"My Lord, indeed I am, for whatever good You would send down to me, in need.\"", "bn": "অতঃপর মূসা তাদের জন্তুদেরকে পানি পান করালেন। অতঃপর তিনি ছায়ার দিকে সরে গেলেন এবং বললেন, হে আমার পালনকর্তা, তুমি আমার প্রতি যে অনুগ্রহ নাযিল করবে, আমি তার মুখাপেক্ষী।"}, {"ref": "40:7", "sEn": "Ghafir", "sAr": "سُورَةُ غَافِرٍ", "ar": "ٱلَّذِينَ يَحْمِلُونَ ٱلْعَرْشَ وَمَنْ حَوْلَهُۥ يُسَبِّحُونَ بِحَمْدِ رَبِّهِمْ وَيُؤْمِنُونَ بِهِۦ وَيَسْتَغْفِرُونَ لِلَّذِينَ ءَامَنُوا۟ رَبَّنَا وَسِعْتَ كُلَّ شَىْءٍۢ رَّحْمَةًۭ وَعِلْمًۭا فَٱغْفِرْ لِلَّذِينَ تَابُوا۟ وَٱتَّبَعُوا۟ سَبِيلَكَ وَقِهِمْ عَذَابَ ٱلْجَحِيمِ", "en": "Those [angels] who carry the Throne and those around it exalt [Allah] with praise of their Lord and believe in Him and ask forgiveness for those who have believed, [saying], \"Our Lord, You have encompassed all things in mercy and knowledge, so forgive those who have repented and followed Your way and protect them from the punishment of Hellfire.", "bn": "যারা আরশ বহন করে এবং যারা তার চারপাশে আছে, তারা তাদের পালনকর্তার সপ্রশংস পবিত্রতা বর্ণনা করে, তার প্রতি বিশ্বাস স্থাপন করে এবং মুমিনদের জন্যে ক্ষমা প্রার্থনা করে বলে, হে আমাদের পালনকর্তা, আপনার রহমত ও জ্ঞান সবকিছুতে পরিব্যাপ্ত। অতএব, যারা তওবা করে এবং আপনার পথে চলে, তাদেরকে ক্ষমা করুন এবং জাহান্নামের আযাব থেকে রক্ষা করুন।"}, {"ref": "46:15", "sEn": "Al-Ahqaf", "sAr": "سُورَةُ الأَحۡقَافِ", "ar": "وَوَصَّيْنَا ٱلْإِنسَٰنَ بِوَٰلِدَيْهِ إِحْسَٰنًا ۖ حَمَلَتْهُ أُمُّهُۥ كُرْهًۭا وَوَضَعَتْهُ كُرْهًۭا ۖ وَحَمْلُهُۥ وَفِصَٰلُهُۥ ثَلَٰثُونَ شَهْرًا ۚ حَتَّىٰٓ إِذَا بَلَغَ أَشُدَّهُۥ وَبَلَغَ أَرْبَعِينَ سَنَةًۭ قَالَ رَبِّ أَوْزِعْنِىٓ أَنْ أَشْكُرَ نِعْمَتَكَ ٱلَّتِىٓ أَنْعَمْتَ عَلَىَّ وَعَلَىٰ وَٰلِدَىَّ وَأَنْ أَعْمَلَ صَٰلِحًۭا تَرْضَىٰهُ وَأَصْلِحْ لِى فِى ذُرِّيَّتِىٓ ۖ إِنِّى تُبْتُ إِلَيْكَ وَإِنِّى مِنَ ٱلْمُسْلِمِينَ", "en": "And We have enjoined upon man, to his parents, good treatment. His mother carried him with hardship and gave birth to him with hardship, and his gestation and weaning [period] is thirty months. [He grows] until, when he reaches maturity and reaches [the age of] forty years, he says, \"My Lord, enable me to be grateful for Your favor which You have bestowed upon me and upon my parents and to work righteousness of which You will approve and make righteous for me my offspring. Indeed, I have repented to You, and indeed, I am of the Muslims.\"", "bn": "আমি মানুষকে তার পিতা-মাতার সাথে সদ্ব্যবহারের আদেশ দিয়েছি। তার জননী তাকে কষ্টসহকারে গর্ভে ধারণ করেছে এবং কষ্টসহকারে প্রসব করেছে। তাকে গর্ভে ধারণ করতে ও তার স্তন্য ছাড়তে লেগেছে ত্রিশ মাস। অবশেষে সে যখন শক্তি-সামর্থে?480; বয়সে ও চল্লিশ বছরে পৌছেছে, তখন বলতে লাগল, হে আমার পালনকর্তা, আমাকে এরূপ ভাগ্য দান কর, যাতে আমি তোমার নেয়ামতের শোকর করি, যা তুমি দান করেছ আমাকে ও আমার পিতা-মাতাকে এবং যাতে আমি তোমার পছন্দনীয় সৎকাজ করি। আমার সন্তানদেরকে সৎকর্মপরায়ণ কর, আমি তোমার প্রতি তওবা করলাম এবং আমি আজ্ঞাবহদের অন্যতম।"}, {"ref": "59:10", "sEn": "Al-Hashr", "sAr": "سُورَةُ الحَشۡرِ", "ar": "وَٱلَّذِينَ جَآءُو مِنۢ بَعْدِهِمْ يَقُولُونَ رَبَّنَا ٱغْفِرْ لَنَا وَلِإِخْوَٰنِنَا ٱلَّذِينَ سَبَقُونَا بِٱلْإِيمَٰنِ وَلَا تَجْعَلْ فِى قُلُوبِنَا غِلًّۭا لِّلَّذِينَ ءَامَنُوا۟ رَبَّنَآ إِنَّكَ رَءُوفٌۭ رَّحِيمٌ", "en": "And [there is a share for] those who came after them, saying, \"Our Lord, forgive us and our brothers who preceded us in faith and put not in our hearts [any] resentment toward those who have believed. Our Lord, indeed You are Kind and Merciful.\"", "bn": "আর এই সম্পদ তাদের জন্যে, যারা তাদের পরে আগমন করেছে। তারা বলেঃ হে আমাদের পালনকর্তা, আমাদেরকে এবং ঈমানে আগ্রহী আমাদের ভ্রাতাগণকে ক্ষমা কর এবং ঈমানদারদের বিরুদ্ধে আমাদের অন্তরে কোন বিদ্বেষ রেখো না। হে আমাদের পালনকর্তা, আপনি দয়ালু, পরম করুণাময়।"}, {"ref": "60:4", "sEn": "Al-Mumtahana", "sAr": "سُورَةُ المُمۡتَحنَةِ", "ar": "قَدْ كَانَتْ لَكُمْ أُسْوَةٌ حَسَنَةٌۭ فِىٓ إِبْرَٰهِيمَ وَٱلَّذِينَ مَعَهُۥٓ إِذْ قَالُوا۟ لِقَوْمِهِمْ إِنَّا بُرَءَٰٓؤُا۟ مِنكُمْ وَمِمَّا تَعْبُدُونَ مِن دُونِ ٱللَّهِ كَفَرْنَا بِكُمْ وَبَدَا بَيْنَنَا وَبَيْنَكُمُ ٱلْعَدَٰوَةُ وَٱلْبَغْضَآءُ أَبَدًا حَتَّىٰ تُؤْمِنُوا۟ بِٱللَّهِ وَحْدَهُۥٓ إِلَّا قَوْلَ إِبْرَٰهِيمَ لِأَبِيهِ لَأَسْتَغْفِرَنَّ لَكَ وَمَآ أَمْلِكُ لَكَ مِنَ ٱللَّهِ مِن شَىْءٍۢ ۖ رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ ٱلْمَصِيرُ", "en": "There has already been for you an excellent pattern in Abraham and those with him, when they said to their people, \"Indeed, we are disassociated from you and from whatever you worship other than Allah. We have denied you, and there has appeared between us and you animosity and hatred forever until you believe in Allah alone\" except for the saying of Abraham to his father, \"I will surely ask forgiveness for you, but I have not [power to do] for you anything against Allah. Our Lord, upon You we have relied, and to You we have returned, and to You is the destination.", "bn": "তোমাদের জন্যে ইব্রাহীম ও তাঁর সঙ্গীগণের মধ্যে চমৎকার আদর্শ রয়েছে। তারা তাদের সম্প্রদায়কে বলেছিলঃ তোমাদের সাথে এবং তোমরা আল্লাহর পরিবর্তে যার এবাদত কর, তার সাথে আমাদের কোন সম্পর্ক নেই। আমরা তোমাদের মানি না। তোমরা এক আল্লাহর প্রতি বিশ্বাস স্থাপন না করলে তোমাদের মধ্যে ও আমাদের মধ্যে চিরশত্রুতা থাকবে। কিন্তু ইব্রাহীমের উক্তি তাঁর পিতার উদ্দেশে এই আদর্শের ব্যতিক্রম। তিনি বলেছিলেনঃ আমি অবশ্যই তোমার জন্য ক্ষমাপ্রার্থনা করব। তোমার উপকারের জন্যে আল্লাহর কাছে আমার আর কিছু করার নেই। হে আমাদের পালনকর্তা! আমরা তোমারই উপর ভরসা করেছি, তোমারই দিকে মুখ করেছি এবং তোমারই নিকট আমাদের প্রত্যাবর্তন।"}, {"ref": "66:8", "sEn": "At-Tahrim", "sAr": "سُورَةُ التَّحۡرِيمِ", "ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ تُوبُوٓا۟ إِلَى ٱللَّهِ تَوْبَةًۭ نَّصُوحًا عَسَىٰ رَبُّكُمْ أَن يُكَفِّرَ عَنكُمْ سَيِّـَٔاتِكُمْ وَيُدْخِلَكُمْ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ يَوْمَ لَا يُخْزِى ٱللَّهُ ٱلنَّبِىَّ وَٱلَّذِينَ ءَامَنُوا۟ مَعَهُۥ ۖ نُورُهُمْ يَسْعَىٰ بَيْنَ أَيْدِيهِمْ وَبِأَيْمَٰنِهِمْ يَقُولُونَ رَبَّنَآ أَتْمِمْ لَنَا نُورَنَا وَٱغْفِرْ لَنَآ ۖ إِنَّكَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ", "en": "O you who have believed, repent to Allah with sincere repentance. Perhaps your Lord will remove from you your misdeeds and admit you into gardens beneath which rivers flow [on] the Day when Allah will not disgrace the Prophet and those who believed with him. Their light will proceed before them and on their right; they will say, \"Our Lord, perfect for us our light and forgive us. Indeed, You are over all things competent.\"", "bn": "মুমিনগণ! তোমরা আল্লাহ তা’আলার কাছে তওবা কর-আন্তরিক তওবা। আশা করা যায়, তোমাদের পালনকর্তা তোমাদের মন্দ কর্মসমূহ মোচন করে দেবেন এবং তোমাদেরকে দাখিল করবেন জান্নাতে, যার তলদেশে নদী প্রবাহিত। সেদিন আল্লাহ নবী এবং তাঁর বিশ্বাসী সহচরদেরকে অপদস্থ করবেন না। তাদের নূর তাদের সামনে ও ডানদিকে ছুটোছুটি করবে। তারা বলবেঃ হে আমাদের পালনকর্তা, আমাদের নূরকে পূর্ণ করে দিন এবং আমাদেরকে ক্ষমা করুন। নিশ্চয় আপনি সবকিছুর উপর সর্ব শক্তিমান।"}, {"ref": "71:28", "sEn": "Nooh", "sAr": "سُورَةُ نُوحٍ", "ar": "رَّبِّ ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِمَن دَخَلَ بَيْتِىَ مُؤْمِنًۭا وَلِلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ وَلَا تَزِدِ ٱلظَّٰلِمِينَ إِلَّا تَبَارًۢا", "en": "My Lord, forgive me and my parents and whoever enters my house a believer and the believing men and believing women. And do not increase the wrongdoers except in destruction.\"", "bn": "হে আমার পালনকর্তা! আপনি আমাকে, আমার পিতা-মাতাকে, যারা মুমিন হয়ে আমার গৃহে প্রবেশ করে-তাদেরকে এবং মুমিন পুরুষ ও মুমিন নারীদেরকে ক্ষমা করুন এবং যালেমদের কেবল ধ্বংসই বৃদ্ধি করুন।"}], "adhkar": [{"ar": "الْحَمْدُ لِلَّهِ وَحْدَهُ، وَالصَّلاَةُ وَالسَّلاَمُ عَلَى مَنْ لاَ نَبِيَّ بَعْدَهُ", "en": "All praise is due to Allah alone, and peace and blessings be upon him after whom there is no other Prophet.", "tr": "Alḥamdulillahi waḥdah waṣ-ṣalatu was-salam `alā man lā nabiyya ba`dah.", "count": 1, "cd": "Once"}, {"ar": "أَعُوذُ بِاللَّهِ مِنَ الشَّيطَانِ الرَّجِيمِ ﴿اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَوَاتِ وَالْأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾", "en": "Allah! There is none worthy of worship but He, the Ever-Living, the One Who sustains and protects all that exists. Neither slumber nor sleep overtakes Him. To Him belongs whatever is in the heavens and whatever is on the earth. Who is he that can intercede with Him except with His Permission? He knows what happens to them in this world, and what will happen to them in the Hereafter. And they will never encompass anything of His Knowledge except that which He wills. His Throne extends over the heavens and the earth, and He feels no fatigue in guarding and preserving them. And He is the Most High, the Most Great.", "tr": "(A`ūdhu billāhi min ash-shaytāni 'r-rajīm)\nAllāhu lā ilāha illā huwa ‘l-Ḥayyul-Qayyūm,\nlā ta'khudhuhu sinatun wa lā nawm,\nlahu mā fis-samāwāti wa māfil-arḍ,\nman dhal-ladhī yashfa`u `indahu illā bi'idhnih,\nya`lamu mā bayna aydīhim wa mā khalfahum,\nwa lā yuḥīṭūna bishay'im-min `ilmihi illā bimā shā',\nwasi`a kursiyyuhus-samāwāti wal-arḍ,\nwa lā ya'ūduhu hifẓuhumā,\nwa huwal-`Aliyyu‘l-`Aẓīm.", "count": 1, "cd": "Once"}, {"ar": "أَعُوذُ بِاللَّهِ مِنَ الشَّيطَانِ الرَّجِيمِ ﴿آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ كُلٌّ آمَنَ بِاللَّهِ وَمَلآئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لاَ نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ وَقَالُواْ سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ* لاَ يُكَلِّفُ اللَّهُ نَفْساً إِلاَّ وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لاَ تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلاَ تَحْمِلْ عَلَيْنَا إِصْراً كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلاَ تُحَمِّلْنَا مَا لاَ طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَآ أَنتَ مَوْلاَنَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ﴾. [البقرة 285 - 286]", "en": "(285) The Messenger has believed in what was revealed to him from his Lord, and [so have] the believers. All of them have believed in Allah and His angels and His books and His messengers, [saying], We make no distinction between any of His messengers. And they say, We hear and we obey. [We seek] Your forgiveness, our Lord, and to You is the [final] destination. (286) Allah does not charge a soul except [with that within] its capacity. It will have [the consequence of] what [good] it has gained, and it will bear [the consequence of] what [evil] it has earned. Our Lord, do not impose blame upon us if we have forgotten or erred. Our Lord, and lay not upon us a burden like that which You laid upon those before us. Our Lord, and burden us not with that which we have no ability to bear. And pardon us; and forgive us; and have mercy upon us. You are our protector, so give us victory over the disbelieving people.", "tr": "Aamanar-Rasoolu bimaaa unzila ilaihi mir-Rabbihee walmu'minoon; kullun aamana billaahi wa Malaaa'ikathihee wa Kutubhihee wa Rusulihee laa nufarriqu baina ahadim-mir-Rusulih wa qaaloo sami'naa wa ata'naa ghufraanaka Rabbanaa wa ilaikal-maseer (285)\nLaa yukalliful-laahu nafsan illaa wus'ahaa; lahaa maa kasabat wa 'alaihaa maktasabat; Rabbanaa laa tu'aakhiznaaa in naseenaaa aw akhtaanaa; Rabbanaa wa laa tahmil-'alainaaa isran kamaa hamaltahoo 'alal-lazeena min qablinaa; Rabbanaa wa laa tuhammilnaa maa laa taaqata lanaa bih; wa'fu 'annaa waghfir lanaa warhamnaa; Anta mawlaanaa fansurnaa 'alal qawmil kaafireen (286)", "count": 1, "cd": "Once"}, {"ar": "قُلْ هُوَ ٱللَّهُ أَحَدٌ، ٱللَّهُ ٱلصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ", "en": "(1) Say, He is Allah, [who is] One, (2) Allah, the Eternal Refuge.(3) He neither begets nor is born,(4) Nor is there to Him any equivalent.", "tr": "Bismillaahir Rahmaanir Raheem \"Qul huwal laahu ahad (1) Allah hus-samad (2) Lam yalid wa lam yoolad (3) Wa lam yakul-lahoo kufuwan ahad (4)", "count": 3, "cd": "Three times"}, {"ar": "قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ، وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ", "en": "(1) Say, I seek refuge in the Lord of daybreak (2) From the evil of that which He created (3) And from the evil of darkness when it settles (4) And from the evil of the blowers in knots (5) And from the evil of an envier when he envies.", "tr": "Bismillaahir Rahmaanir Raheem \"Qul a'oozu bi rabbil-falaq (1) Min sharri maa khalaq (2) Wa min sharri ghaasiqin izaa waqab (3) Wa min sharrin-naffaa-taati fil 'uqad (4) Wa min sharri haasidin izaa hasad (5)", "count": 3, "cd": "Three times"}, {"ar": "قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ، مَلِكِ ٱلنَّاسِ، إِلَٰهِ ٱلنَّاسِ، مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ، ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ، مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ", "en": "(1) Say, I seek refuge in the Lord of mankind (2) The Sovereign of mankind (3) The God of mankind (4) From the evil of the retreating whisperer (5) Who whispers [evil] into the breasts of mankind (6) From among the jinn and mankind.", "tr": "Bismillaahir Rahmaanir Raheem \"Qul a'oozu birabbin naas (1)\nMalikin naas (2)\nIlaahin naas (3)\nMin sharril waswaasil khannaas (4)\nAllazee yuwaswisu fee sudoorin naas (5)\nMinal jinnati wannaas (6)", "count": 3, "cd": "Three times"}, {"ar": "أَصْبَحْنَا وَأَصْبَحَ الْملْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْملْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", "en": "We have reached the morning and at this very time unto Allah belongs all sovereignty, and all praise is for Allah. None has the right to be worshipped except Allah, alone, without partner, to Him belongs all sovereignty and praise, and He is over all things omnipotent. My Lord, I ask You for the good of this day and the good of what follows it and I take refuge in You from the evil of this day and the evil of what follows it. My Lord, I take refuge in You from laziness and senility. My Lord, I take refuge in You from torment in the Fire and punishment in the grave.", "tr": "Asbahna wa-asbahal-mulku lillah, walhamdu lillah, la ilaha illal-lah, wahdahu la shareeka lah, lahul-mulku walahul-hamd, wahuwa AAala kulli shayin qadeer, rabbi as-aluka khayra ma fee hathal-yawm, wakhayra ma baAAdahu, wa-aAAoothu bika min sharri hathal-yawm, washarri ma baAAdahu, rabbi aAAoothu bika minal-kasal, wasoo-il kibar, rabbi aAAoothu bika min AAathabin fin-nar, waAAathabin fil-qabr.", "count": 1, "cd": "Once"}, {"ar": "أمسينا وأمسى الملك للَّه، وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رب أسألك خير ما في هذه الليلة، وخير ما بعدها، وأعوذ بك من شر ما في هذه الليلة، وشر ما بعدها، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", "en": "We have reached the evening and at this very time unto Allah belongs all sovereignty, and all praise is for Allah. None has the right to be worshipped except Allah, alone, without partner, to Him belongs all sovereignty and praise, and He is over all things omnipotent. My Lord, I ask You for the good of this night and the good of what follows it and I take refuge in You from the evil of this night and the evil of what follows it. My Lord, I take refuge in You from laziness and senility. My Lord, I take refuge in You from torment in the Fire and punishment in the grave.", "tr": "Amsayna wa-amsal-mulku lillah, walhamdu lillah, la ilaha illal-lah, wahdahu la shareeka lah, lahul-mulku walahul-hamd, wahuwa AAala kulli shayin qadeer, rabbi as-aluka khayra ma fee hathihil-laylah, wakhayra ma baAAdaha, wa-aAAoothu bika min sharri hathihil-laylah, washarri ma baAAdaha, rabbi aAAoothu bika minal-kasal, wasoo-il kibar, rabbi aAAoothu bika min AAathabin fin-nar, waAAathabin fil-qabr.", "count": 1, "cd": "Once"}, {"ar": "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ", "en": "O Allah, by Your leave we have reached the morning and by Your leave we have reached the evening, by Your leave we live and die and unto You is our resurrection", "tr": "Allahumma bika asbahna, wabika amsayna, wabika nahya, wabika namootu wa-ilaykan-nushoor.", "count": 1, "cd": "Once"}, {"ar": "اللَّهمَّ بِكَ أمسَينا وبِكَ أصبَحنا وبِكَ نَحيا وبِكَ نموتُ، وإليكَ المصيرُ", "en": "O Allah, by Your leave we have reached the evening and by Your leave we have reached the morning, by Your leave we live and die and unto You is our return.", "tr": "Allahumma bika amsayna, wabika asbahna, wabika nahya, wabika namootu wa-ilaykal-maseer.", "count": 1, "cd": "Once"}, {"ar": "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لاَ يَغْفِرُ الذُّنوبَ إِلاَّ أَنْتَ", "en": "O Allah, You are my Lord, none has the right to be worshipped except You, You created me and I am Your servant and I abide to Your covenant and promise as best I can, I take refuge in You from the evil of which I have committed.  I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for verily none can forgive sin except You.", "tr": "Allahumma anta rabbee la ilaha illa ant, khalaqtanee wa-ana AAabduk, wa-ana AAala AAahdika wawaAAdika mas-tataAAt, aAAoothu bika min sharri ma sanaAAt, aboo-o laka biniAAmatika AAalay, wa-aboo-o bithanbee, faghfir lee fa-innahu la yaghfiruth-thunooba illa ant.", "count": 1, "cd": "Once"}, {"ar": "اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلاَئِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلاَّ أَنْتَ وَحْدَكَ لاَ شَرِيكَ لَكَ، وَأَنَّ مُحَمَّداً عَبْدُكَ وَرَسُولُكَ", "en": "O Allah, verily I have reached the morning and call on You, the bearers of Your throne, Your angels, and all of Your creation to witness that You are Allah, none has the right to be worshipped except You, alone, without partner, and that Muhammad is Your Servant and Messenger.", "tr": "Allahumma innee asbahtu oshhiduka, wa-osshidu hamalata AAarshika, wamala-ikatika, wajameeAAa khalqika, annaka antal-lahu la ilaha illa ant, wahdaka la shareeka lak, wa-anna Muhammadan AAabduka warasooluka.", "count": 4, "cd": "Four times"}, {"ar": "اللَّهم إني أمسيت أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلاَئِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلاَّ أَنْتَ وَحْدَكَ لاَ شَرِيكَ لَكَ، وَأَنَّ مُحَمَّداً عَبْدُكَ وَرَسُولُكَ", "en": "O Allah, verily I have reached the evening and call on You, the bearers of Your throne, Your angels, and all of Your creation to witness that You are Allah, none has the right to be worshipped except You, alone, without partner, and that Muhammad is Your Servant and Messenger.", "tr": "Allahumma innee amsaytu oshhiduka, wa-osshidu hamalata AAarshika, wamala-ikatika, wajameeAAa khalqika, annaka antal-lahu la ilaha illa ant, wahdaka la shareeka lak, wa-anna Muhammadan AAabduka warasooluka.", "count": 4, "cd": "Four times"}, {"ar": "اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ", "en": "O Allah, what blessing I or any of Your creation have risen upon is from You alone, without partner. So for You is all praise and unto You all thanks.", "tr": "Allahumma ma asbaha bee min niAAmatin, aw bi-ahadin min khalqika, faminka wahdaka la shareeka lak, falakal-hamdu walakash-shukr.", "count": 1, "cd": "Once"}, {"ar": "اللَّهم ما أمسى بي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ", "en": "O Allah, what blessing I or any of Your creation have reached the evening upon is from You alone, without partner. So for You is all praise and unto You all thanks", "tr": "Allahumma ma amsa bee min niAAmatin, aw bi-ahadin min khalqika, faminka wahdaka la shareeka lak, falakal-hamdu walakash-shukr.", "count": 1, "cd": "Once"}, {"ar": "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لاَ إِلَهَ إِلاَّ أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ القَبْرِ، لاَ إِلَهَ إِلاَّ أَنْتَ", "en": "(O Allah, grant my body health, O Allah, grant my hearing health, O Allah, grant my sight health.  None has the right to be worshipped except You.) (O Allah, I take refuge with You from disbelief and poverty, and I take refuge with You from the punishment of the grave.  None has the right to be worshipped except You.)", "tr": "(Allahumma AAafinee fee badanee, allahumma AAafinee fee samAAee, allahumma AAafinee fee basaree, la ilaha illa ant.) (Allahumma innee aAAoothu bika minal-kufr, walfaqr, wa-aAAoothu bika min AAathabil-qabr, la ilaha illa ant.)", "count": 3, "cd": "Three times"}, {"ar": "حَسْبِيَ اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ عَلَيهِ تَوَكَّلتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", "en": "Allah is Sufficient for me, none has the right to be worshipped except Him, upon Him I rely and He is Lord of the exalted throne.", "tr": "Hasbiyal-lahu la ilaha illa huwa, AAalayhi tawakkalt, wahuwa rabbul-AAarshil-AAatheem", "count": 7, "cd": "Seven times"}, {"ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ: فِي دِينِي وَدُنْيَايَ وَأَهْلِي، وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَينِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي", "en": "O Allah, I ask You for pardon and well-being in this life and the next. O Allah, I ask You for pardon and well-being in my religious and worldly affairs, and my family and my wealth. O Allah, veil my weaknesses and set at ease my dismay. O Allah, preserve me from the front and from behind and on my right and on my left and from above, and I take refuge with You lest I be swallowed up by the earth.", "tr": "Allahumma innee as-alukal-AAafwa walAAafiyah, fid-dunya wal-akhirah, allahumma innee as-alukal-AAafwa walAAafiyah fee deenee, wadunyaya wa-ahlee, wamalee, allahummas-tur AAawratee, wa-amin rawAAatee, allahummah-fathnee min bayni yaday, wamin khalfee, waAAan yameenee, waAAan shimalee, wamin fawqee, wa-aAAoothu biAAathamatika an oghtala min tahtee.", "count": 1, "cd": "Once"}, {"ar": "اللَّهُمَّ عَالِمَ الغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطانِ وَشَرَكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءاً، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ", "en": "(O Allah, Knower of the unseen and the seen, Creator of the heavens and the Earth, Lord and Sovereign of all things, I bear witness that none has the right to be worshipped except You. I take refuge in You from the evil of my soul and from the evil and shirk of the devil, and from committing wrong against my soul or bringing such upon another Muslim.)(shirk: t
