e reached the morning and at this very time all sovereignty belongs to Allah, Lord of the worlds. O Allah, I ask You for the good of this day, its triumphs and its victories, its light and its blessings and its guidance, and I take refuge in You from the evil of this day and the evil that follows it.", "tr": "Asbahna wa-asbahal-mulku lillahi rabbil-AAalameen, allahumma innee as-aluka khayra hathal-yawm, fat-hahu, wanasrahu, wanoorahu, wabarakatahu, wahudahu, wa-aAAoothu bika min sharri ma feehi, washarri ma baAAdah.", "count": 1, "cd": "Once"}, {"ar": "أَمْسَيْنا وَأَمْسَى الْمُلْكُ للهِ رَبِّ الْعَالَمَيْنِ، اللَّهُمَّ إِنَّي أسْأَلُكَ خَيْرَ هَذَه اللَّيْلَةِ فَتْحَهَا ونَصْرَهَا، ونُوْرَهَا وبَرَكَتهَا، وَهُدَاهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فيهِا وَشَرَّ مَا بَعْدَهَا", "en": "We have reached the evening and at this very time all sovereignty belongs to Allah, Lord of the worlds. O Allah, I ask You for the good of tonight, its triumphs and its victories, its light and its blessings and its guidance, and I take refuge in You from the evil of tonight and the evil that follows it.", "tr": "Amsayna wa-amsal-mulku lillahi rabbil-AAalameen, allahumma innee as-aluka khayra hathihil-laylah, fat-haha, wanasraha, wanooraha, wabarakataha, wahudaha, wa-aAAoothu bika min sharri ma feeha, washarri ma baAAdaha.", "count": 1, "cd": "Once"}, {"ar": "أَصْبَحْنا عَلَى فِطْرَةِ الْإِسْلاَمِ، وَعَلَى كَلِمَةِ الْإِخْلاَصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفاً مُسْلِماً وَمَا كَانَ مِنَ الْمُشرِكِينَ", "en": "We rise upon the fitrah of Islam, and the word of pure faith, and upon the religion of our Prophet Muhammad ﷺ, and the religion of our forefather Ibraheem, who was a Muslim and of true faith and was not of those who associate others with Allah.", "tr": "Asbahna AAala fitratil-islam, waAAala kalimatil-ikhlas, waAAala deeni nabiyyina Muhammad ﷺ, waAAala millati abeena Ibraheem, haneefan musliman wama kana minal-mushrikeen.", "coun orld that which is good and in the Hereafter that which is good and protect us from the torment of the Fire)", "bn": "নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লামের সবচেয়ে বেশি পড়া দো‘আ হলো,«اللَّهُمَّ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً، وَفِي الآخِرَةِ حَسَنَةً، وَقِنَا عَذَابَ النَّارِ» “হে আমাদের রব, আমাদেরকে দুনিয়াতে কল্যাণ দিন। আর আখিরাতেও কল্যাণ দিন এবং আমাদেরকে জাহান্নামের আযাব থেকে রক্ষা করুন।”", "id": 5502}}, {"n": 8, "places": 13, "ar": "رَبِّ اغْفِرْ لِي خَطِيئَتِي وَجَهْلِي وَإِسْرَافِي فِي أَمْرِي كُلِّهِ وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي اللَّهُمَّ اغْفِرْ لِي خَطَايَايَ وَعَمْدِي وَجَهْلِي وَهَزْلِي وَكُلُّ ذَلِكَ عِنْدِي اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ أَنْتَ المُقَدِّمُ وَأَنْتَ المُؤَخِّرُ وَأَنْتَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", "mean": {"en": "O Lord, forgive me my sin, my ignorance, my excess in all of my affairs, and whatever You are better aware of than me. O Allah, forgive me my sins, my deliberate sins, my ignorant sins, my humorous sins, and all of this I have committed. O Allah, forgive what I have done and what I have left undone, what I have committed secretly and what I have committed openly; You are the Advancer and You are the Delayer, and You have absolute power over everything", "bn": "“হে আল্লাহ! আপনি ক্ষমা করে দিন আমার অনিচ্ছাকৃত গুনাহ, আমার অজ্ঞতা, আমার কাজের সকল বাড়াবাড়ি এবং আমার যেসব গুনাহ আপনি আমার চেয়ে অধিক জানেন। হে আল্লাহ! আপনি ক্ষমা করে দিন আমার ভুল-ত্রুটি, আমার ইচ্ছাকৃত গুনাহ ও আমার অজ্ঞতা এবং আমার উপহাসমূলক গুনাহ আর এ রকম গুনাহ যা আমার মধ্যে আছে। হে আল্লাহ! আপনি আমাকে ক্ষমা করে দিন যেসব গুনাহ আমি আগে করেছি ও পরে করবো এবং যা আমি গোপনে করেছি ও প্রকাশ্যে করেছি। আপনিই অগ্রবর্তী করেন, আপনিই পশ্চাদবর্তী করেন এবং আপনিই সব বিষয়োপরি সর্বশক্তিমান”।", "id": 5483}}, {"n": 9, "places": 12, "ar": "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ", "mean": {"en": "The Prophet (may Allah's peace and blessings be upon him) came out to us, and we said: O Messenger of Allah, we have learned how to greet you, but how should we invoke the blessings of Allah upon you?", "bn": "নবী সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম আমাদের নিকট আসলে আমরা বললাম, হে আল্লাহর রাসূল! আমরা কীভাবে আপনাকে সালাম দেব তা জানলাম। তবে কীভাবে আপনার উপর সালাত (দরূদ) পেশ করবো?", "id": 5377}}, {"n": 11, "places": 11, "ar": "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي وَبِكَ أَرْفَعُهُ إِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ", "mean": {"en": "When any one of you goes to his bed, let him dust off his bed with the end of his lower garment, for indeed he does not know what came unto it after he had left it", "bn": "“যখন তোমাদের কেউ শয্যা গ্রহণ করবে, তখন সে যেন নিজ লুঙ্গির একাংশ দ্বারা তার বিছানাটা ঝেড়ে নেয়। কারণ, সে জানে না যে, তার অনুপস্থিতিতে কী কী জিনিস সেখানে এসেছে।", "id": 6034}}, {"n": 13, "places": 10, "ar": "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي إِنَّكَ أَنْتَ الغَفُورُ الرَّحِيمُ", "mean": null}, {"n": 18, "places": 8, "ar": "اللَّهُمَّ أَحْيِنِي مَا كَانَتِ الحَيَاةُ خَيْرًا لِي وَتَوَفَّنِي إِذَا كَانَتِ الوَفَاةُ خَيْرًا لِي", "mean": null}, {"n": 23, "places": 7, "ar": "لاَ إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ فِي يَوْمٍ مِائَةَ", "mean": {"en": "Whoever says a hundred times in a day: \"La ilāha illallāhu wahdahu la sharīka lah, lahu al-mulku wa lahu al-hamdu wa huwa ‘ala kulli shay’in qadīr\" (There is no god but Allah. He is One, and He has no partner with Him; to Him belong the sovereignty and praise, and He is competent over all things)", "bn": "“যে ব্যক্তি لا إله إلا الله وحده لا شريك له، له الملك، وله الحمد، وهو على كل شيء قدير দিনে একশত বার বলবে", "id": 65905}}, {"n": 24, "places": 7, "ar": "لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ اللهُ أَكْبَرُ كَبِيرًا وَالْحَمْدُ لِلَّهِ كَثِيرًا سُبْحَانَ اللهِ رَبِّ الْعَالَمِينَ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ الْعَزِيزِ الْحَكِيمِ", "mean": {"en": "Say: La ilāha illallāhu wahdahu la sharīka lah, Allāhu akbar kabīra, wa al-hamdulillāhi kathīra, subhānallāhi Rabbi al-‘ālamīn, la hawla wa la quwwata illa billāhi al-‘azīz al-hakīm (There is no god but Allah, alone with no partner. Allah is the Greatest with all greatness, and abundant praise is due to Allah. Allah, the Lord of the worlds, is exalted above imperfection. There is no might nor power except with Allah, the Mighty and the All-Wise)", "bn": "তুমি পড়বে:\n«لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، اللهُ أَكْبَرُ كَبِيرًا، وَالْحَمْدُ لِلَّهِ كَثِيرًا، سُبْحَانَ اللهِ رَبِّ الْعَالَمِينَ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ الْعَزِيزِ الْحَكِيمِ» \nঅর্থ: “আল্লাহ ছাড়া কোন প্রকৃত মাবূদ নেই, তিনি একক, তার কোনই শরীক নেই। আল্লাহ অনেক বড়, আল্লাহর জন্য অনেক প্রশংসা, আমি পবিত্রতা ঘোষণা করি সে আল্লাহর যিনি সৃষ্টিজগতের রব, কারো কোন উপায় বা শক্তি নেই আল্লাহ ছাড়া, যিনি প্রতাপান্বিত ও প্রজ্ঞাবান।”", "id": 6112}}, {"n": 25, "places": 7, "ar": "اللهم ِإنِّي أَسأَلُك الهُدَى والتُّقَى والعَفَاف والغِنَى", "mean": null}, {"n": 26, "places": 7, "ar": "بِسْمِ اللَّهِ الذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ العَلِيمُ", "mean": null}, {"n": 27, "places": 7, "ar": "سُبْحَانَ المَلِكِ القُدُّوسِ", "mean": null}, {"n": 41, "places": 6, "ar": "اللَّهُمَّ إِنَّا نَجْعَلُكَ فِي نُحُورِهِمُ وَنَعُوذُ بِكَ مِنْ شُرُورِهِمُ", "mean": {"en": "O Allah, we ask You to ward them off (from their throats), and we seek Your protection against their evil", "bn": "হে আল্লাহ আমরা তাদের মোকাবিলায় আপনাকেই তাদের গলায় রাখছি এবং তাদের অনিষ্ট থেকে আপনার কাছে আশ্রয় চাচ্ছি।", "id": 5473}}, {"n": 29, "places": 6, "ar": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ وَلَا مُعْطِيَ لِمَا مَنَعْتَ وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ", "mean": null}, {"n": 32, "places": 6, "ar": "اللَّهُمَّ جَنِّبْنَا الشَّيْطَانَ وَجَنِّبْ الشَّيْطَانَ مَا رَزَقْتَنَا", "mean": null}, {"n": 33, "places": 6, "ar": "سُبْحَانَ اللهِ الْعَظِيمِ سُبْحَانَ اللهِ وَبِحَمْدِهِ", "mean": null}, {"n": 35, "places": 6, "ar": "الحَمْدُ لِلَّهِ الذِي أَطْعَمَنَا وَسَقَانَا وَكَفَانَا وَآوَانَا فَكَمْ مِمَّنْ لَا كَافِيَ لَهُ وَلَا مُؤْوِي", "mean": null}, {"n": 37, "places": 6, "ar": "أَسْتَغْفِرُ اللَّهَ العَظِيمَ الذِي لَا إِلَهَ إِلَّا هُوَ الحَيُّ القَيُّومُ وَأَتُوبُ إِلَيْهِ", "mean": null}, {"n": 46, "places": 5, "ar": "اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ وَتَعْلَمُ وَلَا أَعْلَمُ وَأَنْتَ عَلَّامُ الْغُيُوبِ اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي أَوْ", "mean": {"en": "The Messenger of Allah (may Allah's peace and blessings be upon him) used to teach us Istikhārah (guidance-seeking prayer) in all matters, as he would teach us a Surah from the Qur’an", "bn": "রাসূলুল্লাহ সাল্লাল্লাহ আলাইহি ওয়াসাল্লাম আমাদেরকে যাবতীয় কাজের জন্য ইস্তিখারা শিখাতেন, যেভাবে তিনি কুরআনের সূরা শেখাতেন।", "id": 3293}}, {"n": 48, "places": 5, "ar": "اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَاهْدِنِي وَعَافِنِي وَارْزُقْنِي", "mean": null}], "prophets": [{"who": "Ādam and Ḥawwāʾ", "whoBn": "আদম ও হাওয়া", "ref": "7:23", "titleEn": "Forgiveness after the mistake", "titleBn": "ভুলের পর ক্ষমা প্রার্থনা", "ar": "قَالَا رَبَّنَا ظَلَمْنَآ أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ ٱلْخَٰسِرِينَ", "en": "They said, \"Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.\"", "bn": "তারা উভয়ে বললঃ হে আমাদের পালনকর্তা আমরা নিজেদের প্রতি জুলম করেছি। যদি আপনি আমাদেরকে ক্ষমা না করেন এবং আমাদের প্রতি অনুগ্রহ না করেন, তবে আমরা অবশ্যই অবশ্যই ধ্বংস হয়ে যাব।", "sEn": "Al-A'raaf"}, {"who": "Nūḥ", "whoBn": "নূহ", "ref": "71:28", "titleEn": "Forgiveness for parents and believers", "titleBn": "পিতা-মাতা ও মুমিনদের জন্য ক্ষমা", "ar": "رَّبِّ ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِمَن دَخَلَ بَيْتِىَ مُؤْمِنًۭا وَلِلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ وَلَا تَزِدِ ٱلظَّٰلِمِينَ إِلَّا تَبَارًۢا", "en": "My Lord, forgive me and my parents and whoever enters my house a believer and the believing men and believing women. And do not increase the wrongdoers except in destruction.\"", "bn": "হে আমার পালনকর্তা! আপনি আমাকে, আমার পিতা-মাতাকে, যারা মুমিন হয়ে আমার গৃহে প্রবেশ করে-তাদেরকে এবং মুমিন পুরুষ ও মুমিন নারীদেরকে ক্ষমা করুন এবং যালেমদের কেবল ধ্বংসই বৃদ্ধি করুন।", "sEn": "Nooh"}, {"who": "Nūḥ", "whoBn": "নূহ", "ref": "23:29", "titleEn": "A blessed landing place", "titleBn": "বরকতময় অবতরণস্থল", "ar": "وَقُل رَّبِّ أَنزِلْنِى مُنزَلًۭا مُّبَارَكًۭا وَأَنتَ خَيْرُ ٱلْمُنزِلِينَ", "en": "And say, 'My Lord, let me land at a blessed landing place, and You are the best to accommodate [us].' \"", "bn": "আরও বলঃ পালনকর্তা, আমাকে কল্যাণকর ভাবে নামিয়ে দাও, তুমি শ্রেষ্ঠ অবতারণকারী।", "sEn": "Al-Muminoon"}, {"who": "Ibrāhīm and Ismāʿīl", "whoBn": "ইবরাহীম ও ইসমাঈল", "ref": "2:127", "titleEn": "Accept this from us", "titleBn": "আমাদের পক্ষ থেকে কবুল করুন", "ar": "وَإِذْ يَرْفَعُ إِبْرَٰهِۦمُ ٱلْقَوَاعِدَ مِنَ ٱلْبَيْتِ وَإِسْمَٰعِيلُ رَبَّنَا تَقَبَّلْ مِنَّآ ۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ", "en": "And [mention] when Abraham was raising the foundations of the House and [with him] Ishmael, [saying], \"Our Lord, accept [this] from us. Indeed You are the Hearing, the Knowing.", "bn": "স্মরণ কর, যখন ইব্রাহীম ও ইসমাঈল কা’বাগৃহের ভিত্তি স্থাপন করছিল। তারা দোয়া করেছিলঃ পরওয়ারদেগার! আমাদের থেকে কবুল কর। নিশ্চয়ই তুমি শ্রবণকারী, সর্বজ্ঞ।", "sEn": "Al-Baqara"}, {"who": "Ibrāhīm", "whoBn": "ইবরাহীম", "ref": "14:40", "titleEn": "Make me establish the prayer", "titleBn": "আমাকে সালাত কায়েমকারী করুন", "ar": "رَبِّ ٱجْعَلْنِى مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِى ۚ رَبَّنَا وَتَقَبَّلْ دُعَآءِ", "en": "My Lord, make me an establisher of prayer, and [many] from my descendants. Our Lord, and accept my supplication.", "bn": "হে আমার পালনকর্তা, আমাকে নামায কায়েমকারী করুন এবং আমার সন্তানদের মধ্যে থেকেও। হে আমাদের পালনকর্তা, এবং কবুল করুন আমাদের দোয়া।", "sEn": "Ibrahim"}, {"who": "Ibrāhīm", "whoBn": "ইবরাহীম", "ref": "14:41", "titleEn": "Forgive me, my parents and the believers", "titleBn": "আমাকে, পিতা-মাতা ও মুমিনদের ক্ষমা করুন", "ar": "رَبَّنَا ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ ٱلْحِسَابُ", "en": "Our Lord, forgive me and my parents and the believers the Day the account is established.\"", "bn": "হে আমাদের পালনকর্তা, আমাকে, আমার পিতা-মাতাকে এবং সব মুমিনকে ক্ষমা করুন, যেদিন হিসাব কায়েম হবে।", "sEn": "Ibrahim"}, {"who": "Ibrāhīm", "whoBn": "ইবরাহীম", "ref": "26:83", "titleEn": "Wisdom and the company of the righteous", "titleBn": "প্রজ্ঞা ও সৎকর্মশীলদের সঙ্গ", "ar": "رَبِّ هَبْ لِى حُكْمًۭا وَأَلْحِقْنِى بِٱلصَّٰلِحِينَ", "en": "[And he said], \"My Lord, grant me authority and join me with the righteous.", "bn": "হে আমার পালনকর্তা, আমাকে প্রজ্ঞা দান কর এবং আমাকে সৎকর্মশীলদের অন্তর্ভুক্ত কর", "sEn": "Ash-Shu'araa"}, {"who": "Mūsā", "whoBn": "মূসা", "ref": "20:25", "titleEn": "Open my chest for me", "titleBn": "আমার বক্ষ প্রশস্ত করে দিন", "ar": "قَالَ رَبِّ ٱشْرَحْ لِى صَدْرِى", "en": "[Moses] said, \"My Lord, expand for me my breast [with assurance]", "bn": "মূসা বললেনঃ হে আমার পালনকর্তা আমার বক্ষ প্রশস্ত করে দিন।", "sEn": "Taa-Haa"}, {"who": "Mūsā", "whoBn": "মূসা", "ref": "28:16", "titleEn": "I have wronged myself", "titleBn": "আমি নিজের উপর জুলুম করেছি", "ar": "قَالَ رَبِّ إِنِّى ظَلَمْتُ نَفْسِى فَٱغْفِرْ لِى فَغَفَرَ لَهُۥٓ ۚ إِنَّهُۥ هُوَ ٱلْغَفُورُ ٱلرَّحِيمُ", "en": "He said, \"My Lord, indeed I have wronged myself, so forgive me,\" and He forgave him. Indeed, He is the Forgiving, the Merciful.", "bn": "তিনি বললেন, হে আমার পালনকর্তা, আমি তো নিজের উপর জুলুম করে ফেলেছি। অতএব, আমাকে ক্ষমা করুন। আল্লাহ তাকে ক্ষমা করলেন। নিশ্চয় তিনি ক্ষমাশীল, দয়ালু।", "sEn": "Al-Qasas"}, {"who": "Mūsā", "whoBn": "মূসা", "ref": "28:24", "titleEn": "In need of whatever good You send", "titleBn": "আপনি যে কল্যাণই পাঠান, আমি তার মুখাপেক্ষী", "ar": "فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰٓ إِلَى ٱلظِّلِّ فَقَالَ رَبِّ إِنِّى لِمَآ أَنزَلْتَ إِلَىَّ مِنْ خَيْرٍۢ فَقِيرٌۭ", "en": "So he watered [their flocks] for them; then he went back to the shade and said, \"My Lord, indeed I am, for whatever good You would send down to me, in need.\"", "bn": "অতঃপর মূসা তাদের জন্তুদেরকে পানি পান করালেন। অতঃপর তিনি ছায়ার দিকে সরে গেলেন এবং বললেন, হে আমার পালনকর্তা, তুমি আমার প্রতি যে অনুগ্রহ নাযিল করবে, আমি তার মুখাপেক্ষী।", "sEn": "Al-Qasas"}, {"who": "Mūsā", "whoBn": "মূসা", "ref": "7:151", "titleEn": "Forgive me and my brother", "titleBn": "আমাকে ও আমার ভাইকে ক্ষমা করুন", "ar": "قَالَ رَبِّ ٱغْفِرْ لِى وَلِأَخِى وَأَدْخِلْنَا فِى رَحْمَتِكَ ۖ وَأَنتَ أَرْحَمُ ٱلرَّٰحِمِينَ", "en": "[Moses] said, \"My Lord, forgive me and my brother and admit us into Your mercy, for You are the most merciful of the merciful.\"", "bn": "মূসা বললেন, হে আমার পরওয়ারদেগার, ক্ষমা কর আমাকে আর আমার ভাইকে এবং আমাদেরকে তোমার রহমতের অন্তর্ভুক্ত কর। তুমি যে সর্বাধিক করুণাময়।", "sEn": "Al-A'raaf"}, {"who": "Yūnus", "whoBn": "ইউনুস", "ref": "21:87", "titleEn": "From inside the darkness", "titleBn": "অন্ধকারের ভেতর থেকে", "ar": "وَذَا ٱلنُّونِ إِذ ذَّهَبَ مُغَٰضِبًۭا فَظَنَّ أَن لَّن نَّقْدِرَ عَلَيْهِ فَنَادَىٰ فِى ٱلظُّلُمَٰتِ أَن لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبْحَٰنَكَ إِنِّى كُنتُ مِنَ ٱلظَّٰلِمِينَ", "en": "And [mention] the man of the fish, when he went off in anger and thought that We would not decree [anything] upon him. And he called out within the darknesses, \"There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.\"", "bn": "এবং মাছওয়ালার কথা স্মরণ করুন তিনি ক্ ful", "titleBn": "আমাকে কৃতজ্ঞ হওয়ার তাওফীক দিন", "ar": "فَتَبَسَّمَ ضَاحِكًۭا مِّن قَوْلِهَا وَقَالَ رَبِّ أَوْزِعْنِىٓ أَنْ أَشْكُرَ نِعْمَتَكَ ٱلَّتِىٓ أَنْعَمْتَ عَلَىَّ وَعَلَىٰ وَٰلِدَىَّ وَأَنْ أَعْمَلَ صَٰلِحًۭا تَرْضَىٰهُ وَأَدْخِلْنِى بِرَحْمَتِكَ فِى عِبَادِكَ ٱلصَّٰلِحِينَ", "en": "So [Solomon] smiled, amused at her speech, and said, \"My Lord, enable me to be grateful for Your favor which You have bestowed upon me and upon my parents and to do righteousness of which You approve. And admit me by Your mercy into [the ranks of] Your righteous servants.\"", "bn": "তার কথা শুনে সুলায়মান মুচকি হাসলেন এবং বললেন, হে আমার পালনকর্তা, তুমি আমাকে সামর্থ?2470;াও যাতে আমি তোমার সেই নিয়ামতের কৃতজ্ঞতা প্রকাশ করতে পারি, যা তুমি আমাকে ও আমার পিতা-মাতাকে দান করেছ এবং যাতে আমি তোমার পছন্দনীয় সৎকর্ম করতে পারি এবং আমাকে নিজ অনুগ্রহে তোমার সৎকর্মপরায়ন বান্দাদের অন্তর্ভুক্ত কর।", "sEn": "An-Naml"}, {"who": "Sulaymān", "whoBn": "সুলাইমান", "ref": "38:35", "titleEn": "Forgive me and grant me a kingdom", "titleBn": "আমাকে ক্ষমা করুন ও রাজত্ব দান করুন", "ar": "قَالَ رَبِّ ٱغْفِرْ لِى وَهَبْ لِى مُلْكًۭا لَّا يَنۢبَغِى لِأَحَدٍۢ مِّنۢ بَعْدِىٓ ۖ إِنَّكَ أَنتَ ٱلْوَهَّابُ", "en": "He said, \"My Lord, forgive me and grant me a kingdom such as will not belong to anyone after me. Indeed, You are the Bestower.\"", "bn": "সোলায়মান বললঃ হে আমার পালনকর্তা, আমাকে মাফ করুন এবং আমাকে এমন সাম্রাজ্য দান করুন যা আমার পরে আর কেউ পেতে পারবে না। নিশ্চয় আপনি মহাদাতা।", "sEn": "Saad"}, {"who": "Yūsuf", "whoBn": "ইউসুফ", "ref": "12:101", "titleEn": "Take me as a Muslim", "titleBn": "আমাকে মুসলিম অবস্থায় মৃত্যু দিন", "ar": "۞ رَبِّ قَدْ ءَاتَيْتَنِى مِنَ ٱلْمُلْكِ وَعَلَّمْتَنِى مِن تَأْوِيلِ ٱلْأَحَادِيثِ ۚ فَاطِرَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ أَنتَ وَلِىِّۦ فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ ۖ تَوَفَّنِى مُسْلِمًۭا وَأَلْحِقْنِى بِٱلصَّٰلِحِينَ", "en": "My Lord, You have given me [something] of sovereignty and taught me of the interpretation of dreams. Creator of the heavens and earth, You are my protector in this world and in the Hereafter. Cause me to die a Muslim and join me with the righteous.\"", "bn": "হে পালনকর্তা আপনি আমাকে রাষ্ট্রক্ষমতাও দান করেছেন এবং আমাকে বিভিন্ন তাৎপর্য সহ ব্যাখ্যা করার বিদ্যা শিখিয়ে দিয়েছেন। হে নভোমন্ডল ও ভূ-মন্ডলের স্রষ্টা, আপনিই আমার কার্যনির্বাহী ইহকাল ও পরকালে। আমাকে ইসলামের উপর মৃত্যুদান করুন এবং আমাকে স্বজনদের সাথে মিলিত করুন।", "sEn": "Yusuf"}, {"who": "Lūṭ", "whoBn": "লূত", "ref": "26:169", "titleEn": "Save me and my family", "titleBn": "আমাকে ও আমার পরিবারকে রক্ষা করুন", "ar": "رَبِّ نَجِّنِى وَأَهْلِى مِمَّا يَعْمَلُونَ", "en": "My Lord, save me and my family from [the consequence of] what they do.\"", "bn": "হে আমার পালনকর্তা, আমাকে এবং আমার পরিবারবর্গকে তারা যা করে, তা থেকে রক্ষা কর।", "sEn": "Ash-Shu'araa"}, {"who": "Shuʿayb", "whoBn": "শুআইব", "ref": "7:89", "titleEn": "Judge between us with truth", "titleBn": "আমাদের মধ্যে সত্য দিয়ে ফয়সালা করুন", "ar": "قَدِ ٱفْتَرَيْنَا عَلَى ٱللَّهِ كَذِبًا إِنْ عُدْنَا فِى مِلَّتِكُم بَعْدَ إِذْ نَجَّىٰنَا ٱللَّهُ مِنْهَا ۚ وَمَا يَكُونُ لَنَآ أَن نَّعُودَ فِيهَآ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّنَا ۚ وَسِعَ رَبُّنَا كُلَّ شَىْءٍ عِلْمًا ۚ عَلَى ٱللَّهِ تَوَكَّلْنَا ۚ رَبَّنَا ٱفْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِٱلْحَقِّ وَأَنتَ خَيْرُ ٱلْفَٰتِحِينَ", "en": "We would have invented against Allah a lie if we returned to your religion after Allah had saved us from it. And it is not for us to return to it except that Allah, our Lord, should will. Our Lord has encompassed all things in knowledge. Upon Allah we have relied. Our Lord, decide between us and our people in truth, and You are the best of those who give decision.\"", "bn": "আমরা আল্লাহর প্রতি মিথ্যা অপবাদকারী হয়ে যাব যদি আমরা তোমাদের ধর্মে প্রত্যাবর্তন করি, অথচ তিনি আমাদেরকে এ থেকে মুক্তি দিয়েছেন। আমাদের কাজ নয় এ ধর্মে প্রত্যাবর্তন করা, কিন্তু আমাদের প্রতি পালক আল্লাহ যদি চান। আমাদের প্রতিপালক প্রত্যেক বস্তুকে স্বীয় জ্ঞান দ্বারা বেষ্টন করে আছেন। আল্লাহর প্রতিই আমরা ভরসা করেছি। হে আমাদের প্রতিপালক আমাদের ও আমাদের সম্প n": "what", "bn": "যা", "root": "", "lemma": "مَا", "count": 8}}, {"ar": "صَنَعْتُ", "d": {"lemma": "صَنَع", "root": "صنع", "pos": "verb"}}, {"ar": "أَبُوءُ", "d": {"lemma": "باء", "root": "", "pos": "verb"}}, {"ar": "لَكَ", "q": {"place": "2:30:22", "translit": "laka", "en": "[to] You", "bn": "আপনার", "root": "", "lemma": "", "count": 8}}, {"ar": "بِنِعْمَتِكَ", "d": {"lemma": "نِعْمَة", "root": "نعم", "pos": "noun"}}, {"ar": "عَلَيَّ", "q": {"place": "4:72:12", "translit": "ʿalayya", "en": "[on] me", "bn": "আমার উপর", "root": "", "lemma": "عَلَىٰ", "count": 8}}, {"ar": "وَأَبُوءُ", "d": {"lemma": "باء", "root": "", "pos": "verb"}}, {"ar": "لَكَ", "q": {"place": "2:30:22", "translit": "laka", "en": "[to] You", "bn": "আপনার", "root": "", "lemma": "", "count": 8}}, {"ar": "بِذَنْبِي", "d": {"lemma": "ذَنْب", "root": "ذنب", "pos": "noun"}}, {"ar": "فَاغْفِرْ", "q": {"place": "3:16:6", "translit": "fa-igh'fir", "en": "so forgive", "bn": "অতএব ক্ষমা কর", "root": "غفر", "lemma": "غَفَرَ", "count": 6}}, {"ar": "لِي", "q": {"place": "2:152:4", "translit": "lī", "en": "to Me", "bn": "আমার প্রতি", "root": "", "lemma": "", "count": 8}}], "en": "Shaddād ibn Aws (may Allah be pleased with him) reported from the Prophet (may Allah's peace and blessings be upon him): \"The best way of seeking Allah's forgiveness is to say: 'Allāhumma anta rabbi la ilāha illa ant khalaqtani wa ana ‘abduk wa ana ‘ala ‘ahdika wa wa‘dika mastata‘t a‘ūdhu bika min sharri ma sana‘t abū’u laka bini‘matika ‘alayya wa abū’u bidhanbi faghfir li fa innahu la yaghfiru adh-dhunūba illa ant (O Allah, You are my Lord. You created me, and I am Your slave. I will remain faithful to Your covenant and promise as much as possible. I seek refuge with You from the evil of what I have done. I acknowledge Your favor upon me, and I admit my sin. So, forgive me. Indeed, none can forgive sins but You).'\" He (may Allah's peace and blessings be upon him) added: \"And whoever says this during the day while being certain of its meaning, then he dies before the evening, he will be from the people of Paradise, and whoever says it at night while being certain of its meaning then he dies before the morning, he will be from the people of Paradise.\"", "bn": "শাদ্দাদ ইবনু আওস রদিয়াল্লাহু ‘আনহু থেকে বর্ণিত, তিনি বলেন, নবী সাল্লাল্লাহু ‘আলাইহি ওয়াসাল্লাম বলেছেন: “সাইয়্যেদুল ইস্তেগফার হচ্ছে, তুমি বলবে যে:\nاللَّهُمَّ أَنْتَ رَبِّي لاَ إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ\nঅর্থ: হে আল্লাহ, আপনিই আমার রব, আপনি ছাড়া কোনো সত্য মাবূদ নেই। আপনিই আমাকে সৃষ্টি করেছেন, আমি আপনার বান্দা, আমি যথাসাধ্য আপনার অঙ্গীকার ও ওয়াদার ওপর আছি, আমি যা করছি তার অনিষ্ট থেকে আপনার নিকট প্রার্থনা করছি। আমি আমার ওপর আপনার নি‘আমত স্বীকার করছি এবং আমি আপনার সামনে আমার পাপ স্বীকার করছি, অতএব আপনি আমাকে ক্ষমা করুন। কারণ, আপনি ব্যতীত কেউ পাপ ক্ষমা করবে না।” \n“তিনি বলেন, যে এই কথাগুলোর প্রতি দৃঢ় আস্থা রেখে দিনের কোনো সময় তা বলে, অতঃপর সেদিন সন্ধার আগেই সে মারা যায়, তাহলে সে জান্নাতবাসী। আর যে তার প্রতি দৃঢ় আস্থা রেখে রাতের কোনো অংশে তা বলে, অতঃপর সকাল হওয়ার আগেই সে মারা যায় তাহলে সে জান্নাতবাসী।”", "enAttr": "Narrated by Al-Bukhāri", "bnAttr": "এটি বুখারী বর্ণনা করেছেন।", "heading": "باب أفضل الاستغفار", "std": "Bukhari 6306"}, "banner": "data:image/webp;base64,UklGRkCbAABXRUJQVlA4IDSbAAAwoAGdASqgA+YAPmEqkEWkIqGUem7wQAYEsjbiZBz2+Bj9eKuqLzE2djAfzt/93v4K9H+4M25k6fiL+qTd+s2Rr/P/0XZTxr8G/Zf5z94v7p7/3G/gR7Z++/tb+7fRV/Y8Zvmf9x+ufqJc6f9T/E/mZ82/9L/2v8j/ofhJ+if/P/j/3/+gH+l/1/9efXR/6v+R95P93/3H/f/yn/C+Av9D/uv/p/0/7//MB/jP+z/iv3/+SH9w/z3/c/yH+1+QD+u/5T/te19/s//t7kv+K/3H/29wz+ef5D/s/n/8Zf7g/8P5Pf7F/v/29/5PyO/s3/9/9n/zPgA/8fqAf9j//+wB6X/br+8/kJ77fIv73+T/9w9P/xz59+4f3b9kf7n/8/9j92v5zob7AP67/Cepn8i+zH3X+5f5L/bf3L9y/vV/Wf6T+/ft76G/HD+m/vP5MfIL+Rfyz+5f2f/Hf7b+7fut9mf3X/e/xfgH7d/rv99/mPYF9d/nn+e/uP+l/7H+U+DT4j/K/4L90v3/+ /* ------- audio (a picture of it: the words light up, there is no sound) ------- */
let timer = null, playing = false, pos = 0, rep = 1, repLeft = 1, speed = 1;
function stopAudio(){ clearInterval(timer); timer = null; playing = false; }
function audioBox(nWords){
  const box = el("section", "audio"); box.appendChild(el("h3", null, L("aTitle"))); box.lastChild.style.cssText = "text-align:center;color:var(--green)";
  const r1 = el("div", "arow");
  const prev = btn("abtn", "⏮", () => step(-1)); prev.setAttribute("aria-label", "Previous dua");
  const pl = btn("abtn play", L("play")); pl.setAttribute("aria-label", "Play");
  const nx = btn("abtn", "⏭", () => step(1)); nx.setAttribute("aria-label", "Next dua");
  const tr = el("div", "track"); const fill = el("i"); tr.appendChild(fill);
  r1.append(prev, pl, nx, tr); box.appendChild(r1);
  const r2 = el("div", "arow"); r2.appendChild(el("span", "alabel", L("speed")));
  for (const s of [0.75, 1, 1.25, 1.5]) { const b = btn("abtn", digits(s) + "×", () => { speed = s; r2.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }); b.setAttribute("aria-pressed", String(s === speed)); r2.appendChild(b); }
  box.appendChild(r2);

  for (const n of [1, 3, 7, 10, 33, Infinity]) { const b = btn("abtn", n === Infinity ? L("inf") : L("times", { n }), () => { rep = n; repLeft = n; r3.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }); b.setAttribute("aria-pressed", String(n === rep)); r3.appendChild(b); }
  box.appendChild(r3);
  const r4 = el("div", "arow"); const ps = btn("abtn", L("part"), () => { choosing = !choosing; picking = []; ps.setAttribute("aria-pressed", String(choosing)); lab.textContent = choosing ? L("partOn") : (part ? L("partSel", { a:part[0] + 1, b:part[1] + 1 }) : ""); });
  const clr = btn("abtn", L("partClear"), () => { part = null; choosing = false; picking = []; ps.setAttribute("aria-pressed", "false"); paintSel(); lab.textContent = ""; });
  const lg = btn("abtn", L("loopG"), (e) => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; e.currentTarget.setAttribute("aria-pressed", String(on)); });
  r4.append(ps, clr, lg); box.appendChild(r4);
  const lab = el("p", "alabel"); lab.id = "partLabel"; box.appendChild(lab);
  box.appendChild(el("p", "alabel", L("aNote")));
  const words = () => [...document.querySelectorAll("#duaAr .w")];
  pl.addEventListener("click", () => {
    if (playing) { stopAudio(); pl.textContent = L("play"); return; }
    playing = true; pl.textContent = L("pause"); repLeft = rep;
    const [a, b] = part ?? [0, nWords - 1]; if (pos < a || pos > b) pos = a;
    timer = setInterval(() => {
      words().forEach(w => w.classList.toggle("now", Number(w.dataset.i) === pos));
      fill.style.width = (100 * (pos - a + 1) / (b - a + 1)) + "%";
      pos++;

}
function pickWord(i){
  picking.push(i);
  if (picking.length === 2) { const a = Math.min(...picking), b = Math.max(...picking); part = [a, b]; choosing = false; picking = []; document.querySelectorAll(".audio .abtn")[0]; const lab = document.getElementById("partLabel"); if (lab) lab.textContent = L("partSel", { a:a + 1, b:b + 1 }); document.querySelectorAll(".audio .abtn").forEach(x => { if (x.textContent === L("part")) x.setAttribute("aria-pressed", "false"); }); pos = a; }

function paintSel(){ document.querySelectorAll("#duaAr .w").forEach(w => { const i = Number(w.dataset.i); w.classList.toggle("sel", part ? i >= part[0] && i <= part[1] : picking.includes(i)); }); }

/* ------- poster (A4) ------- */
const posterOpt = { ar:true, en:true, bn:false, wbw:false };
function posterEl(d){
  const a4 = el("div", "a4");
  a4.appendChild(topArch());
  const pt = el("div", "pt"); pt.appendChild(el("h2", null, title(d))); if (d.card || d.quran) pt.appendChild(el("span", null, d.card ? L("duaN", { n:d.card.n }) : `${d.sEn} ${digits(d.quran)}`)); a4.appendChild(pt);
  const len = d.ar.length;
  if (posterOpt.ar) { const p = arEl("par", d.ar); p.style.setProperty("--arfs", (len > 260 ? 3.2 : len > 140 ? 3.9 : 4.8) + "cqw"); a4.appendChild(p); }
  if (posterOpt.wbw && d.tokens) { const w = el("div", "pwbw"); for (const t of d.tokens) { const s = el("span"); const b = el("b", null, t.ar); b.lang = "ar"; const m = t.q ? (lang === "bn" ? t.q.bn : t.q.en) : (t.d ? t.d.lemma : ""); s.append(b, el("small", null, m || "·")); w.appendChild(s); } a4.appendChild(w); }
  const fs = (s) => (s?.length ?? 0) > 420 ? "2.2cqw" : (s?.length ?? 0) > 220 ? "2.6cqw" : "3cqw";
  if (posterOpt.en && d.meanEn) { const x = el("p", "ptx", d.meanEn); x.style.setProperty("--txfs", fs(d.meanEn)); a4.appendChild(x); }
  if (posterOpt.bn && d.meanBn) { const x = el("p", "ptx bn", d.meanBn); x.style.setProperty("--txfs", fs(d.meanBn)); a4.appendChild(x); }
  a4.appendChild(el("p", "pref", d.quran ? `Qur'an ${digits(d.quran)}` : (d.ref || "")));
  const im = el("img"); im.src = D.banner; im.alt = ""; a4.appendChild(im);
  requestAnimationFrame(() => fitPoster(a4));
  return a4;
}
/** The poster is one A4 page: shrink the text (never the frame or the banners) until everything fits. */
function fitPoster(a4){
  let k = 1;
  const parts = [...a4.querySelectorAll(".par,.ptx,.pwbw")];
  const base = parts.map(p => parseFloat(getComputedStyle(p).fontSize));
  while (a4.scrollHeight > a4.clientHeight + 1 && k > 0.45) { k -= 0.05; parts.forEach((p, i) => p.style.fontSize = (base[i] * k) + "px"); }
}
function openPoster(id){

/* ------- copy / share ------- */
const shareOpt = { ar:true, en:false, bn:false, wbw:false, src:true, as:"text" };
function shareText(d){
  const out = [title(d)];
  if (shareOpt.ar) out.push(d.ar);
  if (shareOpt.wbw && d.tokens) out.push(d.tokens.map(t => `${t.ar} = ${t.q ? (lang === "bn" ? t.q.bn : t.q.en) : (t.d?.lemma ?? "")}`).join("\n"));
  if (shareOpt.en && d.meanEn) out.push(d.meanEn);
  if (shareOpt.bn && d.meanBn) out.push(d.meanBn);
  if (shareOpt.src) out.push(d.quran ? `Qur'an ${d.quran}` : (d.ref || (d.card ? `Dua ${d.card.n}` : "")));
  return out.filter(Boolean).join("\n\n");
}

  const ld = el("label"); ld.style.cssText = lo.style.cssText; ld.appendChild(document.createTextNode(L("shWhen"))); const idt = el("input", "btn"); idt.type = "date"; idt.id = "sh-date"; idt.valueAsDate = new Date(); ld.appendChild(idt);
