<title>Dua Module Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;600&family=Source+Sans+3:wght@400;600;700&family=Tinos:wght@400;700&display=swap">
<style>
/* Layout: the app's Night page with a sticky menu bar of the seven Dua groups; a Dua opens as a full-screen
   Dua Card drawn like the Asma ul Husna poster (cream paper, green arch at the top, the template's own banner
   at the bottom). One deliberate look for the app (Night) and one for the card (the poster's paper). */
:root{
  --bg:#0d1830; --panel:#14223f; --panel2:#1a2b4f; --line:#2c3f66; --fg:#e8ecf5; --muted:#a9b4cc;
  --gold:#d9a94a; --gold-ink:#1a1405; --gold-soft:rgba(217,169,74,.14);
  --paper:#fbf6ea; --ink:#22201a; --ink-muted:#6b5f45; --green:#123f2c; --green2:#1d5a3f; --orange:#e2662b;
  --m-today:#2e9d5b; --m-next:#2f6fd0; --m-urgent:#d23b3b; --m-important:#c99212; --m-revise:#8a4fc7; --m-done:#1f8f8f;
  --ar:'Amiri Quran','Amiri','Traditional Arabic',serif; --ar2:'Amiri','Traditional Arabic',serif;
  --ui:'Source Sans 3','Segoe UI',system-ui,sans-serif; --bnf:'Hind Siliguri','Source Sans 3',sans-serif; --serif:'Tinos','Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden],.sheet[hidden],.saver[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.5}
body.bn{font-family:var(--bnf)}
.wrap>*,.sheet-in>*{min-width:0}
.wrap{max-width:960px;margin:0 auto;padding-block:14px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-size:1.4rem;margin:0;text-wrap:balance}
h2{font-size:1.12rem;margin:0;text-wrap:balance}
h3{font-size:1rem;margin:0}
p{margin:0}
.lead{color:var(--muted);max-width:70ch}
.ownwin{display:inline-flex;align-items:center;text-decoration:none;font-weight:700}
.ver{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums;vertical-align:middle}
.toprow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;color:var(--fg);border:0;padding:8px 14px;font:inherit;cursor:pointer;min-height:40px}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);font-weight:700}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* the menu bar */
.menubar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.menubar nav{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.pd{display:grid;text-align:start;min-height:48px;border:1px solid var(--gold)!important;background:var(--panel)!important;color:var(--fg);border-radius:12px;padding:4px 14px;cursor:pointer;max-width:100%}
.pd small{color:var(--muted);font-size:.74rem;font-weight:400}
.pd b{white-space:normal;line-height:1.25}
.pull{position:absolute;top:calc(100% + 6px);z-index:8;width:min(92vw,380px);max-height:70vh;overflow:auto;background:var(--panel2);border:1px solid var(--gold);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:grid;gap:2px}
.pitem{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:42px;width:100%;text-align:start;background:transparent;border:0;border-radius:8px;color:var(--fg);padding:6px 10px;cursor:pointer;font-weight:600}
.pitem:hover,.pitem:focus-visible{background:var(--panel)}
.pitem[aria-current=true]{background:var(--gold);color:var(--gold-ink)}
.pitem .c{color:inherit;opacity:.75;font-weight:400;font-variant-numeric:tabular-nums}
.pitem.small{font-weight:400;font-size:.92rem;min-height:38px}
.psub{display:grid;gap:2px;padding-inline-start:14px;border-inline-start:2px solid var(--line);margin:0 0 4px 10px}
.pop{position:fixed;inset:0;z-index:30;background:rgba(4,8,18,.6);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.popcard{width:min(100%,560px);max-height:86vh;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--green);box-shadow:inset 0 0 0 2px var(--orange);border-radius:14px;padding:12px 14px;display:grid;gap:10px;font-family:var(--serif)}
.pophead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pophead h3{color:var(--green);font-size:1.1rem}
.pophead .btn{color:var(--green);border-color:var(--green2);background:#fff;font-family:var(--ui)}
.cardmenu{background:#f2ead3;border:1.5px solid var(--green2);border-radius:12px;padding:8px}
.menubar .old{flex:0 0 auto;min-height:42px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-weight:600}
.menubar button[aria-current=true]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.menubar button .c{opacity:.75;font-weight:400;margin-inline-start:6px;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.crumb{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:10px;border:1px solid var(--gold);color:var(--gold);background:transparent;cursor:pointer;font-weight:600}
.where{color:var(--muted);font-size:.9rem}
.sec{display:grid;gap:10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head small{color:var(--muted)}
.btn{min-height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);padding:6px 14px;cursor:pointer}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.solid{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.btn[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.note{color:var(--muted);font-size:.9rem;border-inline-start:3px solid var(--gold);padding-inline-start:10px;max-width:74ch}
.gap{color:var(--muted);font-size:.88rem;font-style:italic}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px}
.tile{display:flex;gap:10px;align-items:center;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);cursor:pointer;min-height:56px}
.tile .ic{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);font-size:1.05rem}
.tile b{display:block;font-weight:600;line-height:1.25}
.tile span{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.tile .arb{font-family:var(--ar2);font-size:1rem;direction:rtl}
/* numbered rows */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 8px}
.row .no{min-width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.row .open{all:unset;cursor:pointer;display:grid;gap:2px;min-width:0}
.row .open:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.row .t{font-weight:600;line-height:1.3}
.row .a{font-family:var(--ar);font-size:1.22rem;direction:rtl;text-align:right;line-height:1.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.row .m{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.row .side{display:flex;gap:6px;align-items:center}
.mk{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:700;color:#fff;white-space:nowrap}
.icon{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font-size:1.05rem;display:grid;place-items:center}
.icon[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.manage{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0 0 46px}
.manage .btn{min-height:36px;padding:4px 10px;font-size:.86rem}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:16px;display:grid;gap:8px}
form.add{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
form.add label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
form.add input,form.add textarea,form.add select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
form.add textarea{font-family:var(--ar);font-size:1.2rem;direction:rtl;min-height:70px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;min-height:36px}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem;color:var(--muted)}
/* overlay sheets */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(4,8,18,.78);overflow:auto;padding-block:max(12px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:820px;margin:0 auto;display:grid;gap:10px}
.sheetbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:rgba(4,8,18,.92);padding:6px 0;border-radius:10px}
.sheetbar .sp{flex:1}
/* the Dua Card: the Asma ul Husna poster's paper */
.card{background:var(--paper);color:var(--ink);border-radius:14px;border:10px solid var(--green);box-shadow:inset 0 0 0 2px var(--orange);padding:0 0 10px;overflow:hidden;font-family:var(--serif)}
.arch{position:relative;margin:0 auto;width:min(92%,560px);background:var(--green);color:#f6e7b6;text-align:center;padding:12px 16px 14px;border-radius:0 0 50% 50% / 0 0 26px 26px;box-shadow:0 0 0 2px var(--gold) inset}
.arch::before{content:"";position:absolute;inset:-10px 18% auto;height:24px;background:var(--green);border-radius:50% 50% 0 0;box-shadow:0 -2px 0 2px var(--gold)}
.arch .ph{position:relative;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85;border:1px dashed rgba(246,231,182,.6);border-radius:8px;padding:6px 10px}
.arch .ph b{display:block;font-family:var(--ar2);font-size:1.3rem;letter-spacing:0;text-transform:none;opacity:1}
.cardin{padding:12px 16px;display:grid;gap:12px}
.ctitle{text-align:center;display:grid;gap:2px}
.ctitle h2{font-family:var(--serif);font-size:1.35rem;color:var(--green)}
body.bn .ctitle h2{font-family:var(--bnf)}
.ctitle span{color:var(--orange);font-size:.95rem}
.ctitle small{color:var(--ink-muted);font-family:var(--ui);font-variant-numeric:tabular-nums}
.duaar{border:2px solid var(--orange);border-radius:14px;padding:12px 14px;direction:rtl;text-align:center;font-family:var(--ar);font-size:1.75rem;line-height:2.25;color:#0f3a28;background:#fffdf6}
.w{cursor:pointer;border-radius:6px;padding:0 3px;border-bottom:2px dotted #c9a24d}
.w.d{border-bottom-color:#8aa39a}
.w.n{border-bottom:0;cursor:default}
.w.sel{background:rgba(226,102,43,.22)}
.w.now{background:rgba(46,157,91,.32)}
.w:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wlegend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-family:var(--ui);font-size:.8rem;color:var(--ink-muted)}
.wlegend i{display:inline-block;width:22px;border-bottom:2px dotted #c9a24d;margin-inline-end:6px;vertical-align:middle}
.wlegend i.d{border-color:#8aa39a}
.mean{font-size:1.05rem;line-height:1.55;max-width:70ch;margin:0 auto}
body.bn .mean{font-family:var(--bnf)}
.mean small{display:block;color:var(--ink-muted);font-family:var(--ui);font-size:.82rem;margin-top:4px}
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;font-family:var(--ui)}
.refbox{border:1.5px solid var(--orange);border-radius:12px;padding:6px 10px 8px;text-align:center}
.refbox b{display:inline-block;background:var(--green);color:#fff;border-radius:999px;padding:1px 10px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.refbox div{color:var(--ink)}
.cbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-family:var(--ui)}
.cbtn{min-height:40px;border-radius:10px;border:1.5px solid var(--green2);background:#fff;color:var(--green);padding:6px 12px;cursor:pointer;font-weight:600}
.cbtn[aria-pressed=true]{background:var(--green);color:#fff}
.plan{display:grid;gap:6px;font-family:var(--ui)}
.plan h3{color:var(--green);text-align:center}
.planrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pbtn{min-height:38px;border-radius:999px;border:2px solid var(--c);background:#fff;color:var(--c);padding:4px 12px;cursor:pointer;font-weight:700;font-size:.88rem}
.pbtn[aria-pressed=true]{background:var(--c);color:#fff}
.stages{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-family:var(--ui)}
.stages button{min-height:38px;border:1.5px solid var(--green2);border-radius:10px;background:#fff;color:var(--green);cursor:pointer;padding:4px 10px;font-size:.88rem}
.stages button[aria-pressed=true]{background:var(--green);color:#fff;font-weight:700}
.bottombanner{display:block;width:calc(100% - 24px);margin:2px auto 0;border-radius:8px}
/* audio */
.audio{font-family:var(--ui);background:#f2ead3;border:1.5px solid var(--green2);border-radius:12px;padding:10px;display:grid;gap:8px}
.arow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.abtn{min-width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--green2);background:#fff;color:var(--green);cursor:pointer;font-size:1.05rem;font-weight:700;padding:0 10px}
.abtn[aria-pressed=true]{background:var(--green);color:#fff}
.abtn.play{min-width:64px;background:var(--green);color:#fff;font-size:1.3rem}
.track{flex:1 1 180px;height:8px;border-radius:999px;background:#d8cfb4;overflow:hidden;min-width:120px}
.track i{display:block;height:100%;width:0;background:var(--orange)}
.alabel{font-size:.82rem;color:var(--ink-muted);text-align:center}
/* panels inside sheets */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.wc-from{display:flex;align-items:center;gap:10px;background:var(--gold);color:var(--gold-ink);padding:8px 12px;border-radius:10px;font-weight:700}
.wc-from span{flex:1;min-width:0}
.wc-from button{background:var(--gold-ink);color:var(--gold);border:0;border-radius:8px;min-height:36px;padding:4px 12px;cursor:pointer}
.wc-ar{font-family:var(--ar);font-size:2.3rem;color:#f0c97a;text-align:center;line-height:1.6}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cell{background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 10px}
.cell small{display:block;color:var(--ink-muted);font-size:.76rem}
.cell .v{font-weight:600}
.cell .v.ar{font-family:var(--ar);font-size:1.45rem;direction:rtl}
/* poster */
.posterwrap{display:grid;gap:10px;justify-items:center}
.a4{width:min(100%,560px);aspect-ratio:210/297;background:var(--paper);color:var(--ink);border:12px solid var(--green);box-shadow:inset 0 0 0 2px var(--orange);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;font-family:var(--serif);container-type:inline-size}
.a4 .arch{width:80%;padding:2.2cqw 3cqw}
.a4 .arch .ph{font-size:2.2cqw}
.a4 .arch .ph b{font-size:3.6cqw}
.a4 .pt{text-align:center;margin-top:3cqw}
.a4 .pt h2{font-size:4.6cqw;color:var(--green)}
.a4 .pt span{font-size:3cqw;color:var(--orange)}
.a4 .par{margin:2.4cqw 5cqw 0;border:.4cqw solid var(--orange);border-radius:3cqw;padding:2cqw 3cqw;font-family:var(--ar);direction:rtl;text-align:center;font-size:var(--arfs,4.6cqw);line-height:1.95;color:#0f3a28;background:#fffdf6}
.a4 .ptx{margin:2cqw 6cqw 0;font-size:var(--txfs,2.9cqw);line-height:1.4;text-align:justify}
.a4 .ptx.bn{font-family:var(--bnf)}
.a4 .pwbw{font-size:1.7cqw;margin:2cqw 5cqw 0;display:flex;flex-wrap:wrap;gap:1cqw;direction:rtl;justify-content:center}
.a4 .pwbw span{display:grid;text-align:center;border:.25cqw solid #e0c9a5;border-radius:1.4cqw;padding:.6cqw 1cqw;min-width:9cqw}
.a4 .pwbw b{font-family:var(--ar);font-size:1.9em;font-weight:400;color:#0f3a28}
.a4 .pwbw small{font-size:1em;direction:ltr;color:var(--ink-muted)}
.a4 .pref{margin:auto 6cqw 0;flex:0 0 auto;text-align:center;font-size:2.2cqw;color:var(--ink-muted);font-family:var(--ui)}
.a4 img{flex:0 0 auto;width:94%;margin:1.5cqw auto 1.5cqw;display:block}
/* share */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;min-height:38px;background:var(--panel2)}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;max-height:220px;overflow:auto;font-size:.92rem}
.logtbl{width:100%;border-collapse:collapse;font-size:.88rem}
.logtbl th,.logtbl td{border-bottom:1px solid var(--line);padding:6px;text-align:start;vertical-align:top}
.tblwrap{overflow-x:auto}
/* screensaver */
.saver{position:fixed;inset:0;z-index:40;background:#050a14;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.saver .a4{width:min(92vw,62vh)}
.saver .close{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.ahph{display:grid;place-items:center;text-align:center;gap:2cqw;padding:6cqw;flex:1;font-size:3cqw;color:var(--green)}
.ahph b{font-family:var(--ar2);font-size:9cqw;color:var(--green)}
/* plan box */
.planbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.planbox ol{margin:0;padding-inline-start:0;list-style:none;display:grid;gap:6px}
.planbox li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--panel2);border-radius:10px;padding:8px 10px}
.planbox li b.id{color:var(--gold);font-variant-numeric:tabular-nums;min-width:40px}
.planbox li .wh{font-size:.8rem;color:var(--muted)}
.tag{font-size:.74rem;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.tag.demo{border-color:var(--ok,#5fbf8f);color:#7fd8a8}
.tag.gate{border-color:#e27b5b;color:#f0a58c}
.tag.tarch{border-color:#7aa2e8;color:#a9c3f2}
@media (max-width:520px){ .duaar{font-size:1.45rem} .row .a{font-size:1.1rem} .manage{padding-inline-start:0} }
@media (prefers-reduced-motion:reduce){ .track i{transition:none} }
</style>
