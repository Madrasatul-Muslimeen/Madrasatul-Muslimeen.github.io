  for (const [k, lab] of [["text","shText"],["img","shImg"]]) { const l = el("label"); const r = el("input"); r.type = "radio"; r.name = "shas"; r.id = "shas-" + k; r.checked = shareOpt.as === k; r.addEventListener("change", () => { shareOpt.as = k; openShare(id); }); l.append(r, document.createTextNode(L(lab))); as.appendChild(l); }
  p.appendChild(as);
  const pv = el("div", "preview"); pv.dir = "auto"; pv.textContent = shareText(d);
  if (shareOpt.as === "img") { const keep = { ...posterOpt }; Object.assign(posterOpt, { ar:shareOpt.ar, en:shareOpt.en, bn:shareOpt.bn, wbw:shareOpt.wbw }); const w = el("div", "posterwrap"); const a = posterEl(d); a.style.width = "min(100%,320px)"; w.appendChild(a); p.appendChild(w); Object.assign(posterOpt, keep); }
  else p.appendChild(pv);
  const cp = btn("btn solid", L("shCopy"), () => { navigator.clipboard?.writeText(shareText(d)).then(() => toast(L("shCopied")), () => { toast(L("shCopyFail")); const r = document.createRange(); r.selectNodeContents(pv); getSelection().removeAllRanges(); getSelection().addRange(r); }) ?? toast(L("shCopyFail")); });
  p.appendChild(cp);
  // D15 who it is for
  const t = el("section", "panel"); t.appendChild(el("h3", null, L("shTrack")));
  const mk = (lab, opts, id) => { const l = el("label"); l.style.cssText = "display:grid;gap:4px;color:var(--muted);font-size:.88rem"; l.appendChild(document.createTextNode(L(lab))); const s = el("select", "btn"); s.id = id; for (const k of opts) s.appendChild(new Option(L(k), k)); l.appendChild(s); return [l, s]; };
  const [lm, sm] = mk("shMedia", ["mWhats","mFb","mMail","mPrint","mMasjid","mOther"], "sh-media");
  const [lw, sw] = mk("shWho", ["wFam","wStu","wTea","wMas","wPub","wOther"], "sh-who");
  const lo = el("label"); lo.style.cssText = "display:grid;gap:4px;color:var(--muted);font-size:.88rem"; lo.appendChild(document.createTextNode(L("shOcc"))); const io = el("input", "btn"); io.id = "sh-occ"; io.placeholder = lang === "bn" ? "যেমন জুমুআ, রমাদান, পরীক্ষা" : "e.g. Jumu'ah, Ramadan, exams"; lo.appendChild(io);
  const ld = el("label"); ld.style.cssText = lo.style.cssText; ld.appendChild(document.createTextNode(L("shWhen"))); const idt = el("input", "btn"); idt.type = "date"; idt.id = "sh-date"; idt.valueAsDate = new Date(); ld.appendChild(idt);
  const grid = el("div", "tiles"); grid.append(lm, lw, lo, ld); t.appendChild(grid);
  t.appendChild(btn("btn gold", L("shLog"), () => { shareLog.unshift({ t:title(d), m:sm.value, w:sw.value, o:io.value, d:idt.value, what:Object.keys(shareOpt).filter(k => shareOpt[k] === true).join("+"), as:shareOpt.as }); toast(L("shLogged")); openShare(id); }));
  if (shareLog.length) {
    t.appendChild(el("h3", null, L("shLogH")));
    const tw = el("div", "tblwrap"); const tb = el("table", "logtbl"); const hr = el("tr"); for (const h of [L("shWhen"), lang === "bn" ? "দুআ" : "Dua", L("shMedia"), L("shWho"), L("shOcc"), L("shWhat")]) hr.appendChild(el("th", null, h)); tb.appendChild(hr);
    for (const x of shareLog) { const r = el("tr"); for (const v of [digits(x.d), x.t, L(x.m), L(x.w), x.o || "—", x.what + " · " + (x.as === "img" ? L("shImg") : L("shText"))]) r.appendChild(el("td", null, v)); tb.appendChild(r); }
    tw.appendChild(tb); t.appendChild(tw);
  }
  sheetStack = [reopen]; openSheet([bar, p, t], true); sheetStack = [reopen];
}

/* ------- morning and evening routine (from v1.01) ------- */
function openRoutine(){
  const bar = el("div", "sheetbar"); bar.append(btn("back", L("back"), closeSheet), el("span", "sp"));
  const p = el("section", "panel"); p.appendChild(el("h2", null, L("morning")));
  const lbl = el("p", "where"); p.appendChild(lbl); p.appendChild(el("p", "note", L("rNote")));
  const paint = () => { const d = D.adhkar.filter((a, i) => (counts[i] || 0) >= a.count).length; lbl.textContent = L("rDone", { d, n:D.adhkar.length }); };
  D.adhkar.forEach((a, i) => {
    const c = el("div", "panel"); c.style.background = "var(--panel2)";
    c.appendChild(arEl("duaar", a.ar)); c.lastChild.style.fontSize = "1.35rem";
    c.appendChild(el("p", null, a.en));
    const b = btn("btn gold"); const pb = () => { const n = counts[i] || 0; b.textContent = n >= a.count ? "✓" : `${L("rTap")} ${digits(n)} / ${digits(a.count)}`; };
    b.addEventListener("click", () => { counts[i] = Math.min(a.count, (counts[i] || 0) + 1); pb(); paint(); }); pb(); c.appendChild(b); p.appendChild(c);
  });
  p.appendChild(btn("btn", L("rReset"), () => { for (const k in counts) delete counts[k]; openRoutine(); }));
  paint(); openSheet([bar, p]);
}

/* ------- the build plan ------- */
function renderPlan(){
  const p = document.getElementById("planbox"); p.textContent = "";
  p.append(el("h2", null, L("planTitle")), el("p", "where", L("planSub")));
  const ol = el("ol");
  for (const [id, en, bn, tags] of PLAN) {
    const li = el("li"); li.append(el("b", "id", id), el("span", null, lang === "bn" ? bn : en));
    const tg = el("span"); tg.style.cssText = "display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end";
    for (const t of tags) tg.appendChild(el("span", "tag " + (t === "demo" ? "demo" : t === "gate" ? "gate" : t === "arch" ? "tarch" : ""), L(t === "demo" ? "tDemo" : t === "gate" ? "tGate" : t === "arch" ? "tArch" : "tAns")));
    li.appendChild(tg); ol.appendChild(li);
  }
  p.appendChild(ol);
}

const setPressed = (a, b) => { a.setAttribute("aria-pressed", "true"); b.setAttribute("aria-pressed", "false"); };
document.getElementById("langEn").onclick = (e) => { lang = "en"; setPressed(e.currentTarget, document.getElementById("langBn")); render(); renderPlan(); };
document.getElementById("langBn").onclick = (e) => { lang = "bn"; setPressed(e.currentTarget, document.getElementById("langEn")); render(); renderPlan(); };
render(); renderPlan();
</script>
