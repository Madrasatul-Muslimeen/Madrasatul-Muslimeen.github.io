<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keys Wheel Demo</title>
<style>
:root{--bg:#f7f4ec;--card:#fffdf8;--ink:#1d2a3a;--mut:#5b6675;--line:#ddd5c4;--navy:#1f3a5f;--gold:#b8892b;
--hard:#d64545;--gharib:#7b4bc4;--wujuh:#c27c0e;--hadith:#2e8b57;--scholars:#2f6db5;--quran:#138a8a;--siyaq:#8a5a2b;--asbab:#c2185b;--none:#e7e1d4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a22;--card:#1c2430;--ink:#e8edf3;--mut:#a3adbb;--line:#334050;--navy:#9cc0ea;--none:#2b3543}}
:root[data-theme="dark"]{--bg:#141a22;--card:#1c2430;--ink:#e8edf3;--mut:#a3adbb;--line:#334050;--navy:#9cc0ea;--none:#2b3543}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
.top{padding:14px 16px 6px;max-width:1200px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 4px;color:var(--navy)}.sub{color:var(--mut);margin:0;font-size:.92rem}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;max-width:1200px;margin:0 auto}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;min-height:40px;font:inherit;font-size:.92rem;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.chip{display:inline-flex;align-items:center;gap:6px}.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.lab{font-size:.8rem;color:var(--mut);align-self:center;margin-right:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:14px;padding:6px 16px 24px;max-width:1200px;margin:0 auto}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.wheel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;min-width:0}
.wheel svg{width:100%;height:auto;display:block;max-height:78vh}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;max-height:none}
.panel h2{font-size:1.05rem;margin:0 0 6px;color:var(--navy)}.panel h3{font-size:.95rem;margin:14px 0 6px;color:var(--navy)}
.ar{font-family:"Amiri","Scheherazade New","Traditional Arabic",serif;font-size:1.45rem;line-height:2;direction:rtl;text-align:right}
.arsm{font-family:"Amiri","Scheherazade New","Traditional Arabic",serif;font-size:1.05rem;line-height:1.9;direction:rtl;text-align:right}
.key{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}.key:first-of-type{border-top:0}
.tag{font-size:.72rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.auto{border-color:var(--hadith);color:var(--hadith)}.tag.you{border-color:var(--hard);color:var(--hard)}.tag.sug{border-color:var(--wujuh);color:var(--wujuh)}
.era{border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
.era>summary{cursor:pointer;padding:8px 10px;background:color-mix(in srgb,var(--scholars) 10%,transparent);font-weight:600;list-style:none}
.era>summary::-webkit-details-marker{display:none}
.src{padding:8px 10px;border-top:1px solid var(--line)}.src b{color:var(--navy)}.meta{font-size:.8rem;color:var(--mut)}
.had{border-left:3px solid var(--hadith);padding:4px 8px;margin:8px 0}
.note{font-size:.85rem;color:var(--mut);background:color-mix(in srgb,var(--gold) 12%,transparent);border-radius:8px;padding:8px 10px;margin:8px 0}
select{font:inherit;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 8px;min-width:0}
.seg{cursor:pointer}.seg:hover{opacity:.8}.sel{stroke:var(--ink);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.82rem;color:var(--mut);padding:6px 4px}
.bar .btn{}
@media (max-width:600px){.bar{gap:5px}.bar .btn{padding:6px 9px;min-height:40px;font-size:.85rem}}
.more{background:none;border:0;color:var(--scholars);cursor:pointer;font:inherit;font-size:.85rem;padding:0}
</style></head><body>

e, everyone","মুলত একটি বিশেষ্য অর্থ: ‘প্রত্যেকে, সকলে, সবকিছুই, সার্বজনিন’"],["شَىْءٍۢ","شَىْء",283,0,"things","জিনিসের","thing","যে কোনো বস্তু, দ্রব্য, জিনিস, ব্যাপার, বিষয়"],["وَإِلَيْهِ","إِلَىٰ",742,0,"and to Him","এবং তাঁরই দিকে","to, towards",""],["تُرْجَعُونَ","رَجَعَ",79,0,"you will be returned","তোমাদেরকে ফিরিয়ে নেয়া হবে","to return, to come back","ফিরে আসা, পুনরায় আসা, প্রত্যাবর্তন করা, আশ্রয় নেওয়া, ফিরে যাওয়া"]]}],"ruku":[[1,12],[13,32],[33,50],[51,67],[68,83]],"ysHadith":{"36:38":[["Musnad Ahmad",null,"- حدثنا وكيع، حدثنا الأعمش، عن إبراهيم التيمي، عن أبيه، عن أبي ذر، قال: سألت النبي صلى الله عليه وسلم عن قوله تعالى: {والشمس تجري لمستقر لها} [يس: 38] قال: \"مستقرها تحت العرش \" (2)"],["Musnad Ahmad",null,"- حدثنا ابن نمير، ومحمد بن عبيد، قالا: حدثنا الأعمش، عن إبراهيم التيمي، عن أبيه، قال: قال أبو ذر: بينما أنا مع رسول الله صلى الله عليه وسلم في المسجد حين وجبت الشمس قال: \"يا أبا ذر، أين تذهب الشمس؟ \" قلت: الله ورسوله أعلم. قال: \"فإنها تذهب حتى تسجد بين يدي ربها عز وجل ثم تستأذن فيؤذن لها وكأنها قد قيل لها: ارجعي من حيث جئت، فتطلع من مكانها، وذلك مستقر لها \". قال محمد: ثم قرأ: {والشمس تجري لمستقر لها} [يس: 38] (2)"],["Musnad Ahmad",null,"- حدثنا وكيع، حدثنا الأعمش، عن إبراهيم التيمي، عن أبيه، عن أبي ذر، قال: سألت رسول الله صلى الله عليه وسلم عن قول الله عز وجل: {والشمس تجري لمستقر لها} [يس: 38] قال: \"مستقرها تحت العرش \" (2)"],["Musnad Ahmad",null,"- حدثنا محمد بن عبيد، حدثنا الأعمش، عن إبراهيم التيمي، عن أبيه، عن أبي ذر، قال: كنت مع رسول الله صلى الله عليه وسلم في المسجد حين وجبت الشمس، فقال: \"يا أبا ذر، تدري أين تذهب الشمس؟ \" قلت: الله ورسوله أعلم. قال: \"فإنها تذهب حتى تسجد بين يدي ربها، فتستأذن في الرجوع، فيؤذن لها وكأنها قد قيل لها: ارجعي من حيث جئت، فترجع إلى مطلعها، فذلك مستقرها \" ثم قرأ: {والشمس تجري لمستقر لها} [يس: 38] (1)"],["Muslim","159","(159) حدثنا أبو سعيد الأشج، وإسحاق بن إبراهيم، قال إسحاق: أخبرنا، وقال الأشج، حدثنا وكيع، حدثنا الأعمش، عن إبراهيم التيمي، عن أبيه، عن أبي ذر، قال: سألت رسول الله صلى الله عليه وسلم عن قول الله تعالى: {والشمس تجري لمستقر لها} [يس: 38]؟ قال: «مستقرها تحت العرش»"],["Bukhari",4802,"حدثنا أبو نعيم حدثنا الأعمش عن إبراهيم التيمي عن أبيه عن أبي ذر رضي الله عنه قال * كنت مع النبي صلى الله عليه وسلم في المسجد عند غروب الشمس فقال يا أبا ذر أتدري أين تغرب الشمس قلت الله ورسوله أعلم قال فإنها تذهب حتى تسجد تحت العرش فذلك قوله تعالى والشمس تجري لمستقر لها ذلك تقدير العزيز العليم \\ 1 \\"],["Bukhari",3199,"حدثنا محمد بن يوسف حدثنا سفيان عن الأعمش عن إبراهيم التيمي عن أبيه عن أبي ذر رضي الله عنه قال قال النبي صلى الله عليه وسلم لأبي ذر حين غربت الشمس * تدري أين تذهب قلت الله ورسوله أعلم قال فإنها تذهب حتى تسجد تحت العرش فتستأذن فيؤذن لها ويوشك أن تسجد فلا يقبل منها وتستأذن فلا يؤذن لها يقال لها ارجعي من حيث جئت فتطلع من مغربها فذلك قوله تعالى والشمس تجري لمستقر لها ذلك تقدير العزيز العليم \\ 1 \\"]],"36:12":[["Tirmidhi",3226,"بسم الله الرحمن الرحيم حدثنا محمد بن وزير الواسطي حدثنا إسحاق بن يوسف الأزرق عن سفيان الثوري عن أبي نضرة عن أبي سعيد الخدري قال * كانت بنو سلمة في ناحية المدينة فأرادوا النقلة إلى قرب المسجد فنزلت هذه الآية إنا نحن نحيي الموتى ونكتب ما قدموا وآثارهم فقال رسول الله صلى الله عليه وسلم إن آثاركم تكتب فلم ينتقلوا قال هذا حديث حسن غريب من حديث الثوري وأبو سفيان هو طريف السعدي"]],"36:58":[["Ibn Majah",184,"حدثنا محمد بن عبد الملك بن أبي الشوارب ثنا أبو عاصم العباداني ثنا الفضل الرقاشي عن محمد بن المنكدر عن جابر بن عبد الله قال قال رسول الله صلى الله عليه وسلم * بينا أهل الجنة في نعيمهم إذ سطع لهم نور فرفعوا رؤوسهم فإذا الرب قد أشرف عليهم من فوقهم فقال السلام عليكم يا أهل الجنة قال وذلك قول الله سلام قولا من رب رحيم قال فينظر إليهم وينظرون إليه فلا يلتفتون إلى شيء من النعيم ما داموا ينظرون إليه حتى يحتجب عنهم ويبقى نوره وبركته عليهم في ديارهم"]]}}</script>

َ عن رءوسهم، وخرج رسولُ الله ﷺ وأبو ب","mawsoo-at-al-tafsir-al-ma-thoor|12":"﴿إِنَّا نَحۡنُ نُحۡیِ ٱلۡمَوۡتَىٰ وَنَكۡتُبُ مَا قَدَّمُوا۟ وَءَاثَـٰرَهُمۡۚ وَكُلَّ شَیۡءٍ أَحۡصَیۡنَـٰهُ فِیۤ إِمَامࣲ مُّبِینࣲ ۝١٢﴾ - نزول الآية\n\n٦٤٣٨٩- عن أبي سعيد الخدري -من طريق أبي نضرة- قال: كان بنو سَلِمة في ناحية من المدينة، فأرادوا أن ينتقلوا إلى قُرْب المسجد؛ فأنزل الله: ﴿إنّا نَحْنُ نُحْيِ المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهُمْ﴾، فدعاهم رسول الله ﷺ، فقال: «إنه يُكتب آثاركم». ثم قرأ عليهم الآية، فتركوا[[أخرجه الترمذي ٥/٤٣٨ (٣٥٠٦)، والحاكم ٢/٤٦٥ (٣٦٠٤)، وابن جرير ١٩/٤١٠، وابن أبي حاتم -كما في تفسير ابن كثير ٦/٥٦٦-.\n\nقال الترمذي: «هذا حديث حسن غريب مِن حديث الثوري». وقال الحاكم: «هذا حديث صحيح عجيب من حديث الثوري». وتعقَّبه الذهبيُّ في التلخيص بقوله: «تفرّد به إسحاقُ الأزرق عنه،","mawsoo-at-al-tafsir-al-ma-thoor|38":"﴿وَٱلشَّمۡسُ تَجۡرِی لِمُسۡتَقَرࣲّ لَّهَاۚ ذَ ٰ⁠لِكَ تَقۡدِیرُ ٱلۡعَزِیزِ ٱلۡعَلِیمِ ۝٣٨﴾ - قراءات\n\n٦٤٦١٠- عن أبي ذرٍّ، قال: دخلتُ المسجدَ ورسولُ الله ﷺ جالس، فلما غربت الشمس قال: «يا أبا ذر، هل تدري أين تذهب هذه؟». قال: قلت: الله ورسوله أعلم. قال: «فإنها تذهب تستأذن في السجود، فيؤذن لها، وكأنها قد قيل لها: ارجعي من حيث جئت، فتطلع من مغربها». ثم قرأ: (وذَلِكَ مُسْتَقَرٌّ لَّها). في قراءة عبد الله [بن مسعود][[أخرجه البخاري ٩/١٢٥ (٧٤٢٤)، ومسلم ١/١٣٩ (١٥٩)، وابن جرير ١٩/٤٣٥.\n\nوهي قراءة شاذة.]]. (١٢/٣٤٧)\n\n٦٤٦١١- عن عبد الله بن مسعود، أنه كان يقرأ: (والشَّمْسُ تَجْرِي لا مُسْتَقَرَّ لَها)[[تفسير الثعلبي ٨/١٢٨، وأخرجه البغوي ٧/١٨.\n\nوهي قراءة شاذة، تروى أيضًا عن عكرمة. انظر: الجامع لأحكام القرآن ١٧","ar-tafsir-al-tabari|8":"القول في تأويل قوله تعالى: ﴿إِنَّا جَعَلْنَا فِي أَعْنَاقِهِمْ أَغْلالا فَهِيَ إِلَى الأذْقَانِ فَهُمْ مُقْمَحُونَ (٨) وَجَعَلْنَا مِنْ بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَأَغْشَيْنَاهُمْ فَهُمْ لا يُبْصِرُونَ (٩) ﴾\n\nيقول تعالى ذكره: إنا جعلنا أيمان هؤلاء الكفار مغلولة إلى أعناقهم بالأغلال، فلا تُبسط بشيء من الخيرات. وهي في قراءة عبد الله فيما ذُكر ﴿إِنَّا جَعَلْنَا فِي أَيْمَانِهِمْ أَغْلالا فَهِيَ إِلَى الأذْقَانِ﴾ وقوله ﴿إِلَى الأذْقَانِ﴾ يعني: فأيمانهم مجموعة بالأغلال في أعناقهم، فكُني عن الأيمان، ولم يجر لها ذكر لمعرفة السامعين بمعنى الكلام، وأن الأغلال إذا كانت في الأعناق لم تكن إلا وأيدي المغلولين مجموعة بها إليها، فاستغنى بذكر كون الأغلال في الأعناق من ذكر الأيمان، ك","ar-tafsir-al-tabari|12":"القول في تأويل قوله تعالى: ﴿إِنَّا نَحْنُ نُحْيِي الْمَوْتَى وَنَكْتُبُ مَا قَدَّمُوا وَآثَارَهُمْ وَكُلَّ شَيْءٍ أحْصَيْنَاهُ فِي إِمَامٍ مُبِينٍ (١٢) ﴾\n\nيقول تعالى ذكره ﴿إِنَّا نَحْنُ نُحْيِي الْمَوْتَى﴾ من خلقنا ﴿وَنَكْتُبُ مَا قَدَّمُوا﴾ في الدنيا من خير وشر، وصالح الأعمال وسيئها.\n\nوبنحو الذي قلنا في ذلك قال أهل التأويل.\n\nذكر من قال ذلك:\n\n⁕ حدثنا بشر، قال: ثنا يزيد، قال: ثنا سعيد، عن قتادة، قوله ﴿إِنَّا نَحْنُ نُحْيِي الْمَوْتَى وَنَكْتُبُ مَا قَدَّمُوا﴾ من عمل.\n\n⁕ حدثني يونس، قال: أخبرنا إبن وهب، قال: قال ابن زيد، في قوله ﴿وَنَكْتُبُ مَا قَدَّمُوا﴾ قال: ما عملوا.\n\n⁕ حدثني محمد بن عمرو، قال: ثنا أبو عاصم، قال: ثنا عيسى؛ وحدثني الحارث، قال: ثنا الحسن، قال: ثنا ورقاء، جميعا عن ابن أبي نجيح","ar-tafsir-al-tabari|38":"القول في تأويل قوله تعالى: ﴿وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهَارَ فَإِذَا هُمْ مُظْلِمُونَ (٣٧) وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَهَا ذَلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ (٣٨) ﴾\n\nيقول تعالى ذكره: ودليل لهم أيضًا على قدرة الله على فعل كل ما شاء ﴿اللَّيْلُ نَسْلَخُ مِنْهُ النَّهَارَ﴾ يقول: ننزع عنه النهار. ومعنى \"منه\" في هذا الموضع: عنه، كأنه قيل: نسلخ عنه النهار، فنأتي بالظلمة ونذهب بالنهار. ومنه قوله ﴿وَاتْلُ عَلَيْهِمْ نَبَأَ الَّذِي آتَيْنَاهُ آيَاتِنَا فَانْسَلَخَ مِنْهَا﴾ أي: خرج منها وتركها، فكذلك انسلاخ الليل من النهار.\n\n* *\n\nوقوله ﴿فَإِذَا هُمْ مُظْلِمُونَ﴾\n\nيقول: فإذا هم قد صاروا في ظلمة بمجيء الليل.\n\nوقال قتادة في ذلك ماحدثنا بشر، قال: ثنا يزيد، قال: ثنا سعيد، عن ق","tafsir-al-samarqandi|8":"ثم قوله تعالى: لِتُنْذِرَ يعني: لتخوف بالقرآن قَوْماً ما أُنْذِرَ آباؤُهُمْ يعني: كما أنذر آباؤهم الأولون فَهُمْ غافِلُونَ عن ذلك يعني: عما أنذر آباؤهم.\n\nثم قال عز وجل: لَقَدْ حَقَّ الْقَوْلُ أي: وجب القول بالعذاب عَلى أَكْثَرِهِمْ أي:\n\nعلى الكفار. ويقال: لَقَدْ حَقَّ الْقَوْلُ وهو قوله: لَأَمْلَأَنَّ جَهَنَّمَ [الأعراف: 18 وغيرها] ويقال:\n\nالْقَوْلُ كناية عن العذاب أي: وجب عليهم العذاب فَهُمْ لاَ يُؤْمِنُونَ يعني: لا يصدقون بالقرآن إِنَّا جَعَلْنا فِي أَعْناقِهِمْ أَغْلالًا قال مقاتل: نزلت في بني مخزوم، وذلك أن أبا جهل حلف لئن رأى النبيّ ﷺ ليدفعنه بحجر، فأتاه وهو يصلي، فرفع الحجر ليدمغه، فيبست يده إلى عنقه، والتزق الحجر بيده، ورجع إلى أصحابه، فخلصوا الحجر من يده. ورجل آخر من بني المغيرة، أتا","tafsir-al-samarqandi|12":"ثم قال عز وجل: إِنَّما تُنْذِرُ مَنِ اتَّبَعَ الذِّكْرَ يعني تخوف بالقرآن من اتبع الذكر، يعني من قبل الموعظة وسمع القرآن وَخَشِيَ الرَّحْمنَ بِالْغَيْبِ يعني: أطاعه في الغيب فَبَشِّرْهُ بِمَغْفِرَةٍ في الدنيا وَأَجْرٍ كَرِيمٍ في الآخرة.\n\nثم قال عز وجل: إِنَّا نَحْنُ نُحْيِ الْمَوْتى يعني: نبعثهم في الآخرة وَنَكْتُبُ مَاَ قَدَّمُوا يعني: نحفظ ما أسلفوا، وما عملوا من أعمالهم. ويقال: وَنَكْتُبُ مَاَ قَدَّمُوا يعني:\n\nتكتب أعمالهم الكرام الكاتبون، وما عملوا من خير أو شر وَآثارَهُمْ يعني: ما استنوا من سنة خير أو شر عملوه، واقتدى بهم من بعدهم، فلهم مثل أجورهم، أو عليهم مثل أوزارهم من غير أن ينقص منه شيئاً، وهذا كقوله عز وجل: يُنَبَّؤُا الْإِنْسانُ يَوْمَئِذٍ بِما قَدَّمَ وَأَخَّرَ\n\n[القيامة: 14] وه","tafsir-al-samarqandi|38":"ثم قال عز وجل: سُبْحانَ الَّذِي خَلَقَ الْأَزْواجَ كُلَّها يعني: تنزيهاً لله عز وجل الذي خلق الأصناف كلها مِمَّا تُنْبِتُ الْأَرْضُ يعني: ألواناً من النبات والثمار. ففي كل شيء خلق الله تعالى دليلاً على وحدانيته تعالى وربوبيته وَمِنْ أَنْفُسِهِمْ يعني: خلق من جنسهم أصناف الذكر والأنثى، وألواناً مختلفة وَمِمَّا لاَ يَعْلَمُونَ يعني: وخلق من الخلق ما لا يعلمون، وهذا كقوله: وَيَخْلُقُ مَا لاَ تَعْلَمُونَ [النحل: 8] .\n\nثم ذكر لهم دلالة أخرى ليعتبروا بها، فقال عز وجل: وَآيَةٌ لَهُمُ اللَّيْلُ يعني: علامة وحدانيته الليل نَسْلَخُ مِنْهُ النَّهارَ يعني: نخرج ونميز منه النهار فَإِذا هُمْ مُظْلِمُونَ يعني:\n\nداخلون في الظلمة. ويقال: يبقون في الظلمة. ويقال: إن الله خلق الدنيا مظلمة.\n\nثم قال: وَالشَّمْسُ ","tafsir-al-mawardi|8":"قَوْلُهُ عَزَّ وجَلَّ: ﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا﴾ فِيها ثَلاثَةُ أقاوِيلَ:\n\nأحَدُها: أنَّهُ مَثَلٌ ضَرَبَهُ اللَّهُ تَعالى لَهم في امْتِناعِهِمْ مِنَ الهُدى كامْتِناعِ المَغْلُولِ مِنَ التَّصَرُّفِ، قالَهُ يَحْيى بْنُ سَلّامٍ.\n\nالثّانِي: ما حَكاهُ السُّدِّيُّ أنَّ ناسًا مِن قُرَيْشٍ ائْتَمَرُوا بِالنَّبِيِّ ﷺ فَجاءُوا يُرِيدُونَ ذَلِكَ فَجُعِلَتْ أيْدِيهِمْ إلى أعْناقِهِمْ فَلَمْ يَسْتَطِيعُوا أنْ يَبْسُطُوا إلَيْهِ يَدًا.\n\nالثّالِثُ: أنَّ المُرادَ بِهِ جَعَلَ اللَّهُ سُبْحانَهُ لَهم في النّارِ مِنَ الأغْلالِ في أعْناقِهِمْ ويَكُونُ الجَعْلُ هاهُنا مَأْخُوذًا مِنَ الجُعالَةِ الَّتِي هي الأُجْرَةُ كَأنَّ جُعالَتَهم في النّارِ الأغْلالُ، حَكاهُ ابْنُ بَحْرٍ.\n\nوَفِي قَوْلِهِ: ﴿فِي أ","tafsir-al-mawardi|12":"قَوْلُهُ عَزَّ وجَلَّ: ﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا﴾ فِيها ثَلاثَةُ أقاوِيلَ:\n\nأحَدُها: أنَّهُ مَثَلٌ ضَرَبَهُ اللَّهُ تَعالى لَهم في امْتِناعِهِمْ مِنَ الهُدى كامْتِناعِ المَغْلُولِ مِنَ التَّصَرُّفِ، قالَهُ يَحْيى بْنُ سَلّامٍ.\n\nالثّانِي: ما حَكاهُ السُّدِّيُّ أنَّ ناسًا مِن قُرَيْشٍ ائْتَمَرُوا بِالنَّبِيِّ ﷺ فَجاءُوا يُرِيدُونَ ذَلِكَ فَجُعِلَتْ أيْدِيهِمْ إلى أعْناقِهِمْ فَلَمْ يَسْتَطِيعُوا أنْ يَبْسُطُوا إلَيْهِ يَدًا.\n\nالثّالِثُ: أنَّ المُرادَ بِهِ جَعَلَ اللَّهُ سُبْحانَهُ لَهم في النّارِ مِنَ الأغْلالِ في أعْناقِهِمْ ويَكُونُ الجَعْلُ هاهُنا مَأْخُوذًا مِنَ الجُعالَةِ الَّتِي هي الأُجْرَةُ كَأنَّ جُعالَتَهم في النّارِ الأغْلالُ، حَكاهُ ابْنُ بَحْرٍ.\n\nوَفِي قَوْلِهِ: ﴿فِي أ","tafsir-al-mawardi|38":"قَوْلُهُ عَزَّ وجَلَّ: ﴿وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنهُ النَّهارَ﴾ أيْ نْخُرِجُ مِنهُ النَّهارَ يَعْنِي ضَوْءَهُ، مَأْخُوذٌ مِن سَلْخِ الشّاةِ إذا خَرَجَتْ مِن جِلْدِها.\n\n﴿فَإذا هم مُظْلِمُونَ﴾ أيْ في ظُلْمَةٍ لِأنَّ ضَوْءَ النَّهارِ يَتَداخَلُ في الهَواءِ فَيُضِيءُ، فَإذا خَرَجَ مِنهُ أظْلَمَ.\n\n﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها﴾ فِيهِ ثَلاثَةُ أقاوِيلَ:\n\nأحَدُها: يَعْنِي لِانْتِهاءِ أمْرِها عِنْدَ انْقِضاءِ الدُّنْيا، حَكاهُ ابْنُ عِيسى.\n\nالثّانِي: لِوَقْتٍ واحِدٍ لا تَعْدُوهُ، قالَهُ قَتادَةُ.\n\nالثّالِثُ: أيْ: أبْعَدِ مَنازِلِها في الغُرُوبِ، ثُمَّ تَرْجِعُ إلى أدْنى مَنازِلَها، قالَهُ الكَلْبِيُّ.\n\nوَرَوى عِكْرِمَةُ عَنِ ابْنِ عَبّاسٍ أنَّهُ كانَ يَقْرَأُها: والشَّمْسُ تَجْرِ","ar-tafsir-al-baghawi|8":"﴿تَنْزِيلَ الْعَزِيزِ الرَّحِيمِ﴾ ، قَرَأَ ابْنُ عَامِرٍ، وَحَمْزَةُ، وَالْكِسَائِيُّ، وَحَفْصٌ: \"تَنْزِيلَ\" بِنَصْبِ اللَّامِ كَأَنَّهُ قَالَ: نُزِّلَ تَنْزِيلًا وَقَرَأَ الْآخَرُونَ بِالرَّفْعِ، أَيْ: هُوَ تَنْزِيلُ الْعَزِيزِ الرَّحِيمِ.\n\n﴿لِتُنْذِرَ قَوْمًا مَا أُنْذِرَ آبَاؤُهُمْ﴾ ، قِيلَ: \"مَا\" لِلنَّفْيِ أَيْ: لَمْ يُنْذَرْ آبَاؤُهُمْ، لِأَنَّ قُرَيْشًا لَمْ يَأْتِهِمْ نَبِيٌّ قَبْلَ مُحَمَّدٍ ﷺ وَقِيلَ: \"مَا\" بِمَعْنَى الَّذِي، أَيْ: لِتُنْذِرَ قَوْمًا بِالَّذِي أُنْذِرَ آبَاؤُهُمْ، ﴿فَهُمْ غَافِلُونَ﴾ عَنِ الْإِيمَانِ وَالرُّشْدِ.\n\n﴿لَقَدْ حَقَّ الْقَوْلُ﴾ ، وَجَبَ الْعَذَابُ ﴿عَلَى أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ﴾ ، هَذَا كَقَوْلِهِ: \"وَلَكِنْ حَقَّتْ كَلِمَةُ الْعَذَابِ عَلَى ","ar-tafsir-al-baghawi|12":"﴿وَجَعَلْنَا مِنْ بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا﴾ ، قَرَأَ حَمْزَةُ وَالْكِسَائِيُّ وَحَفْصٌ: \"سَدًّا\" بِفَتْحِ السِّينِ، وَقَرَأَ الْآخَرُونَ بِضَمِّهَا، ﴿فَأَغْشَيْنَاهُمْ﴾ فَأَعْمَيْنَاهُمْ، مِنَ التَّغْشِيَةِ وَهِيَ التَّغْطِيَةُ، ﴿فَهُمْ لَا يُبْصِرُونَ﴾ سَبِيلَ الْهُدَى.\n\n﴿وَسَوَاءٌ عَلَيْهِمْ أَأَنْذَرْتَهُمْ أَمْ لَمْ تُنْذِرْهُمْ لَا يُؤْمِنُونَ﴾\n\n﴿إِنَّمَا تُنْذِرُ مَنِ اتَّبَعَ الذِّكْرَ﴾ ، يَعْنِي: إِنَّمَا يَنْفَعُ إِنْذَارُكُ مَنِ اتَّبَعَ الذِّكْرَ، يَعْنِي الْقُرْآنَ، فَعَمِلَ بِمَا فِيهِ، ﴿وَخَشِيَ الرَّحْمَنَ بِالْغَيْبِ فَبَشِّرْهُ بِمَغْفِرَةٍ وَأَجْرٍ كَرِيمٍ﴾ حَسَنٍ وَهُوَ الْجَنَّةُ.\n\n﴿إِنَّا نَحْنُ نُحْيِي الْمَوْتَى﴾ ، عِنْدَ الْبَعْثِ، ﴿وَنَكْتُب","ar-tafsir-al-baghawi|38":"﴿وَجَعَلْنَا فِيهَا جَنَّاتٍ﴾ بَسَاتِينَ، ﴿مِنْ نَخِيلٍ وَأَعْنَابٍ وَفَجَّرْنَا فِيهَا﴾ فِي الْأَرْضِ، ﴿مِنَ الْعُيُونِ﴾ .\n\n﴿لِيَأْكُلُوا مِنْ ثَمَرِهِ﴾ أَيْ: مِنَ الثَّمَرِ الْحَاصِلِ بِالْمَاءِ ﴿وَمَا عَمِلَتْهُ﴾ قَرَأَ حَمْزَةُ وَالْكِسَائِيُّ وَأَبُو بَكْرٍ: \"عَمِلَتْ\" بِغَيْرِ هَاءٍ، وَقَرَأَ الْآخَرُونَ \"عَمِلَتْهُ\" بِالْهَاءِ أَيْ: يَأْكُلُونَ مِنَ الَّذِي عَمِلَتْهُ ﴿أَيْدِيهِمْ﴾ الزَّرْعَ وَالْغَرْسَ فَالْهَاءُ عَائِدَةٌ إِلَى \"مَا\" الَّتِي بِمَعْنَى الَّذِي. وَقِيلَ: \"مَا\" لِلنَّفْيِ فِي قَوْلِهِ \"مَا عَمِلَتْهُ\" أَيْ: وَجَدُوهَا مَعْمُولَةً وَلَمْ تَعْمَلْهَا أَيْدِيهِمْ وَلَا صُنْعَ لَهُمْ فِيهَا وَهَذَا مَعْنَى قَوْلِ الضَّحَّاكِ وَمُقَاتِلٍ.\n\nوَقِيلَ: أَرَادَ الْعُيُونَ وَالْأ","al-kashshaf-al-zamakhshari|8":"ثم مثل تصميمهم على الكفر، وأنه لا سبيل إلى ارعوائهم بأن جعلهم كالمغلولين المقمخين:\n\nفي أنهم لا يلتفتون إلى الحق ولا يعطفون أعناقهم نحوه، ولا يطأطئون رءوسهم له، وكالحاصلين بين سدين لا يبصرون ما قدّامهم ولا ما خلفهم: في أن لا تأمل لهم ولا تبصر، وأنهم متعامون عن النظر في آيات الله. فإن قلت: ما معنى قوله فَهِيَ إِلَى الْأَذْقانِ؟ قلت: معناه: فالأغلال واصلة إلى الأذقان ملزوزة إليها، وذلك أن طوق الغل الذي في عنق المغلول، يكون ملتقى طرفيه تحت الذقن حلقة فيها رأس العمود، نادرا [[قوله «رأس العمود نادرا» أى شاذا، كما يفيده الصحاح. (ع)]] من الحلقة إلى الذقن، فلا تخليه يطأطئ رأسه ويوطئ قذاله [[قوله «ويوطئ قذاله» في الصحاح «القذال» : جماع مؤخر الرأس، فتدبر. (ع)]] ، فلا يزال مقمحا. والمقمح: الذي يرفع رأسه","al-kashshaf-al-zamakhshari|12":"نُحْيِ الْمَوْتى نبعثهم بعد مماتهم. وعن الحسن: إحياؤهم: أن يخرجهم من الشرك إلى الإيمان وَنَكْتُبُ ما أسلفوا من الأعمال الصالحة وغيرها وما هلكوا عنه من أثر حسن، كعلم علموه، أو كتاب صنفوه، أو حبيس حبسوه، أو بناء بنوه: من مسجد أو رباط أو قنطرة أو نحو ذلك. أو سيئ، كوظيفة وظفها بعض الظلام على المسلمين، وسكة أحدث فيها تخسيرهم، وشيء أحدث فيه صدّ عن ذكر الله: من ألحان وملاه، وكذلك كل سنة حسنة أو سيئة يستن بها. ونحوه قوله تعالى يُنَبَّؤُا الْإِنْسانُ يَوْمَئِذٍ بِما قَدَّمَ وَأَخَّرَ\n\nأى: قدّم من أعماله، وأخر من آثاره. وقيل: هي آثار المشاءين إلى المساجد. وعن جابر: أردنا النقلة إلى المسجد والبقاع حوله [[أخرجه ابن حبان في الأول من الأول عن طريق أبى نضرة عنه. وأصله في مسلم.]] خالية، فبلغ ذلك رسول الله ﷺ","al-kashshaf-al-zamakhshari|38":"وقرئ: تجرى إلى مستقر لها. وقرأ ابن مسعود: لا مستقرّ لها، أى: لا تزال تجرى لا تستقر. وقرئ: لا مستقر لها، على أنّ لا بمعنى ليس ذلِكَ الجري على ذلك التقدير والحساب الدقيق الذي تكل الفطن عن استخراجه وتتحير الأفهام في استنباطه. ما هو إلا تقدير الغالب بقدرته على كل مقدور، المحيط علما بكل معلوم. قرئ: والقمر رفعا على الابتداء، أو عطفا على الليل. يريد: من آياته القمر، ونصبا بفعل يفسره قدرناه، ولا بدّ في قَدَّرْناهُ مَنازِلَ من تقدير مضاف، لأنه لا معنى لتقدير نفس القمر منازل. والمعنى: قدرنا مسيره منازل وهي ثمانية وعشرون منزلا، ينزل القمر كل ليلة في واحد منها لا يتخطاه ولا يتقاصر عنه، على تقدير مستو لا يتفاوت، يسير فيها كل ليلة من المستهل إلى الثامنة والعشرين، ثم يستتر ليلتين أو ليلة إذا نقص الشهر، وهذ","al-muharrar-al-wajiz-ibn-atiyyah|8":"(p-٢٣٥)قوله عزّ وجلّ:\n\n﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا فَهي إلى الأذْقانِ فَهم مُقْمَحُونَ﴾ ﴿وَجَعَلْنا مِن بَيْنِ أيْدِيهِمْ سَدًّا ومِن خَلْفِهِمْ سَدًّا فَأغْشَيْناهم فَهم لا يُبْصِرُونَ﴾\n\nقالَ مَكِّيٌّ: هي حَقِيقَةٌ في أحْوالِ الآخِرَةِ إذا دَخَلُوا النارَ، وقَوْلُهُ تَعالى: ﴿ \"فَأغْشَيْناهُمْ\"﴾ يُضْعِفُ هَذا القَوْلَ: لِأنَّ بَصَرَ الكافِرِ يَوْمَ القِيامَةِ إنَّما هو حَدِيدٌ، يَرى قُبْحَ حالِهِ. وقالَ الضِحاكُ: مَعْناهُ: مَنَعْناهم مِنَ النَفَقَةِ في سَبِيلِ اللهِ، كَما قالَ تَعالى: ﴿وَلا تَجْعَلْ يَدَكَ مَغْلُولَةً إلى عُنُقِكَ﴾ [الإسراء: ٢٩]. وقالَ ابْنُ عَبّاسٍ، وابْنُ إسْحَقَ: هي اسْتِعارَةٌ لِحالِ الكَفَرَةِ الَّذِينَ أرادُوا مُحَمَّدًا ﷺ بِسُوءٍ، فَجَعَلَ اللهُ تَعالى هَذا ","al-muharrar-al-wajiz-ibn-atiyyah|12":"قوله عزّ وجلّ:\n\n﴿وَسَواءٌ عَلَيْهِمْ أأنْذَرْتَهم أمْ لَمْ تُنْذِرْهم لا يُؤْمِنُونَ﴾ ﴿إنَّما تُنْذِرُ مَنِ اتَّبَعَ الذِكْرَ وخَشِيَ الرَحْمَنَ بِالغَيْبِ فَبَشِّرْهُ بِمَغْفِرَةٍ وأجْرٍ كَرِيمٍ﴾ ﴿إنّا نَحْنُ نُحْيِي المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهم وكُلَّ شَيْءٍ أحْصَيْناهُ في إمامٍ مُبِينٍ﴾\n\nهَذِهِ مُخاطَبَةٌ لِمُحَمَّدٍ عَلَيْهِ الصَلاةُ والسَلامُ، مُضَمِّنُها تَسْلِيَةٌ عنهُمْ، أيْ: أنَّهم قَدْ حُتِّمَ عَلَيْهِمْ بِالكُفْرِ، فَسَواءٌ إنْذارُكَ وتَرْكُهُ، والألِفُ في قَوْلِهِ تَعالى: ﴿ \"أأنْذَرْتَهُمْ\"﴾ ألِفُ التَسْوِيَةِ؛ لِأنَّها لَيْسَتْ بِاسْتِفْهامٍ، بَلِ المُتَفَهِّمُ والمُسْتَفْهَمُ مُسْتَوِيانِ في عِلْمِ ذَلِكَ.\n\nوقَرَأ الجُمْهُورُ: \"آنْذَرْتَهُمْ\" بِالمَدِّ، وقَرَأ ابْنُ","al-muharrar-al-wajiz-ibn-atiyyah|38":"قوله عزّ وجلّ:\n\n﴿وَآيَةٌ لَهُمُ اللَيْلُ نَسْلَخُ مِنهُ النَهارَ فَإذا هم مُظْلِمُونَ﴾ ﴿والشَمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذَلِكَ تَقْدِيرُ العَزِيزِ العَلِيمِ﴾ ﴿والقَمَرَ قَدَّرْناهُ مَنازِلَ حَتّى عادَ كالعُرْجُونِ القَدِيمِ﴾ ﴿لا الشَمْسُ يَنْبَغِي لَها أنْ تُدْرِكَ القَمَرَ ولا اللَيْلُ سابِقُ النَهارِ وكُلٌّ في فَلَكٍ يَسْبَحُونَ﴾\n\nهَذِهِ الآياتُ جَعَلَها اللهُ تَعالى أدِلَّةً عَلى القُدْرَةِ ووُجُوبِ الأُلُوهِيَّةِ لَهُ، و\"نَسْلَخُ\" (p-٢٤٩)مَعْناهُ: نَكْشِطُ ونُقَشِّرُ، فَهي اسْتِعارَةٌ، و\"مُظْلِمُونَ\": داخِلُونَ في الظَلامِ، واسْتَدَلَّ قَوْمٌ مِن هَذِهِ الآيَةِ عَلى أنَّ اللَيْلَ أصْلٌ والنَهارَ فَرْعٌ طارِئٌ عَلَيْهِ، وفي ذَلِكَ نَظَرٌ.\n\nو\"مُسْتَقَرُّ الشَمْسِ\" - عَلى ما رُوِيَ في ","tafsir-ibn-al-jawzi|8":"﴿لَقَدْ حَقَّ القَوْلُ﴾ فِيهِ قَوْلانِ. أحَدُهُما: وجَبَ العَذابُ. والثّانِي: سَبَقَ القَوْلُ بِكُفْرِهِمْ.\n\n(p-٦)قَوْلُهُ تَعالى: ﴿عَلى أكْثَرِهِمْ﴾ يَعْنِي أهْلَ مَكَّةَ، وهَذِهِ إشارَةٌ إلى إرادَةِ اللَّهِ تَعالى السّابِقَةِ لِكُفْرِهِمْ ﴿فَهم لا يُؤْمِنُونَ﴾ لِما سَبَقَ مِنَ القَدَرِ بِذَلِكَ.\n\n﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا﴾ فِيهِ ثَلاثَةُ أقْوالٍ.\n\nأحَدُها: أنَّها مَثَلٌ، ولَيْسَ هُناكَ غِلٌّ حَقِيقَةً، قالَهُ أكْثَرُ المُحَقِّقِينَ، ثُمَّ لَهم فِيهِ ثَلاثَةُ أقْوالٍ. أحَدُها أنَّها مَثَلٌ لِمَنعِهِمْ عَنْ كُلِّ خَيْرٍ، قالَهُ قَتادَةُ. والثّانِي: لِحَبْسِهِمْ عَنِ الإنْفاقِ في سَبِيلِ اللَّهِ بِمَوانِعَ كالأغْلالِ، قالَهُ الفَرّاءُ، وابْنُ قُتَيْبَةَ. والثّالِثُ: لِمَنعِهِمْ مِ","tafsir-ibn-al-jawzi|12":"﴿لَقَدْ حَقَّ القَوْلُ﴾ فِيهِ قَوْلانِ. أحَدُهُما: وجَبَ العَذابُ. والثّانِي: سَبَقَ القَوْلُ بِكُفْرِهِمْ.\n\n(p-٦)قَوْلُهُ تَعالى: ﴿عَلى أكْثَرِهِمْ﴾ يَعْنِي أهْلَ مَكَّةَ، وهَذِهِ إشارَةٌ إلى إرادَةِ اللَّهِ تَعالى السّابِقَةِ لِكُفْرِهِمْ ﴿فَهم لا يُؤْمِنُونَ﴾ لِما سَبَقَ مِنَ القَدَرِ بِذَلِكَ.\n\n﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا﴾ فِيهِ ثَلاثَةُ أقْوالٍ.\n\nأحَدُها: أنَّها مَثَلٌ، ولَيْسَ هُناكَ غِلٌّ حَقِيقَةً، قالَهُ أكْثَرُ المُحَقِّقِينَ، ثُمَّ لَهم فِيهِ ثَلاثَةُ أقْوالٍ. أحَدُها أنَّها مَثَلٌ لِمَنعِهِمْ عَنْ كُلِّ خَيْرٍ، قالَهُ قَتادَةُ. والثّانِي: لِحَبْسِهِمْ عَنِ الإنْفاقِ في سَبِيلِ اللَّهِ بِمَوانِعَ كالأغْلالِ، قالَهُ الفَرّاءُ، وابْنُ قُتَيْبَةَ. والثّالِثُ: لِمَنعِهِمْ مِ","tafsir-ibn-al-jawzi|38":"قَوْلُهُ تَعالى: ﴿وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنهُ النَّهارَ﴾ أيْ: وعَلامَةٌ لَهم تَدُلُّ عَلى تَوْحِيدِنا وقُدْرَتِنا اللَّيْلُ نَسْلَخُ مِنهُ النَّهارَ؛ قالَ الفَرّاءُ: نَرْمِي بِالنَّهارِ عَنْهُ، و \"مِنهُ\" بِمَعْنى \"عَنْهُ\" . وقالَ أبُو عُبَيْدَةَ: نُخْرِجُ مِنهُ النَّهارَ ونُمَيِّزُهُ مِنهُ فَتَجِيءُ الظُّلْمَةُ، قالَ الماوَرْدِيُّ: وذَلِكَ أنَّ ضَوْءَ النَّهارِ يَتَداخَلُ في الهَواءِ فَيُضِيءُ، فَإذا خَرَجَ مِنهُ أظْلَمَ. وقَوْلُهُ: ﴿فَإذا هم مُظْلِمُونَ﴾ أيْ: داخِلُونَ في الظَّلامِ.\n\n﴿والشَّمْسُ﴾ أيْ: وآَيَةٌ لَهُمُ الشَّمْسُ ﴿تَجْرِي لِمُسْتَقَرٍّ لَها﴾ وفِيهِ أرْبَعَةُ أقَوْالٍ.\n\nأحَدُها: إلى مَوْضِعِ قَرارِها؛ رَوى أبُو ذَرٍّ قالَ: «سَألْتُ رَسُولَ اللَّهِ ﷺ عَنْ قَوْلِهِ: ﴿ل","tafsir-al-razi|8":"ثُمَّ قالَ تَعالى: ﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالًا فَهي إلى الأذْقانِ فَهم مُقْمَحُونَ﴾ .\n\nلَمّا بَيَّنَ أنَّهم لا يُؤْمِنُونَ بَيَّنَ أنَّ ذَلِكَ مِنَ اللَّهِ فَقالَ: ﴿إنّا جَعَلْنا﴾ وفِيهِ وُجُوهٌ:\n\nأحَدُها: أنَّ المُرادَ إنّا جَعَلْناهم مُمْسِكِينَ لا يُنْفِقُونَ في سَبِيلِ اللَّهِ كَما قالَ تَعالى: ﴿ولا تَجْعَلْ يَدَكَ مَغْلُولَةً إلى عُنُقِكَ﴾ (الإسْراءِ: ٢٩) .\n\nوالثّانِي: أنَّ الآيَةَ نَزَلَتْ في أبِي جَهْلٍ وصاحِبَيْهِ المَخْزُومِيَّيْنِ حَيْثُ «حَلَفَ أبُو جَهْلٍ أنَّهُ يَرْضَخُ رَأْسَ مُحَمَّدٍ، فَرَآهُ ساجِدًا فَأخَذَ صَخْرَةً ورَفَعَها لِيُرْسِلَها عَلى رَأْسِهِ فالتَزَقَتْ بِيَدِهِ ويَدُهُ بِعُنُقِهِ» .\n\nوالثّالِثُ: وهو الأقْوى وأشَدُّ مُناسَبَةً لِما تَقَدَّمَ وهو أنَّ ذَ","tafsir-al-razi|12":"ثُمَّ قالَ تَعالى: ﴿إنّا نَحْنُ نُحْيِي المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهم وكُلَّ شَيْءٍ أحْصَيْناهُ في إمامٍ مُبِينٍ﴾ .\n\nفِي التَّرْتِيبِ وُجُوهٌ:\n\nأحَدُها: إنَّ اللَّهَ تَعالى لَمّا بَيَّنَ الرِّسالَةَ، وهو أصْلٌ مِنَ الأُصُولِ الثَّلاثَةِ الَّتِي يَصِيرُ بِها المُكَلَّفُ مُؤْمِنًا مُسْلِمًا ذَكَرَ أصْلًا آخَرَ وهو الحَشْرُ.\n\nوثانِيها: وهو أنَّ اللَّهَ تَعالى لَمّا ذَكَرَ الإنْذارَ والبِشارَةَ بِقَوْلِهِ: ﴿فَبَشِّرْهُ بِمَغْفِرَةٍ﴾ ولَمْ يَظْهَرْ ذَلِكَ بِكَمالِهِ في الدُّنْيا، فَقالَ: إنْ لَمْ يُرَ في الدُّنْيا فاللَّهُ يُحْيِي المَوْتى ويَجْزِي المُنْذِرِينَ ويَجْزِي المُبَشِّرِينَ.\n\nوثالِثُها: أنَّهُ تَعالى لَمّا ذَكَرَ خَشْيَةَ الرَّحْمَنِ بِالغَيْبِ ذَكَرَ ما يُؤَكِّدُهُ، وهو إح","tafsir-al-razi|38":"وقَوْلُهُ تَعالى: ﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذَلِكَ تَقْدِيرُ العَزِيزِ العَلِيمِ﴾\n\nيَحْتَمِلُ أنْ يَكُونَ الواوُ لِلْعَطْفِ عَلى اللَّيْلِ، تَقْدِيرُهُ: وآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ والشَّمْسُ تَجْرِي والقَمَرُ قَدَّرْناهُ، فَهي كُلُّها آيَةٌ، وقَوْلُهُ: ﴿والشَّمْسُ تَجْرِي﴾ إشارَةٌ إلى سَبَبِ سَلْخِ النَّهارِ، فَإنَّها تَجْرِي لِمُسْتَقَرٍّ لَها وهو وقْتُ الغُرُوبِ فَيَنْسَلِخُ النَّهارُ، وفائِدَةُ ذِكْرِ السَّبَبِ هو أنَّ اللَّهَ لَمّا قالَ: نَسْلَخُ مِنهُ النَّهارَ، وكانَ غَيْرُ بَعِيدٍ مِنَ الجُهّالِ أنْ يَقُولَ قائِلٌ مِنهم: سَلْخُ النَّهارِ لَيْسَ مِنَ اللَّهِ إنَّما يُسْلَخُ النَّهارُ بِغُرُوبِ الشَّمْسِ، فَقالَ تَعالى: ﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها﴾ إشارَةً ","ar-tafseer-al-qurtubi|8":"قَوْلُهُ تَعَالَى: ﴿لِتُنْذِرَ قَوْماً ما أُنْذِرَ آباؤُهُمْ﴾ \"قَوْماً\" لَا مَوْضِعَ لَهَا مِنَ الْإِعْرَابِ عِنْدَ أَكْثَرِ أَهْلِ التَّفْسِيرِ مِنْهُمْ قَتَادَةُ، لِأَنَّهَا نَفْيٌ وَالْمَعْنَى: لِتُنْذِرَ قَوْمًا مَا أَتَى آبَاءَهُمْ قَبْلَكَ نَذِيرٌ. وَقِيلَ: هِيَ بِمَعْنَى الَّذِي فَالْمَعْنَى: لِتُنْذِرَهُمْ مِثْلَ مَا أُنْذِرَ آبَاؤُهُمْ، قَالَهُ ابْنُ عَبَّاسٍ وَعِكْرِمَةُ وقتادة أيضا. وقيل: إن \"قَوْماً\" وَالْفِعْلَ مَصْدَرٌ، أَيْ لِتُنْذِرَ قَوْمًا إِنْذَارَ آبَائِهِمْ. ثُمَّ يَجُوزُ أَنْ تَكُونَ الْعَرَبُ قَدْ بَلَغَتْهُمْ بِالتَّوَاتُرِ أَخْبَارُ الْأَنْبِيَاءِ، فَالْمَعْنَى لَمْ يُنْذَرُوا بِرَسُولٍ مِنْ أَنْفُسِهِمْ. وَيَجُوزُ أَنْ يَكُونَ بَلَغَهُمُ الْخَبَرُ وَلَكِنْ غَفَلُوا ","ar-tafseer-al-qurtubi|12":"فِيهِ أَرْبَعُ مَسَائِلَ الْأُولَى- قَوْلُهُ تَعَالَى: ﴿إِنَّا نَحْنُ نُحْيِ الْمَوْتى ﴾ أَخْبَرَنَا تَعَالَى بِإِحْيَائِهِ الْمَوْتَى رَدًّا عَلَى الْكَفَرَةِ. وَقَالَ الضَّحَّاكُ وَالْحَسَنُ: أَيْ نُحْيِيهِمْ بِالْإِيمَانِ بَعْدَ الْجَهْلِ، وَالْأَوَّلُ أَظْهَرُ أَيْ نُحْيِيهِمْ بِالْبَعْثِ لِلْجَزَاءِ. ثُمَّ تَوَعَّدَهُمْ بِذِكْرِهِ كَتْبَ الْآثَارِ وَهِيَ الثانية- وإحصاء كل شي وَكُلِّ مَا يَصْنَعُهُ الْإِنْسَانُ. قَالَ قَتَادَةُ: مَعْنَاهُ مِنْ عَمَلٍ. وَقَالَهُ مُجَاهِدٌ وَابْنُ زَيْدٍ. وَنَظِيرُهُ قوله: \"عَلِمَتْ نَفْسٌ ما قَدَّمَتْ وَأَخَّرَتْ\": [الانفطار: ٥] وقوله: ﴿يُنَبَّأْ الْإِنْسانُ يَوْمَئِذٍ بِما قَدَّمَ وَأَخَّرَ﴾ [الْقِيَامَةِ: ١٣]، وَقَالَ: ﴿اتَّقُوا اللَّهَ وَلْتَنْظُرْ نَ","ar-tafseer-al-qurtubi|38":"قَوْلُهُ تَعَالَى: ﴿وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهارَ﴾ أَيْ وَعَلَامَةٌ دَالَّةٌ على توحيد الله وقدرته ووجوب إلاهيته. وَالسَّلْخُ: الْكَشْطُ وَالنَّزْعُ، يُقَالُ: سَلَخَهُ اللَّهُ مِنْ دِينِهِ، ثُمَّ تُسْتَعْمَلُ بِمَعْنَى الْإِخْرَاجِ. وَقَدْ جَعَلَ ذَهَابَ الضَّوْءِ وَمَجِيءَ الظُّلْمَةِ كَالسَّلْخِ مِنَ الشَّيْءِ وَظُهُورِ الْمَسْلُوخِ فَهِيَ اسْتِعَارَةٌ. وَ (مُظْلِمُونَ) دَاخِلُونَ فِي الظَّلَامِ، يُقَالُ: أَظْلَمْنَا أَيْ دَخَلْنَا فِي ظَلَامِ اللَّيْلِ، وَأَظْهَرْنَا دَخَلْنَا فِي وَقْتِ الظُّهْرِ، وَكَذَلِكَ أَصْبَحْنَا وَأَضْحَيْنَا وَأَمْسَيْنَا. وَقِيلَ: \"مِنْهُ\" بِمَعْنَى عَنْهُ، وَالْمَعْنَى نَسْلَخُ عَنْهُ ضِيَاءَ النَّهَارِ. \"فَإِذا هُمْ مُظْلِمُونَ\" أَيْ فِي ","tafsir-al-baydawi|8":"﴿لَقَدْ حَقَّ القَوْلُ عَلى أكْثَرِهِمْ﴾ يَعْنِي قَوْلَهُ: ﴿لأمْلأنَّ جَهَنَّمَ مِنَ الجِنَّةِ والنّاسِ أجْمَعِينَ﴾ . ﴿فَهم لا يُؤْمِنُونَ﴾ لِأنَّهم مِمَّنْ عَلِمَ اللَّهُ أنَّهم لا يُؤْمِنُونَ.(p-264)\n\n﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا﴾ تَقْرِيرٌ لِتَصْمِيمِهِمْ عَلى الكُفْرِ والطَّبْعِ عَلى قُلُوبِهِمْ بِحَيْثُ لا تُغْنِي عَنْهُمُ الآياتُ والنُّذُرُ، بِتَمْثِيلِهِمْ بِالَّذِينَ غُلَّتْ أعْناقُهم. ﴿فَهِيَ إلى الأذْقانِ﴾ فالأغْلالُ واصِلَةٌ إلى أذْقانِهِمْ فَلا تُخَلِّيهِمْ يُطَأْطِئُونَ رُؤُوسَهم لَهُ. ﴿فَهم مُقْمَحُونَ﴾ رافِعُونَ رُؤُوسَهم غاضُّونَ أبْصارَهم في أنَّهم لا يَلْتَفِتُونَ لَفْتَ الحَقِّ ولا يَعْطِفُونَ أعْناقَهم نَحْوَهُ ولا يُطَأْطِئُونَ رُؤُوسَهم لَهُ.\n\n﴿وَجَعَلْنا مِن ب","tafsir-al-baydawi|12":"﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾ الأمْواتَ بِالبَعْثِ أوِ الجُهّالَ بِالهِدايَةِ. ﴿وَنَكْتُبُ ما قَدَّمُوا﴾ ما أسْلَفُوا مِنَ الأعْمالِ الصّالِحَةِ والطّالِحَةِ. ﴿وَآثارَهُمْ﴾ الحَسَنَةَ كَعِلْمٍ عَلَّمُوهُ وحَبِيسٍ وقَفُوهُ، والسَّيِّئَةَ كَإشاعَةِ باطِلٍ وتَأْسِيسِ ظُلْمٍ.\n\n﴿وَكُلَّ شَيْءٍ أحْصَيْناهُ في إمامٍ مُبِينٍ﴾ يَعْنِي اللَّوْحَ المَحْفُوظَ.","tafsir-al-baydawi|38":"﴿وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنهُ النَّهارَ﴾ نُزِيلُهُ ونَكْشِفُهُ عَنْ مَكانِهِ مُسْتَعارٌ مِن سَلْخِ الجِلْدِ والكَلامُ في إعْرابِهِ ما سَبَقَ. ﴿فَإذا هم مُظْلِمُونَ﴾ داخِلُونَ في الظَّلامِ.\n\n﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها﴾ لِحَدٍّ مُعَيَّنٍ يَنْتَهِي إلَيْهِ دَوْرُها، فَشُبِّهَ بِمُسْتَقَرِّ المُسافِرِ إذا قَطَعَ مَسِيرَهُ، أوْ لِكَبِدِ السَّماءِ فَإنَّ حَرَكَتَها فِيهِ يُوجَدُ فِيها بُطْءٌ بِحَيْثُ يُظَنُّ أنَّ لَها هُناكَ وقْفَةً قالَ:\n\nوالشَّمْسُ حَيْرى لَها بِالجَوِّ تَدْوِيمُ\n\nأوْ لِاسْتِقْرارٍ لَها عَلى نَهْجٍ مَخْصُوصٍ، أوْ لِمُنْتَهى مُقَدَّرٍ لِكُلِّ يَوْمٍ مِنَ المَشارِقِ والمَغارِبِ فَإنَّ لَها في دَوْرِها ثَلاثَمِائَةٍ وسِتِّينَ مَشْرِقًا ومَغْرِبًا، تَطْلُعُ كُ","tafsir-al-nasafi|8":"﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا فَهي إلى الأذْقانِ﴾، مَعْناهُ: فالأغْلالُ واصِلَةٌ إلى الأذْقانِ، مَلْزُوزَةٌ إلَيْها،\n\n﴿فَهم مُقْمَحُونَ﴾، مَرْفُوعَةٌ رءوسهُمْ، يُقالُ: \"قَمَحَ (p-٩٧)البَعِيرُ، فَهو قامِحٌ\"، إذا رُوِيَ فَرَفَعَ رَأْسَهُ، وهَذا لِأنَّ طَوْقَ الغَلِّ الَّذِي في عُنُقِ المَغْلُولِ يَكُونُ في مُلْتَقى طَرَفَيْهِ تَحْتَ الذَقَنِ حَلْقَةٌ فِيها رَأْسُ العَمُودِ، خارِجًا مِنَ الحَلْقَةِ إلى الذَقَنِ، فَلا يُخَلِّيهِ يُطَأْطِئُ رَأْسَهُ، فَلا يَزالُ مُقْمَحًا.","tafsir-al-nasafi|12":"﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾، لِبَعْثِهِمْ بَعْدَ مَماتِهِمْ، أوْ نُخْرِجُهم مِنَ الشِرْكِ إلى الإيمانِ،\n\n﴿وَنَكْتُبُ ما قَدَّمُوا﴾، ما أسْلَفُوا مِنَ الأعْمالِ الصالِحاتِ، وغَيْرِها، (p-٩٨)﴿وَآثارَهُمْ﴾، ما هَلَكُوا عَنْهُ مِن أثَرٍ حَسَنٍ، كَعِلْمٍ عَلَّمُوهُ، أوْ كِتابٍ صَنَّفُوهُ، أوْ حَبِيسٍ، أوْ رِباطٍ، أوْ مَسْجِدٍ صَنَعُوهُ، أوْ سَيِّئٍ، كَوَظِيفَةٍ وظَّفَها بَعْضُ الظَلَمَةِ، وكَذَلِكَ كُلُّ سُنَّةٍ حَسَنَةٍ، أوْ سَيِّئَةٍ يُسْتَنُّ بِها، ونَحْوُهُ قَوْلُهُ (تَعالى): ﴿يُنَبَّأُ الإنْسانُ يَوْمَئِذٍ بِما قَدَّمَ وأخَّرَ﴾ [القيامة: ١٣]، قَدَّمَ مِن أعْمالِهِ، وأخَّرَ مِن آثارِهِ، وقِيلَ: هي خُطاهم إلى الجُمُعَةِ، أوْ إلى الجَماعَةِ،\n\n﴿وَكُلَّ شَيْءٍ أحْصَيْناهُ﴾، عَدَدْناهُ، وبَيَّن","tafsir-al-nasafi|38":"﴿والشَمْسُ تَجْرِي﴾، وآيَةٌ لَهُمُ الشَمْسُ تَجْرِي،\n\n﴿لِمُسْتَقَرٍّ لَها﴾، لِحَدٍّ لَها مُؤَقَّتٍ، مُقَدَّرٍ، تَنْتَهِي إلَيْهِ مِن فَلَكِها في آخِرِ السَنَةِ، شُبِّهَ بِمُسْتَقَرِّ المُسافِرِ، إذا قَطَعَ مَسِيرَهُ، أوْ: \"لِحَدٍّ لَها مِن مَسِيرِها كُلَّ يَوْمٍ، في مَرائِي عُيُونِنا\"، وهو المَغْرِبُ، أوْ لِانْتِهاءِ أمْرِها عِنْدَ انْقِضاءِ الدُنْيا،\n\n﴿ذَلِكَ﴾، اَلْجَرْيُ عَلى ذَلِكَ التَقْدِيرِ، والحِسابِ الدَقِيقِ،\n\n﴿تَقْدِيرُ العَزِيزِ﴾، اَلْغالِبِ بِقُدْرَتِهِ عَلى كُلِّ مَقْدُورٍ،\n\n﴿العَلِيمِ﴾، بِكُلِّ مَعْلُومٍ.","tafsir-ibn-juzay|8":"﴿إِنَّا جَعَلْنَا فِيۤ أَعْناقِهِمْ أَغْلاَلاً﴾ الآية: فيها ثلاثة أقوال: الأول أنها عبارة عن تماديهم على الكفر، ومنع الله لهم من الإيمان، فشبههم بمن جعل في عنقه غل يمنعه من الالتفات، وغطى على بصره فصار لا يرى، والثاني أنها عبارة عن كفهم عن إذاية النبي ﷺ حين أراد أبو جهل أن يرميه بحجر، فرجع عنه فزعاً مرعوباً، والثالث: أن ذلك حقيقة في حالهم في جهنم، والأول أظهر وأرجح لقوله قبلها ﴿فَهُمْ لاَ يُؤمِنُونَ﴾ وقوله بعدها ﴿وَسَوَآءُ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لاَ يُؤمِنُونَ﴾ ﴿فَهِىَ إِلَى ٱلأَذْقَانِ﴾ الذقن هي طرف الوجه حيث تنبت اللحية، والضمير للأغلال، وذلك أن الغل حلقة في العنق، فإذا كان واسعاً عريضاً وصل إلى الدقن فكان أشدّ على المغلول، وقيل: الضمير للأيدي على أنها لم يتقدم له","tafsir-ibn-juzay|12":"﴿إِنَّا جَعَلْنَا فِيۤ أَعْناقِهِمْ أَغْلاَلاً﴾ الآية: فيها ثلاثة أقوال: الأول أنها عبارة عن تماديهم على الكفر، ومنع الله لهم من الإيمان، فشبههم بمن جعل في عنقه غل يمنعه من الالتفات، وغطى على بصره فصار لا يرى، والثاني أنها عبارة عن كفهم عن إذاية النبي ﷺ حين أراد أبو جهل أن يرميه بحجر، فرجع عنه فزعاً مرعوباً، والثالث: أن ذلك حقيقة في حالهم في جهنم، والأول أظهر وأرجح لقوله قبلها ﴿فَهُمْ لاَ يُؤمِنُونَ﴾ وقوله بعدها ﴿وَسَوَآءُ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لاَ يُؤمِنُونَ﴾ ﴿فَهِىَ إِلَى ٱلأَذْقَانِ﴾ الذقن هي طرف الوجه حيث تنبت اللحية، والضمير للأغلال، وذلك أن الغل حلقة في العنق، فإذا كان واسعاً عريضاً وصل إلى الدقن فكان أشدّ على المغلول، وقيل: الضمير للأيدي على أنها لم يتقدم له","tafsir-ibn-juzay|38":"﴿وَٱلشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَّهَـا﴾ أي لحد موقت تنتهي إليه من فلكها، وهي نهاية جريها إلى أن ترجع في المنقلبين الشتاء والصيف، وقيل: مستقرها: وقوفها كل وقت زوال، بدليل وقوف الظل حينئذ، وقيل: مستقرها يوم القيامة حين تكوّر، وفي الحديث: \"مستقرها تحت العرش تسجد فيه كل ليلة بعد غروبها\"، وهذا أصح الأقوال لوروده عن النبي ﷺ في الحديث المروي في البخاري عن أبي ذر، وقرئ ﴿لا مستقر لها﴾ أي لا تستقر عن جريها.","ar-tafsir-ibn-kathir|8":"يَقُولُ تَعَالَى: إِنَّا جَعَلَنَا هَؤُلَاءِ الْمَحْتُومَ عَلَيْهِمْ بِالشَّقَاءِ نِسْبَتُهُمْ إِلَى الْوُصُولِ إِلَى الْهُدَى كَنِسْبَةِ مَنْ جُعل فِي عُنُقِهِ غِلٌّ، فجَمَع يَدَيْهِ مَعَ عُنُقِهِ تَحْتَ ذَقَنِهِ، فَارْتَفَعَ رأسُه، فَصَارَ مقمَحا؛ وَلِهَذَا قَالَ: ﴿فَهُمْ مُقْمَحُونَ﴾ وَالْمُقْمَحُ: هُوَ الرَّافِعُ رَأْسَهُ، كَمَا قَالَتْ أُمُّ زَرْع فِي كَلَامِهَا: \"وَأَشْرَبُ فأتقمَّح\" أي: أَشْرَبُ فَأُرْوَى، وَأَرْفَعُ رَأْسِي تَهْنِيئًا وتَرَوّيا. وَاكْتَفَى بِذِكْرِ الْغِلِّ فِي الْعُنُقِ عَنْ ذِكْرِ الْيَدَيْنِ، وَإِنْ كَانَتَا مُرَادَتَيْنِ، كَمَا قَالَ الشَّاعِرُ [[البيت في تفسير الطبري (٢٢/٩٨) .]] :\n\nفَمَا أدْري إذَا يَمَّمْتُ أرْضًا ... أُرِيدُ الخَيْرَ أَيُّهُمَا يَليني ...\n\nأال","ar-tafsir-ibn-kathir|12":"يَقُولُ تَعَالَى: إِنَّا جَعَلَنَا هَؤُلَاءِ الْمَحْتُومَ عَلَيْهِمْ بِالشَّقَاءِ نِسْبَتُهُمْ إِلَى الْوُصُولِ إِلَى الْهُدَى كَنِسْبَةِ مَنْ جُعل فِي عُنُقِهِ غِلٌّ، فجَمَع يَدَيْهِ مَعَ عُنُقِهِ تَحْتَ ذَقَنِهِ، فَارْتَفَعَ رأسُه، فَصَارَ مقمَحا؛ وَلِهَذَا قَالَ: ﴿فَهُمْ مُقْمَحُونَ﴾ وَالْمُقْمَحُ: هُوَ الرَّافِعُ رَأْسَهُ، كَمَا قَالَتْ أُمُّ زَرْع فِي كَلَامِهَا: \"وَأَشْرَبُ فأتقمَّح\" أي: أَشْرَبُ فَأُرْوَى، وَأَرْفَعُ رَأْسِي تَهْنِيئًا وتَرَوّيا. وَاكْتَفَى بِذِكْرِ الْغِلِّ فِي الْعُنُقِ عَنْ ذِكْرِ الْيَدَيْنِ، وَإِنْ كَانَتَا مُرَادَتَيْنِ، كَمَا قَالَ الشَّاعِرُ [[البيت في تفسير الطبري (٢٢/٩٨) .]] :\n\nفَمَا أدْري إذَا يَمَّمْتُ أرْضًا ... أُرِيدُ الخَيْرَ أَيُّهُمَا يَليني ...\n\nأال","ar-tafsir-ibn-kathir|38":"يَقُولُ تَعَالَى: وَمِنَ الدَّلَالَةِ لَهُمْ عَلَى قُدْرَتِهِ تَعَالَى الْعَظِيمَةِ خَلْقُ اللَّيْلِ وَالنَّهَارِ، هَذَا بِظَلَامِهِ وَهَذَا بِضِيَائِهِ، وَجَعَلُهُمَا يَتَعَاقَبَانِ، يَجِيءُ هَذَا فَيَذْهَبُ هَذَا، وَيَذْهَبُ هَذَا فَيَجِيءُ هَذَا، كَمَا قَالَ: ﴿يُغْشِي اللَّيْلَ النَّهَارَ يَطْلُبُهُ حَثِيثًا﴾ [الْأَعْرَافِ: ٥٤] ؛ وَلِهَذَا قَالَ عَزَّ وَجَلَّ هَاهُنَا: ﴿وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهَارَ﴾ أَيْ: نَصْرِمُهُ مِنْهُ فَيَذْهَبُ، فَيَقْبَلُ اللَّيْلُ؛ وَلِهَذَا قَالَ: ﴿فَإِذَا هُمْ مُظْلِمُونَ﴾ كَمَا جَاءَ فِي الْحَدِيثِ: \"إِذَا أَقْبَلَ اللَّيْلُ مِنْ هَاهُنَا، وَأَدْبَرَ النَّهَارُ مِنْ هَاهُنَا، وَغَرَبَتِ الشَّمْسُ، فَقَدْ أَفْطَرَ الصَّائِمُ\". [[رواه البخا","ar-tafsir-al-jalalayn|8":"﴿إنّا جَعَلْنا فِي أعْناقهمْ أغْلالًا﴾ بِأَنْ تُضَمّ إلَيْها الأَيْدِي لِأَنَّ الغُلّ يَجْمَع اليَد إلى العُنُق ﴿فَهِيَ﴾ أيْ الأَيْدِي مَجْمُوعَة ﴿إلى الأَذْقان﴾ جَمْع ذَقَن وهِيَ مُجْتَمَع اللَّحْيَيْنِ ﴿فَهُمْ مُقْمَحُونَ﴾ رافِعُونَ رُءُوسهمْ لا يَسْتَطِيعُونَ خَفْضها وهَذا تَمْثِيل والمُراد أنَّهُمْ لا يُذْعِنُونَ لِلْإيمانِ ولا يُخْفِضُونَ رُءُوسهمْ لَهُ","ar-tafsir-al-jalalayn|12":"﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾ لِلْبَعْثِ ﴿ونَكْتُب﴾ فِي اللَّوْح المَحْفُوظ ﴿ما قَدَّمُوا﴾ فِي حَياتهمْ مِن خَيْر وشَرّ لِيُجازُوا عَلَيْهِ ﴿وآثارهمْ﴾ ما اسْتَنَّ بِهِ بَعْدهمْ ﴿وكُلّ شَيْء﴾ نَصَبَهُ بِفِعْلٍ يُفَسِّرهُ ﴿أحْصَيْناهُ﴾ ضَبَطْناهُ ﴿فِي إمام مُبِين﴾ كِتاب بَيِّن هُوَ اللَّوْح المَحْفُوظ","ar-tafsir-al-jalalayn|38":"﴿والشَّمْس تَجْرِي﴾ إلى آخِره مِن جُمْلَة الآيَة لَهُمْ: أوْ آيَة أُخْرى والقَمَر كَذَلِكَ ﴿لِمُسْتَقَرٍّ لَها﴾ أيْ إلَيْهِ لا تَتَجاوَزهُ ﴿ذَلِكَ﴾ أيْ جَرْيها ﴿تَقْدِير العَزِيز﴾ فِي مُلْكه ﴿العَلِيم﴾ بِخَلْقِهِ","al-durr-al-manthur|8":"(p-٣١٠)سُورَةُ يس\n\nمَكِّيَّةٌ\n\nأخْرَجَ ابْنُ الضُّرَيْسِ والنَّحّاسُ، وابْنُ مَرْدُويَهْ والبَيْهَقِيُّ في ”الدَّلائِلِ“ عَنِ ابْنِ عَبّاسٍ قالَ: نَزَلَتْ سُورَةُ ”يس“ بِمَكَّةَ.\n\nوأخْرَجَ ابْنُ مَرْدُويَهْ عَنْ عائِشَةَ قالَتْ: نَزَلَتْ سُورَةُ ”يس“ بِمَكَّةَ.\n\nوأخْرَجَ الدّارِمِيُّ، والتِّرْمِذِيُّ ومُحَمَّدُ بْنُ نَصْرٍ والبَيْهَقِيُّ في ”شُعَبِ الإيمانِ“ عَنْ أنَسٍ قالَ: قالَ رَسُولُ اللَّهِ ﷺ: «إنَّ لِكُلِّ شَيْء ٍ قَلْبًا وقَلْبُ القُرْآنِ ”يس“، ومَن قَرَأ: ”يس“ كَتَبَ اللَّهُ لَهُ بِقِراءَتِها قِراءَةَ القُرْآنِ عَشْرَ مَرّاتٍ» .\n\nوأخْرَجَ البَزّارُ عَنْ أبِي هُرَيْرَةَ قالَ: قالَ رَسُولُ اللَّهِ ﷺ: «إنَّ لِكُلِّ شَيْءٍ قَلْبًا، وقَلْبُ القُرْآنِ يس» .\n\n(p-٣١١)وأخْرَجَ الدّارِمِيُّ وأ","al-durr-al-manthur|12":"قَوْلُهُ تَعالى: ﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾ الآيَةَ.\n\nأخْرَجَ عَبْدُ الرَّزّاقِ، والتِّرْمِذِيُّ وحَسَّنَهُ والبَزّارُ، وابْنُ جَرِيرٍ، وابْنُ المُنْذِرِ، وابْنُ أبِي حاتِمٍ والحاكِمُ وصَحَّحَهُ، وابْنُ مَرْدُويَهْ، والبَيْهَقِيُّ في ”شُعَبِ الإيمانِ“ عَنْ أبِي سَعِيدٍ الخُدْرِيِّ قالَ: «كانَ بَنُو سَلِمَةَ في ناحِيَةٍ مِنَ المَدِينَةِ، فَأرادُوا أنْ يَنْتَقِلُوا إلى قُرْبِ المَسْجِدِ، فَأنْزَلَ اللَّهُ: ﴿إنّا نَحْنُ نُحْيِي المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهُمْ﴾ فَدَعاهم رَسُولُ اللَّهِ ﷺ فَقالَ: إنَّهُ يُكْتَبُ (p-٣٣٠)آثارُكم. ثُمَّ قَرَأ عَلَيْهِمُ الآيَةَ فَتَرَكُوا» .\n\nوأخْرَجَ عَبْدُ بْنُ حُمَيْدٍ عَنْ أبِي سَعِيدٍ الخُدْرِيِّ: ﴿إنّا نَحْنُ نُحْيِي المَوْتى ونَكْتُبُ ما قَدَّم","al-durr-al-manthur|38":"قَوْلُهُ تَعالى: ﴿والشَّمْسُ تَجْرِي﴾ الآيَةَ.\n\nأخْرَجَ عَبْدُ بْنُ حُمَيْدٍ والبُخارِيُّ والتِّرْمِذِيُّ، وابْنُ أبِي حاتِمٍ، وأبُو الشَّيْخِ في ”العَظَمَةِ“، وابْنُ مَرْدُويَهْ والبَيْهَقِيُّ في ”الأسْماءِ والصِّفاتِ“ عَنْ أبِي ذَرٍّ قالَ: «كُنْتُ مَعَ النَّبِيِّ ﷺ في المَسْجِدِ عِنْدَ غُرُوبِ الشَّمْسِ فَقالَ: ”يا أبا ذَرٍّ“ أتَدْرِي أيْنَ تَغْرُبُ الشَّمْسُ؟ قُلْتُ: اللَّهُ ورَسُولُهُ أعْلَمُ. قالَ: فَإنَّها تَذْهَبُ حَتّى تَسْجُدَ تَحْتَ العَرْشِ فَذَلِكَ قَوْلُهُ: ﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها﴾ [يس»: ٣٨] .\n\nوأخْرَجَ سَعِيدُ بْنُ مَنصُورٍ، وأحْمَدُ والبُخارِيُّ ومُسْلِمٌ وأبُو داوُدَ والتِّرْمِذِيُّ والنَّسائِيُّ، وابْنُ أبِي حاتِمٍ وأبُو الشَّيْخِ، وابْنُ مَرْدُويَهْ، والبَيْه","tafsir-abi-al-su-ood|8":"﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا﴾ تَقْرِيرٌ لِتَصْمِيمِهِمْ عَلى الكُفْرِ وعَدَمِ ارْعِوائِهِمْ عَنْهُ بِتَمْثِيلِ حالِهِمْ بِحالِ الَّذِينَ غُلَّتْ أعْناقُهم ﴿فَهِيَ إلى الأذْقانِ﴾ أيْ: فالأغْلالُ مُنْتَهِيَةٌ إلى أذْقانِهِمْ فَلا تَدَعُهم يَلْتَفِتُونَ إلى الحَقِّ، ولا يَعْطِفُونَ أعْناقَهم نَحْوَهُ، ولا يُطَئْطِئُونَ رُءُوسَهم لَهُ ﴿فَهم مُقْمَحُونَ﴾ رافِعُونَ رُءُوسَهُمْ، غاضُّونَ أبْصارَهُمْ، بِحَيْثُ لا يَكادُونَ يَرَوْنَ الحَقَّ، أوْ يَنْظُرُونَ إلى جِهَتِهِ.","tafsir-abi-al-su-ood|12":"﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾ بَيانٌ لِشَأْنٍ عَظِيمٍ يَنْطَوِي عَلى الإنْذارِ والتَّبْشِيرِ انْطِواءً إجْمالِيًّا، أيْ: نَبْعَثُهم بَعْدَ مَماتِهِمْ، وعَنِ الحَسَنِ: إحْياؤُهم إخْراجُهم مِنَ الشِّرْكِ إلى الإيمانِ، فَهو حِينَئِذٍ عِدَةٌ كَرِيمَةٌ بِتَحْقِيقِ المُبَشَّرِ بِهِ ﴿وَنَكْتُبُ ما قَدَّمُوا﴾ أيْ: ما أسْلَفُوا مِنَ الأعْمالِ الصّالِحَةِ وغَيْرِها ﴿وَآثارَهُمْ﴾ الَّتِي أبْقَوْها مِنَ الحَسَناتِ كَعِلْمٍ عَلِمُوهُ، أوْ كِتابٍ ألَّفُوهُ أوْ حَبِيسٍ وقَفُوهُ، أوْ بِناءٍ بَنَوْهُ مِنَ المَساجِدِ والرِّباطاتِ والقَناطِرِ، وغَيْرِ ذَلِكَ مِن وُجُوهِ البِرِّ.\n\nوَمِنَ السَّيِّئاتِ كَتَأْسِيسِ قَوانِينِ الظُّلْمِ والعُدْوانِ، وتَرْتِيبِ مَبادِئِ الشَّرِّ والفَسادِ فِيما بَيْنَ العِبادِ، وغَي","tafsir-abi-al-su-ood|38":"﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها﴾ لِحَدٍّ مُعَيَّنٍ يَنْتَهِي إلَيْهِ دَوْرُها، فَشُبِّهَ بِمُسْتَقَرِّ المُسافِرِ إذا قَطَعَ مَسِيرَهُ، أوْ لِكَبِدِ السَّماءِ فَإنَّ حَرَكَتَها فِيهِ تُوجَدُ أبْطَأ (p-168)بِحَيْثُ يُظَنُّ أنَّ لَها هُناكَ وقْفَةً، قالَ:\n\n؎ والشَّمْسُ حَيْرى لَها بِالجَوِّ تَدْوِيمُ\n\nأوْ لِاسْتِقْرارٍ لَها عَلى نَهْجٍ مَخْصُوصٍ، أوْ لِمُنْتَهًى مُقَدَّرٍ لِكُلِّ يَوْمٍ مِنَ المَشارِقِ والمَغارِبِ، فَإنَّ لَها في دَوْرِها ثَلاثَمِائَةٍ وسِتِّينَ مَشْرِقًا ومَغْرِبًا، تَطْلُعُ كُلَّ يَوْمٍ مِن مَطْلَعٍ وتَغْرُبُ مِن مَغْرِبٍ، ثُمَّ لا يَعُودُ إلَيْهِما إلى العامِ القابِلِ، أوِ لِمُنْقَطَعِ جَرْيِها عِنْدَ خَرابِ العالَمِ، وقُرِئَ: (إلى مُسْتَقَرٍّ لَها) وقُرِئَ: (لا مُسْ","fath-al-qadir-al-shawkani|8":"تَفْسِيرُ سُورَةِ يس\n\nوهِيَ مَكِّيَّةٌ. قالَ القُرْطُبِيُّ: بِالإجْماعِ إلّا أنَّ فِرْقَةً قالَتْ ﴿ونَكْتُبُ ما قَدَّمُوا وآثارَهم﴾ [يس: ١٢] نَزَلَتْ في بَنِي سَلَمَةَ مِنَ الأنْصارِ حِينَ أرادُوا أنْ يَتْرُكُوا دِيارَهم ويَنْتَقِلُوا إلى جِوارِ مَسْجِدِ رَسُولِ اللَّهِ - صَلّى اللَّهُ عَلَيْهِ وآلِهِ وسَلَّمَ -، وسَيَأْتِي بَيانُ ذَلِكَ.\n\nوأخْرَجَ ابْنُ الضُّرَيْسِ، والنَّحّاسُ، وابْنُ مَرْدَوَيْهِ، والبَيْهَقِيُّ في الدَّلائِلِ عَنِ ابْنِ عَبّاسٍ قالَ: سُورَةُ يس نَزَلَتْ بِمَكَّةَ. وأخْرَجَ ابْنُ مَرْدَوَيْهِ عَنْ عائِشَةَ مِثْلَهُ.\n\nوأخْرَجَ الدّارِمِيُّ، والتِّرْمِذِيُّ، ومُحَمَّدُ بْنُ نَصْرٍ، والبَيْهَقِيُّ في الشُّعَبِ عَنْ أنَسٍ قالَ: قالَ رَسُولُ اللَّهِ - صَلّى اللَّهُ عَلَيْهِ وآ","fath-al-qadir-al-shawkani|12":"تَفْسِيرُ سُورَةِ يس\n\nوهِيَ مَكِّيَّةٌ. قالَ القُرْطُبِيُّ: بِالإجْماعِ إلّا أنَّ فِرْقَةً قالَتْ ﴿ونَكْتُبُ ما قَدَّمُوا وآثارَهم﴾ [يس: ١٢] نَزَلَتْ في بَنِي سَلَمَةَ مِنَ الأنْصارِ حِينَ أرادُوا أنْ يَتْرُكُوا دِيارَهم ويَنْتَقِلُوا إلى جِوارِ مَسْجِدِ رَسُولِ اللَّهِ - صَلّى اللَّهُ عَلَيْهِ وآلِهِ وسَلَّمَ -، وسَيَأْتِي بَيانُ ذَلِكَ.\n\nوأخْرَجَ ابْنُ الضُّرَيْسِ، والنَّحّاسُ، وابْنُ مَرْدَوَيْهِ، والبَيْهَقِيُّ في الدَّلائِلِ عَنِ ابْنِ عَبّاسٍ قالَ: سُورَةُ يس نَزَلَتْ بِمَكَّةَ. وأخْرَجَ ابْنُ مَرْدَوَيْهِ عَنْ عائِشَةَ مِثْلَهُ.\n\nوأخْرَجَ الدّارِمِيُّ، والتِّرْمِذِيُّ، ومُحَمَّدُ بْنُ نَصْرٍ، والبَيْهَقِيُّ في الشُّعَبِ عَنْ أنَسٍ قالَ: قالَ رَسُولُ اللَّهِ - صَلّى اللَّهُ عَلَيْهِ وآ","fath-al-qadir-al-shawkani|38":"لَمّا وقَعَ ما وقَعَ مِنهم مَعَ حَبِيبٍ النَّجّارِ غَضَبَ اللَّهُ لَهُ وعَجَّلَ لَهُمُ النِّقْمَةَ وأهْلَكَهم بِالصَّيْحَةِ، ومَعْنى ﴿وما أنْزَلْنا عَلى قَوْمِهِ مِن بَعْدِهِ﴾ أيْ: عَلى قَوْمِ حَبِيبٍ النَّجّارِ مِن بَعْدِ قَتْلِهِمْ لَهُ، أوْ مِن بَعْدِ رَفْعِ اللَّهِ لَهُ إلى السَّماواتِ عَلى الِاخْتِلافِ السّابِقِ مِن جُنْدٍ مِنَ السَّماءِ لِإهْلاكِهِمْ ولِلِانْتِقامِ مِنهم أيْ: لَمْ نَحْتَجْ إلى إرْسالِ جُنُودٍ مِنَ السَّماءِ لِإهْلاكِهِمْ كَما وقَعَ ذَلِكَ لِلنَّبِيِّ - صَلّى اللَّهُ عَلَيْهِ وآلِهِ وسَلَّمَ - يَوْمَ بَدْرٍ مِن إرْسالِ المَلائِكَةِ لِنُصْرَتِهِ وحَرْبِ أعْدائِهِ وما كُنّا مُنْزِلِينَ أيْ: وما صَحَّ في قَضائِنا وحِكْمَتِنا أنْ نُنْزِلَ لِإهْلاكِهِمْ جُنْدًا لَسَبْقِ قَضا","tafsir-al-alusi|8":"﴿إنّا جَعَلْنا في أعْناقِهِمْ﴾ جَمْعُ عُنُقٍ بِالضَّمِّ وبِضَمَّتَيْنِ، وهو الجِيدُ، ويُقالُ عَنِيقٌ كَأمِيرٍ وعُنَقٌ كَصُرَدٍ.\n\n﴿أغْلالا﴾ جَمْعُ غُلٍّ بِالضَّمِّ وهو عَلى ما قِيلَ ما يُشَدُّ بِهِ اليَدُ إلى العُنُقِ لِلتَّعْذِيبِ والتَّشْدِيدِ، وفي البَحْرِ الغُلُّ ما أحاطَ بِالعُنُقِ عَلى مَعْنى التَّثْقِيفِ والتَّضْيِيقِ والتَّعْذِيبِ والأسْرِ ومَعَ العُنُقِ اليَدانِ أوِ اليَدُ الواحِدَةُ.\n\nوذَكَرَ الرّاغِبُ أنَّهُ ما يُقَيَّدُ بِهِ فَتُجْعَلُ الأعْضاءُ وسَطَهُ، وأصْلُهُ مِنَ الغَلَلِ تَدَرُّعُ الشَّيْءِ وتَوَسُّطُهُ، ومِنهُ الغَلَلُ لِلْماءِ الجارِي بَيْنَ الشَّجَرِ، وقَدْ يُقالُ لَهُ الغَيْلُ، وكَأنَّ في الكَلامِ عَلَيْهِ قَلْبًا أيْ جَعَلْنا أعْناقَهم في أغْلالٍ كَما تَقُولُ جَعَلْتُ ا","tafsir-al-alusi|12":"وقَوْلُهُ سُبْحانَهُ: ﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾ إلخ تَذْيِيلٌ عامٌّ لِلْفَرِيقَيْنِ المُصَمِّمَيْنِ عَلى الكُفْرِ والمُشَفَّعَيْنِ بِالإنْذارِ تَرْهِيبًا وتَرْغِيبًا ووَعِيدًا ووَعْدًا، وتَكْرِيرُ الضَّمِيرِ لِإفادَةِ الحَصْرِ أوْ لِلتَّقْوِيَةِ، وما ألْطَفَ هَذا الضَّمِيرُ الَّذِي عَكْسُهُ كَطَرْدِهِ هاهُنا، وضَمِيرُ العَظَمَةِ لِلْإشارَةِ إلى جَلالَةِ الفِعْلِ، والتَّأْكِيدُ لِلِاعْتِناءِ بِأمْرِ الخَبَرِ أوْ لِرَدِّ الإنْكارِ فَإنَّ الكَفَرَةَ كانُوا يَقُولُونَ: ﴿إنْ هي إلا حَياتُنا الدُّنْيا نَمُوتُ ونَحْيا وما نَحْنُ بِمَبْعُوثِينَ﴾ [اَلْمُؤْمِنُونَ: 37] أيْ إنّا نَحْنُ نُحْيِي الأمْواتَ جَمِيعًا بِبَعْثِهِمْ يَوْمَ القِيامَةِ.\n\n﴿ونَكْتُبُ ما قَدَّمُوا﴾ ما أسْلَفُوهُ مِنَ الأعْمالِ","tafsir-al-alusi|38":"﴿والشَّمْسُ﴾ عَطْفٌ عَلى (اللَّيْلُ) أيْ وآيَةٌ لَهُمُ الشَّمْسُ.\n\nوقَوْلُهُ - تَعالى -: ﴿تَجْرِي﴾ ... إلَخِ اسْتِئْنافٌ لِبَيانِ كَوْنِها آيَةً، وقِيلَ (الشَّمْسُ) مُبْتَدَأٌ وما بَعْدَهُ خَبَرٌ والجُمْلَةُ عَطْفٌ عَلى (اللَّيْلُ نَسْلَخُ) وقِيلَ غَيْرُ ذَلِكَ فَلا تَغْفُلْ، والجَرْيُ المَرُّ السَّرِيعُ، وأصْلُهُ لِمَرِّ الماءِ ولِما يَجْرِي بِجَرْيِهِ والمَعْنى تَسِيرُ سَرِيعًا ﴿لِمُسْتَقَرٍّ لَها﴾ لِحَدٍّ مُعَيَّنٍ تَنْتَهِي إلَيْهِ مِن فَلَكِها في آخِرِ السَّنَةِ شُبِّهَ بِمُسْتَقَرَّ المُسافِرِ إذا قَطَعَ مَسِيرَهُ مِن حَيْثُ إنَّ في كُلٍّ انْتِهاءً إلى مَحَلٍّ مُعَيَّنٍ وإنْ كانَ لِلْمُسافِرِ قَرارٌ دُونَها، ورُوِيُ هَذا عَنِ الكَلْبِيِّ واخْتارَهُ ابْنُ قُتَيْبَةَ، والمُسْتَقَرُّ عَلَ","mahasin-al-ta-wil-al-qasimi|8":"القَوْلُ في تَأْوِيلِ قَوْلِهِ تَعالى:\n\n[ ٨ ] ﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا فَهي إلى الأذْقانِ فَهم مُقْمَحُونَ﴾ .\n\n﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالا فَهي إلى الأذْقانِ﴾ أيِ: اَللِّحى؛ أيْ: واصِلَةٌ إلَيْها ومَلْزُوزَةٌ إلَيْها: ﴿فَهم مُقْمَحُونَ﴾ أيْ: ناصِبُو رُؤُوسِهِمْ، غاضُّو أبْصارِهِمْ. يُقالُ: أقْمَحَ اَلرَّجُلُ، رَفَعَ رَأْسَهُ وغَضَّ بَصَرَهُ. وأقْمَحَ اَلْغِلُّ اَلْأسِيرَ، إذا تَرَكَ رَأْسَهُ مَرْفُوعًا لِضِيقِهِ، فَهو مُقْمَحٌ، وذَلِكَ إذا لَمْ يَتْرُكْهُ عَمُودُ اَلْغِلِّ اَلَّذِي يَنْخُسُ ذَقَنَهُ، أنْ يُطَأْطِئَ رَأْسَهُ. قالَ اِبْنُ اَلْأثِيرِ: هي في قَوْلِهِ تَعالى: (p-٤٩٩٣)﴿فَهِيَ إلى الأذْقانِ﴾ كِنايَةً عَنِ اَلْأيْدِي لا عَنِ اَلْأعْناقِ؛ لِأنَّ اَلْغِلَّ يَجْع","mahasin-al-ta-wil-al-qasimi|12":"(p-٤٩٩٥)القَوْلُ في تَأْوِيلِ قَوْلِهِ تَعالى:\n\n[ ١٢ ] ﴿إنّا نَحْنُ نُحْيِي المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهم وكُلَّ شَيْءٍ أحْصَيْناهُ في إمامٍ مُبِينٍ﴾ .\n\n﴿إنّا نَحْنُ نُحْيِي المَوْتى﴾ أيْ: لِلْبَعْثِ: ﴿ونَكْتُبُ ما قَدَّمُوا﴾ أيْ: نَحْفَظُ عَلَيْهِمْ ما أسْلَفُوا مِنَ اَلْخَيْرِ والشَّرِّ: ﴿وآثارَهُمْ﴾ أيْ: ما تَرَكُوهُ مِن سُنَّةٍ صالِحَةٍ، فَعُمِلَ بِها بَعْدَ مَوْتِهِمْ، أوْ سَنَةٍ سَيِّئَةٍ فَعُمِلَ بِها بَعْدَهُمْ: ﴿وكُلَّ شَيْءٍ أحْصَيْناهُ في إمامٍ مُبِينٍ﴾ أيْ: في اَللَّوْحِ اَلْمَحْفُوظِ، أوِ اَلْعِلْمِ اَلْأزَلِيِّ.","mahasin-al-ta-wil-al-qasimi|38":"القَوْلُ في تَأْوِيلِ قَوْلِهِ تَعالى:\n\n[ ٣٨ ] ﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذَلِكَ تَقْدِيرُ العَزِيزِ العَلِيمِ﴾ .\n\n﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها﴾ أيْ: لِحَدٍّ لَها مُؤَقَّتٍ مُقَدَّرٍ يَنْتَهِي إلَيْهِ دَوْرُها اَلْيَوْمِيُّ أوِ اَلسَّنَوِيُّ، شُبِّهَ بِمُسْتَقَرِّ اَلْمُسافِرِ إذا قَطَعَ مَسِيرَهُ. فالمُسْتَقَرُّ اِسْمُ مَكانٍ تَقْطَعُهُ في حَرَكَتِها اَلدّائِمَةِ ثُمَّ تَعُودُ. ووَجْهُ اَلشَّبَهِ اَلِانْتِهاءُ إلى مَحَلٍّ مُعَيَّنٍ، واللّامُ تَعْلِيلِيَّةٌ، أوْ بِمَعْنى (إلى). وقِيلَ مُسْتَقَرُّها: مُنْقَطَعُ جَرْيِها عِنْدَ خَرابِ اَلْعالَمِ. ومُسْتَقَرٌّ عَلَيْهِ اِسْمُ زَمانٍ: ﴿ذَلِكَ تَقْدِيرُ العَزِيزِ العَلِيمِ﴾ أيْ: ذَلِكَ اَلْجَرْيُ اَلْمُتَضَمِّنُ لِلْحِكَمِ، ","ar-tafseer-al-saddi|8":"وذكر الموانع من وصول الإيمان لقلوبهم، فقال: { إِنَّا جَعَلْنَا فِي أَعْنَاقِهِمْ أَغْلَالًا } وهي جمع \"غل\" و \"الغل\" ما يغل به العنق، فهو للعنق بمنزلة القيد للرجل، وهذه الأغلال التي في الأعناق عظيمة قد وصلت إلى أذقانهم ورفعت رءوسهم إلى فوق، { فَهُمْ مُقْمَحُونَ } أي: رافعو رءوسهم من شدة الغل الذي في أعناقهم، فلا يستطيعون أن يخفضوها.","ar-tafseer-al-saddi|12":"{ إِنَّا نَحْنُ نُحْيِي الْمَوْتَى } أي: نبعثهم بعد موتهم لنجازيهم على الأعمال، { وَنَكْتُبُ مَا قَدَّمُوا } من الخير والشر، وهو أعمالهم التي عملوها وباشروها في حال حياتهم، { وَآثَارَهُمْ } وهي آثار الخير وآثار الشر، التي كانوا هم السبب في إيجادها في حال حياتهم وبعد وفاتهم، وتلك الأعمال التي نشأت من أقوالهم وأفعالهم وأحوالهم، فكل خير عمل به أحد من الناس، بسبب علم العبد وتعليمه ونصحه، أو أمره بالمعروف، أو نهيه عن المنكر، أو علم أودعه عند المتعلمين، أو في كتب ينتفع بها في حياته وبعد موته، أو عمل خيرا، من صلاة أو زكاة أو صدقة أو إحسان، فاقتدى به غيره، أو عمل مسجدا، أو محلا من المحال التي يرتفق بها الناس، وما أشبه ذلك، فإنها من آثاره التي تكتب له، وكذلك عمل الشر.ولهذا: { من سن سنة حسنة فله أجرها","ar-tafseer-al-saddi|38":"{ وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَهَا } أي: دائما تجري لمستقر لها قدره اللّه لها، لا تتعداه، ولا تقصر عنه، وليس لها تصرف في نفسها، ولا استعصاء على قدرة اللّه تعالى. { ذَلِكَ تَقْدِيرُ الْعَزِيزِ } الذي بعزته دبر هذه المخلوقات العظيمة، بأكمل تدبير، وأحسن نظام. { الْعَلِيمُ } الذي بعلمه، جعلها مصالح لعباده، ومنافع في دينهم ودنياهم.","ar-tafseer-tahrir-al-tanwir|8":"﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالًا فَهْيَ إلى الأذْقانِ فَهم مُقْمَحُونَ﴾ هَذِهِ الجُمْلَةُ بَدَلُ اشْتِمالٍ مِن جُمْلَةِ ﴿لَقَدْ حَقَّ القَوْلُ عَلى أكْثَرِهِمْ فَهم لا يُؤْمِنُونَ﴾ [يس: ٧] فَإنَّ انْتِفاءَ إيمانِهِمْ يَشْتَمِلُ عَلى ما تَضَمَّنَتْهُ هَذِهِ الآيَةُ مِن جَعْلِ أغْلالٍ في أعْناقِهِمْ حَقِيقَةً أوْ تَمْثِيلًا.\n\nوالجَعْلُ: تَكْوِينُ الشَّيْءِ، أيْ جَعَلْنا حالَهم كَحالِ مَن في أعْناقِهِمْ أغْلالٌ فَهي إلى الأذْقانِ فَهم مُقْمِحُونَ، فَيَجُوزُ أنْ يَكُونَ تَمْثِيلًا بِأنْ شُبِّهَتْ حالَةُ إعْراضِهِمْ عَنِ التَّدَبُّرِ في القُرْآنِ ودَعْوَةِ الإسْلامِ والتَّأمُّلِ في حُجَجِهِ الواضِحَةِ بِحالِ قَوْمٍ جُعِلَتْ في أعْناقِهِمْ أغْلالٌ غَلِيظَةٌ تَرْتَفِعُ إلى أذْقانِهِمْ فَيَكُو","ar-tafseer-tahrir-al-tanwir|12":"﴿إنّا نَحْنُ نُحْيِ المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهم وكُلَّ شَيْءٍ أحْصَيْنَهُ في إمامٍ مُبِينٍ﴾ لَمّا اقْتَضى القَصْرُ في قَوْلِهِ ﴿إنَّما تُنْذِرُ مَنِ اتَّبَعَ الذِّكْرَ وخَشِيَ الرَّحْمَنَ بِالغَيْبِ﴾ [يس: ١١] نُفِيَ أنْ يَتَعَلَّقَ الإنْذارُ بِالَّذِينِ لَمْ يَتَّبِعُوا الذِّكْرَ ولَمْ يَخْشَوُا الرَّحْمَنَ، وكانَ في ذَلِكَ كِنايَةٌ تَعْرِيضِيَّةٌ بِأنَّ الَّذِينَ لَمْ يَنْتَفِعُوا بِالإنْذارِ بِمَنزِلَةِ الأمْواتِ لِعَدَمِ انْتِفاعِهِمْ بِما يَنْفَعُ كُلَّ عاقِلٍ، كَما قالَ تَعالى ﴿لِتُنْذَرَ مَن كانَ حَيًّا﴾ [يس: ٧٠] وكَما قالَ ﴿إنَّكَ لا تُسْمِعُ المَوْتى﴾ [النمل: ٨٠] اسْتُطْرِدَ عَقِبَ ذَلِكَ بِالتَّخَلُّصِ إلى إثْباتِ البَعْثِ فَإنَّ التَّوْفِيقَ الَّذِي حَفَّ بِمَنِ اتَّبَ","ar-tafseer-tahrir-al-tanwir|38":"صفحة ١٩\n﴿والشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذَلِكَ تَقْدِيرُ العَزِيزِ العَلِيمِ﴾ الشَّمْسُ يَجُوزُ أنْ يَكُونَ مَعْطُوفًا عَلى اللَّيْلِ مِن قَوْلِهِ ﴿وآيَةٌ لَهُمُ اللَّيْلُ﴾ [يس: ٣٧] عَطْفَ مُفْرَدٍ عَلى مُفْرِدٍ ويُقَدَّرُ لَهُ خَبَرٌ مُماثِلٌ لِخَبَرِ اللَّيْلِ، والتَّقْدِيرُ: والشَّمْسُ آيَةٌ لَهم، وتَكُونُ جُمْلَةُ تَجْرِي حالًا مِنَ الشَّمْسِ مِثْلُ جُمْلَةِ ﴿نَسْلَخُ مِنهُ النَّهارَ﴾ [يس: ٣٧] .\nويَجُوزُ أنْ يَكُونَ عَطْفَ جُمْلَةٍ عَلى جُمْلَةٍ ويَكُونُ قَوْلُهُ تَجْرِي خَبَرًا عَنِ الشَّمْسِ، وأيًّا ما كانَ فَهو تَفْصِيلٌ لِإجْمالِ جُمْلَةِ ﴿وآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنهُ النَّهارَ﴾ [يس: ٣٧] إلْخَ كَما دَلَّ عَلَيْهِ قَوْلُهُ الآتِي ﴿ولا اللَّيْلُ سابِقُ النَّهارِ﴾ [يس: ","adwa-al-bayan|8":"قَوْلُهُ تَعالى: ﴿إنّا جَعَلْنا في أعْناقِهِمْ أغْلالًا فَهي إلى الأذْقانِ فَهم مُقْمَحُونَ﴾ ﴿وَجَعَلْنا مِن بَيْنِ أيْدِيهِمْ سَدًّا ومِن خَلْفِهِمْ سَدًّا فَأغْشَيْناهم فَهم لا يُبْصِرُونَ﴾ . الأغْلالُ: جَمْعُ غُلٍّ وهو الَّذِي يَجْمَعُ الأيْدِي إلى الأعْناقِ. والأذْقانُ: جَمْعُ ذَقَنٍ وهو مُلْتَقى اللَّحْيَيْنِ. والمُقْمَحُ بِصِيغَةِ اسْمِ المَفْعُولِ، وهو الرّافِعُ رَأْسَهُ. والسَّدُّ بِالفَتْحِ والضَّمِّ: هو الحاجِزُ الَّذِي يَسُدُّ طَرِيقَ الوُصُولِ إلى ما وراءَهُ.\n\nوَقَوْلُهُ: فَأغْشَيْناهم، أيْ: جَعَلَنا عَلى أبْصارِهِمُ الغِشاوَةَ، وهي الغِطاءُ الَّذِي يَكُونُ عَلى العَيْنِ يَمْنَعُها مِنَ الإبْصارِ، ومِنهُ قَوْلُهُ تَعالى: ﴿وَعَلى أبْصارِهِمْ غِشاوَةٌ﴾ [البقرة: ٧]، وقَوْلُهُ تَعالى","adwa-al-bayan|12":"قَوْلُهُ تَعالى: ﴿إنّا نَحْنُ نُحْيِي المَوْتى ونَكْتُبُ ما قَدَّمُوا وآثارَهم وكُلَّ شَيْءٍ أحْصَيْناهُ في إمامٍ مُبِينٍ﴾ . ذَكَرَ جَلَّ وعَلا في هَذِهِ الآيَةِ الكَرِيمَةِ أرْبَعَةَ أشْياءَ:\n\nالأوَّلَ: أنَّهُ يُحْيِي المَوْتى، مُؤَكِّدًا ذَلِكَ مُتَكَلِّمًا عَنْ نَفْسِهِ بِصِيغَةِ التَّعْظِيمِ.\n\nالثّانِيَ: أنَّهُ يَكْتُبُ ما قَدَّمُوا في دارِ الدُّنْيا.\n\nالثّالِثَ: أنَّهُ يَكْتُبُ آثارَهم.\n\nالرّابِعَ: أنَّهُ أحْصى كُلَّ شَيْءٍ ﴿فِي إمامٍ مُبِينٍ﴾، أيْ: في كِتابٍ بَيِّنٍ واضِحٍ، وهَذِهِ الأشْياءُ الأرْبَعَةُ جاءَتْ مُوَضَّحَةً في غَيْرِ هَذا المَوْضِعِ.\n\nأمّا الأوَّلُ مِنها وهو كَوْنُهُ يُحْيِي المَوْتى بِالبَعْثِ، فَقَدْ جاءَ في آياتٍ كَثِيرَةٍ مِن كِتابِ اللَّهِ تَعالى،\n\n• كَقَوْلِهِ تَعا","adwa-al-bayan|38":"","ar-tafsir-muyassar|8":"لقد وجب العذاب على أكثر هؤلاء الكافرين، بعد أن عُرِض عليهم الحق فرفضوه، فهم لا يصدقون بالله ولا برسوله، ولا يعملون بشرعه. إنا جعلنا هؤلاء الكفار الذين عُرض عليهم الحق فردُّوه، وأصرُّوا على الكفر وعدم الإيمان، كمن جُعِل في أعناقهم أغلال، فجمعت أيديهم مع أعناقهم تحت أذقانهم، فاضطروا إلى رفع رؤوسهم إلى السماء، فهم مغلولون عن كل خير، لا يبصرون الحق ولا يهتدون إليه.","ar-tafsir-muyassar|12":"إنا نحن نحيي الأموات جميعًا ببعثهم يوم القيامة، ونكتب ما عملوا من الخير والشر، وآثارَهم التي كانوا سببًا فيها في حياتهم وبعد مماتهم من خير، كالولد الصالح، والعلم النافع، والصدقة الجارية، ومن شر، كالشرك والعصيان، وكلَّ شيء أحصيناه في كتاب واضح هو أمُّ الكتب، وإليه مرجعها، وهو اللوح المحفوظ. فعلى العاقل محاسبة نفسه؛ ليكون قدوة في الخير في حياته وبعد مماته.","ar-tafsir-muyassar|38":"وآية لهم الشمس تجري لمستقر لها، قدَّره الله لها لا تتعداه ولا تقصر عنه، ذلك تقدير العزيز الذي لا يغالَب، العليم الذي لا يغيب عن علمه شيء.","tafsir-ibn-uthaymeen|8":"ثم قال الله تعالى: ﴿لَقَدْ حَقَّ الْقَوْلُ عَلَى أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ﴾ [يس ٧]، اللام هذه مُوطِّئة للقسم؛ أي أنها تدل على أن هناك قسمًا تقديره: والله لقد حق، و(قد) للتحقيق، وعليه فالجملة مؤكدة بثلاثة مؤكدات: القسم المحذوف، واللام، وقد. وهذا التركيب يأتي في القرآن كثيرًا، وطريقه أو طريق إعرابه ما أشرنا إليه.\n\n﴿لَقَدْ حَقَّ الْقَوْلُ﴾ أي: وجب، حق هنا بمعنى وجب. و﴿الْقَوْلُ﴾ هو القول بالعذاب كقوله تعالى: ﴿كَذَلِكَ حَقَّتْ كَلِمَتُ رَبِّكَ عَلَى الَّذِينَ فَسَقُوا أَنَّهُمْ لَا يُؤْمِنُونَ﴾ [يونس ٣٣] في الآية الأخرى: ﴿أَنَّهُمْ أَصْحَابُ النَّارِ﴾ [غافر ٦].\n\nفمن حقت عليه كلمة العذاب فإنه لا يمكن أن يهتدي مهما أوتي من آية، ولكن لا تحق كلمة العذاب إلا على من استحقها حتى لا يقال: إن ا","tafsir-ibn-uthaymeen|12":"ثم قال الله تعالى: ﴿لَقَدْ حَقَّ الْقَوْلُ عَلَى أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ﴾ [يس ٧]، اللام هذه مُوطِّئة للقسم؛ أي أنها تدل على أن هناك قسمًا تقديره: والله لقد حق، و(قد) للتحقيق، وعليه فالجملة مؤكدة بثلاثة مؤكدات: القسم المحذوف، واللام، وقد. وهذا التركيب يأتي في القرآن كثيرًا، وطريقه أو طريق إعرابه ما أشرنا إليه.\n\n﴿لَقَدْ حَقَّ الْقَوْلُ﴾ أي: وجب، حق هنا بمعنى وجب. و﴿الْقَوْلُ﴾ هو القول بالعذاب كقوله تعالى: ﴿كَذَلِكَ حَقَّتْ كَلِمَتُ رَبِّكَ عَلَى الَّذِينَ فَسَقُوا أَنَّهُمْ لَا يُؤْمِنُونَ﴾ [يونس ٣٣] في الآية الأخرى: ﴿أَنَّهُمْ أَصْحَابُ النَّارِ﴾ [غافر ٦].\n\nفمن حقت عليه كلمة العذاب فإنه لا يمكن أن يهتدي مهما أوتي من آية، ولكن لا تحق كلمة العذاب إلا على من استحقها حتى لا يقال: إن ا","tafsir-ibn-uthaymeen|38":"ثم قال الله عز وجل: ﴿وَآيَةٌ لَهُمُ اللَّيْلُ﴾ [يس ٣٧] نقول في إعرابها ما قلنا في ﴿آيَةٌ لَهُمُ الْأَرْضُ﴾ فيكون ﴿اللَّيْلُ﴾ مبتدأ، و﴿آيَةٌ﴾ خبر مقدم، ونقول في نفس اللفظ كما قلنا في قوله: ﴿أَحْيَيْنَاهَا﴾ أي: أنه يجوز أن تكون صفة لـ(الليل) على حد قول الشاعر:\n\nوَلَقَدْ أَمُرُّ عَلَى اللَّئِيمِ يَسُبُّنِي ∗∗∗ ............................\nويجوز أن تكون الجملة استئنافية؛ لبيان هذه الآية، كيف كان آية؟ كيف كان الليل آية؟ قال: ﴿نَسْلَخُ مِنْهُ النَّهَارَ فَإِذَا هُمْ مُظْلِمُونَ﴾ [يس ٣٧] نسلخ يقول المؤلف: (نفصل) وسمى الله.. سلخًا؛ لأنه يشبه سلخ الجلد من البهيمة ﴿نَسْلَخُ مِنْهُ النَّهَارَ فَإِذَا هُمْ مُظْلِمُونَ﴾؛ لأن النهار أمر وجودي يوجد بوجود الشمس، فهو وارد على الليل، فإذا غابت الشمس تبعها هذا","ar-tafsir-al-wasit|8":"ثم صور - سبحانه - انكبابهم على الكفر ، وإصرارهم عليه ، تصويرا بليغا فقال : ( إِنَّا جَعَلْنَا في أَعْناقِهِمْ أَغْلاَلاً فَهِىَ إِلَى الأذقان فَهُم مُّقْمَحُونَ ) .والأغلال : جمع غل - بضم الغين ، وهو القيد الذى تشد به اليد إلى العنق بقصد التعذيب والأذقان : جمع ذقن - بفتح الذال - وهو أسفل الفم .ومقمحون : من الإِقماح ، وهو رفع الرأس مع غض البصر . يقال : قمح البعير قموحا إذا رفع رأسه عن الحوض ولم يشرب . والفاء فى قوله ( فهى ) وفى قوله ( فهم ) : للتقريع .أى : إنا جعلنا فى أعناق هؤلاء الجاحدين قيودا عظيمة ، فهى - أى هذه القيود - واصلة إلى أذقانهم ، فهم بسبب ذلك مرفوعة رءوسهم ، مع غض أبصارهم ، بحيث لا يستطيعون أن يخفضوها ، لان القيود التى وصلت إلى أذقانهم منعتهم من خفض رءوسهم .فقد شبه - سبحانه - ف","ar-tafsir-al-wasit|12":"ثم أكد - سبحانه - أن البعث حق ، وأن الجزاء حق ، لكى لا يغفل عنهما الناس ، ولكى يستعدوا لهما بالإِيمان والعمل الصالح فقال : ( إِنَّا نَحْنُ نُحْيِي الموتى . . . ) .أى : إنا نحن بقدرتنا وحدها نحيى الموتى بعد موتهم ، ونعيدهم إلى الحياة مرة أخرى لكى نحاسبهم على أعمالهم .( وَنَكْتُبُ مَاَ قَدَّمُواْ وَآثَارَهُمْ ) أى : وإنا نحن الذين نسجل عليهم أعمالهم التى عملوها فى الدنيا سواء أكانت هذه الأعمال صاحلة أم غير صالحة .ونسجل لهم - أيضا - آثارهم التى تركوها بعد موتهم سواء أكانت صالحة كعلم نافع ، أو صدقة جارية .. . أم غير صالحة كدار للهو واللعب ، وكرأى من الآراء الباطلة التى اتبعها من جاء بعددهم ، وسنجازيهم على ذلك بما يستحقون من ثواب أو عقاب ( وَكُلَّ شيْءٍ أَحْصَيْنَاهُ في إِمَامٍ مُّبِينٍ ) أى : وك","ar-tafsir-al-wasit|38":"وقوله - تعالى - : ( والشمس تَجْرِي لِمُسْتَقَرٍّ لَّهَا ) بيان لدليل آخر على قدرته - تعالى - وهو معطوف على قوله - تعالى - قبل ذلك : ( وَآيَةٌ لَّهُمُ الليل . . . )قال الآلوسى ما ملخصه : وقوله ( لِمُسْتَقَرٍّ لَّهَا ) أى لحد معين تنتهى إليه . . شبه بمستقر المسافر إذا انتهى من سيره ، والمستقر عليه اسم مكان ، واللام بمعنى إلى . .ويصح أن يكون اسم زمان ، على أنها تجرى إلى وقت لها لا تتعداه ، وعلى هذا فمستقرها : انتهاء سيرها عند انقضاء الدنيا . .والمعنى : وآية أخرى لهم على قدرتنا ، وهى أن الشمس تجرى إلى مكان معين لا تتعداه وإلى زمن محدد لا تتجاوزه وهذا المكان وذلك الزمان ، كلاهما لا يعلمه إلا الله - تعالى - .قال بعض العلماء : قوله - تعالى - : ( والشمس تَجْرِي لِمُسْتَقَرٍّ لَّهَا ) أى : والشمس تدو","abu-bakr-jabir-al-jazairi|8":"شرح الكلمات:\n\nيسۤ: هذا أحد الحروف المقطعة يكتب هكذا يسۤ، ويقرأ هكذا ياسِينْ والله أعلم بمراده به.\n\nوالقرآن الحكيم: أي ذي الحكمة إذ وضع القرآن كل شيء في موضعه فهو لذلك حكيم ومحكم أيضاً بعجيب النظم وبديع المعاني.\n\nإنك لمن المرسلين: أي يا محمد من جملة الرسل الذين أرسلناهم إلى أقوامهم.\n\nعلى صراط مستقيم: أي طريق مستقيم الذي هو الإسلام.\n\nتنزيل العزيز الرحيم: أي القرآن تنزيل العزيز في انتقامه ممن كفر به الرحيم بمن تاب إليه.\n\nما أنذر آباؤهم: أي لم ينذر آباؤهم إذ لم يأتهم رسول من فترة طويلة.\n\nفهم غافلون: أي لا يدرون عاقبة ما هم فيه من الكفر والضلال، ولا يعرفون ما ينجيهم من ذلك وهو الإيمان وصالح الأعمال.\n\nلقد حق القول على أكثرهم: أي وجب عليهم العذاب فلذا هم لا يؤمنون.\n\nإنا جعلنا في أعناقهم أغلالاً: أي","abu-bakr-jabir-al-jazairi|12":"شرح الكلمات:\n\nيسۤ: هذا أحد الحروف المقطعة يكتب هكذا يسۤ، ويقرأ هكذا ياسِينْ والله أعلم بمراده به.\n\nوالقرآن الحكيم: أي ذي الحكمة إذ وضع القرآن كل شيء في موضعه فهو لذلك حكيم ومحكم أيضاً بعجيب النظم وبديع المعاني.\n\nإنك لمن المرسلين: أي يا محمد من جملة الرسل الذين أرسلناهم إلى أقوامهم.\n\nعلى صراط مستقيم: أي طريق مستقيم الذي هو الإسلام.\n\nتنزيل العزيز الرحيم: أي القرآن تنزيل العزيز في انتقامه ممن كفر به الرحيم بمن تاب إليه.\n\nما أنذر آباؤهم: أي لم ينذر آباؤهم إذ لم يأتهم رسول من فترة طويلة.\n\nفهم غافلون: أي لا يدرون عاقبة ما هم فيه من الكفر والضلال، ولا يعرفون ما ينجيهم من ذلك وهو الإيمان وصالح الأعمال.\n\nلقد حق القول على أكثرهم: أي وجب عليهم العذاب فلذا هم لا يؤمنون.\n\nإنا جعلنا في أعناقهم أغلالاً: أي","abu-bakr-jabir-al-jazairi|38":"شرح الكلمات:\n\nوآية لهم الليل نسلخ منه النهار: وآية لهم على إمكان البعث الليل نسلخ منه النهار أي نزيل النهار عن الليل فإذا هم مظلمون بالليل.\n\nلمستقر لها: أي مكان لها لا تتجاوزه.\n\nذلك تقدير العزيز العليم: أي جريها في فلكها تقدير أي تقنين العزيز في ملكه العليم بكل خلقه.\n\nوالقمر قدرناه منازل: وآية أخرى هي تقدير منازل القمر التي هي ثمان وعشرون منزلة.\n\nحتى عاد كالعرجون القديم: أي حتى رجع كعود العذق الذي أصله في النخلة وآخره في الشماريخ وهو أصفر دقيق مقوس كالقمر لما يكون في آخر الشهر.\n\nلا الشمس ينبغي لها أن تدرك القمر: أي لا يصح للشمس ولا يسهل عليها أن تدرك القمر فيجتمعان في الليل.\n\nولا الليل سابق النهار: أي بأن يأتي قبل انقضائه.\n\nوكل في فلك يسبحون: أي كل من الشمس والقمر والنجوم السيارة في فلك يسبح","bn-tafsir-ahsanul-bayaan|8":"আমি ওদের গলদেশে মোটা বেড়ি পরিয়েছি, তা ওদের চিবুক পর্যন্ত বর্তমান, ফলে ওরা ঊর্ধ্বমুখী হয়ে আছে। [১]\n\n[১] যার ফলে তারা না এদিক ওদিক দেখতে পারে, আর না মাথা ঝুঁকাতে পারে। বরং তারা মাথা উপর দিকে উঠিয়ে ও চোখ নিচের দিকে নামিয়ে থাকবে। এটা তাদের সত্য প্রত্যাখ্যান ও কার্পণ্য করার উদাহরণ। এও হতে পারে যে, এটা তাদের জাহান্নামের শাস্তি-পদ্ধতির বর্ণনা। (আইসারুত তাফাসীর)","bn-tafsir-ahsanul-bayaan|12":"নিশ্চয় আমি মৃতকে জীবিত করি[১] এবং লিখে রাখি ওদের কৃতকর্ম ও যা ওরা পশ্চাতে রেখে যায়, [২] আমি প্রত্যেক জিনিস স্পষ্ট গ্রন্থে সংরক্ষিত রেখেছি। [৩]\n\n[১] অর্থাৎ, কিয়ামত দিবসে। এখানে মৃতকে জীবিত করার বর্ণনায় উদ্দেশ্য এই ইঙ্গিত করা যে, আল্লাহ তাআলা কাফেরদের মধ্য হতে যার অন্তরকে চান জীবিত করে দেন; যা কুফর ও ভ্রষ্টতার কারণে মৃত হয়ে গিয়েছিল। ফলে সে হিদায়াত ও ঈমান গ্রহণ করে নেয়।\n\n[২] مَا قَدَّمُوْا দ্বারা ঐ সকল আমল বা কৃতকর্মকে বুঝানো হয়েছে, যা মানুষ নিজের জীবনে করে থাকে। এবং 'آثَارَهُمْ দ্বারা ঐ সকল ভাল ও মন্দ আমলের নমুনাকে বুঝানো হয়েছে, যা সে পৃথিবীতে ছেড়ে যায় এবং তার মৃত্যুর পর তার অনুসরণে মানুষ সেই আমল করতে থাকে। যেমন হাদীসে আছে, \"যে ব্যক্তি ইসলামে কোন ভালো রীতি (বা কর্ম) প্রবর্তিত করে, তার জন্য রয়ে","bn-tafsir-ahsanul-bayaan|38":"আর সূর্য তার নির্দিষ্ট গন্ডীর মধ্যে আবর্তন করে;[১] এ পরাক্রমশালী সর্বজ্ঞ (আল্লাহর) নিয়ন্ত্রণ।\n\n[১] অর্থাৎ, নিজের সেই কক্ষ পথে ঘোরে, যা আল্লাহ তাআলা তার জন্য নির্ধারিত করে রেখেছেন। নির্দিষ্ট সেই স্থান থেকে তারা পরিক্রমা আরম্ভ করে এবং সেই স্থানেই ভ্রমণ শেষ করে। তা থেকে সামান্য পরিমাণও এমন এদিক ওদিক হয় না যে, তার ফলে কোন অন্য চলমান গ্রহের সাথে ধাক্কা লেগে যাবে। দ্বিতীয় অর্থ হল, \"নিজ অবস্থান ক্ষেত্রের জন্য।\" আর তার ঐ ক্ষেত্র হল আরশে ইলাহীর নিম্নদেশ। যেমন হাদীসে বর্ণনা হয়েছে যে, \"সূর্য প্রত্যহ অস্তমিত হওয়ার পর আরশের নিচে গিয়ে সিজদা করে। অতঃপর সেখান থেকে পুনরায় উদিত হওয়ার অনুমতি চায়।\" (বুখারীঃ সূরা ইয়াসীনের তফসীর) দুই অর্থেই لِمُسْتَقَرٍّ শব্দটিতে লাম ইল্লাত (কারণ বর্ণনা) এর জন্য ব্যবহার হয়েছে। অর","ar-tafsir-al-mukhtasar|8":"ومثلهم في ذلك مثل من جُعِلَت أصفاد في أعناقهم، وجُمِعَت أيديهم مع أعناقهم تحت مجامع لحاهم، فاضطروا إلى رفع رؤوسهم إلى السماء، فلا يستطيعون خفضها، فهؤلاء مَغْلُولون عن الإيمان بالله فلا يذعنون له، ولا يخفضون رؤوسهم من أجله.","ar-tafsir-al-mukhtasar|12":"إنا نحن نحيي الموتى ببعثهم للحساب يوم القيامة، ونكتب ما قدموه في حياتهم الدنيا من الأعمال الصالحة والسيئة، ونكتب ما كان لهم من أثر باق بعد مماتهم صالحًا كان كالصدقة الجارية أو سيئًا كالكفر، وقد أحصينا كل شيء في كتاب واضح؛ وهو اللوح المحفوظ.","ar-tafsir-al-mukhtasar|38":"وعلامة لهم على وحدانية الله هذه الشمس التي تجري لمستقر يعلم الله قَدْرَه لا تتجاوزه، ذلك التقدير تقدير العزيز الذي لا يغالبه أحد، العليم الذي لا يخفى عليه شيء من أمر مخلوقاته.","bengali-mokhtasar|8":"৮. এতে তাদের উদাহরণ হচ্ছে ওই সব লোকজনের ন্যায় যাদের গর্দানে শিকল চাপিয়ে দেয়া হয়েছে। আর তাদের হাতকে গর্দানসহ দাড়ি সমষ্টির নিচে জড় করা হয়েছে। ফলে তারা আসমানের দিকে মাথা উঠাতে এমনভাবে বাধ্য হয়েছে যে, তা আর নিচের দিকে আনতে পারে না। ফলে এরা ঈমান আনয়নের পথে শিকলাবদ্ধ। তারা এটি মেনে নেয়ার জন্য সম্মত হবে না এবং এতদুদ্দেশ্যে তাদের মাথাও নত করবে না।","bengali-mokhtasar|12":"১২. আমি অবশ্যই মৃতদেরকে হিসাব নেয়ার উদ্দেশ্যে কিয়ামত দিবসে জীবিত করবো। আর লিপিবদ্ধ করবো তারা দুরিয়ার জীবনে ভাল মন্দ যা করেছে। আমি আরো লিপিবদ্ধ করে রাখব যা তাদের মরণের পর অবশিষ্ট থাকবে। যেমন ভাল কাজের মধ্যে রয়েছে চলমান সাদকা কিংবা মন্দ যেমন কুফরি। বস্তুতঃ আমি সব কিছুই একটি সুস্পষ্ট কিতাবে রক্ষিত করে রেখেছি যার নাম লাওহে মাহফুজ।","bengali-mokhtasar|38":"৩৮. আল্লাহর একত্ববাদের আরেকটি নিদর্শন হলো এই সূর্য যা তার লক্ষ্য পথে চলতে থাকে। যার পরিমাণ আল্লাহর জানা। সে তাকে অতিক্রম করে না। এই নির্ধারক মহা পরাক্রমশালী যাকে কেউ পরাস্ত করতে পারে না। তিনি সর্বজ্ঞাতা। যাঁর নিকট সৃষ্টিকুলের কোন কিছুই গোপন থাকে না।"}}</script>

function arc(r0,r1,a0,a1){ const big=(a1-a0)>Math.PI?1:0; const [x0,y0]=P(r1,a0),[x1,y1]=P(r1,a1),[x2,y2]=P(r0,a1),[x3,y3]=P(r0,a0);
 return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r1} ${r1} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}L${x2.toFixed(2)} ${y2.toFixed(2)}A${r0} ${r0} 0 ${big} 0 ${x3.toFixed(2)} ${y3.toFixed(2)}Z`; }
function bands(r0,r1,a0,a1,keys,attrs,gap){ const ks=ORDER.filter((k)=>keys.has(k)&&active(k)); const g=gap??0.0;
 if(!ks.length) return `<path class="seg" d="${arc(r0,r1,a0+g,a1-g)}" fill="${none()}" ${attrs}/>`;
 const h=(r1-r0)/ks.length; return ks.map((k,i)=>`<path class="seg" d="${arc(r0+i*h,r0+(i+1)*h,a0+g,a1-g)}" fill="${col(k)}" ${attrs}/>`).join(""); }
const TAU=Math.PI*2;
function centre(t1,t2,t3){ return `<circle cx="${C}" cy="${C}" r="${R0-6}" fill="var(--card)" stroke="var(--line)"/>
 <text x="${C}" y="${C-14}" text-anchor="middle" style="font:700 30px Amiri,serif;fill:var(--navy)">${esc(t1)}</text>
 <text x="${C}" y="${C+16}" text-anchor="middle" style="font:600 15px system-ui;fill:var(--ink)">${esc(t2)}</text>
 <text x="${C}" y="${C+36}" text-anchor="middle" style="font:13px system-ui;fill:var(--mut)">${esc(t3)}</text>`; }
let R0=95;
function draw(){
 const s=[]; R0=95;
 if(view==="quran"){
  const tot=D.all.reduce((n,s)=>n+s.length,0); let k=0;
  D.all.forEach((sur,si)=>{ const a0=k/tot*TAU, a1=(k+sur.length)/tot*TAU;
   const hit=sur.filter((r)=>(active("gharib")&&r[1])||(active("hadith")&&r[3])||(active("wujuh")&&r[2])).length/sur.length;
   s.push(`<path class="seg" d="${arc(100,150,a0+0.002,a1-0.002)}" fill="var(--navy)" fill-opacity="${(0.12+0.85*hit).toFixed(2)}" data-s="${si}"><title>${esc(D.names[si][1])}: ${Math.round(hit*100)}% of its āyāt carry a shown key</title></path>`);
   sur.forEach((r,ai)=>{ const b0=(k+ai)/tot*TAU,b1=(k+ai+1)/tot*TAU; const ks=new Set(); if(r[1]) ks.add("gharib"); if(r[2]) ks.add("wujuh"); if(r[3]) ks.add("hadith");
    s.push(bands(156,290,b0,b1,ks,`data-s="${si}" data-a="${ai}"`)); });
   k+=sur.length; });
  s.push(centre("القرآن","The whole Qur'an","114 Surahs · 6,236 āyāt"));
 } else if(view==="ayat"){
  YS.forEach((a,i)=>{ const a0=i/A*TAU,a1=(i+1)/A*TAU; s.push(bands(120,280,a0,a1,ayKeys[i],`data-a="${i}"`,0.004));
   const [x,y]=P(290,(a0+a1)/2); if(A<=120) s.push(`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" style="font:9px system-ui;fill:var(--mut)">${i+1}</text>`); });
  R0=120; s.push(centre("يس","Yā-Sīn (36)","83 āyāt"));
 } else if(view==="word1"){
  const ws=YS[ay].w, n=ws.length;
  ws.forEach((w,j)=>{ const a0=j/n*TAU,a1=(j+1)/n*TAU; s.push(bands(150,250,a0,a1,wdKeys[ay][j],`data-a="${ay}" data-w="${j}"`,0.01));
   const [x,y]=P(275,(a0+a1)/2); s.push(`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" style="font:${n>14?15:19}px Amiri,serif;fill:var(--ink)">${esc(w[0])}</text>`); });
  R0=150; s.push(centre(`٣٦ : ${String(ay+1).replace(/\d/g,(d)=>"٠١٢٣٤٥٦٧٨٩"[d])}`,`Āyah 36:${ay+1}`,`${n} words`));
 } else {
  const tot=YS.reduce((n,a)=>n+a.w.length,0); let k=0;
  YS.forEach((a,i)=>{ const a0=k/tot*TAU,a1=(k+a.w.length)/tot*TAU; s.push(bands(105,165,a0,a1,ayKeys[i],`data-a="${i}"`,0.003));
   a.w.forEach((w,j)=>{ s.push(bands(171,290,(k+j)/tot*TAU,(k+j+1)/tot*TAU,wdKeys[i][j],`data-a="${i}" data-w="${j}"`)); }); k+=a.w.length; });
  R0=105; s.push(centre("يس","Inner: 83 āyāt","Outer: 725 words"));
 }
 $("#svg").innerHTML=s.join("");
 legend(); markSel();
}
function markSel(){ document.querySelectorAll("#svg .sel").forEach((e)=>e.classList.remove("sel"));
 const q=pick.t==="word"?`[data-a="${pick.i}"][data-w="${pick.j}"]`:pick.t==="ayah"?`[data-a="${pick.i}"]:not([data-w]):not([data-s])`:`[data-s="${pick.i}"]:not([data-a])`;
 document.querySelectorAll("#svg "+q).forEach((e)=>e.classList.add("sel")); }
function legend(){ const lv=view==="quran"?["gharib","hadith","wujuh"]:view==="ayat"?ORDER.filter((k)=>KEYS[k].lvl!=="word"):view==="word1"?ORDER.filter((k)=>KEYS[k].lvl!=="ayah"):ORDER;
 $("#legend").innerHTML=lv.filter(active).map((k)=>`<span class="chip"><span class="dot" style="background:${col(k)}"></span>${esc(KEYS[k].n)}</span>`).join("")+`<span class="chip"><span class="dot" style="background:${none()}"></span>No key</span>`+(view==="quran"&&only==="all"?`<span>· Wujūh is left out of “All” here: it touches 4,910 of 6,236 āyāt, so it would colour almost everything. Choose it on its own to see it.</span>`:""); }
// ---------- panel ----------
const LBL={sahaba:"Sahaba and Tabi'in (Approaches 28, 29)",gen1:"Gen1: to 1258 (Approach 30)",gen2:"Gen2: 1258 to about 1700 (Approach 31)",gen3:"Gen3: about 1700 to 1924",gen4:"Gen4: 1924 to 1945",gen5:"Gen5: 1945 to 2001",gen6:"Gen6: 2001 onward"};
function scholars(n){
 if(![8,12,38].includes(n)) return `<p class="meta">In this demo the scholars' texts are loaded for āyāt 8, 12 and 38 only. In the app they would load for any āyah when you open this part (never at startup).</p>`;
 let h="";
 Object.keys(LBL).forEach((g)=>{ const rows=SC.meta.filter((m)=>m[6]===g);
  if(!rows.length){ h+=`<details class="era"><summary>${LBL[g]} · none in the open sources</summary><div class="src meta">No tafsir from this era is in the open set we checked (Rashīd Riḍā's al-Manār and al-Marāghī belong here). A gap to fill by hand.</div></details>`; return; }
  h+=`<details class="era"${g==="sahaba"||g==="gen1"?" open":""}><summary>${LBL[g]} · ${rows.length}</summary>`+rows.map((m)=>{ const t=SC.text[m[0]+"|"+n]||""; const bn=/[ঀ-৿]/.test(t);
   return `<div class="src"><b>${esc(m[1])}</b> <span class="meta">${m[3]?`d. ${m[3]} AH / ${m[4]} CE`:`published ${m[4]}`} · ${esc(m[5])} · Approach ${esc(m[7])}</span><div class="meta"><i>${esc(m[2])}</i></div>`+
    (t?`<div class="${bn?"":"arsm"}" data-full="${esc(t)}">${esc(t.slice(0,260))}${t.length>260?"…":""}</div>${t.length>260?'<button class="more">Show more</button>':""}`:`<div class="meta">No comment on this āyah in this book (it explains selected āyāt only).</div>`)+`</div>`; }).join("")+`</details>`; });
 return h+`<p class="note">Order: by the scholar's death year. Some books explain two or three āyāt together, so an excerpt can begin with the āyah before. Texts: the open tafsir set (spa5k/tafsir_api, from quran.com and QUL), not yet checked for rights.</p>`;
}
function hadithHtml(n){ const L=D.ysHadith[`36:${n}`];
 if(!L) return `<p class="meta">None of our 15 books quotes this āyah word for word. That does not mean there is no related hadith: the tafsirs that collect narrations (Ibn Kathīr, al-Suyūṭī's ad-Durr al-Manthūr, the Mawsū'ah) list the hadith they connect to each āyah. See the scholars below.</p>`;
 return L.map(([b,std,t])=>`<div class="had"><div><b>${esc(b)} ${std?esc(std):"(passage)"}</b></div><div class="arsm">${esc(t.slice(0,330))}${t.length>330?"…":""}</div></div>`).join("")+`<p class="meta">Found by two automatic tests: the book's own label on a quotation, such as [يس: 38], and a five-word run found in this āyah only. In the app each would open in the Hadith module with a way back here.</p>`; }
function ayPanel(i){ const a=YS[i], n=i+1, ks=ORDER.filter((k)=>ayKeys[i].has(k));
 const ar=a.w.map((w)=>w[0]).join(" ");
 let h=`<h2>Āyah 36:${n}</h2><div class="ar">${esc(ar)}</div><p>${esc(a.en)}</p><p class="meta">${esc(a.bn)}</p><h3>Keys on this āyah</h3>`;
 h+=ks.length?ks.map((k)=>{ let x=KEYS[k].g; if(k==="quran") x+=` See ${QREF[n]}.`; if(k==="siyaq"){ const p=PASS.find(([f,t])=>n>=f&&n<=t); x+=` Āyāt ${p[0]}–${p[1]}: ${p[2]}.`; }
  return `<div class="key"><span class="dot" style="background:${col(k)};margin-top:6px"></span><div><b>${esc(KEYS[k].n)}</b> <span class="tag ${KEYS[k].src}">${KEYS[k].src==="you"?"your mark (example)":KEYS[k].src==="auto"?"found automatically":"suggested"}</span><div class="meta">${esc(x)}</div></div></div>`; }).join(""):`<p class="meta">No key yet.</p>`;
 h+=`<p><button class="btn" id="tglHard">${ayKeys[i].has("hard")?"✓ Hard for me (tap to clear)":"Mark: Hard for me"}</button> <button class="btn" id="seeWords">See its words</button></p>`;
 h+=`<h3>Related hadith</h3>`+hadithHtml(n)+`<h3>Scholars across the eras</h3>`+scholars(n);
 return h; }
function wordPanel(i,j){ const w=YS[i].w[j], ks=ORDER.filter((k)=>wdKeys[i][j].has(k));
 let h=`<h2>Word ${j+1} of āyah 36:${i+1}</h2><div class="ar">${esc(w[0])}</div><p><b>${esc(w[4])}</b> · <span>${esc(w[5])}</span></p>`;
 h+=`<p class="meta">Root-word (lemma) <span class="arsm" style="display:inline">${esc(w[1]||"—")}</span>, used ${w[2]} time${w[2]===1?"":"s"} in the Qur'an.</p>`;
 if(w[6]||w[7]) h+=`<p class="meta">Dictionary: ${esc(w[6])}${w[7]?` · ${esc(w[7])}`:""}</p>`;
 h+=`<h3>Keys on this word</h3>`+(ks.length?ks.map((k)=>`<div class="key"><span class="dot" style="background:${col(k)};margin-top:6px"></span><div><b>${esc(KEYS[k].n)}</b> <span class="tag ${KEYS[k].src}">${KEYS[k].src==="you"?"your mark (example)":KEYS[k].src==="auto"?"found automatically":"suggested"}</span><div class="meta">${esc(KEYS[k].g)}</div></div></div>`).join(""):`<p class="meta">No key yet.</p>`);
 h+=`<p><button class="btn" id="tglHard">${wdKeys[i][j].has("hard")?"✓ Hard for me (tap to clear)":"Mark: Hard for me"}</button> <button class="btn" id="seeAyah">Its āyah</button></p>`;
 return h; }
function surPanel(si){ const sur=D.all[si], nm=D.names[si];
 const c=(x)=>sur.filter((r)=>r[x]).length;
 return `<h2>${esc(nm[1])} (${si+1})</h2><div class="ar">${esc(nm[0])}</div><p>${sur.length} āyāt · ${sur.reduce((n,r)=>n+r[0],0)} words</p>
 <div class="key"><span class="dot" style="background:${col("hadith")};margin-top:6px"></span><div><b>${c(3)}</b> āyāt quoted in a hadith</div></div>
 <div class="key"><span class="dot" style="background:${col("gharib")};margin-top:6px"></span><div><b>${sur.reduce((n,r)=>n+r[1],0)}</b> words used only once in the Qur'an, in ${c(1)} āyāt</div></div>
 <div class="key"><span class="dot" style="background:${col("wujuh")};margin-top:6px"></span><div><b>${sur.reduce((n,r)=>n+r[2],0)}</b> words whose root has more than one meaning</div></div>
 ${si===35?`<p><button class="btn" id="openYs">Open Yā-Sīn's āyāt</button></p>`:`<p class="meta">In this demo only Yā-Sīn (36) opens further. In the app every Surah would.</p>`}`; }
function panel(){ const p=$("#panel");
 p.innerHTML=pick.t==="word"?wordPanel(pick.i,pick.j):pick.t==="ayah"?ayPanel(pick.i):pick.t==="surah"?surPanel(pick.i):"";
 p.querySelectorAll(".more").forEach((b)=>b.onclick=()=>{ const d=b.previousElementSibling; d.textContent=d.dataset.full; b.remove(); });
 const t=$("#tglHard"); if(t) t.onclick=()=>{ const set=pick.t==="word"?wdKeys[pick.i][pick.j]:ayKeys[pick.i]; set.has("hard")?set.delete("hard"):set.add("hard"); draw(); panel(); };
 const sw=$("#seeWords"); if(sw) sw.onclick=()=>{ ay=pick.i; setView("word1"); };
 const sa=$("#seeAyah"); if(sa) sa.onclick=()=>{ pick={t:"ayah",i:pick.i}; setView("ayat"); };
 const oy=$("#openYs"); if(oy) oy.onclick=()=>{ pick={t:"ayah",i:0}; setView("ayat"); };
}
$("#svg").addEventListener("click",(e)=>{ const g=e.target.closest(".seg"); if(!g) return; const d=g.dataset;
 if(d.w!=null) pick={t:"word",i:+d.a,j:+d.w}; else if(d.s!=null&&d.a!=null){ if(+d.s===35) pick={t:"ayah",i:+d.a}; else pick={t:"surah",i:+d.s}; } else if(d.s!=null) pick={t:"surah",i:+d.s}; else pick={t:"ayah",i:+d.a};
 if(pick.t==="ayah"||pick.t==="word") ay=pick.i, $("#aySel").value=ay;
 markSel(); panel(); });
function setView(v){ view=v; document.querySelectorAll("[data-view]").forEach((b)=>b.setAttribute("aria-pressed",String(b.dataset.view===v)));
 $("#ayPick").hidden=v!=="word1"; if(v==="word1"&&pick.t!=="word") pick={t:"ayah",i:ay}; if(v==="quran"&&pick.t!=="surah") pick={t:"surah",i:35};
 if(v!=="quran"&&pick.t==="surah") pick={t:"ayah",i:ay};
 keyBar(); draw(); panel(); }
document.querySelectorAll("[data-view]").forEach((b)=>b.onclick=()=>setView(b.dataset.view));
$("#aySel").innerHTML=YS.map((a,i)=>`<option value="${i}">36:${i+1}</option>`).join(""); $("#aySel").value=ay;
$("#aySel").onchange=()=>{ ay=+$("#aySel").value; pick={t:"ayah",i:ay}; draw(); panel(); };
function keyBar(){ const lv=view==="quran"?["gharib","wujuh","hadith"]:view==="ayat"?ORDER.filter((k)=>KEYS[k].lvl!=="word"):view==="word1"?ORDER.filter((k)=>KEYS[k].lvl!=="ayah"):ORDER;
 if(only!=="all"&&!lv.includes(only)) only="all";
 $("#keyBar").innerHTML=`<span class="lab">Keys</span><button class="btn" data-k="all" aria-pressed="${only==="all"}">All</button>`+lv.map((k)=>`<button class="btn chip" data-k="${k}" aria-pressed="${only===k}"><span class="dot" style="background:${col(k)}"></span>${esc(KEYS[k].n)}</button>`).join("");
 document.querySelectorAll("[data-k]").forEach((b)=>b.onclick=()=>{ only=b.dataset.k; keyBar(); draw(); }); }
setView("ayat");
})();
</script>
</body></html>
