<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuranRevival — Phase 4/5</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem 4rem; color: #222; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 1.6rem; }
  h3 { font-size: 1rem; }
  h4 { font-size: 0.88rem; margin: 0.6rem 0 0.15rem; color: #555; }
  label { display: block; margin: 0.5rem 0 0.2rem; font-weight: 600; font-size: 0.85rem; }
  select, textarea, input[type="text"] { padding: 0.4rem; font-size: 0.92rem; border: 1px solid #ccc; border-radius: 0.35rem; }
  button { font-size: 0.88rem; padding: 0.35rem 0.8rem; border-radius: 0.4rem; border: 1px solid #ccc; background: #1F3A6E; color: white; cursor: pointer; }
  button.secondary { background: white; color: #1F3A6E; }
  button:disabled { opacity: 0.5; cursor: default; }
  #who { margin: 1rem 0; font-size: 0.95rem; color: #555; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end; margin: 0.6rem 0; }
  .row > div { min-width: 9rem; }

  /* ---------- Shared nav (shell round 1) ---------- */
  .app-nav { display: flex; gap: 1rem; margin-bottom: 1rem; padding-bottom: 0.6rem; border-bottom: 1px solid #e5e5e5; }
  .app-nav .nav-link { color: #1F3A6E; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
  .app-nav .nav-link:hover { text-decoration: underline; }
  .app-nav .nav-current { color: #888; cursor: default; pointer-events: none; }
  .nav-preview-notice { margin-left: auto; font-size: 0.82rem; color: #8a6220; background: #f5ebd6; padding: 0.15rem 0.6rem; border-radius: 0.7rem; }

  /* ---------- Splash screens (shell round 2, ported from index.html) ---------- */
  .app-splash-overlay { position: fixed; inset: 0; z-index: 20000; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at top, #2a3a57 0%, #1B2A41 55%, #121b2c 100%); font-family: 'Inter', system-ui, sans-serif; }
  .splash-slide { display: none; text-align: center; padding: 40px 24px; max-width: 560px; }
  .splash-slide.show { display: block; animation: splashFade .6s ease; }
  @keyframes splashFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .splash-arabic { font-family: 'Amiri', serif; font-size: 44px; color: #C9A24B; line-height: 1.6; margin-bottom: 18px; direction: rtl; }
  .splash-translit { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: #b9c2d4; font-style: italic; margin-bottom: 10px; }
  .splash-english { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: #F2E8D5; line-height: 1.5; }
  .splash-gear { position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: #e2e8f0; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .splash-gear:hover { background: rgba(255,255,255,.16); }
  .splash-panel { display: none; position: absolute; top: 60px; right: 18px; width: 230px; background: #13192a; border: 1px solid rgba(201,162,75,.3); border-radius: 10px; padding: 14px; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .splash-panel.open { display: block; }
  .splash-panel h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #C9A24B; }
  .splash-panel label { display: block; font-size: 13px; color: #e2e8f0; margin-bottom: 8px; cursor: pointer; }
  .splash-panel input { margin-right: 8px; }
  .splash-qs-wrap { max-width: 640px; padding: 40px 28px; text-align: center; }
  .splash-qs-item { opacity: 0; transform: translateY(10px); animation: splashQsFade .9s ease forwards; }
  @keyframes splashQsFade { to { opacity: 1; transform: translateY(0); } }
  .splash-qs-title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(36px,6vw,58px); color: #C9A24B; letter-spacing: .01em; margin: 0 0 12px; }
  .splash-qs-tagline1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(16px,2.4vw,21px); color: #F2E8D5; margin: 0 0 30px; }
  .splash-qs-divider { width: 70px; height: 1px; background: linear-gradient(to right, transparent, #C9A24B, transparent); margin: 0 auto 30px; position: relative; }
  .splash-qs-divider:after { content: ""; position: absolute; left: 50%; top: -3px; width: 6px; height: 6px; background: #C9A24B; transform: translateX(-50%) rotate(45deg); }
  .splash-qs-project { font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: .16em; font-size: 12px; color: #b9c2d4; margin: 0 0 14px; }
  .splash-qs-tagline2 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(14px,1.8vw,17px); color: #c7cfe0; line-height: 1.5; margin: 0 auto 28px; max-width: 480px; }
  .splash-qs-motto { font-family: 'Inter', sans-serif; font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; color: #A4823A; }

  /* ---------- Global banner (Phase 5) ---------- */
  #globalBanner { border-bottom: 2px solid #DDE4F0; padding-bottom: 0.6rem; margin-bottom: 0.6rem; }
  #bannerTitle { font-size: 1.5rem; margin: 0; }
  #bannerSub { color: #555; margin: 0.2rem 0 0; }
  #bannerEditForm { display: none; gap: 0.5rem; flex-direction: column; max-width: 30rem; }
  #bannerEditForm input { width: 100%; box-sizing: border-box; }
  #bannerEditBtn { font-size: 0.75rem; padding: 0.2rem 0.5rem; }

  /* ---------- Mastery Wheel (Phase 5 round 12) ----------
     Dark navy/gold theme, restyled to match index.html's wheel page --
     fonts, palette and ring geometry read from its CSS/JS, never imported
     from it directly (index.html stays reference-only, as always).
     Scoped deliberately to just this card: the rest of the page (nav,
     banner, study screen, Way modal, drill controls, Mushaf page view)
     is untouched, per the owner's own scope call this round. */
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap');
  .wheel-heading { font-family: 'Cormorant Garamond', serif; font-weight: 600; color: #C9A24B; margin-bottom: 0.4rem; }
  .wheel-box {
    display: flex; gap: 1.75rem; flex-wrap: wrap; align-items: flex-start;
    background: radial-gradient(ellipse at top, #2a3a57 0%, #1B2A41 55%, #121b2c 100%);
    border: 1px solid rgba(201,162,75,0.3); border-radius: 14px; padding: 1.5rem;
    color: #F2E8D5; font-family: 'Inter', sans-serif;
  }
  .wheel-col { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; flex: 1 1 320px; min-width: 0; }
  .wheel-box .hint { color: #8fa0c2; font-size: 0.8rem; text-align: center; margin: 0; }
  .mastery-wheel { max-width: 320px; overflow: visible; }
  .wheel-seg { cursor: pointer; stroke: #0c1320; stroke-width: 1; transition: stroke .15s, stroke-width .15s; }
  .wheel-seg:hover { stroke: #F2E8D5; stroke-width: 1.5; }
  .wheel-seg-num { font-family: 'Inter', sans-serif; font-size: 8px; font-weight: 600; fill: #F2E8D5; }
  .wheel-legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 0.78rem; color: #cdd5e3; }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  /* Companion list panel -- index.html's .ways-list / .way-row / .status-chip pattern, alongside the wheel. */
  .wheel-sidebar { flex: 1 1 260px; min-width: 220px; max-width: 340px; }
  .ways-list { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; }
  .way-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; background: rgba(255,255,255,0.03); border: 1px solid transparent; cursor: pointer; transition: background .12s; }
  .way-row:hover { background: rgba(255,255,255,0.07); border-color: rgba(201,162,75,0.25); }
  .way-row .badge { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; flex-shrink: 0; color: #241a06; background: #C9A24B; }
  .way-row .name { flex: 1; font-size: 13px; color: #dde3ee; }
  .way-row .status-chip { font-size: 10px; padding: 3px 9px; border-radius: 10px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; white-space: nowrap; }
  /* Named by status id, not position (chip-0..chip-4 the way index.html did it) -- this build's six statuses are id-keyed (I5), not order-keyed. */
  .chip-not_applicable { background: rgba(255,255,255,0.03); color: #6b7688; border: 1px dashed rgba(255,255,255,0.18); }
  .chip-not_started { background: rgba(255,255,255,0.08); color: #8fa0c2; }
  .chip-learning { background: rgba(201,162,75,0.18); color: #C9A24B; }
  .chip-practising { background: rgba(201,162,75,0.4); color: #fff0cf; }
  .chip-achieved { background: rgba(91,132,196,0.35); color: #cfe0ff; }
  .chip-mastered { background: #3fae74; color: #0d2417; }

  /* ---------- Study Unit picker (Phase 5) ---------- */
  #unitLabel { font-size: 0.85rem; color: #1F3A6E; font-weight: 600; margin: 0.3rem 0; }

  /* ---------- Explore (Phase 5) ---------- */
  #explorePanel { margin-top: 0.6rem; } /* border/background/padding now come from .wheel-box (Phase 5 round 12) */

  /* ---------- Study screen ---------- */
  #studyScreen { border: 1px solid #e5e5e5; border-radius: 0.6rem; padding: 1rem; margin-top: 1rem; }
  .ayah-arabic { font-family: 'Traditional Arabic', 'Amiri', serif; font-size: 1.7rem; line-height: 2.6rem; text-align: right; margin: 0.6rem 0; }
  .ayah-num { color: #B8862F; font-size: 1rem; }
  .ayah-translation { font-size: 0.95rem; color: #333; margin: 0.3rem 0; }
  .ayah-translation-bn { font-family: 'Noto Sans Bengali', sans-serif; color: #555; }
  .wbw-strip, .root-deriv-strip { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 0.6rem 0; }
  .wbw-word, .root-row { border: 1px solid #eee; border-radius: 0.4rem; padding: 0.3rem 0.5rem; text-align: center; min-width: 4.5rem; }
  .wbw-arabic, .root-word, .root-root, .root-lemma { font-family: 'Amiri', serif; font-size: 1.15rem; }
  .wbw-translit { font-size: 0.72rem; color: #888; font-style: italic; }
  .wbw-gloss { font-size: 0.8rem; }
  .wbw-gloss-bn { font-family: 'Noto Sans Bengali', sans-serif; color: #555; }
  .root-pos { font-size: 0.7rem; color: #888; }
  .root-root { color: #1F3A6E; }
  .root-count { font-size: 0.65rem; color: #999; margin-left: 0.2rem; }
  .wbw-empty { color: #888; font-size: 0.85rem; }
  .panel-notes, .panel-reflection, .panel-writing textarea { width: 100%; box-sizing: border-box; margin: 0.4rem 0; }
  .panel-checklist { font-weight: 400; }

  /* Tajweed colours -- same proven values as the legacy app (reference only, never imported). */
  .tajweed-ham_wasl, .tajweed-laam_shamsiyah, .tajweed-slnt, .tajweed-silent { color: #9aa3b5; }
  .tajweed-madda_normal, .tajweed-ghunnah { color: #FF7E1E; }
  .tajweed-madda_necessary, .tajweed-madda_obligatory, .tajweed-qalaqah { color: #e04040; }
  .tajweed-madda_permissible { color: #4d7dff; }
  .tajweed-ikhafa, .tajweed-ikhafa_shafawi { color: #c651c6; }
  .tajweed-iqlab { color: #26bffd; }
  .tajweed-idgham_ghunnah, .tajweed-idgham_wo_ghunnah, .tajweed-idgham_mutajanisayn, .tajweed-idgham_mutaqaribayn, .tajweed-idgham_shafawi { color: #1fa87a; }
  .tajweed-end { color: #B8862F; }

  /* ---------- Drill controls (Phase 5) ---------- */
  #drillControls { border-top: 1px dashed #ddd; margin-top: 0.5rem; padding-top: 0.5rem; }
  #drillReciterChecks label { display: block; font-weight: 400; font-size: 0.85rem; }

  /* ---------- Way modal ---------- */
  #wayModalOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 50; }
  #wayModalOverlay.open { display: flex; }
  .way-modal { background: white; border-radius: 0.6rem; max-width: 34rem; width: 92%; max-height: 85vh; overflow-y: auto; padding: 1rem 1.2rem; }
  .way-modal-header { display: flex; justify-content: space-between; align-items: center; }
  .way-close-btn { background: none; border: none; font-size: 1.4rem; color: #888; padding: 0; }
  .way-tab-bar { display: flex; gap: 0.4rem; border-bottom: 1px solid #eee; margin: 0.6rem 0; }
  .way-tab-btn { background: none; border: none; color: #888; padding: 0.4rem 0.6rem; border-bottom: 2px solid transparent; border-radius: 0; }
  .way-tab-btn.active { color: #1F3A6E; border-bottom-color: #1F3A6E; font-weight: 600; }
  .way-tab-panel { display: none; }
  .way-tab-panel.active { display: block; }
  .pill { display: inline-block; padding: 0.05rem 0.4rem; border-radius: 0.7rem; font-size: 0.72rem; }
  .pill-pending { background: #f5ebd6; color: #8a6220; }
  .pill-confirmed { background: #deede4; color: #2e6b4f; }
  .pill-returned { background: #f6e3df; color: #9c3b2e; }
  .breakdown-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.3rem 0; font-size: 0.82rem; }
  .breakdown-label { width: 6rem; }
  .breakdown-bar-track { flex: 1; background: #f0f0f0; border-radius: 0.3rem; height: 0.6rem; }
  .breakdown-bar { height: 100%; border-radius: 0.3rem; }
  .breakdown-count { width: 2rem; text-align: right; }
  .coverage-grid { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.5rem; }
  .coverage-chip { display: inline-flex; align-items: center; justify-content: center; width: 1.7rem; height: 1.7rem; border-radius: 0.3rem; font-size: 0.68rem; color: #fff; text-shadow: 0 0 2px rgba(0,0,0,0.4); }

  /* ---------- Mushaf page view (Phase 5 round 7) — Whole Surah / Range ---------- */
  #pageViewContainer { margin-top: 0.6rem; }
  .hifz-page { background: #fbf6e9; color: #1b1b16; border-radius: 10px; padding: 18px 16px; width: 100%; max-width: 560px; margin: 0 auto 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); container-type: inline-size; }
  .hifz-page-num { font-size: 11px; color: #8a7c55; text-align: center; margin-bottom: 10px; letter-spacing: 0.05em; }
  .hifz-line { display: flex; flex-wrap: nowrap; direction: rtl; gap: 0.12em; padding: 0.15em 0; font-size: 34px; font-size: 6.07cqw; line-height: 2.05; }
  .hifz-line.centered { justify-content: center; }
  .hifz-line:not(.centered) { width: fit-content; max-width: 100%; margin-left: auto; margin-right: 0; }
  .hifz-word { white-space: nowrap; }
  .hifz-word.dim { opacity: 0.32; }
  .hifz-word.playing { color: #1F3A6E; text-shadow: 0 0 1px rgba(31,58,110,0.4); }
  .hifz-surah-header { justify-content: center; background: rgba(201,162,75,0.14); border: 1px solid rgba(201,162,75,0.4); border-radius: 6px; font-size: 16px; font-size: 4.5cqw; font-family: system-ui, sans-serif; color: #7a5f1e; padding: 0.3em 0.6em; }
  .hifz-surah-header.glyph-loaded { background: none; border: none; padding: 0.2em 0; font-size: 20px; font-size: 6cqw; }
  .hifz-basmallah { justify-content: center; font-size: 16px; font-size: 4.5cqw; }
  .hifz-line-error { font-size: 13px; color: #a33; text-align: center; }
  .page-flow-ayah { border-bottom: 1px solid #eee; padding-bottom: 0.6rem; margin-bottom: 0.6rem; }
</style>
</head>
<body>
  <h1>QuranRevival</h1>

  <div id="who">Not signed in.</div>
  <button id="signInBtn">Sign in with Google</button>
  <button id="signOutBtn" class="secondary" style="display:none;">Sign out</button>

  <div id="app" style="display:none;">
    <div id="navBar"></div>
    <div id="globalBanner">
      <h2 id="bannerTitle" style="display:none;"></h2>
      <p id="bannerSub" style="display:none;"></p>
      <button type="button" class="secondary" id="bannerEditBtn" style="display:none;">Edit banner</button>
      <div id="bannerEditForm">
        <label>Title <input type="text" id="bannerTitleInput" /></label>
        <label>Subtitle <input type="text" id="bannerSubInput" /></label>
        <div class="row"><button type="button" id="bannerSaveBtn">Save</button><button type="button" class="secondary" id="bannerCancelBtn">Cancel</button></div>
      </div>
    </div>

    <div class="row">
      <div><label>Tenant</label><select id="tenantSelect"></select></div>
      <div><label>Person</label><select id="personSelect"></select></div>
      <div><label>Surah</label><select id="surahSelect"></select></div>
      <div><label>Approach</label><select id="trackableSelect"></select></div>
      <div><label>Language</label><select id="langSelect">
        <option value="en">English</option>
        <option value="bn">English + বাংলা (Bangla)</option>
      </select></div>
      <div id="wbwLangControl" style="display:none;"><label>Word by Word</label><select id="wbwLangSelect">
        <option value="auto">Follow language above</option>
        <option value="en">English only</option>
        <option value="bn">বাংলা only</option>
        <option value="both">English + বাংলা</option>
      </select></div>
    </div>

    <div class="row">
      <div><label>Study Unit</label><select id="unitTypeSelect">
        <option value="ayah">Single Ayah</option>
        <option value="range">Range of Ayahs</option>
        <option value="surah">Whole Surah</option>
        <option value="ruku">Ruku'</option>
        <option value="juz">Juz</option>
        <option value="page">Page</option>
      </select></div>
      <div id="rangeControls" style="display:none;">
        <label>From ayah</label><select id="rangeFromSelect"></select>
      </div>
      <div id="rangeToControls" style="display:none;">
        <label>To ayah</label><select id="rangeToSelect"></select>
      </div>
      <div><button type="button" class="secondary" id="trackUnitBtn">Track this unit</button></div>
    </div>
    <div id="unitLabel"></div>

    <h2 class="wheel-heading">Mastery Wheel</h2>
    <div id="wheelSection" class="wheel-box">
      <div class="wheel-col">
        <div id="wheelContainer">Loading…</div>
        <div id="wheelLegendContainer"></div>
      </div>
      <div id="wheelSidebarContainer" class="wheel-sidebar"></div>
    </div>

    <h2 class="wheel-heading">Explore <button type="button" class="secondary" id="exploreToggleBtn">Whole Quran ▾</button></h2>
    <div id="explorePanel" class="wheel-box" style="display:none;">
      <div class="wheel-col">
        <div id="exploreWheelContainer">Loading…</div>
        <div id="exploreWheelLegendContainer"></div>
        <p class="hint">Click a Juz to jump there and start tracking it. Colours show this Approach's real ayah-by-ayah progress pooled across the whole Juz — a Juz only turns fully green once every ayah in it is Mastered.</p>
      </div>
      <div id="exploreSidebarContainer" class="wheel-sidebar"></div>
    </div>

    <h2>Study</h2>
    <div id="studyScreen">
      <div class="row" id="pageViewToggleRow" style="display:none;">
        <div><label>Page view</label><select id="pageViewModeSelect">
          <option value="mushaf">Mushaf (real page)</option>
          <option value="tajweed">Tajweed</option>
          <option value="wordByWord">Word by Word</option>
          <option value="translation">Translation</option>
        </select></div>
      </div>
      <div class="row" id="singleAyahNavRow">
        <button class="secondary" id="prevAyahBtn">◂ Previous</button>
        <div id="ayahPosition" style="align-self:center; font-size:0.85rem; color:#666;"></div>
        <button class="secondary" id="nextAyahBtn">Next ▸</button>
        <div><label style="display:inline-block; margin:0 0 0 1rem;"><input type="checkbox" id="tajweedToggle" /> Tajweed colours</label></div>
      </div>
      <div class="row" id="audioControls"></div>
      <div id="drillControls"></div>
      <div id="ayahPanels"></div>
      <div id="pageViewContainer" style="display:none;"></div>
    </div>
  </div>

  <div id="wayModalOverlay"><div id="wayModalMount"></div></div>

  <script type="module">
    import { auth, db } from "./js/firebase-init.js";
    import {
      GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { TENANT } from "./js/collections.js";
    import { langText } from "./js/lang.js";
    import { safeWrite } from "./js/errors.js";
    import { updateDocument } from "./js/envelope.js";
    import { getMyMemberships, initializeActiveContext, getActiveContext, setActiveContext, effectiveRoles, scopedRoster } from "./js/session-context.js";
    import { getTrackables, syncUnneditedTrackableNames } from "./js/catalogue.js";
    import { buildUnitKey, STATUSES, rukuIndexInSurah } from "./js/unit-keys.js";
    import { chunkKeyFor, getRecordsChunk, claimStatus } from "./js/records.js";
    import { weekKeyFor, logActivity } from "./js/activity.js";
    import { getSurah, getSurahIndex, getJuzIndex } from "./js/quran-data.js";
    import { renderLayoutA, renderArabicPanel, renderWordByWordPanel, renderRootDerivativePanel, renderTranslationPanel } from "./js/ayah-renderer.js";
    import { ensureMushafData, getMushafPagesForKeys, renderMushafPages, setActiveAyah } from "./js/hifz-renderer.js";
    import { renderNavBar } from "./js/nav.js";
    import { showQuranSplash } from "./js/splash.js";

    // Fires on every real load of this page -- the multi-page equivalent of
    // the old app's "each time the Quran tab is entered" trigger, since
    // there's no SPA tab-switch here to hook instead.
    showQuranSplash();

    /** The ayah numbers (within the currently-open surah) covered by whichever unit is currently selected -- used both for the drill's playback range and for the unit label. Juz/Page are Quran-wide and can span more than one surah; this only ever returns this SURAH's portion of them (same bounded scope as the Coverage tab below). */
    function currentUnitAyahBounds() {
      const ayahs = currentSurahData.ayahs;

      if (currentUnitType === "range") return [Math.min(rangeFrom, rangeTo), Math.max(rangeFrom, rangeTo)];

      if (currentUnitType === "juz") {
        const inJuz = ayahs.filter((a) => a.juz === current.juz).map((a) => a.ayah);

      if (currentUnitType === "page") {
        const inPage = ayahs.filter((a) => a.page === current.page).map((a) => a.ayah);
        return [Math.min(...inPage), Math.max(...inPage)];
      }
      return [currentAyahNum, currentAyahNum]; // ayah
    }

    /** { unitType, unitKey, chunkKey, label } for whatever's currently selected -- the single source of truth both "Track this unit" and the drill controls build on. chunkKey mirrors records.js's own chunkKeyFor() exactly (surah-chunked for ayah/range/surah/ruku, subject-chunked for juz/page) so it always matches the real document a claim will land in. */
    function currentUnitInfo() {
      const ayah = currentSurahData.ayahs.find((a) => a.ayah === currentAyahNum);
      const surahChunkKey = `surah_${currentSurahNum}`;
      if (currentUnitType === "range") {
        const from = Math.min(rangeFrom, rangeTo), to = Math.max(rangeFrom, rangeTo);
        return { unitType: "range", unitKey: buildUnitKey.range(currentSurahNum, from, to), chunkKey: surahChunkKey, label: `Ayahs ${from}–${to} of Surah ${currentSurahNum}` };
      }
      if (currentUnitType === "surah") {
        return { unitType: "surah", unitKey: buildUnitKey.surah(currentSurahNum), chunkKey: surahChunkKey, label: `Whole Surah ${currentSurahNum}` };
      }
      if (currentUnitType === "ruku") {
        const idx = rukuIndexInSurah(currentSurahData.ayahs, ayah.ruku);
        const [from, to] = currentUnitAyahBounds();
        return { unitType: "ruku", unitKey: buildUnitKey.ruku(currentSurahNum, idx), chunkKey: surahChunkKey, label: `Ruku' ${idx} of Surah ${currentSurahNum} (ayahs ${from}–${to})` };
      }
      if (currentUnitType === "juz") {
        return { unitType: "juz", unitKey: buildUnitKey.juz(ayah.juz), chunkKey: "subject_quran", label: `Juz ${ayah.juz}` };
      }
      if (currentUnitType === "page") {
        return { unitType: "page", unitKey: buildUnitKey.page(PAGE_EDITION, ayah.page), chunkKey: "subject_quran", label: `Page ${ayah.page}` };
      }
      return { unitType: "ayah", unitKey: buildUnitKey.ayah(currentSurahNum, currentAyahNum), chunkKey: surahChunkKey, label: `Surah ${currentSurahNum}, Ayah ${currentAyahNum}` };
    }

    // -----------------------------------------------------------------------
    // Phase 5 -- Explore navigator (whole-Quran Quran-wheel, 30 Juz segments).
    //
    // Round 1 of this feature showed only DIRECT Juz-level claims (Study
    // Unit = Juz). Owner round-2 click-through: "Finished a few approaches
    // in one Surah and checked the explore in that particular Surah,
    // doesn't reflect" -- correct, and a real scoping mistake on Claude's
    // part, not a misunderstanding on the owner's: the legacy app's Explore
    // pooled from ordinary ayah-level progress, and that's what people
    // actually expect to see. Rebuilt to pool real ayah-level claims per
    // Juz (a Juz only shows as fully mastered once EVERY ayah claimed
    // within it is -- "weakest link", poolJuzStatus below), falling back to
    // a direct Juz-level claim only for a Juz with no ayah-level data at
    // all yet. Juz boundaries -- and which ayahs of a boundary surah belong
    // to which Juz -- come from juz-index.json + the already-loaded
    // surah-index.json ayah counts (juzAyahCoverage below), not from
    // loading full surah text.
    //
    // Cost, disclosed: since every surah belongs to some Juz, opening
    // Explore reads essentially every surah's records chunk at least once
    // (parallelised; the currently-open surah's chunk is reused from
    // memory at zero extra cost). That's a real, sizeable one-time read,
    // but Explore is an explicitly-opened, on-first-use screen, not the
    // startup path -- Architecture s8's load-speed table exempts this
    // class of screen the same way it exempts About/resources/screensaver.
    // -----------------------------------------------------------------------

    exploreToggleBtn.addEventListener("click", async () => {
      const opening = explorePanel.style.display === "none";
      explorePanel.style.display = opening ? "block" : "none";

    /** Which (surah, ayah-range) pairs make up Juz j, using only juz-index.json's own boundaries + surah-index.json's ayah counts -- never loads full surah text just to find this out. */
    function juzAyahCoverage(j) {
      if (j.startSurah === j.endSurah) return [{ surah: j.startSurah, from: j.startAyah, to: j.endAyah }];
      const ranges = [];
      const startCount = surahIndex.find((s) => s.surahNumber === j.startSurah)?.ayahCount ?? j.startAyah;
      ranges.push({ surah: j.startSurah, from: j.startAyah, to: startCount });
      for (let s = j.startSurah + 1; s < j.endSurah; s++) {
        const count = surahIndex.find((x) => x.surahNumber === s)?.ayahCount ?? 0;
        if (count) ranges.push({ surah: s, from: 1, to: count });
      }
      ranges.push({ surah: j.endSurah, from: 1, to: j.endAyah });
      return ranges;
    }

    const RAMP_ORDER = STATUSES.filter((s) => s.onRamp).map((s) => s.id); // not_started .. mastered, in ramp order

    /** "Weakest link" pooled status across every ayah a Juz covers, for one trackable. Ayahs never claimed count as not_started (matches ayahStatusesForCurrentTrackable's own default). Not Applicable ayahs are excluded from the pool entirely (I7), not counted as a low score. Returns null if nothing at all is countable yet (every ayah Not Applicable, or the chunk simply doesn't exist) -- the caller falls back to a direct Juz-level claim in that case. */
    function poolJuzStatus(coverage, chunksBySurah, trackableId) {
      let worstIdx = null;
      let anyCounted = false;
      for (const { surah, from, to } of coverage) {
        const entries = chunksBySurah.get(surah)?.entries ?? {};
        for (let a = from; a <= to; a++) {
          const statusId = entries[`${buildUnitKey.ayah(surah, a)}::${trackableId}`]?.claimedStatus ?? "not_started";
          if (statusId === "not_applicable") continue;
          anyCounted = true;
          const idx = RAMP_ORDER.indexOf(statusId);
          if (worstIdx === null || idx < worstIdx) worstIdx = idx;
        }
      }
      return anyCounted ? RAMP_ORDER[worstIdx] : null;
    }

    async function renderExploreWheel() {
      const trackable = currentTrackable();
      if (!trackable) {
        exploreWheelContainer.innerHTML = `<p style="color:#8fa0c2;">Pick an Approach first.</p>`;
        exploreWheelLegendContainer.innerHTML = "";
        exploreSidebarContainer.innerHTML = "";
        return;
      }
      exploreWheelContainer.innerHTML = "Loading whole-Quran progress — this reads every surah's saved progress once, so it can take a few seconds…";
      if (!juzIndexData) juzIndexData = await getJuzIndex();

      const coverageByJuz = juzIndexData.map((j) => ({ j, coverage: juzAyahCoverage(j) }));
      const neededSurahs = new Set();
      for (const { coverage } of coverageByJuz) for (const c of coverage) neededSurahs.add(c.surah);

      const chunksBySurah = new Map();
      await Promise.all(
        [...neededSurahs].map(async (surahNum) => {
          if (surahNum === currentSurahNum && currentChunk) { chunksBySurah.set(surahNum, currentChunk); return; }
          const chunk = await getRecordsChunk(db, activeTenantId, selectedPersonId, `surah_${surahNum}`);
          if (chunk) chunksBySurah.set(surahNum, chunk);
        })
      );

      // Direct Juz-level claims (Study Unit = Juz) -- fallback only, for a
      // Juz with no ayah-level progress pooled above yet.
      const juzChunk = await getRecordsChunk(db, activeTenantId, selectedPersonId, "subject_quran");

      const items = coverageByJuz.map(({ j, coverage }) => {
        const pooled = poolJuzStatus(coverage, chunksBySurah, trackable.id);
        const statusId = pooled ?? (juzChunk?.entries?.[`${buildUnitKey.juz(j.juz)}::${trackable.id}`]?.claimedStatus ?? "not_started");
        return { key: j.juz, number: j.juz, statusId, title: `Juz ${j.juz} — ${statusId.replace(/_/g, " ")}` };
      });

      const jumpToJuz = async (key) => {
        const j = juzIndexData.find((x) => x.juz === Number(key));
        if (!j) return;
        explorePanel.style.display = "none";
        currentUnitType = "juz";
        unitTypeSelect.value = "juz";
        updateUnitControlsVisibility();
        if (j.startSurah !== currentSurahNum) {
          currentSurahNum = j.startSurah;
          surahSelect.value = String(j.startSurah);
          await loadSurah();
        }
        currentAyahNum = j.startAyah;
        renderStudyScreen();
        updateUnitControlsVisibility();
      };

      const approachName = langText(trackable.name, currentLang, trackable.id);
      exploreWheelContainer.innerHTML = renderScopedWheel(items, { centerLabel: "Whole Quran", centerSub: approachName });
      attachScopedWheelClickHandler(exploreWheelContainer, jumpToJuz);

      const labelsById = Object.fromEntries(STATUSES.map((s) => [s.id, s.label]));
      exploreWheelLegendContainer.innerHTML = renderWheelLegend(labelsById);
      const sidebarItems = items.map((it) => ({ ...it, label: `Juz ${it.key}` }));
      exploreSidebarContainer.innerHTML = renderWheelSidebar(sidebarItems, labelsById);
      attachWheelSidebarClickHandler(exploreSidebarContainer, jumpToJuz);
    }

    /** Ayah translation panel: additive when Bangla is chosen (English stays visible alongside it), per the F-060 design note in ayah-renderer.js. */
    function translationLangs() {
      return currentLang === "bn" ? ["en", "bn"] : ["en"];
    }

    /** Word-by-word panel: "auto" follows the language above; otherwise the owner's explicit choice wins (owner request, 5 Aug 2026 -- an explicit fallback alongside the automatic behaviour, not instead of it). */
    function wbwLangs() {
      if (wbwLangMode === "en") return ["en"];
      if (wbwLangMode === "bn") return ["bn"];
      if (wbwLangMode === "both") return ["en", "bn"];
      return translationLangs();
    }

    /** Whole surah -> every ayah; range -> just the selected ayahs. Same bounds logic as currentUnitAyahBounds() for those two unit types, kept separate since that function also has to handle ruku/juz/page. */
    function pageViewAyahBounds() {
      if (currentUnitType === "range") return [Math.min(rangeFrom, rangeTo), Math.max(rangeFrom, rangeTo)];
      return [1, currentSurahData.ayahCount];
    }

    /**
     * Phase 5 round 7 -- Whole Surah / Range page view (PHASE-5-STATUS.md
     * round 6 spec). "mushaf" renders the true page-for-page glyph replica
     * via hifz-renderer.js, with the selected ayahs highlighted and anything
     * else sharing the same real page (a neighbouring surah's tail/head on a
     * boundary page) de-emphasized. The other three modes are NOT a panel
     * layered on the Mushaf page (owner, 8 Aug 2026) -- switching the toggle
     * replaces the whole view, reusing the existing single-ayah panels from
     * ayah-renderer.js looped over every ayah in scope.
     */
    async function renderPageView() {
      const [from, to] = pageViewAyahBounds();
      const ayahKeys = [];
      for (let a = from; a <= to; a++) ayahKeys.push(`${currentSurahNum}:${a}`);

      if (pageDisplayMode === "mushaf") {
        pageViewContainer.innerHTML = `<p style="color:#888;">Loading Mushaf page…</p>`;
        try {
          await ensureMushafData();
          const pages = getMushafPagesForKeys(ayahKeys);
          await renderMushafPages(
            pageViewContainer,
            pages,
            new Set(ayahKeys),
            (surahNum) => surahIndex.find((s) => s.surahNumber === surahNum)?.nameArabic ?? null
          );
        } catch (err) {
          pageViewContainer.innerHTML = `<p style="color:#a33;">Couldn't load Mushaf page data (${err.message}).</p>`;
        }
        return;
      }

      const ayahs = currentSurahData.ayahs.filter((a) => a.ayah >= from && a.ayah <= to);
      pageViewContainer.innerHTML = ayahs
        .map((ayah) => {
          let body;
          if (pageDisplayMode === "tajweed") body = renderArabicPanel(ayah, { tajweedOn: true });
          else if (pageDisplayMode === "wordByWord") body = renderWordByWordPanel(ayah, { langs: wbwLangs() }) + renderRootDerivativePanel(ayah);
          else body = renderArabicPanel(ayah, { tajweedOn: false }) + renderTranslationPanel(ayah, translationLangs());
          return `<div class="page-flow-ayah">${body}</div>`;
        })
        .join("");
    }

    function renderStudyScreen() {
      if (!currentSurahData) return;
      const isPageUnit = currentUnitType === "surah" || currentUnitType === "range";
      pageViewToggleRow.style.display = isPageUnit ? "" : "none";
      singleAyahNavRow.style.display = isPageUnit ? "none" : "";
      ayahPanels.style.display = isPageUnit ? "none" : "";
      pageViewContainer.style.display = isPageUnit ? "" : "none";

      const trackable = currentTrackable();
      const panels = trackable?.panels ?? ["text"];
      wbwLangControl.style.display = panels.includes("wordByWord") && (!isPageUnit || pageDisplayMode === "wordByWord") ? "" : "none";

      if (isPageUnit) {
        renderPageView();
      } else {
        const ayah = currentSurahData.ayahs.find((a) => a.ayah === currentAyahNum);
        if (!ayah) return;
        ayahPosition.textContent = `Surah ${currentSurahNum} — Ayah ${currentAyahNum} of ${currentSurahData.ayahCount}`;
        prevAyahBtn.disabled = currentAyahNum <= 1;
        nextAyahBtn.disabled = currentAyahNum >= currentSurahData.ayahCount;
        ayahPanels.innerHTML = renderLayoutA(ayah, panels, {
          tajweedOn: tajweedToggle.checked,
          langs: translationLangs(),
          wbwLangs: wbwLangs(),
        });
      }

      renderAudioControls(panels);
      renderUnitLabel();
    }

    function renderAudioControls(panels) {
      if (!panels.includes("audio")) { audioControls.innerHTML = ""; drillControlsEl.innerHTML = ""; return; }
      const options = Object.values(RECITERS)
        .map((r) => {
          const label = reciterIsReady(r.id) && !reciterSupportsSingleAyah(r.id) ? `${r.label} (whole surah only)` : r.label;
          return `<option value="${r.id}" ${!reciterIsReady(r.id) ? "disabled" : ""}>${label}${reciterIsReady(r.id) ? "" : " (not uploaded yet)"}</option>`;
        })
        .join("");
      audioControls.innerHTML = `
        <select id="reciterSelect">${options}</select>
        <button type="button" class="secondary" id="playBtn">▶ Play ayah</button>
        <button type="button" class="secondary" id="playSurahBtn">▶ Play whole surah</button>
        ${panels.includes("loop") ? `<label style="display:inline-flex; align-items:center; gap:0.3rem; font-weight:400;"><input type="checkbox" id="loopToggle" /> Loop</label>` : ""}
      `;
      const reciterSelect = document.getElementById("reciterSelect");
      const playBtn = document.getElementById("playBtn");
      const playSurahBtn = document.getElementById("playSurahBtn");
      const loopToggle = document.getElementById("loopToggle");

      // This whole block is rebuilt on every ayah nav/toggle (renderStudyScreen
      // runs every time), so without re-applying the persisted choice here the
      // reciter would silently revert to the first <option> and Loop would
      // silently uncheck itself, even though playback kept working underneath.
      reciterSelect.value = currentReciterId;
      if (loopToggle) { loopToggle.checked = loopIsOn; setLoop(loopIsOn); }

      reciterSelect.addEventListener("change", () => {
        currentReciterId = reciterSelect.value;
        // Owner request, 8 Aug 2026: picking the Bangla reciter should bring
        // the Bangla translation on screen automatically, not leave the
        // reader looking at English while Bangla audio plays. One-way and
        // additive (matches F-060: Bangla always sits alongside English,
        // never replaces it) -- switching to a different reciter afterwards
        // does not take Bangla back off, since the owner only asked for the
        // "audio implies text" direction, not the reverse.
        if (currentReciterId === "bn" && currentLang !== "bn") {
          currentLang = "bn";
          langSelect.value = "bn";
          renderPersonSelectOptions();
          renderTrackableSelectOptions();
          renderBanner();
          renderStudyScreen();
        }
      });
      if (loopToggle) loopToggle.addEventListener("change", () => { loopIsOn = loopToggle.checked; setLoop(loopIsOn); });
      playBtn.addEventListener("click", async () => {
        // Always stop whatever's currently loaded first -- switching reciters
        // (or a running drill) and pressing Play again must never leave
        // something else's audio still running underneath.
        stopDrill();
        const reciterId = reciterSelect.value;
        const reciter = RECITERS[reciterId];
        try {
          if (!reciterSupportsSingleAyah(reciterId)) throw new Error(`${reciter.label} only has whole-surah audio — use "Play whole surah" instead.`);
          if (reciter.kind === "segmented") await playSegmentedAyah(currentSurahNum, currentAyahNum, reciterId);
          else await playAyah(currentSurahNum, currentAyahNum, reciterId);
        } catch (err) {
          alert(err.message);
        }
      });
      playSurahBtn.addEventListener("click", async () => {
        stopDrill();
        const reciterId = reciterSelect.value;
        try {
          await playSurah(currentSurahNum, reciterId, currentSurahData.ayahCount);
        } catch (err) {
          alert(err.message);
        }
      });

      renderDrillControls();
    }

    /**
     * Phase 5 -- multi-reciter drill/repeat playback (legacy parity gap):
     * pick several reciters, a repeat count (1/2/3/5/10x) and a repeat mode
     * ("Each Ayah" drills one ayah across every chosen reciter N times
     * before advancing; "Whole Unit" plays the whole current Study Unit once
     * per reciter, and that whole pass repeats N times). Uses
     * currentUnitAyahBounds() so the drill range always matches whatever
     * Study Unit is currently selected above.
     */
    function renderDrillControls() {
      const drillReciters = Object.values(RECITERS).filter((r) => reciterIsReady(r.id) && reciterSupportsSingleAyah(r.id));
      if (drillSelectedReciterIds === null) drillSelectedReciterIds = [currentReciterId].filter((id) => reciterSupportsSingleAyah(id));

      drillControlsEl.innerHTML = `
        <div class="row">
          <div><label>Drill reciters</label><div id="drillReciterChecks">
            ${drillReciters.map((r) => `<label><input type="checkbox" class="drill-reciter-check" value="${r.id}" ${drillSelectedReciterIds.includes(r.id) ? "checked" : ""}/> ${r.label}</label>`).join("")}
          </div></div>
          <div><label>Repeat</label><select id="drillRepeatSelect">${[1, 2, 3, 5, 10].map((n) => `<option value="${n}">${n}×</option>`).join("")}</select></div>
          <div><label>Mode</label><select id="drillModeSelect"><option value="each">Each Ayah</option><option value="whole">Whole Unit</option></select></div>
          <div><button type="button" class="secondary" id="drillPlayBtn">▶ Play Drill</button></div>
          <div><button type="button" class="secondary" id="drillStopBtn">■ Stop Drill</button></div>
        </div>
      `;
      const drillReciterChecks = document.getElementById("drillReciterChecks");
      const drillRepeatSelect = document.getElementById("drillRepeatSelect");
      const drillModeSelect = document.getElementById("drillModeSelect");
      const drillPlayBtn = document.getElementById("drillPlayBtn");
      const drillStopBtn = document.getElementById("drillStopBtn");

      drillRepeatSelect.value = String(drillRepeatCount);
      drillModeSelect.value = drillMode;

      drillReciterChecks.addEventListener("change", (e) => {
        if (!e.target.classList.contains("drill-reciter-check")) return;
        drillSelectedReciterIds = [...drillReciterChecks.querySelectorAll(".drill-reciter-check:checked")].map((c) => c.value);
      });
      drillRepeatSelect.addEventListener("change", () => { drillRepeatCount = Number(drillRepeatSelect.value); });
      drillModeSelect.addEventListener("change", () => { drillMode = drillModeSelect.value; });

      drillPlayBtn.addEventListener("click", async () => {
        if (!drillSelectedReciterIds?.length) { alert("Pick at least one reciter to drill."); return; }
        const [fromAyah, toAyah] = currentUnitAyahBounds();
        drillPlayBtn.disabled = true;
        try {
          await playDrill({ surahNum: currentSurahNum, fromAyah, toAyah, reciterIds: drillSelectedReciterIds, repeatCount: drillRepeatCount, mode: drillMode });
        } catch (err) {
          if (err.name !== "AbortError") alert(err.message);
        } finally {
          drillPlayBtn.disabled = false;
        }
      });
      drillStopBtn.addEventListener("click", () => stopDrill());
    }

    prevAyahBtn.addEventListener("click", () => { if (currentAyahNum > 1) { stopDrill(); currentAyahNum--; renderStudyScreen(); } });
    nextAyahBtn.addEventListener("click", () => { if (currentAyahNum < currentSurahData.ayahCount) { stopDrill(); currentAyahNum++; renderStudyScreen(); } });
    tajweedToggle.addEventListener("change", renderStudyScreen);
    langSelect.addEventListener("change", () => {
      currentLang = langSelect.value;
      renderPersonSelectOptions();
      renderTrackableSelectOptions();
      renderBanner();
      renderStudyScreen();
    });
    wbwLangSelect.addEventListener("change", () => {
      wbwLangMode = wbwLangSelect.value;
      renderStudyScreen();
    });

    surahSelect.addEventListener("change", async () => { currentSurahNum = Number(surahSelect.value); await loadSurah(); });
    trackableSelect.addEventListener("change", async () => { currentTrackableId = trackableSelect.value; renderWheel(); renderStudyScreen(); });
    personSelect.addEventListener("change", async () => { selectedPersonId = personSelect.value; await refreshChunkAndWheel(); });

    // ---------------------------------------------------------------------
    // Way modal -- ayah-level (unchanged from Phase 4: wheel-click always
    // opens this, always at ayah granularity, regardless of Study Unit).
    // ---------------------------------------------------------------------

    function openWayModal() {
      const trackable = currentTrackable();
      if (!trackable) return;
      const unitKey = buildUnitKey.ayah(currentSurahNum, currentAyahNum);
      const entryKey = `${unitKey}::${trackable.id}`;
      const entry = currentChunk?.entries?.[entryKey] ?? null;

      const statusIdsForTrackable = Object.values(currentChunk?.entries ?? {})
        .filter((e) => e.trackableId === trackable.id)
        .map((e) => e.claimedStatus);
      const ayahStatuses = ayahStatusesForCurrentTrackable();

      const title = `${langText(trackable.name, currentLang, trackable.id)} — Surah ${currentSurahNum}, Ayah ${currentAyahNum}`;
      const tabBodies = {
        Track: renderTrackTab(entry, entry?.claimedStatus ?? "not_started"),
        Guide: renderGuideTab(trackable, currentLang),
        Breakdown: renderBreakdownTab(statusIdsForTrackable),
        Coverage: renderCoverageTab(ayahStatuses),
      };
      wayModalMount.innerHTML = renderWayModalShell(title, tabBodies);
      wayModalOverlay.classList.add("open");

      attachWayModalHandlers(wayModalMount.firstElementChild, {
        onClose: () => wayModalOverlay.classList.remove("open"),
      });

      const claimBtn = wayModalMount.querySelector(".way-claim-btn");
      const statusSelectEl = wayModalMount.querySelector(".way-status-select");
      const resultEl = wayModalMount.querySelector(".way-claim-result");
      claimBtn.addEventListener("click", async () => {
        claimBtn.disabled = true;
        const outcome = await safeWrite(
          () => claimStatus(db, {
            tenantId: activeTenantId,
            personId: selectedPersonId,
            subjectId: "quran",
            unitKey,
            trackableId: trackable.id,
            statusId: statusSelectEl.value,
            notes: "",
            domainIds: [],
            claimedByPersonId: currentActingPersonId(),
            claimedByUid: auth.currentUser.uid,
          }),
          { collection: "records", action: "claimStatus" }
        );
        if (outcome.ok) {
          await logActivity(db, {
            tenantId: activeTenantId, personId: selectedPersonId, date: new Date(),
            weekStartsOn: tenantWeekStartsOn, subjectId: "quran", unitKey,
            trackableId: trackable.id, action: "claimed", uid: auth.currentUser.uid,
          });
          const message = outcome.result.needsConfirmation ? "Claimed — waiting for confirmation." : "Claimed and confirmed.";
          await refreshChunkAndWheel();
          openWayModal(); // refresh the modal's own tabs against the new chunk -- this replaces resultEl, so the message has to be applied to the NEW element below, not the one captured above
          const freshResultEl = wayModalMount.querySelector(".way-claim-result");
          if (freshResultEl) freshResultEl.textContent = message;
        } else {
          resultEl.textContent = outcome.entry.message;
          claimBtn.disabled = false;
        }
      });
    }

    // ---------------------------------------------------------------------
    // Phase 5 -- Way modal for the currently-selected Study Unit (Range/
    // Whole Surah/Ruku'/Juz/Page). Separate from openWayModal() above on
    // purpose: the wheel-click path stays byte-for-byte what Phase 4 shipped
    // and the owner already verified, zero regression risk. This is the new,
    // additive path "Track this unit" uses.
    // ---------------------------------------------------------------------

    async function openUnitWayModal() {
      const trackable = currentTrackable();
      if (!trackable) return;
      const info = currentUnitInfo();
      const entryKey = `${info.unitKey}::${trackable.id}`;
      const surahChunkKey = `surah_${currentSurahNum}`;
      const chunk = info.chunkKey === surahChunkKey ? currentChunk : await getRecordsChunk(db, activeTenantId, selectedPersonId, info.chunkKey);
      const entry = chunk?.entries?.[entryKey] ?? null;

      const statusIdsForTrackable = Object.values(chunk?.entries ?? {})
        .filter((e) => e.trackableId === trackable.id)
        .map((e) => e.claimedStatus);

      const title = `${langText(trackable.name, currentLang, trackable.id)} — ${info.label}`;
      const tabBodies = {
        Track: renderTrackTab(entry, entry?.claimedStatus ?? "not_started"),
        Guide: renderGuideTab(trackable, currentLang),
        Breakdown: renderBreakdownTab(statusIdsForTrackable),
        Coverage: info.chunkKey === surahChunkKey
          ? renderCoverageTab(ayahStatusesForCurrentTrackable())
          : `<div class="way-coverage"><p>Ayah-by-ayah coverage isn't available at this granularity — switch Study Unit to Ayah, Range, Whole Surah or Ruku' to see it.</p></div>`,
      };
      wayModalMount.innerHTML = renderWayModalShell(title, tabBodies);
      wayModalOverlay.classList.add("open");
      attachWayModalHandlers(wayModalMount.firstElementChild, { onClose: () => wayModalOverlay.classList.remove("open") });

      const claimBtn = wayModalMount.querySelector(".way-claim-btn");
      const statusSelectEl = wayModalMount.querySelector(".way-status-select");
      const resultEl = wayModalMount.querySelector(".way-claim-result");
      claimBtn.addEventListener("click", async () => {
        claimBtn.disabled = true;
        const outcome = await safeWrite(
          () => claimStatus(db, {
            tenantId: activeTenantId, personId: selectedPersonId, subjectId: "quran",
            unitKey: info.unitKey, trackableId: trackable.id, statusId: statusSelectEl.value,
            notes: "", domainIds: [], claimedByPersonId: currentActingPersonId(), claimedByUid: auth.currentUser.uid,
          }),
          { collection: "records", action: "claimStatus" }
        );
        if (outcome.ok) {
          await logActivity(db, {
            tenantId: activeTenantId, personId: selectedPersonId, date: new Date(), weekStartsOn: tenantWeekStartsOn,
            subjectId: "quran", unitKey: info.unitKey, trackableId: trackable.id, action: "claimed", uid: auth.currentUser.uid,
          });
          const message = outcome.result.needsConfirmation ? "Claimed — waiting for confirmation." : "Claimed and confirmed.";
          if (info.chunkKey === surahChunkKey) await refreshChunkAndWheel();
          await openUnitWayModal();
          const freshResultEl = wayModalMount.querySelector(".way-claim-result");
          if (freshResultEl) freshResultEl.textContent = message;
        } else {
          resultEl.textContent = outcome.entry.message;
          claimBtn.disabled = false;
        }
      });
    }

    trackUnitBtn.addEventListener("click", () => openUnitWayModal());

    // ---------------------------------------------------------------------
    // Sign-in / context bootstrap (same pattern as records.html)
    // ---------------------------------------------------------------------

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        whoEl.textContent = "Not signed in.";
        signInBtn.style.display = "inline-block";
        signOutBtn.style.display = "none";
        appEl.style.display = "none";
        return;
      }
      whoEl.textContent = `Signed in as ${user.email}`;
      signInBtn.style.display = "none";
      signOutBtn.style.display = "inline-block";

      async function step(name, fn) {
        try { return await fn(); } catch (err) { err.stepName = err.stepName ?? name; throw err; }
      }

      try {
        const userIndexSnap = await step("read your userIndex", () => getDoc(doc(db, TENANT.USER_INDEX, user.uid)));
        const defaultTenantId = userIndexSnap.exists() ? userIndexSnap.data().defaultTenantId : null;

        const context = await step("initialize active context", () => initializeActiveContext(db, user.uid, defaultTenantId));
        if (!context) {
          whoEl.innerHTML += NO_ACCOUNT_MESSAGE;
          return;
        }
        activeTenantId = context.tenantId;

        myMemberships = await step("load your memberships", () => getMyMemberships(db, user.uid));
        tenantSelect.innerHTML = myMemberships
          .map((m) => `<option value="${m.tenantId}" ${m.tenantId === activeTenantId ? "selected" : ""}>${m.tenantName} (${m.roles.join(", ")})</option>`)
          .join("");
        navBar.innerHTML = renderNavBar(myMemberships.find((m) => m.tenantId === activeTenantId)?.roles ?? [], getActiveContext()?.viewAsRole ?? null);

        appEl.style.display = "block";
        await step("load context data", loadContextData);
      } catch (err) {
        whoEl.textContent += ` — failed at "${err.stepName ?? "unknown step"}": ${err.code ?? ""} ${err.message}`;
        console.error(err);
      }
    });

    tenantSelect.addEventListener("change", async () => {
      const chosen = myMemberships.find((m) => m.tenantId === tenantSelect.value);
      if (!chosen) return;
      activeTenantId = chosen.tenantId;
      setActiveContext({ tenantId: chosen.tenantId, personId: chosen.personId, roles: chosen.roles, viewAsRole: null });
      navBar.innerHTML = renderNavBar(chosen.roles, null); // switching tenants resets any active preview
      await loadContextData();
    });
  </script>
</body>
</html>
