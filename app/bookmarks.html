<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="./css/shell.css" />
<title>QuranRevival — Bookmarks</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem 4rem; color: #222; }
  h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
  h2 { font-size: 1.05rem; margin-top: 1.6rem; }
  p.intro { color: #555; font-size: 0.94rem; }
  #who { margin: 1rem 0; font-size: 0.95rem; color: #555; }
  button {
    font-size: 0.88rem; padding: 0.32rem 0.7rem; border-radius: 0.4rem; border: 1px solid #ccc;
    background: #1F3A6E; color: white; cursor: pointer;
  }
  button.secondary { background: white; color: #1F3A6E; }
  button.tiny { padding: 0.12rem 0.4rem; font-size: 0.8rem; }
  button:disabled { opacity: 0.5; cursor: default; }
  select { font-size: 0.85rem; padding: 0.25rem; border: 1px solid #ccc; border-radius: 0.35rem; }
  .note { font-size: 0.88rem; color: #666; }
  .warn { background: #fff8e6; border: 1px solid #f0d9a0; border-radius: 0.5rem; padding: 0.6rem 0.8rem; font-size: 0.88rem; }
  .bm-folder { border: 1px solid #e0e0e0; border-radius: 0.5rem; padding: 0.6rem 0.7rem; margin: 0.6rem 0; }
  .bm-folder.retired { opacity: 0.55; }
  .bm-folder-header { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; font-weight: 600; }
  .bm-folder-name { flex: 1 1 auto; min-width: 6rem; }
  .bm-folder-children { margin-left: 1.4rem; }
  .bm-group-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: #888; margin: 0.8rem 0 0.2rem; }
  .bm-row {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    padding: 0.4rem 0.3rem; border-bottom: 1px solid #f0f0f0; font-size: 0.88rem;
  }
  .bm-row.retired { opacity: 0.55; }
  .bm-row-name { flex: 1 1 auto; min-width: 8rem; font-weight: 600; }
  .bm-row-module { color: #888; font-size: 0.78rem; }
  #newFolderRow { margin: 0.8rem 0; }
  #emptyMsg { color: #888; font-size: 0.9rem; margin-top: 1rem; }
</style>
</head>
<body>
  <h1>Bookmarks</h1>
  <p class="intro">Every bookmark you have saved, from any module, in one place. Open one to jump straight back to where it was made. Group them into folders however you like.</p>

  <nav class="app-nav" id="topNav">
    <details class="nav-cat nav-cat-home">
      <summary>Home</summary>
      <div class="nav-cat-links">
        <a href="https://madrasatul-muslimeen.github.io/legacy/index.html" class="nav-legacy-link" target="_blank" rel="noopener">Legacy App - v06 ↗</a>
        <div id="who">Checking sign-in…</div>
        <button id="signInBtn" style="display:none;">Sign in with Google</button>
        <button id="signOutBtn" class="secondary" style="display:none;">Sign out</button>
        <div id="navHomeExtra"></div>
      </div>
    </details>
    <div id="navBar"></div>
  </nav>

  <div id="app" style="display:none;">
    <div id="contextBar" style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap; margin:1rem 0; font-size:0.9rem;">
      <label style="margin:0;">Tenant
        <select id="tenantSelect" style="width:auto;"></select>
      </label>
      <label style="margin:0;">Person
        <select id="personSelect" style="width:auto;"></select>
      </label>
    </div>

    <div id="newFolderRow">
      <button type="button" id="newFolderBtn">+ New folder</button>
      <label style="margin-left:0.8rem; font-size:0.85rem; color:#555;">Group by
        <select id="groupBySelect" style="width:auto;"></select>
      </label>
      <label style="margin-left:0.8rem; font-size:0.85rem; color:#555;"><input type="checkbox" id="showRetiredCk"> Show retired</label>
    </div>

    <div id="foldersContainer"></div>

    <div id="unfiledContainer"></div>

    <div id="taggedForContainer"></div>

    <p id="emptyMsg" style="display:none;">No bookmarks saved yet. Look for the ☆/🔖 button on a study screen.</p>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-init.js";
    import {
      GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { TENANT } from "./js/collections.js";
    import { langText } from "./js/lang.js";
    import { roleListLabel } from "./js/labels.js";
    import { getAppLang, getBookmarkMenuGroupBy, setBookmarkMenuGroupBy, BOOKMARK_GROUP_BYS } from "./js/prefs.js";
    import { adoptAppLangFromUserIndex, mountSyncedAppLangControl } from "./js/lang-sync.js";
    import { safeWrite } from "./js/errors.js";
    import { bootstrapContext, getActiveContext, setActiveContext, effectiveRoles, scopedRoster, getSelectedPersonId, setSelectedPersonId } from "./js/session-context.js";
    import { renderNavBar, renderHomeExtras, noAccountMessageHtml } from "./js/nav.js";
import { mountBookmarkMenu } from "./js/bookmark-nav.js";
    import { translateStatic, t } from "./js/i18n.js";
    import { MODULE_PAGES, MODULE_LABELS } from "./js/continue-strip.js";
    import {
      getBookmarks, renameSavedBookmark, setSavedBookmarkRemoved, moveBookmarkToFolder,
      createFolder, renameFolder, setFolderRemoved, moveFolder, isFolderOrDescendant,
      setBookmarkPersonTag, setFolderPersonTag, groupBookmarksByPerson, groupBookmarksByModule,
      folderById as sharedFolderById, liveFolderIdFor as sharedLiveFolderIdFor,
      rootFolders, childFolders, bookmarksInFolder, unfiledBookmarks,
    } from "./js/bookmarks.js";

    translateStatic();

    const whoEl = document.getElementById("who");
    const signInBtn = document.getElementById("signInBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const appEl = document.getElementById("app");
    const navBar = document.getElementById("navBar");
    const navHomeExtra = document.getElementById("navHomeExtra");
    function renderNav(roles, viewAsRole) {
      navBar.innerHTML = renderNavBar(roles, viewAsRole);
      navHomeExtra.innerHTML = renderHomeExtras(roles);
      mountSyncedAppLangControl(navHomeExtra, { db, uid: auth.currentUser?.uid });
      mountBookmarkMenu(navBar, { db, getTenantId: () => activeTenantId, getPersonId: () => selectedPersonId, getBookmarksDoc: () => bookmarksDoc, getRoster: () => roster });
    }
    const tenantSelect = document.getElementById("tenantSelect");
    const personSelect = document.getElementById("personSelect");
    const newFolderBtn = document.getElementById("newFolderBtn");
    const showRetiredCk = document.getElementById("showRetiredCk");
    const groupBySelect = document.getElementById("groupBySelect");
    const foldersContainer = document.getElementById("foldersContainer");
    const unfiledContainer = document.getElementById("unfiledContainer");
    const taggedForContainer = document.getElementById("taggedForContainer");
    const emptyMsg = document.getElementById("emptyMsg");

    // Bookmark-issues round: retired bookmarks/folders (D6/I4 soft-remove)
    // used to always render, dimmed, mixed in with everything live -- the
    // owner's own complaint was that retiring "just takes unnecessary
    // focus." Nothing about retire/restore itself changed (still I4-shaped,
    // still fully reversible) -- only the DEFAULT VIEW hides them, exactly
    // the same "Show archived" pattern people.html already uses for its own
    // roster. Toggling this on still lets you find and Restore one.
    let showRetired = false;
    showRetiredCk.addEventListener("change", () => {
      showRetired = showRetiredCk.checked;
      renderAll();
    });

    // Bookmark-issues round: the same Folder/Person/Module choice the nav
    // dropdown offers (js/bookmark-nav.js), now on the Manager screen too --
    // same stored preference (prefs.js), so picking one here is what the
    // dropdown shows next time too, and vice versa. Folder mode is the only
    // one that renders the folder tree/move-to-folder controls; Person and
    // Module both flatten to "everything tagged/filed under X," which is
    // also how a guardian finds "everything I've bookmarked for this child"
    // without switching who's selected above.
    groupBySelect.innerHTML = BOOKMARK_GROUP_BYS.map((g) => `<option value="${g.id}">${t(g.label)}</option>`).join("");
    groupBySelect.value = getBookmarkMenuGroupBy();
    groupBySelect.addEventListener("change", () => {
      setBookmarkMenuGroupBy(groupBySelect.value);
      renderAll();
    });

    signInBtn.addEventListener("click", () => {
      signInWithPopup(auth, new GoogleAuthProvider()).catch((err) => {
        whoEl.textContent = t("Sign-in failed: {message}", { message: err.message });
      });
    });
    signOutBtn.addEventListener("click", () => signOut(auth));

    let activeTenantId = null;
    let myMemberships = [];
    let roster = [];
    let selectedPersonId = null;
    let bookmarksDoc = { resume: {}, saved: [], folders: [] };
    // Bookmark-issues round -- the "view by student" case D10 already
    // named as the common workflow: a guardian bookmarks something for a
    // child WHILE SIGNED IN AS THEMSELVES, tagging it for the child
    // (personTagId), so it lives in the GUARDIAN's own bookmarks doc, not
    // the child's. Selecting the child above only ever showed the child's
    // OWN saved[] -- never what a guardian tagged for them. Rather than
    // reading every roster member's doc on a tap (a real, previously
    // flagged load-speed cost, see bookmarks.js's own header), this reads
    // exactly ONE extra document -- the signed-in login's own -- and shows
    // only the entries tagged for whoever is currently selected. Cleared
    // whenever the selected person IS the signed-in login (nothing extra
    // to show) or has no tag from that doc.
    let taggedForSelected = [];

    function currentPreview() {
      const context = getActiveContext();
      const activeMembership = myMemberships.find((m) => m.tenantId === activeTenantId);
      const realRoles = activeMembership?.roles ?? [];
      const viewAsRole = context?.viewAsRole ?? null;
      return { viewAsRole, effRoles: effectiveRoles(realRoles, viewAsRole), myPersonId: activeMembership?.personId ?? null };
    }

    function renderPersonSelectOptions() {
      const prev = personSelect.value;
      const { viewAsRole, effRoles, myPersonId } = currentPreview();
      const visibleRoster = (viewAsRole ? scopedRoster(roster, effRoles, myPersonId) : roster).filter((p) => p.status !== "archived");
      personSelect.innerHTML = visibleRoster.map((p) => `<option value="${p.id}">${langText(p.name, getAppLang(), p.id)}</option>`).join("");
      // Fix round (25 Aug 2026): prefer whatever this page's own re-render
      // already had selected; failing that (a fresh page load), fall back
      // to the last Person chosen anywhere in the app rather than always
      // the first roster row.
      // Bookmark-issues round: myPersonId (the signed-in login's own person)
      // is a third fallback, below stored -- see quranrevival.html's own
      // copy of this comment.
      const stored = getSelectedPersonId();
      const candidate = visibleRoster.some((p) => p.id === prev) ? prev
        : (visibleRoster.some((p) => p.id === stored) ? stored
        : (visibleRoster.some((p) => p.id === myPersonId) ? myPersonId : null));
      if (candidate) personSelect.value = candidate;
    }

    async function loadContextData() {
      const rosterSnap = await getDocs(query(collection(db, TENANT.TENANT_PEOPLE), where("tenantId", "==", activeTenantId)));
      roster = rosterSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
      const { viewAsRole } = currentPreview();
      renderNav(myMemberships.find((m) => m.tenantId === activeTenantId)?.roles ?? [], viewAsRole);
      renderPersonSelectOptions();
      selectedPersonId = personSelect.value || null;
      await refreshBookmarks();
    }

    async function refreshBookmarks() {
      if (!selectedPersonId) { bookmarksDoc = { resume: {}, saved: [], folders: [] }; taggedForSelected = []; renderAll(); return; }
      bookmarksDoc = await getBookmarks(db, activeTenantId, selectedPersonId);
      const { myPersonId } = currentPreview();
      if (myPersonId && myPersonId !== selectedPersonId) {
        try {
          const myDoc = await getBookmarks(db, activeTenantId, myPersonId);
          taggedForSelected = (myDoc.saved ?? []).filter((b) => !b.removed && b.personTagId === selectedPersonId);
        } catch {
          taggedForSelected = []; // not readable (e.g. no rules-granted relationship) -- show nothing extra rather than error the whole page
        }
      } else {
        taggedForSelected = [];
      }
      renderAll();
    }

    personSelect.addEventListener("change", async () => {
      selectedPersonId = personSelect.value;
      setSelectedPersonId(selectedPersonId);
      await refreshBookmarks();
    });

    // -----------------------------------------------------------------------
    // Rendering -- one folder tree (module-grouping is the DEFAULT layer,
    // per the owner's own "Both" answer: a bookmark with no folderId, or one
    // pointing at a removed/missing folder, falls back to being grouped by
    // its own moduleId under "Unfiled" rather than disappearing (I4: nothing
    // destroyed, nothing lost).
    // -----------------------------------------------------------------------

    // Thin wrappers over bookmarks.js's own shared, pure tree helpers -- kept
    // under their original short names so every call site below (written
    // before this refactor) needs no change; the helpers themselves are now
    // the single implementation bookmarks.html and the nav dropdown
    // (js/bookmark-nav.js) both share (see bookmarks.js's own header note on
    // this "Fixes round").
    function allFolders() {
      return bookmarksDoc.folders ?? [];
    }
    function folderById(id) {
      return sharedFolderById(bookmarksDoc, id);
    }
    function liveFolderIdFor(bookmark) {
      return sharedLiveFolderIdFor(bookmarksDoc, bookmark);
    }
    function bookmarksIn(folderId) {
      return bookmarksInFolder(bookmarksDoc, folderId, { includeRemoved: showRetired });
    }

    // Bookmark-issues round -- ownerPersonId is set only for a cross-document
    // "tagged for {selected}, but stored in your own doc" row (taggedForRowHtml
    // below); every ordinary row (the bookmark really does live in
    // selectedPersonId's own doc) omits it, unchanged from before. See
    // quranrevival.html's own openBookmarkFromQueryString() for the read side.
    function bookmarkHref(b, ownerPersonId = null) {
      const page = MODULE_PAGES[b.moduleId];
      if (!page) return null;
      // Quran carries a full `settings` snapshot worth restoring by id;
      // every other module has no comparable per-position state yet, so it
      // reuses the same ?resume=<position> jump the Continue strip already
      // uses (topic-study.js/routine-study.js/asma-study.js all read it) --
      // that jump is never doc-scoped, so ownerPersonId is only ever added
      // to the Quran branch.
      return b.moduleId === "quranrevival"
        ? `${page}?bookmark=${encodeURIComponent(b.id)}${ownerPersonId ? `&ownerPersonId=${encodeURIComponent(ownerPersonId)}` : ""}`
        : `${page}?resume=${encodeURIComponent(b.position ?? "")}`;
    }

    function folderOptionsHtml(excludeId, selectedId) {
      const options = [`<option value="">${t("Top level")}</option>`];
      for (const f of allFolders()) {
        if (f.removed) continue;
        if (excludeId && isFolderOrDescendant(allFolders(), f.id, excludeId)) continue; // never offer moving a folder into itself or its own descendant
        options.push(`<option value="${f.id}" ${f.id === selectedId ? "selected" : ""}>${escapeHtml(f.name)}</option>`);
      }
      return options.join("");
    }

    // Fixes round 2 -- who a bookmark is FOR (a student, a family member).
    // Distinct from whose list it lives in; see bookmarks.js's own
    // setBookmarkPersonTag() comment for why those are two different things.
    function personTagOptionsHtml(selectedPersonTagId) {
      const options = [`<option value="">${t("No one in particular")}</option>`];
      for (const p of roster) {
        options.push(`<option value="${p.id}" ${p.id === selectedPersonTagId ? "selected" : ""}>${escapeHtml(langText(p.name, getAppLang(), p.id))}</option>`);
      }
      return options.join("");
    }

    function moveBookmarkOptionsHtml(selectedFolderId) {
      const options = [`<option value="">${t("Unfiled")}</option>`];
      for (const f of allFolders()) {
        if (f.removed) continue;
        options.push(`<option value="${f.id}" ${f.id === selectedFolderId ? "selected" : ""}>${escapeHtml(f.name)}</option>`);
      }
      return options.join("");
    }

    function escapeHtml(s) {
      return (s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function bookmarkRowHtml(b) {
      const href = bookmarkHref(b);
      const moduleLabel = MODULE_LABELS[b.moduleId] ? t(MODULE_LABELS[b.moduleId]) : b.moduleId;
      return `<div class="bm-row${b.removed ? " retired" : ""}" data-bm-id="${b.id}">
        <span class="bm-row-name">${escapeHtml(b.name)}</span>
        <span class="bm-row-module">${escapeHtml(moduleLabel)}</span>
        ${href ? `<a href="${href}"><button type="button" class="tiny" ${b.removed ? "disabled" : ""}>${t("Open")}</button></a>` : ""}
        <button type="button" class="secondary tiny" data-bm-rename ${b.removed ? "disabled" : ""}>${t("Rename")}</button>
        <select data-bm-person title="${t("For")}" ${b.removed ? "disabled" : ""}>${personTagOptionsHtml(b.personTagId ?? null)}</select>
        <select data-bm-move ${b.removed ? "disabled" : ""}>${moveBookmarkOptionsHtml(liveFolderIdFor(b))}</select>
        <button type="button" class="secondary tiny" data-bm-toggle>${b.removed ? t("Restore") : t("Retire")}</button>
      </div>`;
    }

    function folderNodeHtml(folder, depth) {
      const bookmarks = bookmarksIn(folder.id);
      const children = childFolders(bookmarksDoc, folder.id, { includeRemoved: showRetired });
      return `<div class="bm-folder${folder.removed ? " retired" : ""}" data-folder-id="${folder.id}" style="margin-left:${depth * 0.4}rem;">
        <div class="bm-folder-header">
          📁 <span class="bm-folder-name">${escapeHtml(folder.name)}</span>
          <button type="button" class="secondary tiny" data-folder-rename ${folder.removed ? "disabled" : ""}>${t("Rename")}</button>
          <select data-folder-person title="${t("For")}" ${folder.removed ? "disabled" : ""}>${personTagOptionsHtml(folder.personTagId ?? null)}</select>
          <select data-folder-move ${folder.removed ? "disabled" : ""}>${folderOptionsHtml(folder.id, folder.parentId)}</select>
          <button type="button" class="secondary tiny" data-folder-toggle>${folder.removed ? t("Restore") : t("Retire")}</button>
        </div>
        ${bookmarks.map(bookmarkRowHtml).join("")}
        <div class="bm-folder-children">${children.map((f) => folderNodeHtml(f, depth + 1)).join("")}</div>
      </div>`;
    }

    /** Bookmark-issues round -- Person/Module modes both flatten to "everything tagged/filed under X," ignoring the folder tree (same shape the nav dropdown already uses for these two, bookmarks.js's own groupBookmarksByPerson()/groupBookmarksByModule()). */
    function groupedSectionsHtml(groups, labelFor) {
      return groups
        .map((g) => `<div class="bm-group-label">${escapeHtml(labelFor(g))}</div>${g.bookmarks.map(bookmarkRowHtml).join("")}`)
        .join("");
    }

    /**
     * Bookmark-issues round -- read-only rows for taggedForSelected (see its
     * own declaration comment). No rename/move/retire controls: those write
     * to the OWNER'S doc (myPersonId), not selectedPersonId's, and this
     * screen only ever writes to whichever doc is currently loaded as
     * bookmarksDoc -- editing one of these means selecting yourself and
     * editing it there, the same document it actually lives in.
     */
    function taggedForRowHtml(b) {
      const { myPersonId } = currentPreview();
      const href = bookmarkHref(b, myPersonId);
      const moduleLabel = MODULE_LABELS[b.moduleId] ? t(MODULE_LABELS[b.moduleId]) : b.moduleId;
      return `<div class="bm-row">
        <span class="bm-row-name">${escapeHtml(b.name)}</span>
        <span class="bm-row-module">${escapeHtml(moduleLabel)}</span>
        ${href ? `<a href="${href}"><button type="button" class="tiny">${t("Open")}</button></a>` : ""}
      </div>`;
    }

    function renderTaggedForContainer() {
      if (!taggedForSelected.length) { taggedForContainer.innerHTML = ""; return; }
      const p = roster.find((r) => r.id === selectedPersonId);
      const name = p ? langText(p.name, getAppLang(), p.id) : selectedPersonId;
      taggedForContainer.innerHTML =
        `<h2>${escapeHtml(t("Bookmarked for {name} by you", { name }))}</h2>` +
        taggedForSelected.map(taggedForRowHtml).join("");
    }

    function renderAll() {
      renderTaggedForContainer();
      const groupBy = getBookmarkMenuGroupBy();

      if (groupBy === "person") {
        foldersContainer.innerHTML = "";
        const { untagged, groups } = groupBookmarksByPerson(bookmarksDoc, roster.map((p) => p.id), { includeRemoved: showRetired });
        unfiledContainer.innerHTML =
          (untagged.length ? `<div class="bm-group-label">${escapeHtml(t("No one in particular"))}</div>${untagged.map(bookmarkRowHtml).join("")}` : "") +
          groupedSectionsHtml(groups, (g) => {
            const p = roster.find((r) => r.id === g.personTagId);
            return p ? langText(p.name, getAppLang(), p.id) : g.personTagId;
          });
        emptyMsg.style.display = (bookmarksDoc.saved ?? []).length === 0 && !taggedForSelected.length ? "block" : "none";
        wireRowHandlers();
        return;
      }

      if (groupBy === "module") {
        foldersContainer.innerHTML = "";
        const groups = groupBookmarksByModule(bookmarksDoc, Object.keys(MODULE_PAGES), { includeRemoved: showRetired });
        unfiledContainer.innerHTML = groupedSectionsHtml(groups, (g) => (MODULE_LABELS[g.moduleId] ? t(MODULE_LABELS[g.moduleId]) : g.moduleId));
        emptyMsg.style.display = (bookmarksDoc.saved ?? []).length === 0 && !taggedForSelected.length ? "block" : "none";
        wireRowHandlers();
        return;
      }

      // A folder nests under its literal parentId whether or not that parent
      // is itself retired (retiring a folder doesn't unroot its children --
      // it just makes ITS OWN row inert until restored). Only a genuinely
      // missing parent (deleted data, never happens through this screen, but
      // cheap to guard) promotes a folder to root rather than losing it.
      const roots = rootFolders(bookmarksDoc, { includeRemoved: showRetired });
      foldersContainer.innerHTML = roots.map((f) => folderNodeHtml(f, 0)).join("");

      const unfiled = unfiledBookmarks(bookmarksDoc, { includeRemoved: showRetired });
      const byModule = new Map();
      for (const b of unfiled) {
        const key = b.moduleId;
        if (!byModule.has(key)) byModule.set(key, []);
        byModule.get(key).push(b);
      }
      unfiledContainer.innerHTML = [...byModule.entries()]
        .map(([moduleId, list]) => {
          const label = MODULE_LABELS[moduleId] ? t(MODULE_LABELS[moduleId]) : moduleId;
          return `<div class="bm-group-label">${escapeHtml(label)}</div>${list.map(bookmarkRowHtml).join("")}`;
        })
        .join("");

      emptyMsg.style.display = (bookmarksDoc.saved ?? []).length === 0 && !taggedForSelected.length ? "block" : "none";
      wireRowHandlers();
    }

    // Every handler below patches bookmarksDoc IN MEMORY after a successful
    // write and re-renders from that, rather than calling getBookmarks()
    // again -- same reasoning quranrevival.html's own toggleAyahBookmark()
    // already uses (an unneeded round trip, and a real race against a
    // backend that may not have caught up to its own write yet).
    function patchBookmark(id, patch) {
      bookmarksDoc = { ...bookmarksDoc, saved: (bookmarksDoc.saved ?? []).map((b) => (b.id === id ? { ...b, ...patch } : b)) };
    }
    function patchFolder(id, patch) {
      bookmarksDoc = { ...bookmarksDoc, folders: (bookmarksDoc.folders ?? []).map((f) => (f.id === id ? { ...f, ...patch } : f)) };
    }

    function wireRowHandlers() {
      document.querySelectorAll(".bm-row").forEach((row) => {
        const id = row.dataset.bmId;
        const bookmark = (bookmarksDoc.saved ?? []).find((b) => b.id === id);
        if (!bookmark) return;
        row.querySelector("[data-bm-rename]")?.addEventListener("click", async () => {
          const name = prompt(t("Rename this bookmark:"), bookmark.name);
          if (name === null || !name.trim()) return;
          const outcome = await safeWrite(
            () => renameSavedBookmark(db, activeTenantId, selectedPersonId, bookmark.id, name.trim()),
            { collection: TENANT.BOOKMARKS, action: "renameSavedBookmark" }
          );
          if (!outcome.ok) return;
          patchBookmark(bookmark.id, { name: name.trim() });
          renderAll();
        });
        row.querySelector("[data-bm-move]")?.addEventListener("change", async (e) => {
          const folderId = e.target.value || null;
          const outcome = await safeWrite(
            () => moveBookmarkToFolder(db, activeTenantId, selectedPersonId, bookmark.id, folderId),
            { collection: TENANT.BOOKMARKS, action: "moveBookmarkToFolder" }
          );
          if (!outcome.ok) return;
          patchBookmark(bookmark.id, { folderId });
          renderAll();
        });
        row.querySelector("[data-bm-person]")?.addEventListener("change", async (e) => {
          const personTagId = e.target.value || null;
          const outcome = await safeWrite(
            () => setBookmarkPersonTag(db, activeTenantId, selectedPersonId, bookmark.id, personTagId),
            { collection: TENANT.BOOKMARKS, action: "setBookmarkPersonTag" }
          );
          if (!outcome.ok) return;
          patchBookmark(bookmark.id, { personTagId });
          renderAll();
        });
        row.querySelector("[data-bm-toggle]")?.addEventListener("click", async () => {
          const removed = !bookmark.removed;
          const outcome = await safeWrite(
            () => setSavedBookmarkRemoved(db, activeTenantId, selectedPersonId, bookmark.id, removed),
            { collection: TENANT.BOOKMARKS, action: "setSavedBookmarkRemoved" }
          );
          if (!outcome.ok) return;
          patchBookmark(bookmark.id, { removed });
          renderAll();
        });
      });

      document.querySelectorAll(".bm-folder").forEach((el) => {
        const id = el.dataset.folderId;
        const folder = folderById(id);
        if (!folder) return;
        el.querySelector("[data-folder-rename]")?.addEventListener("click", async (e) => {
          e.stopPropagation();
          const name = prompt(t("Rename this folder:"), folder.name);
          if (name === null || !name.trim()) return;
          const outcome = await safeWrite(
            () => renameFolder(db, activeTenantId, selectedPersonId, folder.id, name.trim()),
            { collection: TENANT.BOOKMARKS, action: "renameFolder" }
          );
          if (!outcome.ok) return;
          patchFolder(folder.id, { name: name.trim() });
          renderAll();
        });
        el.querySelector("[data-folder-person]")?.addEventListener("change", async (e) => {
          const personTagId = e.target.value || null;
          const outcome = await safeWrite(
            () => setFolderPersonTag(db, activeTenantId, selectedPersonId, folder.id, personTagId),
            { collection: TENANT.BOOKMARKS, action: "setFolderPersonTag" }
          );
          if (!outcome.ok) return;
          patchFolder(folder.id, { personTagId });
          renderAll();
        });
        el.querySelector("[data-folder-move]")?.addEventListener("change", async (e) => {
          const newParentId = e.target.value || null;
          const outcome = await safeWrite(
            () => moveFolder(db, activeTenantId, selectedPersonId, folder.id, newParentId),
            { collection: TENANT.BOOKMARKS, action: "moveFolder" }
          );
          if (!outcome.ok || outcome.result === false) { e.target.value = folder.parentId ?? ""; return; }
          patchFolder(folder.id, { parentId: newParentId });
          renderAll();
        });
        el.querySelector("[data-folder-toggle]")?.addEventListener("click", async (e) => {
          e.stopPropagation();
          const removed = !folder.removed;
          const outcome = await safeWrite(
            () => setFolderRemoved(db, activeTenantId, selectedPersonId, folder.id, removed),
            { collection: TENANT.BOOKMARKS, action: "setFolderRemoved" }
          );
          if (!outcome.ok) return;
          patchFolder(folder.id, { removed });
          renderAll();
        });
      });
    }

    newFolderBtn.addEventListener("click", async () => {
      if (!selectedPersonId) return;
      const name = prompt(t("Name this folder:"), "");
      if (!name || !name.trim()) return;
      const outcome = await safeWrite(
        () => createFolder(db, { tenantId: activeTenantId, personId: selectedPersonId, name: name.trim(), uid: auth.currentUser.uid }),
        { collection: TENANT.BOOKMARKS, action: "createFolder" }
      );
      if (!outcome.ok) return;
      bookmarksDoc = { ...bookmarksDoc, folders: [...(bookmarksDoc.folders ?? []), outcome.result] };
      renderAll();
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        whoEl.textContent = t("Not signed in.");
        signInBtn.style.display = "inline-block";
        signOutBtn.style.display = "none";
        appEl.style.display = "none";
        return;
      }
      whoEl.textContent = t("Signed in as {email}", { email: user.email });
      signInBtn.style.display = "none";
      signOutBtn.style.display = "inline-block";

      try {
        const userIndexSnap = await getDoc(doc(db, TENANT.USER_INDEX, user.uid));
        if (adoptAppLangFromUserIndex(userIndexSnap)) return;
        const defaultTenantId = userIndexSnap.exists() ? userIndexSnap.data().defaultTenantId : null;
        const { context, memberships } = await bootstrapContext(db, user.uid, defaultTenantId);
        if (!context) {
          whoEl.innerHTML += noAccountMessageHtml();
          return;
        }
        activeTenantId = context.tenantId;
        myMemberships = memberships;
        tenantSelect.innerHTML = myMemberships
          .map((m) => `<option value="${m.tenantId}" ${m.tenantId === activeTenantId ? "selected" : ""}>${m.tenantName} (${roleListLabel(m.roles)})</option>`)
          .join("");

        appEl.style.display = "block";
        await loadContextData();
      } catch (err) {
        console.error(err);
        whoEl.textContent += ` — ${err.message}`;
      }
    });

    tenantSelect.addEventListener("change", async () => {
      const chosen = myMemberships.find((m) => m.tenantId === tenantSelect.value);
      if (!chosen) return;
      activeTenantId = chosen.tenantId;
      setActiveContext({ tenantId: chosen.tenantId, personId: chosen.personId, roles: chosen.roles, viewAsRole: null });
      renderNav(chosen.roles, null);
      await loadContextData();
    });
  </script>
</body>
</html>
