<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="./css/shell.css" />
<link rel="stylesheet" href="./css/card-look.css" />
  <script>(function(){try{document.documentElement.setAttribute('data-card-look',localStorage.getItem('mm_card_look')==='light'?'light':'night');}catch(e){document.documentElement.setAttribute('data-card-look','night');}})();</script>
<title>QuranRevival — Mapping My Journey</title>
<!-- MAP Phase 6 (P6-F, issue #199) -- a Note's bodyHtml is rendered as markup
     here too (the same read path notes.html already uses), so it goes
     through the same DOMPurify allow-list before ever touching innerHTML. -->
<script src="vendor/purify.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem 4rem; color: #222; }
  h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
  p.intro { color: #555; font-size: 0.94rem; }
  #who { margin: 1rem 0; font-size: 0.95rem; color: #555; }
  button {
    font-size: 0.88rem; padding: 0.32rem 0.7rem; border-radius: 0.4rem; border: 1px solid #ccc;
    background: #1F3A6E; color: white; cursor: pointer;
  }
  button.secondary { background: white; color: #1F3A6E; }
  button.danger { background: white; color: #a3352b; border-color: #d9a49d; }
  button.tiny { padding: 0.12rem 0.5rem; font-size: 0.8rem; }
  button:disabled { opacity: 0.5; cursor: default; }
  select, input[type="text"] { font-size: 0.85rem; padding: 0.3rem 0.4rem; border: 1px solid #ccc; border-radius: 0.35rem; }
  .note { font-size: 0.88rem; color: #666; }
  .warn { background: #fff8e6; border: 1px solid #f0d9a0; border-radius: 0.5rem; padding: 0.6rem 0.8rem; font-size: 0.88rem; margin: 0.7rem 0; }
  #contextBar { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin: 1rem 0; font-size: 0.9rem; }
  #contextBar label { margin: 0; }

  /* -- the toggle: one small segmented control, three buttons, same purpose
     -- and roughly the same shape -- as this app's own "View as" chips
     elsewhere, sized as real tap targets (>=36px) at every phone width. -- */
  #viewToggle { display: flex; gap: 0.3rem; margin: 1rem 0; flex-wrap: nowrap; align-items: center; }
  /* The Owner, 25 Sep 2026: "There's no go back button to exit from Mapping
     view." The dock's Mapping tab (v08.61) opens this as a separate page, so
     the reader needs a way back that does not depend on the browser's own
     back control, which a phone app shell may hide. */
  /* Owner decision 40: Back never takes a line of its own -- a 40px square
     "←" as the first item of the view row. */
  #backLink { flex: 0 0 40px; box-sizing: border-box; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid #c9d3e6; border-radius: 999px; background: #fff; color: #1f3a6e; font-weight: 600; font-size: 1.1rem; text-decoration: none; }
  #backLink:focus-visible { outline: 2px solid #1f3a6e; outline-offset: 2px; }
  #contextBar[hidden] { display: none; }
  @media (max-width: 399.98px) { .view-toggle-btn { padding: 0.4rem 0.25rem; font-size: 0.8rem; } }
  .view-toggle-btn {
    /* flex-basis 0 so the three views share the row equally and the ⋯ menu
       (v08.66) stays on the same line; 8rem each pushed "Path" onto a line
       of its own below 440px. */
    flex: 1 1 0; min-width: 0; min-height: 36px; padding: 0.4rem 0.5rem; font-size: 0.85rem;
    border-radius: 999px; border: 1px solid #1F3A6E; background: #fff; color: #1F3A6E;
  }
  .view-toggle-btn[aria-pressed="true"] { background: #1F3A6E; color: #fff; }

  #emptyMsg { color: #888; font-size: 0.9rem; margin: 1rem 0; }

  /* -- Option A: folders -- an expandable TREE (issue #259), replacing the
     former one-folder-at-a-time drill-down. --tree-scale is the A-/A+ text
     size control: font-size: calc(...) is how a custom property re-scales
     several rules at once without a `transform` (which would scale layout
     boxes, not just text). */
  #viewFolders { --tree-scale: 1; }
  .folder-toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin: 0.6rem 0; }
  .folder-search-input { flex: 1 1 12rem; }
  .folder-toolbar-check { display: flex; align-items: center; gap: 0.3rem; font-size: 0.82rem; color: #555; white-space: nowrap; }
  .folder-textsize-group { display: flex; gap: 0.2rem; }
  .folder-tree, .folder-search-results { list-style: none; margin: 0.6rem 0; padding: 0; }
  .folder-tree-item { margin: 0.25rem 0; }
  .folder-row {
    display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.55rem;
    border: 1px solid #ddd; border-radius: 0.5rem; background: #fff; cursor: pointer; min-height: 40px;
  }
  .folder-row.system { border-color: #B8862F; background: #fdf6ea; }
  .folder-row.drag-over-before { border-top: 3px solid #1F3A6E; }
  .folder-row.drag-over-after { border-bottom: 3px solid #1F3A6E; }
  .folder-row.drag-over-inside { background: #eef2ff; border-color: #1F3A6E; }
  .folder-toggle {
    flex: 0 0 auto; width: 28px; height: 28px; padding: 0; font-size: 0.85rem; line-height: 1;
    border: none; background: none; color: #1F3A6E; cursor: pointer;
  }
  .folder-toggle-leaf { visibility: hidden; }
  /* min-width: 0 is load-bearing (this project's own standing lesson: a flex
     item defaults to min-width: auto, which refuses to shrink below its own
     content's intrinsic width and silently overflows the row) -- a real
     folder name ("Reflections on Surah Al-Baqarah, Ramadan 1447") must be
     able to wrap onto several lines inside its own column rather than push
     the row wider than the screen or get cut with an ellipsis nobody can
     read the rest of. */
  .folder-row-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; font-weight: 600; color: #1F3A6E; font-size: calc(0.94rem * var(--tree-scale, 1)); }
  .folder-row-count { font-size: calc(0.78rem * var(--tree-scale, 1)); color: #888; }
  .folder-pin-flag { font-size: 0.85rem; }
  .folder-rename-input { flex: 1 1 auto; min-width: 0; font-weight: 600; color: #1F3A6E; font-size: calc(0.94rem * var(--tree-scale, 1)); }
  .folder-tree-empty, .folder-tree-file-btn { font-size: 0.85rem; color: #888; padding: 0.3rem 0; }
  /* Siyagah round 3 -- the destination picker (one chooser for Copy to… and
     Move to…, notes and folders) and the Trash view. The picker is a fixed
     overlay above everything this document draws; full screen at phone width. */
  .folder-picker-overlay { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; }
  .folder-picker { background: #fff; color: #222; border-radius: 0.6rem; width: min(30rem, 94vw); max-height: 82vh; display: flex; flex-direction: column; gap: 0.5rem; padding: 0.8rem; box-sizing: border-box; outline: none; }
  .folder-picker-title { margin: 0; font-size: 1.05rem; }
  .folder-picker-msg { margin: 0; }
  .folder-picker-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .folder-picker-row { display: flex; align-items: center; gap: 0.4rem; width: 100%; min-height: 44px; text-align: left; background: #fff; color: #1F3A6E; border: 1px solid #ddd; border-radius: 0.4rem; margin: 0 0 0.25rem; padding: 0.4rem 0.6rem; box-sizing: border-box; cursor: pointer; }
  .folder-picker-row .folder-row-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .folder-picker-row.refused { opacity: 0.45; }
  .folder-picker-actions { display: flex; justify-content: flex-end; }
  @media (max-width: 600px) {
    .folder-picker-overlay { align-items: stretch; }
    .folder-picker { width: 100%; height: 100%; max-height: none; border-radius: 0; }
  }
  .trash-head { display: flex; align-items: center; gap: 0.6rem; }
  .trash-title { margin: 0; font-size: 1.1rem; }
  .trash-list { list-style: none; margin: 0.5rem 0; padding: 0; }
  .trash-row { display: flex; align-items: center; gap: 0.6rem; border: 1px solid #ddd; border-radius: 0.5rem; background: #fff; padding: 0.5rem 0.6rem; margin-bottom: 0.35rem; min-height: 44px; }
  .trash-row-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0.1rem; overflow-wrap: anywhere; }
  .trash-row button { flex: 0 0 auto; min-height: 40px; }
  /* P6-G/issue #259 -- every editing action (📍/✏️/▲/▼/Move to…/🗑) folds
     into ONE ⋯ menu, at every width (a stated simplification from the
     Owner's own Siyagah reference -- see folderRowHtml()'s own comment).
     A 40px square button, this project's own standing lesson against a
     26px control. */
  .folder-menu-wrap { position: relative; flex: 0 0 auto; }
  .folder-menu-btn {
    width: 40px; height: 40px; padding: 0; font-size: 1.15rem; line-height: 1;
    border-radius: 0.4rem; border: 1px solid #ccc; background: #fff; color: #1F3A6E; cursor: pointer;
  }
  /* Same shape as quranrevival.html's own js/bar-palette.js popovers --
     the module owns open/close/outside-click/Escape/"only one at a time",
     this page only supplies the look. Siyagah's own bug was this exact menu
     opening BEHIND other page content on a phone; z-index: 20 plus its own
     stacking context (position: relative on the wrap) is what keeps it on
     top here, checked by hit-testing in journey-map-screen.mjs. */
  .bar-palette {
    display: none; position: absolute; top: 2.4rem; right: 0; z-index: 20;
    background: #fff; border: 1px solid #ddd; border-radius: 0.5rem;
    box-shadow: 0 10px 26px rgba(20,30,60,0.25);
    width: 11rem; max-width: calc(100vw - 2rem); box-sizing: border-box;
    padding: 0.5rem; flex-direction: column; gap: 0.3rem;
  }
  .bar-palette.open { display: flex; }
  .bar-palette button { width: 100%; text-align: left; }
  .note-order-btn { min-width: 2.4rem; }
  .folder-search-breadcrumb { display: block; font-size: 0.76rem; color: #888; }
  .folder-search-result { padding: 0.4rem 0.55rem; border: 1px solid #ddd; border-radius: 0.5rem; margin: 0.3rem 0; cursor: pointer; background: #fff; }
  .folder-footer { margin: 0.8rem 0 0.3rem; border-top: 1px dashed #ddd; padding-top: 0.6rem; }
  .folder-footer-target { font-size: 0.82rem; color: #555; margin: 0 0 0.4rem; }
  #newFolderForm { display: flex; gap: 0.4rem; margin: 0.3rem 0; flex-wrap: wrap; }
  #newFolderForm input { flex: 1 1 10rem; }

  /* -- Option B: timeline -- */
  .filter-chips { display: flex; gap: 0.35rem; flex-wrap: wrap; margin: 0.7rem 0; }
  .filter-chip {
    font-size: 0.8rem; padding: 0.28rem 0.65rem; min-height: 32px; border-radius: 999px;
    border: 1px solid #1F3A6E; background: #fff; color: #1F3A6E; cursor: pointer;
  }
  .filter-chip[aria-pressed="true"] { background: #1F3A6E; color: #fff; }
  .timeline-day { margin: 1rem 0 0.3rem; font-size: 0.82rem; font-weight: 600; color: #888; border-bottom: 1px dashed #ddd; padding-bottom: 0.2rem; }

  /* -- Option C: path -- a BRANCHING tree (issue #267, an Owner decision: "Path
     view: branching with links"), replacing v08.37's own honest-first-pass
     straight track. Each folder is a branch (drawn as a vertical left-border
     trunk, the same visual idea as a code-review thread or a commit graph);
     its own filed Notes are stops along it, oldest first; a Note filed in
     more than one folder carries a 🔗 badge on every appearance, and tapping
     one highlights every appearance and draws a connecting line between them.
     #pathTree scrolls WITHIN ITSELF (never the whole page sideways) because a
     tree eight levels deep (MAX_FOLDER_DEPTH) can run wider than a phone. */
  #pathTree { position: relative; overflow-x: auto; max-width: 100%; }
  .path-hint { font-size: 0.82rem; color: #666; margin: 0.4rem 0; }
  .path-branch { margin: 0.3rem 0; }
  .path-branch.system > .path-branch-head .path-branch-name { color: #B8862F; }
  .path-branch-head { display: flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0.3rem; cursor: pointer; min-height: 40px; }
  .path-branch-toggle {
    flex: 0 0 auto; width: 40px; height: 40px; padding: 0; font-size: 0.95rem; line-height: 1;
    border: none; background: none; color: #1F3A6E; cursor: pointer;
  }
  .path-branch-toggle-leaf { visibility: hidden; }
  .path-branch-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; font-weight: 600; color: #1F3A6E; }
  .path-branch-count { font-size: 0.78rem; color: #888; }
  /* The trunk/branch line itself -- every level of nesting adds one more,
     which is what draws the "branching down" shape the issue asks for. */
  .path-branch-body { margin-left: 1.1rem; padding-left: 1rem; border-left: 3px solid #B8862F; }
  .path-branch-empty { font-size: 0.85rem; color: #888; padding: 0.2rem 0; }
  .path-stops { position: relative; margin: 0.2rem 0; }
  .path-stop { position: relative; margin: 0 0 0.7rem; padding-left: 0.9rem; }
  .path-stop-marker {
    position: absolute; left: -1.34rem; top: 0.3rem; width: 10px; height: 10px;
    border-radius: 50%; background: #B8862F; border: 2px solid #fff; box-shadow: 0 0 0 1px #B8862F;
  }
  .path-stop-date { font-size: 0.76rem; color: #888; }
  .path-more-btn { min-height: 40px; margin: 0.2rem 0 0.6rem; }
  .path-link-badge {
    min-height: 40px; min-width: 40px; padding: 0.1rem 0.55rem; font-size: 0.8rem; border-radius: 999px;
    border: 1px solid #B8862F; background: #fdf6ea; color: #7a5c1e; cursor: pointer;
  }
  .path-link-badge.active { background: #B8862F; color: #fff; }
  .note-card.path-note-highlighted { border-color: #B8862F; border-width: 2px; box-shadow: 0 0 0 2px #B8862F; }
  /* pointer-events: none -- the overlay must never steal a tap meant for a
     stop or a branch toggle underneath it (the same hit-testable-below
     Siyagah lesson the folder tree's own ⋯ menu already applies here). */
  .path-link-lines { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
  .path-link-lines line { stroke: #B8862F; stroke-width: 2; stroke-dasharray: 4 3; }

  /* -- shared note row/card, all three views -- */
  .note-card { border: 1px solid #ddd; border-radius: 0.6rem; padding: 0.7rem 0.85rem; margin: 0.6rem 0; background: #fff; }
  .note-card-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; cursor: pointer; }
  .note-card-title { font-weight: 600; font-size: 0.96rem; flex: 1 1 auto; min-width: 8rem; }
  .note-card-meta { font-size: 0.76rem; color: #888; }
  .note-body-preview { margin-top: 0.5rem; font-size: 0.9rem; line-height: 1.4; display: none; }
  .note-body-preview.open { display: block; }
  .note-body-preview p { margin: 0.3rem 0; }
  .note-actions { margin-top: 0.5rem; display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .folder-chip { display: inline-block; font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: #eef2ff; color: #1F3A6E; margin: 0.1rem 0.2rem 0 0; }
  #truncatedMsg { color: #a3352b; font-size: 0.82rem; margin-top: 0.5rem; }
  /* Embed mode: the page is the pop-up tray's body (journey-tray.js), which
     supplies the title bar and close. Header, intro, nav and Back are the tray's
     job; Folders | Timeline | Path stay as its tabs. */
  html.embed h1, html.embed .intro, html.embed #topNav, html.embed #backLink, html.embed #accountCardOverlay { display: none !important; }
  html.embed body { margin: 0; padding: 0.4rem 0.6rem; overflow-x: hidden; }
</style>
</head>
<body>
  <script>(function(){try{if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed');}catch(e){}})();</script>
  <script>/* In the tray, a link that leaves this screen (Import Notes, a note) opens as a full page, not inside the tray. */
  document.addEventListener('click',function(e){if(!document.documentElement.classList.contains('embed'))return;var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href');if(!h||h.charAt(0)==='#'||/journey-map\.html/.test(h))return;a.setAttribute('target','_top');},true);</script>
  <h1>Mapping My Journey</h1>
  <p class="intro">Every permanent Note you've written, organised your way — folders, a timeline, or a path. Try all three; the app remembers which you picked.</p>

  <nav class="app-nav" id="topNav">
    <details class="nav-cat nav-cat-home">
      <summary>Home</summary>
      <div class="nav-cat-links">
        <a href="https://madrasatul-muslimeen.github.io/legacy/index.html" class="nav-legacy-link" target="_blank" rel="noopener">Legacy App - v06 ↗</a>
        <a href="https://madrasatul-muslimeen.github.io/legacy-v07/index.html" class="nav-legacy-link" target="_blank" rel="noopener">Legacy App - v07 ↗</a>
        <a href="https://madrasatul-muslimeen.github.io/legacy-v08/index.html" class="nav-legacy-link" target="_blank" rel="noopener">Legacy App - v08 ↗</a>
        <div id="who">Checking sign-in…</div>
        <button id="signInBtn" style="display:none;">Sign in with Google</button>
        <button id="signOutBtn" class="secondary" style="display:none;">Sign out</button>
        <div id="navHomeExtra"></div>
      </div>
    </details>
    <div id="navBar"></div>
  </nav>

  <div id="app" style="display:none;">
    <div id="contextBar">
      <label>Tenant
        <select id="tenantSelect" style="width:auto;"></select>
      </label>
      <label>Person
        <select id="personSelect" style="width:auto;"></select>
      </label>
    </div>

    <div id="readOnlyMsg" class="note" style="display:none;"></div>
    <p id="pageStatusMsg" class="note" style="display:none;"></p>

    <div id="viewToggle" role="group" aria-label="View">
      <a id="backLink" href="quranrevival.html" title="Go back" aria-label="Go back"><span aria-hidden="true">←</span></a>
      <button type="button" class="view-toggle-btn" data-view="folders">Folders</button>
      <button type="button" class="view-toggle-btn" data-view="timeline">Timeline</button>
      <button type="button" class="view-toggle-btn" data-view="path">Path</button>
      <span class="bar-palette-wrap page-menu-wrap" data-bar-palette-wrap="pageMenu">
        <button type="button" class="folder-menu-btn bar-palette-toggle" data-bar-palette-toggle="pageMenu" aria-haspopup="true" aria-expanded="false" title="More" aria-label="More">⋯</button>
        <div class="bar-palette" data-bar-palette="pageMenu">
          <button type="button" class="secondary tiny" id="openTrashBtn" style="display:block; width:100%; text-align:left; padding:0.32rem 0.7rem;">🗑 Trash</button>
          <a class="secondary tiny" href="import-notes.html" style="display:block; text-align:left; text-decoration:none; padding:0.32rem 0.7rem;">Import Notes…</a>
        </div>
      </span>
    </div>

    <div id="viewFolders"></div>
    <div id="viewTimeline" style="display:none;"></div>
    <div id="viewPath" style="display:none;"></div>
    <div id="viewTrash" style="display:none;"></div>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-init.js";
    import {
      GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { TENANT } from "./js/collections.js";
    import { langText } from "./js/lang.js";
    import { getAppLang, mountCardLookControl } from "./js/prefs.js";
    import { adoptAppLangFromUserIndex, mountSyncedAppLangControl } from "./js/lang-sync.js";
    import { safeWrite, reportWriteFailure } from "./js/errors.js";
    import { bootstrapContext, setActiveContext, getSelectedPersonId, setSelectedPersonId } from "./js/session-context.js";
    import { renderNavBar, renderHomeExtras, noAccountMessageHtml } from "./js/nav.js";
    import { translateStatic, t } from "./js/i18n.js";
    import { mountAccountCard } from "./js/account-card.js";
    import { registerServiceWorker } from "./js/sw-register.js";
    import { roleListLabel } from "./js/labels.js";
    import { sanitizeNoteHtml } from "./js/note-sanitize.js";
    import { closeAllBarPalettes } from "./js/bar-palette.js";
    import { NOTE_STATUS, createNoteFolder, createNotePlacement, restoreNote } from "./js/note-foundation.js";
    import {
      ownerFolderTreePagedSharded, folderContents,
      renameFolder, reorderFolder, moveFolder, reorderFiling,
      trashFolder, restoreFolder, loadOwnerTrash, copyNoteToFolder, moveNote, copyFolder,
      loadAllOwnerNotesSharded, loadAllOwnerPlacementsSharded, folderNoteCounts, folderMoveRefusal,
    } from "./js/journey-map-service.js";

    translateStatic();
    registerServiceWorker();

    // Back: return to wherever the reader came from inside this app (the
    // dock's Mapping tab, the Note view's ⋯ menu, Home ▾), so they land on
    // the same screen and position. A direct visit, a bookmark or a link
    // from outside has nothing of ours to go back to, so the plain href to
    // Quran Study stands.
    document.getElementById("backLink").addEventListener("click", (e) => {
      let sameOrigin = false;
      try { sameOrigin = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch { sameOrigin = false; }
      if (sameOrigin && history.length > 1) { e.preventDefault(); history.back(); }
    });

    // ADR-010 §3's closed set, mirrored rather than imported directly from
    // journey-map-contract.js -- this screen goes through journey-map-
    // service.js for everything else, and importing the pure contract a
    // second, separate way would widen its reachability with no benefit
    // (the service already re-exports the one function of the contract's
    // this page actually needs, buildFolderTree(), via ownerFolderTree()).
    // These two ids are ADR-010's own locked vocabulary, not something this
    // page decides -- see journey-map-contract.js's SYSTEM_FOLDER_ROLES.
    const SYSTEM_FOLDER_ROLES = Object.freeze(["journey-map", "reflection-archive"]);
    function isSystemFolderRole(role) { return SYSTEM_FOLDER_ROLES.includes(role); }

    // -----------------------------------------------------------------------
    // The two system folders always exist CONCEPTUALLY (ADR-010 §3 -- "every
    // person has exactly two system folders") even before either has a real
    // Firestore document. Rather than fabricate a fake document for one, this
    // screen represents it as a VIRTUAL node (folderId: null) until the person
    // does something that genuinely needs the real thing to exist -- filing a
    // Note into it, which createNotePlacement() can only do against a folder
    // that is really there. At that point ensureRealFolder() creates it for
    // real, once, the same way any other folder is created. This is a judgment
    // call the issue itself asked to be stated rather than assumed: no fake
    // doc is ever rendered as if it were stored, and the one write this
    // triggers is a genuine, real, I17-stamped createNoteFolder() call.
    // -----------------------------------------------------------------------
    const SYSTEM_ROLE_LABEL = {
      "journey-map": () => t("Personal Journey Map"),
      "reflection-archive": () => t("Reflection Archive"),
    };

    function systemFolderNode(role) {
      return { folderId: null, semanticRole: role, name: SYSTEM_ROLE_LABEL[role](), status: NOTE_STATUS.ACTIVE, order: SYSTEM_FOLDER_ROLES.indexOf(role), children: [], virtual: true };
    }

    function folderDisplayName(folder) {
      if (isSystemFolderRole(folder.semanticRole)) return SYSTEM_ROLE_LABEL[folder.semanticRole]();
      return folder.name || t("(untitled folder)");
    }

    /**
     * `order` is display only (note-foundation.js's own comment on the
     * folder-reorder writer this page calls through `reorderFolder()`) and
     * the folder LIST READ in note-foundation.js carries no `orderBy` at all
     * (an equality-only query needs no composite index) -- so every place
     * this screen shows a set of siblings sorts by `order` itself. A stable
     * sort (native since ES2019) means two folders that
     * happen to share an `order` value keep whatever relative position the
     * database returned them in, rather than jittering between renders.
     */
    function byOrder(a, b) { return (a.order ?? 0) - (b.order ?? 0); }

    /**
     * P6-G fix (issue #234, review of PR #233) -- `createNoteFolder()` and
     * `createNotePlacement()` both default `order: 0`, and this page filed a
     * Note without ever overriding it at all. A brand-new sibling must land
     * strictly after every sibling that already exists, or it collides with
     * whichever of them also happens to be at the current maximum (0, for
     * every real folder/filing created before this fix).
     */
    function nextOrder(siblings) {
      return siblings.reduce((max, s) => Math.max(max, s.order ?? 0), -1) + 1;
    }

    /**
     * P6-G fix (issue #234) -- pure, and deliberately so: it is extracted and
     * executed directly by `journey-map-screen.mjs` outside any browser, the
     * same way `reorderTrackables()` (v08.01, the 30 Approaches) is the
     * precedent this shape borrows from. `siblings` is a display-ordered
     * array of `{ id, order }` (only these two fields are read); returns the
     * `{ id, order }` writes needed to realize `idx` and `idx + direction`
     * swapped in display order -- ONLY for the entries whose order actually
     * changes.
     *
     * THE DEFECT THIS REPLACES: the old swap read the two neighbours' own
     * `order` fields and wrote each other's value back. Correct once every
     * sibling already holds a distinct value; a silent no-op the moment two
     * neighbours collide -- which every real folder/filing did, because
     * nothing here ever passed a distinct `order` at creation until this
     * round. This renumbers the WHOLE sequence to 0..n-1 by display
     * position and writes only what changed, so colliding siblings are
     * renumbered to distinct values the first time anything in the set is
     * reordered, and a later one-place move costs exactly the two documents
     * that actually moved.
     */
    function planReorder(siblings, idx, direction) {
      const other = idx + direction;
      if (!siblings[idx] || !siblings[other]) return [];
      const sequence = siblings.slice();
      const tmp = sequence[idx];
      sequence[idx] = sequence[other];
      sequence[other] = tmp;
      return sequence
        .map((item, order) => ({ id: item.id, order, prevOrder: item.order ?? 0 }))
        .filter((w) => w.order !== w.prevOrder)
        .map(({ id, order }) => ({ id, order }));
    }

    /** roots merged with any system role missing a real document -- real ones (once created) simply appear among ownerFolderTree()'s own roots, since a system folder has no parent. */
    function mergedRoots() {
      const roots = folderTree.roots || [];
      const real = new Map(roots.filter((f) => isSystemFolderRole(f.semanticRole)).map((f) => [f.semanticRole, f]));
      const systemNodes = SYSTEM_FOLDER_ROLES.map((role) => real.get(role) ?? systemFolderNode(role));
      const userRoots = roots.filter((f) => !isSystemFolderRole(f.semanticRole)).sort(byOrder);
      return [...systemNodes, ...userRoots];
    }

    function flattenFolders(nodes, depth = 0, out = []) {
      for (const f of [...nodes].sort(byOrder)) {
        out.push({ folder: f, depth });
        if (f.children?.length) flattenFolders(f.children, depth + 1, out);
      }
      return out;
    }

    /**
     * P6-G -- the folder-editing wrappers throw a plain `Error` naming
     * ADR-010's own refusal vocabulary (`folderTreeRefusal()`'s slugs, or one
     * of note-foundation.js's own fixed sentences) rather than carrying a
     * Firestore `.code`. `errors.js`'s own `plainMessageFor()` only knows
     * Firestore codes, so an unrecognised `.code` falls through to its
     * generic "(unknown)" sentence -- true, translated, and reaches the user
     * (I15), but not the specific, actionable sentence a refused move or a
     * refused retire needs. This reads the SAME accepted reason vocabulary
     * (never a second, divergent copy of ADR-010's own policy) and turns it
     * into words; anything it does not recognise (a genuine Firestore
     * failure) returns null and falls through to the normal safeWrite path.
     */
    const FOLDER_PARENT_REFUSAL_MESSAGES = {
      "self-parent": () => t("A folder can't be moved inside itself."),
      "parent-missing": () => t("That folder no longer exists — please refresh and try again."),
      "parent-not-mine": () => t("That isn't your folder to move into."),
      "parent-not-active": () => t("That folder has been removed, so nothing can be moved into it."),
      "parent-is-system": () => t("Personal Journey Map and Reflection Archive can't hold other folders inside them."),
      "too-deep": () => t("Moving it there would nest folders too deeply. Choose a folder closer to the top."),
      "cycle": () => t("Moving it there would put a folder inside one of its own folders. Choose a different folder."),
      "ancestor-missing": () => t("That folder's place could not be confirmed — please refresh and try again."),
    };
    function folderBusinessRefusal(err) {
      const msg = err?.message || "";
      const parentRefusal = msg.match(/^Folder parent refused: (.+)$/);
      if (parentRefusal) {
        const known = FOLDER_PARENT_REFUSAL_MESSAGES[parentRefusal[1]];
        return known ? known() : t("That move was refused.");
      }
      if (/^Folder still holds active folders:/.test(msg)) {
        return t("This folder still has other folders inside it — remove those first, then this one.");
      }
      if (msg === "A retired folder cannot be renamed.") return t("That folder has already been removed, so it can't be renamed.");
      if (msg === "A retired folder cannot be reordered.") return t("That folder has already been removed, so it can't be reordered.");
      if (msg === "Folder does not exist.") return t("That folder could not be found — please refresh and try again.");
      if (msg === "A retired placement cannot be reordered.") return t("That Note has already been removed from this folder, so it can't be reordered.");
      const holds = msg.match(/^This folder still holds (\d+) notes?\. Move or delete them first\.$/);
      if (holds) return t("This folder still holds {n} notes. Move or delete them first.", { n: holds[1] });
      if (msg === "This note is already filed in that folder.") return t("This note is already filed in that folder.");
      if (msg === "This note is not filed in that folder.") return t("This note is not filed in that folder any more — please refresh and try again.");
      if (msg === "That folder does not exist or is in Trash.") return t("That folder does not exist or is in Trash.");
      if (msg === "System folders cannot be moved to Trash.") return t("Personal Journey Map and Reflection Archive can't be deleted.");
      if (msg === "System folders cannot be copied.") return t("Personal Journey Map and Reflection Archive can't be copied.");
      if (msg === "Folder is not in Trash.") return t("That folder is not in Trash.");
      if (msg === "Note is not in Trash.") return t("That Note is not in Trash.");
      if (msg === "Stale Note revision.") return t("That Note has changed — please refresh and try again.");
      if (msg === "A move must change folder.") return t("A move must change folder.");
      if (/^There are too many folders or Notes to judge this safely/.test(msg)) return t("There are too many folders or Notes to judge this safely. Nothing was changed.");
      if (msg === "Placement does not exist.") return t("That filing could not be found — please refresh and try again.");
      return null;
    }
    /**
     * The same contract as `safeWrite()` (`{ ok, result }`), so every call
     * site below reads identically to the rest of the page -- but a refusal
     * this page KNOWS the reason for is shown in its own translated words
     * (I15: never silently, always in words) instead of the generic
     * Firestore-style fallback, which is reserved for a failure this page
     * cannot explain any better than that.
     */
    async function runFolderWrite(writeFn, context) {
      try {
        const result = await writeFn();
        return { ok: true, result };
      } catch (err) {
        const known = folderBusinessRefusal(err);
        if (known) {
          console.error("[folder refusal]", context, err);
          showPageStatus(known);
          return { ok: false };
        }
        reportWriteFailure(err, context);
        return { ok: false };
      }
    }

    const whoEl = document.getElementById("who");
    const signInBtn = document.getElementById("signInBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const appEl = document.getElementById("app");
    const navBar = document.getElementById("navBar");
    const navHomeExtra = document.getElementById("navHomeExtra");
    const tenantSelect = document.getElementById("tenantSelect");
    const personSelect = document.getElementById("personSelect");
    const readOnlyMsg = document.getElementById("readOnlyMsg");
    const pageStatusMsg = document.getElementById("pageStatusMsg");
    const viewToggle = document.getElementById("viewToggle");
    const viewFolders = document.getElementById("viewFolders");
    const viewTimeline = document.getElementById("viewTimeline");
    const viewPath = document.getElementById("viewPath");
    const viewTrash = document.getElementById("viewTrash");

    mountAccountCard({
      tenantRow: tenantSelect.closest("label"),
      personRow: personSelect.closest("label"),
      contextBar: document.getElementById("contextBar"),
      getSummary: () => {
        const m = myMemberships.find((x) => x.tenantId === activeTenantId);
        return { name: personSelect.selectedOptions[0]?.textContent, email: auth.currentUser?.email, tenantName: m?.tenantName, roles: m ? roleListLabel(m.roles) : "" };
      },
    });

    function escapeHtml(s) {
      return (s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderNav(roles, viewAsRole) {
      navBar.innerHTML = renderNavBar(roles, viewAsRole);
      navHomeExtra.innerHTML = renderHomeExtras(roles);
      mountSyncedAppLangControl(navHomeExtra, { db, uid: auth.currentUser?.uid });
      mountCardLookControl(navHomeExtra);
    }

    signInBtn.addEventListener("click", () => {
      signInWithPopup(auth, new GoogleAuthProvider()).catch((err) => {
        whoEl.textContent = t("Sign-in failed: {message}", { message: err.message });
      });
    });
    signOutBtn.addEventListener("click", () => signOut(auth));

    let activeTenantId = null;
    let myMemberships = [];
    let roster = [];
    let selectedPersonId = null;

    // The three views, and which one is remembered -- localStorage, per
    // viewer, a convenience only (the issue is explicit this is not data).
    const VIEW_KEY = "qr.journeyMapView";
    const VALID_VIEWS = ["folders", "timeline", "path"];
    // Issue #257 -- a caller (the dock's Mapping tab, the Note view's own
    // ⋯ menu) can now open this page pointed straight at one of the three
    // views via a plain "#folders" / "#timeline" / "#path" hash. Only that
    // exact token is read -- anything else is ignored outright, not
    // partially matched -- and the hash wins over the remembered choice
    // ONLY when it is actually present, so a bookmark or a stale tab with
    // no hash still reopens wherever the viewer left it last.
    function viewFromHash() {
      const raw = (location.hash || "").slice(1);
      return VALID_VIEWS.includes(raw) ? raw : null;
    }
    let currentView = viewFromHash()
      ?? (VALID_VIEWS.includes(localStorage.getItem(VIEW_KEY)) ? localStorage.getItem(VIEW_KEY) : "folders");

    // Loaded once per refresh, shared by all three views over the SAME data
    // (the issue's own requirement -- one toggle, not three separate pages).
    let folderTree = { roots: [], orphaned: [], cyclic: [], tooDeep: [] };
    let allNotes = [];
    // Issue #259 -- Folders became an expandable TREE (every folder shown at
    // once, not a one-folder-at-a-time drill-down), so it needs the owner's
    // WHOLE set of placements up front too, never capped at 99 per folder.
    // loadAllOwnerNotesSharded()/loadAllOwnerPlacementsSharded() page past the
    // deployed listIsBounded() cap rather than asking for a bigger limit().
    let allPlacements = [];
    let notesTruncated = false;
    let placementsTruncated = false;
    // Issue #267 -- ownerFolderTreePagedSharded() pages past the same
    // 100-folder Rules cap the single-shot folder reader alone was silently
    // capped at (see journey-map-service.js's own comment) -- the Owner's own
    // imported site has roughly 1,464 folders (issue #265), well past it.
    let foldersTruncated = false;
    // Per-folder distinct-active-Note subtree counts (issue #259's own count
    // badge), recomputed alongside the tree on every refresh -- pure, no
    // extra read (journey-map-service.js's folderNoteCounts()).
    let folderCounts = {};
    // Issue #282 (speed, part 5) -- the folder tree is drawn the moment its
    // OWN read resolves; Notes and placements (the two collections a real
    // folder tree can dwarf -- the Owner's own import: 1,083 Notes, 2,319
    // filings) load AFTER, in the background, across several parallel
    // shards. `notesAndPlacementsLoaded` is what tells a render function
    // "0" (genuinely empty) apart from "not counted yet" -- a folder count
    // badge, Timeline and Path all read it so a reader is told counts are
    // still arriving rather than shown a zero that looks final (I15's own
    // "never silently" applied to a READ, not just a write).
    let notesAndPlacementsLoaded = true;
    // A later refreshAll() (a person/tenant switch, or a second render
    // triggered while the first is still loading) must win over an earlier
    // one still in flight -- the same superseded-render guard
    // renderTimelineView()'s own timelineRenderToken already uses.
    let refreshToken = 0;
    let timelineFilter = "everything"; // "everything" | a semanticRole | a real folderId
    let expandedNoteIds = new Set();

    function myPersonIdInActiveTenant() {
      return myMemberships.find((m) => m.tenantId === activeTenantId)?.personId ?? null;
    }
    /** Only a Note's own author may write anything here (isNoteOwner() in firestore.rules) -- everyone else this screen is visible to (guardian/teacher/admin, per canReadNoteOf()) gets a read-only view of the same two views. */
    function isSelfSelected() {
      return selectedPersonId != null && selectedPersonId === myPersonIdInActiveTenant();
    }

    function renderPersonSelectOptions() {
      const prev = personSelect.value;
      personSelect.innerHTML = roster
        .filter((p) => p.status !== "archived")
        .map((p) => `<option value="${p.id}">${escapeHtml(langText(p.name, getAppLang(), p.id))}</option>`)
        .join("");
      const stored = getSelectedPersonId();
      const myPersonId = myPersonIdInActiveTenant();
      const candidate = roster.some((p) => p.id === prev) ? prev
        : (roster.some((p) => p.id === stored) ? stored
        : (roster.some((p) => p.id === myPersonId) ? myPersonId : (roster[0]?.id ?? null)));
      if (candidate) personSelect.value = candidate;
    }

    async function loadContextData() {
      const rosterSnap = await getDocs(query(collection(db, TENANT.TENANT_PEOPLE), where("tenantId", "==", activeTenantId)));
      roster = rosterSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderNav(myMemberships.find((m) => m.tenantId === activeTenantId)?.roles ?? [], null);
      renderPersonSelectOptions();
      selectedPersonId = personSelect.value || null;
      await refreshAll();
    }

    personSelect.addEventListener("change", async () => {
      selectedPersonId = personSelect.value;
      setSelectedPersonId(selectedPersonId);
      await refreshAll();
    });

    tenantSelect.addEventListener("change", async () => {
      const chosen = myMemberships.find((m) => m.tenantId === tenantSelect.value);
      if (!chosen) return;
      activeTenantId = chosen.tenantId;
      setActiveContext({ tenantId: chosen.tenantId, personId: chosen.personId, roles: chosen.roles, viewAsRole: null });
      renderNav(chosen.roles, null);
      await loadContextData();
    });

    // -------------------------------------------------------------------
    // The toggle itself
    // -------------------------------------------------------------------
    function renderToggle() {
      viewToggle.querySelectorAll(".view-toggle-btn").forEach((btn) => {
        btn.setAttribute("aria-pressed", String(btn.dataset.view === currentView));
      });
      viewFolders.style.display = currentView === "folders" ? "block" : "none";
      viewTimeline.style.display = currentView === "timeline" ? "block" : "none";
      viewPath.style.display = currentView === "path" ? "block" : "none";
      viewTrash.style.display = currentView === "trash" ? "block" : "none";
    }
    viewToggle.querySelectorAll(".view-toggle-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentView = btn.dataset.view;
        try { localStorage.setItem(VIEW_KEY, currentView); } catch { /* private browsing -- the choice just doesn't stick */ }
        renderToggle();
        renderCurrentView();
      });
    });

    function showPageStatus(msg) {
      pageStatusMsg.textContent = msg;
      pageStatusMsg.style.display = "block";
    }
    function renderReadOnlyBanner() {
      if (isSelfSelected()) { readOnlyMsg.style.display = "none"; return; }
      readOnlyMsg.style.display = "block";
      const name = roster.find((p) => p.id === selectedPersonId);
      const shownName = name ? langText(name.name, getAppLang(), name.id) : selectedPersonId;
      readOnlyMsg.textContent = t("You're viewing {name}'s Journey. Only {name} can create folders or file Notes here — you can only read it.", { name: shownName });
    }

    // -------------------------------------------------------------------
    // Loading -- ONE read of the folder tree, ONE (paged) read of every Note
    // and ONE (paged) read of every placement, shared across all three views
    // (never three separate loads for three separate screens). The tree is
    // stateless across a refresh: expandedFolderIds is keyed by folderId (or
    // by semanticRole for the two system folders, so a virtual folder
    // becoming real does not reset its own expand state -- see
    // expandKeyFor()), never by object identity, so nothing here needs to
    // "resolve stale nodes" the way the old drill-down path once did.
    // -------------------------------------------------------------------
    async function refreshAll() {
      renderReadOnlyBanner();
      const myRefresh = ++refreshToken;
      if (!activeTenantId || !selectedPersonId) {
        folderTree = { roots: [], orphaned: [], cyclic: [], tooDeep: [] };
        allNotes = []; allPlacements = []; folderCounts = {};
        notesAndPlacementsLoaded = true;
        renderCurrentView();
        return;
      }
      notesAndPlacementsLoaded = false;
      // Cleared, not left stale: a person/tenant switch must never show the
      // PREVIOUS person's Note counts under the new person's folder names
      // while the new load is still in flight.
      allNotes = []; allPlacements = []; folderCounts = {};
      notesTruncated = false; placementsTruncated = false;
      // Notes and placements start loading NOW, in the background, across
      // several parallel shards each (journey-map-service.js) -- but nothing
      // here awaits them yet. The Owner's real numbers (issue #282): the
      // folder tree alone is what "usable" means for this screen, and it is
      // now the ONLY thing between a person opening this page and seeing
      // their own folders on screen.
      const notesAndPlacementsPromise = Promise.all([
        loadAllOwnerNotesSharded(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId }),
        loadAllOwnerPlacementsSharded(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId }),
      ]);

      const tree = await ownerFolderTreePagedSharded(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId });
      if (myRefresh !== refreshToken) return; // superseded by a later refresh already
      folderTree = tree;
      foldersTruncated = tree.truncated;
      // The tree is drawn HERE, before a single Note or placement has
      // arrived -- every folder count badge and the Timeline/Path views
      // read notesAndPlacementsLoaded and say so in words rather than
      // showing a zero that would look like a final, counted answer.
      renderCurrentView();

      const [notesPage, placementsPage] = await notesAndPlacementsPromise;
      if (myRefresh !== refreshToken) return; // superseded while notes/placements were still loading
      allNotes = notesPage.rows;
      notesTruncated = notesPage.truncated;
      allPlacements = placementsPage.rows;
      placementsTruncated = placementsPage.truncated;
      folderCounts = folderNoteCounts(rawFolderList(folderTree), allPlacements, allNotes);
      notesAndPlacementsLoaded = true;
      renderCurrentView();
    }

    /** Every real folder document behind `folderTree` (roots + orphaned + cyclic + tooDeep), flattened for folderNoteCounts() -- never the page's OWN virtual system-folder placeholders (mergedRoots()), which folderId: null would collide against inside buildFolderTree()'s own id-keyed map. */
    function rawFolderList(tree) {
      const out = [];
      (function walk(nodes) { for (const f of nodes) { out.push(f); walk(f.children ?? []); } })(tree.roots ?? []);
      out.push(...(tree.orphaned ?? []), ...(tree.cyclic ?? []), ...(tree.tooDeep ?? []));
      return out;
    }

    function renderCurrentView() {
      if (currentView === "folders") renderFoldersView();
      else if (currentView === "timeline") renderTimelineView();
      else if (currentView === "trash") renderTrashView();
      else renderPathView();
    }

    // -------------------------------------------------------------------
    // Shared: one Note row, used identically by all three views. Clicking
    // the head toggles a read-only, sanitized preview of the body -- opening
    // a Note in place rather than navigating away, since this screen's job
    // is browsing/organising, not editing (editing a permanent Note is
    // notes.html's job, scoped to the Study Unit it was written about).
    // -------------------------------------------------------------------
    function noteCardHtml(note, { fileControl = false, extraHead = "" } = {}) {
      const retired = note.status === NOTE_STATUS.RETIRED;
      const title = note.title?.trim() || t("(untitled)");
      const open = expandedNoteIds.has(note.noteId);
      return `<div class="note-card" data-note-id="${escapeHtml(note.noteId)}">
        <div class="note-card-head" data-note-toggle>
          <span class="note-card-title">${escapeHtml(title)}</span>
          <span class="note-card-meta">${when(displayTimestamp(note))}</span>
          ${extraHead}
        </div>
        <div class="note-body-preview${open ? " open" : ""}" data-note-body></div>
        <div class="note-actions" data-note-actions style="${open ? "" : "display:none"}">
          ${fileControl && isSelfSelected() ? `<button type="button" class="secondary tiny" data-note-file>${t("File in a folder…")}</button>` : ""}
        </div>
      </div>`;
    }
    // Issue #265 -- a WordPress-imported Note carries its REAL original date
    // (`originalCreatedAt`) alongside `updatedAt`, which for an imported Note
    // is only ever "when this import ran". Every place this screen shows or
    // sorts by a Note's date now prefers the original one when it is
    // present, and falls back to `updatedAt` for every Note this app itself
    // wrote (which never carries `originalCreatedAt` at all).
    function displayTimestamp(note) {
      return note?.originalCreatedAt ?? note?.updatedAt;
    }
    function when(ts) {
      const d = ts?.toDate ? ts.toDate() : null;
      return d ? d.toLocaleString() : "";
    }
    function wireNoteCards(container, notes) {
      container.querySelectorAll("[data-note-id]").forEach((card) => {
        const noteId = card.dataset.noteId;
        const note = notes.find((n) => n.noteId === noteId);
        if (!note) return;
        card.querySelector("[data-note-toggle]").addEventListener("click", () => {
          if (expandedNoteIds.has(noteId)) expandedNoteIds.delete(noteId); else expandedNoteIds.add(noteId);
          card.querySelector("[data-note-body]").classList.toggle("open");
          card.querySelector("[data-note-actions]").style.display = expandedNoteIds.has(noteId) ? "" : "none";
          if (expandedNoteIds.has(noteId)) card.querySelector("[data-note-body]").innerHTML = sanitizeNoteHtml(note.bodyHtml || "");
        });
        if (expandedNoteIds.has(noteId)) card.querySelector("[data-note-body]").innerHTML = sanitizeNoteHtml(note.bodyHtml || "");
        card.querySelector("[data-note-file]")?.addEventListener("click", () => openFileDialog(note));
      });
    }

    /** Creates the real folder document for a still-virtual system role, once, the first time a write genuinely needs it to exist. */
    async function ensureRealFolder(node) {
      if (node.folderId) return node.folderId;
      const outcome = await safeWrite(
        () => createNoteFolder(db, {
          tenantId: activeTenantId, ownerPersonId: selectedPersonId, ownerUid: auth.currentUser.uid,
          name: SYSTEM_ROLE_LABEL[node.semanticRole](), semanticRole: node.semanticRole,
          order: SYSTEM_FOLDER_ROLES.indexOf(node.semanticRole), actorUid: auth.currentUser.uid,
        }),
        { collection: TENANT.NOTE_FOLDERS, action: "createNoteFolder(system)" }
      );
      return outcome.ok ? outcome.result : null;
    }

    async function fileNoteInFolder(note, targetNode) {
      const folderId = await ensureRealFolder(targetNode);
      if (!folderId) return;
      // P6-G fix (issue #234) -- a fresh read of THIS folder's own current
      // placements, not the caller's (possibly stale, possibly for a
      // different folder entirely -- openFileDialog() can target any
      // folder, not just the one currently open). createNotePlacement()
      // defaults order: 0, and every filing landed there until this fix.
      const { rows: existingPlacements } = await folderContents(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId });
      const order = nextOrder(existingPlacements.map((r) => r.placement));
      const outcome = await safeWrite(
        () => createNotePlacement(db, {
          tenantId: activeTenantId, ownerPersonId: selectedPersonId, ownerUid: auth.currentUser.uid,
          noteId: note.noteId, folderId, order, actorUid: auth.currentUser.uid,
        }),
        { collection: TENANT.NOTE_PLACEMENTS, action: "createNotePlacement" }
      );
      if (!outcome.ok) return;
      showPageStatus(t('"{title}" filed in {folder}.', { title: note.title?.trim() || t("(untitled)"), folder: folderDisplayName(targetNode) }));
      await refreshAll();
    }

    function openFileDialog(note) {
      const flat = flattenFolders(mergedRoots());
      const options = flat.map(({ folder, depth }) =>
        `<option value="${escapeHtml(folder.folderId ?? folder.semanticRole)}">${"— ".repeat(depth)}${escapeHtml(folderDisplayName(folder))}</option>`).join("");
      const choice = prompt(
        t('File "{title}" in which folder? Type the exact name shown, or cancel.', { title: note.title?.trim() || t("(untitled)") })
        + "\n" + flat.map(({ folder, depth }) => `${"— ".repeat(depth)}${folderDisplayName(folder)}`).join("\n")
      );
      if (!choice) return;
      const match = flat.find(({ folder }) => folderDisplayName(folder).trim().toLowerCase() === choice.trim().toLowerCase());
      if (!match) { showPageStatus(t("No folder matched that name — nothing filed.")); return; }
      fileNoteInFolder(note, match.folder);
    }

    // =====================================================================
    // OPTION A -- Folders: an expandable TREE (issue #259), replacing the
    // former one-folder-at-a-time drill-down/breadcrumb. Loosely modelled
    // on the Owner's OWN Siyagah app's "My Notebooks" folder dialog, a
    // design reference only -- Siyagah's own implementation keeps one whole
    // notebook in memory, has real delete, and has no owner checks; none of
    // that carries over here.
    // =====================================================================

    // Per-device state, wrapped in try/catch (private browsing): which
    // folders are expanded, whether derived numbering is shown, and the
    // tree's own text-size step. None of this is data (the issue is
    // explicit) and none of it is synced.
    const EXPANDED_KEY = "qr.journeyMapExpanded";
    const SHOW_NUMBERS_KEY = "qr.journeyMapShowNumbers";
    const TEXT_SIZE_KEY = "qr.journeyMapTreeTextSize";
    const TEXT_SIZE_SCALES = [0.82, 0.88, 0.94, 1.0, 1.08, 1.16];
    const TEXT_SIZE_DEFAULT_INDEX = 2; // 0.94rem -- the tree's own pre-existing row size

    function loadExpandedIds() {
      try { return new Set(JSON.parse(localStorage.getItem(EXPANDED_KEY) || "[]")); }
      catch { return new Set(); }
    }
    let expandedFolderIds = loadExpandedIds();
    function saveExpandedIds() {
      try { localStorage.setItem(EXPANDED_KEY, JSON.stringify([...expandedFolderIds])); }
      catch { /* private browsing -- expand state just doesn't stick */ }
    }
    function loadShowNumbers() {
      try { const v = localStorage.getItem(SHOW_NUMBERS_KEY); return v === null ? true : v === "1"; }
      catch { return true; }
    }
    let showNumbers = loadShowNumbers();
    function saveShowNumbers() {
      try { localStorage.setItem(SHOW_NUMBERS_KEY, showNumbers ? "1" : "0"); } catch { /* private browsing */ }
    }
    function loadTreeTextSizeIndex() {
      try {
        const v = Number(localStorage.getItem(TEXT_SIZE_KEY));
        return Number.isInteger(v) && v >= 0 && v < TEXT_SIZE_SCALES.length ? v : TEXT_SIZE_DEFAULT_INDEX;
      } catch { return TEXT_SIZE_DEFAULT_INDEX; }
    }
    let treeTextSizeIndex = loadTreeTextSizeIndex();
    function saveTreeTextSizeIndex() {
      try { localStorage.setItem(TEXT_SIZE_KEY, String(treeTextSizeIndex)); } catch { /* private browsing */ }
    }

    // Transient, session-only, never persisted: the 📍 target for
    // "+ New folder", the search box's own query, which folder's Remove
    // confirmation (or inline rename) is open, and which folder is
    // mid-drag.
    let newFolderTargetNode = null; // null = top level
    let folderSearchQuery = "";
    let inlineRenameKey = null;
    let dragFolderKey = null;

    /** Stable across a virtual system folder becoming real (folderId: null -> a real id): the two system folders key on their own semanticRole, every other folder on its own folderId. Used for expand state, the 📍 pin and the drag preview, none of which may reset just because ensureRealFolder() ran. */
    function expandKeyFor(node) {
      return isSystemFolderRole(node.semanticRole) ? `role:${node.semanticRole}` : node.folderId;
    }
    function toggleExpanded(node) {
      const key = expandKeyFor(node);
      if (expandedFolderIds.has(key)) expandedFolderIds.delete(key); else expandedFolderIds.add(key);
      saveExpandedIds();
      renderFoldersView();
    }
    function isPinnedTarget(f) {
      return newFolderTargetNode != null && expandKeyFor(f) === expandKeyFor(newFolderTargetNode);
    }
    function numberedLabel(f, numberPath) {
      const name = folderDisplayName(f);
      return showNumbers && numberPath ? `(${numberPath}) ${name}` : name;
    }
    function findNodeByIdOrRole(nodes, folderId, role) {
      for (const f of nodes) {
        if (folderId ? f.folderId === folderId : (!f.folderId && f.semanticRole === role)) return f;
        const child = findNodeByIdOrRole(f.children ?? [], folderId, role);
        if (child) return child;
      }
      return null;
    }
    function findNodeByExpandKey(nodes, key) {
      for (const f of nodes) {
        if (expandKeyFor(f) === key) return f;
        const child = findNodeByExpandKey(f.children ?? [], key);
        if (child) return child;
      }
      return null;
    }
    /** The sibling set a folder reorders/drags within: its parent's own children (sorted), or the user-folder roots at the top level. System folders never take part (ADR-010 §3: neither renameable, moveable, reorderable nor removable). */
    function siblingsOf(node) {
      const parentId = node.parentFolderId ?? null;
      if (parentId === null) return mergedRoots().filter((f) => !isSystemFolderRole(f.semanticRole));
      const parent = findNodeByIdOrRole(mergedRoots(), parentId, null);
      return (parent?.children ?? []).slice().sort(byOrder);
    }
    function folderAncestorPath(folderId) {
      const chain = [];
      let cursor = folderId ? findNodeByIdOrRole(mergedRoots(), folderId, null) : null;
      while (cursor) {
        chain.unshift(cursor);
        cursor = cursor.parentFolderId ? findNodeByIdOrRole(mergedRoots(), cursor.parentFolderId, null) : null;
      }
      return chain;
    }
    /** One real folder's own filed Notes, in the author's order, resolved from the already fully-loaded allPlacements/allNotes -- no per-folder read (the whole point of paging everything up front once is that opening a tenth folder costs nothing more). Mirrors folderContents()'s own two exclusions so a reader sees the identical set either way: an inactive placement, or a placement naming a retired/missing Note. */
    function notesInFolder(node) {
      if (!node.folderId) return [];
      const notesById = new Map(allNotes.map((n) => [n.noteId, n]));
      return allPlacements
        .filter((p) => p.folderId === node.folderId && p.status === NOTE_STATUS.ACTIVE)
        .map((placement) => ({ placement, note: notesById.get(placement.noteId) ?? null }))
        .filter((row) => row.note !== null && row.note.status === NOTE_STATUS.ACTIVE)
        .sort((a, b) => (a.placement.order ?? 0) - (b.placement.order ?? 0));
    }

    function renderFoldersView() {
      const roots = mergedRoots();
      let html = "";
      // NOTHING IS SILENTLY DROPPED (buildFolderTree()'s own rule, carried
      // into this screen): an orphaned, cyclic or too-deep folder is named
      // rather than simply missing from the list, even though a fresh build
      // should never actually produce one through this screen's own writes.
      const problems = [...folderTree.orphaned, ...folderTree.cyclic, ...folderTree.tooDeep];
      if (problems.length) {
        html += `<p class="warn">${escapeHtml(t("{count} folder(s) could not be shown safely and are not listed below — this needs administrator attention.", { count: problems.length }))}</p>`;
      }
      if (notesTruncated || placementsTruncated || foldersTruncated) {
        html += `<p id="truncatedMsg">${escapeHtml(t("Showing a large first batch only — there is more than could be loaded at once."))}</p>`;
      }
      // Issue #282 -- the tree above this line is drawn from a real, complete
      // read; only the COUNT BADGES beside each folder (folderRowHtml()'s own
      // "…" below) are still arriving. Said in words rather than left to a
      // reader to notice every badge reads "…" -- and never removed by
      // simply not truncating the message once loading finishes; it clears
      // on its own the next render, same as the truncated notice above.
      if (!notesAndPlacementsLoaded) {
        html += `<p id="notesLoadingMsg" class="note">${escapeHtml(t("Counting the Notes filed in each folder…"))}</p>`;
      }
      html += folderToolbarHtml();
      const query = folderSearchQuery.trim().toLowerCase();
      if (query) {
        html += folderSearchResultsHtml(query);
      } else {
        let userIndex = 0;
        html += `<ul class="folder-tree" data-folder-tree>${roots.map((f) => {
          const numberPath = isSystemFolderRole(f.semanticRole) ? null : String(++userIndex).padStart(2, "0");
          return renderFolderSubtree(f, 0, numberPath);
        }).join("")}</ul>`;
      }
      html += folderFooterHtml();
      viewFolders.innerHTML = html;
      viewFolders.style.setProperty("--tree-scale", String(TEXT_SIZE_SCALES[treeTextSizeIndex]));
      wireFolderToolbar();
      if (query) wireFolderSearchResults(); else wireFolderTree();
      wireNewFolderForm();
    }

    /** One folder row, then (if expanded) its own child folders and the Notes filed directly in it -- a single flat, indented list rather than nested <ul>s, which keeps drag-and-drop and event delegation simple. */
    function renderFolderSubtree(f, depth, numberPath) {
      const childFolders = (f.children ?? []).slice().sort(byOrder);
      const leafRows = notesInFolder(f);
      const expandable = childFolders.length > 0 || leafRows.length > 0;
      const expanded = expandedFolderIds.has(expandKeyFor(f));
      let html = folderRowHtml(f, depth, numberPath, expandable, expanded);
      if (!expanded) return html;
      if (childFolders.length === 0 && leafRows.length === 0) {
        html += `<li class="folder-tree-item folder-tree-empty" style="margin-left:${((depth + 1) * 1.1).toFixed(2)}rem">${escapeHtml(emptyStateFor(f))}</li>`;
      } else {
        let childIndex = 0;
        for (const child of childFolders) {
          const childNumberPath = numberPath ? `${numberPath}.${String(++childIndex).padStart(2, "0")}` : String(++childIndex).padStart(2, "0");
          html += renderFolderSubtree(child, depth + 1, childNumberPath);
        }
        html += leafRows.map((row, idx) => noteLeafHtml(row, depth + 1, leafRows, idx)).join("");
      }
      if (isSelfSelected() && f.folderId && allNotes.some((n) => !leafRows.some((r) => r.note.noteId === n.noteId))) {
        html += `<li class="folder-tree-item folder-tree-file-btn" data-file-into-folder="${escapeHtml(f.folderId)}" style="margin-left:${((depth + 1) * 1.1).toFixed(2)}rem">
          <button type="button" class="secondary tiny" data-folder-file-note>${t("+ File a Note here…")}</button>
        </li>`;
      }
      return html;
    }

    /**
     * ONE row of the tree -- issue #259's own required control set: ▶/▾
     * expand, the derived (never STORED) number, a count badge (hidden at
     * zero), and -- for the folder's own author only -- a single ⋯ menu
     * folding 📍/✏️/▲/▼/Move to…/🗑, plus an inline rename input when
     * `inlineRenameKey` names this row. A system folder (ADR-010 §3) gets
     * none of the editing controls, the same rule this file already
     * enforced under the old drill-down.
     *
     * A DELIBERATE SIMPLIFICATION FROM THE OWNER'S OWN SIYAGAH REFERENCE,
     * stated rather than silently built as if it were the whole spec:
     * Siyagah shows these as separate icons above ~900px and folds them into
     * one ⋯ menu only below it. This round folds them into ONE menu at
     * EVERY width -- the concretely testable requirement (a hit-testable
     * menu below 900px, the exact defect class Siyagah's own bug was) is met
     * either way, and a second, wider desktop icon row is not built.
     */
    function folderRowHtml(f, depth, numberPath, expandable, expanded) {
      const key = expandKeyFor(f);
      const editable = isSelfSelected() && !isSystemFolderRole(f.semanticRole);
      const count = f.folderId ? (folderCounts[f.folderId] ?? 0) : 0;
      const toggle = expandable
        ? `<button type="button" class="folder-toggle" data-folder-toggle aria-expanded="${expanded}" aria-label="${expanded ? escapeHtml(t("Collapse")) : escapeHtml(t("Expand"))}">${expanded ? "▾" : "▶"}</button>`
        : `<span class="folder-toggle folder-toggle-leaf" aria-hidden="true">▶</span>`;
      // Issue #282 -- "…" while Notes/placements are still loading, NEVER a
      // bare "0": a real folder's count is provisional until it is loaded,
      // and a reader must not read a provisional zero as a final, counted
      // answer (a real folder here could turn out to hold hundreds).
      const badge = !notesAndPlacementsLoaded
        ? `<span class="folder-row-count" data-folder-count-loading>…</span>`
        : (count > 0 ? `<span class="folder-row-count">${count}</span>` : "");
      const pin = isPinnedTarget(f) ? `<span class="folder-pin-flag" title="${escapeHtml(t("New folders go here"))}">📍</span>` : "";
      const nameHtml = inlineRenameKey === key
        ? `<input type="text" class="folder-rename-input" data-folder-rename-input value="${escapeHtml(f.name ?? "")}" aria-label="${escapeHtml(t("Rename this folder"))}" />`
        : `<span class="folder-row-name" data-folder-name>${escapeHtml(numberedLabel(f, numberPath))}</span>`;
      let menu = "";
      if (editable && inlineRenameKey !== key) {
        const siblings = siblingsOf(f);
        const idx = siblings.findIndex((s) => s.folderId === f.folderId);
        const upDisabled = idx <= 0;
        const downDisabled = idx === -1 || idx >= siblings.length - 1;
        const menuId = `folderMenu-${escapeHtml(f.folderId)}`;
        menu = `
          <span class="bar-palette-wrap folder-menu-wrap" data-bar-palette-wrap="${menuId}">
            <button type="button" class="folder-menu-btn bar-palette-toggle" data-bar-palette-toggle="${menuId}" aria-haspopup="true" aria-expanded="false" title="${escapeHtml(t("More"))}" aria-label="${escapeHtml(t("More"))}">⋯</button>
            <div class="bar-palette folder-row-menu" data-bar-palette="${menuId}">
              <button type="button" class="secondary tiny" data-folder-pin>📍 ${t("New folders go here")}</button>
              <button type="button" class="secondary tiny" data-folder-rename>✏️ ${t("Rename")}</button>
              <button type="button" class="secondary tiny" data-folder-up ${upDisabled ? "disabled" : ""} aria-label="${escapeHtml(t("Move up"))}">▲ ${t("Move up")}</button>
              <button type="button" class="secondary tiny" data-folder-down ${downDisabled ? "disabled" : ""} aria-label="${escapeHtml(t("Move down"))}">▼ ${t("Move down")}</button>
              <button type="button" class="secondary tiny" data-folder-copy>${t("Copy to…")}</button>
              <button type="button" class="secondary tiny" data-folder-move>${t("Move to…")}</button>
              <button type="button" class="danger tiny" data-folder-delete>🗑 ${t("Delete")}</button>
            </div>
          </span>`;
      }
      const draggableAttr = editable ? ' draggable="true"' : "";
      return `<li class="folder-tree-item" data-depth="${depth}">
        <div class="folder-row${isSystemFolderRole(f.semanticRole) ? " system" : ""}" style="margin-left:${(depth * 1.1).toFixed(2)}rem"
             data-folder-role="${escapeHtml(f.semanticRole)}" data-folder-id="${escapeHtml(f.folderId ?? "")}"${draggableAttr}>
          ${toggle}${nameHtml}${badge}${pin}${menu}
        </div>
      </li>`;
    }

    /** A Note filed directly in an OPEN folder, as a leaf of the tree -- the same shared note-card/preview toggle every view uses (wireNoteCards() is reused for it), plus its own ▲▼/Move to… when the owner is looking at their own tree. A Note filed in two folders appears under both, independently (ADR-010 §5). */
    function noteLeafHtml(row, depth, siblingRows, idx) {
      const { note, placement } = row;
      const title = note.title?.trim() || t("(untitled)");
      const controls = isSelfSelected() ? `
          <button type="button" class="secondary tiny note-order-btn" data-note-up ${idx <= 0 ? "disabled" : ""} aria-label="${escapeHtml(t("Move up"))}">▲</button>
          <button type="button" class="secondary tiny note-order-btn" data-note-down ${idx >= siblingRows.length - 1 ? "disabled" : ""} aria-label="${escapeHtml(t("Move down"))}">▼</button>
          <button type="button" class="secondary tiny" data-note-copy>${t("Copy to…")}</button>
          <button type="button" class="secondary tiny" data-note-move>${t("Move to…")}</button>` : "";
      return `<li class="folder-tree-item folder-tree-note" data-note-leaf data-note-id="${escapeHtml(note.noteId)}" data-in-folder="${escapeHtml(placement.folderId)}" data-placement-id="${escapeHtml(placement.placementId)}" style="margin-left:${(depth * 1.1).toFixed(2)}rem">
        <div class="note-card">
          <div class="note-card-head" data-note-toggle>
            <span class="note-card-title">📄 ${escapeHtml(title)}</span>
            <span class="note-card-meta">${when(displayTimestamp(note))}</span>
          </div>
          <div class="note-body-preview" data-note-body></div>
          <div class="note-actions" data-note-actions style="display:none">${controls}</div>
        </div>
      </li>`;
    }

    function wireFolderTree() {
      const container = document.querySelector("[data-folder-tree]");
      if (!container) return;
      container.querySelectorAll(".folder-row").forEach((row) => {
        const folderId = row.dataset.folderId || null;
        const role = row.dataset.folderRole;
        const node = findNodeByIdOrRole(mergedRoots(), folderId, role);
        if (!node) return;
        const li = row.closest("li");

        row.querySelector("[data-folder-toggle]")?.addEventListener("click", (e) => { e.stopPropagation(); toggleExpanded(node); });
        const renameInput = row.querySelector("[data-folder-rename-input]");
        renameInput?.addEventListener("click", (e) => e.stopPropagation());
        renameInput?.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commitInlineRename(node, e.target.value); }
          else if (e.key === "Escape") { e.preventDefault(); inlineRenameKey = null; renderFoldersView(); }
        });
        renameInput?.addEventListener("blur", (e) => commitInlineRename(node, e.target.value));
        row.querySelector("[data-folder-pin]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null);
          newFolderTargetNode = isPinnedTarget(node) ? null : node;
          renderFoldersView();
        });
        row.querySelector("[data-folder-rename]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null);
          beginInlineRename(node);
        });
        row.querySelector("[data-folder-up]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null);
          const siblings = siblingsOf(node);
          reorderFolderSwap(siblings, siblings.findIndex((s) => s.folderId === node.folderId), -1);
        });
        row.querySelector("[data-folder-down]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null);
          const siblings = siblingsOf(node);
          reorderFolderSwap(siblings, siblings.findIndex((s) => s.folderId === node.folderId), 1);
        });
        row.querySelector("[data-folder-copy]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null); copyFolderTo(node);
        });
        row.querySelector("[data-folder-move]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null); moveFolderTo(node);
        });
        row.querySelector("[data-folder-delete]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null); deleteFolder(node);
        });

        // Drag a row: top 28% = before, bottom 28% = after, middle 44% =
        // inside (Siyagah's own zones). Mouse/desktop only, per the issue's
        // own scope -- a phone keeps ▲▼ and Move to… in the ⋯ menu above,
        // per Siyagah's own "touch drag did not work" finding.
        if (row.hasAttribute("draggable")) {
          row.addEventListener("dragstart", (e) => { dragFolderKey = expandKeyFor(node); e.dataTransfer.effectAllowed = "move"; });
          row.addEventListener("dragend", () => { dragFolderKey = null; clearDragIndicators(container); });
        }
        row.addEventListener("dragover", (e) => {
          if (dragFolderKey == null) return;
          e.preventDefault();
          clearDragIndicators(container);
          row.classList.add(`drag-over-${dragZoneFor(row, e.clientY)}`);
        });
        row.addEventListener("dragleave", () => row.classList.remove("drag-over-before", "drag-over-after", "drag-over-inside"));
        row.addEventListener("drop", (e) => {
          e.preventDefault();
          const zone = dragZoneFor(row, e.clientY);
          clearDragIndicators(container);
          const draggedNode = dragFolderKey ? findNodeByExpandKey(mergedRoots(), dragFolderKey) : null;
          dragFolderKey = null;
          if (draggedNode && draggedNode.folderId !== node.folderId) performFolderDrop(draggedNode, node, zone);
        });

        // Clicking the row's own name toggles it open/closed too, so the
        // whole row is a target, not just the small ▶/▾ glyph.
        row.addEventListener("click", (e) => {
          if (e.target.closest(".folder-menu-wrap, .folder-rename-input")) return;
          if (expandable(node)) toggleExpanded(node);
        });
      });

      container.querySelectorAll("[data-file-into-folder]").forEach((fileLi) => {
        const folderId = fileLi.dataset.fileIntoFolder;
        const node = findNodeByIdOrRole(mergedRoots(), folderId, null);
        fileLi.querySelector("[data-folder-file-note]")?.addEventListener("click", () => {
          if (!node) return;
          const already = notesInFolder(node);
          const candidate = allNotes.find((n) => !already.some((r) => r.note.noteId === n.noteId));
          if (candidate) fileNoteInFolder(candidate, node);
        });
      });

      wireNoteLeaves(container);
    }
    function expandable(node) {
      return (node.children ?? []).length > 0 || notesInFolder(node).length > 0;
    }
    function dragZoneFor(row, clientY) {
      const rect = row.getBoundingClientRect();
      const ratio = rect.height ? (clientY - rect.top) / rect.height : 0.5;
      if (ratio < 0.28) return "before";
      if (ratio > 0.72) return "after";
      return "inside";
    }
    function clearDragIndicators(container) {
      container.querySelectorAll(".drag-over-before, .drag-over-after, .drag-over-inside")
        .forEach((el) => el.classList.remove("drag-over-before", "drag-over-after", "drag-over-inside"));
    }

    /**
     * A drag-and-drop move, previewed against `folderMoveRefusal()` -- the
     * service's own thin forward to the contract's `folderTreeRefusal()` --
     * before ever attempting a write, and said in words if refused (a
     * self-drop, a drop into the dragged folder's own subtree, or anything
     * past MAX_FOLDER_DEPTH). "inside" re-parents onto the target; "before"/
     * "after" position the dragged folder among the target's own siblings.
     */
    async function performFolderDrop(draggedNode, targetNode, zone) {
      const newParentId = zone === "inside" ? targetNode.folderId : (targetNode.parentFolderId ?? null);
      const changingParent = (draggedNode.parentFolderId ?? null) !== newParentId;
      if (changingParent) {
        const folders = new Map(rawFolderList(folderTree).map((f) => [f.folderId, f]));
        const refusal = folderMoveRefusal({ folders, tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: draggedNode.folderId, parentFolderId: newParentId });
        if (refusal) { showPageStatus(FOLDER_PARENT_REFUSAL_MESSAGES[refusal]?.() ?? t("That move was refused.")); return; }
        const outcome = await runFolderWrite(
          () => moveFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: draggedNode.folderId, parentFolderId: newParentId, actorUid: auth.currentUser.uid }),
          { collection: TENANT.NOTE_FOLDERS, action: "moveFolder" }
        );
        if (!outcome.ok) return;
        await refreshAll(); // siblingsOf(targetNode) below must see the dragged folder among its NEW siblings
      }
      if (zone !== "inside") {
        const siblings = siblingsOf(targetNode);
        const fromIndex = siblings.findIndex((s) => s.folderId === draggedNode.folderId);
        const targetIdx = siblings.findIndex((s) => s.folderId === targetNode.folderId);
        if (fromIndex !== -1 && targetIdx !== -1) {
          const toIndex = zone === "before" ? (fromIndex < targetIdx ? targetIdx - 1 : targetIdx) : (fromIndex < targetIdx ? targetIdx : targetIdx + 1);
          const writes = planMove(siblings.map((f) => ({ id: f.folderId, order: f.order ?? 0 })), fromIndex, toIndex);
          for (const write of writes) {
            const outcome = await runFolderWrite(
              () => reorderFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: write.id, order: write.order, actorUid: auth.currentUser.uid }),
              { collection: TENANT.NOTE_FOLDERS, action: "reorderFolder" }
            );
            if (!outcome.ok) return;
          }
        }
      }
      showPageStatus(t('"{name}" moved.', { name: folderDisplayName(draggedNode) }));
      await refreshAll();
    }

    /**
     * Same discipline as `planReorder()` above (renumber by DISPLAY
     * POSITION, write only what changed) generalised to an arbitrary target
     * index -- `planReorder()` itself only ever swaps two ADJACENT positions
     * (▲/▼), and a drag can land a folder anywhere in the list, not just one
     * step away.
     */
    function planMove(siblings, fromIndex, toIndex) {
      if (fromIndex === toIndex || !siblings[fromIndex]) return [];
      const sequence = siblings.slice();
      const [moved] = sequence.splice(fromIndex, 1);
      sequence.splice(Math.max(0, Math.min(toIndex, sequence.length)), 0, moved);
      return sequence
        .map((item, order) => ({ id: item.id, order, prevOrder: item.order ?? 0 }))
        .filter((w) => w.order !== w.prevOrder)
        .map(({ id, order }) => ({ id, order }));
    }

    function wireNoteLeaves(container) {
      wireNoteCards(container, allNotes);
      if (!isSelfSelected()) return;
      container.querySelectorAll("[data-note-leaf]").forEach((li) => {
        const placementId = li.dataset.placementId;
        const noteId = li.dataset.noteId;
        const placement = allPlacements.find((p) => p.placementId === placementId);
        const note = allNotes.find((n) => n.noteId === noteId);
        const folderNode = placement ? findNodeByIdOrRole(mergedRoots(), placement.folderId, null) : null;
        if (!placement || !note || !folderNode) return;
        const rows = notesInFolder(folderNode);
        const idx = rows.findIndex((r) => r.placement.placementId === placementId);
        li.querySelector("[data-note-up]")?.addEventListener("click", () => reorderNoteInFolder(rows, idx, -1));
        li.querySelector("[data-note-down]")?.addEventListener("click", () => reorderNoteInFolder(rows, idx, 1));
        li.querySelector("[data-note-copy]")?.addEventListener("click", () => copyNoteTo(note, folderNode));
        li.querySelector("[data-note-move]")?.addEventListener("click", () => moveNoteTo(note, folderNode));
      });
    }
