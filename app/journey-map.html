    function showPageStatus(msg) {
      pageStatusMsg.textContent = msg;
      pageStatusMsg.style.display = "block";
    }
    function renderReadOnlyBanner() {
      if (isSelfSelected()) { readOnlyMsg.style.display = "none"; return; }
      readOnlyMsg.style.display = "block";
      const name = roster.find((p) => p.id === selectedPersonId);
      const shownName = name ? langText(name.name, getAppLang(), name.id) : selectedPersonId;
      readOnlyMsg.textContent = t("You're viewing {name}'s Journey. Only {name} can create folders or file Notes here — you can only read it.", { name: shownName });
    }

    // -------------------------------------------------------------------
    // Loading -- ONE read of the folder tree, ONE (paged) read of every Note
    // and ONE (paged) read of every placement, shared across all three views
    // (never three separate loads for three separate screens). The tree is
    // stateless across a refresh: expandedFolderIds is keyed by folderId (or
    // by semanticRole for the two system folders, so a virtual folder
    // becoming real does not reset its own expand state -- see
    // expandKeyFor()), never by object identity, so nothing here needs to
    // "resolve stale nodes" the way the old drill-down path once did.
    // -------------------------------------------------------------------
    async function refreshAll() {
      renderReadOnlyBanner();
      if (!activeTenantId || !selectedPersonId) {
        folderTree = { roots: [], orphaned: [], cyclic: [], tooDeep: [] };
        allNotes = []; allPlacements = []; folderCounts = {};
        renderCurrentView();
        return;
      }
      const [tree, notesPage, placementsPage] = await Promise.all([
        ownerFolderTreePaged(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId }),
        loadAllOwnerNotes(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId }),
        loadAllOwnerPlacements(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId }),
      ]);
      folderTree = tree;
      foldersTruncated = tree.truncated;
      allNotes = notesPage.rows;
      notesTruncated = notesPage.truncated;
      allPlacements = placementsPage.rows;
      placementsTruncated = placementsPage.truncated;
      folderCounts = folderNoteCounts(rawFolderList(folderTree), allPlacements, allNotes);
      renderCurrentView();
    }

    /** Every real folder document behind `folderTree` (roots + orphaned + cyclic + tooDeep), flattened for folderNoteCounts() -- never the page's OWN virtual system-folder placeholders (mergedRoots()), which folderId: null would collide against inside buildFolderTree()'s own id-keyed map. */
    function rawFolderList(tree) {
      const out = [];
      (function walk(nodes) { for (const f of nodes) { out.push(f); walk(f.children ?? []); } })(tree.roots ?? []);
      out.push(...(tree.orphaned ?? []), ...(tree.cyclic ?? []), ...(tree.tooDeep ?? []));
      return out;
    }

    function renderCurrentView() {
      if (currentView === "folders") renderFoldersView();
      else if (currentView === "timeline") renderTimelineView();
      else renderPathView();
    }

    // -------------------------------------------------------------------
    // Shared: one Note row, used identically by all three views. Clicking
    // the head toggles a read-only, sanitized preview of the body -- opening
    // a Note in place rather than navigating away, since this screen's job
    // is browsing/organising, not editing (editing a permanent Note is
    // notes.html's job, scoped to the Study Unit it was written about).
    // -------------------------------------------------------------------
    function noteCardHtml(note, { fileControl = false, extraHead = "" } = {}) {
      const retired = note.status === NOTE_STATUS.RETIRED;
      const title = note.title?.trim() || t("(untitled)");
      const open = expandedNoteIds.has(note.noteId);
      return `<div class="note-card" data-note-id="${escapeHtml(note.noteId)}">
        <div class="note-card-head" data-note-toggle>
          <span class="note-card-title">${escapeHtml(title)}</span>
          <span class="note-card-meta">${when(displayTimestamp(note))}</span>
          ${extraHead}
        </div>
        <div class="note-body-preview${open ? " open" : ""}" data-note-body></div>
        <div class="note-actions" data-note-actions style="${open ? "" : "display:none"}">
          ${fileControl && isSelfSelected() ? `<button type="button" class="secondary tiny" data-note-file>${t("File in a folder…")}</button>` : ""}
        </div>
      </div>`;
    }
    // Issue #265 -- a WordPress-imported Note carries its REAL original date
    // (`originalCreatedAt`) alongside `updatedAt`, which for an imported Note
    // is only ever "when this import ran". Every place this screen shows or
    // sorts by a Note's date now prefers the original one when it is
    // present, and falls back to `updatedAt` for every Note this app itself
    // wrote (which never carries `originalCreatedAt` at all).
    function displayTimestamp(note) {
      return note?.originalCreatedAt ?? note?.updatedAt;
    }
    function when(ts) {
      const d = ts?.toDate ? ts.toDate() : null;
      return d ? d.toLocaleString() : "";
    }
    function wireNoteCards(container, notes) {
      container.querySelectorAll("[data-note-id]").forEach((card) => {
        const noteId = card.dataset.noteId;
        const note = notes.find((n) => n.noteId === noteId);
        if (!note) return;
        card.querySelector("[data-note-toggle]").addEventListener("click", () => {
          if (expandedNoteIds.has(noteId)) expandedNoteIds.delete(noteId); else expandedNoteIds.add(noteId);
          card.querySelector("[data-note-body]").classList.toggle("open");
          card.querySelector("[data-note-actions]").style.display = expandedNoteIds.has(noteId) ? "" : "none";
          if (expandedNoteIds.has(noteId)) card.querySelector("[data-note-body]").innerHTML = sanitizeNoteHtml(note.bodyHtml || "");
        });
        if (expandedNoteIds.has(noteId)) card.querySelector("[data-note-body]").innerHTML = sanitizeNoteHtml(note.bodyHtml || "");
        card.querySelector("[data-note-file]")?.addEventListener("click", () => openFileDialog(note));
      });
    }

    /** Creates the real folder document for a still-virtual system role, once, the first time a write genuinely needs it to exist. */
    async function ensureRealFolder(node) {
      if (node.folderId) return node.folderId;
      const outcome = await safeWrite(
        () => createNoteFolder(db, {
          tenantId: activeTenantId, ownerPersonId: selectedPersonId, ownerUid: auth.currentUser.uid,
          name: SYSTEM_ROLE_LABEL[node.semanticRole](), semanticRole: node.semanticRole,
          order: SYSTEM_FOLDER_ROLES.indexOf(node.semanticRole), actorUid: auth.currentUser.uid,
        }),
        { collection: TENANT.NOTE_FOLDERS, action: "createNoteFolder(system)" }
      );
      return outcome.ok ? outcome.result : null;
    }

    async function fileNoteInFolder(note, targetNode) {
      const folderId = await ensureRealFolder(targetNode);
      if (!folderId) return;
      // P6-G fix (issue #234) -- a fresh read of THIS folder's own current
      // placements, not the caller's (possibly stale, possibly for a
      // different folder entirely -- openFileDialog() can target any
      // folder, not just the one currently open). createNotePlacement()
      // defaults order: 0, and every filing landed there until this fix.
      const { rows: existingPlacements } = await folderContents(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId });
      const order = nextOrder(existingPlacements.map((r) => r.placement));
      const outcome = await safeWrite(
        () => createNotePlacement(db, {
          tenantId: activeTenantId, ownerPersonId: selectedPersonId, ownerUid: auth.currentUser.uid,
          noteId: note.noteId, folderId, order, actorUid: auth.currentUser.uid,
        }),
        { collection: TENANT.NOTE_PLACEMENTS, action: "createNotePlacement" }
      );
      if (!outcome.ok) return;
      showPageStatus(t('"{title}" filed in {folder}.', { title: note.title?.trim() || t("(untitled)"), folder: folderDisplayName(targetNode) }));
      await refreshAll();
    }

    function openFileDialog(note) {
      const flat = flattenFolders(mergedRoots());
      const options = flat.map(({ folder, depth }) =>
        `<option value="${escapeHtml(folder.folderId ?? folder.semanticRole)}">${"— ".repeat(depth)}${escapeHtml(folderDisplayName(folder))}</option>`).join("");
      const choice = prompt(
        t('File "{title}" in which folder? Type the exact name shown, or cancel.', { title: note.title?.trim() || t("(untitled)") })
        + "\n" + flat.map(({ folder, depth }) => `${"— ".repeat(depth)}${folderDisplayName(folder)}`).join("\n")
      );
      if (!choice) return;
      const match = flat.find(({ folder }) => folderDisplayName(folder).trim().toLowerCase() === choice.trim().toLowerCase());
      if (!match) { showPageStatus(t("No folder matched that name — nothing filed.")); return; }
      fileNoteInFolder(note, match.folder);
    }

    // =====================================================================
    // OPTION A -- Folders: an expandable TREE (issue #259), replacing the
    // former one-folder-at-a-time drill-down/breadcrumb. Loosely modelled
    // on the Owner's OWN Siyagah app's "My Notebooks" folder dialog, a
    // design reference only -- Siyagah's own implementation keeps one whole
    // notebook in memory, has real delete, and has no owner checks; none of
    // that carries over here.
    // =====================================================================

    // Per-device state, wrapped in try/catch (private browsing): which
    // folders are expanded, whether derived numbering is shown, and the
    // tree's own text-size step. None of this is data (the issue is
    // explicit) and none of it is synced.
    const EXPANDED_KEY = "qr.journeyMapExpanded";
    const SHOW_NUMBERS_KEY = "qr.journeyMapShowNumbers";
    const TEXT_SIZE_KEY = "qr.journeyMapTreeTextSize";
    const TEXT_SIZE_SCALES = [0.82, 0.88, 0.94, 1.0, 1.08, 1.16];
    const TEXT_SIZE_DEFAULT_INDEX = 2; // 0.94rem -- the tree's own pre-existing row size

    function loadExpandedIds() {
      try { return new Set(JSON.parse(localStorage.getItem(EXPANDED_KEY) || "[]")); }
      catch { return new Set(); }
    }
    let expandedFolderIds = loadExpandedIds();
    function saveExpandedIds() {
      try { localStorage.setItem(EXPANDED_KEY, JSON.stringify([...expandedFolderIds])); }
      catch { /* private browsing -- expand state just doesn't stick */ }
    }
    function loadShowNumbers() {
      try { const v = localStorage.getItem(SHOW_NUMBERS_KEY); return v === null ? true : v === "1"; }
      catch { return true; }
    }
    let showNumbers = loadShowNumbers();
    function saveShowNumbers() {
      try { localStorage.setItem(SHOW_NUMBERS_KEY, showNumbers ? "1" : "0"); } catch { /* private browsing */ }
    }
    function loadTreeTextSizeIndex() {
      try {
        const v = Number(localStorage.getItem(TEXT_SIZE_KEY));
        return Number.isInteger(v) && v >= 0 && v < TEXT_SIZE_SCALES.length ? v : TEXT_SIZE_DEFAULT_INDEX;
      } catch { return TEXT_SIZE_DEFAULT_INDEX; }
    }
    let treeTextSizeIndex = loadTreeTextSizeIndex();
    function saveTreeTextSizeIndex() {
      try { localStorage.setItem(TEXT_SIZE_KEY, String(treeTextSizeIndex)); } catch { /* private browsing */ }
    }

    // Transient, session-only, never persisted: the 📍 target for
    // "+ New folder", the search box's own query, which folder's Remove
    // confirmation (or inline rename) is open, and which folder is
    // mid-drag.
    let newFolderTargetNode = null; // null = top level
    let folderSearchQuery = "";
    let pendingRemoveKey = null;
    let inlineRenameKey = null;
    let dragFolderKey = null;

    /** Stable across a virtual system folder becoming real (folderId: null -> a real id): the two system folders key on their own semanticRole, every other folder on its own folderId. Used for expand state, the 📍 pin and the drag preview, none of which may reset just because ensureRealFolder() ran. */
    function expandKeyFor(node) {
      return isSystemFolderRole(node.semanticRole) ? `role:${node.semanticRole}` : node.folderId;
    }
    function toggleExpanded(node) {
      const key = expandKeyFor(node);
      if (expandedFolderIds.has(key)) expandedFolderIds.delete(key); else expandedFolderIds.add(key);
      saveExpandedIds();
      renderFoldersView();
    }
    function isPinnedTarget(f) {
      return newFolderTargetNode != null && expandKeyFor(f) === expandKeyFor(newFolderTargetNode);
    }
    function numberedLabel(f, numberPath) {
      const name = folderDisplayName(f);
      return showNumbers && numberPath ? `(${numberPath}) ${name}` : name;
    }
    function findNodeByIdOrRole(nodes, folderId, role) {
      for (const f of nodes) {
        if (folderId ? f.folderId === folderId : (!f.folderId && f.semanticRole === role)) return f;
        const child = findNodeByIdOrRole(f.children ?? [], folderId, role);
        if (child) return child;
      }
      return null;
    }
    function findNodeByExpandKey(nodes, key) {
      for (const f of nodes) {
        if (expandKeyFor(f) === key) return f;
        const child = findNodeByExpandKey(f.children ?? [], key);
        if (child) return child;
      }
      return null;
    }
    /** The sibling set a folder reorders/drags within: its parent's own children (sorted), or the user-folder roots at the top level. System folders never take part (ADR-010 §3: neither renameable, moveable, reorderable nor removable). */
    function siblingsOf(node) {
      const parentId = node.parentFolderId ?? null;
      if (parentId === null) return mergedRoots().filter((f) => !isSystemFolderRole(f.semanticRole));
      const parent = findNodeByIdOrRole(mergedRoots(), parentId, null);
      return (parent?.children ?? []).slice().sort(byOrder);
    }
    function folderAncestorPath(folderId) {
      const chain = [];
      let cursor = folderId ? findNodeByIdOrRole(mergedRoots(), folderId, null) : null;
      while (cursor) {
        chain.unshift(cursor);
        cursor = cursor.parentFolderId ? findNodeByIdOrRole(mergedRoots(), cursor.parentFolderId, null) : null;
      }
      return chain;
    }
    /** One real folder's own filed Notes, in the author's order, resolved from the already fully-loaded allPlacements/allNotes -- no per-folder read (the whole point of paging everything up front once is that opening a tenth folder costs nothing more). Mirrors folderContents()'s own two exclusions so a reader sees the identical set either way: an inactive placement, or a placement naming a retired/missing Note. */
    function notesInFolder(node) {
      if (!node.folderId) return [];
      const notesById = new Map(allNotes.map((n) => [n.noteId, n]));
      return allPlacements
        .filter((p) => p.folderId === node.folderId && p.status === NOTE_STATUS.ACTIVE)
        .map((placement) => ({ placement, note: notesById.get(placement.noteId) ?? null }))
        .filter((row) => row.note !== null && row.note.status === NOTE_STATUS.ACTIVE)
        .sort((a, b) => (a.placement.order ?? 0) - (b.placement.order ?? 0));
    }

    function renderFoldersView() {
      const roots = mergedRoots();
      let html = "";
      // NOTHING IS SILENTLY DROPPED (buildFolderTree()'s own rule, carried
      // into this screen): an orphaned, cyclic or too-deep folder is named
      // rather than simply missing from the list, even though a fresh build
      // should never actually produce one through this screen's own writes.
      const problems = [...folderTree.orphaned, ...folderTree.cyclic, ...folderTree.tooDeep];
      if (problems.length) {
        html += `<p class="warn">${escapeHtml(t("{count} folder(s) could not be shown safely and are not listed below — this needs administrator attention.", { count: problems.length }))}</p>`;
      }
      if (notesTruncated || placementsTruncated || foldersTruncated) {
        html += `<p id="truncatedMsg">${escapeHtml(t("Showing a large first batch only — there is more than could be loaded at once."))}</p>`;
      }
      html += folderToolbarHtml();
      const query = folderSearchQuery.trim().toLowerCase();
      if (query) {
        html += folderSearchResultsHtml(query);
      } else {
        let userIndex = 0;
        html += `<ul class="folder-tree" data-folder-tree>${roots.map((f) => {
          const numberPath = isSystemFolderRole(f.semanticRole) ? null : String(++userIndex).padStart(2, "0");
          return renderFolderSubtree(f, 0, numberPath);
        }).join("")}</ul>`;
      }
      html += folderFooterHtml();
      viewFolders.innerHTML = html;
      viewFolders.style.setProperty("--tree-scale", String(TEXT_SIZE_SCALES[treeTextSizeIndex]));
      wireFolderToolbar();
      if (query) wireFolderSearchResults(); else wireFolderTree();
      wireNewFolderForm();
    }

    /** One folder row, then (if expanded) its own child folders and the Notes filed directly in it -- a single flat, indented list rather than nested <ul>s, which keeps drag-and-drop and event delegation simple. */
    function renderFolderSubtree(f, depth, numberPath) {
      const childFolders = (f.children ?? []).slice().sort(byOrder);
      const leafRows = notesInFolder(f);
      const expandable = childFolders.length > 0 || leafRows.length > 0;
      const expanded = expandedFolderIds.has(expandKeyFor(f));
      let html = folderRowHtml(f, depth, numberPath, expandable, expanded);
      if (!expanded) return html;
      if (childFolders.length === 0 && leafRows.length === 0) {
        html += `<li class="folder-tree-item folder-tree-empty" style="margin-left:${((depth + 1) * 1.1).toFixed(2)}rem">${escapeHtml(emptyStateFor(f))}</li>`;
      } else {
        let childIndex = 0;
        for (const child of childFolders) {
          const childNumberPath = numberPath ? `${numberPath}.${String(++childIndex).padStart(2, "0")}` : String(++childIndex).padStart(2, "0");
          html += renderFolderSubtree(child, depth + 1, childNumberPath);
        }
        html += leafRows.map((row, idx) => noteLeafHtml(row, depth + 1, leafRows, idx)).join("");
      }
      if (isSelfSelected() && f.folderId && allNotes.some((n) => !leafRows.some((r) => r.note.noteId === n.noteId))) {
        html += `<li class="folder-tree-item folder-tree-file-btn" data-file-into-folder="${escapeHtml(f.folderId)}" style="margin-left:${((depth + 1) * 1.1).toFixed(2)}rem">
          <button type="button" class="secondary tiny" data-folder-file-note>${t("+ File a Note here…")}</button>
        </li>`;
      }
      return html;
    }

    /**
     * ONE row of the tree -- issue #259's own required control set: ▶/▾
     * expand, the derived (never STORED) number, a count badge (hidden at
     * zero), and -- for the folder's own author only -- a single ⋯ menu
     * folding 📍/✏️/▲/▼/Move to…/🗑, plus an inline rename input when
     * `inlineRenameKey` names this row. A system folder (ADR-010 §3) gets
     * none of the editing controls, the same rule this file already
     * enforced under the old drill-down.
     *
     * A DELIBERATE SIMPLIFICATION FROM THE OWNER'S OWN SIYAGAH REFERENCE,
     * stated rather than silently built as if it were the whole spec:
     * Siyagah shows these as separate icons above ~900px and folds them into
     * one ⋯ menu only below it. This round folds them into ONE menu at
     * EVERY width -- the concretely testable requirement (a hit-testable
     * menu below 900px, the exact defect class Siyagah's own bug was) is met
     * either way, and a second, wider desktop icon row is not built.
     */
    function folderRowHtml(f, depth, numberPath, expandable, expanded) {
      const key = expandKeyFor(f);
      const editable = isSelfSelected() && !isSystemFolderRole(f.semanticRole);
      const count = f.folderId ? (folderCounts[f.folderId] ?? 0) : 0;
      const toggle = expandable
        ? `<button type="button" class="folder-toggle" data-folder-toggle aria-expanded="${expanded}" aria-label="${expanded ? escapeHtml(t("Collapse")) : escapeHtml(t("Expand"))}">${expanded ? "▾" : "▶"}</button>`
        : `<span class="folder-toggle folder-toggle-leaf" aria-hidden="true">▶</span>`;
      const badge = count > 0 ? `<span class="folder-row-count">${count}</span>` : "";
      const pin = isPinnedTarget(f) ? `<span class="folder-pin-flag" title="${escapeHtml(t("New folders go here"))}">📍</span>` : "";
      const nameHtml = inlineRenameKey === key
        ? `<input type="text" class="folder-rename-input" data-folder-rename-input value="${escapeHtml(f.name ?? "")}" aria-label="${escapeHtml(t("Rename this folder"))}" />`
        : `<span class="folder-row-name" data-folder-name>${escapeHtml(numberedLabel(f, numberPath))}</span>`;
      let menu = "";
      if (editable && inlineRenameKey !== key) {
        const siblings = siblingsOf(f);
        const idx = siblings.findIndex((s) => s.folderId === f.folderId);
        const upDisabled = idx <= 0;
        const downDisabled = idx === -1 || idx >= siblings.length - 1;
        const menuId = `folderMenu-${escapeHtml(f.folderId)}`;
        menu = `
          <span class="bar-palette-wrap folder-menu-wrap" data-bar-palette-wrap="${menuId}">
            <button type="button" class="folder-menu-btn bar-palette-toggle" data-bar-palette-toggle="${menuId}" aria-haspopup="true" aria-expanded="false" title="${escapeHtml(t("More"))}" aria-label="${escapeHtml(t("More"))}">⋯</button>
            <div class="bar-palette folder-row-menu" data-bar-palette="${menuId}">
              <button type="button" class="secondary tiny" data-folder-pin>📍 ${t("New folders go here")}</button>
              <button type="button" class="secondary tiny" data-folder-rename>✏️ ${t("Rename")}</button>
              <button type="button" class="secondary tiny" data-folder-up ${upDisabled ? "disabled" : ""} aria-label="${escapeHtml(t("Move up"))}">▲ ${t("Move up")}</button>
              <button type="button" class="secondary tiny" data-folder-down ${downDisabled ? "disabled" : ""} aria-label="${escapeHtml(t("Move down"))}">▼ ${t("Move down")}</button>
              <button type="button" class="secondary tiny" data-folder-move>${t("Move to…")}</button>
              <button type="button" class="danger tiny" data-folder-remove>🗑 ${t("Remove")}</button>
            </div>
          </span>`;
      }
      const removeConfirm = pendingRemoveKey === key ? folderRemoveConfirmHtml(f) : "";
      const draggableAttr = editable ? ' draggable="true"' : "";
      return `<li class="folder-tree-item" data-depth="${depth}">
        <div class="folder-row${isSystemFolderRole(f.semanticRole) ? " system" : ""}" style="margin-left:${(depth * 1.1).toFixed(2)}rem"
             data-folder-role="${escapeHtml(f.semanticRole)}" data-folder-id="${escapeHtml(f.folderId ?? "")}"${draggableAttr}>
          ${toggle}${nameHtml}${badge}${pin}${menu}
        </div>
        ${removeConfirm}
      </li>`;
    }

    /** In-page confirmation (never the browser's own confirm dialog) for retiring a folder, rendered as the row's own sibling block. Worded per I4: kept, not deleted; Notes untouched. */
    function folderRemoveConfirmHtml(f) {
      return `<div class="folder-remove-confirm" data-folder-remove-confirm>
        <p>${escapeHtml(t('Remove "{name}"? It will be kept, not deleted — an administrator can restore it. Notes filed in it are untouched.', { name: folderDisplayName(f) }))}</p>
        <button type="button" class="danger tiny" data-folder-remove-confirm-yes>${t("Remove")}</button>
        <button type="button" class="secondary tiny" data-folder-remove-confirm-cancel>${t("Cancel")}</button>
      </div>`;
    }

    /** A Note filed directly in an OPEN folder, as a leaf of the tree -- the same shared note-card/preview toggle every view uses (wireNoteCards() is reused for it), plus its own ▲▼/Move to… when the owner is looking at their own tree. A Note filed in two folders appears under both, independently (ADR-010 §5). */
    function noteLeafHtml(row, depth, siblingRows, idx) {
      const { note, placement } = row;
      const title = note.title?.trim() || t("(untitled)");
      const controls = isSelfSelected() ? `
          <button type="button" class="secondary tiny note-order-btn" data-note-up ${idx <= 0 ? "disabled" : ""} aria-label="${escapeHtml(t("Move up"))}">▲</button>
          <button type="button" class="secondary tiny note-order-btn" data-note-down ${idx >= siblingRows.length - 1 ? "disabled" : ""} aria-label="${escapeHtml(t("Move down"))}">▼</button>
          <button type="button" class="secondary tiny" data-note-move>${t("Move to…")}</button>` : "";
      return `<li class="folder-tree-item folder-tree-note" data-note-leaf data-note-id="${escapeHtml(note.noteId)}" data-placement-id="${escapeHtml(placement.placementId)}" style="margin-left:${(depth * 1.1).toFixed(2)}rem">
        <div class="note-card">
          <div class="note-card-head" data-note-toggle>
            <span class="note-card-title">📄 ${escapeHtml(title)}</span>
            <span class="note-card-meta">${when(displayTimestamp(note))}</span>
          </div>
          <div class="note-body-preview" data-note-body></div>
          <div class="note-actions" data-note-actions style="display:none">${controls}</div>
        </div>
      </li>`;
    }

    function wireFolderTree() {
      const container = document.querySelector("[data-folder-tree]");
      if (!container) return;
      container.querySelectorAll(".folder-row").forEach((row) => {
        const folderId = row.dataset.folderId || null;
        const role = row.dataset.folderRole;
        const node = findNodeByIdOrRole(mergedRoots(), folderId, role);
        if (!node) return;
        const li = row.closest("li");

        row.querySelector("[data-folder-toggle]")?.addEventListener("click", (e) => { e.stopPropagation(); toggleExpanded(node); });
        const renameInput = row.querySelector("[data-folder-rename-input]");
        renameInput?.addEventListener("click", (e) => e.stopPropagation());
        renameInput?.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commitInlineRename(node, e.target.value); }
          else if (e.key === "Escape") { e.preventDefault(); inlineRenameKey = null; renderFoldersView(); }
        });
        renameInput?.addEventListener("blur", (e) => commitInlineRename(node, e.target.value));
        row.querySelector("[data-folder-pin]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null);
          newFolderTargetNode = isPinnedTarget(node) ? null : node;
          renderFoldersView();
        });
        row.querySelector("[data-folder-rename]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null);
          beginInlineRename(node);
        });
        row.querySelector("[data-folder-up]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null);
          const siblings = siblingsOf(node);
          reorderFolderSwap(siblings, siblings.findIndex((s) => s.folderId === node.folderId), -1);
        });
        row.querySelector("[data-folder-down]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null);
          const siblings = siblingsOf(node);
          reorderFolderSwap(siblings, siblings.findIndex((s) => s.folderId === node.folderId), 1);
        });
        row.querySelector("[data-folder-move]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null); moveFolderPrompt(node);
        });
        row.querySelector("[data-folder-remove]")?.addEventListener("click", (e) => {
          e.stopPropagation(); closeAllBarPalettes(null); removeFolderPrompt(node);
        });
        li?.querySelector("[data-folder-remove-confirm-yes]")?.addEventListener("click", () => confirmRemoveFolder(node));
        li?.querySelector("[data-folder-remove-confirm-cancel]")?.addEventListener("click", () => { pendingRemoveKey = null; renderFoldersView(); });

        // Drag a row: top 28% = before, bottom 28% = after, middle 44% =
        // inside (Siyagah's own zones). Mouse/desktop only, per the issue's
        // own scope -- a phone keeps ▲▼ and Move to… in the ⋯ menu above,
        // per Siyagah's own "touch drag did not work" finding.
        if (row.hasAttribute("draggable")) {
          row.addEventListener("dragstart", (e) => { dragFolderKey = expandKeyFor(node); e.dataTransfer.effectAllowed = "move"; });
          row.addEventListener("dragend", () => { dragFolderKey = null; clearDragIndicators(container); });
        }
        row.addEventListener("dragover", (e) => {
          if (dragFolderKey == null) return;
          e.preventDefault();
          clearDragIndicators(container);
          row.classList.add(`drag-over-${dragZoneFor(row, e.clientY)}`);
        });
        row.addEventListener("dragleave", () => row.classList.remove("drag-over-before", "drag-over-after", "drag-over-inside"));
        row.addEventListener("drop", (e) => {
          e.preventDefault();
          const zone = dragZoneFor(row, e.clientY);
          clearDragIndicators(container);
          const draggedNode = dragFolderKey ? findNodeByExpandKey(mergedRoots(), dragFolderKey) : null;
          dragFolderKey = null;
          if (draggedNode && draggedNode.folderId !== node.folderId) performFolderDrop(draggedNode, node, zone);
        });

        // Clicking the row's own name toggles it open/closed too, so the
        // whole row is a target, not just the small ▶/▾ glyph.
        row.addEventListener("click", (e) => {
          if (e.target.closest(".folder-menu-wrap, .folder-rename-input")) return;
          if (expandable(node)) toggleExpanded(node);
        });
      });

      container.querySelectorAll("[data-file-into-folder]").forEach((fileLi) => {
        const folderId = fileLi.dataset.fileIntoFolder;
        const node = findNodeByIdOrRole(mergedRoots(), folderId, null);
        fileLi.querySelector("[data-folder-file-note]")?.addEventListener("click", () => {
          if (!node) return;
          const already = notesInFolder(node);
          const candidate = allNotes.find((n) => !already.some((r) => r.note.noteId === n.noteId));
          if (candidate) fileNoteInFolder(candidate, node);
        });
      });

      wireNoteLeaves(container);
    }
    function expandable(node) {
      return (node.children ?? []).length > 0 || notesInFolder(node).length > 0;
    }
    function dragZoneFor(row, clientY) {
      const rect = row.getBoundingClientRect();
      const ratio = rect.height ? (clientY - rect.top) / rect.height : 0.5;
      if (ratio < 0.28) return "before";
      if (ratio > 0.72) return "after";
      return "inside";
    }
    function clearDragIndicators(container) {
      container.querySelectorAll(".drag-over-before, .drag-over-after, .drag-over-inside")
        .forEach((el) => el.classList.remove("drag-over-before", "drag-over-after", "drag-over-inside"));
    }

    /**
     * A drag-and-drop move, previewed against `folderMoveRefusal()` -- the
     * service's own thin forward to the contract's `folderTreeRefusal()` --
     * before ever attempting a write, and said in words if refused (a
     * self-drop, a drop into the dragged folder's own subtree, or anything
     * past MAX_FOLDER_DEPTH). "inside" re-parents onto the target; "before"/
     * "after" position the dragged folder among the target's own siblings.
     */
    async function performFolderDrop(draggedNode, targetNode, zone) {
      const newParentId = zone === "inside" ? targetNode.folderId : (targetNode.parentFolderId ?? null);
      const changingParent = (draggedNode.parentFolderId ?? null) !== newParentId;
      if (changingParent) {
        const folders = new Map(rawFolderList(folderTree).map((f) => [f.folderId, f]));
        const refusal = folderMoveRefusal({ folders, tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: draggedNode.folderId, parentFolderId: newParentId });
        if (refusal) { showPageStatus(FOLDER_PARENT_REFUSAL_MESSAGES[refusal]?.() ?? t("That move was refused.")); return; }
        const outcome = await runFolderWrite(
          () => moveFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: draggedNode.folderId, parentFolderId: newParentId, actorUid: auth.currentUser.uid }),
          { collection: TENANT.NOTE_FOLDERS, action: "moveFolder" }
        );
        if (!outcome.ok) return;
        await refreshAll(); // siblingsOf(targetNode) below must see the dragged folder among its NEW siblings
      }
      if (zone !== "inside") {
        const siblings = siblingsOf(targetNode);
        const fromIndex = siblings.findIndex((s) => s.folderId === draggedNode.folderId);
        const targetIdx = siblings.findIndex((s) => s.folderId === targetNode.folderId);
        if (fromIndex !== -1 && targetIdx !== -1) {
          const toIndex = zone === "before" ? (fromIndex < targetIdx ? targetIdx - 1 : targetIdx) : (fromIndex < targetIdx ? targetIdx : targetIdx + 1);
          const writes = planMove(siblings.map((f) => ({ id: f.folderId, order: f.order ?? 0 })), fromIndex, toIndex);
          for (const write of writes) {
            const outcome = await runFolderWrite(
              () => reorderFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: write.id, order: write.order, actorUid: auth.currentUser.uid }),
              { collection: TENANT.NOTE_FOLDERS, action: "reorderFolder" }
            );
            if (!outcome.ok) return;
          }
        }
      }
      showPageStatus(t('"{name}" moved.', { name: folderDisplayName(draggedNode) }));
      await refreshAll();
    }

    /**
     * Same discipline as `planReorder()` above (renumber by DISPLAY
     * POSITION, write only what changed) generalised to an arbitrary target
     * index -- `planReorder()` itself only ever swaps two ADJACENT positions
     * (▲/▼), and a drag can land a folder anywhere in the list, not just one
     * step away.
     */
    function planMove(siblings, fromIndex, toIndex) {
      if (fromIndex === toIndex || !siblings[fromIndex]) return [];
      const sequence = siblings.slice();
      const [moved] = sequence.splice(fromIndex, 1);
      sequence.splice(Math.max(0, Math.min(toIndex, sequence.length)), 0, moved);
      return sequence
        .map((item, order) => ({ id: item.id, order, prevOrder: item.order ?? 0 }))
        .filter((w) => w.order !== w.prevOrder)
        .map(({ id, order }) => ({ id, order }));
    }

    function wireNoteLeaves(container) {
      wireNoteCards(container, allNotes);
      if (!isSelfSelected()) return;
      container.querySelectorAll("[data-note-leaf]").forEach((li) => {
        const placementId = li.dataset.placementId;
        const noteId = li.dataset.noteId;
        const placement = allPlacements.find((p) => p.placementId === placementId);
        const note = allNotes.find((n) => n.noteId === noteId);
        const folderNode = placement ? findNodeByIdOrRole(mergedRoots(), placement.folderId, null) : null;
        if (!placement || !note || !folderNode) return;
        const rows = notesInFolder(folderNode);
        const idx = rows.findIndex((r) => r.placement.placementId === placementId);
        li.querySelector("[data-note-up]")?.addEventListener("click", () => reorderNoteInFolder(rows, idx, -1));
        li.querySelector("[data-note-down]")?.addEventListener("click", () => reorderNoteInFolder(rows, idx, 1));
        li.querySelector("[data-note-move]")?.addEventListener("click", () => moveNoteDialog(note, placement, folderNode));
      });
    }

    /** Opens inline editing for one folder's name -- Enter/blur saves via commitInlineRename(), Escape cancels, an empty name is ignored there. */
    function beginInlineRename(node) {
      inlineRenameKey = expandKeyFor(node);
      renderFoldersView();
      const input = document.querySelector("[data-folder-rename-input]");
      input?.focus();
      input?.select();
    }
    async function commitInlineRename(node, rawName) {
      if (inlineRenameKey !== expandKeyFor(node)) return; // already saved, cancelled, or superseded by a re-render
      const trimmed = (rawName ?? "").trim();
      inlineRenameKey = null;
      if (!trimmed || trimmed === node.name) { renderFoldersView(); return; }
      const outcome = await runFolderWrite(
        () => renameFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: node.folderId, name: trimmed, actorUid: auth.currentUser.uid }),
        { collection: TENANT.NOTE_FOLDERS, action: "renameFolder" }
      );
      if (!outcome.ok) { renderFoldersView(); return; }
      showPageStatus(t('Folder renamed to "{name}".', { name: trimmed }));
      await refreshAll();
    }

    /** Same prompt-a-folder-name-from-a-list shape as `openFileDialog()`/`moveNoteDialog()` -- system folders are excluded as a DESTINATION (they refuse a parent outright, per journeyFolder()'s own rule) and the folder can't be moved into itself. Any other refusal (a cycle, too deep) is only known once the write is attempted, and is surfaced in words by `runFolderWrite()`. Kept as a text prompt rather than rebuilt as a richer picker -- the issue's own "Keep ▲▼ and Move to… for every folder, reachable on a phone" names this control by its EXISTING behaviour. */
    async function moveFolderPrompt(node) {
      const TOP_LEVEL = t("(Top level)");
      const flat = flattenFolders(mergedRoots()).filter(({ folder }) =>
        folder.folderId !== node.folderId && !isSystemFolderRole(folder.semanticRole));
      const choice = prompt(
        t('Move folder "{name}" under which folder? Type the exact name shown, "{topLevel}" for the top level, or cancel.',
          { name: folderDisplayName(node), topLevel: TOP_LEVEL })
        + "\n" + TOP_LEVEL + "\n" + flat.map(({ folder, depth }) => `${"— ".repeat(depth)}${folderDisplayName(folder)}`).join("\n")
      );
      if (!choice) return;
      let parentFolderId = null;
      if (choice.trim().toLowerCase() !== TOP_LEVEL.trim().toLowerCase()) {
        const match = flat.find(({ folder }) => folderDisplayName(folder).trim().toLowerCase() === choice.trim().toLowerCase());
        if (!match) { showPageStatus(t("No folder matched that name — nothing moved.")); return; }
        parentFolderId = match.folder.folderId;
      }
      const outcome = await runFolderWrite(
        () => moveFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: node.folderId, parentFolderId, actorUid: auth.currentUser.uid }),
        { collection: TENANT.NOTE_FOLDERS, action: "moveFolder" }
      );
      if (!outcome.ok) return;
      showPageStatus(t('Folder "{name}" moved.', { name: folderDisplayName(node) }));
      await refreshAll();
    }

    /**
     * Retiring a folder with active children is refused by the Rules
     * (`parentOneHopOk()`) -- checked here FIRST, against the tree already
     * loaded (no extra read: `node.children` already reflects only ACTIVE
     * folders, the same set the underlying retire writer itself checks), so
     * the common case says so in words BEFORE any confirmation is even
     * offered. Confirming happens on the page itself (issue #259) -- never
     * the browser's own confirm dialog -- so this function only OPENS the
     * confirmation; `confirmRemoveFolder()` below performs the actual write.
     */
    async function removeFolderPrompt(node) {
      if ((node.children ?? []).length > 0) {
        showPageStatus(t('"{name}" still has folders inside it — remove those first, then this one.', { name: folderDisplayName(node) }));
        return;
      }
      pendingRemoveKey = expandKeyFor(node);
      renderFoldersView();
    }
    async function confirmRemoveFolder(node) {
      pendingRemoveKey = null;
      const outcome = await runFolderWrite(
        () => retireFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: node.folderId, actorUid: auth.currentUser.uid }),
        { collection: TENANT.NOTE_FOLDERS, action: "retireFolder" }
      );
      if (!outcome.ok) { renderFoldersView(); return; }
      showPageStatus(t('Folder "{name}" removed.', { name: folderDisplayName(node) }));
      await refreshAll();
    }

    /**
     * ▲▼ move a folder among its siblings -- single-field updates, not a
     * transaction: a partial failure leaves a display-order quirk (I5:
     * nothing is keyed by `order`), never a corruption. `planReorder()`
     * renumbers the whole sibling sequence by display position and writes
     * only what actually changed (P6-G, issue #234's own fix, unchanged
     * here -- only its CALL SITE, now the tree's ⋯ menu, is new).
     */
    async function reorderFolderSwap(siblings, idx, direction) {
      const other = idx + direction;
      if (!siblings[idx] || !siblings[other]) return;
      const writes = planReorder(siblings.map((f) => ({ id: f.folderId, order: f.order ?? 0 })), idx, direction);
      for (const write of writes) {
        const outcome = await runFolderWrite(
          () => reorderFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: write.id, order: write.order, actorUid: auth.currentUser.uid }),
          { collection: TENANT.NOTE_FOLDERS, action: "reorderFolder" }
        );
        if (!outcome.ok) return;
      }
      await refreshAll();
    }

    /**
     * ▲▼ for a Note filed in an open folder -- P6-E's `reorderFiling()`,
     * moved the same way `reorderFolderSwap()` moves folder siblings.
     * Unchanged from P6-G (issue #234): only its call site (a note leaf's
     * own buttons, rather than the old single-open-folder view) is new.
     */
    async function reorderNoteInFolder(rows, idx, direction) {
      const other = idx + direction;
      if (!rows[idx]?.placement || !rows[other]?.placement) return;
      const writes = planReorder(rows.map((r) => ({ id: r.placement.placementId, order: r.placement.order ?? 0 })), idx, direction);
      for (const write of writes) {
        const outcome = await runFolderWrite(
          () => reorderFiling(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, placementId: write.id, order: write.order, actorUid: auth.currentUser.uid }),
          { collection: TENANT.NOTE_PLACEMENTS, action: "reorderFiling" }
        );
        if (!outcome.ok) return;
      }
      await refreshAll();
    }

    function emptyStateFor(node) {
      if (node.semanticRole === "journey-map") return t("Your Personal Journey Map is empty so far — Notes you file here will appear as your own journey through what you've studied.");
      if (node.semanticRole === "reflection-archive") return t("Your Reflection Archive is empty so far — file a Note here to keep it as a longer-term reflection, separate from your day-to-day journey.");
      return t("This folder is empty.");
    }

    async function moveNoteDialog(note, placement, fromNode) {
      const flat = flattenFolders(mergedRoots()).filter(({ folder }) => !(folder.folderId ? folder.folderId === fromNode.folderId : folder.semanticRole === fromNode.semanticRole));
      const choice = prompt(
        t('Move "{title}" to which folder? Type the exact name shown, or cancel.', { title: note.title?.trim() || t("(untitled)") })
        + "\n" + flat.map(({ folder, depth }) => `${"— ".repeat(depth)}${folderDisplayName(folder)}`).join("\n")
      );
      if (!choice) return;
      const match = flat.find(({ folder }) => folderDisplayName(folder).trim().toLowerCase() === choice.trim().toLowerCase());
      if (!match) { showPageStatus(t("No folder matched that name — nothing moved.")); return; }
      const toFolderId = await ensureRealFolder(match.folder);
      if (!toFolderId) return;
      const outcome = await safeWrite(
        () => moveNoteToFolder(db, {
          tenantId: activeTenantId, ownerPersonId: selectedPersonId, ownerUid: auth.currentUser.uid,
          noteId: note.noteId, fromPlacementId: placement.placementId, toFolderId, actorUid: auth.currentUser.uid,
        }),
        { collection: TENANT.NOTE_PLACEMENTS, action: "moveNoteToFolder" }
      );
      if (!outcome.ok) return;
      showPageStatus(t('"{title}" moved to {folder}.', { title: note.title?.trim() || t("(untitled)"), folder: folderDisplayName(match.folder) }));
      await refreshAll();
    }

    // -- Toolbar: search (folders + Note titles, in the already-loaded data,
    // no new read), "Show numbers", and A-/A+ tree text size. --
    function folderToolbarHtml() {
      return `<div class="folder-toolbar">
        <input type="text" id="folderSearchInput" class="folder-search-input" placeholder="${escapeHtml(t("Search folders and Notes…"))}" value="${escapeHtml(folderSearchQuery)}" aria-label="${escapeHtml(t("Search folders and Notes…"))}" />
        <label class="folder-toolbar-check"><input type="checkbox" id="folderShowNumbers" ${showNumbers ? "checked" : ""} /> ${t("Show numbers")}</label>
        <span class="folder-textsize-group">
          <button type="button" id="folderTextSizeDown" class="secondary tiny" aria-label="${escapeHtml(t("Smaller text"))}" ${treeTextSizeIndex <= 0 ? "disabled" : ""}>A−</button>
          <button type="button" id="folderTextSizeUp" class="secondary tiny" aria-label="${escapeHtml(t("Larger text"))}" ${treeTextSizeIndex >= TEXT_SIZE_SCALES.length - 1 ? "disabled" : ""}>A+</button>
        </span>
      </div>`;
    }
    function wireFolderToolbar() {
      const input = document.getElementById("folderSearchInput");
      input?.addEventListener("input", () => {
        folderSearchQuery = input.value;
        renderFoldersView();
        // Re-rendering replaces the <input> itself (this app's own standing
        // "re-render wipes UI state" lesson) -- focus and caret position are
        // threaded back in explicitly so typing is not interrupted.
        const restored = document.getElementById("folderSearchInput");
        if (restored) { restored.focus(); restored.setSelectionRange(restored.value.length, restored.value.length); }
      });
      document.getElementById("folderShowNumbers")?.addEventListener("change", (e) => { showNumbers = e.target.checked; saveShowNumbers(); renderFoldersView(); });
      document.getElementById("folderTextSizeDown")?.addEventListener("click", () => { if (treeTextSizeIndex > 0) { treeTextSizeIndex -= 1; saveTreeTextSizeIndex(); renderFoldersView(); } });
      document.getElementById("folderTextSizeUp")?.addEventListener("click", () => { if (treeTextSizeIndex < TEXT_SIZE_SCALES.length - 1) { treeTextSizeIndex += 1; saveTreeTextSizeIndex(); renderFoldersView(); } });
    }

    function folderSearchResultsHtml(query) {
      const folderMatches = flattenFolders(mergedRoots()).map(({ folder }) => folder)
        .filter((f) => folderDisplayName(f).toLowerCase().includes(query));
      const noteMatches = allNotes.filter((n) => (n.title || "").toLowerCase().includes(query));
      if (folderMatches.length === 0 && noteMatches.length === 0) {
        return `<p id="emptyMsg">${escapeHtml(t('No folders or Notes match "{query}".', { query: folderSearchQuery.trim() }))}</p>`;
      }
      let html = `<ul class="folder-search-results" data-folder-search-results>`;
      for (const f of folderMatches) {
        const crumb = folderAncestorPath(f.folderId).map((a) => folderDisplayName(a)).join(" › ") || t("All folders");
        html += `<li class="folder-search-result" data-search-folder-id="${escapeHtml(f.folderId ?? "")}" data-search-folder-role="${escapeHtml(f.semanticRole)}">
          <span class="folder-row-name">${escapeHtml(folderDisplayName(f))}</span>
          <span class="folder-search-breadcrumb">${escapeHtml(crumb)}</span>
        </li>`;
      }
      for (const note of noteMatches) {
        html += `<li class="folder-search-result folder-search-result-note" data-search-note-id="${escapeHtml(note.noteId)}">
          <span class="note-card-title">📄 ${escapeHtml(note.title?.trim() || t("(untitled)"))}</span>
        </li>`;
      }
      html += `</ul>`;
      return html;
    }
    function wireFolderSearchResults() {
      const container = document.querySelector("[data-folder-search-results]");
      if (!container) return;
      container.querySelectorAll("[data-search-folder-id]").forEach((li) => {
        li.addEventListener("click", () => {
          const folderId = li.dataset.searchFolderId || null;
          const role = li.dataset.searchFolderRole;
          const node = findNodeByIdOrRole(mergedRoots(), folderId, role);
          if (!node) return;
          for (const ancestor of folderAncestorPath(folderId)) expandedFolderIds.add(expandKeyFor(ancestor));
          saveExpandedIds();
          folderSearchQuery = "";
          renderFoldersView();
          requestAnimationFrame(() => {
            document.querySelector(`.folder-row[data-folder-id="${CSS.escape(folderId ?? "")}"][data-folder-role="${CSS.escape(role)}"]`)
              ?.scrollIntoView({ block: "center" });
          });
        });
      });
      container.querySelectorAll("[data-search-note-id]").forEach((li) => {
        li.addEventListener("click", () => {
          const noteId = li.dataset.searchNoteId;
          for (const placement of allPlacements.filter((p) => p.noteId === noteId && p.status === NOTE_STATUS.ACTIVE)) {
            const target = findNodeByIdOrRole(mergedRoots(), placement.folderId, null);
            if (!target) continue;
            for (const ancestor of folderAncestorPath(placement.folderId)) expandedFolderIds.add(expandKeyFor(ancestor));
            expandedFolderIds.add(expandKeyFor(target));
          }
          expandedNoteIds.add(noteId);
          saveExpandedIds();
          folderSearchQuery = "";
          renderFoldersView();
          requestAnimationFrame(() => {
            document.querySelector(`[data-note-leaf][data-note-id="${CSS.escape(noteId)}"]`)?.scrollIntoView({ block: "center" });
          });
        });
      });
    }

    // -- Footer: the 📍 target line and "+ New folder". --
    function folderFooterHtml() {
      if (!isSelfSelected()) return "";
      const targetLabel = newFolderTargetNode ? folderDisplayName(newFolderTargetNode) : t("Top level");
      return `<div class="folder-footer">
        <p class="folder-footer-target">${escapeHtml(t("New folder in: {target}", { target: targetLabel }))}${newFolderTargetNode ? ` <button type="button" id="clearFolderTarget" class="secondary tiny" aria-label="${escapeHtml(t("Clear target"))}">✕</button>` : ""}</p>
        <form id="newFolderForm">
          <input type="text" id="newFolderName" placeholder="${escapeHtml(t("Folder name"))}" />
          <button type="submit">${t("+ New folder")}</button>
        </form>
      </div>`;
    }
    function wireNewFolderForm() {
      document.getElementById("clearFolderTarget")?.addEventListener("click", () => { newFolderTargetNode = null; renderFoldersView(); });
      const form = document.getElementById("newFolderForm");
      if (!form) return;
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("newFolderName").value.trim();
        if (!name) return;
        const target = newFolderTargetNode;
        const parentFolderId = target ? await ensureRealFolder(target) : null;
        if (target && !parentFolderId) return;
        // P6-G's own fix (issue #234), now generalised to a pinned target
        // (issue #259): order against the real CURRENT siblings at whichever
        // level the folder is landing -- the user-folder roots when nothing
        // is pinned, unchanged from P6-G, or the pinned target's own real
        // children once one is.
        const order = target
          ? nextOrder((findNodeByIdOrRole(mergedRoots(), parentFolderId, null)?.children ?? []))
          : nextOrder(mergedRoots().filter((f) => !isSystemFolderRole(f.semanticRole)));
        const outcome = await safeWrite(
          () => createNoteFolder(db, {
            tenantId: activeTenantId, ownerPersonId: selectedPersonId, ownerUid: auth.currentUser.uid,
            name, semanticRole: "user", parentFolderId, order, actorUid: auth.currentUser.uid,
          }),
          { collection: TENANT.NOTE_FOLDERS, action: "createNoteFolder" }
        );
        if (!outcome.ok) return;
        if (parentFolderId) { expandedFolderIds.add(parentFolderId); saveExpandedIds(); }
        showPageStatus(t('Folder "{name}" created.', { name }));
        await refreshAll();
      });
    }

    // =====================================================================
    // OPTION B -- Timeline
    // =====================================================================
    function timelineFilters() {
      const roots = mergedRoots();
      return [
        { key: "everything", label: t("Everything") },
        ...roots.map((f) => ({ key: f.folderId ? `folder:${f.folderId}` : `role:${f.semanticRole}`, label: folderDisplayName(f), node: f })),
      ];
    }

    async function timelineNotesForFilter() {
      if (timelineFilter === "everything") return allNotes;
      const filters = timelineFilters();
      const chosen = filters.find((f) => f.key === timelineFilter);
      if (!chosen?.node) return allNotes;
      if (!chosen.node.folderId) return []; // a virtual folder with no document has nothing filed in it
      const { rows } = await folderContents(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: chosen.node.folderId });
      return rows.map((r) => r.note);
    }

    // A token, not just an element lookup, is what keeps a slow filter
    // switch from overwriting a faster later one: clicking a second chip
    // before the first's folderContents() read resolves re-renders the
    // chips AND a fresh #timelineBody, so a bare getElementById() after the
    // await would find (and wrongly fill) the SECOND click's own container
    // with the FIRST click's stale results.
    let timelineRenderToken = 0;
    async function renderTimelineView() {
      const myToken = ++timelineRenderToken;
      const filters = timelineFilters();
      const chipsHtml = `<div class="filter-chips">${filters.map((f) =>
        `<button type="button" class="filter-chip" data-filter="${escapeHtml(f.key)}" aria-pressed="${f.key === timelineFilter}">${escapeHtml(f.label)}</button>`).join("")}</div>`;
      viewTimeline.innerHTML = chipsHtml + `<div id="timelineBody"><p class="note">${t("Loading…")}</p></div>`;
      viewTimeline.querySelectorAll("[data-filter]").forEach((btn) => {
        btn.addEventListener("click", () => { timelineFilter = btn.dataset.filter; renderTimelineView(); });
      });

      const notes = await timelineNotesForFilter();
      if (myToken !== timelineRenderToken) return; // a later click already superseded this one
      const body = document.getElementById("timelineBody");
      if (!body) return; // the view was switched away while this was loading
      if (notes.length === 0) {
        body.innerHTML = `<p id="emptyMsg">${escapeHtml(t("Nothing here yet — Notes you write will appear on your timeline the day you write them."))}</p>`;
        return;
      }
      // Newest first, grouped by calendar day (the issue's own spec).
      const sorted = [...notes].sort((a, b) => (displayTimestamp(b)?.toMillis?.() ?? 0) - (displayTimestamp(a)?.toMillis?.() ?? 0));
      let lastDay = null;
      let html = "";
      for (const note of sorted) {
        const d = displayTimestamp(note)?.toDate ? displayTimestamp(note).toDate() : null;
        const dayKey = d ? d.toDateString() : t("Unknown date");
        if (dayKey !== lastDay) { html += `<div class="timeline-day">${escapeHtml(d ? d.toLocaleDateString() : t("Unknown date"))}</div>`; lastDay = dayKey; }
        html += noteCardHtml(note, { fileControl: true });
      }
      body.innerHTML = html;
      wireNoteCards(body, sorted);
    }

    // =====================================================================
    // OPTION C -- Path: a BRANCHING tree with links (issue #267)
    // =====================================================================
    // Owner decision, 25 Sep 2026: "Path view: branching with links."
    // Supersedes v08.37's own honest-first-pass straight track (kept above
    // as history in CHANGELOG.md), whose own comment named exactly this gap:
    // a Note filed in two folders cannot sit in two places on one straight
    // line. The answer built here is the one the Owner chose -- each folder
    // is its own branch (mergedRoots()/buildFolderTree(), the identical tree
    // Folders already draws), a folder's own filed Notes are stops along it
    // ordered oldest first, and a Note filed in more than one folder carries
    // a 🔗 badge on every appearance; tapping one highlights every
    // appearance and draws a connecting line between them.
    //
    // SIZE (the issue's own #3): the Owner's imported site will carry
    // roughly 1,464 folders and 1,091 Notes (issue #265). Branches below the
    // top two levels start COLLAPSED (pathBranchExpanded()) and a folder's
    // own stops beyond PATH_STOPS_PER_BRANCH are grouped as "+N more" --
    // both session-only, never persisted, and both bounded so a tap only
    // ever grows the rendered tree by what it reveals. pathStopIndex() is
    // the one place that walks every placement, ONCE per render, O(P) --
    // no layout step here is quadratic in the number of Notes.
    const PATH_STOPS_PER_BRANCH = 20;
    let pathForceExpanded = new Set();
    let pathForceCollapsed = new Set();
    let pathRevealedBranches = new Set(); // folderId -> its own "+N more" already revealed
    let pathHighlightedNoteId = null;

    /** Top two levels (0 and 1) start expanded; anything a reader has explicitly toggled wins over that default, in either direction. */
    function pathBranchExpanded(key, depth) {
      if (pathForceCollapsed.has(key)) return false;
      if (pathForceExpanded.has(key)) return true;
      return depth <= 1;
    }
    function togglePathBranch(key, depth) {
      const now = pathBranchExpanded(key, depth);
      if (now) { pathForceCollapsed.add(key); pathForceExpanded.delete(key); }
      else { pathForceExpanded.add(key); pathForceCollapsed.delete(key); }
      renderPathView();
    }

    /**
     * ONE pass over allPlacements -- `byFolder`: folderId -> that folder's own
     * active Notes (deduplicated by noteId, a Map so a stray duplicate
     * placement cannot double a stop), sorted oldest-first afterwards;
     * `foldersByNote`: noteId -> every folder it is filed in, in placement
     * order. Mirrors folderContents()'s/notesInFolder()'s own two exclusions
     * (a retired Note, or a placement naming one) so a Path stop is exactly
     * what Folders would show for the same folder.
     */
    function pathStopIndex() {
      const notesById = new Map(allNotes.map((n) => [n.noteId, n]));
      const byFolder = new Map();
      const foldersByNote = new Map();
      for (const p of allPlacements) {
        if (p.status !== NOTE_STATUS.ACTIVE) continue;
        const note = notesById.get(p.noteId);
        if (!note || note.status !== NOTE_STATUS.ACTIVE) continue;
        if (!byFolder.has(p.folderId)) byFolder.set(p.folderId, new Map());
        byFolder.get(p.folderId).set(note.noteId, note);
        if (!foldersByNote.has(p.noteId)) foldersByNote.set(p.noteId, []);
        const folders = foldersByNote.get(p.noteId);
        if (!folders.includes(p.folderId)) folders.push(p.folderId);
      }
      const byFolderArrays = new Map();
      for (const [folderId, notes] of byFolder) {
        byFolderArrays.set(folderId, [...notes.values()].sort((a, b) => pathStopDate(a) - pathStopDate(b)));
      }
      return { byFolder: byFolderArrays, foldersByNote };
    }
    /** Issue #267's own instruction: originalCreatedAt when present (issue #265 adds it), otherwise createdAt. */
    function pathStopDate(note) {
      const ts = note.originalCreatedAt ?? note.createdAt;
      return ts?.toMillis ? ts.toMillis() : 0;
    }

    /** Every branch a Note appears on, expanded and its own "+N more" revealed, so a highlighted stop always has somewhere real to draw a line to. */
    function ensurePathVisible(noteId, index) {
      for (const folderId of index.foldersByNote.get(noteId) ?? []) {
        for (const ancestor of folderAncestorPath(folderId)) {
          const key = expandKeyFor(ancestor);
          pathForceExpanded.add(key); pathForceCollapsed.delete(key);
        }
        pathRevealedBranches.add(folderId);
      }
    }
    function togglePathHighlight(noteId, index) {
      if (pathHighlightedNoteId === noteId) { pathHighlightedNoteId = null; }
      else { pathHighlightedNoteId = noteId; ensurePathVisible(noteId, index); }
      renderPathView();
    }
    // Escape clears an open highlight -- wired once, at module load, guarded
    // on the Path view actually being the one on screen (the same guard
    // every other cross-view keyboard shortcut in this app would need).
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && currentView === "path" && pathHighlightedNoteId !== null) {
        pathHighlightedNoteId = null;
        renderPathView();
      }
    });

    function renderPathView() {
      if (allNotes.length === 0) {
        viewPath.innerHTML = `<p id="emptyMsg">${escapeHtml(t("Your path is empty so far — every Note you write will appear here as a new stop, oldest to newest."))}</p>`;
        return;
      }
      const index = pathStopIndex();
      const anyLinked = [...index.foldersByNote.values()].some((folders) => folders.length > 1);
      let html = "";
      if (foldersTruncated) {
        html += `<p id="pathTruncatedMsg">${escapeHtml(t("Showing a large first batch only — there is more than could be loaded at once."))}</p>`;
      }
      if (anyLinked) {
        html += `<p class="path-hint">${escapeHtml(t("A Note filed in more than one folder shows a 🔗 badge — tap it to see every place it appears."))}</p>`;
      }
      html += `<div id="pathTree" data-path-tree>${mergedRoots().map((f) => pathBranchHtml(f, 0, index)).join("")}</div>`;
      viewPath.innerHTML = html;
      wirePathTree(index);
      if (pathHighlightedNoteId) applyPathHighlight(index);
    }

    /** One branch (folder), then -- if expanded -- its own child branches followed by its own stops, the same child-folders-then-leaves order the Folders tree already uses. */
    function pathBranchHtml(f, depth, index) {
      const childFolders = (f.children ?? []).slice().sort(byOrder);
      const stops = index.byFolder.get(f.folderId) ?? [];
      const key = expandKeyFor(f);
      const expandable = childFolders.length > 0 || stops.length > 0;
      const expanded = pathBranchExpanded(key, depth);
      const toggle = expandable
        ? `<button type="button" class="path-branch-toggle" data-path-branch-toggle="${escapeHtml(key)}" data-path-depth="${depth}" aria-expanded="${expanded}" aria-label="${expanded ? escapeHtml(t("Collapse")) : escapeHtml(t("Expand"))}">${expanded ? "▾" : "▶"}</button>`
        : `<span class="path-branch-toggle path-branch-toggle-leaf" aria-hidden="true">▶</span>`;
      const badge = stops.length > 0 ? `<span class="path-branch-count">${stops.length}</span>` : "";
      let html = `<div class="path-branch${isSystemFolderRole(f.semanticRole) ? " system" : ""}" data-path-branch data-branch-key="${escapeHtml(key)}">
        <div class="path-branch-head" data-path-branch-head>${toggle}<span class="path-branch-name">${escapeHtml(folderDisplayName(f))}</span>${badge}</div>`;
      if (expanded) {
        html += `<div class="path-branch-body">`;
        if (!expandable) {
          html += `<p class="path-branch-empty">${escapeHtml(emptyStateFor(f))}</p>`;
        } else {
          for (const child of childFolders) html += pathBranchHtml(child, depth + 1, index);
          if (stops.length) html += pathStopsHtml(f, stops, index);
        }
        html += `</div>`;
      }
      html += `</div>`;
      return html;
    }

    /** A folder's own stops, capped at PATH_STOPS_PER_BRANCH unless this exact folder's "+N more" was already tapped this session. */
    function pathStopsHtml(f, stops, index) {
      const revealed = pathRevealedBranches.has(f.folderId);
      const shown = revealed ? stops : stops.slice(0, PATH_STOPS_PER_BRANCH);
      const remaining = stops.length - shown.length;
      let html = `<div class="path-stops" data-path-stops>${shown.map((note) => pathStopHtml(note, index)).join("")}</div>`;
      if (remaining > 0) {
        html += `<button type="button" class="secondary tiny path-more-btn" data-path-more="${escapeHtml(f.folderId)}">${escapeHtml(t("+{count} more", { count: remaining }))}</button>`;
      }
      return html;
    }

    /** One stop -- the shared noteCardHtml() component, exactly as Timeline renders it, with a 🔗 badge injected into its own head when this Note sits on more than one branch. */
    function pathStopHtml(note, index) {
      const ts = note.originalCreatedAt ?? note.createdAt;
      const d = ts?.toDate ? ts.toDate() : null;
      const folderCount = (index.foldersByNote.get(note.noteId) ?? []).length;
      const linkLabel = t("In {count} places", { count: folderCount });
      const badge = folderCount > 1
        ? `<button type="button" class="path-link-badge" data-path-link-badge aria-label="${escapeHtml(linkLabel)}" title="${escapeHtml(linkLabel)}">🔗 ${folderCount}</button>`
        : "";
      return `<div class="path-stop" data-stop-note-id="${escapeHtml(note.noteId)}">
        <div class="path-stop-marker"></div>
        <div class="path-stop-date">${escapeHtml(d ? d.toLocaleDateString() : "")}</div>
        ${noteCardHtml(note, { fileControl: true, extraHead: badge })}
      </div>`;
    }

    function wirePathTree(index) {
      const container = document.querySelector("[data-path-tree]");
      if (!container) return;
      container.querySelectorAll("[data-path-branch-toggle]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          togglePathBranch(btn.dataset.pathBranchToggle, Number(btn.dataset.pathDepth));
        });
      });
      container.querySelectorAll("[data-path-branch-head]").forEach((head) => {
        head.addEventListener("click", (e) => {
          if (e.target.closest(".path-branch-toggle")) return; // its own listener above already handled this tap
          const toggleEl = head.querySelector("[data-path-branch-toggle]");
          if (toggleEl) togglePathBranch(toggleEl.dataset.pathBranchToggle, Number(toggleEl.dataset.pathDepth));
        });
      });
      container.querySelectorAll("[data-path-more]").forEach((btn) => {
        btn.addEventListener("click", () => { pathRevealedBranches.add(btn.dataset.pathMore); renderPathView(); });
      });
      wireNoteCards(container, allNotes);
      container.querySelectorAll("[data-path-link-badge]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const noteId = btn.closest("[data-note-id]")?.dataset.noteId;
          if (noteId) togglePathHighlight(noteId, index);
        });
      });
    }

    /**
     * Highlights every rendered appearance of the highlighted Note (its
     * ensurePathVisible() call already guaranteed each one is expanded and
     * on screen) and draws a dashed line from the first appearance to every
     * other one, as a small absolutely-positioned SVG overlay sized to the
     * tree's own scrolled content -- pointer-events: none, so it can never
     * steal a tap from a branch toggle or a stop underneath it.
     */
    function applyPathHighlight(index) {
      const container = document.querySelector("[data-path-tree]");
      if (!container || !pathHighlightedNoteId) return;
      const matches = [...container.querySelectorAll(`.note-card[data-note-id="${CSS.escape(pathHighlightedNoteId)}"]`)];
      matches.forEach((el) => el.classList.add("path-note-highlighted"));
      container.querySelectorAll("[data-path-link-badge]").forEach((btn) => {
        if (btn.closest("[data-note-id]")?.dataset.noteId === pathHighlightedNoteId) btn.classList.add("active");
      });
      if (matches.length < 2) return;
      const containerRect = container.getBoundingClientRect();
      const points = matches.map((el) => {
        const r = el.getBoundingClientRect();
        return { x: r.left - containerRect.left + r.width / 2, y: r.top - containerRect.top + r.height / 2 };
      });
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("class", "path-link-lines");
      svg.setAttribute("data-path-link-lines", "");
      svg.setAttribute("width", String(container.scrollWidth));
      svg.setAttribute("height", String(container.scrollHeight));
      for (let i = 1; i < points.length; i++) {
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", points[0].x); line.setAttribute("y1", points[0].y);
        line.setAttribute("x2", points[i].x); line.setAttribute("y2", points[i].y);
        svg.appendChild(line);
      }
      container.appendChild(svg);
    }

    // -----------------------------------------------------------------------
    // Sign-in / bootstrap -- same shape as notes.html / bookmarks.html.
    // -----------------------------------------------------------------------
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        whoEl.textContent = t("Not signed in.");
        signInBtn.style.display = "inline-block";
        signOutBtn.style.display = "none";
        appEl.style.display = "none";
        return;
      }
      whoEl.textContent = t("Signed in as {email}", { email: user.email });
      signInBtn.style.display = "none";
      signOutBtn.style.display = "inline-block";

      try {
        const userIndexSnap = await getDoc(doc(db, TENANT.USER_INDEX, user.uid));
        if (adoptAppLangFromUserIndex(userIndexSnap)) return;
        const defaultTenantId = userIndexSnap.exists() ? userIndexSnap.data().defaultTenantId : null;
        const { context, memberships } = await bootstrapContext(db, user.uid, defaultTenantId);
        if (!context) {
          whoEl.innerHTML += noAccountMessageHtml();
          return;
        }
        activeTenantId = context.tenantId;
        myMemberships = memberships;
        tenantSelect.innerHTML = myMemberships
          .map((m) => `<option value="${m.tenantId}" ${m.tenantId === activeTenantId ? "selected" : ""}>${m.tenantName} (${roleListLabel(m.roles)})</option>`)
          .join("");

        renderToggle();
        appEl.style.display = "block";
        await loadContextData();
      } catch (err) {
        console.error(err);
        whoEl.textContent += ` — ${err.message}`;
      }
    });
  </script>
</body>
</html>
