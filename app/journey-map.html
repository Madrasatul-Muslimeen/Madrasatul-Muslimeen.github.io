    /** Opens inline editing for one folder's name -- Enter/blur saves via commitInlineRename(), Escape cancels, an empty name is ignored there. */
    function beginInlineRename(node) {
      inlineRenameKey = expandKeyFor(node);
      renderFoldersView();
      const input = document.querySelector("[data-folder-rename-input]");
      input?.focus();
      input?.select();
    }
    async function commitInlineRename(node, rawName) {
      if (inlineRenameKey !== expandKeyFor(node)) return; // already saved, cancelled, or superseded by a re-render
      const trimmed = (rawName ?? "").trim();
      inlineRenameKey = null;
      if (!trimmed || trimmed === node.name) { renderFoldersView(); return; }
      const outcome = await runFolderWrite(
        () => renameFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: node.folderId, name: trimmed, actorUid: auth.currentUser.uid }),
        { collection: TENANT.NOTE_FOLDERS, action: "renameFolder" }
      );
      if (!outcome.ok) { renderFoldersView(); return; }
      showPageStatus(t('Folder renamed to "{name}".', { name: trimmed }));
      await refreshAll();
    }

    // Siyagah port round 3 (Owner decisions 41, 42.1, M4-M6): Copy to…, Move
    // to…, Delete (to Trash) and the Trash view. Every write goes through
    // journey-map-service.js (round 1, emulator-tested); this page writes
    // nothing of its own.

    function noteTitleOf(note) { return note.title?.trim() || t("(untitled)"); }

    /** The tree flattened in display order with the SAME derived numbers the tree itself shows (renderFolderSubtree()'s own numbering). */
    function pickerRows() {
      const out = [];
      const walk = (f, depth, numberPath) => {
        out.push({ folder: f, depth, numberPath });
        let childIndex = 0;
        for (const child of (f.children ?? []).slice().sort(byOrder)) {
          const childPath = numberPath ? `${numberPath}.${String(++childIndex).padStart(2, "0")}` : String(++childIndex).padStart(2, "0");
          walk(child, depth + 1, childPath);
        }
      };
      let userIndex = 0;
      for (const f of mergedRoots()) walk(f, 0, isSystemFolderRole(f.semanticRole) ? null : String(++userIndex).padStart(2, "0"));
      return out;
    }

    /**
     * The ONE destination chooser both menus reuse. Resolves with the chosen
     * folder node, the string "top" (when `allowTop`), or null on Cancel/Esc.
     * `refuse(node|null)` returns a sentence for a destination that may not be
     * used (a folder's own subtree, a folder that already holds the Note): that
     * row stays on screen, is marked aria-disabled, and tapping it says why in
     * the picker instead of closing it. Full screen on a phone (CSS), and a
     * fixed overlay above everything this document draws (§5.3).
     */
    function openFolderPicker({ title, allowTop = false, includeSystem = true, refuse = () => null }) {
      return new Promise((resolve) => {
        document.getElementById("folderPicker")?.remove();
        const overlay = document.createElement("div");
        overlay.id = "folderPicker";
        overlay.className = "folder-picker-overlay";
        overlay.innerHTML = `<div class="folder-picker" role="dialog" aria-modal="true" aria-labelledby="folderPickerTitle" tabindex="-1">
          <h2 id="folderPickerTitle" class="folder-picker-title">${escapeHtml(title)}</h2>
          <input type="text" class="folder-search-input" data-picker-search placeholder="${escapeHtml(t("Search folders and Notes…"))}" aria-label="${escapeHtml(t("Search folders and Notes…"))}" />
          <p class="warn folder-picker-msg" data-picker-msg role="alert" style="display:none;"></p>
          <ul class="folder-picker-list" data-picker-list></ul>
          <div class="folder-picker-actions"><button type="button" class="secondary" data-picker-cancel>${escapeHtml(t("Cancel"))}</button></div>
        </div>`;
        document.body.appendChild(overlay);
        const msgEl = overlay.querySelector("[data-picker-msg]");
        const listEl = overlay.querySelector("[data-picker-list]");
        const searchEl = overlay.querySelector("[data-picker-search]");
        const onKey = (e) => { if (e.key === "Escape") finish(null); };
        function finish(value) {
          document.removeEventListener("keydown", onKey);
          overlay.remove();
          resolve(value);
        }
        const rows = pickerRows().filter(({ folder }) => includeSystem || !isSystemFolderRole(folder.semanticRole));
        function renderList() {
          const q = searchEl.value.trim().toLowerCase();
          const shown = rows.filter(({ folder }) => !q || folderDisplayName(folder).toLowerCase().includes(q));
          let html = "";
          if (allowTop && !q) {
            html += `<li><button type="button" class="folder-picker-row" data-pick="top"><span class="folder-row-name">${escapeHtml(t("(Top level)"))}</span></button></li>`;
          }
          html += shown.map(({ folder, depth, numberPath }) => {
            const refused = refuse(folder);
            const count = folder.folderId ? (folderCounts[folder.folderId] ?? 0) : 0;
            return `<li><button type="button" class="folder-picker-row${refused ? " refused" : ""}" data-pick="${escapeHtml(expandKeyFor(folder))}" ${refused ? 'aria-disabled="true"' : ""} style="padding-left:${(0.6 + depth * 1.1).toFixed(2)}rem">
              <span class="folder-row-name">${escapeHtml(numberedLabel(folder, numberPath))}</span>${count > 0 ? `<span class="folder-row-count">${count}</span>` : ""}
            </button></li>`;
          }).join("");
          if (!html) html = `<li class="note">${escapeHtml(t('No folders or Notes match "{query}".', { query: searchEl.value.trim() }))}</li>`;
          listEl.innerHTML = html;
        }
        renderList();
        searchEl.addEventListener("input", () => { msgEl.style.display = "none"; renderList(); });
        listEl.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-pick]");
          if (!btn) return;
          const key = btn.dataset.pick;
          const chosen = key === "top" ? null : (findNodeByExpandKey(mergedRoots(), key) ?? null);
          const refused = refuse(chosen);
          if (refused) { msgEl.textContent = refused; msgEl.style.display = "block"; return; }
          finish(key === "top" ? "top" : chosen);
        });
        overlay.querySelector("[data-picker-cancel]").addEventListener("click", () => finish(null));
        overlay.addEventListener("click", (e) => { if (e.target === overlay) finish(null); });
        document.addEventListener("keydown", onKey);
        overlay.querySelector(".folder-picker").focus();
      });
    }

    /** The service's own refusal vocabulary for a folder move/copy, said before any write is attempted -- the destination's own subtree included. */
    function folderDestinationRefusal(node, destination) {
      if (destination !== null && !destination.folderId) return t("Personal Journey Map and Reflection Archive can't hold other folders inside them.");
      const folders = new Map(rawFolderList(folderTree).map((f) => [f.folderId, f]));
      const slug = folderMoveRefusal({ folders, tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: node.folderId, parentFolderId: destination === null ? null : destination.folderId });
      return slug ? (FOLDER_PARENT_REFUSAL_MESSAGES[slug]?.() ?? t("That move was refused.")) : null;
    }
    const placeLabel = (picked) => (picked === "top" ? t("(Top level)") : folderDisplayName(picked));

    async function moveFolderTo(node) {
      const picked = await openFolderPicker({
        title: t('Move folder "{name}" to…', { name: folderDisplayName(node) }),
        allowTop: true, includeSystem: false,
        refuse: (dest) => folderDestinationRefusal(node, dest),
      });
      if (!picked) return;
      const outcome = await runFolderWrite(
        () => moveFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: node.folderId, parentFolderId: picked === "top" ? null : picked.folderId, actorUid: auth.currentUser.uid }),
        { collection: TENANT.NOTE_FOLDERS, action: "moveFolder" }
      );
      if (!outcome.ok) return;
      showPageStatus(t('Folder "{name}" moved to {place}.', { name: folderDisplayName(node), place: placeLabel(picked) }));
      await refreshAll();
    }

    async function copyFolderTo(node) {
      const picked = await openFolderPicker({
        title: t('Copy folder "{name}" to…', { name: folderDisplayName(node) }),
        allowTop: true, includeSystem: false,
        refuse: (dest) => folderDestinationRefusal(node, dest),
      });
      if (!picked) return;
      const outcome = await runFolderWrite(
        () => copyFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, ownerUid: auth.currentUser.uid, folderId: node.folderId, toParentFolderId: picked === "top" ? null : picked.folderId, actorUid: auth.currentUser.uid }),
        { collection: TENANT.NOTE_FOLDERS, action: "copyFolder" }
      );
      if (!outcome.ok) return;
      const { folders, placements } = outcome.result;
      showPageStatus(t('Folder "{name}" copied to {place}: {folders} folder(s). Its {notes} Note filing(s) are linked, not duplicated — each Note is still one Note.', {
        name: folderDisplayName(node), place: placeLabel(picked), folders, notes: placements,
      }));
      await refreshAll();
    }

    /** Delete = Trash (decision 42.1: never an erase). The service refuses, before any write, a folder whose subtree still holds Notes (M4); its own sentence is shown in words. */
    async function deleteFolder(node) {
      const outcome = await runFolderWrite(
        () => trashFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, ownerUid: auth.currentUser.uid, folderId: node.folderId, actorUid: auth.currentUser.uid }),
        { collection: TENANT.NOTE_FOLDERS, action: "trashFolder" }
      );
      if (!outcome.ok) return;
      showPageStatus(t('Folder "{name}" moved to Trash. Open 🗑 Trash from the ⋯ menu to restore it.', { name: folderDisplayName(node) }));
      await refreshAll();
    }

    function activeFilingFolderIds(note) {
      return new Set(allPlacements.filter((p) => p.noteId === note.noteId && p.status === NOTE_STATUS.ACTIVE).map((p) => p.folderId));
    }

    async function copyNoteTo(note) {
      const filed = activeFilingFolderIds(note);
      const picked = await openFolderPicker({
        title: t('Copy "{title}" to…', { title: noteTitleOf(note) }),
        refuse: (dest) => (dest?.folderId && filed.has(dest.folderId) ? t("This note is already filed in that folder.") : null),
      });
      if (!picked) return;
      const toFolderId = await ensureRealFolder(picked);
      if (!toFolderId) return;
      const outcome = await runFolderWrite(
        () => copyNoteToFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, ownerUid: auth.currentUser.uid, noteId: note.noteId, toFolderId, actorUid: auth.currentUser.uid }),
        { collection: TENANT.NOTE_PLACEMENTS, action: "copyNoteToFolder" }
      );
      if (!outcome.ok) return;
      showPageStatus(t('"{title}" copied to {folder}. It now shows in both folders — still one Note, not a duplicate.', { title: noteTitleOf(note), folder: folderDisplayName(picked) }));
      await refreshAll();
    }

    async function moveNoteTo(note, fromNode) {
      const filed = activeFilingFolderIds(note);
      const picked = await openFolderPicker({
        title: t('Move "{title}" to…', { title: noteTitleOf(note) }),
        refuse: (dest) => (dest?.folderId && filed.has(dest.folderId) ? t("This note is already filed in that folder.") : null),
      });
      if (!picked) return;
      const toFolderId = await ensureRealFolder(picked);
      if (!toFolderId) return;
      const outcome = await runFolderWrite(
        () => moveNote(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, ownerUid: auth.currentUser.uid, noteId: note.noteId, fromFolderId: fromNode.folderId, toFolderId, actorUid: auth.currentUser.uid }),
        { collection: TENANT.NOTE_PLACEMENTS, action: "moveNote" }
      );
      if (!outcome.ok) return;
      showPageStatus(t('"{title}" moved to {folder}.', { title: noteTitleOf(note), folder: folderDisplayName(picked) }));
      await refreshAll();
    }

    // -- 🗑 Trash: retired folders and Notes, each with Restore. No erase, no Empty Trash (decision 42.1). --
    let trashRenderToken = 0;
    let viewBeforeTrash = "folders";
    function openTrash() {
      if (currentView !== "trash") viewBeforeTrash = currentView;
      currentView = "trash";
      renderToggle();
      renderCurrentView();
    }
    function closeTrash() {
      currentView = VALID_VIEWS.includes(viewBeforeTrash) ? viewBeforeTrash : "folders";
      renderToggle();
      renderCurrentView();
    }
    async function renderTrashView() {
      const token = ++trashRenderToken;
      const head = `<div class="trash-head"><button type="button" class="secondary tiny" id="trashBackBtn">← ${escapeHtml(t("Back"))}</button><h2 class="trash-title">🗑 ${escapeHtml(t("Trash"))}</h2></div>
        <p class="note">${escapeHtml(t("Nothing here is erased. Restore brings a folder or Note back where it was."))}</p>`;
      viewTrash.innerHTML = head + `<p class="note" id="trashLoading">${escapeHtml(t("Loading Trash…"))}</p>`;
      viewTrash.querySelector("#trashBackBtn").addEventListener("click", closeTrash);
      if (!activeTenantId || !selectedPersonId) { viewTrash.querySelector("#trashLoading").textContent = t("Trash is empty."); return; }
      let trash;
      try {
        trash = await loadOwnerTrash(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId });
      } catch (err) {
        console.error("[trash load]", err);
        if (token === trashRenderToken) showPageStatus(t("Couldn't load Trash — please try again."));
        return;
      }
      if (token !== trashRenderToken || currentView !== "trash") return;
      const byId = new Map([...rawFolderList(folderTree), ...trash.folders].map((f) => [f.folderId, f]));
      const placeOf = (folder) => {
        const chain = [];
        const seen = new Set([folder.folderId]);
        let cursor = folder.parentFolderId ? byId.get(folder.parentFolderId) : null;
        while (cursor && !seen.has(cursor.folderId)) { chain.unshift(folderDisplayName(cursor)); seen.add(cursor.folderId); cursor = cursor.parentFolderId ? byId.get(cursor.parentFolderId) : null; }
        return chain.join(" › ") || t("(Top level)");
      };
      const noteFolderNames = (note) => {
        const names = allPlacements.filter((p) => p.noteId === note.noteId).map((p) => byId.get(p.folderId)).filter(Boolean).map(folderDisplayName);
        return names.length ? [...new Set(names)].join(", ") : t("(no folder)");
      };
      const restoreBtn = isSelfSelected() ? `<button type="button" class="secondary tiny" data-trash-restore>${escapeHtml(t("Restore"))}</button>` : "";
      let html = head;
      if (trash.folders.length === 0 && trash.notes.length === 0) {
        html += `<p id="trashEmpty">${escapeHtml(t("Trash is empty."))}</p>`;
      } else {
        html += `<ul class="trash-list" data-trash-list>`;
        for (const f of trash.folders) {
          html += `<li class="trash-row" data-trash-folder-id="${escapeHtml(f.folderId)}"><div class="trash-row-text"><span class="folder-row-name">📁 ${escapeHtml(folderDisplayName(f))}</span><span class="note">${escapeHtml(t("Was in: {place}", { place: placeOf(f) }))} · ${escapeHtml(when(f.updatedAt))}</span></div>${restoreBtn}</li>`;
        }
        for (const n of trash.notes) {
          html += `<li class="trash-row" data-trash-note-id="${escapeHtml(n.noteId)}"><div class="trash-row-text"><span class="folder-row-name">📄 ${escapeHtml(noteTitleOf(n))}</span><span class="note">${escapeHtml(t("Was in: {place}", { place: noteFolderNames(n) }))} · ${escapeHtml(when(n.updatedAt))}</span></div>${restoreBtn}</li>`;
        }
        html += `</ul>`;
        if (trash.truncated) html += `<p class="note">${escapeHtml(t("Showing a large first batch only — there is more than could be loaded at once."))}</p>`;
      }
      viewTrash.innerHTML = html;
      viewTrash.querySelector("#trashBackBtn").addEventListener("click", closeTrash);
      viewTrash.querySelectorAll("[data-trash-folder-id]").forEach((li) => {
        const folder = trash.folders.find((f) => f.folderId === li.dataset.trashFolderId);
        li.querySelector("[data-trash-restore]")?.addEventListener("click", async () => {
          const outcome = await runFolderWrite(
            () => restoreFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, ownerUid: auth.currentUser.uid, folderId: folder.folderId, actorUid: auth.currentUser.uid }),
            { collection: TENANT.NOTE_FOLDERS, action: "restoreFolder" }
          );
          if (!outcome.ok) return;
          showPageStatus(t('Folder "{name}" restored.', { name: folderDisplayName(folder) }));
          await refreshAll();
        });
      });
      viewTrash.querySelectorAll("[data-trash-note-id]").forEach((li) => {
        const note = trash.notes.find((n) => n.noteId === li.dataset.trashNoteId);
        li.querySelector("[data-trash-restore]")?.addEventListener("click", async () => {
          const outcome = await runFolderWrite(
            () => restoreNote(db, { tenantId: activeTenantId, noteId: note.noteId, expectedRevisionId: note.currentRevisionId, actorUid: auth.currentUser.uid }),
            { collection: TENANT.NOTES, action: "restoreNote" }
          );
          if (!outcome.ok) return;
          showPageStatus(t('"{title}" restored.', { title: noteTitleOf(note) }));
          await refreshAll();
        });
      });
    }
    document.getElementById("openTrashBtn").textContent = `🗑 ${t("Trash")}`;
    document.getElementById("openTrashBtn").addEventListener("click", () => { closeAllBarPalettes(null); openTrash(); });

    /**
     * ▲▼ move a folder among its siblings -- single-field updates, not a
     * transaction: a partial failure leaves a display-order quirk (I5:
     * nothing is keyed by `order`), never a corruption. `planReorder()`
     * renumbers the whole sibling sequence by display position and writes
     * only what actually changed (P6-G, issue #234's own fix, unchanged
     * here -- only its CALL SITE, now the tree's ⋯ menu, is new).
     */
    async function reorderFolderSwap(siblings, idx, direction) {
      const other = idx + direction;
      if (!siblings[idx] || !siblings[other]) return;
      const writes = planReorder(siblings.map((f) => ({ id: f.folderId, order: f.order ?? 0 })), idx, direction);
      for (const write of writes) {
        const outcome = await runFolderWrite(
          () => reorderFolder(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: write.id, order: write.order, actorUid: auth.currentUser.uid }),
          { collection: TENANT.NOTE_FOLDERS, action: "reorderFolder" }
        );
        if (!outcome.ok) return;
      }
      await refreshAll();
    }

    /**
     * ▲▼ for a Note filed in an open folder -- P6-E's `reorderFiling()`,
     * moved the same way `reorderFolderSwap()` moves folder siblings.
     * Unchanged from P6-G (issue #234): only its call site (a note leaf's
     * own buttons, rather than the old single-open-folder view) is new.
     */
    async function reorderNoteInFolder(rows, idx, direction) {
      const other = idx + direction;
      if (!rows[idx]?.placement || !rows[other]?.placement) return;
      const writes = planReorder(rows.map((r) => ({ id: r.placement.placementId, order: r.placement.order ?? 0 })), idx, direction);
      for (const write of writes) {
        const outcome = await runFolderWrite(
          () => reorderFiling(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, placementId: write.id, order: write.order, actorUid: auth.currentUser.uid }),
          { collection: TENANT.NOTE_PLACEMENTS, action: "reorderFiling" }
        );
        if (!outcome.ok) return;
      }
      await refreshAll();
    }

    function emptyStateFor(node) {
      if (node.semanticRole === "journey-map") return t("Your Personal Journey Map is empty so far — Notes you file here will appear as your own journey through what you've studied.");
      if (node.semanticRole === "reflection-archive") return t("Your Reflection Archive is empty so far — file a Note here to keep it as a longer-term reflection, separate from your day-to-day journey.");
      return t("This folder is empty.");
    }

    // -- Toolbar: search (folders + Note titles, in the already-loaded data,
    // no new read), "Show numbers", and A-/A+ tree text size. --
    function folderToolbarHtml() {
      return `<div class="folder-toolbar">
        <input type="text" id="folderSearchInput" class="folder-search-input" placeholder="${escapeHtml(t("Search folders and Notes…"))}" value="${escapeHtml(folderSearchQuery)}" aria-label="${escapeHtml(t("Search folders and Notes…"))}" />
        <label class="folder-toolbar-check"><input type="checkbox" id="folderShowNumbers" ${showNumbers ? "checked" : ""} /> ${t("Show numbers")}</label>
        <span class="folder-textsize-group">
          <button type="button" id="folderTextSizeDown" class="secondary tiny" aria-label="${escapeHtml(t("Smaller text"))}" ${treeTextSizeIndex <= 0 ? "disabled" : ""}>A−</button>
          <button type="button" id="folderTextSizeUp" class="secondary tiny" aria-label="${escapeHtml(t("Larger text"))}" ${treeTextSizeIndex >= TEXT_SIZE_SCALES.length - 1 ? "disabled" : ""}>A+</button>
        </span>
      </div>`;
    }
    function wireFolderToolbar() {
      const input = document.getElementById("folderSearchInput");
      input?.addEventListener("input", () => {
        folderSearchQuery = input.value;
        renderFoldersView();
        // Re-rendering replaces the <input> itself (this app's own standing
        // "re-render wipes UI state" lesson) -- focus and caret position are
        // threaded back in explicitly so typing is not interrupted.
        const restored = document.getElementById("folderSearchInput");
        if (restored) { restored.focus(); restored.setSelectionRange(restored.value.length, restored.value.length); }
      });
      document.getElementById("folderShowNumbers")?.addEventListener("change", (e) => { showNumbers = e.target.checked; saveShowNumbers(); renderFoldersView(); });
      document.getElementById("folderTextSizeDown")?.addEventListener("click", () => { if (treeTextSizeIndex > 0) { treeTextSizeIndex -= 1; saveTreeTextSizeIndex(); renderFoldersView(); } });
      document.getElementById("folderTextSizeUp")?.addEventListener("click", () => { if (treeTextSizeIndex < TEXT_SIZE_SCALES.length - 1) { treeTextSizeIndex += 1; saveTreeTextSizeIndex(); renderFoldersView(); } });
    }

    function folderSearchResultsHtml(query) {
      const folderMatches = flattenFolders(mergedRoots()).map(({ folder }) => folder)
        .filter((f) => folderDisplayName(f).toLowerCase().includes(query));
      const noteMatches = allNotes.filter((n) => (n.title || "").toLowerCase().includes(query));
      if (folderMatches.length === 0 && noteMatches.length === 0) {
        return `<p id="emptyMsg">${escapeHtml(t('No folders or Notes match "{query}".', { query: folderSearchQuery.trim() }))}</p>`;
      }
      let html = `<ul class="folder-search-results" data-folder-search-results>`;
      for (const f of folderMatches) {
        const crumb = folderAncestorPath(f.folderId).map((a) => folderDisplayName(a)).join(" › ") || t("All folders");
        html += `<li class="folder-search-result" data-search-folder-id="${escapeHtml(f.folderId ?? "")}" data-search-folder-role="${escapeHtml(f.semanticRole)}">
          <span class="folder-row-name">${escapeHtml(folderDisplayName(f))}</span>
          <span class="folder-search-breadcrumb">${escapeHtml(crumb)}</span>
        </li>`;
      }
      for (const note of noteMatches) {
        html += `<li class="folder-search-result folder-search-result-note" data-search-note-id="${escapeHtml(note.noteId)}">
          <span class="note-card-title">📄 ${escapeHtml(note.title?.trim() || t("(untitled)"))}</span>
        </li>`;
      }
      html += `</ul>`;
      return html;
    }
    function wireFolderSearchResults() {
      const container = document.querySelector("[data-folder-search-results]");
      if (!container) return;
      container.querySelectorAll("[data-search-folder-id]").forEach((li) => {
        li.addEventListener("click", () => {
          const folderId = li.dataset.searchFolderId || null;
          const role = li.dataset.searchFolderRole;
          const node = findNodeByIdOrRole(mergedRoots(), folderId, role);
          if (!node) return;
          for (const ancestor of folderAncestorPath(folderId)) expandedFolderIds.add(expandKeyFor(ancestor));
          saveExpandedIds();
          folderSearchQuery = "";
          renderFoldersView();
          requestAnimationFrame(() => {
            document.querySelector(`.folder-row[data-folder-id="${CSS.escape(folderId ?? "")}"][data-folder-role="${CSS.escape(role)}"]`)
              ?.scrollIntoView({ block: "center" });
          });
        });
      });
      container.querySelectorAll("[data-search-note-id]").forEach((li) => {
        li.addEventListener("click", () => {
          const noteId = li.dataset.searchNoteId;
          for (const placement of allPlacements.filter((p) => p.noteId === noteId && p.status === NOTE_STATUS.ACTIVE)) {
            const target = findNodeByIdOrRole(mergedRoots(), placement.folderId, null);
            if (!target) continue;
            for (const ancestor of folderAncestorPath(placement.folderId)) expandedFolderIds.add(expandKeyFor(ancestor));
            expandedFolderIds.add(expandKeyFor(target));
          }
          expandedNoteIds.add(noteId);
          saveExpandedIds();
          folderSearchQuery = "";
          renderFoldersView();
          requestAnimationFrame(() => {
            document.querySelector(`[data-note-leaf][data-note-id="${CSS.escape(noteId)}"]`)?.scrollIntoView({ block: "center" });
          });
        });
      });
    }

    // -- Footer: the 📍 target line and "+ New folder". --
    function folderFooterHtml() {
      if (!isSelfSelected()) return "";
      const targetLabel = newFolderTargetNode ? folderDisplayName(newFolderTargetNode) : t("Top level");
      return `<div class="folder-footer">
        <p class="folder-footer-target">${escapeHtml(t("New folder in: {target}", { target: targetLabel }))}${newFolderTargetNode ? ` <button type="button" id="clearFolderTarget" class="secondary tiny" aria-label="${escapeHtml(t("Clear target"))}">✕</button>` : ""}</p>
        <form id="newFolderForm">
          <input type="text" id="newFolderName" placeholder="${escapeHtml(t("Folder name"))}" />
          <button type="submit">${t("+ New folder")}</button>
        </form>
      </div>`;
    }
    function wireNewFolderForm() {
      document.getElementById("clearFolderTarget")?.addEventListener("click", () => { newFolderTargetNode = null; renderFoldersView(); });
      const form = document.getElementById("newFolderForm");
      if (!form) return;
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("newFolderName").value.trim();
        if (!name) return;
        const target = newFolderTargetNode;
        const parentFolderId = target ? await ensureRealFolder(target) : null;
        if (target && !parentFolderId) return;
        // P6-G's own fix (issue #234), now generalised to a pinned target
        // (issue #259): order against the real CURRENT siblings at whichever
        // level the folder is landing -- the user-folder roots when nothing
        // is pinned, unchanged from P6-G, or the pinned target's own real
        // children once one is.
        const order = target
          ? nextOrder((findNodeByIdOrRole(mergedRoots(), parentFolderId, null)?.children ?? []))
          : nextOrder(mergedRoots().filter((f) => !isSystemFolderRole(f.semanticRole)));
        const outcome = await safeWrite(
          () => createNoteFolder(db, {
            tenantId: activeTenantId, ownerPersonId: selectedPersonId, ownerUid: auth.currentUser.uid,
            name, semanticRole: "user", parentFolderId, order, actorUid: auth.currentUser.uid,
          }),
          { collection: TENANT.NOTE_FOLDERS, action: "createNoteFolder" }
        );
        if (!outcome.ok) return;
        if (parentFolderId) { expandedFolderIds.add(parentFolderId); saveExpandedIds(); }
        showPageStatus(t('Folder "{name}" created.', { name }));
        await refreshAll();
      });
    }

    // =====================================================================
    // OPTION B -- Timeline
    // =====================================================================
    function timelineFilters() {
      const roots = mergedRoots();
      return [
        { key: "everything", label: t("Everything") },
        ...roots.map((f) => ({ key: f.folderId ? `folder:${f.folderId}` : `role:${f.semanticRole}`, label: folderDisplayName(f), node: f })),
      ];
    }

    async function timelineNotesForFilter() {
      if (timelineFilter === "everything") return allNotes;
      const filters = timelineFilters();
      const chosen = filters.find((f) => f.key === timelineFilter);
      if (!chosen?.node) return allNotes;
      if (!chosen.node.folderId) return []; // a virtual folder with no document has nothing filed in it
      const { rows } = await folderContents(db, { tenantId: activeTenantId, ownerPersonId: selectedPersonId, folderId: chosen.node.folderId });
      return rows.map((r) => r.note);
    }

    // A token, not just an element lookup, is what keeps a slow filter
    // switch from overwriting a faster later one: clicking a second chip
    // before the first's folderContents() read resolves re-renders the
    // chips AND a fresh #timelineBody, so a bare getElementById() after the
    // await would find (and wrongly fill) the SECOND click's own container
    // with the FIRST click's stale results.
    let timelineRenderToken = 0;
    async function renderTimelineView() {
      const myToken = ++timelineRenderToken;
      const filters = timelineFilters();
      const chipsHtml = `<div class="filter-chips">${filters.map((f) =>
        `<button type="button" class="filter-chip" data-filter="${escapeHtml(f.key)}" aria-pressed="${f.key === timelineFilter}">${escapeHtml(f.label)}</button>`).join("")}</div>`;
      viewTimeline.innerHTML = chipsHtml + `<div id="timelineBody"><p class="note">${t("Loading…")}</p></div>`;
      viewTimeline.querySelectorAll("[data-filter]").forEach((btn) => {
        btn.addEventListener("click", () => { timelineFilter = btn.dataset.filter; renderTimelineView(); });
      });

      const notes = await timelineNotesForFilter();
      if (myToken !== timelineRenderToken) return; // a later click already superseded this one
      const body = document.getElementById("timelineBody");
      if (!body) return; // the view was switched away while this was loading
      // Issue #282 -- the "Everything" filter reads allNotes DIRECTLY
      // (timelineNotesForFilter() above), with no read of its own to await,
      // so an empty array here can mean either "genuinely no Notes yet" or
      // "still loading" -- and the two must never look the same. A per-folder
      // filter already makes its own real read (folderContents()) and is
      // unaffected.
      if (timelineFilter === "everything" && !notesAndPlacementsLoaded) {
        body.innerHTML = `<p class="note">${escapeHtml(t("Loading your Notes…"))}</p>`;
        return;
      }
      if (notes.length === 0) {
        body.innerHTML = `<p id="emptyMsg">${escapeHtml(t("Nothing here yet — Notes you write will appear on your timeline the day you write them."))}</p>`;
        return;
      }
      // Newest first, grouped by calendar day (the issue's own spec).
      const sorted = [...notes].sort((a, b) => (displayTimestamp(b)?.toMillis?.() ?? 0) - (displayTimestamp(a)?.toMillis?.() ?? 0));
      let lastDay = null;
      let html = "";
      for (const note of sorted) {
        const d = displayTimestamp(note)?.toDate ? displayTimestamp(note).toDate() : null;
        const dayKey = d ? d.toDateString() : t("Unknown date");
        if (dayKey !== lastDay) { html += `<div class="timeline-day">${escapeHtml(d ? d.toLocaleDateString() : t("Unknown date"))}</div>`; lastDay = dayKey; }
        html += noteCardHtml(note, { fileControl: true });
      }
      body.innerHTML = html;
      wireNoteCards(body, sorted);
    }

    // =====================================================================
    // OPTION C -- Path: a BRANCHING tree with links (issue #267)
    // =====================================================================
    // Owner decision, 25 Sep 2026: "Path view: branching with links."
    // Supersedes v08.37's own honest-first-pass straight track (kept above
    // as history in CHANGELOG.md), whose own comment named exactly this gap:
    // a Note filed in two folders cannot sit in two places on one straight
    // line. The answer built here is the one the Owner chose -- each folder
    // is its own branch (mergedRoots()/buildFolderTree(), the identical tree
    // Folders already draws), a folder's own filed Notes are stops along it
    // ordered oldest first, and a Note filed in more than one folder carries
    // a 🔗 badge on every appearance; tapping one highlights every
    // appearance and draws a connecting line between them.
    //
    // SIZE (the issue's own #3): the Owner's imported site will carry
    // roughly 1,464 folders and 1,091 Notes (issue #265). Branches below the
    // top two levels start COLLAPSED (pathBranchExpanded()) and a folder's
    // own stops beyond PATH_STOPS_PER_BRANCH are grouped as "+N more" --
    // both session-only, never persisted, and both bounded so a tap only
    // ever grows the rendered tree by what it reveals. pathStopIndex() is
    // the one place that walks every placement, ONCE per render, O(P) --
    // no layout step here is quadratic in the number of Notes.
    const PATH_STOPS_PER_BRANCH = 20;
    let pathForceExpanded = new Set();
    let pathForceCollapsed = new Set();
    let pathRevealedBranches = new Set(); // folderId -> its own "+N more" already revealed
    let pathHighlightedNoteId = null;

    /** Top two levels (0 and 1) start expanded; anything a reader has explicitly toggled wins over that default, in either direction. */
    function pathBranchExpanded(key, depth) {
      if (pathForceCollapsed.has(key)) return false;
      if (pathForceExpanded.has(key)) return true;
      return depth <= 1;
    }
    function togglePathBranch(key, depth) {
      const now = pathBranchExpanded(key, depth);
      if (now) { pathForceCollapsed.add(key); pathForceExpanded.delete(key); }
      else { pathForceExpanded.add(key); pathForceCollapsed.delete(key); }
      renderPathView();
    }

    /**
     * ONE pass over allPlacements -- `byFolder`: folderId -> that folder's own
     * active Notes (deduplicated by noteId, a Map so a stray duplicate
     * placement cannot double a stop), sorted oldest-first afterwards;
     * `foldersByNote`: noteId -> every folder it is filed in, in placement
     * order. Mirrors folderContents()'s/notesInFolder()'s own two exclusions
     * (a retired Note, or a placement naming one) so a Path stop is exactly
     * what Folders would show for the same folder.
     */
    function pathStopIndex() {
      const notesById = new Map(allNotes.map((n) => [n.noteId, n]));
      const byFolder = new Map();
      const foldersByNote = new Map();
      for (const p of allPlacements) {
        if (p.status !== NOTE_STATUS.ACTIVE) continue;
        const note = notesById.get(p.noteId);
        if (!note || note.status !== NOTE_STATUS.ACTIVE) continue;
        if (!byFolder.has(p.folderId)) byFolder.set(p.folderId, new Map());
        byFolder.get(p.folderId).set(note.noteId, note);
        if (!foldersByNote.has(p.noteId)) foldersByNote.set(p.noteId, []);
        const folders = foldersByNote.get(p.noteId);
        if (!folders.includes(p.folderId)) folders.push(p.folderId);
      }
      const byFolderArrays = new Map();
      for (const [folderId, notes] of byFolder) {
        byFolderArrays.set(folderId, [...notes.values()].sort((a, b) => pathStopDate(a) - pathStopDate(b)));
      }
      return { byFolder: byFolderArrays, foldersByNote };
    }
    /** Issue #267's own instruction: originalCreatedAt when present (issue #265 adds it), otherwise createdAt. */
    function pathStopDate(note) {
      const ts = note.originalCreatedAt ?? note.createdAt;
      return ts?.toMillis ? ts.toMillis() : 0;
    }

    /** Every branch a Note appears on, expanded and its own "+N more" revealed, so a highlighted stop always has somewhere real to draw a line to. */
    function ensurePathVisible(noteId, index) {
      for (const folderId of index.foldersByNote.get(noteId) ?? []) {
        for (const ancestor of folderAncestorPath(folderId)) {
          const key = expandKeyFor(ancestor);
          pathForceExpanded.add(key); pathForceCollapsed.delete(key);
        }
        pathRevealedBranches.add(folderId);
      }
    }
    function togglePathHighlight(noteId, index) {
      if (pathHighlightedNoteId === noteId) { pathHighlightedNoteId = null; }
      else { pathHighlightedNoteId = noteId; ensurePathVisible(noteId, index); }
      renderPathView();
    }
    // Escape clears an open highlight -- wired once, at module load, guarded
    // on the Path view actually being the one on screen (the same guard
    // every other cross-view keyboard shortcut in this app would need).
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && currentView === "path" && pathHighlightedNoteId !== null) {
        pathHighlightedNoteId = null;
        renderPathView();
      }
    });

    function renderPathView() {
      // Issue #282 -- Path draws its own BRANCH structure (mergedRoots(), the
      // same folder tree Folders draws) the moment it is loaded, exactly like
      // Folders -- it does not wait for Notes/placements just to show a
      // reader their own folders as branches. Only the empty-path message
      // (which claims there is NOTHING to show at all) needs the distinction:
      // an empty allNotes here can mean "still loading" rather than
      // "genuinely no Notes yet", and the two must not read the same.
      if (allNotes.length === 0 && notesAndPlacementsLoaded) {
        viewPath.innerHTML = `<p id="emptyMsg">${escapeHtml(t("Your path is empty so far — every Note you write will appear here as a new stop, oldest to newest."))}</p>`;
        return;
      }
      const index = pathStopIndex();
      const anyLinked = [...index.foldersByNote.values()].some((folders) => folders.length > 1);
      let html = "";
      if (foldersTruncated) {
        html += `<p id="pathTruncatedMsg">${escapeHtml(t("Showing a large first batch only — there is more than could be loaded at once."))}</p>`;
      }
      if (!notesAndPlacementsLoaded) {
        html += `<p id="pathNotesLoadingMsg" class="note">${escapeHtml(t("Notes are still loading — stops will appear on their branch as they arrive."))}</p>`;
      }
      if (anyLinked) {
        html += `<p class="path-hint">${escapeHtml(t("A Note filed in more than one folder shows a 🔗 badge — tap it to see every place it appears."))}</p>`;
      }
      html += `<div id="pathTree" data-path-tree>${mergedRoots().map((f) => pathBranchHtml(f, 0, index)).join("")}</div>`;
      viewPath.innerHTML = html;
      wirePathTree(index);
      if (pathHighlightedNoteId) applyPathHighlight(index);
    }

    /** One branch (folder), then -- if expanded -- its own child branches followed by its own stops, the same child-folders-then-leaves order the Folders tree already uses. */
    function pathBranchHtml(f, depth, index) {
      const childFolders = (f.children ?? []).slice().sort(byOrder);
      const stops = index.byFolder.get(f.folderId) ?? [];
      const key = expandKeyFor(f);
      const expandable = childFolders.length > 0 || stops.length > 0;
      const expanded = pathBranchExpanded(key, depth);
      const toggle = expandable
        ? `<button type="button" class="path-branch-toggle" data-path-branch-toggle="${escapeHtml(key)}" data-path-depth="${depth}" aria-expanded="${expanded}" aria-label="${expanded ? escapeHtml(t("Collapse")) : escapeHtml(t("Expand"))}">${expanded ? "▾" : "▶"}</button>`
        : `<span class="path-branch-toggle path-branch-toggle-leaf" aria-hidden="true">▶</span>`;
      // Issue #282 -- "…" while Notes/placements are still loading, the same
      // provisional-count rule folderRowHtml()'s own badge already applies.
      const badge = !notesAndPlacementsLoaded
        ? `<span class="path-branch-count" data-branch-count-loading>…</span>`
        : (stops.length > 0 ? `<span class="path-branch-count">${stops.length}</span>` : "");
      let html = `<div class="path-branch${isSystemFolderRole(f.semanticRole) ? " system" : ""}" data-path-branch data-branch-key="${escapeHtml(key)}">
        <div class="path-branch-head" data-path-branch-head>${toggle}<span class="path-branch-name">${escapeHtml(folderDisplayName(f))}</span>${badge}</div>`;
      if (expanded) {
        html += `<div class="path-branch-body">`;
        if (!expandable) {
          html += `<p class="path-branch-empty">${escapeHtml(emptyStateFor(f))}</p>`;
        } else {
          for (const child of childFolders) html += pathBranchHtml(child, depth + 1, index);
          if (stops.length) html += pathStopsHtml(f, stops, index);
        }
        html += `</div>`;
      }
      html += `</div>`;
      return html;
    }

    /** A folder's own stops, capped at PATH_STOPS_PER_BRANCH unless this exact folder's "+N more" was already tapped this session. */
    function pathStopsHtml(f, stops, index) {
      const revealed = pathRevealedBranches.has(f.folderId);
      const shown = revealed ? stops : stops.slice(0, PATH_STOPS_PER_BRANCH);
      const remaining = stops.length - shown.length;
      let html = `<div class="path-stops" data-path-stops>${shown.map((note) => pathStopHtml(note, index)).join("")}</div>`;
      if (remaining > 0) {
        html += `<button type="button" class="secondary tiny path-more-btn" data-path-more="${escapeHtml(f.folderId)}">${escapeHtml(t("+{count} more", { count: remaining }))}</button>`;
      }
      return html;
    }

    /** One stop -- the shared noteCardHtml() component, exactly as Timeline renders it, with a 🔗 badge injected into its own head when this Note sits on more than one branch. */
    function pathStopHtml(note, index) {
      const ts = note.originalCreatedAt ?? note.createdAt;
      const d = ts?.toDate ? ts.toDate() : null;
      const folderCount = (index.foldersByNote.get(note.noteId) ?? []).length;
      const linkLabel = t("In {count} places", { count: folderCount });
      const badge = folderCount > 1
        ? `<button type="button" class="path-link-badge" data-path-link-badge aria-label="${escapeHtml(linkLabel)}" title="${escapeHtml(linkLabel)}">🔗 ${folderCount}</button>`
        : "";
      return `<div class="path-stop" data-stop-note-id="${escapeHtml(note.noteId)}">
        <div class="path-stop-marker"></div>
        <div class="path-stop-date">${escapeHtml(d ? d.toLocaleDateString() : "")}</div>
        ${noteCardHtml(note, { fileControl: true, extraHead: badge })}
      </div>`;
    }

    function wirePathTree(index) {
      const container = document.querySelector("[data-path-tree]");
      if (!container) return;
      container.querySelectorAll("[data-path-branch-toggle]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          togglePathBranch(btn.dataset.pathBranchToggle, Number(btn.dataset.pathDepth));
        });
      });
      container.querySelectorAll("[data-path-branch-head]").forEach((head) => {
        head.addEventListener("click", (e) => {
          if (e.target.closest(".path-branch-toggle")) return; // its own listener above already handled this tap
          const toggleEl = head.querySelector("[data-path-branch-toggle]");
          if (toggleEl) togglePathBranch(toggleEl.dataset.pathBranchToggle, Number(toggleEl.dataset.pathDepth));
        });
      });
      container.querySelectorAll("[data-path-more]").forEach((btn) => {
        btn.addEventListener("click", () => { pathRevealedBranches.add(btn.dataset.pathMore); renderPathView(); });
      });
      wireNoteCards(container, allNotes);
      container.querySelectorAll("[data-path-link-badge]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const noteId = btn.closest("[data-note-id]")?.dataset.noteId;
          if (noteId) togglePathHighlight(noteId, index);
        });
      });
    }

    /**
     * Highlights every rendered appearance of the highlighted Note (its
     * ensurePathVisible() call already guaranteed each one is expanded and
     * on screen) and draws a dashed line from the first appearance to every
     * other one, as a small absolutely-positioned SVG overlay sized to the
     * tree's own scrolled content -- pointer-events: none, so it can never
     * steal a tap from a branch toggle or a stop underneath it.
     */
    function applyPathHighlight(index) {
      const container = document.querySelector("[data-path-tree]");
      if (!container || !pathHighlightedNoteId) return;
      const matches = [...container.querySelectorAll(`.note-card[data-note-id="${CSS.escape(pathHighlightedNoteId)}"]`)];
      matches.forEach((el) => el.classList.add("path-note-highlighted"));
      container.querySelectorAll("[data-path-link-badge]").forEach((btn) => {
        if (btn.closest("[data-note-id]")?.dataset.noteId === pathHighlightedNoteId) btn.classList.add("active");
      });
      if (matches.length < 2) return;
      const containerRect = container.getBoundingClientRect();
      const points = matches.map((el) => {
        const r = el.getBoundingClientRect();
        return { x: r.left - containerRect.left + r.width / 2, y: r.top - containerRect.top + r.height / 2 };
      });
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("class", "path-link-lines");
      svg.setAttribute("data-path-link-lines", "");
      svg.setAttribute("width", String(container.scrollWidth));
      svg.setAttribute("height", String(container.scrollHeight));
      for (let i = 1; i < points.length; i++) {
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", points[0].x); line.setAttribute("y1", points[0].y);
        line.setAttribute("x2", points[i].x); line.setAttribute("y2", points[i].y);
        svg.appendChild(line);
      }
      container.appendChild(svg);
    }

    // -----------------------------------------------------------------------
    // Sign-in / bootstrap -- same shape as notes.html / bookmarks.html.
    // -----------------------------------------------------------------------
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        whoEl.textContent = t("Not signed in.");
        signInBtn.style.display = "inline-block";
        signOutBtn.style.display = "none";
        appEl.style.display = "none";
        return;
      }
      whoEl.textContent = t("Signed in as {email}", { email: user.email });
      signInBtn.style.display = "none";
      signOutBtn.style.display = "inline-block";

      try {
        const userIndexSnap = await getDoc(doc(db, TENANT.USER_INDEX, user.uid));
        if (adoptAppLangFromUserIndex(userIndexSnap)) return;
        const defaultTenantId = userIndexSnap.exists() ? userIndexSnap.data().defaultTenantId : null;
        const { context, memberships } = await bootstrapContext(db, user.uid, defaultTenantId);
        if (!context) {
          whoEl.innerHTML += noAccountMessageHtml();
          return;
        }
        activeTenantId = context.tenantId;
        myMemberships = memberships;
        tenantSelect.innerHTML = myMemberships
          .map((m) => `<option value="${m.tenantId}" ${m.tenantId === activeTenantId ? "selected" : ""}>${m.tenantName} (${roleListLabel(m.roles)})</option>`)
          .join("");

        renderToggle();
        appEl.style.display = "block";
        await loadContextData();
      } catch (err) {
        console.error(err);
        whoEl.textContent += ` — ${err.message}`;
      }
    });
  </script>
</body>
</html>
