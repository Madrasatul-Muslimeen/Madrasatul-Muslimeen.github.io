<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="./css/shell.css" />
<title>QuranRevival — Course Offers</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem 4rem; color: #222; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.15rem; margin-top: 2.2rem; border-bottom: 1px solid #eee; padding-bottom: 0.3rem; }
  label { display: block; margin: 0.8rem 0 0.3rem; font-weight: 600; font-size: 0.92rem; }
  input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 0.45rem; font-size: 0.95rem; border: 1px solid #ccc; border-radius: 0.35rem; box-sizing: border-box; }
  .row { display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 10rem; }
  button {
    font-size: 0.92rem; padding: 0.4rem 0.9rem; border-radius: 0.4rem; border: 1px solid #ccc;
    background: #1F3A6E; color: white; cursor: pointer;
  }
  button.small { padding: 0.2rem 0.5rem; font-size: 0.8rem; }
  button.secondary { background: white; color: #1F3A6E; }
  button:disabled { opacity: 0.5; cursor: default; }
  fieldset { border: 1px solid #ddd; border-radius: 0.5rem; margin-top: 1rem; }
  .dayChecks label { display: inline-flex; align-items: center; gap: 0.3rem; font-weight: 400; margin: 0.2rem 0.6rem 0.2rem 0; }
  .dayChecks input { width: auto; }
  .card { border: 1px solid #eee; border-radius: 0.5rem; padding: 0.8rem; margin-top: 0.8rem; }
  .card h3 { margin: 0 0 0.3rem; font-size: 1rem; }
  .muted { color: #888; font-size: 0.85rem; }
  .pill { display: inline-block; padding: 0.05rem 0.5rem; border-radius: 0.7rem; font-size: 0.75rem; }
  .pill-active { background: #deede4; color: #2e6b4f; }
  .pill-ended, .pill-archived { background: #eee; color: #888; }
  #who { margin: 1rem 0; font-size: 0.95rem; color: #555; }
  .contextBar { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin: 1rem 0; font-size: 0.9rem; }
  .contextBar label { margin: 0; }

</style>
</head>
<body>
  <h1>Course Offers</h1>
  <p>A shared schedule several people follow together: create an offer, enrol
     people, and see who is in it.</p>

  <nav class="app-nav" id="topNav">
    <details class="nav-cat nav-cat-home">
      <summary>Home</summary>
      <div class="nav-cat-links">
        <a href="https://madrasatul-muslimeen.github.io/legacy/index.html" class="nav-legacy-link" target="_blank" rel="noopener">Legacy App - v06 ↗</a>
        <div id="who">Checking sign-in…</div>
        <button id="signInBtn" style="display:none;">Sign in with Google</button>
        <button id="signOutBtn" class="secondary" style="display:none;">Sign out</button>
        <div id="navHomeExtra"></div>
      </div>
    </details>
    <div id="navBar"></div>
  </nav>

  <div id="app" style="display:none;">
    <div class="contextBar">
      <label>Tenant
        <select id="tenantSelect" style="width:auto;"></select>
      </label>
      <label>Person
        <select id="personSelect" style="width:auto;"></select>
      </label>
    </div>

    <fieldset id="createFieldset" style="display:none;">
      <legend>New course offer</legend>
      <label for="offerNameInput">Name</label>
      <input type="text" id="offerNameInput" />
      <label>Subjects (optional)</label>
      <div class="dayChecks" id="subjectChecks"></div>
      <label>Runs on</label>
      <div class="dayChecks" id="dayChecks"></div>
      <div class="row">
        <div><label for="startDateInput">Start date (optional)</label><input type="date" id="startDateInput" /></div>
        <div><label for="endDateInput">End date (optional)</label><input type="date" id="endDateInput" /></div>
      </div>
      <label for="notesInput">Notes (optional)</label>
      <textarea id="notesInput" rows="2"></textarea>
      <button id="createOfferBtn" style="margin-top:0.8rem;">Create offer</button>
      <div id="createResult" class="muted"></div>
    </fieldset>

    <h2>Course offers</h2>
    <div id="offersBody"><p class="muted">Loading…</p></div>

    <h2 id="enrolmentsHeading">Enrolments</h2>
    <div id="enrolmentsBody"><p class="muted">Loading…</p></div>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-init.js";
    import {
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { TENANT } from "./js/collections.js";
    import { langText } from "./js/lang.js";
    import { roleListLabel } from "./js/labels.js";
    import { getAppLang, mountAppLangControl } from "./js/prefs.js";
    import { safeWrite } from "./js/errors.js";
    import {
      getMyMemberships,
      initializeActiveContext,
      getActiveContext,
      setActiveContext,
      effectiveRoles,
      scopedRoster,
    } from "./js/session-context.js";
    import { getSubjectTree } from "./js/catalogue.js";
    import {
      createCourseOffer, listCourseOffers, setCourseOfferStatus,
      enrolPerson, endEnrollment, listEnrollmentsForOffer, listEnrollmentsForPerson,
    } from "./js/course-offers.js";
    import { contextStatusLabel, roleInClassLabel } from "./js/course-offers.js";
    import { renderNavBar, renderHomeExtras, noAccountMessageHtml } from "./js/nav.js";
    import { translateStatic, t, num } from "./js/i18n.js";

    // Phase 1 of the full translation: turn this page's own static markup
    // (headings, labels, buttons) into the chosen language before anything
    // else runs, so a Bangla reader never sees an English frame first.
    translateStatic();

    const whoEl = document.getElementById("who");
    const signInBtn = document.getElementById("signInBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const appEl = document.getElementById("app");
    const navBar = document.getElementById("navBar");
    const navHomeExtra = document.getElementById("navHomeExtra");
    function renderNav(roles, viewAsRole) {
      navBar.innerHTML = renderNavBar(roles, viewAsRole);
      navHomeExtra.innerHTML = renderHomeExtras(roles);
      mountAppLangControl(navHomeExtra); // shell round 13 -- Settings -> Language; default handler reloads so every name comes back translated
    }
    const tenantSelect = document.getElementById("tenantSelect");
    const personSelect = document.getElementById("personSelect");
    const createFieldset = document.getElementById("createFieldset");
    const offerNameInput = document.getElementById("offerNameInput");
    const subjectChecks = document.getElementById("subjectChecks");
    const dayChecks = document.getElementById("dayChecks");
    const startDateInput = document.getElementById("startDateInput");
    const endDateInput = document.getElementById("endDateInput");
    const notesInput = document.getElementById("notesInput");
    const createOfferBtn = document.getElementById("createOfferBtn");
    const createResult = document.getElementById("createResult");
    const offersBody = document.getElementById("offersBody");
    const enrolmentsHeading = document.getElementById("enrolmentsHeading");
    const enrolmentsBody = document.getElementById("enrolmentsBody");

    // English short day names are the translation KEYS; the checkbox VALUE
    // stays the day number, which is what gets stored and read back.
    // Named *_LABELS so tools/i18n-coverage.mjs counts these seven words --
    // see its own note on the label-map convention.
    const DAY_NAME_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const dayName = (i) => t(DAY_NAME_LABELS[i] ?? "");
    dayChecks.innerHTML = DAY_NAME_LABELS.map((d, i) => `<label><input type="checkbox" value="${i}" /> ${t(d)}</label>`).join("");

    signInBtn.addEventListener("click", () => {
      signInWithPopup(auth, new GoogleAuthProvider()).catch((err) => {
        whoEl.textContent = t("Sign-in failed: {message}", { message: err.message });
      });
    });
    signOutBtn.addEventListener("click", () => signOut(auth));


    let activeTenantId = null;
    let myMemberships = [];
    let roster = [];
    let visibleRoster = [];
    let subjectTree = [];
    let offers = [];
    let canAdmin = false; // owner/prime -- create offers, manage any enrolment

    function currentPreview() {
      const context = getActiveContext();
      const activeMembership = myMemberships.find((m) => m.tenantId === activeTenantId);
      const realRoles = activeMembership?.roles ?? [];
      const viewAsRole = context?.viewAsRole ?? null;
      return { viewAsRole, effRoles: effectiveRoles(realRoles, viewAsRole), myPersonId: activeMembership?.personId ?? null };
    }

    async function loadContextData() {
      const rosterSnap = await getDocs(query(collection(db, TENANT.TENANT_PEOPLE), where("tenantId", "==", activeTenantId)));
      roster = rosterSnap.docs.map((d) => ({ id: d.id, ...d.data() }));

      const { viewAsRole, effRoles, myPersonId } = currentPreview();
      renderNav(myMemberships.find((m) => m.tenantId === activeTenantId)?.roles ?? [], viewAsRole);

      visibleRoster = scopedRoster(roster, effRoles, myPersonId);
      personSelect.innerHTML = visibleRoster
        .map((p) => `<option value="${p.id}">${langText(p.name, getAppLang(), p.id)}</option>`)
        .join("");

      canAdmin = effRoles.some((r) => ["owner", "prime"].includes(r));
      createFieldset.style.display = canAdmin ? "" : "none";

      subjectTree = await getSubjectTree(db, activeTenantId);
      const leaves = subjectTree.filter((n) => n.isTrackable && n.status !== "archived");
      subjectChecks.innerHTML = leaves
        .map((n) => `<label><input type="checkbox" value="${n.id}" /> ${langText(n.name, getAppLang(), n.id)}</label>`)
        .join("") || `<span class="muted">${t("No subjects yet.")}</span>`;

      await refreshOffers();
      await refreshEnrolments();
    }

    function subjectName(id) { const n = subjectTree.find((s) => s.id === id); return n ? langText(n.name, getAppLang(), id) : id; }
    function personName(id) { const p = roster.find((r) => r.id === id); return p ? langText(p.name, getAppLang(), id) : id; }
    function routineLine(routine) {
      const days = (routine?.daysOfWeek ?? []).map(dayName).join(", ");
      const range = [routine?.startDate, routine?.endDate].filter(Boolean).map(num).join(" – ");
      return [days, range].filter(Boolean).join(" · ") || t("No schedule set");
    }

    // -----------------------------------------------------------------------
    // Course offers.
    // -----------------------------------------------------------------------

    async function refreshOffers() {
      offersBody.innerHTML = `<p class="muted">${t("Loading…")}</p>`;
      try {
        offers = (await listCourseOffers(db, activeTenantId)).filter((o) => canAdmin || o.status === "active");
        offersBody.innerHTML = offers.length
          ? (await Promise.all(offers.map(renderOfferCard))).join("")
          : `<p class="muted">${t("No course offers yet.")}</p>`;
        wireOfferCardActions();
      } catch (err) {
        offersBody.innerHTML = `<p style="color:#9c3b2e;">${t("Couldn't load course offers:")} ${err.code ?? ""} ${err.message}</p>`;
        console.error(err);
      }
    }

    async function renderOfferCard(o) {
      const subjectsLine = (o.subjectIds ?? []).map(subjectName).join(", ") || t("(no subjects set)");
      const rosterHtml = canAdmin ? await renderOfferRoster(o) : "";
      // The whole button caption is one translatable sentence -- Bangla puts
      // the name before the verb, so "Enrol " + name cannot be assembled.
      const enrolBtn = `<button class="small enrolBtn" data-offer="${o.id}"></button>`;
      const archiveBtn = canAdmin && o.status === "active"
        ? `<button class="small secondary archiveOfferBtn" data-offer="${o.id}">${t("Archive")}</button>`
        : "";
      return `<div class="card">
        <h3>${langText(o.name, getAppLang(), o.id)} <span class="pill pill-${o.status}">${contextStatusLabel(o.status)}</span></h3>
        <div class="muted">${subjectsLine}</div>
        <div class="muted">${routineLine(o.routine)}</div>
        ${o.status === "active" ? `<div style="margin-top:0.5rem;">${enrolBtn} ${archiveBtn}</div>` : ""}
        ${rosterHtml}
      </div>`;
    }

    async function renderOfferRoster(o) {
      const enrolled = await listEnrollmentsForOffer(db, activeTenantId, o.id);
      const active = enrolled.filter((e) => e.status === "active");
      if (!active.length) return `<div class="muted" style="margin-top:0.4rem;">${t("No one enrolled yet.")}</div>`;
      const rows = active.map((e) => `<div class="muted">${personName(e.personId)} (${roleInClassLabel(e.roleInClass)}) <button class="small secondary endEnrolBtn" data-offer="${o.id}" data-person="${e.personId}">${t("End")}</button></div>`).join("");
      return `<div style="margin-top:0.5rem;">${rows}</div>`;
    }

    function wireOfferCardActions() {
      offersBody.querySelectorAll(".enrolBtn").forEach((btn) => {
        btn.textContent = t("Enrol {name}", { name: personName(personSelect.value) });
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          const outcome = await safeWrite(
            () => enrolPerson(db, activeTenantId, {
              contextId: btn.dataset.offer, personId: personSelect.value, roleInClass: "student", subjectIds: [],
            }, auth.currentUser.uid),
            { collection: "enrollments", action: "enrolPerson" }
          );
          btn.disabled = false;
          if (outcome.ok) { await refreshOffers(); await refreshEnrolments(); }
          else alert(outcome.entry.message);
        });
      });
      offersBody.querySelectorAll(".archiveOfferBtn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          const outcome = await safeWrite(
            () => setCourseOfferStatus(db, activeTenantId, btn.dataset.offer, "archived"),
            { collection: "courseOffers", action: "setCourseOfferStatus" }
          );
          if (outcome.ok) await refreshOffers();
          else { alert(outcome.entry.message); btn.disabled = false; }
        });
      });
      offersBody.querySelectorAll(".endEnrolBtn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          const outcome = await safeWrite(
            () => endEnrollment(db, activeTenantId, btn.dataset.offer, btn.dataset.person, auth.currentUser.uid),
            { collection: "enrollments", action: "endEnrollment" }
          );
          if (outcome.ok) { await refreshOffers(); await refreshEnrolments(); }
          else { alert(outcome.entry.message); btn.disabled = false; }
        });
      });
    }

    createOfferBtn.addEventListener("click", async () => {
      createResult.textContent = "";
      if (!offerNameInput.value.trim()) { createResult.textContent = t("Enter a name first."); return; }
      const subjectIds = Array.from(subjectChecks.querySelectorAll("input:checked")).map((c) => c.value);
      const daysOfWeek = Array.from(dayChecks.querySelectorAll("input:checked")).map((c) => Number(c.value));

      createOfferBtn.disabled = true;
      const outcome = await safeWrite(
        () => createCourseOffer(db, activeTenantId, {
          name: offerNameInput.value.trim(),
          moduleIds: [],
          subjectIds,
          routine: { daysOfWeek, startDate: startDateInput.value || null, endDate: endDateInput.value || null, notes: notesInput.value.trim() || null },
        }, auth.currentUser.uid),
        { collection: "courseOffers", action: "createCourseOffer" }
      );
      createOfferBtn.disabled = false;
      if (outcome.ok) {
        createResult.textContent = t("Course offer created.");
        offerNameInput.value = ""; startDateInput.value = ""; endDateInput.value = ""; notesInput.value = "";
        subjectChecks.querySelectorAll("input:checked").forEach((c) => (c.checked = false));
        dayChecks.querySelectorAll("input:checked").forEach((c) => (c.checked = false));
        await refreshOffers();
      } else {
        createResult.textContent = outcome.entry.message;
      }
    });

    // -----------------------------------------------------------------------
    // This person's own enrolments.
    // -----------------------------------------------------------------------

    async function refreshEnrolments() {
      const personId = personSelect.value;
      if (!personId) { enrolmentsBody.innerHTML = `<p class="muted">${t("Pick a person first.")}</p>`; return; }
      enrolmentsHeading.textContent = t("{name}'s enrolments", { name: personName(personId) });
      enrolmentsBody.innerHTML = `<p class="muted">${t("Loading…")}</p>`;
      try {
        const enrolments = await listEnrollmentsForPerson(db, activeTenantId, personId);
        const active = enrolments.filter((e) => e.status === "active");
        enrolmentsBody.innerHTML = active.length
          ? active.map((e) => {
              const offer = offers.find((o) => o.id === e.contextId);
              return `<div class="card"><strong>${offer ? langText(offer.name, getAppLang(), e.contextId) : e.contextId}</strong> — ${roleInClassLabel(e.roleInClass)}</div>`;
            }).join("")
          : `<p class="muted">${t("Not enrolled in anything yet.")}</p>`;
      } catch (err) {
        enrolmentsBody.innerHTML = `<p style="color:#9c3b2e;">${t("Couldn't load enrolments:")} ${err.code ?? ""} ${err.message}</p>`;
        console.error(err);
      }
    }

    personSelect.addEventListener("change", () => { refreshOffers(); refreshEnrolments(); });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        whoEl.textContent = t("Not signed in.");
        signInBtn.style.display = "inline-block";
        signOutBtn.style.display = "none";
        appEl.style.display = "none";
        return;
      }
      whoEl.textContent = t("Signed in as {email}", { email: user.email });
      signInBtn.style.display = "none";
      signOutBtn.style.display = "inline-block";

      async function step(name, fn) {
        try { return await fn(); }
        catch (err) { err.stepName = err.stepName ?? name; throw err; }
      }

      try {
        const userIndexSnap = await step("read your userIndex", () => getDoc(doc(db, TENANT.USER_INDEX, user.uid)));
        const defaultTenantId = userIndexSnap.exists() ? userIndexSnap.data().defaultTenantId : null;

        const context = await step("initialize active context", () => initializeActiveContext(db, user.uid, defaultTenantId));
        if (!context) {
          whoEl.innerHTML += noAccountMessageHtml();
          return;
        }
        activeTenantId = context.tenantId;

        myMemberships = await step("load your memberships", () => getMyMemberships(db, user.uid));
        tenantSelect.innerHTML = myMemberships
          .map((m) => `<option value="${m.tenantId}" ${m.tenantId === activeTenantId ? "selected" : ""}>${m.tenantName} (${roleListLabel(m.roles)})</option>`)
          .join("");

        appEl.style.display = "block";
        await step("load context data", loadContextData);
      } catch (err) {
        whoEl.textContent += ` — failed at "${err.stepName ?? "unknown step"}": ${err.code ?? ""} ${err.message}`;
        console.error(err);
      }
    });

    tenantSelect.addEventListener("change", async () => {
      const chosen = myMemberships.find((m) => m.tenantId === tenantSelect.value);
      if (!chosen) return;
      activeTenantId = chosen.tenantId;
      setActiveContext({ tenantId: chosen.tenantId, personId: chosen.personId, roles: chosen.roles, viewAsRole: null });
      await loadContextData();
    });
  </script>
</body>
</html>
