<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuranRevival — full source bundle</title>
<style>
  :root {
    --navy: #1B2A41;
    --gold: #A4823A;
    --bg: #ffffff;
    --bg-alt: #f5f6f8;
    --bg-sunk: #eceef2;
    --fg: #1B2A41;
    --fg-dim: #5a6a7d;
    --line: #d8dde5;
    --sel: #fdf3dd;
    --hit: #fff2b8;
    --code-fg: #1d2733;
  }
  html[data-theme="dark"] {
    --bg: #10161f;
    --bg-alt: #161e2a;
    --bg-sunk: #0b1017;
    --fg: #e6ecf3;
    --fg-dim: #93a2b5;
    --line: #263243;
    --sel: #2a2413;
    --hit: #4a3d12;
    --code-fg: #dbe4ef;
    --navy: #e6ecf3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  header {
    flex: 0 0 auto;
    background: var(--navy);
    color: #fff;
    padding: 0.6rem 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  html[data-theme="dark"] header { background: var(--bg-alt); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.01em; }
  .badge {
    background: var(--gold); color: #1B2A41; font-weight: 700;
    border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.78rem;
  }
  .facts { color: #c8d2de; font-size: 0.8rem; margin-left: auto; }
  html[data-theme="dark"] .facts { color: var(--fg-dim); }
  header button {
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px; padding: 0.32rem 0.7rem; font: inherit; font-size: 0.82rem; cursor: pointer;
    min-height: 36px;
  }
  html[data-theme="dark"] header button { background: var(--bg-sunk); color: var(--fg); border-color: var(--line); }
  header button:hover { background: rgba(255,255,255,0.22); }
  html[data-theme="dark"] header button:hover { background: var(--line); }

  /* ---------- layout ---------- */
  .layout { flex: 1 1 auto; display: flex; min-height: 0; }
  aside {
    flex: 0 0 300px; width: 300px; border-right: 1px solid var(--line);
    background: var(--bg-alt); display: flex; flex-direction: column; min-height: 0;
  }
  .searchbox { padding: 0.6rem; border-bottom: 1px solid var(--line); }
  .searchbox input {
    width: 100%; padding: 0.45rem 0.6rem; font: inherit; font-size: 0.9rem;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg);
  }
  .searchbox input:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
  .searchnote { font-size: 0.75rem; color: var(--fg-dim); margin-top: 0.35rem; min-height: 1em; }
  .tree { flex: 1 1 auto; overflow-y: auto; padding: 0.4rem 0 1.5rem; }
  .group {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--fg-dim); padding: 0.7rem 0.75rem 0.25rem; font-weight: 700;
  }
  .file {
    display: flex; gap: 0.5rem; align-items: baseline; width: 100%; text-align: left;
    padding: 0.28rem 0.75rem; border: 0; background: none; font: inherit; font-size: 0.85rem;
    color: var(--fg); cursor: pointer; border-left: 3px solid transparent;
  }
  .file:hover { background: var(--bg-sunk); }
  .file[aria-current="true"] { background: var(--sel); border-left-color: var(--gold); font-weight: 600; }
  .file .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .ln { flex: 0 0 auto; color: var(--fg-dim); font-size: 0.75rem; font-variant-numeric: tabular-nums; }

  .hit {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    padding: 0.3rem 0.75rem; font: inherit; font-size: 0.8rem; color: var(--fg); cursor: pointer;
    border-left: 3px solid transparent;
  }
  .hit:hover { background: var(--bg-sunk); border-left-color: var(--gold); }
  .hit .where { color: var(--gold); font-weight: 600; font-size: 0.75rem; }
  .hit .text {
    display: block; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.75rem; color: var(--fg-dim); white-space: pre; overflow: hidden; text-overflow: ellipsis;
  }
  .hit mark { background: var(--hit); color: inherit; }

  main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .filebar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--line); background: var(--bg-alt);
  }
  /* A class that sets `display` outranks the UA's [hidden] rule, so say it again
     here -- otherwise the empty file bar shows before any file is chosen. */
  .filebar[hidden] { display: none; }
  .filebar .path {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .filebar .meta { color: var(--fg-dim); font-size: 0.78rem; }
  .filebar .spacer { flex: 1 1 auto; }
  .filebar button {
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 0.3rem 0.6rem; font: inherit; font-size: 0.8rem; cursor: pointer;
  }
  .filebar button:hover { border-color: var(--gold); color: var(--gold); }

  .pane { flex: 1 1 auto; overflow: auto; background: var(--bg); position: relative; }
  .codewrap { display: flex; align-items: flex-start; min-height: 100%; position: relative; }
  pre.gutter, pre.code {
    margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 13px; line-height: 20px; tab-size: 2; white-space: pre;
  }
  pre.gutter {
    flex: 0 0 auto; padding: 12px 10px 40vh; text-align: right; color: var(--fg-dim);
    background: var(--bg-sunk); border-right: 1px solid var(--line);
    user-select: none; position: sticky; left: 0; z-index: 2; font-variant-numeric: tabular-nums;
  }
  pre.code { flex: 1 1 auto; padding: 12px 14px 40vh; color: var(--code-fg); }
  .rowmark {
    position: absolute; left: 0; right: 0; height: 20px; background: var(--hit);
    opacity: 0.55; pointer-events: none; z-index: 0;
  }

  .intro { padding: 1.6rem 1.8rem 3rem; max-width: 56rem; overflow-y: auto; }
  .intro h1 { font-size: 1.35rem; margin: 0 0 0.3rem; }
  .intro h2 { font-size: 1rem; margin: 1.6rem 0 0.4rem; color: var(--gold); }
  .intro p, .intro li { color: var(--fg); font-size: 0.94rem; }
  .intro .lede { color: var(--fg-dim); }
  .intro code {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.86em;
    background: var(--bg-sunk); padding: 0.08em 0.35em; border-radius: 4px;
  }
  .intro table { border-collapse: collapse; margin: 0.5rem 0 0; font-size: 0.88rem; }
  .intro td, .intro th { border: 1px solid var(--line); padding: 0.3rem 0.6rem; text-align: left; }
  .intro th { background: var(--bg-alt); }
  .note {
    border-left: 3px solid var(--gold); background: var(--bg-alt);
    padding: 0.6rem 0.9rem; margin: 1rem 0; font-size: 0.9rem;
  }

  .toast {
    position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: #fff; padding: 0.55rem 1.1rem; border-radius: 999px;
    font-size: 0.85rem; z-index: 50; opacity: 0; transition: opacity 0.18s; pointer-events: none;
  }
  html[data-theme="dark"] .toast { background: var(--gold); color: #10161f; }
  .toast.on { opacity: 1; }

  #drawerBtn { display: none; }
  @media (max-width: 880px) {
    #drawerBtn { display: inline-block; min-height: 40px; padding-left: 0.8rem; padding-right: 0.8rem; }
    aside {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; width: 82vw; max-width: 320px;
      transform: translateX(-102%); transition: transform 0.2s; box-shadow: 0 0 30px rgba(0,0,0,0.3);
    }
    body.drawer aside { transform: none; }
    .facts { display: none; }
  }
</style>
</head>
<body>

<header>
  <button id="drawerBtn" type="button" aria-label="Show file list">☰ Files</button>
  <span class="brand">QuranRevival — full source</span>
  <span class="badge" id="verBadge">v—</span>
  <button id="copyAllBtn" type="button">Copy everything</button>
  <button id="dlBtn" type="button">Download .txt</button>
  <button id="themeBtn" type="button">Dark</button>
  <span class="facts" id="facts"></span>
</header>

<div class="layout">
  <aside>
    <div class="searchbox">
      <input id="q" type="search" placeholder="Search all files…" autocomplete="off" spellcheck="false" />
      <div class="searchnote" id="qnote"></div>
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <main>
    <div class="filebar" id="filebar" hidden>
      <span class="path" id="fpath"></span>
      <span class="meta" id="fmeta"></span>
      <span class="spacer"></span>
      <button id="copyFileBtn" type="button">Copy this file</button>
    </div>
    <div class="pane" id="pane">
      <div class="intro" id="intro"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="application/json" id="srcdata">__SOURCE_JSON__</script>
<script type="application/json" id="metadata">__META_JSON__</script>
<script>
(function () {
  "use strict";

  var FILES = JSON.parse(document.getElementById("srcdata").textContent);
  var META  = JSON.parse(document.getElementById("metadata").textContent);
  var byPath = {};
  FILES.forEach(function (f) { byPath[f.path] = f; });

  var LINE_H = 20;
  var current = null;
  var linesCache = {};

  function lines(f) {
    if (!linesCache[f.path]) linesCache[f.path] = f.code.split("\n");
    return linesCache[f.path];
  }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function kb(n) { return n < 1024 ? n + " B" : (n / 1024).toFixed(n < 102400 ? 1 : 0) + " KB"; }

  /* ---------- header facts ---------- */
  document.getElementById("verBadge").textContent = "v" + META.appVersion;
  document.getElementById("facts").textContent =
    META.fileCount + " files · " + fmt(META.lineCount) + " lines · " +
    kb(META.byteCount) + " · commit " + META.commit + " · " + META.generated;
  document.title = "QuranRevival v" + META.appVersion + " — full source bundle";

  /* ---------- intro ---------- */
  document.getElementById("intro").innerHTML = META.introHtml;

  /* ---------- file tree ---------- */
  var tree = document.getElementById("tree");
  function buildTree() {
    tree.textContent = "";
    META.groups.forEach(function (g) {
      var h = document.createElement("div");
      h.className = "group";
      h.textContent = g.label + " (" + g.paths.length + ")";
      tree.appendChild(h);
      g.paths.forEach(function (p) {
        var f = byPath[p];
        var b = document.createElement("button");
        b.type = "button";
        b.className = "file";
        b.dataset.path = p;
        var nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = f.name;
        var ln = document.createElement("span");
        ln.className = "ln";
        ln.textContent = fmt(f.lines);
        b.appendChild(nm);
        b.appendChild(ln);
        b.addEventListener("click", function () { open(p); closeDrawer(); });
        tree.appendChild(b);
      });
    });
  }

  function markCurrent(path) {
    var all = tree.querySelectorAll(".file");
    for (var i = 0; i < all.length; i++) {
      if (all[i].dataset.path === path) all[i].setAttribute("aria-current", "true");
      else all[i].removeAttribute("aria-current");
    }
  }

  /* ---------- open a file ---------- */
  var pane = document.getElementById("pane");
  function open(path, line) {
    var f = byPath[path];
    if (!f) return;
    current = f;

    document.getElementById("filebar").hidden = false;
    document.getElementById("fpath").textContent = f.path;
    document.getElementById("fmeta").textContent = fmt(f.lines) + " lines · " + kb(f.bytes);

    var nums = [];
    for (var i = 1; i <= f.lines; i++) nums.push(i);

    pane.textContent = "";
    var wrap = document.createElement("div");
    wrap.className = "codewrap";
    var gut = document.createElement("pre");
    gut.className = "gutter";
    gut.textContent = nums.join("\n");
    var code = document.createElement("pre");
    code.className = "code";
    code.textContent = f.code;
    wrap.appendChild(gut);
    wrap.appendChild(code);
    pane.appendChild(wrap);

    markCurrent(path);
    if (location.hash.slice(1) !== path + (line ? ":L" + line : "")) {
      history.replaceState(null, "", "#" + path + (line ? ":L" + line : ""));
    }

    if (line) gotoLine(line);
    else pane.scrollTop = 0;
  }

  function gotoLine(line) {
    var wrap = pane.querySelector(".codewrap");
    if (!wrap) return;
    var old = wrap.querySelector(".rowmark");
    if (old) old.remove();
    var mark = document.createElement("div");
    mark.className = "rowmark";
    mark.style.top = (12 + (line - 1) * LINE_H) + "px";
    wrap.insertBefore(mark, wrap.firstChild);
    pane.scrollTop = Math.max(0, 12 + (line - 1) * LINE_H - pane.clientHeight / 3);
    pane.scrollLeft = 0;
  }

  /* ---------- search ---------- */
  var q = document.getElementById("q");
  var qnote = document.getElementById("qnote");
  var MAX_HITS = 300;
  var timer = null;

  q.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(runSearch, 140);
  });

  function runSearch() {
    var term = q.value;
    if (term.trim().length < 2) { qnote.textContent = ""; buildTree(); if (current) markCurrent(current.path); return; }
    var needle = term.toLowerCase();
    var hits = [];
    var total = 0;
    for (var i = 0; i < FILES.length; i++) {
      var f = FILES[i];
      if (f.code.toLowerCase().indexOf(needle) === -1) continue;
      var ls = lines(f);
      for (var j = 0; j < ls.length; j++) {
        var pos = ls[j].toLowerCase().indexOf(needle);
        if (pos === -1) continue;
        total++;
        if (hits.length < MAX_HITS) hits.push({ path: f.path, line: j + 1, text: ls[j], pos: pos });
      }
    }
    renderHits(hits, total, term.length);
  }

  function renderHits(hits, total, len) {
    tree.textContent = "";
    qnote.textContent = total === 0
      ? "No matches."
      : fmt(total) + " match" + (total === 1 ? "" : "es") +
        (total > hits.length ? " — showing first " + hits.length : "");
    hits.forEach(function (h) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "hit";
      var w = document.createElement("span");
      w.className = "where";
      w.textContent = h.path + " : " + h.line;
      var t = document.createElement("span");
      t.className = "text";
      var raw = h.text;
      var from = Math.max(0, h.pos - 24);
      var before = (from > 0 ? "…" : "") + raw.slice(from, h.pos);
      t.appendChild(document.createTextNode(before.replace(/^\s+/, "")));
      var m = document.createElement("mark");
      m.textContent = raw.substr(h.pos, len);
      t.appendChild(m);
      t.appendChild(document.createTextNode(raw.slice(h.pos + len, h.pos + len + 60)));
      b.appendChild(w);
      b.appendChild(t);
      b.addEventListener("click", function () { open(h.path, h.line); closeDrawer(); });
      tree.appendChild(b);
    });
  }

  /* ---------- copy / download ---------- */
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("on");
    setTimeout(function () { el.classList.remove("on"); }, 1700);
  }

  function copyText(text, okMsg) {
    var done = function () { toast(okMsg); };
    var fallback = function () {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove();
      toast(ok ? okMsg : "Copy blocked by the browser — use Download .txt instead");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  function everything() {
    var out = [
      "QuranRevival v" + META.appVersion + " — full application source",
      "Commit " + META.commit + " · generated " + META.generated,
      META.fileCount + " files, " + fmt(META.lineCount) + " lines",
      ""
    ];
    FILES.forEach(function (f) {
      out.push("");
      out.push("================================================================");
      out.push("FILE: " + f.path + "  (" + f.lines + " lines)");
      out.push("================================================================");
      out.push(f.code);
    });
    return out.join("\n");
  }

  document.getElementById("copyFileBtn").addEventListener("click", function () {
    if (current) copyText(current.code, "Copied " + current.name);
  });
  document.getElementById("copyAllBtn").addEventListener("click", function () {
    copyText(everything(), "Copied all " + META.fileCount + " files");
  });
  document.getElementById("dlBtn").addEventListener("click", function () {
    var blob = new Blob([everything()], { type: "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "quranrevival-v" + META.appVersion + "-source.txt";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });

  /* ---------- theme ---------- */
  var themeBtn = document.getElementById("themeBtn");
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = t === "dark" ? "Light" : "Dark";
    try { localStorage.setItem("qr-src-theme", t); } catch (e) {}
  }
  themeBtn.addEventListener("click", function () {
    setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
  var saved = null;
  try { saved = localStorage.getItem("qr-src-theme"); } catch (e) {}
  setTheme(saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  /* ---------- drawer ---------- */
  function closeDrawer() { document.body.classList.remove("drawer"); }
  document.getElementById("drawerBtn").addEventListener("click", function () {
    document.body.classList.toggle("drawer");
  });

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "f") { e.preventDefault(); q.focus(); q.select(); }
    if (e.key === "Escape") { closeDrawer(); }
  });

  /* ---------- deep links ---------- */
  function fromHash() {
    var h = decodeURIComponent(location.hash.slice(1));
    if (!h) return false;
    var m = h.match(/^(.*?)(?::L(\d+))?$/);
    if (!m || !byPath[m[1]]) return false;
    open(m[1], m[2] ? parseInt(m[2], 10) : 0);
    return true;
  }
  window.addEventListener("hashchange", fromHash);

  /* ---------- boot ---------- */
  buildTree();
  fromHash();
})();
</script>
</body>
</html>
